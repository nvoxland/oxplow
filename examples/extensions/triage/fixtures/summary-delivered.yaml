# The job runs in the throwaway host; the event it logs when it ends
# reaches `publish-summary` (running there too), which writes the model's
# answer to the `triage-summary` page.
when:
  job: summarize
  intentKey: summary-2
  request:
    schemaVersion: 1
    role: summarize
    messages:
      - { role: user, parts: [{ type: text, text: "Summarize the TODO comments in two lines." }] }
expect:
  state: succeeded
  effects:
    - { id: triage/publish-summary, state: ok }
  commands: [oxplow.knowledge.write_page]
  pages: ["oxplow:oxplow/wiki?slug=triage-summary"]
model:
  replies: ["One bug TODO and two cleanups."]
