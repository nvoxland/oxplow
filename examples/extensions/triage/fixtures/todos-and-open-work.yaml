# The collector asks a model (`permissions.ai`); `extension test` runs it
# in its throwaway and the fixture model answers.
when:
  collector: todos
  files:
    src/lib.rs: "// TODO: the cache never expires\nfn a() {}\n"
expect:
  facts:
    - { measure: triage.open_items }
    - { measure: triage.todos, path: src/lib.rs, line: 1, rule: bug }
model:
  replies: ['{"answers": {"label": {"type": "choice", "choice": "bug"}}}']
