# The board runs its extension's commands: a decision is recorded in the
# extension's state and read back.
when:
  component: todo-board
  invokes:
    - { command: triage.todos.decide, input: { path: src/lib.rs, line: 1, decision: fix-now } }
    - { command: triage.todos.decisions }
expect:
  invokes:
    - { ok: true }
    - { ok: true, result: { result: { decisions: { "src/lib.rs:1": fix-now } } } }
