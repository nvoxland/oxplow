# The model calls the `todos.in_file` tool before it answers: the call, the
# tool's answer and the reply are the job's output, in order.
input:
  job: summarize
  intentKey: summary-evidence
  request:
    schemaVersion: 1
    role: summarize
    messages:
      - { role: user, parts: [{ type: text, text: "Summarize the TODO comments; look closer at src/lib.rs." }] }
  model:
    replies:
      - { toolCalls: [{ name: todos_in_file, arguments: { path: src/lib.rs } }] }
      - "src/lib.rs has no TODOs left."
expect:
  state: succeeded
  toolCalls: 1
  text: "src/lib.rs has no TODOs left."
  output:
    - { kind: tool_call }
    - { kind: usage }
    - { kind: tool_result }
    - { kind: text }
    - { kind: usage }
