# Cancelled while the model writes: the job stops at once and keeps what
# it had written.
input:
  job: summarize
  intentKey: summary-cancelled
  cancel: true
  request:
    schemaVersion: 1
    role: summarize
    messages:
      - { role: user, parts: [{ type: text, text: "Summarize the TODO comments at length." }] }
  model:
    replies:
      - { text: "One bug TODO in the parser, two cleanups in the tests, and a feature request for a faster index.", chunkDelayMs: 100 }
expect:
  state: cancelled
  result: { stopped: cancelled }
