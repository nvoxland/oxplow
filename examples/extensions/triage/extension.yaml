manifest: 2
name: triage
description: Sorts the code's TODO comments into bugs, cleanup and features, next to how much open work there is.
sharing: shared
engine: ">=0.7"
version: 0.1.0
intent:
  purpose: >-
    Shows what the TODO comments in the code are asking for. Each TODO is
    classified by a model as a bug, cleanup or a feature, and the count of
    open work items is kept beside them, so a growing pile of bug TODOs
    against a short work list stands out.
  origin: null
  examples:
    - name: summary-published
      input: { job: summarize }
      expect: the job succeeds with the model's answer
    - name: summary-with-evidence
      input: { job: summarize }
      expect: the model looks closer at src/lib.rs, then answers; both are the job's output
    - name: summary-cancelled
      input: { job: summarize }
      expect: cancelled while it streams, the job ends cancelled with what it had written
    - name: summary-delivered
      input: { job: summarize }
      expect: the job succeeds, its completion reaches publish-summary, and the triage-summary page is written
    - name: summary-to-the-wiki
      input: { event: contribution.job.completed }
      expect: publish-summary writes the triage-summary page
    - name: todo-board
      input: { component: todo-board }
      expect: the board reads its lens
    - name: todos-and-open-work
      input: { collector: todos }
      expect: one open-items fact and one TODO fact for src/lib.rs line 1, classified
    - name: an-older-snapshot-event
      input: { collector: todos, event: { type: snapshot.taken, v: 1 } }
      expect: the same facts; the script reads the tree, not the event
measures:
  - key: triage.todos
    title: TODO comments
    unit: comments
    subjectKind: file
    temporalSemantics: non-additive
    captureScope: per-path
  - key: triage.open_items
    title: Open work items
    unit: items
    temporalSemantics: non-additive
metrics:
  # The TODOs counted; each one located, so the board and the drill-in
  # list them (`metric_findings('triage.todos')`).
  - key: triage.todos
    title: TODO comments
    sourceMeasure: triage.todos
    aggregation: sum
    direction: lower-better
    unit: comments
    displayKind: findings
collectors:
  # On each snapshot: its tree (a fact collector reads it without asking),
  # the open work items (`sql.read`) and a model for each TODO
  # (`ai.compute`, which a person approves in Settings → Data).
  - id: todos
    runtime: starlark
    entry: collectors/todos.star
    trigger: { on: [snapshot.taken] }
    needs: [sql.read, ai.compute]
    facts: [triage.todos, triage.open_items]
# A person asks for a summary of the TODOs (`triage.summary.ask`); a model
# answers it as a durable job, outside any transaction, once a person has
# approved the job. Its answer streams into `v_job_output` as it comes; it
# may look closer at a file (`todos.in_file`) or query oxplow's models
# (`query_sql`, from `sql.read`) before it answers. When it finishes,
# `publish-summary` writes the answer to the wiki.
jobs:
  - id: summarize
    description: Summarize the code's TODO comments for a person.
    version: 1
    operation: ai.complete_typed
    needs: [ai.compute, sql.read]
    tools: [todos.in_file]
    max_tool_rounds: 4
    timeout: 120
commands:
  - name: summary.ask
    summary: Ask a model to summarize the TODO comments; returns the job.
    scope: jobs.write
    op: enqueue
    invokers: { human: true, agent: true, lens: true }
  - name: summary.result
    summary: A summary job's state, what it has written so far and, once it ends, its answer.
    scope: jobs.read
    op: snapshot
    invokers: { human: true, agent: true, lens: true }
  - name: summary.cancel
    summary: Stop a summary job; it keeps what it had written.
    scope: jobs.write
    op: cancel
    invokers: { human: true, agent: true, lens: true }
  # A tool for the summary's model, never a person's command: it only reads.
  - name: todos.in_file
    summary: The TODO comments in one file, with the line of each and what it asks for (bug, cleanup or feature).
    entry: commands/todos_in_file.star
    needs: [sql.read]
    input_schema: { type: object, required: [path], properties: { path: { type: string, description: "A repo-relative file." } }, additionalProperties: false }
    access: read
    invokers: { human: false, agent: false, lens: false, job: true }
effects:
  - id: publish-summary
    summary: When a summary job succeeds, write its answer to the wiki page `triage-summary`.
    on: [contribution.job.completed]
    entry: effects/publish_summary.star
    needs: [jobs.read]
# The TODOs as a board, grouped by what the model said they ask for. It
# only shows and reads, so it isn't a program to approve.
custom_components:
  - id: todo-board
    title: TODO board
    assets: [todos]
