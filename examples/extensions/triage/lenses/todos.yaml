title: TODOs
description: The TODO comments in the code, each with what a model said it asks for (a bug, cleanup or a feature).
query: |
  SELECT path, line, rule AS kind
  FROM metric_findings('triage.todos')
  ORDER BY rule, path, line
launcher: { category: Code }
actions:
  # The kit's way to the same decision: a form beside each row, its file
  # and line kept as the row's.
  - id: decide
    label: Decide…
    command: triage.todos.decide
    row: true
    form: true
    fixed: [path, line]
    input: { path: "{{row.path}}", line: "{{row.line}}", decision: keep }
