manifest: 2
name: note-tracker
description: Tasks kept as markdown notes in the notes/ folder of the project.
engine: ">=0.7"
version: 0.2.0
requires: [oxplow-bundled]
intent:
  purpose: >-
    Show a task store over files. A collector reads notes/*.md at start and
    follows changes with a files trigger, and states each note as a row of the
    shared task model. A note's workflow is its own (jotted, working,
    settled), declared in `fills:` with the bucket each stage is in. A command
    at the New Task point writes a new note file.
  origin: null
  examples:
    - name: start-reconciles-two-notes-into-two-tasks
      input: { collector: note_tracker/notes, trigger: start }
      expect: one task per note, in the stage its file says
permissions: [files.read, files.write, 'commands:oxplow.extension_files.write']
files:
  - { path: notes, access: write }
fills:
  - model: oxplow/task_record
    stores: [notes]
    id_pattern: "note-[a-z0-9-]+"
    stages:
      - { id: jotted, title: Jotted, bucket: todo }
      - { id: working, title: Working, bucket: in_progress }
      - { id: settled, title: Settled, bucket: done }
collectors:
  - id: notes
    doc: Reads notes/*.md and states the tasks of the notes store.
    runtime: starlark
    entry: collectors/notes.star
    needs: [files.read]
    on: [start, { files: "notes/*.md" }]
commands:
  - name: note.new
    summary: Write a new note file in notes/. The collector then adds the task.
    input_schema:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1 }
        body: { type: string }
      additionalProperties: false
    entry: handlers/new_note.star
    access: write
    ui: { label: "New Task (note)", at: oxplow/task.new }
    example: { title: Buy milk, body: Two litres. }
