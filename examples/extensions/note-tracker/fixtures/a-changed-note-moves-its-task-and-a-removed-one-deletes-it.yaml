# Editing a note's stage line moves its task; removing the file deletes it.
requires: [oxplow-bundled]
given:
  - files:
      "notes/note-buy-milk.md": "# Buy milk"
      "notes/note-call-ann.md": "# Call Ann"
when: { collector: note_tracker/notes, trigger: start }
expect: { ok: true }
steps:
  - given:
      - { files: { "notes/note-buy-milk.md": "# Buy milk\nstage: settled" } }
  - when:
      collector: note_tracker/notes
      trigger: { files: [{ path: "notes/note-buy-milk.md", op: modified }] }
    expect: { ok: true }
  - when: { sql: "SELECT id, state, stage FROM v_oxplow_task_record ORDER BY id" }
    expect: { rows: [{ id: note-buy-milk, state: done, stage: settled }, { id: note-call-ann, state: todo, stage: jotted }] }
  - given:
      - { remove_files: ["notes/note-call-ann.md"] }
  - when:
      collector: note_tracker/notes
      trigger: { files: [{ path: "notes/note-call-ann.md", op: removed }] }
    expect: { ok: true }
  - when: { sql: "SELECT id FROM v_oxplow_task_record" }
    expect: { rows: [{ id: note-buy-milk }] }
