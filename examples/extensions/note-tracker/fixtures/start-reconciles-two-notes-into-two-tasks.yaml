# Each note file is a task of the notes store, in the stage its file says
# (jotted when it says none), with its bucket as the task's state.
requires: [oxplow-bundled]
given:
  - files:
      "notes/note-buy-milk.md": "# Buy milk\nstage: working\n\nTwo litres."
      "notes/note-call-ann.md": "# Call Ann"
when: { collector: note_tracker/notes, trigger: start }
expect: { ok: true }
steps:
  - when: { sql: "SELECT id, title, state, stage, stage_title, body, store FROM v_oxplow_task_record ORDER BY id" }
    expect:
      rows:
        - { id: note-buy-milk, title: Buy milk, state: in_progress, stage: working, stage_title: Working, body: Two litres., store: notes }
        - { id: note-call-ann, title: Call Ann, state: todo, stage: jotted, stage_title: Jotted, body: "", store: notes }
  # The read contract shows them like any store's.
  - when: { sql: "SELECT native_id, provider, title, state FROM v_oxplow_task ORDER BY native_id" }
    expect:
      rows:
        - { native_id: note-buy-milk, provider: notes, title: Buy milk, state: in_progress }
        - { native_id: note-call-ann, provider: notes, title: Call Ann, state: todo }
