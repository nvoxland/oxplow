title: Edit item
description: A work item's title and body in a plain form. It stands in for oxplow's editor; the rail beside it stays oxplow's.
hidden: true
params:
  - { name: uri, label: Work item }
query: |
  SELECT title, body FROM v_work_item WHERE uri = :uri
viz: form
form:
  command: oxplow.work_item.update
  # It edits what is saved: Save when changed, Discard puts it back.
  mode: edit
  defaults: { uri: "{{param.uri}}" }
  fixed: [uri]
  fields: [title, body]
