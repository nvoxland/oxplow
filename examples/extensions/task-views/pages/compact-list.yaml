title: Compact list
description: The work items as a plain table, with Done and Edit… on each row. It stands in for oxplow's Tasks list.
hidden: true
params:
- name: scope
  role: filter
  label: Scope (thread / stream / all)
  default: all
- name: thread_id
  label: Thread
- name: stream_id
  label: Stream
loaders:
  compact_list:
    sql: |
      SELECT w.uri, w.title, w.state, w.updated_at
      FROM v_work_item w
      WHERE :scope = 'all'
         OR (:scope = 'thread' AND w.thread_id = :thread_id)
         OR (:scope = 'stream' AND w.thread_id IN (SELECT t.id FROM v_thread t WHERE t.stream_id = :stream_id))
      ORDER BY w.updated_at DESC
view:
  from: compact_list
  viz: table
  columns:
  - key: title
    label: Title
    link:
      kind: page
      from: uri
  - key: state
    label: State
  - key: updated_at
    label: Updated
  empty: No work items here.
  actions:
  - id: done
    label: Done
    command: oxplow.work_item.transition
    input:
      uri: '{{row.uri}}'
      to: done
    row: true
  - id: edit
    label: Edit…
    command: oxplow.work_item.update
    input:
      uri: '{{row.uri}}'
      title: '{{row.title}}'
    row: true
    form: true
    fixed:
    - uri
