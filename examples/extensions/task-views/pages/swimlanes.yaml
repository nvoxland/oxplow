title: Swimlanes
description: The work items as a column per state; drag a card to move it, click its title to rename it. It stands in for oxplow's Board.
hidden: true
params:
- name: scope
  role: filter
  label: Scope (thread / backlog / all)
  default: all
- name: thread_id
  label: Thread
loaders:
  swimlanes:
    sql: |
      SELECT w.uri, w.title, w.state, w.rank
      FROM v_work_item w
      WHERE :scope = 'all'
         OR (:scope = 'thread' AND w.thread_id = :thread_id)
         OR (:scope = 'backlog' AND w.thread_id IS NULL)
      ORDER BY w.state, w.rank
  # What the active work-items provider can do (`ordering` lets a card be
  # dragged within its column). The component reads it beside the cards.
  features:
    sql: |
      SELECT features FROM v_capability_provider WHERE capability = 'work_items' AND active = 1
view:
  from: swimlanes
  viz: custom
  custom:
    component: swimlanes
  empty: No work items.
