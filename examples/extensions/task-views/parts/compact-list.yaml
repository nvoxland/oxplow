title: Compact list
description: The tasks as a plain table, with Done and Edit… on each row. It stands in for oxplow's Tasks list.
params:
- name: scope
  role: filter
  label: Scope (thread / stream / all / backlog)
  default: all
- name: thread_id
  label: Thread
- name: stream_id
  label: Stream
loaders:
  compact_list:
    sql: |
      SELECT w.uri, w.native_id AS id, w.title, w.state, w.updated_at
      FROM v_oxplow_task w
      WHERE :scope = 'all'
         OR (:scope = 'thread' AND w.assignee = uri('oxplow/thread', 'id', 'thr' || :thread_id))
         OR (:scope = 'stream' AND w.assignee IN (SELECT t.uri FROM v_thread t WHERE t.stream_id = :stream_id))
         OR (:scope = 'me' AND w.assignee = uri('oxplow/person'))
         OR (:scope = 'pool' AND w.assignee IS NULL)
      ORDER BY w.updated_at DESC
view:
  from: compact_list
  viz: table
  columns:
  - key: title
    label: Title
    link:
      kind: page
      from: uri
  - key: state
    label: State
  - key: updated_at
    label: Updated
  empty: No tasks here.
  actions:
  - id: done
    label: Done
    point: oxplow/task.move
    context:
      uri: '{{row.uri}}'
      stage: done
    row: true
