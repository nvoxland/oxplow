title: Edit item
description: A task's title and body in a plain form. It stands in for oxplow's editor; the rail beside it stays oxplow's.
params:
- name: uri
  label: Task
loaders:
  edit_item:
    sql: |
      SELECT native_id AS id, title, body FROM v_oxplow_task WHERE uri = :uri
view:
  from: edit_item
  viz: form
  form:
    command: oxtask.task.update
    mode: edit
    fields:
    - title
    - body
