title: Swimlanes
description: The work items as a column per state; drag a card to move it, click its title to rename it. It stands in for oxplow's Board.
params:
- name: scope
  role: filter
  label: Scope (thread / stream / backlog / all)
  default: all
- name: thread_id
  label: Thread
- name: stream_id
  label: Stream
loaders:
  swimlanes:
    sql: |
      SELECT w.uri, w.title, w.state, w.rank
      FROM v_work_item w
      WHERE :scope = 'all'
         OR (:scope = 'thread' AND w.assignee = uri('oxplow/thread', 'id', 'thr' || :thread_id))
         OR (:scope = 'stream' AND w.assignee IN (SELECT t.uri FROM v_thread t WHERE t.stream_id = :stream_id))
         OR (:scope = 'me' AND w.assignee = uri('oxplow/person'))
         OR (:scope = 'pool' AND w.assignee IS NULL)
      ORDER BY w.state, w.rank
view:
  from: swimlanes
  viz: custom
  custom:
    component: swimlanes
  empty: No work items.
