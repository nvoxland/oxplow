manifest: 2
name: task-views
description: Another way to see the work list — swimlanes for the Board, a compact list and a plain editor — over whichever work-items provider is active.
engine: ">=0.7"
version: 0.1.0
intent:
  purpose: >-
    Replace oxplow's Board, Tasks list and task editor with views of my own.
    They read v_work_item and change items only through the work-item
    interface commands, so they work with any work list.
  origin: null
  examples:
    - name: compact-list
      input: { page: compact-list, params: { scope: all } }
      expect: the work items as a table with title, state and updated
    - name: swimlanes-reads
      input: { page: swimlanes, params: { scope: all } }
      expect: the board's page reads its cards and the active provider's features
    - name: swimlanes-refuses-a-missing-item
      input: { component: swimlanes }
      expect: changing an item that isn't there is refused, with the command's reason
    - name: swimlanes-renames
      input: { component: swimlanes }
      expect: renaming an item through the board goes through
    - name: edit-item
      input: { page: edit-item, params: { uri: "oxplow:oxplow/work_item?id=1&provider=oxplow" } }
      expect: a form for the item's title and body, its uri fixed
    - name: swimlanes-drags-a-card-to-a-lane
      input: { page: swimlanes, params: { scope: all } }
      expect: five lanes; a drag moves the card's item to the lane's state
    - name: swimlanes-renames-a-card-through-its-title
      input: { page: swimlanes, params: { scope: all } }
      expect: an empty title is refused under the input, Escape puts it back and Enter saves a new one
permissions: [commands:oxplow.work_item.transition, commands:oxplow.work_item.reorder, commands:oxplow.work_item.update]
custom_components:
  - id: swimlanes
    title: Swimlanes
    commands: [oxplow.work_item.transition, oxplow.work_item.reorder, oxplow.work_item.update]
ui:
  replacements:
    - { target: work_item.board, page: swimlanes, version: 1 }
    - { target: work_item.list, page: compact-list, version: 1 }
    - { target: work_item.detail, page: edit-item, version: 1 }
