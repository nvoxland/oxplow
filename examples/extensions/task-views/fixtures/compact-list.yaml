# The list reads v_work_item; a fresh project has no items yet.
# (Oxplow's own work list, effort policy and wiki are bundled's.)
requires: [oxplow-bundled]
when:
  page: compact-list
  params: { scope: all }
expect:
  loaders:
    compact_list: { rows: 0, columns: [uri, title, state, updated_at] }
