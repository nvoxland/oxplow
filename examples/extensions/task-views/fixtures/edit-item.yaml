# The editor's page reads the item for its form; there is none in a fresh
# project. (The form itself, with its uri fixed, is checked in
# `crates/oxplow-sdk/tests/examples.rs`: a page's form isn't an example
# input yet.)
input:
  page: edit-item
  params: { uri: "oxplow:oxplow/work_item?id=1&provider=oxplow" }
expect:
  loaders:
    edit_item: { rows: 0, columns: [title, body] }
