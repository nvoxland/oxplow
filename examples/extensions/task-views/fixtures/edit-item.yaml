# The editor's form: the item's title and body, its id kept from its row.
requires: [oxtask]
given:
  - { command: oxtask.task.create, input: { title: Fix the parser, body: Soon, stage: ready } }
when:
  form: edit-item
  node: edit_item
  params: { uri: "oxplow:oxplow/task?id=tsk1&provider=oxtask" }
expect:
  values: { id: tsk1, title: Fix the parser }
  fields: [title, body]
