# Changing an item that is not there is refused, with the command's reason.
# (Oxplow's own work list, effort policy and wiki are bundled's.)
requires: [oxplow-bundled]
when:
  component: swimlanes
  invokes:
    - { command: oxplow.work_item.update, input: { uri: "oxplow:oxplow/work_item?id=1&provider=oxplow", title: x } }
expect:
  invokes:
    - { ok: false, refused: $any }
