# Renaming an item through the board goes through: the update answers
# with the item.
requires: [oxtask]
given:
  - { command: oxtask.task.create, input: { title: Fix the parser, stage: ready } }
when:
  component: swimlanes
  invokes:
    - { point: oxplow/task.edit, context: { uri: "oxplow:oxplow/task?id=tsk1&provider=oxtask", title: Fix the lexer } }
expect:
  invokes:
    - { ok: true, result: $any }
