# A card's title is its own form: Enter saves, an empty one is refused
# under the input, Escape puts the title back.
requires: [oxtask]
given:
  - { command: oxtask.task.create, input: { title: Card one, stage: ready } }
  - { command: oxplow.tasks.assign, input: { uri: "oxplow:oxplow/task?id=tsk1&provider=oxtask", to: "oxplow:oxplow/thread?id=thr1" } }
when: { part: swimlanes, params: { scope: all } }
steps:
  - ui:
      - click: ".card .title"
      - fill: { "input.ox-input": "" }
      - key: { on: "input.ox-input", key: Enter }
      - expect:
          visible: [".ox-error"]
          invoked: [{ point: oxplow/task.edit, ok: false }]
      - key: { on: "input.ox-input", key: Escape }
      - expect: { text: { ".card .title": Card one } }
      - click: ".card .title"
      - fill: { "input.ox-input": Card renamed }
      - key: { on: "input.ox-input", key: Enter }
      - expect:
          text: { ".card .title": Card renamed }
          invoked: [{ point: oxplow/task.edit, ok: false }, { point: oxplow/task.edit, ok: true }]
