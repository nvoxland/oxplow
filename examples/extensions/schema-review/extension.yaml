manifest: 2
name: schema-review
description: Counts the DDL statements in an agent's schema migrations and shows the migration files a request changed, with what each creates, alters and drops.
engine: ">=0.7"
version: 0.1.0
# Its collector reads the project's migration files.
permissions: [files.read]
intent:
  purpose: >-
    Know what a project's schema migrations do. It counts the DDL in each
    migration file (`CREATE TABLE`, `ALTER TABLE`, `DROP TABLE`) as facts
    sliced by statement kind, and a request's page lists the migration
    files it changed and how many tables each creates, alters and drops.
  origin: null
  examples:
    - name: ddl-counted
      input: { collector: ddl }
      expect: one fact per kind of statement in each migration file, none for other files
# What a migration file holds, per kind of statement.
measures:
  - key: schema_review.ddl
    title: DDL statements
    unit: statements
    subjectKind: file
    temporalSemantics: non-additive
    fold: sum
    captureScope: per-path
dimensions:
  - { key: schema_review.ddl_kind, label: DDL kind, valueType: categorical }
metrics:
  - key: schema_review.ddl
    title: DDL statements
    measure: schema_review.ddl
    expression: "SUM(value)"
    direction: lower-better
    unit: statements
    displayKind: findings
    sliceableDims: [schema_review.ddl_kind]
collectors:
  # On each snapshot: the migration files in its tree (a fact collector
  # reads it without asking). It runs no program and asks no model.
  - id: ddl
    runtime: starlark
    entry: collectors/ddl.star
    on: [snapshot.taken]
    facts: [schema_review.ddl]
ui:
  mounts:
    - { page: schema-changes, at: oxplow/diff-view.sections }
