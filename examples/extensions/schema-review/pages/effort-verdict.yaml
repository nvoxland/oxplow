title: Schema Verdict
description: This policy's verdict on an effort — accepted, or the changes it asks for and why.
hidden: true
params:
- name: effort_id
  label: Effort
loaders:
  effort_verdict:
    sql: |
      SELECT text, tone FROM (
        SELECT 0 AS ord,
               CASE verdict WHEN 'accepted' THEN 'Schema review: accepted'
                    ELSE 'Schema review: changes requested' END AS text,
               CASE verdict WHEN 'accepted' THEN 'success' ELSE 'danger' END AS tone
        FROM v_schema_review_verdict WHERE effort_id = :effort_id
        UNION ALL
        -- Each reason on its own line.
        SELECT 1, '• ' || trim(value), 'danger'
        FROM v_schema_review_verdict, json_each('["' || replace(reasons, '; ', '","') || '"]')
        WHERE effort_id = :effort_id AND reasons <> ''
        UNION ALL
        SELECT 0, 'Schema review: no migration changed', NULL
        WHERE NOT EXISTS (SELECT 1 FROM v_schema_review_verdict WHERE effort_id = :effort_id)
      )
      ORDER BY ord
view:
  from: effort_verdict
  viz: list
  columns:
  - key: text
    label: Verdict
    tone: tone
