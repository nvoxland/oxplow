title: Schema Changes
description: The migration files this request changed, and the DDL each holds.
params:
- name: request_id
  label: Request
loaders:
  schema_changes:
    sql: |
      SELECT ef.path,
             sum(CASE WHEN json_extract(t.dims_json, '$."schema_review.ddl_kind"') = 'create' THEN t.value ELSE 0 END) AS creates,
             sum(CASE WHEN json_extract(t.dims_json, '$."schema_review.ddl_kind"') = 'alter' THEN t.value ELSE 0 END) AS alters,
             sum(CASE WHEN json_extract(t.dims_json, '$."schema_review.ddl_kind"') = 'drop' THEN t.value ELSE 0 END) AS drops
      FROM (SELECT DISTINCT f.path
              FROM v_agent_turn at JOIN v_turn_file f ON f.turn_id = at.id
             WHERE at.request_id = :request_id AND f.confidence IN ('claimed', 'sole')) ef
      JOIN v_tree_fact t ON t.path = ef.path AND t.measure_key = 'schema_review.ddl'
      GROUP BY ef.path
      ORDER BY drops DESC, ef.path
view:
  from: schema_changes
  viz: table
  columns:
  - key: path
    label: Migration
    link:
      kind: file
      from: path
  - key: creates
    label: Created
  - key: alters
    label: Altered
  - key: drops
    label: Dropped
  empty: This request changed no migration.
