manifest: 2
name: github
description: Pull requests from this repo's GitHub, joined to work items and streams.
engine: ">=0.7"
version: 0.1.0
intent:
  purpose: >-
    Bring the repo's pull requests into the semantic layer as v_github_pr,
    joined to streams by branch and to work items by the item's id in the
    title, so pages can show what is open against each stream.
  origin: null
  examples:
    - name: prs-by-task
      input: { page: prs-by-task, params: { state: all } }
      expect: each PR's number, title and author, with the work item its title names
    - name: pr-link
      input: { wikilink: "pr:12" }
      expect: the pull request's URI, `oxplow:github/pr?id=12`
    - name: pr-lifetimes-draws-bars-filters-syncs-and-opens
      input: { page: pr-lifetimes }
      expect: a bar per readable pull request; the filters re-run the page, Sync runs the collector and a bar opens its pull request
    - name: settings-extensions-area-lists-health-and-credentials
      input: { page: oxplow-foundation/settings, params: { area: extensions } }
      expect: a collector disabled after failures says why; a declared credential is listed once, never its value
permissions:
  commands: [oxplow.collector.sync]
  network: [api.github.com]
  process: true
  secrets: [GITHUB_TOKEN]
collectors:
  - id: prs
    doc: The repo's 100 most recent pull requests (open and closed).
    runtime: exec
    entry: sync.sh
    trigger: { every: 15m }
    # Optional. Set GITHUB_TOKEN under this collector in Settings →
    # Extensions (it's stored in your keychain); without it the script
    # uses the `gh` CLI's own login.
    credentials: [GITHUB_TOKEN]
    env: [GITHUB_REPOSITORY]
    # The only host it talks to (curl and `gh api` both go through
    # api.github.com). On macOS nothing else is reachable.
    network: [api.github.com]
    entities:
      - name: pr
        doc: One GitHub pull request.
        key: number
        columns:
          number: { type: int, doc: PR number }
          title: text
          body: { type: text, doc: Its description }
          state: { type: text, doc: "`open` or `closed`" }
          author: { type: text, doc: GitHub login of the author }
          head_branch: { type: text, doc: Branch the PR is from }
          draft: bool
          opened_at: time
          merged_at: { type: time, doc: "When it was merged; NULL if not merged" }
          url: text
        relations:
          - { to: v_stream, on: "v_github_pr.head_branch = v_stream.branch" }
          - { to: v_work_item, on: "v_github_pr.title LIKE '%' || v_work_item.native_id || '%'" }
models:
  - name: pull_request
    version: 2
    key: [uri]
    description: "Each synced pull request as a URI oxplow can name (`oxplow:github/pr?id=<number>`): its title, which a link to it shows, and its description, which search finds."
    columns:
      - { name: uri, type: TEXT, doc: "`oxplow:github/pr?id=<number>`." }
      - { name: title, type: TEXT, doc: "Its title." }
      - { name: body, type: TEXT, doc: "Its description ('' for none)." }
# Each pull request's lifetime as a bar from opened to merged — a range the
# kit's charts don't draw, so the `pr-lifetimes` page renders this bundle.
# It sets that page's `state` filter and runs the `prs` sync; it runs the
# sync with your rights, under the permissions declared above (approved
# when the extension was deployed).
custom_components:
  - id: pr-lifetimes
    title: PR lifetimes
    commands: [oxplow.collector.sync]
# A pull request is a resource a URI can name: `oxplow:github/pr?id=12`, or
# `[[pr:12]]` in any text oxplow renders. It opens on its `pr` page (`for:` in pages/pr.yaml).
resources:
  - name: pr
    label: Pull request
    params: { id: { required: true, pattern: '^\d+$' } }
    resolve: pull_request
    searchable: pull_request
    wikilink: { prefix: pr, param: id }
    icon: git-pull-request
