manifest: 2
name: github
description: Pull requests from this repo's GitHub, joined to oxplow tasks and streams.
sharing: shared
engine: ">=0.7"
intent:
  purpose: >-
    Bring the repo's pull requests into the semantic layer as v_github_pr,
    joined to streams by branch and to tasks by the tsk id in the title, so
    lenses can show what is open against each stream.
  origin: null
  examples:
    - name: a stream whose branch has an open PR
      input: { lens: open-prs, params: { stream_id: 1 } }
      expect: the PR's number, title and author on that stream's row
collectors:
  - id: prs
    doc: The repo's 100 most recent pull requests (open and closed).
    runtime: exec
    entry: sync.sh
    trigger: { every: 15m }
    # Optional. Set GITHUB_TOKEN under this collector in Settings →
    # Extensions (it's stored in your keychain); without it the script
    # uses the `gh` CLI's own login.
    credentials: [GITHUB_TOKEN]
    env: [GITHUB_REPOSITORY]
    # The only host it talks to (curl and `gh api` both go through
    # api.github.com). On macOS nothing else is reachable.
    network: [api.github.com]
    entities:
      - name: pr
        doc: One GitHub pull request.
        key: number
        columns:
          number: { type: int, doc: PR number }
          title: text
          state: { type: text, doc: "`open` or `closed`" }
          author: { type: text, doc: GitHub login of the author }
          head_branch: { type: text, doc: Branch the PR is from }
          draft: bool
          opened_at: time
          merged_at: { type: time, doc: "When it was merged; NULL if not merged" }
          url: text
        relations:
          - { to: v_stream, on: "v_github_pr.head_branch = v_stream.branch" }
          - { to: v_task, on: "v_github_pr.title LIKE '%tsk' || v_task.id || '%'" }
