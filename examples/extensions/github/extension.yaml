manifest: 2
name: github
description: Pull requests from this repo's GitHub, joined to work items and streams.
sharing: shared
engine: ">=0.7"
intent:
  purpose: >-
    Bring the repo's pull requests into the semantic layer as v_github_pr,
    joined to streams by branch and to work items by the item's id in the
    title, so lenses can show what is open against each stream.
  origin: null
  examples:
    - name: a stream whose branch has an open PR
      input: { lens: open-prs, params: { stream_id: 1 } }
      expect: the PR's number, title and author on that stream's row
    - name: pr-link
      input: { wikilink: "pr:12" }
      expect: the pull request's ref, `github_pr:12`
collectors:
  - id: prs
    doc: The repo's 100 most recent pull requests (open and closed).
    runtime: exec
    entry: sync.sh
    trigger: { every: 15m }
    # Optional. Set GITHUB_TOKEN under this collector in Settings →
    # Extensions (it's stored in your keychain); without it the script
    # uses the `gh` CLI's own login.
    credentials: [GITHUB_TOKEN]
    env: [GITHUB_REPOSITORY]
    # The only host it talks to (curl and `gh api` both go through
    # api.github.com). On macOS nothing else is reachable.
    network: [api.github.com]
    entities:
      - name: pr
        doc: One GitHub pull request.
        key: number
        columns:
          number: { type: int, doc: PR number }
          title: text
          body: { type: text, doc: Its description }
          state: { type: text, doc: "`open` or `closed`" }
          author: { type: text, doc: GitHub login of the author }
          head_branch: { type: text, doc: Branch the PR is from }
          draft: bool
          opened_at: time
          merged_at: { type: time, doc: "When it was merged; NULL if not merged" }
          url: text
        relations:
          - { to: v_stream, on: "v_github_pr.head_branch = v_stream.branch" }
          - { to: v_work_item, on: "v_github_pr.title LIKE '%' || substr(v_work_item.ref, length('work_item:' || v_work_item.provider || ':') + 1) || '%'" }
models:
  - name: pull_request
    version: 1
    key: [ref]
    description: "Each synced pull request as a ref oxplow can name (`github_pr:<number>`): its title, which a ref to it shows, and its description, which search finds."
    columns:
      - { name: ref, type: TEXT, doc: "`github_pr:<number>`." }
      - { name: title, type: TEXT, doc: "Its title." }
      - { name: body, type: TEXT, doc: "Its description ('' for none)." }
pages:
  - { id: pr, title: Pull request, category: Work, lens: pr }
# Each pull request's lifetime as a bar from opened to merged — a range the
# kit's charts don't draw, so the `pr-lifetimes` lens renders this bundle.
# It may re-run that lens (its filters) and run the `prs` sync; it runs the
# sync with your rights, so it's a program you approve on Programs.
custom_components:
  - id: pr-lifetimes
    title: PR lifetimes
    assets: [pr-lifetimes]
    commands: [oxplow.collector.sync]
# A pull request is a kind of thing a ref can name: `github_pr:12`, or
# `[[pr:12]]` in any text oxplow renders. It links to its `pr` page.
ref_kinds:
  - kind: github_pr
    label: Pull request
    id: '^\d+$'
    resolve: pull_request
    searchable: pull_request
    page: pr
    wikilink: pr
    icon: git-pull-request
