# Settings → Extensions: a collector turned off after failures says why and
# offers Enable Again; a credential a collector declares is listed once, with
# whether a value is kept (never the value).
given:
  - observe: { health: { extension: github, contribution: prs, kind: collector, disable: "3 failures in a row; the last: boom" } }
when: { page: oxplow-foundation/settings, params: { area: extensions } }
expect:
  loaders:
    extensions_health:
      rows:
        contains:
          - { contribution: prs, status: "Disabled: 3 failures in a row; the last: boom", can_enable: 1, can_repair: 0 }
    extensions_credentials:
      rows:
        - { extension: github, status: Not set, is_set: 0 }
    extensions_secrets: { rows: 0 }
steps:
  - given:
      - { command: oxplow.collector.set_credential, input: { collector: "oxplow:oxplow/collector?collector=github/prs", name: GITHUB_TOKEN, value: v } }
  - expect:
      loaders:
        extensions_credentials:
          rows:
            - { status: Saved in keychain, is_set: 1 }
