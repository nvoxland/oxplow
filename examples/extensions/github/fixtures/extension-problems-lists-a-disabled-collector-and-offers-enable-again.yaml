# Extension problems: a collector turned off after failures says why, under
# its extension, and offers Enable Again.
given:
  - observe: { health: { extension: github, contribution: prs, kind: collector, disable: "3 failures in a row; the last: boom" } }
when: { page: oxplow-foundation/extension-problems, params: { extension: github } }
expect:
  loaders:
    problems:
      rows:
        contains:
          - { contribution: prs, what: "Turned off, 3 failures in a row; the last: boom.", can_enable: 1, can_repair: 0 }
