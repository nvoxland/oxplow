title: PR Lifetimes
description: How long each recent pull request was open — a bar from when it was opened to when it was merged, or to now while it's open.
category: Work
params:
- name: state
  role: filter
  label: State (open / merged / all)
  default: all
data:
  pr_lifetimes:
    sql: |
      SELECT pr.number, pr.title, pr.state, pr.author, pr.opened_at, pr.merged_at
      FROM v_github_pr pr
      WHERE :state = 'all'
         OR (:state = 'open' AND pr.state = 'open')
         OR (:state = 'merged' AND pr.merged_at IS NOT NULL)
      ORDER BY pr.opened_at DESC
      LIMIT 50
view:
  from: pr_lifetimes
  viz: custom
  custom:
    component: pr-lifetimes
  empty: No pull requests synced yet. Sync the `github/prs` source in Settings → Data.
