title: Pull request
description: One pull request — what an `oxplow:github/pr?id=<number>` URI opens.
for: github/pr
default: true
params:
- name: uri
data:
  pr:
    sql: |
      SELECT printf('**#%d %s** · %s · by %s · from `%s`%s', pr.number, pr.title, pr.state,
                    pr.author, pr.head_branch,
                    CASE WHEN pr.url IS NULL THEN '' ELSE ' · [on GitHub](' || pr.url || ')' END)
             || CASE WHEN p.body = '' THEN '' ELSE char(10) || char(10) || p.body END AS summary
      FROM v_github_pull_request p
      JOIN v_github_pr pr ON uri('github/pr', 'id', pr.number) = p.uri
      WHERE p.uri = :uri
view:
  from: pr
  viz: markdown
  empty: That pull request isn't synced yet.
