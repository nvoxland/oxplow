title: Pull Requests by Work Item
description: Recent PRs with the work item their title mentions by its id (tsk42, ENG-12), if any — whichever work list is active.
params:
- name: state
  role: filter
  label: State (open / closed / all)
  default: all
loaders:
  prs_by_task:
    sql: |
      SELECT pr.number, pr.title, pr.state, pr.author, w.uri AS item_ref, w.title AS item
      FROM v_github_pr pr
      LEFT JOIN v_work_item w
        ON pr.title LIKE '%' || w.native_id || '%'
      WHERE :state = 'all' OR pr.state = :state
      ORDER BY pr.number DESC
view:
  from: prs_by_task
  viz: table
  columns:
  - key: number
    label: '#'
  - key: title
    label: Pull Request
  - key: state
    label: State
  - key: author
    label: Author
  - key: item
    label: Work item
    link:
      kind: page
      from: item_ref
  empty: No pull requests synced yet. Sync the `github/prs` source in Settings → Data.
actions:
- id: sync
  label: Sync PRs
  command: oxplow.collector.sync
  input:
    collector: github/prs
