manifest: 2
name: review-badges
description: The latest model review of each work item, from effort-review, as a list.
engine: ">=0.7"
version: 0.1.0
intent:
  purpose: >-
    Show what effort-review's model said about each work item — the latest
    review, how it ended and when — in one list. It reads effort-review's exported `reviews` dataset and writes
    nothing; without effort-review it shows nothing and says why in
    Settings → Extensions.
  origin: null
  examples:
    - name: review-verdicts
      input: { page: review-verdicts }
      expect: no rows until effort-review has reviewed an effort
# Optional: with effort-review missing, disabled or exporting another
# version, the page below is withheld (a warning in Settings →
# Extensions) and nothing else changes.
imports:
  - { id: reviews, contribution: oxplow:oxplow/dataset?dataset=effort-review/reviews, version: 2, optional: true }
