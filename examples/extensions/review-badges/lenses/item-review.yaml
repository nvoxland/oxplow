title: Review
description: The latest model review of this work item, if effort-review has written one.
hidden: true
params: [{ name: ref }]
query: |
  SELECT r.state, r.reviewed_at, r.review
  FROM import_ref('reviews') r
  WHERE r.work_item = :ref
  ORDER BY r.reviewed_at DESC, r.job_run DESC
  LIMIT 1
viz: table
columns:
  - { key: state, label: Review }
  - { key: reviewed_at, label: When }
  - { key: review, label: What the model said }
