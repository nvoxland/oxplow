title: Review Verdicts
description: The latest model review of each work item — the effort reviewed, how the review ended, when, and how it opens.
category: Work
data:
  review_verdicts:
    sql: |
      WITH latest AS (
        SELECT r.work_item, r.effort, r.state, r.reviewed_at, r.review,
               row_number() OVER (PARTITION BY r.work_item ORDER BY r.reviewed_at DESC, r.job_run DESC) AS n
        FROM import_ref('reviews') r
        WHERE r.work_item IS NOT NULL
      )
      SELECT work_item, effort, state, reviewed_at, substr(review, 1, 120) AS opening
      FROM latest
      WHERE n = 1
      ORDER BY reviewed_at DESC
view:
  from: review_verdicts
  viz: table
  columns:
  - key: work_item
    label: Work item
    link:
      kind: page
      from: work_item
  - key: effort
    label: Effort
  - key: state
    label: State
  - key: reviewed_at
    label: Reviewed
  - key: opening
    label: Opening
  empty: No reviews yet. effort-review writes one when an effort with a work item finishes.
