title: Latest Reviews
description: The latest model review of each task — the effort reviewed, how the review ended, when, and how it opens.
category: Work
loaders:
  latest_reviews:
    sql: |
      WITH latest AS (
        SELECT r.task, r.effort, r.state, r.reviewed_at, r.review,
               row_number() OVER (PARTITION BY r.task ORDER BY r.reviewed_at DESC, r.job_run DESC) AS n
        FROM import_ref('reviews') r
        WHERE r.task IS NOT NULL
      )
      SELECT task, effort, state, reviewed_at, substr(review, 1, 120) AS opening
      FROM latest
      WHERE n = 1
      ORDER BY reviewed_at DESC
view:
  from: latest_reviews
  viz: table
  columns:
  - key: task
    label: Task
    link:
      kind: page
      from: task
  - key: effort
    label: Effort
  - key: state
    label: State
  - key: reviewed_at
    label: Reviewed
  - key: opening
    label: Opening
  empty: No reviews yet. effort-review writes one when an effort with a task finishes.
