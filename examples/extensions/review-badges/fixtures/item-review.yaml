# An item with no review shows no row.
# (Oxplow's own work list, effort policy and wiki are bundled's.)
requires: [oxplow-bundled]
when:
  page: item-review
  params: { uri: "oxplow:oxplow/work_item?id=tsk1&provider=oxplow" }
expect:
  loaders:
    item_review: { rows: 0, columns: [state, reviewed_at, review] }
