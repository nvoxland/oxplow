# An effort opened during the turn already covers it: no second one.
# (Oxplow's own work list, effort policy and wiki are bundled's.)
requires: [oxplow-bundled]
given:
  - { command: oxplow.capability.choose, input: { capability: effort_policy, provider: prompt_efforts }, confirmed: true }
  - observe:
      turn:
        prompt: Add a helper
        during: [{ command: oxplow.effort.open, input: { thread: thr1 } }]
        tools: [{ name: Edit, kind: edit, paths: [helper.txt], ok: true }]
        write: { path: helper.txt, body: "one" }
when:
  sql: "SELECT id, ended_at IS NOT NULL AS ended FROM v_effort ORDER BY id"
expect:
  rows: [{ id: 1, ended: 0 }]
