# Starting an item on a thread whose open effort has none links the effort
# to the item (the mover is an agent: the event names its thread).
# (Oxplow's own work list, effort policy and wiki are bundled's.)
requires: [oxplow-bundled]
given:
  - { command: oxplow.capability.choose, input: { capability: effort_policy, provider: prompt_efforts }, confirmed: true }
  - { command: oxplow.work_item.create, input: { title: Parse blocks, thread: thr1 }, bind: item }
  - { command: oxplow.effort.open, input: { thread: thr1 } }
when:
  command: oxplow.work_item.transition
  input: { uri: $item.uri, to: in_progress }
  as: agent
expect:
  ok: true
  commands: [oxplow.effort.link]
steps:
  - when: { sql: "SELECT id, work_item FROM v_effort ORDER BY id" }
    expect: { rows: [{ id: 1, work_item: $item.uri }] }
