title: Commits
hidden: true
params:
  - { name: range, type: date_range, default: 30d }
  - { name: q, type: search }
  - { name: merges, type: bool, default: false }
  - { name: commit }
query: |
  SELECT sha, subject, author, committed_at
    FROM v_commit
   WHERE (:range_from IS NULL OR committed_at >= :range_from)
     AND (:range_to IS NULL OR committed_at < :range_to)
     AND (:q IS NULL OR subject LIKE '%' || :q || '%')
     AND (:merges = 0 OR parent_count > 1)
   ORDER BY committed_at DESC
   LIMIT 200
viz: table
columns:
  - { key: sha, label: Commit, width: 90, select: commit }
  - { key: subject, label: Subject, highlight: q }
  - { key: author, label: Author, width: 140 }
  - { key: committed_at, label: When, format: relative, width: 100 }
empty: No commits match.
