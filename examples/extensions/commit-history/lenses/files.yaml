title: Files in the commit
hidden: true
params:
  - { name: commit }
query: |
  SELECT path, status, additions, deletions
    FROM v_commit_file
   WHERE sha = :commit
   ORDER BY path
viz: table
columns:
  - { key: path, label: File, link: { kind: file, from: path } }
  - { key: status, label: Change, width: 80 }
  - { key: additions, label: "+", width: 60 }
  - { key: deletions, label: "−", width: 60 }
empty: Click a commit to see its files.
