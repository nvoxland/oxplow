title: Commit history
description: The project's commits; click one to see its files.
viz: document
launcher: { category: Git }
params:
  - { name: range, role: filter, label: When, type: date_range, default: 30d, presets: [7d, 30d, 90d, all] }
  - { name: q, role: filter, label: Search subjects, type: search }
  - { name: merges, role: filter, label: Merges only, type: bool, default: false }
  - { name: commit, label: Commit }
sections:
  - { lens: commits }
  - { lens: files }
