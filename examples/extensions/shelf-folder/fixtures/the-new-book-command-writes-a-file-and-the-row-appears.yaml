requires: [shelf, shelf-folder]
when: { command: shelf_folder.book.new, input: { title: "Dune Messiah", body: "Next." } }
expect: { ok: true, result: { path: "shelf/dune-messiah.md" } }
steps:
  - when: { sql: "SELECT count(*) AS n FROM v_shelf_book" }
    expect: { rows: [{ n: 0 }] }
  - when:
      collector: shelf_folder/books
      trigger: { files: [{ path: "shelf/dune-messiah.md", op: created }] }
    expect: { ok: true }
  - when: { sql: "SELECT id, title, store FROM v_shelf_book" }
    expect: { rows: [{ id: dune-messiah, title: Dune Messiah, store: shelf-folder }] }
