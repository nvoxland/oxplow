requires: [shelf, shelf-folder]
given:
  - { files: { "shelf/dune.md": "# Dune" } }
when: { collector: shelf_folder/books, trigger: start }
expect: { ok: true }
steps:
  - given:
      - { remove_files: ["shelf/dune.md"] }
  - when:
      collector: shelf_folder/books
      trigger: { files: [{ path: "shelf/dune.md", op: removed }] }
    expect: { ok: true, result: { "shelf/book.removed": 1 } }
  - when: { sql: "SELECT count(*) AS n FROM v_shelf_book" }
    expect: { rows: [{ n: 0 }] }
