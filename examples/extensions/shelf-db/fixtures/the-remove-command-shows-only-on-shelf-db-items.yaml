# The store filter: a file book has no Remove from shelf-db.
requires: [shelf, shelf-folder, shelf-db]
given:
  - { files: { "shelf/dune.md": "# Dune" } }
  - { command: shelf_db.book.add, input: { title: Emma } }
when: { collector: shelf_folder/books, trigger: start }
expect: { ok: true }
steps:
  - when: { collector: shelf_db/books, trigger: sqlite }
    expect: { ok: true }
  - when: { item_commands: "oxplow:shelf/book?id=emma&store=shelf-db" }
    expect: { commands: { contains: [shelf_db.book.remove] } }
  - when: { item_commands: "oxplow:shelf/book?id=dune&store=shelf-folder" }
    expect: { commands: [] }
