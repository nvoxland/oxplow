# Commands are observed at once; a `start` run still states the full
# snapshot and leaves the model as the table is.
requires: [shelf, shelf-db]
given:
  - { command: shelf_db.book.add, input: { title: Dune } }
  - { command: shelf_db.book.add, input: { title: Emma } }
  - { command: shelf_db.book.remove, input: { id: dune } }
when: { collector: shelf_db/books, trigger: start }
expect: { ok: true }
steps:
  - when: { sql: "SELECT id FROM v_shelf_book" }
    expect: { rows: [{ id: emma }] }
