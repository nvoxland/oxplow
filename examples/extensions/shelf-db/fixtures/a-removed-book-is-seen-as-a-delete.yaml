# A removal leaves a tombstone with a sequence number, so a run after the
# cursor states the delete.
requires: [shelf, shelf-db]
given:
  - { command: shelf_db.book.add, input: { title: Dune } }
  - { command: shelf_db.book.add, input: { title: Emma } }
when: { collector: shelf_db/books, trigger: start }
expect: { ok: true }
steps:
  - when: { command: shelf_db.book.remove, input: { id: dune } }
    expect: { ok: true }
  - when: { collector: shelf_db/books, trigger: sqlite }
    expect: { ok: true, result: { "shelf/book.removed": 1 } }
  - when: { sql: "SELECT id FROM v_shelf_book" }
    expect: { rows: [{ id: emma }] }
