# A removal leaves a tombstone with a sequence number; the command's own
# write is observed at once, so the row is gone when the command returns.
requires: [shelf, shelf-db]
given:
  - { command: shelf_db.book.add, input: { title: Dune } }
  - { command: shelf_db.book.add, input: { title: Emma } }
when: { command: shelf_db.book.remove, input: { id: dune } }
expect: { ok: true }
steps:
  - when: { sql: "SELECT id FROM v_shelf_book" }
    expect: { rows: [{ id: emma }] }
