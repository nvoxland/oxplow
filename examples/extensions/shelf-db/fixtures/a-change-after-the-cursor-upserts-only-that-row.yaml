# The collector follows a change sequence: a book added after the cursor is
# observed at once, and the cursor moves to its sequence.
requires: [shelf, shelf-db]
given:
  - { command: shelf_db.book.add, input: { title: Dune, rating: 4 } }
when: { command: shelf_db.book.add, input: { title: Emma, rating: 3 } }
expect: { ok: true }
steps:
  - when: { sql: "SELECT cursor_json FROM v_collector_run WHERE owner = 'shelf_db' AND id = 'books'" }
    expect: { rows: [{ cursor_json: '{"seq":2}' }] }
  - when: { sql: "SELECT count(*) AS n FROM v_shelf_book" }
    expect: { rows: [{ n: 2 }] }
