# An effort without a work item has nowhere to put a review.
given:
  - { command: oxplow.effort.open, input: { thread: thr1 } }
when:
  event:
    type: effort.finished
    payload: { effort: "eff1" }
expect:
  effects: { contains: [{ id: effort-review/review-on-finish, state: skipped }] }
  commands: []
