# The model reads the effort's evidence through its tool before it
# answers. `setup` makes that evidence first, through oxplow's own
# commands: a work item, an effort on it in which the agent ran the tests,
# then closed. The answer is matched to the tool's result (`when`), so it
# comes only once the evidence carries the test run; the call, the tool's
# answer and the reply are the job's output, in order.
input:
  setup:
    - { command: oxplow.work_item.create, input: { title: Parse blocks } }
    - { command: oxplow.effort.open, input: { thread: "thread:thr1", work_item: "work_item:oxplow:tsk1" } }
    - { command: oxplow.test.record_run, as: agent, input: { command: cargo test, passed: 12, failed: 0, total: 12 } }
    - { command: oxplow.effort.close, input: { effort: "effort:eff1" } }
  job: review
  intentKey: "review:effort:eff1"
  request:
    schemaVersion: 1
    role: summarize
    messages:
      - { role: user, parts: [{ type: text, text: "Review effort:eff1." }] }
  model:
    replies:
      - { toolCalls: [{ name: effort_evidence, arguments: { effort: "effort:eff1" } }] }
      - { when: "cargo test", text: "All 12 tests of cargo test passed." }
expect:
  state: succeeded
  toolCalls: 1
  text: "All 12 tests of cargo test passed."
  output:
    - { kind: tool_call }
    - { kind: usage }
    - { kind: tool_result }
    - { kind: text }
    - { kind: usage }
