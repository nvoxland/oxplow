# The finished review's event reaches publish-review (running in the throwaway host),
# which reads the job back and looks for its effort — the throwaway has
# none, so it comments nothing.
when:
  job: review
  intentKey: "review:eff3"
  request:
    schemaVersion: 1
    role: summarize
    messages:
      - { role: user, parts: [{ type: text, text: "Review eff3 in one line." }] }
expect:
  state: succeeded
  effects:
    - { id: effort_review/publish-review, state: skipped }
  commands: []
model:
  replies: ["Tests pass; nothing measured."]
