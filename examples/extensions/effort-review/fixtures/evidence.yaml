# The effort's evidence in one bundle: its work item, the files its edits
# claimed and the test runs its shell calls made. What the effort hasn't
# got (functions, observations, metrics, findings) is empty.
# (Oxplow's own work list, effort policy and wiki are bundled's.)
requires: [oxplow-bundled]
given:
  - { command: oxplow.work_item.create, input: { title: Parse blocks }, bind: item }
  - { command: oxplow.effort.open, input: { thread: thr1, work_item: $item.uri } }
  - observe:
      turn:
        prompt: Parse blocks
        tools:
          - { name: Edit, kind: edit, paths: [src/parse.rs], ok: true }
          - { name: Bash, kind: shell, command: cargo test, detail: cargo test, ok: true, exit_code: 0 }
when:
  command: effort_review.effort.evidence
  input: { effort: eff1 }
expect:
  ok: true
  commands: []
  result:
    effort: eff1
    workItem: $item.uri
    title: Parse blocks
    files: [{ path: src/parse.rs, source: claimed }]
    functions: []
    testRuns: [{ command: cargo test, exit_code: 0 }]
    observations: []
    metrics: []
    findings: []
    truncated: []
