# Cancelled while the model writes: the job stops at once and keeps what
# it had written.
input:
  job: review
  intentKey: "review:effort:eff2"
  cancel: true
  request:
    schemaVersion: 1
    role: summarize
    messages:
      - { role: user, parts: [{ type: text, text: "Review effort:eff2 at length." }] }
  model:
    replies:
      - { text: "The tests the agent ran cover the parser change, but the diff coverage leaves the error path in src/parse.rs untested, and the riskiest change is parse_block.", chunkDelayMs: 100 }
expect:
  state: cancelled
  result: { stopped: cancelled }
