title: Finished Efforts
description: The efforts that finished in the last week, with their tasks — Review asks a model to review one from its evidence.
category: Work
loaders:
  efforts:
    sql: |
      SELECT uri AS effort,
             task,
             title,
             ended_at,
             uri_param(uri, 'id') AS effort_id
      FROM v_effort
      WHERE ended_at IS NOT NULL
        AND ended_at >= strftime('%Y-%m-%dT%H:%M:%fZ', 'now', '-7 days')
      ORDER BY ended_at DESC
view:
  from: efforts
  viz: table
  columns:
  - key: title
    label: Effort
    link:
      kind: page
      from: effort
  - key: task
    label: Task
    link:
      kind: page
      from: task
  - key: ended_at
    label: Finished
  empty: No effort finished in the last week.
  actions:
  - id: review
    label: Review
    command: effort_review.effort.review
    input:
      effort: '{{row.effort_id}}'
    row: true
