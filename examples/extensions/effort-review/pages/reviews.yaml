title: Effort Reviews
description: Each finished effort a model reviewed — its task, its review's state and what it wrote. Open the output to follow a running one; Cancel stops it.
category: Work
loaders:
  reviews:
    sql: |
      SELECT job_run,
             uri('oxplow/page', 'page', 'job-run-output', 'job_run', job_run) AS output_ref,
             effort,
             task,
             state,
             substr(review, 1, 200) AS opening,
             reviewed_at
      FROM v_effort_review_reviews
      ORDER BY reviewed_at DESC
view:
  from: reviews
  viz: table
  columns:
  - key: effort
    label: Effort
    link:
      kind: page
      from: output_ref
  - key: task
    label: Task
    link:
      kind: page
      from: task
  - key: state
    label: State
  - key: opening
    label: Review
  - key: reviewed_at
    label: Changed
  empty: No effort has been reviewed yet. A review starts when an effort with a task finishes, or from Review on the Finished Efforts page.
  actions:
  - id: cancel
    label: Cancel
    command: effort_review.review.cancel
    input:
      job_run: '{{row.job_run}}'
    row: true
