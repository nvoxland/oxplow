title: Thread notes
description: The newest notes left on this thread.
hidden: true
params:
- name: thread_id
data:
  thread_notes:
    sql: |
      SELECT n.created_at, n.author, n.body
      FROM v_thread_note n
      WHERE n.thread_id = :thread_id
      ORDER BY n.created_at DESC, n.id DESC
      LIMIT 10
view:
  from: thread_notes
  viz: table
  columns:
  - key: created_at
    label: When
    format: relative
    width: 96
  - key: author
    label: By
    width: 96
  - key: body
    label: Note
  empty: No notes on this thread yet.
