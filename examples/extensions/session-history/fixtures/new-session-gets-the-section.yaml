# The mount puts the example's page in the New Session page's `sections`
# slot, after `start`, fed the thread the person is starting a session in.
given:
  - observe: { turn: { prompt: Review the page migration } }
when:
  page: oxplow/new-session
  params: { stream_id: 1, thread_id: 1 }
expect:
  nodes:
    - { id: start }
    - { id: session_history.thread-history }
  loaders:
    session_history.thread-history/thread_history: { rows: [{ prompt: Review the page migration }] }
