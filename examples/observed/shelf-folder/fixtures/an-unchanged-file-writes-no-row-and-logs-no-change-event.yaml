enable: [shelf, shelf-folder]
given:
  - { files: { "shelf/dune.md": "# Dune\n\nA desert planet." } }
when: { collector: shelf-folder.books, trigger: start }
expect: { ok: true }
steps:
  - when: { sql: "SELECT count(*) AS n FROM v_event WHERE type = 'shelf.book.changed'" }
    expect: { rows: [{ n: 1 }] }
  - when:
      collector: shelf-folder.books
      trigger: { files: [{ path: "shelf/dune.md", op: modified }] }
    expect: { ok: true, result: { upserted: 0, removed: 0, unchanged: 1 } }
  - when: { collector: shelf-folder.books, trigger: start }
    expect: { ok: true, result: { upserted: 0, removed: 0, unchanged: 1 } }
  - when: { sql: "SELECT count(*) AS n FROM v_event WHERE type = 'shelf.book.changed'" }
    expect: { rows: [{ n: 1 }] }
