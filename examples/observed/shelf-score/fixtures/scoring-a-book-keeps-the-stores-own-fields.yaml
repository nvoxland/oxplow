enable: [shelf, shelf-db, shelf-score]
given:
  - { command: shelf-db.book.add, input: { title: Dune, rating: 4 } }
when: { collector: shelf-db.books, trigger: sqlite }
expect: { ok: true }
steps:
  - when: { command: shelf-score.score, input: { uri: "oxplow:shelf/book?id=dune&store=shelf-db", score: 9 } }
    expect: { ok: true }
  - when: { sql: "SELECT fields FROM v_shelf_book" }
    expect:
      rows:
        - fields: { "shelf-db": { rating: 4 }, "shelf-score": { score: 9 } }
