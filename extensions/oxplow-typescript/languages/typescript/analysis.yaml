# TypeScript: what oxplow's code analysis knows about its syntax.
functions:
  kinds: [function_declaration, function_expression, arrow_function, method_definition, generator_function, generator_function_declaration, function_signature]
  param_list_fields: [parameters]
  parameter_kinds: [required_parameter, optional_parameter, identifier, assignment_pattern, object_pattern, array_pattern]
decisions:
  # `else_clause` deliberately excluded for the same reason as Rust.
  kinds: [if_statement, switch_case, switch_default, for_statement, for_in_statement, while_statement, do_statement, catch_clause, ternary_expression]
visibility:
  strategy: accessibility_modifier
doc:
  strategy: preceding_comment
  prefixes: ["/**"]
imports:
  strategy: es_import
duplication:
  skip_kinds: [import_statement, import_alias]
merge:
  key: named
  import_kinds: [import_statement]
  transparent_kinds: [export_statement]
  inner_decl_fields: [declaration]
  name_fields: [name]
