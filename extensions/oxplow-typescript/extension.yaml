manifest: 2
name: oxplow-typescript
namespace: oxplow
description: "What oxplow knows about TypeScript and JavaScript: their grammars, what code analysis reads (functions, complexity, symbols), and the language server to suggest. Ships with oxplow, off until a project uses TypeScript and JavaScript."
engine: ">=0.7"
intent:
  purpose: >-
    Hold everything oxplow knows about TypeScript and JavaScript in one place, as an
    ordinary extension a project turns on when it has these files, so core
    names no language and a project that doesn't use one sees none of it.
  origin: null
  examples:
    - name: typescript-functions-and-arrow-bindings
      input: { language: typescript }
      expect: the functions a file defines
    - name: typescript-class-members
      input: { language: typescript }
      expect: a class's members in the class
    - name: typescript-interfaces-types-enums-and-namespaces
      input: { language: typescript }
      expect: interfaces, types, enums and namespaces
    - name: typescript-top-level-values-only
      input: { language: typescript }
      expect: only top-level values are definitions
    - name: typescript-overloads-are-one-symbol
      input: { language: typescript }
      expect: overloads give one definition
    - name: typescript-arrow-function-with-branches
      input: { language: typescript }
      expect: an arrow function's parameters and complexity
    - name: typescript-docs-and-visibility-of-functions
      input: { language: typescript }
      expect: JSDoc and visibility of functions
    - name: typescript-imports
      input: { language: typescript }
      expect: the imports of a file
    - name: tsx-components-and-imports
      input: { language: tsx }
      expect: components and imports of a TSX file
    - name: javascript-functions-and-arrow-bindings
      input: { language: javascript }
      expect: the functions a file defines
    - name: javascript-class-members
      input: { language: javascript }
      expect: a class's members in the class
    - name: javascript-top-level-values-only
      input: { language: javascript }
      expect: only top-level values are definitions
    - name: javascript-rest-parameters-are-counted
      input: { language: javascript }
      expect: a rest parameter counts
    - name: javascript-require-and-import
      input: { language: javascript }
      expect: require calls and imports
languages:
  - id: typescript
    title: "TypeScript"
    extensions: [ts]
    aliases: ["ts"]
    grammar: { native: typescript }
    analysis: languages/typescript/analysis.yaml
    symbols: languages/typescript/symbols.scm
    lsp: { package: typescript-language-server }
    units: [class, module]
    # How the metric scaffold writes a sample function.
    starter:
      function: "function {name}(x: number): number {"
      branch: ["    if (x === {n}) { return {n}; }"]
      tail: ["    return 0;", "}"]
  - id: tsx
    title: "TSX"
    extensions: [tsx]
    lsp_ids: [typescriptreact]
    grammar: { native: tsx }
    analysis: languages/tsx/analysis.yaml
    symbols: languages/tsx/symbols.scm
    lsp: { package: typescript-language-server }
    units: [class, module]
  - id: javascript
    title: "JavaScript"
    extensions: [js, mjs, cjs, jsx]
    aliases: ["js", "jsx"]
    lsp_ids: [javascriptreact]
    grammar: { native: javascript }
    analysis: languages/javascript/analysis.yaml
    symbols: languages/javascript/symbols.scm
    lsp: { package: typescript-language-server }
    units: [class]
    # How the metric scaffold writes a sample function.
    starter:
      function: "function {name}(x) {"
      branch: ["    if (x === {n}) { return {n}; }"]
      tail: ["    return 0;", "}"]
