manifest: 2
name: oxplow-zig
namespace: oxplow
description: "What oxplow knows about Zig: the language server to suggest. Ships with oxplow, off until a project uses Zig."
engine: ">=0.7"
intent:
  purpose: >-
    Hold everything oxplow knows about Zig in one place, as an
    ordinary extension a project turns on when it has these files, so core
    names no language and a project that doesn't use one sees none of it.
  origin: null
  examples:
    - name: zig-the-language-server-is-suggested
      input: { sql: v_language }
      expect: the Mason package of the language server
languages:
  - { id: zig, title: Zig, extensions: [zig], lsp: { package: zls }, comments: { line: ["//"] }, editor: { monaco: plaintext } }
