manifest: 2
name: oxplow-json
namespace: oxplow
description: "What oxplow knows about JSON: the language server to suggest. Ships with oxplow, off until a project uses JSON."
engine: ">=0.7"
intent:
  purpose: >-
    Hold everything oxplow knows about JSON in one place, as an
    ordinary extension a project turns on when it has these files, so core
    names no language and a project that doesn't use one sees none of it.
  origin: null
  examples:
    - name: json-the-language-server-is-suggested
      input: { sql: v_language }
      expect: the Mason package of the language server
languages:
  - { id: json, title: JSON, extensions: [json, jsonc], lsp: { package: json-lsp } }
