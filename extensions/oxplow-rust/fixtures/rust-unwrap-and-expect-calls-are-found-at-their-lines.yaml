# Rust: each unwrap and expect call gives an info fact at its line.
when:
  collector: oxplow.rust.unwrap_expect_calls
  files:
    "README.md": "unsafe { not code } panic!()"
    "src/a.rs": "\n// TODO: clean this up\nfn a() {\nunsafe { foo(); }\nlet x = maybe().unwrap();\nlet y = maybe().expect(\"nope\");\nif x { panic!(\"boom\"); }\n}\nfn b() {\nunsafe { bar(); }\ntodo!();\nstd::panic!(\"path-qualified macro counts too\");\n}\n"
    "src/b.rs": "// FIXME later\nfn c() { let s = \"a TODO in a string is ignored\"; }\n"
expect:
  facts:
    - {"measure": "oxplow.ast_hit", "value": 1, "subject": "oxplow:oxplow/file?path=src/a.rs", "path": "src/a.rs", "line": 5, "rule": "unwrap_expect", "severity": "info", "dims": {"oxplow.language": "rust"}}
    - {"measure": "oxplow.ast_hit", "value": 1, "subject": "oxplow:oxplow/file?path=src/a.rs", "path": "src/a.rs", "line": 6, "rule": "unwrap_expect", "severity": "info", "dims": {"oxplow.language": "rust"}}
