manifest: 2
name: oxplow-rust
namespace: oxplow
description: "What oxplow knows about Rust: its grammar, what code analysis reads (functions, complexity, symbols), and the language server to suggest. Ships with oxplow, off until a project uses Rust."
engine: ">=0.7"
intent:
  purpose: >-
    Hold everything oxplow knows about Rust in one place, as an
    ordinary extension a project turns on when it has these files, so core
    names no language and a project that doesn't use one sees none of it.
  origin: null
  examples:
    - name: rust-cargo-lock-is-a-lockfile
      input: { sql: v_file_kind_rule }
      expect: the kind the pack gives that path
    - name: rust-cargo-toml-is-a-dependency-manifest
      input: { sql: v_file_kind_rule }
      expect: the kind the pack gives that path
    - name: rust-panic-todo-and-path-qualified-panic-macros-are-found-at-their-lines
      input: { collector: oxplow.rust.panic_macros }
      expect: the facts the collector records for the files given
    - name: rust-unsafe-blocks-are-found-at-their-lines-and-tagged-with-their-rule
      input: { collector: oxplow.rust.unsafe_blocks }
      expect: the facts the collector records for the files given
    - name: rust-unwrap-and-expect-calls-are-found-at-their-lines
      input: { collector: oxplow.rust.unwrap_expect_calls }
      expect: the facts the collector records for the files given
    - name: rust-functions-and-their-symbols
      input: { language: rust }
      expect: a file's definitions, its functions' metrics and its imports
    - name: rust-definitions-get-their-ids
      input: { language: rust }
      expect: every kind of definition and its id
    - name: rust-a-definition-records-its-name-and-container
      input: { language: rust }
      expect: a method's name, container and line
    - name: rust-methods-sit-in-their-modules-and-types
      input: { language: rust }
      expect: the modules and type around a method
    - name: rust-function-complexity-counts-branches
      input: { language: rust }
      expect: complexity of ifs and match arms
    - name: rust-nested-functions-each-get-their-own-record
      input: { language: rust }
      expect: an inner function's branches count for it alone
    - name: rust-pub-functions-are-public-and-doc-comments-count
      input: { language: rust }
      expect: visibility and doc comments
    - name: rust-imports-read-simple-uses
      input: { language: rust }
      expect: each use path in order
    - name: rust-imports-read-grouped-and-aliased-uses
      input: { language: rust }
      expect: groups, aliases, globs and extern crate
test_conventions:
  - { id: rust-tests, languages: [rust], paths: ['**/test_*.rs'], skips: ['#\[ignore'] }
languages:
  - id: rust
    editor: { monaco: rust }
    comments: { line: ["//"], block: [["/*", "*/"]] }
    keywords: [if, for, while, match, return, loop, fn, else, Some, Ok, Err, None, Box, Vec, String, Option, Result, Rc, Arc, await]
    title: "Rust"
    extensions: [rs]
    aliases: ["rs"]
    grammar: { native: rust }
    analysis: languages/rust/analysis.yaml
    symbols: languages/rust/symbols.scm
    lsp: { package: rust-analyzer }
    units: [class, module]
    # How the metric scaffold writes a sample function.
    starter:
      function: "fn {name}(x: i32) -> i32 {"
      branch: ["    if x == {n} { return {n}; }"]
      tail: ["    0", "}"]
# Commands that mark a shell call as a test or analysis run.
run_patterns:
  - { id: rust-test, kind: test, patterns: ['cargo test', 'cargo nextest'] }
  - { id: rust-analysis, kind: analysis, patterns: ['cargo clippy', 'clippy-driver'] }
# Kinds of file a Rust project has.
file_kinds:
  - { id: rust-dependency-manifest, kind: dependency-manifest, label: Dependency manifest, globs: ['**/Cargo.toml'] }
  - { id: rust-lockfile, kind: lockfile, label: Lockfile, globs: ['**/Cargo.lock'] }
  - { id: rust-lint-config, kind: lint-config, label: Lint config, globs: ['**/rustfmt.toml', '**/.rustfmt.toml', '**/clippy.toml', '**/.clippy.toml'] }
# What its collectors read: the project's files. The skill is text for the agent.
permissions: [files.read, agent.write]
skills:
  - { name: rust-setup, file: skills/rust-setup/SKILL.md }
configuration:
  version: 2
  schema:
    type: object
    additionalProperties: false
    properties:
      rust:
        type: object
        additionalProperties: false
        x-category: testing
        description: The reports the Rust tools write, which oxplow reads.
        properties:
          clippyReport: { type: string, default: target/clippy.json, description: "The clippy report (JSON) that the analysis run reads, from the project root." }
collectors:
  # Its idiom metrics: each counts what the tree has, on by default while the pack is on.
  - { id: oxplow.rust.unsafe_blocks, doc: "Finds each `unsafe` block in Rust files, one fact per file with the lines of its hits.", runtime: starlark, entry: collectors/rust/unsafe_blocks.star, on: [snapshot.taken], facts: [oxplow.ast_hit] }
  - { id: oxplow.rust.unwrap_expect_calls, doc: "Finds each `unwrap` and `expect` call in Rust files, one fact per file with the lines of its hits.", runtime: starlark, entry: collectors/rust/unwrap_expect_calls.star, on: [snapshot.taken], facts: [oxplow.ast_hit] }
  - { id: oxplow.rust.panic_macros, doc: "Finds each `panic!`, `todo!` and similar macro in Rust files, one fact per file with the lines of its hits.", runtime: starlark, entry: collectors/rust/panic_macros.star, on: [snapshot.taken], facts: [oxplow.ast_hit] }
  # A report: clippy's JSON findings, read after an analysis run.
  - { id: oxplow.rust.clippy_report, doc: "Reads the clippy report after an analysis run.", records: analysis, runtime: jaq, entry: collectors/rust/clippy.jq, report: { path: { setting: /rust/clippyReport, default: target/clippy.json }, format: lines }, on: { run: analysis } }
metrics:
  - { key: oxplow.rust.unsafe_blocks, title: "unsafe blocks", measure: oxplow.ast_hit, expression: "SUM(value) FILTER (WHERE dim('oxplow.rule') = 'unsafe_block')", unit: count, direction: lower-better, displayKind: gauge, category: static-quality, language: rust, description: "Count of `unsafe` blocks in the codebase.", sliceableDims: [oxplow.package, oxplow.language, oxplow.vcs_rev], target: 0.0, collector: oxplow.rust.unsafe_blocks }
  - { key: oxplow.rust.unwrap_expect_calls, title: "unwrap / expect calls", measure: oxplow.ast_hit, expression: "SUM(value) FILTER (WHERE dim('oxplow.rule') = 'unwrap_expect')", unit: count, direction: lower-better, displayKind: gauge, category: static-quality, language: rust, description: "Calls to `.unwrap()` / `.expect()` that can panic at runtime.", sliceableDims: [oxplow.package, oxplow.language, oxplow.vcs_rev], collector: oxplow.rust.unwrap_expect_calls }
  - { key: oxplow.rust.panic_macros, title: "panic-family macros", measure: oxplow.ast_hit, expression: "SUM(value) FILTER (WHERE dim('oxplow.rule') = 'panic_macro')", unit: count, direction: lower-better, displayKind: gauge, category: static-quality, language: rust, description: "Uses of `panic!` / `unreachable!` / `todo!` and similar panic macros.", sliceableDims: [oxplow.package, oxplow.language, oxplow.vcs_rev], collector: oxplow.rust.panic_macros }
