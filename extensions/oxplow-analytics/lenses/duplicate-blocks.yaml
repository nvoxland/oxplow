title: Duplicate Blocks
query: |
  SELECT f.path, f.start_line, f.end_line - f.start_line + 1 AS lines,
         json_extract(f.extra_json, '$.peerPath') AS peer,
         f.path || ':' || f.start_line || '-' || f.end_line || '|'
           || json_extract(f.extra_json, '$.peerPath') || ':'
           || json_extract(f.extra_json, '$.peerStartLine') || '-'
           || json_extract(f.extra_json, '$.peerEndLine') AS pair,
         CASE s.tree_version_kind WHEN 'ref' THEN s.tree_version_value ELSE 'working tree' END AS version
  FROM v_code_quality_finding f JOIN v_code_quality_scan s ON s.id = f.scan_id
  WHERE f.kind = 'duplicate-block'
  ORDER BY f.id DESC
  LIMIT 100
columns:
  - { key: path, label: File, link: { kind: compare, from: pair, head: version } }
  - { key: start_line, label: Line }
  - { key: lines, label: Lines }
  - { key: peer, label: Copy Of }
empty: No duplicate blocks reported.
hidden: true
