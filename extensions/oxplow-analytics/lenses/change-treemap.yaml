title: Churn
description: Changed lines per file, grouped by architectural zone.
params: [{ name: change_id }]
query: |
  SELECT f.path, f.additions + f.deletions AS churn, f.zone, c.base_label, c.head_label
  FROM v_change_file f JOIN v_change c ON c.id = f.change_id
  WHERE f.change_id = :change_id AND f.additions + f.deletions > 0
viz: treemap
chart: { label: path, size: churn, group: zone }
columns:
  - { key: path, link: { kind: diff-at, base: base_label, head: head_label } }
empty: No changed lines.
hidden: true
