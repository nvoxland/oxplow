manifest: 2
name: oxplow-csharp
namespace: oxplow
description: "What oxplow knows about C#: its grammar, what code analysis reads (functions, complexity, symbols), and the language server to suggest. Ships with oxplow, off until a project uses C#."
engine: ">=0.7"
intent:
  purpose: >-
    Hold everything oxplow knows about C# in one place, as an
    ordinary extension a project turns on when it has these files, so core
    names no language and a project that doesn't use one sees none of it.
  origin: null
  examples:
    - name: csharp-csproj-is-a-dependency-manifest
      input: { sql: v_file_kind_rule }
      expect: the kind the pack gives that path
    - name: csharp-editorconfig-is-lint-config
      input: { sql: v_file_kind_rule }
      expect: the kind the pack gives that path
    - name: csharp-blocking-async-calls-are-found-at-their-lines
      input: { collector: oxplow.csharp.blocking_async_calls }
      expect: the facts the collector records for the files given
    - name: csharp-empty-catch-blocks-are-found-at-their-lines
      input: { collector: oxplow.csharp.empty_catch }
      expect: the facts the collector records for the files given
    - name: csharp-namespace-types-and-members
      input: { language: csharp }
      expect: a namespace, class and its members by signature
    - name: csharp-overloads-drop-names-and-defaults
      input: { language: csharp }
      expect: overload ids with parameter types only
    - name: csharp-type-kinds
      input: { language: csharp }
      expect: the symbol kind of each type declaration
    - name: csharp-local-functions-nest-and-lambdas-do-not
      input: { language: csharp }
      expect: local functions as symbols, lambdas not
    - name: csharp-file-scoped-namespace
      input: { language: csharp }
      expect: a file-scoped namespace symbol
    - name: csharp-several-declarators-are-several-symbols
      input: { language: csharp }
      expect: one symbol per field declarator
    - name: csharp-foreach-and-switch-cases-count-toward-complexity
      input: { language: csharp }
      expect: foreach and switch cases in complexity
languages:
  - id: csharp
    editor: { monaco: csharp }
    comments: { line: ["//"], block: [["/*", "*/"]] }
    keywords: [if, for, foreach, while, switch, catch, lock, using, return, nameof, typeof, sizeof, new, await, yield]
    title: "C#"
    extensions: [cs]
    aliases: ["c#", "cs"]
    grammar: { native: csharp }
    analysis: languages/csharp/analysis.yaml
    symbols: languages/csharp/symbols.scm
    units: [class, module]
# Commands that mark a shell call as a test or analysis run.
run_patterns:
  - { id: csharp-test, kind: test, patterns: ['dotnet test'] }
# Kinds of file a C# project has.
file_kinds:
  - { id: csharp-dependency-manifest, kind: dependency-manifest, label: Dependency manifest, globs: ['**/*.csproj', '**/*.sln', '**/Directory.Packages.props'] }
  - { id: csharp-lockfile, kind: lockfile, label: Lockfile, globs: ['**/packages.lock.json'] }
  - { id: csharp-lint-config, kind: lint-config, label: Lint config, globs: ['**/.editorconfig'] }
# What its collectors read: the project's files. The skill is text for the agent.
permissions: [files.read, agent.write]
skills:
  - { name: csharp-setup, file: skills/csharp-setup/SKILL.md }
collectors:
  # Its idiom metrics: each counts what the tree has, on by default while the pack is on.
  - { id: oxplow.csharp.empty_catch, doc: "Finds each empty `catch` block in C# files, one fact per hit at its line.", runtime: starlark, entry: collectors/csharp/empty_catch.star, on: [snapshot.taken], facts: [oxplow.ast_hit] }
  - { id: oxplow.csharp.blocking_async_calls, doc: "Finds each blocking call on async code (`.Result`, `.Wait()`) in C# files, one fact per hit at its line.", runtime: starlark, entry: collectors/csharp/blocking_async_calls.star, on: [snapshot.taken], facts: [oxplow.ast_hit] }
metrics:
  - { key: oxplow.csharp.empty_catch, title: "empty catch blocks", measure: oxplow.ast_hit, expression: "SUM(value) FILTER (WHERE dim('oxplow.rule') = 'empty_catch')", unit: count, direction: lower-better, displayKind: gauge, category: static-quality, language: csharp, description: "Empty `catch` blocks that swallow exceptions.", sliceableDims: [oxplow.package, oxplow.language, oxplow.vcs_rev], collector: oxplow.csharp.empty_catch }
  - { key: oxplow.csharp.blocking_async_calls, title: "blocking async calls (.Result / .Wait())", measure: oxplow.ast_hit, expression: "SUM(value) FILTER (WHERE dim('oxplow.rule') = 'blocking_async')", unit: count, direction: lower-better, displayKind: gauge, category: static-quality, language: csharp, description: "Blocking calls on async code (`.Result` / `.Wait()`).", sliceableDims: [oxplow.package, oxplow.language, oxplow.vcs_rev], collector: oxplow.csharp.blocking_async_calls }
