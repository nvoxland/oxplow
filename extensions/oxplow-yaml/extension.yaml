manifest: 2
name: oxplow-yaml
namespace: oxplow
description: "What oxplow knows about YAML: the language server to suggest. Ships with oxplow, off until a project uses YAML."
engine: ">=0.7"
intent:
  purpose: >-
    Hold everything oxplow knows about YAML in one place, as an
    ordinary extension a project turns on when it has these files, so core
    names no language and a project that doesn't use one sees none of it.
  origin: null
  examples:
    - name: yaml-the-language-server-is-suggested
      input: { sql: v_language }
      expect: the Mason package of the language server
languages:
  - { id: yaml, title: YAML, extensions: [yaml, yml], lsp: { package: yaml-language-server }, comments: { line: ["#"] } }
