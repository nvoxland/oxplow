manifest: 2
name: oxplow-go
namespace: oxplow
description: "What oxplow knows about Go: its grammar, what code analysis reads (functions, complexity, symbols), and the language server to suggest. Ships with oxplow, off until a project uses Go."
engine: ">=0.7"
permissions: [agent.write]
intent:
  purpose: >-
    Hold everything oxplow knows about Go in one place, as an
    ordinary extension a project turns on when it has these files, so core
    names no language and a project that doesn't use one sees none of it.
  origin: null
  examples:
    - name: go-definitions-get-their-ids
      input: { language: go }
      expect: every definition and its id
    - name: go-grouped-names-are-definitions-and-locals-are-not
      input: { language: go }
      expect: group names count and locals do not
    - name: go-a-method-does-not-count-its-receiver-as-a-parameter
      input: { language: go }
      expect: a method's parameters and complexity
    - name: go-capitals-are-public-and-any-comment-is-a-doc
      input: { language: go }
      expect: visibility and doc of functions
    - name: go-imports-read-single-and-grouped-imports
      input: { language: go }
      expect: each import path
    - name: go-go-mod-is-a-dependency-manifest
      input: { language: go }
      expect: the file kind a path has
test_conventions:
  - id: go-tests
    languages: [go]
    paths: ['**/*_test.go']
    assertions: ['\bt\.(?:Error|Errorf|Fatal|Fatalf)\b', '\brequire\.[A-Z]']
    skips: ['\bt\.(?:Skip|Skipf|SkipNow)\b']
file_kinds:
  - { id: go-dependency-manifest, kind: dependency-manifest, label: Dependency manifest, globs: ['**/go.mod', '**/go.work'] }
  - { id: go-lockfile, kind: lockfile, label: Lockfile, globs: ['**/go.sum', '**/go.work.sum'] }
  - { id: go-lint-config, kind: lint-config, label: Lint config, globs: ['**/.golangci.yml', '**/.golangci.yaml'] }
  - { id: go-test-harness, kind: test-harness, label: Test harness, globs: ['**/testdata/**'] }
run_patterns:
  - { id: go-test, kind: test, patterns: ['go test'] }
  - { id: go-analysis, kind: analysis, patterns: ['golangci-lint', 'staticcheck', 'go vet'] }
skills:
  - { name: setup-go-reports, file: skills/setup-go-reports/SKILL.md }
languages:
  - id: go
    title: "Go"
    extensions: [go]
    aliases: ["golang"]
    grammar: { native: go }
    analysis: languages/go/analysis.yaml
    symbols: languages/go/symbols.scm
    lsp: { package: gopls }
    units: [class, package]
    # How the metric scaffold writes a sample function.
    starter:
      function: "func {name}(x int) int {"
      branch: ["    if x == {n} { return {n} }"]
      tail: ["    return 0", "}"]
