# The Go pack's test conventions: `*_test.go` is a test file, `t.Errorf` and `require.<Name>` assertions, `t.Skip` a skip.
requires: [oxplow-go]
given:
  - observe: { turn: { prompt: base, write: { path: README.md, body: "base\n" } } }
  - { command: oxplow.vcs.stage, input: { stream: str1, paths: [README.md] } }
  - { command: oxplow.vcs.commit, input: { stream: str1, message: base } }
  - observe: { turn: { prompt: add the test file, write: { path: pkg/util_test.go, body: "package pkg\n\nfunc helper(t *testing.T) {\n\tt.Errorf(\"x\")\n\trequire.Equal(t, 1, 1)\n\tt.Skip(\"later\")\n}\n" } } }
  - { command: oxplow.vcs.stage, input: { stream: str1, paths: [pkg/util_test.go] } }
  - { command: oxplow.vcs.commit, input: { stream: str1, message: Add the test file }, bind: change }
  - observe: { commit: { sha: $change.rev, subject: Add the test file } }
  - observe: { analyze: { kind: commit, sha: $change.rev } }
when: { sql: "SELECT path, tests_after, assertions_after, skips_after FROM v_change_test_file" }
expect: { rows: [{ path: pkg/util_test.go, tests_after: 1, assertions_after: 2, skips_after: 1 }] }
