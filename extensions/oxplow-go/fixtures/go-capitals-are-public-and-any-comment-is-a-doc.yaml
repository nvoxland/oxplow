# A name that starts with a capital letter is public, any other is private.
# Any comment right before a function is its doc.
when:
  language: go
  path: main.go
  body: "package main\n\n// Documented is documented (Go convention: any preceding comment).\nfunc Documented() {}\n\nfunc Undocumented() {}\n\nfunc privateFn() {}\n"
expect:
  functions:
    - { name: Documented, visibility: public, has_doc: true }
    - { name: Undocumented, visibility: public, has_doc: false }
    - { name: privateFn, visibility: private, has_doc: false }
