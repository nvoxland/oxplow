manifest: 2
name: oxplow-code-metrics
# Its metrics and measures are oxplow's own: `oxplow.<key>`, like foundation's.
namespace: oxplow
description: The code metrics oxplow measures from each snapshot's tree — TODO markers, function count, complexity and length, doc coverage, duplicated lines, and idiom counts for Rust, TypeScript, Clojure and C#.
version: 0.1.0
engine: ">=0.7"
# Its collectors read the project's files.
permissions: [files.read]
intent:
  purpose: >-
    Measure the code itself from each snapshot: how many TODO/FIXME markers
    there are, how many functions and how complex or long they are, how much
    of the public API carries a doc comment, how many lines are duplicated,
    and counts of language idioms worth watching (unsafe blocks, `any`,
    empty catch blocks). The four behind `v_function` (function count,
    complexity, length, parameter count) and the TODO count are on by
    default; the rest are opt-in (`metrics: - use: <key>` in project.yaml).
    Turning this extension off leaves oxplow without them.
  origin: null
  examples:
    - name: rust-unsafe-blocks-are-counted-per-file-and-tagged-with-their-rule
      input: { collector: oxplow.rust.unsafe_blocks }
      expect: Rust — each file with unsafe blocks has one ast_hit fact tagged unsafe_block (src/a.rs has 2, src/b.rs none, the README is skipped)
    - name: rust-unwrap-and-expect-calls-are-counted
      input: { collector: oxplow.rust.unwrap_expect_calls }
      expect: Rust — unwrap and expect calls are counted per file
    - name: rust-panic-todo-and-path-qualified-panic-macros-are-counted
      input: { collector: oxplow.rust.panic_macros }
      expect: Rust — panic!, todo! and std — —panic! count (the scoped form too)
    - name: ts-any-annotations-are-counted
      input: { collector: oxplow.ts.any_usage }
      expect: TypeScript — every `any` annotation counts
    - name: ts-non-null-assertions-are-counted
      input: { collector: oxplow.ts.non_null_assertions }
      expect: TypeScript — non-null assertions count
    - name: ts-console-calls-are-counted-including-namespaced-ones
      input: { collector: oxplow.ts.console_calls }
      expect: TypeScript — console calls count, window.console too
    - name: ts-ignore-and-expect-error-comments-are-counted
      input: { collector: oxplow.ts.ts_ignore }
      expect: TypeScript — @ts-ignore and @ts-expect-error comments count
    - name: doc-coverage-is-documented-public-over-public
      input: { collector: oxplow.doc_coverage }
      expect: one ratio fact per file — documented public functions over public ones
    - name: clojure-defn-count-counts-heads-only
      input: { collector: oxplow.clojure.defn_count }
      expect: defn and defn- heads count; a local named defn does not
    - name: every-function-gets-a-complexity-fact-across-languages
      input: { collector: oxplow.high_complexity_fns }
      expect: one complexity fact per function in every language
    - name: every-function-gets-a-length-fact-across-languages
      input: { collector: oxplow.long_functions }
      expect: one length fact per function in every language
    - name: every-function-gets-a-parameter-count-fact
      input: { collector: oxplow.fn_count }
      expect: one parameter-count fact per function
    - name: todo-and-fixme-comments-are-counted-across-languages
      input: { collector: oxplow.todos }
      expect: one todo fact per marker comment; a README is not source
    - name: csharp-empty-catch-blocks-are-counted
      input: { collector: oxplow.csharp.empty_catch }
      expect: C# — empty catch blocks count
    - name: csharp-blocking-async-calls-are-counted
      input: { collector: oxplow.csharp.blocking_async_calls }
      expect: C# — .Result and invoked .Wait() count, a method-group reference does not
    - name: duplicate-lines-restates-both-sides-of-every-duplicate-block
      input: { collector: oxplow.duplicate_lines }
      expect: both sides of a duplicate block are facts on their own block
# The fact types only these collectors write. Complexity, function length and
# parameter count stay oxplow-foundation's: core's change analysis records
# them too.
measures:
  - {"key": "oxplow.todo", "title": "TODO markers", "unit": "count", "subjectKind": "file", "temporalSemantics": "semi-additive", "fold": "last", "captureScope": "per-path"}
  - {"key": "oxplow.duplicate_lines", "title": "Duplicated lines", "unit": "lines", "subjectKind": "symbol", "temporalSemantics": "semi-additive", "fold": "last", "captureScope": "complete"}
  - {"key": "oxplow.ast_hit", "title": "AST idiom hits", "unit": "count", "subjectKind": "file", "temporalSemantics": "semi-additive", "fold": "last", "captureScope": "per-path"}
  - {"key": "oxplow.doc_coverage", "title": "Doc coverage", "unit": "%", "subjectKind": "file", "temporalSemantics": "semi-additive", "fold": "last", "captureScope": "per-path"}
collectors:
  # Scripts over the snapshot's tree, through the same public surface
  # (`source_files()`, `code_metrics()`, `ast_query()`) any collector has.
  # Each one's metrics name it, so it runs only while one is on.
  # A whole-tree scan is minutes of CPU on a large tree, and a commit or
  # rebase moves several refs at once: one scan of the latest tree once
  # they settle, on a uri move (`trigger: git_refs`) rather than every save.
  - { id: oxplow.todos, doc: "TODO / FIXME markers", runtime: starlark, entry: collectors/code/todos.star, on: [snapshot.taken], facts: [oxplow.todo] }
  - { id: oxplow.fn_count, doc: "function count", runtime: starlark, entry: collectors/code/fn_count.star, on: [snapshot.taken], facts: [oxplow.parameter_count] }
  - { id: oxplow.high_complexity_fns, doc: "high-complexity functions", runtime: starlark, entry: collectors/code/high_complexity_fns.star, on: [snapshot.taken], facts: [oxplow.complexity] }
  - { id: oxplow.long_functions, doc: "long functions (>60 lines)", runtime: starlark, entry: collectors/code/long_functions.star, on: [snapshot.taken], facts: [oxplow.fn_length] }
  - { id: oxplow.doc_coverage, doc: "Doc coverage", runtime: starlark, entry: collectors/code/doc_coverage.star, on: [snapshot.taken], facts: [oxplow.doc_coverage] }
  - { id: oxplow.duplicate_lines, doc: "Duplicated lines", runtime: starlark, entry: collectors/code/duplicate_lines.star, whole_tree: true, on: [snapshot.taken], where: { trigger: git_refs }, settle: 60s, at_most: 15m, facts: [oxplow.duplicate_lines] }
  - { id: oxplow.rust.unsafe_blocks, doc: "unsafe blocks", runtime: starlark, entry: collectors/rust/unsafe_blocks.star, on: [snapshot.taken], facts: [oxplow.ast_hit] }
  - { id: oxplow.rust.unwrap_expect_calls, doc: "unwrap / expect calls", runtime: starlark, entry: collectors/rust/unwrap_expect_calls.star, on: [snapshot.taken], facts: [oxplow.ast_hit] }
  - { id: oxplow.rust.panic_macros, doc: "panic-family macros", runtime: starlark, entry: collectors/rust/panic_macros.star, on: [snapshot.taken], facts: [oxplow.ast_hit] }
  - { id: oxplow.ts.any_usage, doc: "any usage", runtime: starlark, entry: collectors/ts/any_usage.star, on: [snapshot.taken], facts: [oxplow.ast_hit] }
  - { id: oxplow.ts.non_null_assertions, doc: "non-null assertions", runtime: starlark, entry: collectors/ts/non_null_assertions.star, on: [snapshot.taken], facts: [oxplow.ast_hit] }
  - { id: oxplow.ts.console_calls, doc: "console.* calls", runtime: starlark, entry: collectors/ts/console_calls.star, on: [snapshot.taken], facts: [oxplow.ast_hit] }
  - { id: oxplow.ts.ts_ignore, doc: "ts-ignore / ts-expect-error", runtime: starlark, entry: collectors/ts/ts_ignore.star, on: [snapshot.taken], facts: [oxplow.ast_hit] }
  - { id: oxplow.clojure.defn_count, doc: "defn count", runtime: starlark, entry: collectors/clojure/defn_count.star, on: [snapshot.taken], facts: [oxplow.ast_hit] }
  - { id: oxplow.csharp.empty_catch, doc: "empty catch blocks", runtime: starlark, entry: collectors/csharp/empty_catch.star, on: [snapshot.taken], facts: [oxplow.ast_hit] }
  - { id: oxplow.csharp.blocking_async_calls, doc: "blocking async calls (.Result / .Wait())", runtime: starlark, entry: collectors/csharp/blocking_async_calls.star, on: [snapshot.taken], facts: [oxplow.ast_hit] }
metrics:
  - { key: oxplow.todos, title: "TODO / FIXME markers", sourceMeasure: oxplow.todo, aggregation: count, unit: "count", direction: lower-better, displayKind: gauge, category: static-quality, description: "TODO/FIXME/HACK/XXX/BUG markers in comments, across all languages.", sliceableDims: [oxplow.package, oxplow.language, oxplow.vcs_rev], collector: oxplow.todos }
  - { key: oxplow.fn_count, title: "function count", sourceMeasure: oxplow.parameter_count, aggregation: count, unit: "count", direction: neutral, displayKind: gauge, category: static-quality, description: "Total functions / methods defined, across all languages.", sliceableDims: [oxplow.package, oxplow.language, oxplow.vcs_rev], collector: oxplow.fn_count }
  - { key: oxplow.high_complexity_fns, title: "high-complexity functions", sourceMeasure: oxplow.complexity, aggregation: count, filter: { minValue: 11.0 }, unit: "count", direction: lower-better, displayKind: gauge, category: static-quality, description: "Functions whose cyclomatic complexity exceeds the threshold, across all languages.", sliceableDims: [oxplow.package, oxplow.language, oxplow.vcs_rev], collector: oxplow.high_complexity_fns }
  - { key: oxplow.long_functions, title: "long functions (>60 lines)", sourceMeasure: oxplow.fn_length, aggregation: count, filter: { minValue: 61.0 }, unit: "count", direction: lower-better, displayKind: gauge, category: static-quality, description: "Functions longer than 60 lines, across all languages.", sliceableDims: [oxplow.package, oxplow.language, oxplow.vcs_rev], collector: oxplow.long_functions }
  - { key: oxplow.doc_coverage, title: "Doc coverage", sourceMeasure: oxplow.doc_coverage, aggregation: ratio, unit: "%", direction: higher-better, displayKind: coverage, category: coverage, description: "% of public functions/methods carrying a doc comment (or docstring), across all languages.", sliceableDims: [oxplow.package, oxplow.language, oxplow.vcs_rev], collector: oxplow.doc_coverage, default: off }
  - { key: oxplow.duplicate_lines, title: "Duplicated lines", sourceMeasure: oxplow.duplicate_lines, aggregation: sum, unit: "lines", direction: lower-better, displayKind: findings, category: static-quality, description: "Lines in blocks duplicated elsewhere in the tree, both sides of each copy.", sliceableDims: [oxplow.vcs_rev], collector: oxplow.duplicate_lines, default: off }
  - { key: oxplow.rust.unsafe_blocks, title: "unsafe blocks", sourceMeasure: oxplow.ast_hit, aggregation: sum, filter: { dimEq: [oxplow.rule, unsafe_block] }, unit: count, direction: lower-better, displayKind: gauge, category: static-quality, language: rust, description: "Count of `unsafe` blocks in the codebase.", sliceableDims: [oxplow.package, oxplow.language, oxplow.vcs_rev], target: 0.0, collector: oxplow.rust.unsafe_blocks, default: off }
  - { key: oxplow.rust.unwrap_expect_calls, title: "unwrap / expect calls", sourceMeasure: oxplow.ast_hit, aggregation: sum, filter: { dimEq: [oxplow.rule, unwrap_expect] }, unit: count, direction: lower-better, displayKind: gauge, category: static-quality, language: rust, description: "Calls to `.unwrap()` / `.expect()` that can panic at runtime.", sliceableDims: [oxplow.package, oxplow.language, oxplow.vcs_rev], collector: oxplow.rust.unwrap_expect_calls, default: off }
  - { key: oxplow.rust.panic_macros, title: "panic-family macros", sourceMeasure: oxplow.ast_hit, aggregation: sum, filter: { dimEq: [oxplow.rule, panic_macro] }, unit: count, direction: lower-better, displayKind: gauge, category: static-quality, language: rust, description: "Uses of `panic!` / `unreachable!` / `todo!` and similar panic macros.", sliceableDims: [oxplow.package, oxplow.language, oxplow.vcs_rev], collector: oxplow.rust.panic_macros, default: off }
  - { key: oxplow.ts.any_usage, title: "any usage", sourceMeasure: oxplow.ast_hit, aggregation: sum, filter: { dimEq: [oxplow.rule, any_usage] }, unit: count, direction: lower-better, displayKind: gauge, category: static-quality, language: typescript, description: "Uses of the `any` type.", sliceableDims: [oxplow.package, oxplow.language, oxplow.vcs_rev], collector: oxplow.ts.any_usage, default: off }
  - { key: oxplow.ts.non_null_assertions, title: "non-null assertions", sourceMeasure: oxplow.ast_hit, aggregation: sum, filter: { dimEq: [oxplow.rule, non_null_assertion] }, unit: count, direction: lower-better, displayKind: gauge, category: static-quality, language: typescript, description: "Non-null assertions (`!`).", sliceableDims: [oxplow.package, oxplow.language, oxplow.vcs_rev], collector: oxplow.ts.non_null_assertions, default: off }
  - { key: oxplow.ts.console_calls, title: "console.* calls", sourceMeasure: oxplow.ast_hit, aggregation: sum, filter: { dimEq: [oxplow.rule, console_call] }, unit: count, direction: lower-better, displayKind: gauge, category: static-quality, language: typescript, description: "Calls to `console.*`.", sliceableDims: [oxplow.package, oxplow.language, oxplow.vcs_rev], collector: oxplow.ts.console_calls, default: off }
  - { key: oxplow.ts.ts_ignore, title: "ts-ignore / ts-expect-error", sourceMeasure: oxplow.ast_hit, aggregation: sum, filter: { dimEq: [oxplow.rule, ts_ignore] }, unit: count, direction: lower-better, displayKind: gauge, category: static-quality, language: typescript, description: "`@ts-ignore` / `@ts-expect-error` suppressions.", sliceableDims: [oxplow.package, oxplow.language, oxplow.vcs_rev], collector: oxplow.ts.ts_ignore, default: off }
  - { key: oxplow.clojure.defn_count, title: "defn count", sourceMeasure: oxplow.ast_hit, aggregation: sum, filter: { dimEq: [oxplow.rule, defn] }, unit: count, direction: neutral, displayKind: gauge, category: static-quality, language: clojure, description: "Number of `defn` definitions.", sliceableDims: [oxplow.package, oxplow.language, oxplow.vcs_rev], collector: oxplow.clojure.defn_count, default: off }
  - { key: oxplow.csharp.empty_catch, title: "empty catch blocks", sourceMeasure: oxplow.ast_hit, aggregation: sum, filter: { dimEq: [oxplow.rule, empty_catch] }, unit: count, direction: lower-better, displayKind: gauge, category: static-quality, language: csharp, description: "Empty `catch` blocks that swallow exceptions.", sliceableDims: [oxplow.package, oxplow.language, oxplow.vcs_rev], collector: oxplow.csharp.empty_catch, default: off }
  - { key: oxplow.csharp.blocking_async_calls, title: "blocking async calls (.Result / .Wait())", sourceMeasure: oxplow.ast_hit, aggregation: sum, filter: { dimEq: [oxplow.rule, blocking_async] }, unit: count, direction: lower-better, displayKind: gauge, category: static-quality, language: csharp, description: "Blocking calls on async code (`.Result` / `.Wait()`).", sliceableDims: [oxplow.package, oxplow.language, oxplow.vcs_rev], collector: oxplow.csharp.blocking_async_calls, default: off }
