title: Extension runs
description: "What each extension did in the last 7 days: runs, failures, denials, mean CPU and model calls. The ones needing attention come first; open one for its runs."
query: |
  SELECT extension,
         lens_ref('oxplow-bundled/extension-runs', 'extension', extension) AS runs_ref,
         count(*) AS runs,
         sum(outcome = 'failed') AS failures,
         sum(outcome = 'denied') AS denials,
         round(avg(cpu_ms), 1) AS mean_cpu_ms,
         sum(ai_calls) AS ai_calls
  FROM v_extension_run
  WHERE started_at >= strftime('%Y-%m-%dT%H:%M:%fZ', 'now', '-7 days')
  GROUP BY extension
  ORDER BY failures DESC, denials DESC, runs DESC, extension
viz: table
columns:
  - { key: extension, label: Extension, link: { kind: page, from: runs_ref } }
  - { key: runs, label: Runs }
  - { key: failures, label: Failed }
  - { key: denials, label: Denied }
  - { key: mean_cpu_ms, label: Mean CPU (ms) }
  - { key: ai_calls, label: Model calls }
empty: No extension has run in the last 7 days.
launcher: { category: Activity }
