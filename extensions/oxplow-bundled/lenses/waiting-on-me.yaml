title: Waiting on Me
description: Questions your agents are waiting on you to answer, blocked tasks, and open notes-to-self across the project.
query: |
  WITH asked AS (
    SELECT thread_id, detail, at,
           row_number() OVER (PARTITION BY thread_id ORDER BY at DESC, id DESC) AS rn
    FROM v_tool_call
    WHERE tool LIKE '%await_user'
  ),
  last_turn AS (
    SELECT thread_id, max(started_at) AS started_at FROM v_agent_turn GROUP BY thread_id
  )
  SELECT * FROM (
  SELECT 'Waiting for your answer' AS what, coalesce(a.detail, 'A question') AS title,
         NULL AS task_id, t.title AS thread, a.at AS since
  FROM asked a
  JOIN v_thread t ON t.id = a.thread_id
  LEFT JOIN last_turn lt ON lt.thread_id = a.thread_id
  WHERE a.rn = 1 AND t.status <> 'closed'
    AND (lt.started_at IS NULL OR lt.started_at < a.at)
  UNION ALL
  SELECT 'Blocked task', title, id, NULL, updated_at
  FROM v_task WHERE status = 'blocked'
  UNION ALL
  SELECT 'Open note', coalesce(body, quote), NULL, NULL, last_activity_at
  FROM v_comment WHERE status = 'open' AND intent = 'note'
  )
  ORDER BY what = 'Waiting for your answer' DESC, since DESC
viz: table
columns:
  - { key: what, label: What }
  - { key: title, label: Item, link: { kind: task, from: task_id } }
  - { key: thread, label: Thread }
  - { key: since, label: Since }
empty: Nothing is waiting on you.
alert: { min_rows: 1, label: Waiting on you }
