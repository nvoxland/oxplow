title: Thread Activity
description: What a thread's agent did, turn by turn, under the effort each turn fell in — its prompt (or the other agent session whose message opened it), the session it ran in, the model and effort it ran on, how full its context was and how often it compacted, the files it touched, the test runs and the tokens — with the turns outside any effort (questions, talk) between them. Open an effort to rename it, link it to a task or close it.
params:
  - { name: thread_id, label: Thread }
query: |
  WITH turns AS (
    SELECT t.id, t.ref, t.thread_id, t.agent_session_id, t.started_at, t.ended_at,
           nullif(trim(coalesce(t.model, '') || ' ' || coalesce(t.effort, '')), '') AS ran_on,
           -- Tokens in the context at the turn's end, of the window when the harness gave one.
           CASE WHEN t.context_tokens IS NULL THEN NULL
                WHEN t.context_window IS NULL THEN (t.context_tokens / 1000) || 'k'
                ELSE (t.context_tokens / 1000) || 'k of ' || (t.context_window / 1000) || 'k ('
                     || (100 * t.context_tokens / t.context_window) || '%)' END AS context,
           t.from_peer,
           trim(CASE WHEN instr(t.prompt, char(10)) > 0
                     THEN substr(t.prompt, 1, instr(t.prompt, char(10)) - 1)
                     ELSE t.prompt END) AS prompt,
           -- The latest effort the turn overlaps (one may open mid-turn).
           (SELECT e.id FROM v_effort e
             WHERE e.thread_id = t.thread_id
               AND e.started_at <= coalesce(t.ended_at, t.started_at)
               AND (e.ended_at IS NULL OR e.ended_at >= t.started_at)
             ORDER BY e.started_at DESC LIMIT 1) AS effort_id
    FROM v_agent_turn t
    WHERE t.thread_id = :thread_id
  )
  SELECT coalesce(e.title, CASE WHEN u.effort_id IS NULL THEN 'Between efforts' ELSE 'Work' END) AS section,
         coalesce(nullif(u.prompt, ''),
                  CASE WHEN u.from_peer IS NOT NULL THEN 'Message from ' || u.from_peer END,
                  '(no prompt)') AS prompt,
         CASE WHEN u.agent_session_id IS NOT NULL THEN 'Session ' || u.agent_session_id END AS session,
         u.ran_on,
         u.context,
         (SELECT count(*) FROM v_event ev
           WHERE ev.type = 'agent.context.compacted' AND ev.turn_id = u.id) AS compactions,
         (SELECT count(DISTINCT c.path) FROM v_tool_call c WHERE c.turn_id = u.id AND c.path IS NOT NULL) AS files,
         (SELECT count(*) FROM v_test_run r WHERE r.turn_id = u.id) AS runs,
         (SELECT sum(k.input_tokens + k.output_tokens + k.cache_creation_input_tokens + k.cache_read_input_tokens)
            FROM v_token_usage k WHERE k.turn_id = u.id) AS tokens,
         u.started_at AS at,
         u.ref AS turn_ref,
         e.ref AS effort_ref
  FROM turns u
  LEFT JOIN v_effort e ON e.id = u.effort_id
  ORDER BY u.started_at DESC, u.id DESC
viz: list
group: { by: section, link: { kind: page, from: effort_ref } }
columns:
  - { key: prompt, label: Turn, link: { kind: page, from: turn_ref } }
  - { key: session, label: Session }
  - { key: ran_on, label: Model }
  - { key: context, label: Context }
  - { key: compactions, label: Compacted }
  - { key: files, label: Files }
  - { key: runs, label: Runs }
  - { key: tokens, label: Tokens }
  - { key: at, label: When }
actions:
  - { id: close, label: Close Effort, command: oxplow.effort.close, input: { effort: "{{row.effort_ref}}" }, row: true }
empty: No turns on this thread yet.
