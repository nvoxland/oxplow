title: Unverified Claims
description: Things the agent said about its work that nothing backs up.
hidden: true    # needs a slot param (effort_id / change_id); shown on the diff
params:
  - { name: effort_id, label: Effort }
query: |
  SELECT c.statement, c.kind, c.ref AS claim
  FROM v_claim c JOIN v_oxplow_bundled_claim_status s ON s.ref = c.ref
  WHERE c.effort_id = :effort_id AND s.verified = 0
  ORDER BY c.created_at
viz: list
columns:
  - { key: statement, label: Claim }
  - { key: kind, label: Kind }
actions:
  - { id: verify, label: Mark Verified, command: oxplow.effort.verify_claim, input: { claim: "{{row.claim}}" }, row: true }
empty: Every claim for this effort is backed by evidence (or none were made).
