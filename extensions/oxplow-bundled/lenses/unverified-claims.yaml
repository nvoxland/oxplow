title: Unverified Claims
description: Things the agent said about its work that nothing backs up — the ones it stated in its report and the ones a model read in its answers. Mark one verified once you've checked it, dismiss one the agent didn't make or didn't mean (it stops counting), or reopen a dismissed one.
hidden: true    # needs a slot param (effort_id / change_id); shown on the diff
params:
  - { name: effort_id, label: Effort }
query: |
  SELECT c.statement, c.kind,
         CASE WHEN c.provenance = 'recorded' THEN 'Stated' ELSE 'Read' END AS source,
         CASE WHEN c.review = 'dismissed' THEN 'Dismissed' ELSE 'Unverified' END AS state,
         c.evidence, c.id AS claim
  FROM v_claim c LEFT JOIN v_oxplow_bundled_claim_status s ON s.uri = c.uri
  WHERE c.effort_id = :effort_id AND (s.verified = 0 OR c.review = 'dismissed')
  ORDER BY c.review IS NOT NULL, c.created_at
viz: list
columns:
  - { key: statement, label: Claim }
  - { key: kind, label: Kind }
  - { key: source, label: Source }
  - { key: state, label: Review }
  - { key: evidence, label: Cites }
actions:
  - { id: verify, label: Mark Verified, command: oxplow.effort.verify_claim, input: { claim: "{{row.claim}}" }, row: true }
  - { id: dismiss, label: Dismiss, command: oxplow.effort.dismiss_claim, input: { claim: "{{row.claim}}" }, row: true }
  - { id: reopen, label: Reopen, command: oxplow.effort.reopen_claim, input: { claim: "{{row.claim}}" }, row: true }
empty: Every claim for this effort is backed by evidence (or none were made).
