title: Work count
description: How much work the thread has open — the item in progress and the ready ones.
hidden: true
params:
  - { name: thread_id, label: Thread }
query: |
  SELECT (SELECT count(*) > 0 FROM v_oxplow_bundled_thread_work WHERE thread_id = :thread_id AND grp = 'In progress')
       + (SELECT min(count(*), 50) FROM v_work_item w
          WHERE w.thread_id = :thread_id AND w.state = 'todo'
            AND NOT EXISTS (SELECT 1 FROM v_work_item c WHERE c.parent_ref = w.ref))
       AS open
viz: number
