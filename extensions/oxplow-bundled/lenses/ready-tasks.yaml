title: Ready
query: |
  SELECT w.ref, w.title, th.title AS thread
  FROM v_work_item w JOIN v_thread th ON th.id = w.thread_id
  WHERE w.state = 'todo'
  ORDER BY th.sort_index, w.rank IS NULL, w.rank, w.created_at
  LIMIT 50
columns:
  - { key: title, label: Item, link: { kind: page, from: ref } }
  - { key: thread, label: Thread }
empty: Nothing is ready.
hidden: true
