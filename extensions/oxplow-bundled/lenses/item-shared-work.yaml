title: Shared work
description: Whether another thread holds this item, changed the files its efforts changed, or holds a sibling under its epic.
params: [{ name: ref }]
query: |
  WITH open_work AS (
    SELECT e.id AS effort_id, e.thread_id, e.work_item, t.title AS thread_title,
           e.ended_at IS NULL AS is_open
    FROM v_effort e JOIN v_thread t ON t.id = e.thread_id
    WHERE e.ended_at IS NULL OR julianday(e.ended_at) >= julianday('now') - 1
  ), shared AS (
    SELECT 'Items on two threads' AS section, w.title AS what, w.ref AS ref,
           group_concat(DISTINCT o.thread_title) AS threads,
           group_concat(DISTINCT o.thread_id) AS thread_ids
    FROM open_work o JOIN v_work_item w ON w.ref = o.work_item
    WHERE o.is_open
    GROUP BY w.ref HAVING count(DISTINCT o.thread_id) >= 2
    UNION ALL
    SELECT 'Files two threads changed', f.path, NULL,
           group_concat(DISTINCT o.thread_title), group_concat(DISTINCT o.thread_id)
    FROM v_effort_file f JOIN open_work o ON o.effort_id = f.effort_id
    GROUP BY f.path HAVING count(DISTINCT o.thread_id) >= 2
    UNION ALL
    SELECT 'Epics spread over threads', p.title, p.ref,
           group_concat(DISTINCT t.title), group_concat(DISTINCT c.thread_id)
    FROM v_work_item c JOIN v_work_item p ON p.ref = c.parent_ref JOIN v_thread t ON t.id = c.thread_id
    WHERE c.thread_id IS NOT NULL AND c.closed_at IS NULL
    GROUP BY p.ref HAVING count(DISTINCT c.thread_id) >= 2
  )
  SELECT section, what, threads, ref FROM shared
  WHERE (section = 'Items on two threads' AND ref = :ref)
     OR (section = 'Files two threads changed' AND what IN (
           SELECT f.path FROM v_effort_file f JOIN v_effort e ON e.id = f.effort_id
           WHERE e.work_item = :ref))
     OR (section = 'Epics spread over threads'
         AND ref = (SELECT parent_ref FROM v_work_item WHERE ref = :ref))
  ORDER BY section, what
viz: list
group: { by: section }
columns:
  - { key: what, label: What, link: { kind: page, from: ref } }
  - { key: threads, label: Threads }
empty: Nothing is shared across threads.
hidden: true
