title: Command Runs
description: The commands agents ran in the last 30 days, with how many were refused as invalid, denied or failed. Open a command for its most common errors. The worst-behaved come first.
query: |
  SELECT command,
         lens_ref('oxplow-bundled/interface-command-errors', 'command', command) AS errors_ref,
         count(*) AS runs,
         sum(outcome = 'invalid') AS invalid,
         sum(outcome = 'denied') AS denied,
         sum(outcome = 'error') AS errors,
         round(100.0 * sum(outcome <> 'ok') / count(*), 1) AS refused_pct
  FROM v_command_audit
  WHERE actor_kind = 'agent'
    AND at >= strftime('%Y-%m-%dT%H:%M:%fZ', 'now', '-30 days')
  GROUP BY command
  ORDER BY sum(outcome <> 'ok') DESC, runs DESC, command
viz: table
columns:
  - { key: command, label: Command, link: { kind: page, from: errors_ref } }
  - { key: runs, label: Runs }
  - { key: invalid, label: Invalid }
  - { key: denied, label: Denied }
  - { key: errors, label: Failed }
  - { key: refused_pct, label: Not ok (%) }
empty: No agent has run a command in the last 30 days.
hidden: true
