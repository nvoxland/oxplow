title: Tokens per Day
query: |
  SELECT substr(recorded_at, 1, 10) AS day,
         sum(input_tokens + output_tokens + cache_creation_input_tokens + cache_read_input_tokens) AS tokens
  FROM v_token_usage
  WHERE recorded_at >= strftime('%Y-%m-%dT%H:%M:%SZ', 'now', '-30 days')
  GROUP BY day
  ORDER BY day
viz: bar
chart: { x: day, y: tokens }
empty: No tokens in the last 30 days.
hidden: true
