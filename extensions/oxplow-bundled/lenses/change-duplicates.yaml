title: Duplication
description: Blocks in the changed files that duplicate code elsewhere. Found in the background, so they can arrive after the rest.
params: [{ name: change_id }]
query: |
  SELECT d.path, d.start_line, d.lines, d.peer_path,
         d.path || ':' || d.start_line || '-' || d.end_line || '|'
           || d.peer_path || ':' || d.peer_start_line || '-' || d.peer_end_line AS pair,
         c.head_revision
  FROM v_change_duplicate d JOIN v_change c ON c.id = d.change_id
  WHERE d.change_id = :change_id
  ORDER BY d.lines DESC, d.path, d.start_line
columns:
  - { key: path, label: File, link: { kind: compare, from: pair, head: head_revision } }
  - { key: start_line, label: Line }
  - { key: lines, label: Lines }
  - { key: peer_path, label: Copy Of }
empty: No duplicated blocks.
hidden: true
