title: Job Runs
description: Each run of a job an extension declares — running and queued first, then the last day's — with what each attempt has used so far. A job is what an extension declares; a job run is one execution of it. Open one to follow its output; Cancel stops it.
query: |
  SELECT ref,
         lens_ref('oxplow-bundled/job-run-output', 'job_run', ref) AS output_ref,
         job,
         intent_key,
         state,
         attempt,
         ai_calls,
         tool_calls,
         input_tokens + output_tokens AS tokens,
         created_at,
         updated_at
  FROM v_job_run
  WHERE state IN ('queued', 'running')
     OR updated_at >= strftime('%Y-%m-%dT%H:%M:%fZ', 'now', '-1 day')
  ORDER BY state NOT IN ('queued', 'running'), updated_at DESC
viz: table
columns:
  - { key: job, label: Job, link: { kind: page, from: output_ref } }
  - { key: intent_key, label: About }
  - { key: state, label: State }
  - { key: attempt, label: Attempt }
  - { key: ai_calls, label: Model rounds }
  - { key: tool_calls, label: Tool calls }
  - { key: tokens, label: Tokens }
  - { key: created_at, label: Started }
  - { key: updated_at, label: Changed }
actions:
  - { id: cancel, label: Cancel, command: oxplow.job_run.cancel, input: { job_run: "{{row.ref}}" }, row: true }
empty: No job has run in the last day.
launcher: { category: Activity }
