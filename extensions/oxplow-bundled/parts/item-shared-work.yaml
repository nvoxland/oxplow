title: Shared work
description: Whether another thread holds this item, changed the files its efforts changed, or holds a sibling under its epic.
params:
- name: uri
loaders:
  item_shared_work:
    sql: |
      WITH open_work AS (
        SELECT e.id AS effort_id, e.thread_id, e.task, t.title AS thread_title,
               e.ended_at IS NULL AS is_open
        FROM v_effort e JOIN v_thread t ON t.id = e.thread_id
        WHERE e.ended_at IS NULL OR julianday(e.ended_at) >= julianday('now') - 1
      ), shared AS (
        SELECT 'Items on two threads' AS section, w.title AS what, w.uri AS uri,
               group_concat(DISTINCT o.thread_title) AS threads,
               group_concat(DISTINCT o.thread_id) AS thread_ids
        FROM open_work o JOIN v_task w ON w.uri = o.task
        WHERE o.is_open
        GROUP BY w.uri HAVING count(DISTINCT o.thread_id) >= 2
        UNION ALL
        SELECT 'Files two threads changed', f.path, NULL,
               group_concat(DISTINCT o.thread_title), group_concat(DISTINCT o.thread_id)
        FROM v_effort_file f JOIN open_work o ON o.effort_id = f.effort_id
        GROUP BY f.path HAVING count(DISTINCT o.thread_id) >= 2
        UNION ALL
        SELECT 'Epics spread over threads', p.title, p.uri,
               group_concat(DISTINCT t.title), group_concat(DISTINCT t.id)
        FROM v_task c JOIN v_task p ON p.uri = c.parent_uri JOIN v_thread t ON t.uri = c.assignee
        WHERE c.closed_at IS NULL
        GROUP BY p.uri HAVING count(DISTINCT t.id) >= 2
      )
      SELECT section, what, threads, uri FROM shared
      WHERE (section = 'Items on two threads' AND uri = :uri)
         OR (section = 'Files two threads changed' AND what IN (
               SELECT f.path FROM v_effort_file f JOIN v_effort e ON e.id = f.effort_id
               WHERE e.task = :uri))
         OR (section = 'Epics spread over threads'
             AND uri = (SELECT parent_uri FROM v_task WHERE uri = :uri))
      ORDER BY section, what
view:
  from: item_shared_work
  viz: list
  group:
    by: section
  columns:
  - key: what
    label: What
    link:
      kind: page
      from: uri
  - key: threads
    label: Threads
  empty: Nothing is shared across threads.
