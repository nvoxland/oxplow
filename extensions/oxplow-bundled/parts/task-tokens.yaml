title: Agent Tokens
description: What the agent was asked while working this task, and what each turn cost, with their total above.
params:
- name: uri
loaders:
  task_turns:
    sql: |
      SELECT u.recorded_at AS at, u.prompt, u.model,
             u.input_tokens + u.output_tokens + u.cache_creation_input_tokens + u.cache_read_input_tokens AS tokens,
             -- The total, the line above the turns.
             printf('%,d tokens over %d turn%s: in %,d, out %,d, cache-write %,d, cache-read %,d.',
                    sum(u.input_tokens + u.output_tokens + u.cache_creation_input_tokens + u.cache_read_input_tokens) OVER (),
                    count(*) OVER (), CASE count(*) OVER () WHEN 1 THEN '' ELSE 's' END,
                    sum(u.input_tokens) OVER (), sum(u.output_tokens) OVER (),
                    sum(u.cache_creation_input_tokens) OVER (), sum(u.cache_read_input_tokens) OVER ()) AS summary
      FROM v_token_usage u JOIN v_effort e ON e.id = u.effort_id
      WHERE e.task = :uri
      ORDER BY u.recorded_at DESC
view:
  id: task-turns
  from: task_turns
  viz: table
  lead: summary
  columns:
  - key: prompt
    label: Prompt
  - key: model
    label: Model
  - key: tokens
    label: Tokens
    format: integer
  - key: at
    label: When
    format: relative
  empty: No turns on it yet.
