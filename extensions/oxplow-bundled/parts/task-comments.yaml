title: Comments
description: "A task's comments, oldest first, and Comment… to add one: where its list keeps comments."
needs:
- model:oxplow/task_record
params:
- name: uri
- name: id
loaders:
  comments:
    sql: |
      SELECT c.id, c.author, c.body, c.created_at
      FROM v_oxplow_task_comment c WHERE c.uri = :uri ORDER BY c.created_at, c.id
view:
  id: comments
  from: comments
  viz: list
  columns:
  - key: body
    label: Says
    format: markdown
  - key: author
    label: Who
  - key: created_at
    label: When
    format: relative
  empty: No comments.
  actions:
  - id: comment
    label: Comment…
    command: oxtask.task.comment
    form: true
    fixed:
    - id
    input:
      id: '{{param.id}}'
