title: Comments
description: "A work item's comments, oldest first, and Comment… to add one: where its list keeps comments."
needs:
- work_items
- work_items.comments
params:
- name: uri
loaders:
  comments:
    sql: |
      SELECT c.id, c.author, c.body, c.created_at
      FROM v_work_item_comment c WHERE c.uri = :uri ORDER BY c.created_at, c.id
view:
  id: comments
  from: comments
  viz: list
  columns:
  - key: body
    label: Says
    format: markdown
  - key: author
    label: Who
  - key: created_at
    label: When
    format: relative
  empty: No comments.
  actions:
  - id: comment
    label: Comment…
    command: oxplow.work_item.comment
    form: true
    fixed:
    - uri
    input:
      uri: '{{param.uri}}'
