title: Usually Changes With
description: Above a file's diff, the files that usually change with it and that this change leaves alone. Check whether the change forgot them.
params:
- name: path
- name: left
- name: right
loaders:
  co_change:
    sql: |
      -- The change is the one between the diff's two revisions. A file with
      -- no absent partners gives no row.
      SELECT 'Usually changes with: ' || co.expected || ' (unchanged here)' AS text
      FROM v_change c
      JOIN v_oxplow_change_co_change co ON co.change_id = c.id
      WHERE c.base_revision IS :left AND c.head_revision = :right
        AND co.path = :path AND co.reason = 'usual-co-changers-absent'
      LIMIT 1
view:
  from: co_change
  viz: markdown
  markdown: { text: text }
