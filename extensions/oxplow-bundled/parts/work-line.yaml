title: Work (collapsed)
description: The thread's work in one glance — the task in progress (with its epic), or else what finished last.
params:
- name: thread_id
  label: Thread
loaders:
  work_line:
    sql: |
      -- The list read once: whether anything is in progress is a window
      -- over the thread's own lines, not a second read of the list.
      SELECT title, icon, uri, depth, active FROM (
        SELECT w.*, max(w.grp = 'In progress') OVER () AS doing
        FROM v_oxplow_thread_tasks w
        WHERE w.thread_id = :thread_id
      )
      WHERE grp = 'In progress' OR (grp = 'Finished' AND ord = 1 AND NOT doing)
      ORDER BY g, ord
view:
  from: work_line
  viz: list
  depth: depth
  columns:
  - key: title
    label: Task
    icon: icon
    link:
      kind: page
      from: uri
  empty: No active work
