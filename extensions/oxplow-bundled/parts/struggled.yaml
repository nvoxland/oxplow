title: Struggled here
description: In a request, the files the agent edited over and over and the commands that kept failing - likely places for mistakes.
params:
# The Changes page's: a request's, else (a snapshot's, a turn's) nothing.
- name: uri
loaders:
  struggled:
    sql: |
      SELECT subject, kind, count
      FROM v_oxplow_struggle
      WHERE request_id = (SELECT id FROM v_request WHERE uri = :uri)
      ORDER BY count DESC
view:
  from: struggled
  viz: table
  columns:
  - key: subject
    label: Where
  - key: kind
    label: What
  - key: count
    label: Times
  empty: No signs of struggle in this request.
