title: Work (panel)
description: What the thread is working on — its tasks in progress (with their epic) and what each one's request is doing now, the tasks assigned to it next, and the ones it finished.
params:
- name: thread_id
  label: Thread
loaders:
  work:
    sql: |
      SELECT grp, title, icon, uri, depth, active,
             CASE activity WHEN 'running' THEN 'working'
                           WHEN 'waiting_on_person' THEN 'waiting on you'
                           WHEN 'waiting_on_work' THEN 'waiting on its jobs'
                           ELSE '' END AS now
      FROM v_oxplow_thread_tasks
      WHERE thread_id = :thread_id
      ORDER BY g, ord
view:
  from: work
  viz: list
  # In the rail, In progress shows whole and the others two rows each;
  # grown to the rail, ten. Past that, "+N more" grows the panel, then
  # opens the Work page.
  group:
    by: grp
    compact: { Up next: 2, Finished: 2 }
    grown: { Up next: 10, Finished: 10 }
  depth: depth
  columns:
  - key: title
    label: Task
    icon: icon
    link:
      kind: page
      from: uri
  empty: No active work
