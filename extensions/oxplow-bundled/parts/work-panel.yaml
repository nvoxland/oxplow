title: Work (panel)
description: The thread's work — in progress (with its epic), ready next, and recently finished.
params:
- name: thread_id
  label: Thread
loaders:
  work:
    sql: |
      SELECT grp, title, icon, uri, depth, active
      FROM v_oxplow_thread_work
      WHERE thread_id = :thread_id
      ORDER BY g, ord
view:
  from: work
  viz: list
  # In the rail, In progress shows whole and the others two rows each;
  # grown to the rail, ten. Past that, "+N more" grows the panel, then
  # opens the Work page.
  group:
    by: grp
    compact: { Ready: 2, Finished: 2 }
    grown: { Ready: 10, Finished: 10 }
  depth: depth
  columns:
  - key: title
    label: Item
    icon: icon
    link:
      kind: page
      from: uri
  empty: No active work
