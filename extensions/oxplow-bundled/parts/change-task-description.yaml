title: Description
description: "The description of the task a request's changes were made for. Mounted in the Changes page."
params:
- name: uri
- name: end
loaders:
  description:
    sql: |
      SELECT coalesce(w.body, '') AS body
      FROM v_task w
      WHERE coalesce(:end, '') = '' AND uri_resource(:uri) = 'oxplow/request' AND trim(w.body) <> ''
        AND w.uri = (SELECT x.task FROM v_request_task x
                      WHERE x.request_id = CAST(substr(uri_param(:uri, 'id'), 4) AS INTEGER)
                      ORDER BY x.at, x.task LIMIT 1)
view:
  id: change-task-description
  from: description
  viz: markdown
  markdown:
    text: body
  empty: No description.
