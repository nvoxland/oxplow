title: Shared work
description: "Where two threads hold the same thing, one row each: a task that requests on both worked on (`Items on two threads`), a file both threads' turns changed (`Files two threads changed`; a file two concurrent turns could each have changed is no evidence), an epic whose open children sit on different threads (`Epics spread over threads`). Requests count while running or finished in the last day. `thread_id` keeps the rows that involve that thread; `task` keeps that task's own row, the files its requests changed, and its epic's. Each row: `section`, `what`, `threads` (their titles), `uri`."
params:
- name: thread_id
- name: task
loaders:
  shared_work:
    sql: |
      -- Joins go by the integer ids, never by the uri columns: a uri is
      -- built per row, so a join on one reaches no index and rebuilds it
      -- for every row of turn_file, past query_sql's 5 s.
      WITH live AS (
        SELECT r.id AS request_id
        FROM v_request r
        WHERE r.state <> 'finished' OR julianday(r.last_activity_at) >= julianday('now') - 1
      ), live_turns AS MATERIALIZED (
        SELECT l.request_id, t.id AS turn_id, t.thread_id, th.title AS thread_title
        FROM live l JOIN v_agent_turn t ON t.request_id = l.request_id
        JOIN v_thread th ON th.id = t.thread_id
      ), items AS (
        -- Grouped by the task's uri first, its title read after: joining
        -- v_oxplow_task before grouping cost every request-task row a lookup.
        SELECT rt.task AS uri,
               group_concat(DISTINCT o.thread_title) AS threads,
               group_concat(DISTINCT o.thread_id) AS thread_ids
        FROM v_oxplow_request_link rt JOIN live_turns o ON o.request_id = rt.request_id
        GROUP BY rt.task HAVING count(DISTINCT o.thread_id) >= 2
      ), shared AS (
        SELECT 'Items on two threads' AS section, w.title AS what, i.uri AS uri,
               i.threads, i.thread_ids
        FROM items i JOIN v_oxplow_task w ON w.uri = i.uri
        UNION ALL
        SELECT 'Files two threads changed', f.path, NULL,
               group_concat(DISTINCT o.thread_title), group_concat(DISTINCT o.thread_id)
        FROM v_turn_file f JOIN live_turns o ON o.turn_id = f.turn_id
        WHERE f.confidence <> 'shared'
        GROUP BY f.path HAVING count(DISTINCT o.thread_id) >= 2
        UNION ALL
        SELECT 'Epics spread over threads', p.title, p.uri,
               group_concat(DISTINCT t.title), group_concat(DISTINCT t.id)
        FROM v_oxplow_task c JOIN v_oxplow_task p ON p.uri = c.parent_uri JOIN v_thread t ON t.uri = c.assignee
        WHERE c.closed_at IS NULL
        GROUP BY p.uri HAVING count(DISTINCT t.id) >= 2
      )
      SELECT section, what, threads, uri FROM shared
      WHERE (:thread_id IS NULL OR instr(',' || thread_ids || ',', ',' || :thread_id || ',') > 0)
        AND (:task IS NULL
             OR (section = 'Items on two threads' AND uri = :task)
             OR (section = 'Files two threads changed' AND what IN (
                   -- From the task's requests out (CROSS JOIN keeps that
                   -- order): from the files in, it read every turn's.
                   SELECT f.path FROM v_oxplow_request_link rt
                   CROSS JOIN v_agent_turn t CROSS JOIN v_turn_file f
                   WHERE rt.task = :task AND t.request_id = rt.request_id
                     AND f.turn_id = t.id AND f.confidence <> 'shared'))
             OR (section = 'Epics spread over threads'
                 AND uri = (SELECT parent_uri FROM v_oxplow_task WHERE uri = :task)))
      ORDER BY section, what
