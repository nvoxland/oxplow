title: Work item stages
description: "The active work list's stages, in its order: `value` (the stage's id), `label` (how the list names it), `bucket` (which of core's six it is in: backlog, todo, in_progress, blocked, done, canceled), `ord`, `is_default` (1 for a bucket's first stage, what a command given the bucket lands on) and `filter`: the stage named the way a filter takes it, by its bucket for a bucket's first stage, so a page's `todo` default is the list's first to-do stage whatever the list calls it."
needs:
- work_items
loaders:
  work_item_stages:
    sql: |
      WITH st AS (
        SELECT CAST(json_extract(s.value, '$.id') AS TEXT) AS value,
               CAST(json_extract(s.value, '$.title') AS TEXT) AS label,
               CAST(json_extract(s.value, '$.bucket') AS TEXT) AS bucket,
               CAST(s.key AS INTEGER) AS ord
        FROM v_capability_provider p,
             json_each(CASE WHEN json_valid(p.stages) THEN p.stages ELSE '[]' END) s
        WHERE p.capability = 'work_items' AND p.active = 1
      ),
      ranked AS (
        SELECT st.*, st.ord = (SELECT min(o.ord) FROM st o WHERE o.bucket = st.bucket) AS is_default FROM st
      )
      SELECT r.value, r.label, r.bucket, r.ord, r.is_default,
             -- A stage whose id is a bucket's name is in that bucket, so
             -- the name is the stage's own.
             CASE WHEN r.is_default AND NOT EXISTS (SELECT 1 FROM st o WHERE o.value = r.bucket)
                  THEN r.bucket ELSE r.value END AS filter
      FROM ranked r
      ORDER BY r.ord
