# An item with children is an epic: the active item shows under it in
# "In progress", with the epic's other children indented beside it, and
# the epic itself is never a ready item. A ready child shows in Ready too.
given:
  - { command: oxplow.work_item.create, input: { title: The epic, thread: thr1 }, bind: epic }
  - { command: oxplow.work_item.create, input: { title: Doing it, state: in_progress, thread: thr1, parent_uri: $epic.uri } }
  - { command: oxplow.work_item.create, input: { title: After it, thread: thr1, parent_uri: $epic.uri } }
  - { command: oxplow.work_item.create, input: { title: Standalone, thread: thr1 } }
when: { part: oxplow/work-panel, params: { thread_id: 1 } }
expect:
  loaders:
    work:
      rows:
        - { grp: In progress, title: The epic, icon: epic, depth: 0, active: 0 }
        - { grp: In progress, title: Doing it, depth: 1, active: 1 }
        - { grp: In progress, title: After it, depth: 1, active: 0 }
        - { grp: Ready, title: After it }
        - { grp: Ready, title: Standalone }
