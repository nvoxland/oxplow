# Each page written restates the counts: two pages of oxwiki, both notes.
given:
  - { command: oxplow.knowledge.write_page, input: { store: oxwiki, title: First, body: "# First\n\nOne." } }
  - { command: oxplow.knowledge.write_page, input: { store: oxwiki, title: Second, body: "# Second\n\nTwo." } }
when: { sql: "SELECT MEASURE('knowledge.pages') AS pages FROM metric_grid('month')" }
expect: { rows: [{ pages: 2.0 }] }
steps:
  - when: { sql: "SELECT \"oxplow.knowledge_store\" AS store, MEASURE('knowledge.pages') AS pages FROM metric_grid('month', 'oxplow.knowledge_store')" }
    expect: { rows: [{ store: oxwiki, pages: 2.0 }] }
  - when: { sql: "SELECT \"oxplow.knowledge_bucket\" AS bucket, MEASURE('knowledge.pages') AS pages FROM metric_grid('month', 'oxplow.knowledge_bucket')" }
    expect: { rows: [{ bucket: note, pages: 2.0 }] }
