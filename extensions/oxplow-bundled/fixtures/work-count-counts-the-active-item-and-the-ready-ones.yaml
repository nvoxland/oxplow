# The Work panel's count: the item in progress and the ready ones; finished
# isn't counted.
given:
  - { command: oxplow.effort.open, input: { thread: thr1 } }
  - { command: oxplow.work_item.create, input: { title: Next up, state: todo, thread: thr1 } }
  - { command: oxplow.work_item.create, input: { title: Shipped, state: done, thread: thr1 } }
input: { page: oxplow-bundled/work-count, params: { thread_id: 1 } }
expect: { loaders: { work_count: { rows: [{ open: 2 }] } } }
