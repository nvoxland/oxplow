# Delete is a row action of the index, confirmed because it destroys the
# page. Pressing it removes that page and the index no longer lists it.
given:
  - { command: oxplow.knowledge.write_page, input: { store: oxwiki, title: First, body: "# First\n\nOne.\n" } }
  - { command: oxplow.knowledge.write_page, input: { store: oxwiki, title: Second, body: "# Second\n\nTwo.\n" } }
when: { page: knowledge }
expect:
  loaders: { pages: { rows: 2 } }
steps:
  - press: { action: delete, node: pages, row: { id: second } }
    expect: { ok: true }
  - expect:
      loaders:
        stores: { rows: [{ store: oxwiki, page_count: 1 }] }
        pages: { rows: [{ id: first }] }
