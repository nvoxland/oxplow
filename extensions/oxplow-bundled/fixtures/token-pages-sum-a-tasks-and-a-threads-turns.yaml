# Token usage on slot pages: a task's turns summed and listed, a thread's
# total; an idle thread shows nothing.
given:
  - { command: oxplow.work_item.create, input: { title: Fix it, thread: thr1 }, bind: item }
  - { command: oxplow.work_item.transition, input: { uri: $item.uri, to: in_progress } }
  - observe: { token_usage: { effort: eff1, prompt: fix it, input_tokens: 1999, output_tokens: 1 } }
  - observe: { token_usage: { effort: eff1, prompt: again, input_tokens: 99, output_tokens: 1 } }
  - observe: { token_usage: { prompt: chat, input_tokens: 9, output_tokens: 1 } }
when: { page: oxplow-bundled/task-tokens, params: { uri: $item.uri } }
expect:
  loaders:
    task_turns: { rows: 2 }
    task_token_summary:
      rows:
        - { summary: "**2,100** tokens · 2 turns · in 2,098 · out 2 · cache-write 0 · cache-read 0" }
steps:
  - when: { page: oxplow-bundled/thread-tokens, params: { thread_id: 1 } }
    expect: { loaders: { thread_tokens: { rows: [{ tokens: 2110 }] } } }
  - when: { page: oxplow-bundled/thread-tokens, params: { thread_id: 999 } }
    expect: { loaders: { thread_tokens: { rows: 0 } } }
