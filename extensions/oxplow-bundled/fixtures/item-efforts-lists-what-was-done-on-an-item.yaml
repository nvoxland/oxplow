# What has been done on a task: its efforts, newest first, each
# opening its effort; the task page shows it as its Activity.
given:
  - { command: oxplow.task.create, input: { title: Fix it, assignee: thr1 }, bind: item }
  - { command: oxplow.task.transition, input: { uri: $item.uri, to: in_progress }, as: agent }
  - { command: oxplow.task.create, input: { title: Other }, bind: other }
when: { page: item-efforts, params: { uri: $item.uri } }
expect:
  loaders:
    efforts: { rows: [{ uri: $any, started_at: $any, ended_at: null, files: 0 }] }
steps:
  - params: { uri: $other.uri }
    expect: { loaders: { efforts: { rows: 0 } } }
