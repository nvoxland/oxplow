      - { command: oxplow.tasks.assign, input: { uri: "oxplow:oxplow/task?id=tsk8&provider=oxtask", to: "oxplow:oxplow/thread?id=thr1" } }
      - { command: oxplow.tasks.assign, input: { uri: "oxplow:oxplow/task?id=tsk9&provider=oxtask", to: "oxplow:oxplow/thread?id=thr1" } }
      - { command: oxplow.tasks.assign, input: { uri: "oxplow:oxplow/task?id=tsk10&provider=oxtask", to: "oxplow:oxplow/thread?id=thr1" } }
