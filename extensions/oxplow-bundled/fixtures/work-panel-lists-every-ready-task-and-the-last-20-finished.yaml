              - { command: oxtask.task.move, input: { id: tsk26, stage: done }, as: agent }
              - { command: oxtask.task.move, input: { id: tsk27, stage: done }, as: agent }
              - { command: oxtask.task.move, input: { id: tsk28, stage: done }, as: agent }
              - { command: oxtask.task.move, input: { id: tsk29, stage: done }, as: agent }
              - { command: oxtask.task.move, input: { id: tsk30, stage: done }, as: agent }
      - { command: oxtask.task.create, input: { title: Still going, stage: in_progress } }
      - { command: oxplow.tasks.assign, input: { uri: "oxplow:oxplow/task?id=tsk31&provider=oxtask", to: "oxplow:oxplow/thread?id=thr1" } }
  - when: { part: oxplow/work-panel, params: { thread_id: 1 } }
