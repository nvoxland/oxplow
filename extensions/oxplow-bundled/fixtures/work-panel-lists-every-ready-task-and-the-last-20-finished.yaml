# Grown to the whole rail, the Work panel has the thread's whole queue:
# every task assigned to it next, and the last 20 done tasks its requests
# worked on (the rail itself shows 8 rows and "+N more" until it grows).
# The tasks are written into oxtask's file in one step, and its collector
# states them once: one command per task would run its scripts 30 times.
requires: [oxtask]
given:
  - store_sql:
      extension: oxtask
      sql: >-
        INSERT INTO task (title, stage) VALUES
        ('Ready 1', 'ready'),
        ('Ready 2', 'ready'),
        ('Ready 3', 'ready'),
        ('Ready 4', 'ready'),
        ('Ready 5', 'ready'),
        ('Ready 6', 'ready'),
        ('Ready 7', 'ready'),
        ('Ready 8', 'ready'),
        ('Ready 9', 'ready'),
        ('Done 1', 'in_progress'),
        ('Done 2', 'in_progress'),
        ('Done 3', 'in_progress'),
        ('Done 4', 'in_progress'),
        ('Done 5', 'in_progress'),
        ('Done 6', 'in_progress'),
        ('Done 7', 'in_progress'),
        ('Done 8', 'in_progress'),
        ('Done 9', 'in_progress'),
        ('Done 10', 'in_progress'),
        ('Done 11', 'in_progress'),
        ('Done 12', 'in_progress'),
        ('Done 13', 'in_progress'),
        ('Done 14', 'in_progress'),
        ('Done 15', 'in_progress'),
        ('Done 16', 'in_progress'),
        ('Done 17', 'in_progress'),
        ('Done 18', 'in_progress'),
        ('Done 19', 'in_progress'),
        ('Done 20', 'in_progress'),
        ('Done 21', 'in_progress')
when: { collector: oxtask/tasks, trigger: sqlite }
expect: { ok: true }
steps:
  - given:
      - { command: oxplow.tasks.assign, input: { uri: "oxplow:oxplow/task?id=tsk1&provider=oxtask", to: "oxplow:oxplow/thread?id=thr1" } }
      - { command: oxplow.tasks.assign, input: { uri: "oxplow:oxplow/task?id=tsk2&provider=oxtask", to: "oxplow:oxplow/thread?id=thr1" } }
