# The Tasks board's rows: the ready, started and blocked items and the
# done ones of the last three days, twenty at most (the clock can't move
# here: the cap is what this tests), no backlog or canceled ones, each
# column's count, the list's choice fields; wider than one assignee a card
# names who it's for; with no thread, "this thread" is everything.
given:
  - { command: oxplow.work_item.create, input: { title: Next up, assignee: thr1 } }
  - { command: oxplow.work_item.create, input: { title: In the backlog, stage: backlog } }
  - { command: oxplow.work_item.create, input: { title: Dropped, assignee: thr1 }, bind: dropped }
  - { command: oxplow.work_item.transition, input: { uri: $dropped.uri, to: canceled } }
  - { command: oxplow.work_item.create, input: { title: Done 1, stage: done } }
  - { command: oxplow.work_item.create, input: { title: Done 2, stage: done } }
  - { command: oxplow.work_item.create, input: { title: Done 3, stage: done } }
  - { command: oxplow.work_item.create, input: { title: Done 4, stage: done } }
  - { command: oxplow.work_item.create, input: { title: Done 5, stage: done } }
  - { command: oxplow.work_item.create, input: { title: Done 6, stage: done } }
  - { command: oxplow.work_item.create, input: { title: Done 7, stage: done } }
  - { command: oxplow.work_item.create, input: { title: Done 8, stage: done } }
  - { command: oxplow.work_item.create, input: { title: Done 9, stage: done } }
  - { command: oxplow.work_item.create, input: { title: Done 10, stage: done } }
  - { command: oxplow.work_item.create, input: { title: Done 11, stage: done } }
  - { command: oxplow.work_item.create, input: { title: Done 12, stage: done } }
  - { command: oxplow.work_item.create, input: { title: Done 13, stage: done } }
  - { command: oxplow.work_item.create, input: { title: Done 14, stage: done } }
  - { command: oxplow.work_item.create, input: { title: Done 15, stage: done } }
  - { command: oxplow.work_item.create, input: { title: Done 16, stage: done } }
  - { command: oxplow.work_item.create, input: { title: Done 17, stage: done } }
  - { command: oxplow.work_item.create, input: { title: Done 18, stage: done } }
  - { command: oxplow.work_item.create, input: { title: Done 19, stage: done } }
  - { command: oxplow.work_item.create, input: { title: Done 20, stage: done } }
  - { command: oxplow.work_item.create, input: { title: Done 21, stage: done } }
when: { page: tasks, params: { show: all, priority: any, thread_id: 1, stream_id: 1 } }
expect:
  loaders:
    row: { rows: [{ scope: all }] }
    board:
      rows:
        - { title: Next up, state: todo, assignee_shown: Thread }
        - { title: Done 21 }
        - { title: Done 20 }
        - { title: Done 19 }
        - { title: Done 18 }
        - { title: Done 17 }
        - { title: Done 16 }
        - { title: Done 15 }
        - { title: Done 14 }
        - { title: Done 13 }
        - { title: Done 12 }
        - { title: Done 11 }
        - { title: Done 10 }
        - { title: Done 9 }
        - { title: Done 8 }
        - { title: Done 7 }
        - { title: Done 6 }
        - { title: Done 5 }
        - { title: Done 4 }
        - { title: Done 3 }
        - { title: Done 2 }
    counts: { rows: { contains: [{ state: done, n: 21 }, { state: canceled, n: 1 }, { state: todo, n: 1 }, { state: backlog, n: 1 }] } }
    fields: { rows: { contains: [{ name: priority, kind: enum }] } }
    assignees: { rows: [{ title: Thread }, { title: You, uri: "oxplow:oxplow/person" }] }
    live: { rows: 0 }
steps:
  - params: { show: thread }
    expect: { loaders: { row: { rows: [{ scope: thread }] }, board: { rows: [{ title: Next up, assignee_shown: null }] } } }
  - params: { show: thread, thread_id: null }
    expect: { loaders: { row: { rows: [{ scope: all }] } } }
