# A model serves the decisions profile (here, Main's): the finished
# effort's decisions are asked about.
input:
  effect: infer-decisions
  event:
    type: effort.finished
    payload: { effort: "effort:eff7", work_item: "work_item:oxplow:tsk1", end_snapshot: "snapshot:3" }
  answers:
    ai.discover:
      - { role: oxplow-bundled/decisions, model: { provider: local, model: llama }, problem: null }
expect:
  commands: [oxplow.effort.infer_decisions]
