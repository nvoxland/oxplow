# A verdict is a typed event, not only a comment's text. Each review verb
# logs its own type with its run — caused by its `command.executed`, about
# the effort and its work item — so the effort's timeline carries who
# decided what. An acceptance's subject also names each claim and decision
# it accepted unchecked. A refused review decides nothing.
given:
  - { command: oxplow.work_item.create, input: { title: Fix the hover state, body: "Fix the hover state in [[src/ui/button.ts]].", thread: thr1 }, bind: item }
  - { command: oxplow.work_item.transition, input: { uri: $item.uri, to: in_progress } }
  - observe:
      turn:
        prompt: Fix the hover state
        tools:
          - { name: Edit, kind: edit, paths: [src/ui/button.ts], ok: true }
          - { name: Edit, kind: edit, paths: [crates/db/store.rs], ok: true }
  - command: oxplow.effort.replace_inferred_claims
    input: { effort: eff1, claims: [{ statement: no behavior change, kind: no_behavior_change }] }
  - command: oxplow.effort.replace_inferred_decisions
    input: { effort: eff1, decisions: [{ question: Which store?, choice: SQLite, alternatives: [files], why: "it's there" }] }
when:
  command: oxplow.review.request_changes
  input: { effort: eff1, note: Keep it to the UI. }
  confirmed: true
expect: { ok: true }
steps:
  - when: { sql: "SELECT v.type, v.source, json_extract(v.payload, '$.unverified') AS unverified, json_extract(v.payload, '$.inferred') AS inferred, json_extract(v.payload, '$.deviated') AS deviated, json_extract(v.payload, '$.note') AS note, json_array_length(v.subject) AS about, (v.subject LIKE '%/claim?%') AS names_claim, (v.subject LIKE '%/decision?%') AS names_decision, (SELECT c.type FROM v_event c WHERE c.id = v.cause) AS cause FROM v_event v WHERE v.type LIKE 'oxplow_bundled.%' ORDER BY v.seq" }
    expect:
      rows:
        - type: oxplow_bundled.changes_requested
          source: "oxplow:oxplow/command?command=oxplow.review.request_changes"
          unverified: 1
          inferred: 1
          deviated: 1
          note: Keep it to the UI.
          about: 2
          cause: command.executed
  - when: { command: oxplow.review.accept, input: { effort: eff1, force: true }, confirmed: true }
    expect: { ok: true }
  - when: { sql: "SELECT v.type, v.source, json_extract(v.payload, '$.unverified') AS unverified, json_extract(v.payload, '$.inferred') AS inferred, json_extract(v.payload, '$.deviated') AS deviated, json_extract(v.payload, '$.note') AS note, json_array_length(v.subject) AS about, (v.subject LIKE '%/claim?%') AS names_claim, (v.subject LIKE '%/decision?%') AS names_decision, (SELECT c.type FROM v_event c WHERE c.id = v.cause) AS cause FROM v_event v WHERE v.type LIKE 'oxplow_bundled.%' ORDER BY v.seq" }
    expect:
      rows:
        - { type: oxplow_bundled.changes_requested }
        - type: oxplow_bundled.accepted
          source: "oxplow:oxplow/command?command=oxplow.review.accept"
          unverified: 1
          inferred: 1
          deviated: 1
          about: 4
          names_claim: 1
          names_decision: 1
          cause: command.executed
  - when: { command: oxplow.review.accept, input: { effort: eff999 }, confirmed: true }
    expect: { ok: false, refused: eff999 }
  - when: { sql: "SELECT count(*) AS verdicts FROM v_event WHERE type LIKE 'oxplow_bundled.%'" }
    expect: { rows: [{ verdicts: 2 }] }
