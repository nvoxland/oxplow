# A straight history is one lane, and a child comes before its parent
# whatever their times (c is older than b here).
given:
  - observe: { commit: { sha: aaaaaaa, at: "2026-01-02T00:00:00Z", subject: First } }
  - observe: { commit: { sha: bbbbbbb, at: "2026-01-05T00:00:00Z", subject: Second, parents: [aaaaaaa] } }
  - observe: { commit: { sha: ccccccc, at: "2026-01-01T00:00:00Z", subject: Third, parents: [bbbbbbb] } }
when: { page: oxplow/git-history, params: { stream_id: 1, head_sha: ccccccc } }
steps:
  - ui:
      - click: '#graph-mode'
      - expect:
          count:
            '.row circle.node-0': 3
            '.row circle.node-1': 0
            '#rows > .row:nth-child(1)[data-sha="ccccccc"]': 1
            '#rows > .row:nth-child(2)[data-sha="bbbbbbb"]': 1
            '#rows > .row:nth-child(3)[data-sha="aaaaaaa"]': 1
