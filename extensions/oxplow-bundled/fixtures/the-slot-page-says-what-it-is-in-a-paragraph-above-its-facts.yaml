# What a thing is, is a paragraph under the About heading, above its facts
# (the node's `lead:`), not a "What it is" row and not a section of its own.
when:
  page: oxplow-foundation/slot
  params:
    uri: "oxplow:oxplow/slot?slot=oxplow-bundled/oxplow-bundled.tasks.sections-0"
expect:
  nodes:
    - { id: about, kind: viz, viz: detail }
  text: { contains: ["## About [node about]\n\nShows Handoffs to This Thread in the sec"] }
