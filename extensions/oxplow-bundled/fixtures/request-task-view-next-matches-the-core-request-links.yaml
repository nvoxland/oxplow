# `request_link` gives `v_request_task`'s rows and columns for the
# same requests made once through core's tracker and once through oxtask (they
# share the task URIs): the request, task, turn, thread, totals and request
# id are equal; core's `command` is the model's `filed` or `edited`.
# (A command's own evidence is in the other link fixtures.)
requires: [oxtask]
given:
  - { command: oxplow.agent_session.open, input: { thread: thr1, harness: claude }, bind: ses }
  - { command: oxplow.task.create, input: { title: Named, stage: todo }, bind: cn }
  - { command: oxplow.task.create, input: { title: Held, stage: in_progress, assignee: thr1 }, bind: ch }
  - { command: oxtask.task.create, input: { title: Named, stage: ready } }
  - { command: oxtask.task.create, input: { title: Held, stage: in_progress } }
  - { command: oxplow.tasks.assign, input: { uri: "oxplow:oxplow/task?id=tsk2&provider=oxtask", to: "oxplow:oxplow/thread?id=thr1" } }
  - observe: { turn: { session: $ses.id, prompt: "see [oxplow uri oxplow:oxplow/task?id=tsk1&provider=oxtask] please", answer: one } }
  - observe: { turn: { session: $ses.id, prompt: "another", answer: two } }
when:
  sql: |
    SELECT c.basis, c.task = n.task AS task, c.turn = n.turn AS turn, c.thread_id IS n.thread_id AS thread,
           c.turns = n.turns AS turns, c.started_at = n.started_at AS started, c.last_ended_at IS n.last_ended_at AS ended,
           c.request_id = n.request_id AS request_id, c.request = n.request AS request,
           n.at IS NOT NULL AS timed
      FROM v_request_task c
      JOIN v_oxplow_request_link n ON n.request = c.request AND n.task = c.task AND n.basis = c.basis
     WHERE c.basis IN ('prompt', 'assigned') ORDER BY c.request, c.basis
expect:
  rows:
    - { basis: assigned, task: 1, turn: 1, thread: 1, turns: 1, started: 1, ended: 1, request_id: 1, request: 1, timed: 1 }
    - { basis: prompt, task: 1, turn: 1, thread: 1, turns: 1, started: 1, ended: 1, request_id: 1, request: 1, timed: 1 }
    - { basis: assigned, task: 1, turn: 1, thread: 1, turns: 1, started: 1, ended: 1, request_id: 1, request: 1, timed: 1 }
