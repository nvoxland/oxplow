# A task assigned to a thread of an archived stream leaves search; the same
# task on a live stream stays.
requires: [oxtask]
given:
  - observe: { turn: { prompt: base, write: { path: base.txt, body: "x\n" } } }
  - { command: oxplow.vcs.stage, input: { stream: str1, paths: [base.txt] } }
  - { command: oxplow.vcs.commit, input: { stream: str1, message: base } }
  - { command: oxplow.stream.create, input: { title: Side, source: new, new_branch: side, start_point: main } }
  - { command: oxplow.thread.create, input: { stream: str2, title: Side thread } }
  - { command: oxplow.task.create, input: { title: Archived work, stage: todo, assignee: thr2 } }
  - { command: oxplow.task.create, input: { title: Live work, stage: todo, assignee: thr1 } }
  - { command: oxtask.task.create, input: { title: Archived work, stage: ready } }
  - { command: oxplow.tasks.assign, input: { uri: "oxplow:oxplow/task?id=tsk1&provider=oxtask", to: "oxplow:oxplow/thread?id=thr2" } }
  - { command: oxtask.task.create, input: { title: Live work, stage: ready } }
  - { command: oxplow.tasks.assign, input: { uri: "oxplow:oxplow/task?id=tsk2&provider=oxtask", to: "oxplow:oxplow/thread?id=thr1" } }
when: { sql: "SELECT title, stream_id FROM v_oxplow_search_task_next ORDER BY title" }
expect: { rows: [{ title: Archived work, stream_id: str2 }, { title: Live work, stream_id: str1 }] }
steps:
  - given: [{ command: oxplow.stream.archive, input: { stream: str2 }, confirmed: true }]
  - when: { sql: "SELECT title FROM v_oxplow_search_task_next ORDER BY title" }
    expect: { rows: [{ title: Live work }] }
  # Core's archive also releases the stream's assignments (the task goes
  # project-wide and stays in search); bundled does that at the flip, when it
  # reacts to the archive. Until then the assignment stays and the filter
  # leaves the task out.
  - when: { sql: "SELECT title, stream_id FROM v_search_task ORDER BY title" }
    expect: { rows: [{ title: Archived work, stream_id: null }, { title: Live work, stream_id: str1 }] }
