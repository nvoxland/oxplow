# A request with a turn still open has not stopped: nothing is recorded.
given:
  - observe:
      turn:
        prompt: Fix the greeting
        open: true
        tools: [{ name: Edit, kind: edit, paths: [a.txt], ok: true }]
  - observe:
      event:
        type: agent.turn.ended
        payload: { turn: trn1, thread: thr1, outcome: completed }
        anchors: { thread_id: thr1, turn_id: 1 }
when: { sql: "SELECT count(*) AS n FROM v_fact WHERE measure_key = 'oxplow.request_tracked'" }
expect: { rows: [{ n: 0 }] }
