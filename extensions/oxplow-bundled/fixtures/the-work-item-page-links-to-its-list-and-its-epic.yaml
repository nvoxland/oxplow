# "See also": a work item links to the Tasks board of the thread it's
# assigned to (the Task List at its stage when it's nobody's) and to its
# parent epic.
given:
  - { command: oxplow.work_item.create, input: { title: The epic, assignee: thr1 }, bind: epic }
  - { command: oxplow.work_item.create, input: { title: The child, assignee: thr1, parent_uri: $epic.uri }, bind: child }
  - { command: oxplow.work_item.create, input: { title: Loose end }, bind: loose }
when: { page: work-item, params: { uri: $child.uri, thread_id: 1, stream_id: 1 } }
expect:
  see_also:
    - { title: Tasks, uri: "oxplow:oxplow/page?page=tasks&thread_id=1" }
    - { title: The epic, uri: $epic.uri }
steps:
  - params: { uri: $loose.uri }
    expect:
      see_also:
        - { title: Task List, uri: "oxplow:oxplow/page?page=task-list#state=ready" }
