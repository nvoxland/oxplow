# The dashboards index lists the page-file dashboards (not an ordinary page
# in the same extension) with their stored URIs, and offers a title form to
# create one.
given:
  - command: oxplow.extension.write_page
    input: { extension: my-pages, page: ordinary, spec: "title: Ordinary page\ncategory: Data\nview: { markdown: Overview }\n", deploy: true }
    confirmed: true
  - command: oxplow.extension.new_dashboard
    input: { title: Build health }
    confirmed: true
when: { page: oxplow-bundled/dashboards }
expect:
  loaders:
    dashboards:
      rows:
        - { title: Build health }
  actions:
    - { id: new, form: true, prominent: true }
