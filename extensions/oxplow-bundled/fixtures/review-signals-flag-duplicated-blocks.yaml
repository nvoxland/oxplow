# The review's `duplication` signals: a block of a changed file that copies
# code elsewhere in the tree, with the copy in the evidence. The scan runs
# after the rest of the analysis.
requires: [oxplow-rust]
given:
  - observe: { turn: { prompt: base, write: { path: src/a.rs, body: "pub fn compute(input: &[i64]) -> i64 {\n    let mut total = 0;\n    for value in input {\n        if *value > 0 {\n            total += *value;\n        } else {\n            total -= *value;\n        }\n    }\n    total * 2 + 1\n}\n" } } }
  - { command: oxplow.vcs.stage, input: { stream: str1, paths: [src/a.rs] } }
  - { command: oxplow.vcs.commit, input: { stream: str1, message: base } }
  - observe: { turn: { prompt: copy, write: { path: src/b.rs, body: "pub fn compute(input: &[i64]) -> i64 {\n    let mut total = 0;\n    for value in input {\n        if *value > 0 {\n            total += *value;\n        } else {\n            total -= *value;\n        }\n    }\n    total * 2 + 1\n}\n" } } }
  - { command: oxplow.vcs.stage, input: { stream: str1, paths: [src/b.rs] } }
  - { command: oxplow.vcs.commit, input: { stream: str1, message: "Copy compute" }, bind: change }
  - observe: { commit: { sha: $change.rev, subject: Copy compute } }
  - observe: { analyze: { kind: commit, sha: $change.rev } }
when:
  sql: SELECT change_id, area, signal, severity, path, line, end_line, title, why FROM v_oxplow_review_signal WHERE source = 'oxplow/review_signal_duplication'
expect:
  rows:
    - { change_id: 1, area: code, signal: duplicated-block, severity: info, path: src/b.rs, line: 1, end_line: 11, title: Duplicated block, why: "11 lines copy src/a.rs:1-11." }
