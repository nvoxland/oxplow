# With oxwiki turned off (Settings → Integrations) no store is on: the
# store is still listed, off, and the index says how to turn one on. Its
# pages are hidden, and New page is not offered.
given:
  - { command: oxplow.knowledge.write_page, input: { store: oxwiki, title: Kept, body: "# Kept\n\nStill recorded.\n" } }
  - { command: oxplow.knowledge.set_oxwiki, input: { on: false } }
when: { page: knowledge }
expect:
  loaders:
    stores:
      rows:
        - { store: oxwiki, status: "Off", page_count: 0, notice: "No knowledge store is on. Turn oxwiki on in Settings → Integrations, or enable an extension's store." }
    pages: { rows: 0 }
  text: { contains: ["No knowledge store is on."] }
steps:
  - given:
      - { command: oxplow.knowledge.set_oxwiki, input: { on: true } }
  - expect:
      loaders:
        stores: { rows: [{ store: oxwiki, status: "On", page_count: 1, notice: null }] }
        pages: { rows: [{ id: kept }] }
