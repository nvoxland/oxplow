# The project chooses how its agents use tasks: `set_workflow` writes the
# workflow and the definition of done to the project's settings, each
# alone or together, and reading them back gives what was set; the
# project's other settings are kept. A value
# outside the presets is refused.
given:
  # A review-policy setting of the project's own, which the workflow write
  # must keep.
  - command: oxplow.review_policy.write
    input: { schema_version: 2, project: { expected: null, values: { struggle: { repeatedEdits: 9 } } }, personal: null }
  - { command: oxplow.tasks.set_workflow, input: { workflow: person_files, definition_of_done: "Tests pass.\nCommitted." } }
  - { command: oxplow.tasks.set_workflow, input: { workflow: off } }
when: { command: oxplow.review_policy.read, input: {} }
expect:
  ok: true
  result: { values: { struggle: { repeatedEdits: 9 }, tasks: { workflow: "off", definitionOfDone: "Tests pass.\nCommitted." } } }
steps:
  - when: { command: oxplow.tasks.set_workflow, input: { workflow: sometimes } }
    expect: { ok: false }
  # An empty input changes nothing, so it is refused.
  - when: { command: oxplow.tasks.set_workflow, input: {} }
    expect: { ok: false }
  # A person's own workflow still wins for them: the project's write says so.
  - given:
      - command: oxplow.review_policy.write
        input: { schema_version: 2, personal: { expected: null, values: { tasks: { workflow: agent_tracks } } } }
  - when: { command: oxplow.tasks.set_workflow, input: { workflow: person_files } }
    expect:
      ok: true
      result: { tasks: { workflow: person_files }, personal_workflow: agent_tracks }
