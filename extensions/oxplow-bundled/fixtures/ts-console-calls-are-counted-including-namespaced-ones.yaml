# TypeScript: console calls count, window.console too.
when:
  collector: oxplow.ts.console_calls
  files:
    "notes.md": "any! console.log @ts-ignore"
    "src/a.ts": "\n// @ts-ignore\nfunction f(x: any): any {\nconsole.log(x);\nwindow.console.error(x);\nconst y = x!.foo;\nreturn y;\n}\nconst g = (a: any) => a!;\n"
    "src/b.tsx": "// @ts-expect-error\nexport const C = () => { console.warn('x'); return null; };\n"
expect:
  facts:
    - {"measure": "oxplow.ast_hit", "value": 2, "subject": "oxplow:oxplow/file?path=src/a.ts", "path": "src/a.ts", "rule": "console_call", "dims": {"oxplow.language": "typescript"}}
    - {"measure": "oxplow.ast_hit", "value": 1, "subject": "oxplow:oxplow/file?path=src/b.tsx", "path": "src/b.tsx", "rule": "console_call", "dims": {"oxplow.language": "typescript"}}
