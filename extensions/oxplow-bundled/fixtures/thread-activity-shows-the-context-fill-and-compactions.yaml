# Thread activity shows how full the context was when a turn ended (with its
# window when the harness said it) and how often the turn compacted it.
given:
  - observe: { turn: { prompt: with a window, compactions: 1, context: { tokens: 52000, window: 200000 } } }
  - observe: { turn: { prompt: without one, context: { tokens: 52000 } } }
when: { page: oxplow-bundled/thread-activity, params: { thread_id: 1 } }
expect:
  loaders:
    thread_activity:
      rows:
        - { prompt: without one, context: 52k }
        - { prompt: with a window, context: "52k of 200k (26%), compacted 1×" }
