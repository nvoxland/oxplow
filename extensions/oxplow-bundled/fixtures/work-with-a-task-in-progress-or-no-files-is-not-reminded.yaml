# The untracked-work reminder is quiet for a request that changed no
# files, and while the thread has a task in progress.
requires: [oxtask]
given:
  - observe: { turn: { prompt: What does this do? } }
when: { sql: "SELECT count(*) AS n FROM v_agent_nudge" }
expect: { rows: [{ n: 0 }] }
steps:
  - given:
      - { command: oxtask.task.create, input: { title: Doing it, stage: in_progress } }
      - { command: oxplow.tasks.assign, input: { uri: "oxplow:oxplow/task?id=tsk1&provider=oxtask", to: "oxplow:oxplow/thread?id=thr1" } }
      - observe: { turn: { prompt: Fix the greeting, tools: [{ name: Edit, kind: edit, paths: [greeting.txt], ok: true }] } }
      - observe: { snapshot: { files: [{ path: greeting.txt, hash: a }] } }
  - when: { sql: "SELECT count(*) AS n FROM v_agent_nudge" }
    expect: { rows: [{ n: 0 }] }
