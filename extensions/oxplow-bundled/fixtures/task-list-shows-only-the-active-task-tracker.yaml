# Task List reads the task interface: with the task tracker switched to
# none it runs nothing and says what it needs.
given:
  - { command: oxplow.task.create, input: { title: Next up, assignee: thr1 } }
  - { command: oxplow.capability.choose, input: { capability: task_tracker, provider: none }, confirmed: true }
when: { page: task-list, params: { stream_id: 1 } }
expect:
  inactive: $any
