# A decisions job succeeded: its proposals (inside a code fence, which is
# dropped) replace the effort's inferred decisions.
input:
  effect: store-decisions
  event:
    type: contribution.job.completed
    payload: { job_run: "job_run:01990000-0000-7000-8000-000000000000", job: "job:oxplow-bundled/decisions", version: 1, attempt: 1, fence: 1, outcome: succeeded }
  answers:
    jobs.read:
      - intentKey: "decisions:effort:eff3"
        result:
          parts:
            - type: text
              text: "```json\n{\"decisions\": [{\"question\": \"Which CSV library?\", \"choice\": \"csv crate\", \"alternatives\": [\"hand-rolled\"], \"confidence\": \"High\"}, {\"question\": \"\", \"choice\": \"x\"}]}\n```"
expect:
  commands: [oxplow.effort.replace_inferred_decisions]
