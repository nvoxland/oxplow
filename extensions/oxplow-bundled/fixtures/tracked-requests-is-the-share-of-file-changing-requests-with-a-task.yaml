# Two requests changed files; one took a task, one did not: 50% tracked.
requires: [oxtask]
given:
  - { command: oxtask.task.create, input: { title: The fix, stage: ready } }
  - { command: oxplow.tasks.assign, input: { uri: "oxplow:oxplow/task?id=tsk1&provider=oxtask", to: "oxplow:oxplow/thread?id=thr1" } }
  - observe:
      turn:
        prompt: Fix the greeting
        during:
          - { command: oxtask.task.move, input: { id: tsk1, stage: in_progress }, as: agent }
        tools: [{ name: Edit, kind: edit, paths: [a.txt], ok: true }]
  - { command: oxtask.task.move, input: { id: tsk1, stage: done } }
  - observe:
      turn:
        prompt: Tweak the farewell
        tools: [{ name: Edit, kind: edit, paths: [b.txt], ok: true }]
when: { sql: "SELECT MEASURE('tasks.tracked_requests_pct') AS pct FROM metric_grid('month')" }
expect: { rows: [{ pct: 50.0 }] }
