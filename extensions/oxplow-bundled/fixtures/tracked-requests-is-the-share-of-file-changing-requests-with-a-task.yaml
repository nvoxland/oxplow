# Two requests changed files; one took a task, one did not: 50% tracked.
given:
  - { command: oxplow.task.create, input: { title: The fix, stage: todo, assignee: thr1 }, bind: fix }
  - observe:
      turn:
        prompt: Fix the greeting
        during:
          - { command: oxplow.task.transition, input: { uri: $fix.uri, to: in_progress }, as: agent }
        tools: [{ name: Edit, kind: edit, paths: [a.txt], ok: true }]
  - { command: oxplow.task.transition, input: { uri: $fix.uri, to: done } }
  - observe:
      turn:
        prompt: Tweak the farewell
        tools: [{ name: Edit, kind: edit, paths: [b.txt], ok: true }]
when: { sql: "SELECT MEASURE('tasks.tracked_requests_pct') AS pct FROM metric_grid('month')" }
expect: { rows: [{ pct: 50.0 }] }
