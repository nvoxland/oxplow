# The Review page lists the files with something worth a look, worst first,
# beside what the change was asked to do; the brief on the change pages
# says the same in one line and links to it.
given:
  - observe: { turn: { prompt: base, write: { path: tests/it.rs, body: "#[test]\nfn a() {\n    assert_eq!(1, 1);\n    assert!(true);\n}\n\n#[test]\nfn b() {\n    assert!(true);\n}\n" } } }
  - observe: { turn: { prompt: base lib, write: { path: src/lib.rs, body: "pub fn grow(a: u32) -> u32 {\n    a\n}\n" } } }
  - { command: oxplow.vcs.stage, input: { stream: str1, paths: [tests/it.rs, src/lib.rs] } }
  - { command: oxplow.vcs.commit, input: { stream: str1, message: base } }
  - observe: { turn: { prompt: weaken, write: { path: tests/it.rs, body: "#[test]\n#[ignore]\nfn a() {\n    assert_eq!(1, 1);\n}\n" } } }
  - observe: { turn: { prompt: widen, write: { path: src/lib.rs, body: "pub fn grow(a: u32, b: u32) -> u32 {\n    a + b\n}\n" } } }
  - { command: oxplow.vcs.stage, input: { stream: str1, paths: [tests/it.rs, src/lib.rs] } }
  - { command: oxplow.vcs.commit, input: { stream: str1, message: "Make grow add two numbers" }, bind: change }
  # The indexer that reads commits doesn't run in a fixture: say what it read.
  - observe: { commit: { sha: $change.rev, subject: Make grow add two numbers } }
  - observe: { analyze: { kind: commit, sha: $change.rev } }
steps:
  - when: { page: change-review, params: { change_id: 1 } }
    expect:
      loaders:
        change:
          rows:
            - { what: A commit, asked: Make grow add two numbers, analysis: Done }
        look_here:
          rows:
            - { path: tests/it.rs, severity: high, signals_all: '[{"text":"Fewer assertions","hint":"This file has 3 → 1 assertions."},{"text":"Test skipped","hint":"This file has 0 → 1 skip marker."},{"text":"Test deleted: b","hint":"The file has 2 → 1 tests."}]' }
            - { path: src/lib.rs, severity: medium }
        by_area:
          rows:
            - { area: tests, high: 3, medium: 0 }
            - { area: code, high: 0, medium: 1 }
  - when: { part: oxplow/change-review-brief, params: { change_id: 1 } }
    expect:
      loaders:
        brief:
          rows:
            - { text: "**3 high** · 2 files to look at · [Open Review](oxplow:oxplow/page?change_id=1&page=change-review)" }
  # A Look Here row opens its file's signals, worst first: the whole file's,
  # then by line.
  - when: { part: oxplow/change-review-file, params: { change_id: 1, path: tests/it.rs } }
    expect:
      loaders:
        signals:
          rows:
            - { title: Fewer assertions, severity: high, line: null }
            - { title: Test skipped, severity: high, line: null }
            - { title: "Test deleted: b", severity: high, line: 8 }
