# The stages a transition may move a work item to: the active list's, in
# its order, each as the list names it (the work item page's
# work_item_states loader, which feeds its State form).
when: { query: 'work-item#work_item_states' }
expect:
  rows:
    - { value: backlog, label: Backlog }
    - { value: ready, label: Ready }
    - { value: in_progress, label: In Progress }
    - { value: blocked, label: Blocked }
    - { value: done, label: Done }
    - { value: canceled, label: Canceled }
