# What a task in progress is doing now is the state of the assigned
# thread's latest request, not of the latest request linked to the task: a
# follow-up that puts a question to the person, linked to the task or
# not, reads "waiting on you".
requires: [oxtask]
given:
  - { command: oxplow.agent_session.open, input: { thread: thr1, harness: claude }, bind: ses }
  - { command: oxtask.task.create, input: { title: Doing it, stage: ready } }
  - { command: oxplow.tasks.assign, input: { uri: "oxplow:oxplow/task?id=tsk1&provider=oxtask", to: "oxplow:oxplow/thread?id=thr1" } }
  - observe:
      turn:
        session: $ses.id
        prompt: Start it
        during: [{ command: oxtask.task.move, input: { id: tsk1, stage: in_progress }, as: agent }]
when: { part: oxplow/work-panel, params: { thread_id: 1 } }
expect: { loaders: { work: { rows: [{ grp: In progress, title: Doing it, now: "" }] } } }
steps:
  - given:
      - observe: { turn: { session: $ses.id, prompt: "Also, quick question", open: true, tools: [{ name: AskUserQuestion, kind: ask, question: "Which one should I use?", pre: true }] } }
  - expect: { loaders: { work: { rows: [{ grp: In progress, title: Doing it, now: waiting on you }] } } }
