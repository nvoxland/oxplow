# The model-based `task_next` gives the rows `v_task` gives, for the same
# tasks made once through core's tracker and once through oxtask: every
# column both have, the same value. (Ids and times differ by write; the
# comparison is on titles.) What the two list differently is stated here:
# `v_task` lists the active tracker's items only, `task_next` every store's.
requires: [oxtask]
given:
  - { command: oxplow.task.create, input: { title: Epic, body: "About it.", stage: todo, assignee: thr1 }, bind: cepic }
  - { command: oxplow.task.create, input: { title: Child, stage: in_progress, assignee: thr1, parent_uri: $cepic.uri } }
  - { command: oxplow.task.create, input: { title: Pooled, stage: todo } }
  - { command: oxplow.task.create, input: { title: Finished, stage: done } }
  - { command: oxtask.task.create, input: { title: Epic, body: "About it.", stage: ready } }
  - { command: oxplow.tasks.assign, input: { uri: "oxplow:oxplow/task?id=tsk1&provider=oxtask", to: "oxplow:oxplow/thread?id=thr1" } }
  - { command: oxtask.task.create, input: { title: Child, stage: in_progress, parent: tsk1 } }
  - { command: oxplow.tasks.assign, input: { uri: "oxplow:oxplow/task?id=tsk2&provider=oxtask", to: "oxplow:oxplow/thread?id=thr1" } }
  - { command: oxtask.task.create, input: { title: Pooled, stage: ready } }
  - { command: oxtask.task.create, input: { title: Finished, stage: done } }
when:
  sql: |
    SELECT c.title, c.state = n.state AS state, c.stage = n.stage AS stage, c.stage_title = n.stage_title AS stage_title,
           c.body = n.body AS body, c.provider = n.provider AS provider, c.native_id = n.native_id AS native_id,
           c.assignee IS n.assignee AS assignee, c.rank IS n.rank AS rank,
           (c.parent_uri IS NULL) = (n.parent_uri IS NULL) AS parent,
           (c.closed_at IS NULL) = (n.closed_at IS NULL) AS closed,
           c.uri = n.uri AS uri
      FROM v_task c JOIN v_oxplow_task_next n ON n.title = c.title
     ORDER BY c.title
expect:
  rows:
    - { title: Child, state: 1, stage: 1, stage_title: 1, body: 1, provider: 1, native_id: 1, assignee: 1, rank: 1, parent: 1, closed: 1, uri: 1 }
    - { title: Epic, state: 1, stage: 1, stage_title: 1, body: 1, provider: 1, native_id: 1, assignee: 1, rank: 1, parent: 1, closed: 1, uri: 1 }
    - { title: Finished, state: 1, stage: 1, stage_title: 1, body: 1, provider: 1, native_id: 1, assignee: 1, rank: 1, parent: 1, closed: 1, uri: 1 }
    - { title: Pooled, state: 1, stage: 1, stage_title: 1, body: 1, provider: 1, native_id: 1, assignee: 1, rank: 1, parent: 1, closed: 1, uri: 1 }
