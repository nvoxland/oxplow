# The Work panel reads the work-item interface: with the work list switched
# to none, only the effort no item names is left.
given:
  - { command: oxplow.effort.open, input: { thread: thr1 } }
  - { command: oxplow.work_item.create, input: { title: Next up, state: todo, assignee: thr1 } }
  - { command: oxplow.work_item.create, input: { title: Stuck, state: blocked, assignee: thr1 } }
  - { command: oxplow.work_item.create, input: { title: Someday } }
when: { part: oxplow/work-panel, params: { thread_id: 1 } }
expect:
  loaders:
    work: { rows: [{ grp: In progress, title: Untitled effort }, { grp: Up next, title: Next up }, { grp: Up next, title: Stuck }] }
steps:
  - given:
      - { command: oxplow.capability.choose, input: { capability: work_items, provider: none }, confirmed: true }
  - expect: { loaders: { work: { rows: [{ grp: In progress, title: Untitled effort }] } } }
