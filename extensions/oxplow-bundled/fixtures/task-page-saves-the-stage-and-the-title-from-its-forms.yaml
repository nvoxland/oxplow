# A task's page: its Move to form transitions the item and its Details
# form renames it; the board then shows it in its new stage under the new
# title.
requires: [oxtask]
given:
  - { command: oxtask.task.create, input: { title: Item to move, stage: ready } }
  - { command: oxplow.tasks.assign, input: { uri: "oxplow:oxplow/task?id=tsk1&provider=oxtask", to: "oxplow:oxplow/thread?id=thr1" } }
when: { page: task-detail, params: { uri: "oxplow:oxplow/task?id=tsk1&provider=oxtask", thread_id: 1, stream_id: 1 } }
expect:
  loaders: { state: { rows: [{ stage: ready }] }, fields: { rows: [{ title: Item to move }] } }
steps:
  - submit: { node: state, input: { id: tsk1, stage: in_progress } }
    expect: { ok: true }
  - submit: { node: fields, input: { id: tsk1, title: Item moved and renamed } }
    expect: { ok: true }
  - expect:
      loaders:
        row: { rows: [{ title: Item moved and renamed }] }
        state: { rows: [{ stage: in_progress }] }
  - when: { page: work, params: { show: thread, priority: any, thread_id: 1, stream_id: 1 } }
    expect: { loaders: { board: { rows: [{ title: Item moved and renamed, state: in_progress }] } } }
