# The effort's conversation, tool calls, recorded decisions and stated
# claims become one reasoning job, keyed by the effort. Each turn's final
# answer is in the request.
when:
  command: oxplow.effort.infer_reasoning
  input: { effort: "eff7" }
  answers:
    sql.read:
      - [{ id: 7, work_item: "oxplow:oxplow/work_item?id=tsk1&provider=oxplow", title: Add CSV export }]
      - [{ prompt: Add CSV export to reports, answer: Done; used the csv crate. }]
      - [{ tool: Bash, path: null, detail: cargo add csv, ok: 1 }, { tool: Edit, path: src/report.rs, detail: null, ok: 1 }]
      - [{ question: Where does export live? }]
      - [{ statement: The export tests pass. }]
expect:
  commands: [oxplow.reasoning.ask]
