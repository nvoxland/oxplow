# The page of what the person holds: open tasks assigned to them, a
# started one under In progress, the others (to do, blocked) under Up next
# in the person's queue order, a task of an epic under its epic. A thread's
# task, nobody's and a closed one are not shown. Finished is left out:
# a closed task is unassigned and nothing records who held it.
given:
  - { command: oxplow.task.create, input: { title: Later, stage: todo, assignee: "oxplow:oxplow/person" }, bind: later }
  - { command: oxplow.task.create, input: { title: Sooner, stage: todo, assignee: "oxplow:oxplow/person" }, bind: sooner }
  - { command: oxplow.task.create, input: { title: Going, stage: todo, assignee: "oxplow:oxplow/person" }, bind: going }
  - { command: oxplow.task.create, input: { title: Closing, stage: todo, assignee: "oxplow:oxplow/person" }, bind: closing }
  - { command: oxplow.task.create, input: { title: A thread's, stage: todo, assignee: thr1 } }
  - { command: oxplow.task.create, input: { title: Nobody's, stage: todo } }
  - { command: oxplow.task.reorder, input: { uri: $sooner.uri, before: $later.uri } }
  - { command: oxplow.task.transition, input: { uri: $going.uri, to: in_progress } }
  - { command: oxplow.task.transition, input: { uri: $closing.uri, to: done } }
when: { page: oxplow/assigned-to-you }
expect:
  loaders:
    lines:
      rows:
        - { grp: In progress, title: Going }
        - { grp: Up next, title: Sooner }
        - { grp: Up next, title: Later }
