# The rail's Work panel body: what the thread is working on — its open
# effort, the items assigned to it next, and what its efforts finished —
# under headings; clearing hides what finished before it. An effort no
# item names shows by its own title, in progress while open, then
# finished (a new effort closes the thread's open one). An item done with
# no effort here isn't the thread's work.
given:
  - { command: oxplow.work_item.create, input: { title: Shipped, assignee: thr1 }, bind: shipped }
  - { command: oxplow.effort.open, input: { thread: thr1, work_item: $shipped.uri } }
  - { command: oxplow.work_item.transition, input: { uri: $shipped.uri, to: done } }
  - { command: oxplow.work_item.create, input: { title: Done elsewhere, state: done } }
  - { command: oxplow.effort.open, input: { thread: thr1 } }
  - { command: oxplow.work_item.create, input: { title: Next up, state: todo, assignee: thr1 } }
when: { part: oxplow/work-panel, params: { thread_id: 1 } }
expect:
  loaders:
    work:
      rows:
        # The effort, linked to nothing, by its own title.
        - { grp: In progress, title: Untitled effort }
        - { grp: Up next, title: Next up }
        - { grp: Finished, title: Shipped }
steps:
  - given: [{ command: oxplow.work.clear_finished, input: { thread_id: 1 } }]
  - expect:
      loaders: { work: { rows: [{ grp: In progress, title: Untitled effort }, { grp: Up next, title: Next up }] } }
  - given:
      - { command: oxplow.effort.open, input: { thread: thr1, title: Tidy the shell scripts }, bind: tidy }
  - expect:
      loaders: { work: { rows: [{ grp: In progress, title: Tidy the shell scripts }, { grp: Up next, title: Next up }, { grp: Finished, title: Untitled effort }] } }
  - given: [{ command: oxplow.effort.close, input: { effort: $tidy.effort } }]
  - expect:
      loaders: { work: { rows: [{ grp: Up next, title: Next up }, { grp: Finished, title: Tidy the shell scripts }, { grp: Finished, title: Untitled effort }] } }
