# An acceptance logged before the payload named its effort by bare id
# (`oxplow_bundled.accepted@1`, the effort a URI) is read as the current
# version: the follow-up still files, about the effort.
when:
  effect: verify-unchecked
  event:
    type: oxplow_bundled.accepted
    v: 1
    seq: 7
    subject: ["oxplow:oxplow/effort?id=eff3", "oxplow:oxplow/work_item?id=tsk1&provider=oxplow", "oxplow:oxplow/claim?id=4"]
    payload: { effort: "oxplow:oxplow/effort?id=eff3", work_item: "oxplow:oxplow/work_item?id=tsk1&provider=oxplow", unverified: 1, inferred: 0, deviated: 0 }
  answers:
    sql.read:
      - [{ claims: '[{"claim":"oxplow:oxplow/claim?id=4","statement":"Tests pass."}]', decisions: '[]' }]
expect:
  commands: [oxplow.work_item.create]
