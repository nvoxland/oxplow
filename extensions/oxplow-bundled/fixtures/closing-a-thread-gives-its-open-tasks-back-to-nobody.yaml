# Closing a thread releases what core released: its open tasks go to the end
# of nobody's queue, in the order the thread held them, each with its assignee
# cleared and a place; a done task (which has no assignee) is left, and so is
# another thread's.
requires: [oxtask]
given:
  - { command: oxplow.thread.create, input: { stream: str1, title: Old } }
  - { command: oxtask.task.create, input: { title: First, stage: ready } }
  - { command: oxplow.tasks.assign, input: { uri: "oxplow:oxplow/task?id=tsk1&provider=oxtask", to: "oxplow:oxplow/thread?id=thr2" } }
  - { command: oxtask.task.create, input: { title: Second, stage: ready } }
  - { command: oxplow.tasks.assign, input: { uri: "oxplow:oxplow/task?id=tsk2&provider=oxtask", to: "oxplow:oxplow/thread?id=thr2" } }
  - { command: oxtask.task.create, input: { title: Finished, stage: ready } }
  - { command: oxplow.tasks.assign, input: { uri: "oxplow:oxplow/task?id=tsk3&provider=oxtask", to: "oxplow:oxplow/thread?id=thr2" } }
  - { command: oxtask.task.create, input: { title: Mine, stage: ready } }
  - { command: oxplow.tasks.assign, input: { uri: "oxplow:oxplow/task?id=tsk4&provider=oxtask", to: "oxplow:oxplow/thread?id=thr1" } }
  - { command: oxtask.task.move, input: { id: tsk3, stage: done } }
  - { command: oxplow.thread.close, input: { thread: thr2 } }
when: { sql: "SELECT title, assignee, rank FROM v_oxplow_task ORDER BY title" }
expect:
  rows:
    - { title: Finished, assignee: null, rank: null }
    - { title: First, assignee: null, rank: 0 }
    - { title: Mine, assignee: "oxplow:oxplow/thread?id=thr1", rank: 0 }
    - { title: Second, assignee: null, rank: 1 }
