# Disabled again while its repair item is open: a comment on it, not a
# second item.
input:
  effect: repair-disabled
  event:
    type: contribution.disabled
    payload: { contribution: "collector:work/hot", reason: "3 failures in a row; the last: boom again" }
  answers:
    sql.read:
      - [{ provider: oxplow, open_item: "work_item:oxplow:tsk9" }]
      - [{ declared: null, collector_errors: null, effect_errors: null, last_error: boom }]
expect:
  commands: [oxplow.work_item.comment]
