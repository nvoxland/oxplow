# Link to Task… on an effort: the form keeps the effort and offers the
# open work items, newest change first; a closed one isn't offered.
given:
  - { command: oxplow.effort.open, input: { thread: thr1 } }
  - { command: oxplow.work_item.create, input: { title: Open one } }
  - { command: oxplow.work_item.create, input: { title: Closed one, stage: done } }
when: { form: link-effort, params: { uri: "oxplow:oxplow/effort?id=eff1" } }
expect:
  values: { effort: eff1 }
  fixed: [effort]
  fields: [work_item]
steps:
  - when: { query: link-effort#changes_link_items }
    expect: { rows: [{ label: Open one }] }
