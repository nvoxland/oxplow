# The review's `tests` signals: a test the change deleted, a test file that
# now asserts less, a test newly skipped, and a test file deleted. Each is
# high: weakening a test is how an agent makes a failing check pass. Only
# test files count: a `.skip(1)` or a dropped `.expect()` in other code is
# no test, and a renamed test keeps the file's count, so it isn't "deleted".
given:
  - observe: { turn: { prompt: base, write: { path: tests/it.rs, body: "#[test]\nfn a() {\n    assert_eq!(1, 1);\n    assert!(true);\n}\n\n#[test]\nfn b() {\n    assert!(true);\n}\n" } } }
  - observe: { turn: { prompt: base renamed, write: { path: tests/renamed.rs, body: "#[test]\nfn old_name() {\n    assert!(true);\n}\n" } } }
  - observe: { turn: { prompt: base gone, write: { path: tests/gone.rs, body: "#[test]\nfn x() {\n    assert!(true);\n}\n\n#[test]\nfn y() {\n    assert!(true);\n}\n" } } }
  - observe: { turn: { prompt: base lib, write: { path: src/lib.rs, body: "pub fn first(v: &[u32]) -> u32 {\n    v.iter().copied().next().expect(\"one\")\n}\n" } } }
  - { command: oxplow.vcs.stage, input: { stream: str1, paths: [tests/it.rs, tests/renamed.rs, tests/gone.rs, src/lib.rs] } }
  - { command: oxplow.vcs.commit, input: { stream: str1, message: base } }
  - observe: { turn: { prompt: weaken, write: { path: tests/it.rs, body: "#[test]\n#[ignore]\nfn a() {\n    assert_eq!(1, 1);\n}\n" } } }
  - observe: { turn: { prompt: rename, write: { path: tests/renamed.rs, body: "#[test]\nfn new_name() {\n    assert!(true);\n}\n" } } }
  - observe: { turn: { prompt: lib, write: { path: src/lib.rs, body: "pub fn first(v: &[u32]) -> Option<u32> {\n    v.iter().copied().skip(1).next()\n}\n" } } }
  - { command: oxplow.file.delete, input: { stream: str1, path: tests/gone.rs }, confirmed: true }
  - { command: oxplow.vcs.stage, input: { stream: str1, paths: [tests/it.rs, tests/renamed.rs, tests/gone.rs, src/lib.rs] } }
  - { command: oxplow.vcs.commit, input: { stream: str1, message: weaken }, bind: weaken }
  - observe: { analyze: { kind: commit, sha: $weaken.rev } }
when:
  sql: SELECT source, area, signal, severity, path, line, title, why, uri FROM v_oxplow_review_signal WHERE change_id = 1 AND area = 'tests' ORDER BY path, signal
expect:
  rows:
    - { source: oxplow/review_signal_tests, area: tests, signal: test-file-deleted, severity: high, path: tests/gone.rs, line: null, title: Test file deleted, why: The change deletes this file and its 2 tests., uri: null }
    - { source: oxplow/review_signal_tests, area: tests, signal: fewer-assertions, severity: high, path: tests/it.rs, line: null, title: Fewer assertions, why: "This file has 3 → 1 assertions.", uri: null }
    - { source: oxplow/review_signal_tests, area: tests, signal: skip-added, severity: high, path: tests/it.rs, line: null, title: Test skipped, why: "This file has 0 → 1 skip marker.", uri: null }
    - { source: oxplow/review_signal_tests, area: tests, signal: test-deleted, severity: high, path: tests/it.rs, line: 8, title: "Test deleted: b", why: "The file has 2 → 1 tests.", uri: "oxplow:oxplow/symbol?path=tests/it.rs&symbol=b" }
