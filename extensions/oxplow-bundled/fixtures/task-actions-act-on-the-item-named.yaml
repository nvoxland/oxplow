# Task actions, the agents' page for one item: Mark done moves the
# item it names, and Record a block asks which item it blocks.
requires: [oxtask]
given:
  - { command: oxtask.task.create, input: { title: Fix it, stage: ready } }
  - { command: oxtask.task.create, input: { title: Other, stage: ready } }
when: { page: task-actions, params: { uri: "oxplow:oxplow/task?id=tsk1&provider=oxtask" } }
expect:
  loaders: { item: { rows: [{ title: Fix it, stage_title: Ready }] } }
  actions: [done, blocks]
steps:
  - press: { action: done }
    expect: { ok: true }
  - expect: { loaders: { item: { rows: [{ title: Fix it, stage_title: Done }] } } }
  - when: { page: task-actions, params: { uri: "oxplow:oxplow/task?id=tsk2&provider=oxtask" } }
    expect: { loaders: { item: { rows: [{ title: Other, stage_title: Ready }] } } }
