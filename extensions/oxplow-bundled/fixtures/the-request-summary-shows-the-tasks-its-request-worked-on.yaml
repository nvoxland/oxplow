# The tasks a request worked on are bundled's section of the request
# summary (a part mounted in its `sections` slot): one row per task, with its
# strongest evidence. A request that worked on none says so.
requires: [oxtask]
given:
  - { command: oxtask.task.create, input: { title: Fix the parser, stage: ready } }
  - observe:
      turn:
        prompt: Fix the parser
        during:
          - { command: oxtask.task.move, input: { id: tsk1, stage: in_progress }, as: agent }
  - observe: { turn: { prompt: Look around, answer: nothing } }
when: { part: request-tasks, params: { request: req1 } }
expect:
  loaders:
    tasks: { rows: [{ task: "oxplow:oxplow/task?id=tsk1&provider=oxtask", title: Fix the parser, basis: transition }] }
steps:
  # A later request on the thread, with the task still held: the weakest
  # evidence. A request nobody made reads nothing.
  - params: { request: req2 }
    expect: { loaders: { tasks: { rows: [{ task: "oxplow:oxplow/task?id=tsk1&provider=oxtask", basis: assigned }] } } }
  - params: { request: req9 }
    expect: { loaders: { tasks: { rows: 0 } } }
