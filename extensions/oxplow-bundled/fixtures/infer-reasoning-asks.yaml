# A model serves the reasoning profile (here, Main's): the finished
# effort's decisions and claims are asked about.
when:
  effect: infer-reasoning
  event:
    type: effort.finished
    payload: { effort: "eff7", work_item: "oxplow:oxplow/work_item?id=tsk1&provider=oxplow", end_snapshot: 3 }
  answers:
    ai.discover:
      - { role: oxplow-bundled/reasoning, model: { provider: local, model: llama }, problem: null }
expect:
  commands: [oxplow.effort.infer_reasoning]
