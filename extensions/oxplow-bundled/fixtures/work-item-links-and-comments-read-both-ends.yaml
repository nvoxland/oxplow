# A work item's Links and Comments, each a part its page embeds where the
# list keeps them: a link shows from both ends, and only its own end can
# unlink it; comments in the order they were written.
given:
  - { command: oxplow.work_item.create, input: { title: The item }, bind: item }
  - { command: oxplow.work_item.create, input: { title: Its blocker }, bind: blocker }
  - { command: oxplow.work_item.link, input: { uri: $item.uri, target: $blocker.uri, link_type: blocks } }
  - { command: oxplow.work_item.comment, input: { uri: $item.uri, body: A note. } }
  - { command: oxplow.work_item.comment, input: { uri: $item.uri, body: Another. } }
when: { part: work-item-links, params: { uri: $item.uri } }
expect:
  loaders:
    links: { rows: [{ item: Its blocker, link_type: blocks, direction: to, outbound: 1 }] }
steps:
  - when: { part: work-item-links, params: { uri: $blocker.uri } }
    expect: { loaders: { links: { rows: [{ item: The item, direction: from, outbound: 0, other: $item.uri }] } } }
  - when: { part: work-item-comments, params: { uri: $item.uri } }
    expect: { loaders: { comments: { rows: [{ body: A note. }, { body: Another. }] } } }
