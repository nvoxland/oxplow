# The New Knowledge Page form asks for a title and a body, and no id: the
# store derives it from the title. With one store on it asks for no store.
# The command answers the page it wrote, which the menu entry opens.
when: { form: new-knowledge-page }
expect:
  values: { title: "", body: "" }
steps:
  - when: { command: oxplow.knowledge.new_page, input: { title: Auth flow, body: "How a login becomes a session.\n" } }
    expect:
      ok: true
      result: { page: "oxplow:oxplow/knowledge?id=auth-flow&store=oxwiki", store: oxwiki, id: auth-flow }
  - when: { page: knowledge }
    expect: { loaders: { pages: { rows: [{ id: auth-flow, store: oxwiki, title: Auth flow }] } } }
