# A task's Comment… adds a comment; the Comments part then reads it.
requires: [oxtask]
given:
  - { command: oxtask.task.create, input: { title: Item with notes, stage: ready } }
when: { part: task-comments, params: { uri: "oxplow:oxplow/task?id=tsk1&provider=oxtask", id: tsk1 } }
expect: { loaders: { comments: { rows: 0 } } }
steps:
  - press: { action: comment, node: comments, input: { body: A note for later. } }
    expect: { ok: true }
  - expect: { loaders: { comments: { rows: [{ body: A note for later. }] } } }
