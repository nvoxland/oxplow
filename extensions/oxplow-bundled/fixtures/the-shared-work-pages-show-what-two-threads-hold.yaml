# Shared work: items with open efforts on two threads, files two threads'
# efforts changed, an epic whose children sit on different threads. The thread
# and item variants keep only their own rows.
given:
  - { command: oxplow.work_item.create, input: { title: Shared item, thread: thr1 }, bind: item }
  - { command: oxplow.work_item.transition, input: { uri: $item.uri, to: in_progress } }
  - observe: { turn: { prompt: alpha, tools: [{ name: Edit, kind: edit, paths: [src/shared.rs], ok: true }] } }
when: { page: oxplow-bundled/shared-work }
expect: { loaders: { shared_work: { rows: 0 } } }
steps:
  - given:
      # A second thread on the same item, with its own effort and a file both
      # efforts changed.
      - { command: oxplow.thread.create, input: { stream: str1, title: Beta }, bind: beta }
      - { command: oxplow.effort.open, input: { thread: $beta.id, work_item: $item.uri } }
      - observe: { turn: { thread: $beta.id, prompt: beta, tools: [{ name: Edit, kind: edit, paths: [src/shared.rs], ok: true }] } }
      # An epic whose children are on the two threads.
      - { command: oxplow.work_item.create, input: { title: Epic }, bind: epic }
      - { command: oxplow.work_item.create, input: { title: Child A, parent_uri: $epic.uri, thread: thr1 } }
      - { command: oxplow.work_item.create, input: { title: Child B, parent_uri: $epic.uri, thread: $beta.id } }
  - when: { page: oxplow-bundled/shared-work }
    expect:
      loaders:
        shared_work:
          rows:
            contains:
              - { section: Items on two threads, what: Shared item }
              - { section: Files two threads changed, what: src/shared.rs }
              - { section: Epics spread over threads, what: Epic }
  # The thread variant keeps what involves the thread; a third thread sees
  # none of it.
  - when: { part: oxplow-bundled/thread-shared-work, params: { thread_id: 2 } }
    expect: { loaders: { thread_shared_work: { rows: 3 } } }
  - given:
      - { command: oxplow.thread.create, input: { stream: str1, title: Gamma } }
  - when: { part: oxplow-bundled/thread-shared-work, params: { thread_id: 3 } }
    expect: { loaders: { thread_shared_work: { rows: 0 } } }
  # The item variant: the item's own row and the files its efforts changed.
  - when: { part: oxplow-bundled/item-shared-work, params: { uri: $item.uri } }
    expect:
      loaders:
        item_shared_work:
          rows:
            contains:
              - { section: Items on two threads }
              - { section: Files two threads changed }
