# Task List shows one of the list's stages (its first to-do stage unless
# asked), the State filter listing them: an epic's children under
# it, closed items latest first with when they closed — a closed item is
# nobody's, so "this thread" shows the ones its efforts finished. Wider
# than one assignee, each row says who it's for; with no thread, "this
# thread" is everything. Its quick add files the stage it shows (to do
# for a closed one), assigned to whom it shows. A row's Mark ▸ offers the
# list's stages and its Assign to ▸ the stream's threads and you.
given:
  - { command: oxplow.work_item.create, input: { title: An epic, assignee: thr1 }, bind: epic }
  - { command: oxplow.work_item.create, input: { title: Its child, assignee: thr1, parent_uri: $epic.uri } }
  - { command: oxplow.work_item.create, input: { title: In the backlog, stage: backlog } }
  - { command: oxplow.work_item.create, input: { title: Mine, assignee: "oxplow:oxplow/person" } }
  - { command: oxplow.work_item.create, input: { title: First done, assignee: thr1 }, bind: first }
  - { command: oxplow.work_item.create, input: { title: Second done, assignee: thr1 }, bind: second }
  - { command: oxplow.work_item.create, input: { title: Done elsewhere, stage: done } }
  - { command: oxplow.work_item.transition, input: { uri: $first.uri, to: in_progress }, as: agent }
  - { command: oxplow.work_item.transition, input: { uri: $first.uri, to: done }, as: agent }
  - { command: oxplow.work_item.transition, input: { uri: $second.uri, to: in_progress }, as: agent }
  - { command: oxplow.work_item.transition, input: { uri: $second.uri, to: done }, as: agent }
when: { page: task-list, params: { show: thread, state: todo, priority: any, thread_id: 1, stream_id: 1 } }
expect:
  loaders:
    row: { rows: [{ scope: thread, new_task: "oxplow:oxplow/page?page=new-task" }] }
    new_item: { rows: [{ stage: todo, assignee: "oxplow:oxplow/thread?id=thr1" }] }
    marks: { rows: [{ value: backlog, label: Backlog }, { value: ready, label: Ready }, { value: in_progress }, { value: blocked }, { value: done }, { value: canceled }] }
    assignees: { rows: [{ value: "oxplow:oxplow/thread?id=thr1", label: Thread }, { value: "oxplow:oxplow/person", label: You }] }
    list:
      rows:
        - { title: An epic, stage: ready, depth: 0, assignee_shown: null }
        - { title: Its child, depth: 1 }
  actions: [new]
  nodes:
    - { id: list, kind: viz, actions: [reorder, nest, mark, priority-urgent, priority-high, priority-medium, priority-low, unparent, assign, unassign, delete] }
steps:
  - params: { state: done }
    expect: { loaders: { list: { rows: [{ title: Second done, closed_at: $any }, { title: First done }] } } }
  - params: { state: blocked }
    expect: { loaders: { list: { rows: 0 }, new_item: { rows: [{ stage: blocked, assignee: "oxplow:oxplow/thread?id=thr1" }] } } }
  - params: { state: backlog, show: all }
    expect: { loaders: { list: { rows: [{ title: In the backlog, assignee_shown: Unassigned }] }, new_item: { rows: [{ stage: backlog, assignee: null }] } } }
  - params: { state: todo, show: me }
    expect: { loaders: { list: { rows: [{ title: Mine, assignee_shown: null }] } } }
  - params: { show: all }
    expect: { loaders: { list: { rows: { contains: [{ title: Mine, assignee_shown: You }, { title: An epic, assignee_shown: Thread }] } } } }
  - params: { show: thread, thread_id: null }
    expect: { loaders: { row: { rows: [{ scope: all }] } } }
  # Mark ▸ Blocked, then Assign to ▸ You: each the option picked.
  - press: { action: mark, node: list, row: { uri: $epic.uri }, option: blocked }
    expect: { ok: true }
  - params: { state: blocked }
    expect: { loaders: { list: { rows: [{ title: An epic, stage: blocked }] } } }
  - params: { state: blocked }
    press: { action: assign, node: list, row: { uri: $epic.uri }, option: "oxplow:oxplow/person" }
    expect: { ok: true }
  - params: { state: blocked, show: me }
    expect: { loaders: { list: { rows: [{ title: An epic }] } } }
  # The State filter's options: the list's stages, a bucket's first named
  # by its bucket.
  - when: { query: task-list#state_options }
    expect: { rows: [{ value: backlog, label: Backlog }, { value: todo, label: Ready }, { value: in_progress }, { value: blocked }, { value: done }, { value: canceled }] }
