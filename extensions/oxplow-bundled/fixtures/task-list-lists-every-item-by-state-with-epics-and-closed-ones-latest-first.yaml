# Task List lists the task tracker's items in one of its stages (its first
# to-do stage unless asked), whoever they are assigned to: an epic's
# children under it, closed items latest first with when they closed.
# A row names who it is assigned to, when anyone is. Its quick add files
# the stage it shows (to do for a closed one), for nobody. A row's Mark ▸
# offers the list's stages and its Assign to ▸ the stream's threads and you.
given:
  - { command: oxplow.task.create, input: { title: An epic, assignee: thr1 }, bind: epic }
  - { command: oxplow.task.create, input: { title: Its child, assignee: thr1, parent_uri: $epic.uri } }
  - { command: oxplow.task.create, input: { title: In the backlog, stage: backlog } }
  - { command: oxplow.task.create, input: { title: Mine, assignee: "oxplow:oxplow/person" } }
  - { command: oxplow.task.create, input: { title: Nobody's } }
  - { command: oxplow.task.create, input: { title: First done, assignee: thr1 }, bind: first }
  - { command: oxplow.task.create, input: { title: Second done, assignee: thr1 }, bind: second }
  - { command: oxplow.task.create, input: { title: Done elsewhere, stage: done } }
  - { command: oxplow.task.transition, input: { uri: $first.uri, to: in_progress }, as: agent }
  - { command: oxplow.task.transition, input: { uri: $first.uri, to: done }, as: agent }
  - { command: oxplow.task.transition, input: { uri: $second.uri, to: in_progress }, as: agent }
  - { command: oxplow.task.transition, input: { uri: $second.uri, to: done }, as: agent }
when: { page: task-list, params: { state: todo, priority: any, stream_id: 1 } }
expect:
  params: { state: todo, priority: any }
  loaders:
    new_item: { rows: [{ stage: todo }] }
    marks: { rows: [{ value: backlog, label: Backlog }, { value: ready, label: Ready }, { value: in_progress }, { value: blocked }, { value: done }, { value: canceled }] }
    assignees: { rows: [{ value: "oxplow:oxplow/thread?id=thr1", label: Thread }, { value: "oxplow:oxplow/person", label: You }] }
    list:
      rows:
        contains:
          - { title: An epic, stage: ready, depth: 0, assignee_shown: Thread }
          - { title: Its child, depth: 1, assignee_shown: Thread }
          - { title: Mine, assignee_shown: You }
          - { title: Nobody's, assignee_shown: null }
  actions: [new]
  nodes:
    - { id: list, kind: viz, actions: [reorder, nest, mark, priority-urgent, priority-high, priority-medium, priority-low, unparent, assign, unassign, delete] }
steps:
  - params: { state: todo }
    expect: { loaders: { list: { rows: 4 } } }
  - params: { state: done }
    expect: { loaders: { list: { rows: [{ title: Second done, closed_at: $any }, { title: First done }, { title: Done elsewhere }] } } }
  - params: { state: blocked }
    expect: { loaders: { list: { rows: 0 }, new_item: { rows: [{ stage: blocked }] } } }
  - params: { state: backlog }
    expect: { loaders: { list: { rows: [{ title: In the backlog, assignee_shown: null }] }, new_item: { rows: [{ stage: backlog }] } } }
  # Mark ▸ Blocked, then Assign to ▸ You: each the option picked.
  - press: { action: mark, node: list, row: { uri: $epic.uri }, option: blocked }
    expect: { ok: true }
  - params: { state: blocked }
    expect: { loaders: { list: { rows: [{ title: An epic, stage: blocked, assignee_shown: Thread }] } } }
  - params: { state: blocked }
    press: { action: assign, node: list, row: { uri: $epic.uri }, option: "oxplow:oxplow/person" }
    expect: { ok: true }
  - params: { state: blocked }
    expect: { loaders: { list: { rows: [{ title: An epic, assignee_shown: You }] } } }
  # The State filter's options: the list's stages, a bucket's first named
  # by its bucket.
  - when: { query: task-list#state_options }
    expect: { rows: [{ value: backlog, label: Backlog }, { value: todo, label: Ready }, { value: in_progress }, { value: blocked }, { value: done }, { value: canceled }] }
