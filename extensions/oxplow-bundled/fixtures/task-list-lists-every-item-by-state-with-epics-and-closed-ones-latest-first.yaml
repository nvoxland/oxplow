# Task List shows one state (To Do unless asked): an epic's children under
# it, closed items latest first with when they closed — a closed item is
# nobody's, so "this thread" shows the ones its efforts finished. Wider
# than one assignee, each row says who it's for; with no thread, "this
# thread" is everything. Its quick add files the state it shows (To Do
# for a closed one), assigned to whom it shows.
given:
  - { command: oxplow.work_item.create, input: { title: An epic, assignee: thr1 }, bind: epic }
  - { command: oxplow.work_item.create, input: { title: Its child, assignee: thr1, parent_uri: $epic.uri } }
  - { command: oxplow.work_item.create, input: { title: In the backlog, stage: backlog } }
  - { command: oxplow.work_item.create, input: { title: Mine, assignee: "oxplow:oxplow/person" } }
  - { command: oxplow.work_item.create, input: { title: First done, assignee: thr1 }, bind: first }
  - { command: oxplow.work_item.create, input: { title: Second done, assignee: thr1 }, bind: second }
  - { command: oxplow.work_item.create, input: { title: Done elsewhere, stage: done } }
  - { command: oxplow.work_item.transition, input: { uri: $first.uri, to: in_progress }, as: agent }
  - { command: oxplow.work_item.transition, input: { uri: $first.uri, to: done }, as: agent }
  - { command: oxplow.work_item.transition, input: { uri: $second.uri, to: in_progress }, as: agent }
  - { command: oxplow.work_item.transition, input: { uri: $second.uri, to: done }, as: agent }
when: { page: task-list, params: { show: thread, state: todo, priority: any, thread_id: 1, stream_id: 1 } }
expect:
  loaders:
    row: { rows: [{ scope: thread, new_task: "oxplow:oxplow/page?page=new-task" }] }
    new_item: { rows: [{ state: todo, assignee: "oxplow:oxplow/thread?id=thr1" }] }
    list:
      rows:
        - { title: An epic, depth: 0, assignee_shown: null }
        - { title: Its child, depth: 1 }
  actions: [new]
steps:
  - params: { state: done }
    expect: { loaders: { list: { rows: [{ title: Second done, closed_at: $any }, { title: First done }] } } }
  - params: { state: blocked }
    expect: { loaders: { list: { rows: 0 }, new_item: { rows: [{ state: blocked, assignee: "oxplow:oxplow/thread?id=thr1" }] } } }
  - params: { state: backlog, show: all }
    expect: { loaders: { list: { rows: [{ title: In the backlog, assignee_shown: Unassigned }] }, new_item: { rows: [{ state: backlog, assignee: null }] } } }
  - params: { state: todo, show: me }
    expect: { loaders: { list: { rows: [{ title: Mine, assignee_shown: null }] } } }
  - params: { show: all }
    expect: { loaders: { list: { rows: { contains: [{ title: Mine, assignee_shown: You }, { title: An epic, assignee_shown: Thread }] } } } }
  - params: { show: thread, thread_id: null }
    expect: { loaders: { row: { rows: [{ scope: all }] } } }
