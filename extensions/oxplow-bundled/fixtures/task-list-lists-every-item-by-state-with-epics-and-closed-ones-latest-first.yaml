# Task List shows one state (To Do unless asked): an epic's children under
# it, closed items latest first with when they closed; wider than one
# thread, each row says its thread; with no thread, "this thread" is
# everything. Its quick add files To Do on the thread, Blocked while it
# shows blocked items, and into the backlog while it shows the backlog.
given:
  - { command: oxplow.work_item.create, input: { title: An epic, thread: thr1 }, bind: epic }
  - { command: oxplow.work_item.create, input: { title: Its child, thread: thr1, parent_uri: $epic.uri } }
  - { command: oxplow.work_item.create, input: { title: In the backlog } }
  - { command: oxplow.work_item.create, input: { title: First done, thread: thr1, state: done } }
  - { command: oxplow.work_item.create, input: { title: Second done, thread: thr1, state: done } }
when: { page: task-list, params: { show: thread, state: todo, priority: any, thread_id: 1, stream_id: 1 } }
expect:
  loaders:
    row: { rows: [{ scope: thread, new_task: "oxplow:oxplow/page?page=new-task" }] }
    new_item: { rows: [{ state: todo, thread: thr1 }] }
    list:
      rows:
        - { title: An epic, depth: 0, thread_shown: null }
        - { title: Its child, depth: 1 }
  actions: [new]
steps:
  - params: { state: done }
    expect: { loaders: { list: { rows: [{ title: Second done, closed_at: $any }, { title: First done }] } } }
  - params: { state: blocked }
    expect: { loaders: { list: { rows: 0 }, new_item: { rows: [{ state: blocked, thread: thr1 }] } } }
  - params: { state: todo, show: backlog }
    expect: { loaders: { list: { rows: [{ title: In the backlog }] }, new_item: { rows: [{ state: todo, thread: null }] } } }
  - params: { show: all }
    expect: { loaders: { list: { rows: { contains: [{ title: In the backlog, thread_shown: Backlog }] } } } }
  - params: { show: thread, thread_id: null }
    expect: { loaders: { row: { rows: [{ scope: all }] } } }
