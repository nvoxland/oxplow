# Shared work: a task requests on two threads worked on, a file two
# threads' requests changed (a turn's own edit call names it, or it was the
# only turn changing it), an epic whose children sit on different threads.
# Filtered to a thread, it keeps what involves that thread.
requires: [oxtask]
given:
  - { command: oxtask.task.create, input: { title: Shared item, stage: ready } }
  - { command: oxplow.tasks.assign, input: { uri: "oxplow:oxplow/task?id=tsk1&provider=oxtask", to: "oxplow:oxplow/thread?id=thr1" } }
  - { command: oxtask.task.move, input: { id: tsk1, stage: in_progress } }
  - observe: { turn: { prompt: alpha, tools: [{ name: Edit, kind: edit, paths: [src/shared.rs], ok: true }] } }
  - observe: { snapshot: { trigger: turn_end, files: [{ path: src/shared.rs, hash: a }] } }
when: { page: oxplow/shared-work }
expect: { loaders: { shared_work: { rows: 0 } } }
steps:
  - given:
      # A second thread's request that ran a task command on the same item
      # and changed the same file.
      - { command: oxplow.thread.create, input: { stream: str1, title: Beta }, bind: beta }
      - observe:
          turn:
            thread: $beta.id
            prompt: beta
            during: [{ command: oxtask.task.update, input: { id: tsk1, title: Shared item }, as: agent }]
            tools: [{ name: Edit, kind: edit, paths: [src/shared.rs], ok: true }]
      - observe: { snapshot: { trigger: turn_end, files: [{ path: src/shared.rs, hash: b }] } }
      # An epic whose children are on the two threads.
      - { command: oxtask.task.create, input: { title: Epic, stage: ready } }
      - { command: oxtask.task.create, input: { title: Child A, stage: ready, parent: tsk2 } }
      - { command: oxplow.tasks.assign, input: { uri: "oxplow:oxplow/task?id=tsk3&provider=oxtask", to: "oxplow:oxplow/thread?id=thr1" } }
      - { command: oxtask.task.create, input: { title: Child B, stage: ready, parent: tsk2 } }
      - { command: oxplow.tasks.assign, input: { uri: "oxplow:oxplow/task?id=tsk4&provider=oxtask", to: "oxplow:oxplow/thread?id=thr2" } }
  - when: { page: oxplow/shared-work }
    expect:
      loaders:
        shared_work:
          rows:
            - { section: Epics spread over threads, what: Epic, threads: "Thread,Beta" }
            - { section: Files two threads changed, what: src/shared.rs }
            - { section: Items on two threads, what: Shared item }
  - when: { page: oxplow/shared-work, params: { thread_id: 2 } }
    expect: { loaders: { shared_work: { rows: 3 } } }
  - given:
      - { command: oxplow.thread.create, input: { stream: str1, title: Gamma } }
  - when: { page: oxplow/shared-work, params: { thread_id: 3 } }
    expect: { loaders: { shared_work: { rows: 0 } } }
