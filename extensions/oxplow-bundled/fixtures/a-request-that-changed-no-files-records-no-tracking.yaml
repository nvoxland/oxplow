# Tracking is about the requests that changed files: a request that only read
# records nothing.
given:
  - observe:
      turn:
        prompt: What does the greeting say?
        tools: [{ name: Read, kind: read, paths: [a.txt], ok: true }]
when: { sql: "SELECT count(*) AS n FROM v_fact WHERE measure_key = 'oxplow.request_tracked'" }
expect: { rows: [{ n: 0 }] }
