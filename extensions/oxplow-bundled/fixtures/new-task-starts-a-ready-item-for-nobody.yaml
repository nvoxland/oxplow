# New Task… opens this form: a new item starts in the list's first to-do
# stage (`todo`, its bucket), assigned to nobody
# (any thread may take it) and under no epic unless one is given.
when: { form: new-task, params: { thread_id: 1 } }
expect:
  values: { stage: todo, parent_uri: null }
steps:
  # It may start in the list's backlog, to-do or blocked stage.
  - when: { query: new-task#new_task_stages }
    expect: { rows: [{ value: backlog, label: Backlog }, { value: todo, label: Ready }, { value: blocked, label: Blocked }] }
