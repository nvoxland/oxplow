# What to pick up next on a thread's list: ready items in list order, an
# open blocker holding one until it closes, and a ready epic first coming
# with its ready descendants as one unit.
when: { page: next-task, params: { thread: thr1 } }
steps:
  - expect: { loaders: { next_task: { rows: 0 } } }
  - given:
      - { command: oxplow.task.create, input: { title: a, assignee: thr1 }, bind: a }
      - { command: oxplow.task.create, input: { title: b, assignee: thr1, stage: blocked } }
      - { command: oxplow.task.create, input: { title: c, assignee: thr1 } }
  - expect: { loaders: { next_task: { rows: [{ title: a, role: ready }, { title: c, role: ready }] } } }
    bind: { c: 'loaders.next_task.rows[1].uri' }
  # An open blocker holds a; a closed one doesn't.
  - given:
      - { command: oxplow.task.create, input: { title: z }, bind: z }
      - { command: oxplow.task.link, input: { uri: $z.uri, target: $a.uri, link_type: blocks } }
  - expect: { loaders: { next_task: { rows: [{ title: c, role: ready }] } } }
  - given: [{ command: oxplow.task.transition, input: { uri: $z.uri, to: done } }]
  - expect: { loaders: { next_task: { rows: [{ title: a, role: ready }, { title: c, role: ready }] } } }
  # c is next, and becomes an epic once it has children.
  - given:
      - { command: oxplow.task.transition, input: { uri: $a.uri, to: done } }
      - { command: oxplow.task.create, input: { title: x, assignee: thr1 }, bind: x }
      - { command: oxplow.task.transition, input: { uri: $x.uri, to: in_progress } }
      - { command: oxplow.task.create, input: { title: c1, assignee: thr1, parent_uri: $c }, bind: c1 }
      - { command: oxplow.task.create, input: { title: c2, assignee: thr1, parent_uri: $c, stage: done } }
      - { command: oxplow.task.create, input: { title: g, assignee: thr1, parent_uri: $c1.uri } }
      - { command: oxplow.task.create, input: { title: y, assignee: thr1 } }
  - expect:
      loaders:
        next_task: { rows: [{ title: c, role: epic }, { title: c1, role: child }, { title: g, role: child }] }
