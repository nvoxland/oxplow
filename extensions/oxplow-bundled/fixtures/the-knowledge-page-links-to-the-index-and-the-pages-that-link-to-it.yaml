# "See also": a knowledge page links to the Knowledge index, to its
# freshness, and to the tasks and knowledge pages that link to it.
requires: [oxtask, oxwiki]
given:
  - { command: oxwiki.page.write, input: { title: Otters, body: "# Otters\n" } }
  - { command: oxwiki.page.write, input: { title: Holts, body: "# Holts\n\nSee [[otters]].\n" } }
  - { command: oxtask.task.create, input: { title: Feed the otters, body: "See [[otters]].", stage: ready } }
  - { command: oxplow.tasks.assign, input: { uri: "oxplow:oxplow/task?id=tsk1&provider=oxtask", to: "oxplow:oxplow/thread?id=thr1" } }
when: { page: knowledge-page, params: { uri: "oxplow:oxplow/knowledge?id=otters&store=oxwiki", store: oxwiki, id: otters } }
expect:
  see_also:
    - { title: Knowledge, uri: "oxplow:oxplow/page?page=knowledge" }
    - { title: Knowledge Freshness, uri: "oxplow:oxplow/page?id=otters&page=knowledge-freshness&store=oxwiki" }
    - { title: Feed the otters, uri: "oxplow:oxplow/task?id=tsk1&provider=oxtask" }
    - { title: Holts, uri: "oxplow:oxplow/knowledge?id=holts&store=oxwiki" }
