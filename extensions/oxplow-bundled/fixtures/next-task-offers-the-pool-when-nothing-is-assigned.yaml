# With nothing ready assigned to the thread, what to pick up is the pool:
# ready items assigned to nobody, the most pressing first. Another
# thread's items, the backlog and blocked ones aren't offered. Starting one
# assigns it to the thread that started it.
when: { page: next-task, params: { thread: thr1 } }
given:
  - { command: oxplow.thread.create, input: { stream: str1, title: Other }, bind: other }
  - { command: oxplow.task.create, input: { title: later, stage: backlog } }
  - { command: oxplow.task.create, input: { title: theirs, assignee: $other.id } }
  - { command: oxplow.task.create, input: { title: whenever, native: { priority: low } } }
  - { command: oxplow.task.create, input: { title: soon, native: { priority: urgent } }, bind: soon }
  - { command: oxplow.task.create, input: { title: stuck, stage: blocked } }
expect:
  loaders:
    next_task: { rows: [{ title: soon, role: pool }, { title: whenever, role: pool }] }
steps:
  - given:
      - { command: oxplow.task.create, input: { title: mine, assignee: thr1 } }
  - expect: { loaders: { next_task: { rows: [{ title: mine, role: ready }] } } }
