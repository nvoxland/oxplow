# A review check is a collector on `change.analyzed`; the Review page shows
# where it stands for each change from that change's own run: pending until
# the check has run for the change's latest analysis, failed when that run
# failed, else ok. A later run for another change never changes it.
# `oxplow.review.unused` fails for a change whose head commit doesn't exist
# (it can't read its diff); it is ok for a real one.
requires: [oxplow-rust]
given:
  - { files: { "src/lib.rs": "pub fn run() -> u32 {\n    1\n}\n" } }
  - { command: oxplow.vcs.stage, input: { stream: str1, paths: [src/lib.rs] } }
  - { command: oxplow.vcs.commit, input: { stream: str1, message: base } }
  - { files: { "src/lib.rs": "pub fn run() -> u32 {\n    2\n}\n" } }
  - { command: oxplow.vcs.stage, input: { stream: str1, paths: [src/lib.rs] } }
  - { command: oxplow.vcs.commit, input: { stream: str1, message: Change }, bind: change }
  - observe: { commit: { sha: $change.rev, subject: Change } }
  - observe: { analyze: { kind: commit, sha: $change.rev } }
  - observe: { symbols: { path: src/lib.rs, items: [{ name: run, kind: function, line: 1 }] } }
  - observe: { snapshot: { files: [{ path: src/lib.rs, body: "pub fn run() -> u32 {\n    2\n}\n" }] } }
  # Change 2: a commit that doesn't exist, with a file whose lines it removed.
  - observe: { change: { target: "0123456789abcdef0123456789abcdef01234567", files: [{ path: src/lib.rs, status: modified, additions: 1, deletions: 1 }] } }
  # The check fails for change 2, then runs ok for change 1.
  - observe: { event: { type: change.analyzed, v: 1, payload: { change_id: 2, kind: commit, target: "0123456789abcdef0123456789abcdef01234567", stream_id: 1, phase: files }, anchors: { stream_id: str1 } } }
  - observe: { event: { type: change.analyzed, v: 1, payload: { change_id: 1, kind: commit, target: $change.rev, stream_id: 1, phase: files }, anchors: { stream_id: str1 } } }
when: { sql: "SELECT change_id, collector, state, error IS NOT NULL AS has_error FROM v_oxplow_review_check ORDER BY change_id" }
expect:
  rows:
    - { change_id: 1, collector: oxplow/oxplow.review.unused, state: ok, has_error: 0 }
    - { change_id: 2, collector: oxplow/oxplow.review.unused, state: failed, has_error: 1 }
steps:
  # It fails for change 2 again: change 1's own run still says ok.
  - given:
      - observe: { event: { type: change.analyzed, v: 1, payload: { change_id: 2, kind: commit, target: "0123456789abcdef0123456789abcdef01234567", stream_id: 1, phase: files }, anchors: { stream_id: str1 } } }
  - expect:
      rows:
        - { change_id: 1, collector: oxplow/oxplow.review.unused, state: ok, has_error: 0 }
        - { change_id: 2, collector: oxplow/oxplow.review.unused, state: failed, has_error: 1 }
