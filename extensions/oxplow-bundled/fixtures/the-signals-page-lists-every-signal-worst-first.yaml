# The Signals page is every signal of a change under a heading per file,
# the worst file first and its worst signal first; the heading counts its
# high and medium signals. An empty filter means all, a set one narrows.
requires: [oxplow-rust]
given:
  - observe: { turn: { prompt: base, write: { path: tests/it.rs, body: "#[test]\nfn a() {\n    assert_eq!(1, 1);\n    assert!(true);\n}\n\n#[test]\nfn b() {\n    assert!(true);\n}\n" } } }
  - observe: { turn: { prompt: base lib, write: { path: src/lib.rs, body: "pub fn grow(a: u32) -> u32 {\n    a\n}\n" } } }
  - { command: oxplow.vcs.stage, input: { stream: str1, paths: [tests/it.rs, src/lib.rs] } }
  - { command: oxplow.vcs.commit, input: { stream: str1, message: base } }
  - observe: { turn: { prompt: weaken, write: { path: tests/it.rs, body: "#[test]\n#[ignore]\nfn a() {\n    assert_eq!(1, 1);\n}\n" } } }
  - observe: { turn: { prompt: widen, write: { path: src/lib.rs, body: "pub fn grow(a: u32, b: u32) -> u32 {\n    a + b\n}\n" } } }
  - { command: oxplow.vcs.stage, input: { stream: str1, paths: [tests/it.rs, src/lib.rs] } }
  - { command: oxplow.vcs.commit, input: { stream: str1, message: "Make grow add two numbers" }, bind: change }
  - observe: { commit: { sha: $change.rev, subject: Make grow add two numbers } }
  - observe: { analyze: { kind: commit, sha: $change.rev } }
steps:
  # The worst file first, each file's worst signal first, then by line.
  - when: { page: change-review-signals, params: { change_id: 1 } }
    expect:
      loaders:
        signals:
          rows:
            - { file: "tests/it.rs · 3 high", severity: high, signal: fewer-assertions, line: null }
            - { file: "tests/it.rs · 3 high", severity: high, signal: skip-added, line: null }
            - { file: "tests/it.rs · 3 high", severity: high, signal: test-deleted, line: 8 }
            - { file: "tests/it.rs · 3 high", severity: info }
            - { file: "src/lib.rs · 1 medium", severity: medium, signal: signature-changed, line: 1 }
            - { file: "src/lib.rs · 1 medium", severity: info }
            - { file: "src/lib.rs · 1 medium", severity: info }
  - when: { page: change-review-signals, params: { change_id: 1, area: history } }
    expect:
      loaders:
        signals:
          rows:
            - { file: src/lib.rs, path: src/lib.rs, area: history }
            - { file: tests/it.rs, path: tests/it.rs, area: history }
  - when: { page: change-review-signals, params: { change_id: 1, severity: medium } }
    expect:
      loaders:
        signals:
          rows:
            - { path: src/lib.rs, signal: signature-changed }
  - when: { page: change-review-signals, params: { change_id: 1, source: oxplow/review_signal_tests } }
    expect:
      loaders:
        signals:
          rows: 3
