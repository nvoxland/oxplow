# The rail's Assigned to you panel run whole: the body groups the person's
# open tasks, the collapsed line is the one in progress (else the next),
# and the count is the open ones.
given:
  - { command: oxplow.task.create, input: { title: Next, stage: todo, assignee: "oxplow:oxplow/person" } }
  - { command: oxplow.task.create, input: { title: Going, stage: todo, assignee: "oxplow:oxplow/person" }, bind: going }
  - { command: oxplow.task.create, input: { title: A thread's, stage: todo, assignee: thr1 } }
  - { command: oxplow.task.transition, input: { uri: $going.uri, to: in_progress } }
when: { panel: assigned }
expect:
  body:
    loaders:
      lines:
        rows:
          - { grp: In progress, title: Going }
          - { grp: Up next, title: Next }
  collapsed:
    loaders:
      line:
        rows:
          - { title: Going }
  count: 2
steps:
  # Done leaves the open groups and the count.
  - given:
      - { command: oxplow.task.transition, input: { uri: $going.uri, to: done } }
  - expect:
      body: { loaders: { lines: { rows: [{ grp: Up next, title: Next }] } } }
      collapsed: { loaders: { line: { rows: [{ title: Next }] } } }
      count: 1
