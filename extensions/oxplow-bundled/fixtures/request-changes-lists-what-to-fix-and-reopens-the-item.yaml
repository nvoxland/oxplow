# Request Changes comments a checklist — each unverified claim, each
# inferred decision, each file outside the item's area, and the note — and
# moves the item back to ready.
given:
  - { command: oxplow.work_item.create, input: { title: Fix the hover state, body: "Fix the hover state in [[src/ui/button.ts]].", thread: thr1 }, bind: item }
  - { command: oxplow.work_item.transition, input: { uri: $item.uri, to: in_progress } }
  - observe:
      turn:
        prompt: Fix the hover state
        tools:
          - { name: Edit, kind: edit, paths: [src/ui/button.ts], ok: true }
          - { name: Edit, kind: edit, paths: [crates/db/store.rs], ok: true }
  - command: oxplow.effort.replace_inferred_claims
    input: { effort: eff1, claims: [{ statement: no behavior change, kind: no_behavior_change }] }
  - command: oxplow.effort.replace_inferred_decisions
    input: { effort: eff1, decisions: [{ question: Which store?, choice: SQLite, alternatives: [files], why: "it's there" }] }
when:
  command: oxplow.review.request_changes
  input: { effort: eff1, note: Keep it to the UI. }
  confirmed: true
expect:
  ok: true
steps:
  - when: { sql: "SELECT w.state, c.body FROM v_work_item w JOIN v_work_item_comment c ON c.uri = w.uri" }
    expect:
      rows:
        - state: todo
          body: $any
  - when:
      sql: |
        SELECT instr(c.body, 'Changes requested') > 0 AS headed,
               instr(c.body, 'Keep it to the UI.') > 0 AS noted,
               instr(c.body, '- [ ] Back up the claim: no behavior change') > 0 AS claim,
               instr(c.body, '- [ ] Confirm or rework the decision: Which store? → SQLite') > 0 AS decision,
               instr(c.body, '- [ ] Explain or revert the change outside the task''s area: crates/db/store.rs') > 0 AS outside,
               instr(c.body, 'src/ui/button.ts') = 0 AS inside_unnamed
        FROM v_work_item_comment c
    expect: { rows: [{ headed: 1, noted: 1, claim: 1, decision: 1, outside: 1, inside_unnamed: 1 }] }
