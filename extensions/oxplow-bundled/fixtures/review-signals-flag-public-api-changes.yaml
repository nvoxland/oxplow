# The review's `api` signals: a public function whose parameters changed, and
# a public function the change removed. Callers outside the change may break.
# A private function, a body-only change and a test are not API changes.
given:
  - observe:
      change:
        kind: commit
        target: abc
        files:
          - { path: src/lib.rs, additions: 10, deletions: 8 }
        functions:
          - { path: src/lib.rs, symbol: widen, container: Shape, signature_changed: true, start_line: 3, params_before: 1, params_after: 3 }
          - { path: src/lib.rs, symbol: gone, status: deleted, start_line: 20 }
          - { path: src/lib.rs, symbol: helper, status: deleted, visibility: private, start_line: 30 }
          - { path: src/lib.rs, symbol: grow, body_changed: true, start_line: 40, complexity_delta: 2 }
          - { path: src/lib.rs, symbol: test_old, status: deleted, is_test: true, start_line: 50 }
when:
  sql: SELECT area, signal, severity, path, line, title, why FROM v_oxplow_review_signal WHERE source = 'oxplow/review_signal_api' ORDER BY line
expect:
  rows:
    - { area: code, signal: signature-changed, severity: medium, path: src/lib.rs, line: 3, title: "Public signature changed: Shape::widen", why: "Parameters 1 → 3. Callers outside this change may break." }
    - { area: code, signal: public-removed, severity: medium, path: src/lib.rs, line: 20, title: "Public function removed: gone", why: Callers outside this change may break. }
