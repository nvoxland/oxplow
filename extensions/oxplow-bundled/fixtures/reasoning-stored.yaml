# A reasoning job succeeded: its proposals (inside a code fence, which is
# dropped) replace the effort's inferred decisions and its unreviewed
# claims. A malformed entry is dropped; an unknown claim kind becomes
# `other`.
given:
  - { command: oxplow.effort.open, input: { thread: thr1 } }
when:
  job: reasoning
  intentKey: "reasoning:eff1"
  request:
    schemaVersion: 1
    role: reasoning
    messages:
      - { role: user, parts: [{ type: text, text: "Work item: Add CSV export" }] }
expect:
  state: succeeded
  effects: [{ id: oxplow-bundled/store-reasoning, state: ok }]
  commands: [oxplow.effort.replace_inferred_decisions, oxplow.effort.replace_inferred_claims]
model:
  replies: ["```json\n{\"decisions\": [{\"question\": \"Which CSV library?\", \"choice\": \"csv crate\", \"alternatives\": [\"hand-rolled\"], \"confidence\": \"High\"}, {\"question\": \"\", \"choice\": \"x\"}], \"claims\": [{\"statement\": \"The export tests pass.\", \"kind\": \"tests_pass\", \"evidence\": \"run:12\"}, {\"statement\": \"Empty input is handled.\", \"kind\": \"mystery\"}, {\"kind\": \"tests_pass\"}]}\n```"]
