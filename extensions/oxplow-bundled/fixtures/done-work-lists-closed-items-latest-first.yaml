# Every done or canceled item on the thread's list, the latest closed first.
given:
  - { command: oxplow.work_item.create, input: { title: First, thread: thr1 }, bind: a }
  - { command: oxplow.work_item.create, input: { title: Second, thread: thr1 }, bind: b }
  - { command: oxplow.work_item.create, input: { title: Open, thread: thr1 } }
  - { command: oxplow.work_item.transition, input: { uri: $a.uri, to: done } }
  - { command: oxplow.work_item.transition, input: { uri: $b.uri, to: canceled } }
when: { page: oxplow-bundled/done-work, params: { thread_id: 1 } }
expect:
  loaders:
    done_work:
      rows:
        - { title: Second, state: canceled }
        - { title: First, state: done }
