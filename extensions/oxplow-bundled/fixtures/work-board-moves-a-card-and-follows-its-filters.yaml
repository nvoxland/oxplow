# The Work board itself, drawn by its component: a column per stage of
# the list (oxplow's Ready, In Progress, Blocked, Done), a card per item
# in its stage's column; a card dragged to another column moves the item there;
# a card's menu sets a field and who it's for; the toolbar's Show is the
# tab's view, and Back puts it back; a title opens the item and New Task…
# the form.
requires: [oxtask]
given:
  - { command: oxtask.task.create, input: { title: Next up, stage: ready, priority: low } }
  - { command: oxplow.tasks.assign, input: { uri: "oxplow:oxplow/task?id=tsk1&provider=oxtask", to: "oxplow:oxplow/thread?id=thr1" } }
  - { command: oxtask.task.create, input: { title: Someday, stage: ready } }
when: { page: work, params: { show: thread, priority: any, thread_id: 1, stream_id: 1 } }
steps:
  - ui:
      - expect:
          title: Work
          actions: [new]
          count: { '[data-testid="column-ready"] .ox-card': 1, '[data-testid="column-in_progress"] .ox-card': 0 }
          text: { '[data-testid="column-ready"] h2': Ready, '[data-testid="column-in_progress"] h2': In Progress, '[data-testid="column-ready"] .card-title': Next up }
      - drag: { from: '[data-testid="column-ready"] .ox-card', to: '[data-testid="column-in_progress"]' }
      - expect:
          invoked: [{ command: oxtask.task.move, input: { id: tsk1, stage: in_progress }, ok: true }]
          count: { '[data-testid="column-in_progress"] .ox-card': 1, '[data-testid="column-ready"] .ox-card': 0 }
      # The card's menu: its field's values, each an update.
      - click: '[data-testid="column-in_progress"] .card-menu'
      - expect: { visible: '[data-testid="card-menu"]', text: { '[data-id="priority-low"]': "✓ Low" } }
      - click: '[data-id="priority-high"]'
      - expect:
          invoked:
            - { command: oxtask.task.move, input: { id: tsk1, stage: in_progress }, ok: true }
            - { command: oxtask.task.update, input: { id: tsk1, priority: high }, ok: true }
      # Show is the tab's view: everyone's cards (the unassigned too); a
      # card's menu assigns one to this thread, and Back to the thread's
      # shows it there.
      - fill: { "#show": all }
      - expect:
          view_params: { show: all }
          text: { '[data-testid="column-ready"] .card-title': Someday }
      - click: '[data-testid="column-ready"] .card-menu'
      - click: '[data-id="assign-oxplow:oxplow/thread?id=thr1"]'
      - expect:
          invoked:
            - { command: oxtask.task.move, input: { id: tsk1, stage: in_progress }, ok: true }
            - { command: oxtask.task.update, input: { id: tsk1, priority: high }, ok: true }
            - { command: oxplow.tasks.assign, input: { uri: "oxplow:oxplow/task?id=tsk2&provider=oxtask", to: "oxplow:oxplow/thread?id=thr1" }, ok: true }
      - view_params: { show: null }
      - expect: { count: { '[data-testid="column-ready"] .ox-card': 1, '[data-testid="column-in_progress"] .ox-card': 1 } }
      - click: '[data-testid="column-in_progress"] .card-title'
      - expect: { navigated: ["oxplow:oxplow/task?id=tsk1&provider=oxtask"] }
      - press: new
      - expect: { navigated: ["oxplow:oxplow/task?id=tsk1&provider=oxtask", "oxplow:oxplow/page?page=new-task"] }
