# The Review page's By Area rows open Signals narrowed to the area. The
# Tests and Code sections sum up what the change did to its tests and its
# code; their headings open the Tests and Code pages.
requires: [oxplow-rust]
given:
  - observe: { turn: { prompt: base, write: { path: tests/it.rs, body: "#[test]\nfn a() {\n    assert_eq!(1, 1);\n    assert!(true);\n}\n\n#[test]\nfn b() {\n    assert!(true);\n}\n" } } }
  - observe: { turn: { prompt: base lib, write: { path: src/lib.rs, body: "pub fn grow(a: u32) -> u32 {\n    a\n}\n" } } }
  - { command: oxplow.vcs.stage, input: { stream: str1, paths: [tests/it.rs, src/lib.rs] } }
  - { command: oxplow.vcs.commit, input: { stream: str1, message: base } }
  - observe: { turn: { prompt: weaken, write: { path: tests/it.rs, body: "#[test]\n#[ignore]\nfn a() {\n    assert_eq!(1, 1);\n}\n" } } }
  - observe: { turn: { prompt: widen, write: { path: src/lib.rs, body: "pub fn grow(a: u32, b: u32) -> u32 {\n    a + b\n}\n" } } }
  - { command: oxplow.vcs.stage, input: { stream: str1, paths: [tests/it.rs, src/lib.rs] } }
  - { command: oxplow.vcs.commit, input: { stream: str1, message: "Make grow add two numbers" }, bind: change }
  - observe: { commit: { sha: $change.rev, subject: Make grow add two numbers } }
  - observe: { analyze: { kind: commit, sha: $change.rev } }
when: { page: change-review, params: { change_id: 1 } }
expect:
  loaders:
    by_area:
      rows:
        - { area: tests, signals: "oxplow:oxplow/page?area=tests&change_id=1&page=change-review-signals" }
        - { area: code, signals: "oxplow:oxplow/page?area=code&change_id=1&page=change-review-signals" }
        - { area: history }
    tests_summary:
      rows:
        # A commit has no runs and no coverage: only a request has them.
        - { test_files: "1 changed · tests 2 → 1 · assertions 3 → 1 · skips 0 → 1", test_files_tone: warning, weakened: 3 high, weakened_tone: danger, runs: Only a request has runs, uncovered: Only a request has coverage }
    code_summary:
      rows:
        - { functions: 1 changed, complexity: No function got more complex, api: 1 signature changed, api_tone: warning, duplicates: None }
