# The Knowledge index: each store with its page and stale counts, the
# pages newest change first (or oldest first), a search that lists the pages
# whose title or body holds the text, and a store filter.
requires: [oxwiki]
given:
  - { command: oxwiki.page.write, input: { title: Alpha, body: "# Alpha\n\nThe quick brown fox jumps.\n" } }
  - { command: oxwiki.page.write, input: { title: Beta, body: "# Beta\n\nNothing here.\n" } }
  - { command: oxwiki.page.write, input: { title: Gamma, body: "# Gamma\n\nA lazy dog sleeps.\n" } }
when: { page: knowledge }
expect:
  loaders:
    pages:
      rows:
        - { id: gamma, store: oxwiki, title: Gamma, kind: note }
        - { id: beta, title: Beta }
        - { id: alpha, title: Alpha }
steps:
  - params: { order: oldest }
    expect: { loaders: { pages: { rows: [{ id: alpha }, { id: beta }, { id: gamma }] } } }
  - params: { filter: LAZY }
    expect: { loaders: { pages: { rows: [{ id: gamma }] } } }
  - params: { filter: beta }
    expect: { loaders: { pages: { rows: [{ id: beta }] } } }
  - params: { filter: nothing-matches-this }
    expect: { loaders: { pages: { rows: 0 } } }
  - params: { store: claude-memory }
    expect: { loaders: { pages: { rows: 0 } } }
  - params: { store: oxwiki, filter: fox }
    expect: { loaders: { pages: { rows: [{ id: alpha }] } } }
