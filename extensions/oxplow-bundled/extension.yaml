manifest: 2
name: oxplow-bundled
namespace: oxplow
description: What comes with oxplow beyond its foundation, cleaned up. Holds the review and analysis datasets, their settings and the Work board so far; the rest moves here from oxplow-bundled-todo one piece at a time.
engine: ">=0.7"
# Its task tracker's skill is written to the agent's runtime (`/oxplow:next-task`).
permissions: [agent.write]
# Its Work board is a custom component in TypeScript (src/board/), built
# into dist/ when oxplow is built and on every deploy; dist/ isn't committed.
build: { run: "bun run build", output: dist, exclude: [node_modules] }
intent:
  purpose: >-
    Hold the optional features oxplow ships once each has been cleaned up. So
    far that is the review and analysis datasets, their settings, the Work
    panel and board, and their event types and commands. Their names come from the
    `oxplow` namespace, so they stay when a piece moves between extensions.
  origin: null
datasets:
  - name: change_interest
    version: 1
    description: "Each changed file's \"look here first\" review priority (size × complexity spikes × parameter growth × long new functions) and why, `; `-separated."
    fields:
      - { name: change_id, type: INTEGER, doc: "The change (v_change.id)." }
      - { name: path, type: TEXT, doc: "Repo-relative path." }
      - { name: interest, type: "", doc: "Review priority (a real number); higher means look here first." }
      - { name: reasons, type: "", doc: "Why it's high, `; `-separated ('' for a routine file)." }
  - name: co_change_pair
    version: 1
    # "The last 180 days" moves with the clock, not with a write.
    materialize: { every: 1h }
    description: "Files usually committed together: each pair (both ways round) that shared at least 3 commits of 50 files or fewer in the last 180 days."
    fields:
      - { name: path, type: TEXT, doc: "A file." }
      - { name: other, type: TEXT, doc: "A file committed with it." }
      - { name: together, type: "", doc: "How many commits they shared." }
  - name: change_co_change
    version: 1
    description: "Files in a change that history says are surprising: untouched for 90 days or more, or changed without any of their usual partners (top three co-changers)."
    fields:
      - { name: change_id, type: INTEGER, doc: "The change (v_change.id)." }
      - { name: path, type: TEXT, doc: "The surprising file." }
      - { name: reason, type: "", doc: "`dormant` or `usual-co-changers-absent`." }
      - { name: expected, type: "", doc: "Its usual partners, `, `-separated (for `usual-co-changers-absent`)." }
      - { name: dormant_days, type: "", doc: "Days since a commit last touched it (for `dormant`; 90 when never)." }
  - name: deviation
    version: 1
    description: "Files each effort changed outside the area its task names: a file is in the area when the item's title or body names it, or one of its directories at least two levels deep (`src/ui`). An item that names no area has none."
    fields:
      - { name: effort_id, type: INTEGER, doc: "The effort (v_effort.id)." }
      - { name: path, type: TEXT, doc: "Repo-relative file path." }
      - { name: change_kind, type: TEXT, doc: "`created`, `updated` or `deleted`." }
  - name: struggle
    version: 1
    description: "Where the agent had trouble in an effort, by this review policy's thresholds: a file edited 5+ times (`repeated_edits`) or 3+ failed shell commands (`failed_commands`). Likely places for mistakes."
    fields:
      - { name: effort_id, type: INTEGER, doc: "Effort." }
      - { name: thread_id, type: INTEGER, doc: "Thread." }
      - { name: agent_session_id, type: INTEGER, doc: "The agent session it happened in; NULL when not recorded." }
      - { name: kind, type: "", doc: "`repeated_edits` or `failed_commands`." }
      - { name: subject, type: TEXT, doc: "The file path, or `shell` (failed shell commands, whatever the harness)." }
      - { name: count, type: "", doc: "How many edits / failures." }
  - name: finished_cleared
    version: 2
    key: [thread_id]
    description: "When the person last cleared each thread's Finished list in the Work panel (`oxplow.tasks.clear_finished`), read from the events' envelopes."
    fields:
      - { name: thread_id, type: INT, doc: "The thread (v_thread.id)." }
      - { name: cleared_at, type: TEXT, doc: "When it was last cleared (RFC 3339)." }
  - name: thread_tasks
    version: 7
    description: "Each thread's Work panel, one row per line in display order: the tasks the thread is working on (a project-manager view of tasks, never of turns or requests). In progress is the tasks assigned to it in progress (under their epic with the epic's other children), each with what its latest request is doing now; Up next is the ready and blocked tasks assigned to the thread, in its queue's order; Finished is the done tasks a request on the thread worked on (each once) and the wiki pages it touched, since the list was cleared."
    fields:
      - { name: thread_id, type: INT, doc: "The thread (v_thread.id)." }
      - { name: grp, type: TEXT, doc: "`In progress`, `Up next` or `Finished`." }
      - { name: g, type: INT, doc: "The group's place (0, 1, 3)." }
      - { name: ord, type: INT, doc: "The line's place in its group." }
      - { name: title, type: TEXT, doc: "What to show." }
      - { name: icon, type: TEXT, doc: "A viz icon name: a task state (`todo`, `blocked`, `in_progress`, `done`, …), `epic` or `wiki`." }
      - { name: uri, type: TEXT, doc: "What the line opens (a task's URI, `oxplow:oxplow/wiki?slug=<slug>`)." }
      - { name: depth, type: INT, doc: "1 for an epic's child, else 0." }
      - { name: active, type: INT, doc: "1 for a task in progress." }
      - { name: activity, type: TEXT, doc: "On a task in progress, what its latest request is doing now (v_request_task, v_request.state): `running`, `waiting_on_person`, `waiting_on_work` or `idle` (none runs, or no request worked on it yet). NULL on any other line. (v7)" }
event_types:
  types:
    - type: oxplow.tasks.finished_cleared
      v: 1
      schema: event_types/finished_cleared.json
      summary: A person cleared a thread's Finished list in the Work panel. Subject — the thread.
ui:
  # A task's page shows the agent's tokens on it and what another
  # thread shares with it.
  mounts:
    - { page: task-tokens, at: oxplow/task-detail.sections }
    - { page: item-shared-work, at: oxplow/task-detail.sections }
configuration:
  version: 1
  schema:
    type: object
    additionalProperties: false
    properties:
      changeInterest:
        type: object
        additionalProperties: false
        description: How "Look here first" ranks a changed file.
        properties:
          complexityWeight: { type: number, minimum: 0, description: Weight of complexity added in changed bodies. }
          parameterWeight: { type: number, minimum: 0, description: Weight of parameters added to changed signatures. }
          longFunctionLines: { type: integer, minimum: 1, description: A new function longer than this many lines raises the file's priority. }
          longFunctionScale: { type: number, exclusiveMinimum: 0, description: Lines over the limit that double that factor. }
      coChange:
        type: object
        additionalProperties: false
        description: Which files count as usually committed together, and when one is dormant.
        properties:
          minShared: { type: integer, minimum: 1, description: Commits two files must share to be a pair. }
          windowDays: { type: integer, minimum: 1, description: How far back commits count. }
          maxFilesPerCommit: { type: integer, minimum: 1, description: Commits touching more files than this are ignored (mass renames). }
          dormantDays: { type: integer, minimum: 1, description: A file no commit touched in this many days is dormant. }
      struggle:
        type: object
        additionalProperties: false
        description: When the agent is said to have struggled in an effort.
        properties:
          repeatedEdits: { type: integer, minimum: 1, description: Edits of one file at or above which it counts. }
          failedCommands: { type: integer, minimum: 1, description: Failed shell commands at or above which they count. }
  defaults:
    changeInterest: { complexityWeight: 0.6, parameterWeight: 0.4, longFunctionLines: 60, longFunctionScale: 40 }
    coChange: { minShared: 3, windowDays: 180, maxFilesPerCommit: 50, dormantDays: 90 }
    struggle: { repeatedEdits: 5, failedCommands: 3 }
commands:
  # This extension's review-policy settings (`configuration:` above), through
  # the host's configuration scope. A person sets them; a change republishes
  # the datasets that read them.
  - name: review_policy.read
    summary: The review policy's effective settings, where each came from, and the stamps a write needs.
    scope: extension_config.read
    op: snapshot
    example: {}
  - name: review_policy.write
    summary: Set the review policy's project or personal settings (a compare-and-swap on the stamps `review_policy.read` returns).
    scope: extension_config.write
    op: compare_exchange
    example: {"schema_version": 1, "project": {"expected": {"schema_version": 1, "revision": 2}, "values": {"struggle": {"repeatedEdits": 4}}}, "personal": null}
  - name: tasks.clear_finished
    summary: Clear a thread's Finished list in the Work panel — what finished before now stops showing there.
    input_schema:
      type: object
      required: [thread_id]
      properties:
        thread_id: { type: [integer, string], description: "The thread's row id (v_thread.id)." }
      additionalProperties: false
    entry: handlers/clear_finished.star
    access: record
    examples:
      - { name: clears, input: { thread_id: 3 }, expect_commands: [] }
  # The person's menu entry for `oxplow.effort.link` on an effort.
  - name: effort.link_to_task
    summary: "The person's menu entry for `oxplow.effort.link`: Link to Task… on an effort opens a form to pick the task."
    scope: efforts.write
    op: link
    ui: { label: "Link to Task…", group: Review, about: oxplow/effort, form: "oxplow:oxplow/page?page=link-effort" }
    example: {"effort": "eff12", "task": "oxplow:oxplow/task?id=tsk42&provider=oxtask"}
  # The person's menu entry for foundation's `task.create`: an agent
  # runs foundation's; this adds the label, shortcut and form a person uses.
  - name: task.new
    summary: "The person's menu entry for `oxplow.task.create`: New Task… opens the new-task form and shows the task it files."
    scope: task_tracker.write
    op: create
    ui: {"label": "New Task…", "group": "Tasks", "keywords": ["task"], "form": "oxplow:oxplow/page?page=new-task", "shortcut": "Ctrl/Cmd+Shift+N", "open_after": "{{result.uri}}"}
    example: {"title": "Fix the login redirect loop", "body": "Signing in from /settings bounces back to /login.", "stage": "todo"}
custom_components:
  # The Work board: the tasks as cards in a column per stage, its own
  # toolbar, drag and card menu; oxplow draws its nav bar and confirms.
  - id: board
    title: Board
    description: "The tasks as a kanban board: a column per stage of the list, drag a card to move it, a card's menu to set its stage, fields and assignee."
    bundle: dist/board
    commands: [oxplow.task.transition, oxplow.task.update, oxplow.task.assign, oxplow.task.reorder, oxplow.task.delete]
panels:
  # What the thread is working on: its open effort (with its epic), the
  # items assigned to it next, and what it finished; collapsed, the effort.
  # Its header has no count, and opens the Work board.
  - { id: work, title: Work, icon: list-checks, scope: thread, body: work-panel, collapsed: work-line, open: 'oxplow:oxplow/page?page=work' }
# oxplow's own task tracker, oxtask, is declared here: with only
# oxplow-foundation running there is no task tracker. Its agent skill is the
# ready queue (`/oxplow:next-task`).
skills:
  - { name: next-task, kind: command, file: commands/next-task.md }
  # oxtask's opinion: an agent tracks what it works on as tasks.
  - { name: track-work, file: skills/track-work/SKILL.md }
implementations:
  - { capability: task_tracker, id: oxtask, entry: "oxplow:oxtask", skills: [next-task, track-work], description: "The task tracker that oxplow keeps itself." }
advisories:
  # oxtask's opinion (the `track-work` skill): an agent tracks what it works
  # on as tasks. At the first edit of a request (a file an edit call named or
  # the harness reported a shell call changed), while the thread has no task
  # in progress and the request has no task linked (an agent that took a
  # task, edited and moved it to done did everything right), the agent is
  # reminded once per request, in the same turn. Only while oxtask is the
  # active task tracker.
  - id: untracked-work
    on: post-tool-use
    once_per: row
    query: |
      WITH cur AS (
        SELECT t.request_id FROM v_agent_turn t
        WHERE t.id = :turn_id AND t.request_id IS NOT NULL
      )
      SELECT CAST(cur.request_id AS TEXT) AS key,
             'This request changed files, and no task is in progress on this thread. If it is '
             || 'work the person will want to see on the Work panel, take or file its task and '
             || 'move it to in progress (the `track-work` skill); a small fix needs none.' AS message
      FROM cur
      WHERE EXISTS (SELECT 1 FROM v_capability_provider
                     WHERE capability = 'task_tracker' AND provider = 'oxtask' AND active = 1)
        AND EXISTS (SELECT 1 FROM v_tool_call_path p JOIN v_agent_turn t ON t.id = p.turn_id
                     WHERE t.request_id = cur.request_id)
        AND NOT EXISTS (SELECT 1 FROM v_request_task rt WHERE rt.request_id = cur.request_id)
        AND NOT EXISTS (SELECT 1 FROM v_task w JOIN v_thread th ON th.uri = w.assignee
                         WHERE th.id = :thread_id AND w.state = 'in_progress')
