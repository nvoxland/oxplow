manifest: 2
name: oxplow-bundled
namespace: oxplow
description: What comes with oxplow beyond its foundation, cleaned up. Holds the review datasets, event types and commands so far; the rest moves here from oxplow-bundled-todo one piece at a time.
engine: ">=0.7"
# Its commands read the review datasets with their own SQL.
permissions: [sql.read]
intent:
  purpose: >-
    Hold the optional features oxplow ships once each has been cleaned up. So
    far that is the review and analysis datasets, their settings and the
    verdict decorators, event types and commands. Their names come from the
    `oxplow` namespace, so they stay when a piece moves between extensions.
  origin: null
datasets:
  - name: change_interest
    version: 1
    description: "Each changed file's \"look here first\" review priority (size × complexity spikes × parameter growth × long new functions) and why, `; `-separated."
    fields:
      - { name: change_id, type: INTEGER, doc: "The change (v_change.id)." }
      - { name: path, type: TEXT, doc: "Repo-relative path." }
      - { name: interest, type: "", doc: "Review priority (a real number); higher means look here first." }
      - { name: reasons, type: "", doc: "Why it's high, `; `-separated ('' for a routine file)." }
  - name: co_change_pair
    version: 1
    # "The last 180 days" moves with the clock, not with a write.
    materialize: { every: 1h }
    description: "Files usually committed together: each pair (both ways round) that shared at least 3 commits of 50 files or fewer in the last 180 days."
    fields:
      - { name: path, type: TEXT, doc: "A file." }
      - { name: other, type: TEXT, doc: "A file committed with it." }
      - { name: together, type: "", doc: "How many commits they shared." }
  - name: change_co_change
    version: 1
    description: "Files in a change that history says are surprising: untouched for 90 days or more, or changed without any of their usual partners (top three co-changers)."
    fields:
      - { name: change_id, type: INTEGER, doc: "The change (v_change.id)." }
      - { name: path, type: TEXT, doc: "The surprising file." }
      - { name: reason, type: "", doc: "`dormant` or `usual-co-changers-absent`." }
      - { name: expected, type: "", doc: "Its usual partners, `, `-separated (for `usual-co-changers-absent`)." }
      - { name: dormant_days, type: "", doc: "Days since a commit last touched it (for `dormant`; 90 when never)." }
  - name: deviation
    version: 1
    description: "Files each effort changed outside the area its work item names: a file is in the area when the item's title or body names it, or one of its directories at least two levels deep (`src/ui`). An item that names no area has none."
    fields:
      - { name: effort_id, type: INTEGER, doc: "The effort (v_effort.id)." }
      - { name: path, type: TEXT, doc: "Repo-relative file path." }
      - { name: change_kind, type: TEXT, doc: "`created`, `updated` or `deleted`." }
  - name: struggle
    version: 1
    description: "Where the agent had trouble in an effort, by this review policy's thresholds: a file edited 5+ times (`repeated_edits`) or 3+ failed shell commands (`failed_commands`). Likely places for mistakes."
    fields:
      - { name: effort_id, type: INTEGER, doc: "Effort." }
      - { name: thread_id, type: INTEGER, doc: "Thread." }
      - { name: agent_session_id, type: INTEGER, doc: "The agent session it happened in; NULL when not recorded." }
      - { name: kind, type: "", doc: "`repeated_edits` or `failed_commands`." }
      - { name: subject, type: TEXT, doc: "The file path, or `shell` (failed shell commands, whatever the harness)." }
      - { name: count, type: "", doc: "How many edits / failures." }
  - name: claim_status
    version: 3
    key: [uri]
    description: "Whether each of the agent's claims is backed, by this review policy's rule: it cites evidence (`v_claim.evidence` — a run, a test, a file, or `reviewer` when a person verified it) or a person verified it (`v_claim.review`), or it is `tests_pass` and its effort's latest test run (`v_test_run`) passed with at least one test. A claim a person dismissed has no row: it counts neither as backed nor as unbacked."
    fields:
      - { name: uri, type: TEXT, doc: "The claim (`v_claim.uri`)." }
      - { name: effort_id, type: INTEGER, doc: "Its effort (v_effort.id), if one was open." }
      - { name: verified, type: INT, doc: "1 when something backs it, else 0." }
      - { name: backed_by, type: TEXT, doc: "`evidence` (it cites some) or `latest run` (a passing latest test run backs `tests pass`); NULL when nothing does." }
  - name: verdicts
    version: 3
    key: [seq]
    materialize: { incremental: seq }
    description: "Every verdict a reviewer gave (`oxplow.review.accepted` / `.changes_requested`), oldest first — appended as each lands, so reading the latest never scans the log. Read from the events' envelopes alone, which retention keeps: a verdict outlives its payload."
    fields:
      - { name: seq, type: INTEGER, doc: "The verdict's event (v_event.seq)." }
      - { name: uri, type: TEXT, doc: "The effort reviewed (`oxplow:oxplow/effort?id=eff<id>`)." }
      - { name: verdict, type: TEXT, doc: "`accepted` or `changes_requested`." }
      - { name: forced, type: "", doc: "1 when accepted although claims were unverified or decisions unreviewed (the event names them)." }
  - name: verdict
    version: 2
    key: [uri]
    description: "Each effort's latest verdict, as its decorators show it: a chip on the effort's page and a badge where a page row links to it."
    fields:
      - { name: uri, type: TEXT, doc: "The effort (`oxplow:oxplow/effort?id=eff<id>`)." }
      - { name: label, type: TEXT, doc: "`Accepted`, `Accepted (forced)` or `Changes requested`." }
      - { name: color, type: TEXT, doc: "`green`, `orange` or `red`." }
  - name: finished_cleared
    version: 2
    key: [thread_id]
    description: "When the person last cleared each thread's Finished list in the Work panel (`oxplow.work.clear_finished`), read from the events' envelopes."
    fields:
      - { name: thread_id, type: INT, doc: "The thread (v_thread.id)." }
      - { name: cleared_at, type: TEXT, doc: "When it was last cleared (RFC 3339)." }
  - name: thread_work
    version: 4
    description: "Each thread's Work panel, one row per line in display order, from the active work list (`v_work_item`): what's in progress (the item, under its epic with the epic's other children, and an open effort no item names), up to 10 ready items, and the last 5 finished items, wiki pages and unlinked efforts since the list was cleared."
    fields:
      - { name: thread_id, type: INT, doc: "The thread (v_thread.id)." }
      - { name: grp, type: TEXT, doc: "`In progress`, `Ready` or `Finished`." }
      - { name: g, type: INT, doc: "The group's place (0, 1, 3)." }
      - { name: ord, type: INT, doc: "The line's place in its group." }
      - { name: title, type: TEXT, doc: "What to show." }
      - { name: icon, type: TEXT, doc: "A viz icon name: a work-item state (`todo`, `in_progress`, `done`, …), `epic` or `wiki`." }
      - { name: uri, type: TEXT, doc: "What the line opens (`work_item:…`, `oxplow:oxplow/wiki?slug=<slug>`, `oxplow:oxplow/effort?id=eff<id>`)." }
      - { name: depth, type: INT, doc: "1 for an epic's child, else 0." }
      - { name: active, type: INT, doc: "1 for the item, or the unlinked effort, in progress." }
event_types:
  types:
    - type: oxplow.review.accepted
      v: 1
      schema: event_types/accepted.json
      summary: A person accepted an effort's work. Subject — the effort, its work item and any claim or decision accepted unchecked.
    - type: oxplow.review.changes_requested
      v: 1
      schema: event_types/changes_requested.json
      summary: A person sent an effort's work back with changes requested. Subject — the effort and its work item.
    - type: oxplow.work.finished_cleared
      v: 1
      schema: event_types/finished_cleared.json
      summary: A person cleared a thread's Finished list in the Work panel. Subject — the thread.
ui:
  # The verdict where the effort is shown: it shows; it never acts.
  decorators:
    - { dataset: verdict, resource: oxplow/effort, placement: ref-chip, label: label, color: color }
    - { dataset: verdict, resource: oxplow/effort, placement: row-badge, label: label, color: color }
configuration:
  version: 1
  schema:
    type: object
    additionalProperties: false
    properties:
      changeInterest:
        type: object
        additionalProperties: false
        description: How "Look here first" ranks a changed file.
        properties:
          complexityWeight: { type: number, minimum: 0, description: Weight of complexity added in changed bodies. }
          parameterWeight: { type: number, minimum: 0, description: Weight of parameters added to changed signatures. }
          longFunctionLines: { type: integer, minimum: 1, description: A new function longer than this many lines raises the file's priority. }
          longFunctionScale: { type: number, exclusiveMinimum: 0, description: Lines over the limit that double that factor. }
      coChange:
        type: object
        additionalProperties: false
        description: Which files count as usually committed together, and when one is dormant.
        properties:
          minShared: { type: integer, minimum: 1, description: Commits two files must share to be a pair. }
          windowDays: { type: integer, minimum: 1, description: How far back commits count. }
          maxFilesPerCommit: { type: integer, minimum: 1, description: Commits touching more files than this are ignored (mass renames). }
          dormantDays: { type: integer, minimum: 1, description: A file no commit touched in this many days is dormant. }
      struggle:
        type: object
        additionalProperties: false
        description: When the agent is said to have struggled in an effort.
        properties:
          repeatedEdits: { type: integer, minimum: 1, description: Edits of one file at or above which it counts. }
          failedCommands: { type: integer, minimum: 1, description: Failed shell commands at or above which they count. }
  defaults:
    changeInterest: { complexityWeight: 0.6, parameterWeight: 0.4, longFunctionLines: 60, longFunctionScale: 40 }
    coChange: { minShared: 3, windowDays: 180, maxFilesPerCommit: 50, dormantDays: 90 }
    struggle: { repeatedEdits: 5, failedCommands: 3 }
commands:
  # This extension's review-policy settings (`configuration:` above), through
  # the host's configuration scope. A person sets them; a change republishes
  # the datasets that read them.
  - name: review_policy.read
    summary: The review policy's effective settings, where each came from, and the stamps a write needs.
    scope: extension_config.read
    op: snapshot
    example: {}
  - name: review_policy.write
    summary: Set the review policy's project or personal settings (a compare-and-swap on the stamps `review_policy.read` returns).
    scope: extension_config.write
    op: compare_exchange
    example: {"schema_version": 1, "project": {"expected": {"schema_version": 1, "revision": 2}, "values": {"struggle": {"repeatedEdits": 4}}}, "personal": null}
  - name: review.accept
    summary: Accept an effort's work — comment the review on its work item and mark it done. Refuses while a claim is unverified (a dismissed one doesn't count) or an inferred decision unreviewed, unless forced.
    input_schema:
      type: object
      required: [effort]
      properties:
        effort: { type: string, description: "The effort (`eff<id>`)." }
        force: { type: boolean, description: "Accept even with unverified claims or unreviewed decisions; they're listed in the comment." }
      additionalProperties: false
    entry: handlers/accept.star
    needs: [sql.read]
    confirm: always
    ui: { label: Accept Review, group: Review, about: oxplow/effort, about_when: work_item, input: { effort: "{{uri.id}}" } }
    examples:
      - name: reviewed
        input: { effort: "eff1" }
        answers: { sql.read: [[{ work_item: "oxplow:oxplow/work_item?id=tsk1&provider=oxplow", unverified: "[]", inferred: "[]", deviated: "[]" }]] }
        expect_commands: [oxplow.work_item.comment, oxplow.work_item.transition]
      - name: an unverified claim
        input: { effort: "eff1" }
        answers: { sql.read: [[{ work_item: "oxplow:oxplow/work_item?id=tsk1&provider=oxplow", unverified: '[{"claim":"oxplow:oxplow/claim?id=1","statement":"tests pass"}]', inferred: "[]", deviated: "[]" }]] }
        refused: 1 unverified claim
      - name: forced
        input: { effort: "eff1", force: true }
        answers: { sql.read: [[{ work_item: "oxplow:oxplow/work_item?id=tsk1&provider=oxplow", unverified: '[{"claim":"oxplow:oxplow/claim?id=1","statement":"tests pass"}]', inferred: "[]", deviated: "[]" }]] }
        expect_commands: [oxplow.work_item.comment, oxplow.work_item.transition]
      - name: another provider's item
        input: { effort: "eff2" }
        answers: { sql.read: [[{ work_item: "oxplow:oxplow/work_item?id=ENG-12&provider=issues", unverified: "[]", inferred: "[]", deviated: "[]" }]] }
        expect_commands: [oxplow.work_item.comment, oxplow.work_item.transition]
      - name: no work item
        input: { effort: "eff3" }
        answers: { sql.read: [[{ work_item: null, unverified: "[]", inferred: "[]", deviated: "[]" }]] }
        refused: has no work item
  - name: review.request_changes
    summary: Send an effort's work back — comment a checklist of its unverified claims, inferred decisions and files outside its work item's area (and your note) on the item, and move it back to todo.
    input_schema:
      type: object
      required: [effort]
      properties:
        effort: { type: string, description: "The effort (`eff<id>`)." }
        note: { type: string, description: "What else to change." }
      additionalProperties: false
    entry: handlers/request_changes.star
    needs: [sql.read]
    confirm: always
    ui: { label: Request Changes, group: Review, about: oxplow/effort, about_when: work_item, input: { effort: "{{uri.id}}" } }
    examples:
      - name: a file outside the area
        input: { effort: "eff1" }
        answers: { sql.read: [[{ work_item: "oxplow:oxplow/work_item?id=tsk1&provider=oxplow", unverified: "[]", inferred: "[]", deviated: '["src/db/store.py"]' }]] }
        expect_commands: [oxplow.work_item.comment, oxplow.work_item.transition]
      - name: nothing to ask for
        input: { effort: "eff1" }
        answers: { sql.read: [[{ work_item: "oxplow:oxplow/work_item?id=tsk1&provider=oxplow", unverified: "[]", inferred: "[]", deviated: "[]" }]] }
        refused: nothing to ask for
      - name: another provider's item
        input: { effort: "eff2", note: "Add the migration." }
        answers: { sql.read: [[{ work_item: "oxplow:oxplow/work_item?id=ENG-12&provider=issues", unverified: "[]", inferred: "[]", deviated: "[]" }]] }
        expect_commands: [oxplow.work_item.comment, oxplow.work_item.transition]
      - name: no work item
        input: { effort: "eff3", note: "x" }
        answers: { sql.read: [[{ work_item: null, unverified: "[]", inferred: "[]", deviated: "[]" }]] }
        refused: has no work item
  - name: work.clear_finished
    summary: Clear a thread's Finished list in the Work panel — what finished before now stops showing there.
    input_schema:
      type: object
      required: [thread_id]
      properties:
        thread_id: { type: [integer, string], description: "The thread's row id (v_thread.id)." }
      additionalProperties: false
    entry: handlers/clear_finished.star
    access: record
    examples:
      - { name: clears, input: { thread_id: 3 }, expect_commands: [] }
