manifest: 2
name: oxplow-bundled
namespace: oxplow
description: Oxplow's optional built-in features, including change review, code metrics, the Work board, Knowledge, Dashboards, Usage and Job Runs.
engine: ">=0.7"
# Its `tasks` skill (reading the task model) is written to the agent's runtime.
permissions: [files.read, agent.write, sql.read, 'commands:oxplow.model.set_fields', 'commands:oxplow.tasks.assign']
# Its Work board is a custom component in TypeScript (src/board/), built
# into dist/ when oxplow is built and on every deploy; dist/ isn't committed.
build: { run: "bun run build", output: dist, exclude: [node_modules] }
intent:
  purpose: >-
    Hold the optional features oxplow ships once each has been cleaned up. So
    far that is the review and analysis datasets, their settings, the Work
    panel and board, the Knowledge pages, the Dashboards index, Usage, Job Runs, the
    code metrics with the Metrics list and Duplicated Code, and their event
    types and commands. Their names come from the
    `oxplow` namespace, so they stay when a piece moves between extensions.
  origin: null
datasets:
  - name: change_interest
    version: 1
    description: "Each changed file's \"look here first\" review priority (size × complexity spikes × parameter growth × long new functions) and why, `; `-separated."
    fields:
      - { name: change_id, type: INTEGER, doc: "The change (v_change.id)." }
      - { name: path, type: TEXT, doc: "Repo-relative path." }
      - { name: interest, type: "", doc: "Review priority (a real number); higher means look here first." }
      - { name: reasons, type: "", doc: "Why it's high, `; `-separated ('' for a routine file)." }
  - name: co_change_pair
    version: 1
    # "The last 180 days" moves with the clock, not with a write.
    materialize: { every: 1h }
    description: "Files usually committed together: each pair (both ways round) that shared at least 3 commits of 50 files or fewer in the last 180 days."
    fields:
      - { name: path, type: TEXT, doc: "A file." }
      - { name: other, type: TEXT, doc: "A file committed with it." }
      - { name: together, type: "", doc: "How many commits they shared." }
  - name: change_co_change
    version: 1
    description: "Files in a change that history says are surprising: untouched for 90 days or more, or changed without any of their usual partners (top three co-changers)."
    fields:
      - { name: change_id, type: INTEGER, doc: "The change (v_change.id)." }
      - { name: path, type: TEXT, doc: "The surprising file." }
      - { name: reason, type: "", doc: "`dormant` or `usual-co-changers-absent`." }
      - { name: expected, type: "", doc: "Its usual partners, `, `-separated (for `usual-co-changers-absent`)." }
      - { name: dormant_days, type: "", doc: "Days since a commit last touched it (for `dormant`; 90 when never)." }
  - name: deviation
    version: 2
    description: "Files each request changed outside the area its tasks name: a file is in the area when a task's title or body names it, or one of its directories at least two levels deep (`src/ui`). A request whose tasks name no area has none."
    fields:
      - { name: request_id, type: INT, doc: "The request (v_request.id)." }
      - { name: path, type: TEXT, doc: "Repo-relative file path." }
  - name: struggle
    version: 2
    description: "Where the agent had trouble in a request, by this review policy's thresholds: a file edited 5+ times (`repeated_edits`) or 3+ failed shell commands (`failed_commands`). Likely places for mistakes."
    fields:
      - { name: request_id, type: INT, doc: "The request (v_request.id)." }
      - { name: thread_id, type: INTEGER, doc: "Thread." }
      - { name: agent_session_id, type: INTEGER, doc: "The agent session it happened in; NULL when not recorded." }
      - { name: kind, type: "", doc: "`repeated_edits` or `failed_commands`." }
      - { name: subject, type: TEXT, doc: "The file path, or `shell` (failed shell commands, whatever the harness)." }
      - { name: count, type: "", doc: "How many edits / failures." }
  # The change review's list of what to look at: one row per signal. It is
  # open, so any extension's dataset adds rows to it (`adds_to:
  # oxplow/review_signal`); bundled's own sources below add theirs the same way.
  - name: review_signal
    version: 1
    open: true
    description: "What a reviewer should look at in an analysed change, from every source that adds to this list (oxplow-bundled's and other extensions'): one row per signal, with how serious it is and why. A change's: `WHERE change_id = <id>`."
    fields:
      - { name: change_id, type: "", doc: "The change (v_change.id)." }
      - { name: source, type: "", doc: "The dataset that gave the row, `<namespace>/<dataset>`." }
      - { name: area, type: "", doc: "What it is about, for grouping: `tests`, `verification`, `code`, `dependencies`, `history`, `scope` or `other`." }
      - { name: signal, type: "", doc: "Its kind, short and stable (`test-deleted`, `signature-changed`)." }
      - { name: severity, type: "", doc: "`high` (look at it), `medium` (likely worth a look) or `info` (context: counted, and listed under its file, but it puts no file on the Review page's Look Here)." }
      - { name: path, type: "", doc: "The file, repo-relative, or NULL for a signal about the whole change (a failing test run)." }
      - { name: line, type: "", doc: "The line it is about (head side; base side for something removed), or NULL for the whole file." }
      - { name: end_line, type: "", doc: "The last line of its range, or NULL." }
      - { name: title, type: "", doc: "One line for a list." }
      - { name: why, type: "", doc: "The evidence, in a sentence." }
      - { name: uri, type: "", doc: "What it links to (a symbol, a test, another file), or NULL." }
  - name: review_signal_tests
    version: 1
    adds_to: oxplow/review_signal
    description: "The change review's test signals: test files a change deleted, tests it deleted (where the file now has fewer), test files that now assert less, and tests newly skipped (all `high`). Read only in test files; the counts are a heuristic across languages (`v_change_test_file`)."
    fields:
      - { name: change_id, type: INTEGER, doc: "The change (v_change.id)." }
      - { name: source, type: "", doc: "This dataset, `oxplow/review_signal_tests`." }
      - { name: area, type: "", doc: "`tests`." }
      - { name: signal, type: "", doc: "`test-file-deleted`, `test-deleted`, `fewer-assertions` or `skip-added`." }
      - { name: severity, type: "", doc: "`high`." }
      - { name: path, type: TEXT, doc: "The test file." }
      - { name: line, type: INT, doc: "The deleted test's line (base side), or NULL for a whole-file count." }
      - { name: end_line, type: "", doc: "NULL." }
      - { name: title, type: "", doc: "One line for a list." }
      - { name: why, type: "", doc: "The evidence." }
      - { name: uri, type: TEXT, doc: "The deleted test's symbol, or NULL." }
  - name: review_signal_api
    version: 1
    adds_to: oxplow/review_signal
    description: "The change review's API signals: public functions whose parameters changed, and public functions a change removed (`medium`). Tests are left out."
    fields:
      - { name: change_id, type: INTEGER, doc: "The change (v_change.id)." }
      - { name: source, type: "", doc: "This dataset, `oxplow/review_signal_api`." }
      - { name: area, type: "", doc: "`code`." }
      - { name: signal, type: "", doc: "`signature-changed` or `public-removed`." }
      - { name: severity, type: "", doc: "`medium`." }
      - { name: path, type: TEXT, doc: "The file." }
      - { name: line, type: INTEGER, doc: "The function's first line (base side if removed)." }
      - { name: end_line, type: "", doc: "NULL." }
      - { name: title, type: "", doc: "One line for a list." }
      - { name: why, type: "", doc: "The evidence." }
      - { name: uri, type: TEXT, doc: "The function's symbol." }
  - name: review_signal_harness
    version: 1
    adds_to: oxplow/review_signal
    description: "The change review's harness signals: a test harness, a CI pipeline or a lint config the change touched (`high`). What passing means may have changed. Matched by the `test-harness`, `ci` and `lint-config` file kinds (`v_file_kind_rule`)."
    fields:
      - { name: change_id, type: INTEGER, doc: "The change (v_change.id)." }
      - { name: source, type: "", doc: "This dataset, `oxplow/review_signal_harness`." }
      - { name: area, type: "", doc: "`tests`." }
      - { name: signal, type: "", doc: "`test-harness-changed`, `ci-changed` or `lint-config-changed`." }
      - { name: severity, type: "", doc: "`high`." }
      - { name: path, type: TEXT, doc: "The file." }
      - { name: line, type: "", doc: "NULL." }
      - { name: end_line, type: "", doc: "NULL." }
      - { name: title, type: "", doc: "One line for a list." }
      - { name: why, type: "", doc: "The evidence." }
      - { name: uri, type: "", doc: "NULL." }
  - name: review_signal_dependencies
    version: 1
    adds_to: oxplow/review_signal
    description: "The change review's dependency signals: a dependency manifest or a lockfile the change touched (`high`). Matched by the `dependency-manifest` and `lockfile` file kinds (`v_file_kind_rule`)."
    fields:
      - { name: change_id, type: INTEGER, doc: "The change (v_change.id)." }
      - { name: source, type: "", doc: "This dataset, `oxplow/review_signal_dependencies`." }
      - { name: area, type: "", doc: "`dependencies`." }
      - { name: signal, type: "", doc: "`dependency-manifest-changed` or `lockfile-changed`." }
      - { name: severity, type: "", doc: "`high`." }
      - { name: path, type: TEXT, doc: "The file." }
      - { name: line, type: "", doc: "NULL." }
      - { name: end_line, type: "", doc: "NULL." }
      - { name: title, type: "", doc: "One line for a list." }
      - { name: why, type: "", doc: "The evidence." }
      - { name: uri, type: "", doc: "NULL." }
  - name: review_signal_sensitive
    version: 1
    adds_to: oxplow/review_signal
    description: "The change review's sensitive-place signals: a file in a sensitive place or a migration the change touched (`medium`). Matched by the `sensitive` and `migration` file kinds (`v_file_kind_rule`)."
    fields:
      - { name: change_id, type: INTEGER, doc: "The change (v_change.id)." }
      - { name: source, type: "", doc: "This dataset, `oxplow/review_signal_sensitive`." }
      - { name: area, type: "", doc: "`code`." }
      - { name: signal, type: "", doc: "`sensitive-path` or `migration-changed`." }
      - { name: severity, type: "", doc: "`medium`." }
      - { name: path, type: TEXT, doc: "The file." }
      - { name: line, type: "", doc: "NULL." }
      - { name: end_line, type: "", doc: "NULL." }
      - { name: title, type: "", doc: "One line for a list." }
      - { name: why, type: "", doc: "The evidence." }
      - { name: uri, type: "", doc: "NULL." }
  - name: review_signal_scope
    version: 1
    adds_to: oxplow/review_signal
    description: "The change review's scope signals: files a request changed outside the area its task names (`v_oxplow_deviation`), on the request's change (`info`)."
    fields:
      - { name: change_id, type: INTEGER, doc: "The change (v_change.id)." }
      - { name: source, type: "", doc: "This dataset, `oxplow/review_signal_scope`." }
      - { name: area, type: "", doc: "`scope`." }
      - { name: signal, type: "", doc: "`outside-task-area`." }
      - { name: severity, type: "", doc: "`info`." }
      - { name: path, type: TEXT, doc: "The file." }
      - { name: line, type: "", doc: "NULL." }
      - { name: end_line, type: "", doc: "NULL." }
      - { name: title, type: "", doc: "One line for a list." }
      - { name: why, type: "", doc: "The evidence." }
      - { name: uri, type: "", doc: "NULL." }
  - name: review_signal_shape
    version: 1
    adds_to: oxplow/review_signal
    description: "The change review's shape signals: files the \"look here first\" score (`v_oxplow_change_interest`) gives a reason: large, complex or with long new functions (`info`)."
    fields:
      - { name: change_id, type: INTEGER, doc: "The change (v_change.id)." }
      - { name: source, type: "", doc: "This dataset, `oxplow/review_signal_shape`." }
      - { name: area, type: "", doc: "`code`." }
      - { name: signal, type: "", doc: "`shape`." }
      - { name: severity, type: "", doc: "`info`." }
      - { name: path, type: TEXT, doc: "The file." }
      - { name: line, type: "", doc: "NULL." }
      - { name: end_line, type: "", doc: "NULL." }
      - { name: title, type: "", doc: "One line for a list." }
      - { name: why, type: "", doc: "The score's reasons, `; `-separated." }
      - { name: uri, type: "", doc: "NULL." }
  - name: review_signal_history
    version: 1
    adds_to: oxplow/review_signal
    description: "The change review's history signals: a file changed without the files it usually changes with, or one untouched for months (`info`, from `v_oxplow_change_co_change`). A file the change adds is never dormant, so it gives no row."
    fields:
      - { name: change_id, type: INTEGER, doc: "The change (v_change.id)." }
      - { name: source, type: "", doc: "This dataset, `oxplow/review_signal_history`." }
      - { name: area, type: "", doc: "`history`." }
      - { name: signal, type: "", doc: "`partners-unchanged` or `dormant-file`." }
      - { name: severity, type: "", doc: "`info`." }
      - { name: path, type: TEXT, doc: "The file." }
      - { name: line, type: "", doc: "NULL." }
      - { name: end_line, type: "", doc: "NULL." }
      - { name: title, type: "", doc: "One line for a list." }
      - { name: why, type: "", doc: "The evidence." }
      - { name: uri, type: "", doc: "NULL." }
  - name: review_signal_duplication
    version: 1
    adds_to: oxplow/review_signal
    description: "The change review's duplication signals: blocks of the change's files that copy code elsewhere in the tree (`info`). The scan arrives after the rest of the analysis, so these rows come late."
    fields:
      - { name: change_id, type: INTEGER, doc: "The change (v_change.id)." }
      - { name: source, type: "", doc: "This dataset, `oxplow/review_signal_duplication`." }
      - { name: area, type: "", doc: "`code`." }
      - { name: signal, type: "", doc: "`duplicated-block`." }
      - { name: severity, type: "", doc: "`info`." }
      - { name: path, type: TEXT, doc: "The file." }
      - { name: line, type: INTEGER, doc: "The block's first line." }
      - { name: end_line, type: INTEGER, doc: "The block's last line." }
      - { name: title, type: "", doc: "One line for a list." }
      - { name: why, type: "", doc: "The evidence." }
      - { name: uri, type: "", doc: "NULL." }
  - name: review_signal_shown
    version: 1
    description: "The change review's signals as the pages show them: every row of `v_oxplow_review_signal` (every extension's sources) with the severity the project set for its kind in `review.signals`, and without the kinds set `off`."
    fields:
      - { name: change_id, type: BLOB, doc: "The change (v_change.id)." }
      - { name: source, type: TEXT, doc: "The dataset that gave it (`<ns>/<dataset>`)." }
      - { name: area, type: TEXT, doc: "`tests`, `verification`, `code`, `dependencies`, `history`, `scope` or `other`." }
      - { name: signal, type: TEXT, doc: "The signal's kind." }
      - { name: severity, type: TEXT, doc: "`high`, `medium` or `info`: the project's for this kind, else the source's." }
      - { name: path, type: TEXT, doc: "The file, or NULL for the whole change." }
      - { name: line, type: INT, doc: "The line, or NULL." }
      - { name: end_line, type: INT, doc: "The last line, or NULL." }
      - { name: title, type: TEXT, doc: "One line for a list." }
      - { name: why, type: TEXT, doc: "The evidence." }
      - { name: uri, type: TEXT, doc: "A link, or NULL." }
      - { name: source_severity, type: TEXT, doc: "The severity the source gave, before the project's setting." }
  - name: review_signal_verification
    version: 1
    adds_to: oxplow/review_signal
    description: "The change review's verification signals for a request, from the reports oxplow read (never the agent's word): its latest test run failed (`high`), it ran no test though it changed code (`medium`), and changed lines its latest diff coverage found no test ran (`medium`, one row per file)."
    fields:
      - { name: change_id, type: INTEGER, doc: "The change (v_change.id)." }
      - { name: source, type: "", doc: "This dataset." }
      - { name: area, type: "", doc: "`verification`." }
      - { name: signal, type: "", doc: "`tests-failing`, `no-test-run` or `uncovered-lines`." }
      - { name: severity, type: "", doc: "`high` or `medium`." }
      - { name: path, type: "", doc: "The file, or NULL for the whole change." }
      - { name: line, type: "", doc: "The line, or NULL." }
      - { name: end_line, type: "", doc: "NULL." }
      - { name: title, type: "", doc: "One line for a list." }
      - { name: why, type: "", doc: "The evidence." }
      - { name: uri, type: "", doc: "NULL." }
  - name: review_signal_unused
    version: 1
    adds_to: oxplow/review_signal
    description: "The change review's unused-code signal: a function the change removed the last call to (`medium`). A text search over the head tree finds no other mention, so it says \"possibly\". Rows come from the `oxplow.review.unused` check, which runs when the change's analysis is stored."
    fields:
      - { name: change_id, type: INTEGER, doc: "The change (v_change.id)." }
      - { name: source, type: "", doc: "This dataset, `oxplow/review_signal_unused`." }
      - { name: area, type: "", doc: "`code`." }
      - { name: signal, type: TEXT, doc: "`possibly-unused`." }
      - { name: severity, type: "", doc: "`medium`." }
      - { name: path, type: TEXT, doc: "The file that defines the function." }
      - { name: line, type: INTEGER, doc: "Where it is defined." }
      - { name: end_line, type: "", doc: "NULL." }
      - { name: title, type: TEXT, doc: "One line for a list." }
      - { name: why, type: TEXT, doc: "The evidence: where the last call was removed." }
      - { name: uri, type: TEXT, doc: "The function's symbol." }
  - name: review_check
    version: 1
    description: "Where each review check stands for each analysed change: one row per change and per check (a collector on `change.analyzed`). `pending` until the check has run for the change's latest analysis, `failed` when that run failed, else `ok`. The Review page shows a pending check as still running."
    fields:
      - { name: change_id, type: INT, doc: "The change (v_change.id)." }
      - { name: collector, type: TEXT, doc: "The check, `<namespace>/<id>`." }
      - { name: collector_uri, type: TEXT, doc: "The check's collector URI (`v_collector.uri`)." }
      - { name: state, type: TEXT, doc: "`pending`, `failed` or `ok`." }
      - { name: last_run_at, type: TEXT, doc: "When the check last ran (any change); NULL when it never ran." }
      - { name: error, type: TEXT, doc: "Why its last run failed, when `state` is `failed`." }
  - name: review_signal_findings
    version: 2
    adds_to: oxplow/review_signal
    description: "The change review's lint signals: facts with a rule or a severity on a line the change touched (the language packs' idiom collectors, a project's own fact collectors; read for a change headed at the working tree or its stream's latest snapshot, since facts are the current tree's), and a request's analyzer findings on changed lines. A fact's severity maps error → `high`, info/note → `info`, else `medium`."
    fields:
      - { name: change_id, type: INTEGER, doc: "The change (v_change.id)." }
      - { name: source, type: "", doc: "This dataset." }
      - { name: area, type: "", doc: "`code`." }
      - { name: signal, type: "", doc: "`lint-<rule or measure>` or `analyzer-<rule>`." }
      - { name: severity, type: "", doc: "`high`, `medium` or `info`." }
      - { name: path, type: BLOB, doc: "The file, or NULL for the whole change." }
      - { name: line, type: "", doc: "The line, or NULL." }
      - { name: end_line, type: "", doc: "NULL." }
      - { name: title, type: "", doc: "One line for a list." }
      - { name: why, type: "", doc: "The evidence." }
      - { name: uri, type: "", doc: "NULL." }
  - name: commit_task
    version: 1
    description: "The tasks each commit was for: the ones its message mentions (`tsk42`, `[[tsk42]]`, by a store's id pattern), the ones that declared it as an impact, and the ones a request that worked on them made it (`v_commit_request` joined to `v_oxplow_request_link`)."
    fields:
      - { name: sha, type: TEXT, doc: "The commit." }
      - { name: task, type: TEXT, doc: "The task (`v_oxplow_task.uri`)." }
  - name: contribution_repair
    version: 1
    description: "The open repair task of a contribution (the one linked `about` it, not done or canceled), filed by the repair effect."
    fields:
      - { name: uri, type: TEXT, doc: "The contribution's URI (`v_contribution_health.uri`)." }
      - { name: repair_item, type: TEXT, doc: "The open repair task's URI." }
  - name: finished_cleared
    version: 2
    key: [thread_id]
    # Stored: it reads the event log, which every agent event writes, and a
    # live view of it would make the Work panel re-run on each one. A
    # recompute that finds the same rows writes nothing, so its readers
    # hear only a clear.
    materialize: on_change
    description: "When the person last cleared each thread's Finished list in the Work panel (`oxplow.tasks.clear_finished`), read from the events' envelopes."
    fields:
      - { name: thread_id, type: INT, doc: "The thread (v_thread.id)." }
      - { name: cleared_at, type: TEXT, doc: "When it was last cleared (RFC 3339)." }
  - name: task
    version: 1
    description: "the tasks of every store over the shared task model (the read contract for tasks). `native` is the store's own fields, `assignee` and `rank` oxplow's."
    fields:
      - { name: uri, type: TEXT, doc: "The task's URI." }
      - { name: provider, type: TEXT, doc: "Its store." }
      - { name: native_id, type: TEXT, doc: "The store's own id." }
      - { name: title, type: TEXT, doc: "Title." }
      - { name: body, type: TEXT, doc: "Markdown body." }
      - { name: state, type: TEXT, doc: "Its bucket." }
      - { name: stage, type: TEXT, doc: "The store's own stage." }
      - { name: stage_title, type: TEXT, doc: "How the store names its stage." }
      - { name: native, type: TEXT, doc: "The store's own fields as JSON." }
      - { name: parent_uri, type: TEXT, doc: "The parent task's URI; NULL at top level." }
      - { name: assignee, type: TEXT, doc: "A thread's or the person's URI; NULL for nobody." }
      - { name: rank, type: REAL, doc: "Its place in the assignee's queue." }
      - { name: closed_at, type: TEXT, doc: "When it was closed; NULL while open." }
      - { name: created_at, type: TEXT, doc: "Created (RFC 3339)." }
      - { name: updated_at, type: TEXT, doc: "Updated (RFC 3339)." }
  - name: task_link
    version: 1
    description: "the links of every store's tasks."
    fields:
      - { name: from_uri, type: TEXT, doc: "The task the link is from." }
      - { name: to_uri, type: TEXT, doc: "What it points at." }
      - { name: to_kind, type: TEXT, doc: "The target's resource kind." }
      - { name: link_type, type: TEXT, doc: "The link type." }
      - { name: created_at, type: TEXT, doc: "When the link was made (RFC 3339)." }
  - name: task_comment
    version: 1
    description: "the comments of every store's tasks, over the shared model's comments child. `id` is the store's own comment id (oxtask: `cmt3`; core's was `oxtask_note:3`)."
    fields:
      - { name: id, type: TEXT, doc: "The store's own id for the comment." }
      - { name: uri, type: TEXT, doc: "The task it's on." }
      - { name: body, type: TEXT, doc: "Markdown body." }
      - { name: author, type: TEXT, doc: "Who wrote it, as the store records it (oxtask: a thread's or the person's URI)." }
      - { name: created_at, type: TEXT, doc: "RFC 3339 timestamp." }
  - name: search_task
    version: 1
    description: "what site search indexes for each task, in `v_oxplow_search_task`'s shape, over `task`: its own id, its body, then its comments; tasks assigned to an archived thread or stream are left out."
    fields:
      - { name: uri, type: TEXT, doc: "The task's canonical ref: what a hit opens." }
      - { name: title, type: TEXT, doc: "The task's title." }
      - { name: body, type: TEXT, doc: "Its own id (so typing `tsk42` finds it), then its body, then its comments." }
      - { name: stream_id, type: TEXT, doc: "Its thread's stream (`str1`); NULL for an unassigned task." }
  - name: knowledge_page
    version: 1
    description: "the knowledge pages of every store over the shared knowledge model (the read contract for pages, and what the `oxplow/knowledge` resource resolves through): title, kind, excerpt, body, the URIs it links, how many of the files it cites changed since it was pinned, and its reads."
    fields:
      - { name: uri, type: TEXT, doc: "The page's URI (`oxplow:oxplow/knowledge?id=…&store=…`)." }
      - { name: store, type: TEXT, doc: "The store that keeps it (oxwiki, an extension's)." }
      - { name: id, type: TEXT, doc: "The store's own page id (oxwiki: its slug)." }
      - { name: kind, type: TEXT, doc: "The store's kind of page." }
      - { name: title, type: TEXT, doc: "Title." }
      - { name: url, type: TEXT, doc: "Where the store keeps it, when it says." }
      - { name: author, type: TEXT, doc: "Who last wrote it, as the store records it." }
      - { name: excerpt, type: TEXT, doc: "The start of its body." }
      - { name: body, type: TEXT, doc: "Markdown body." }
      - { name: body_size, type: INT, doc: "Bytes of body." }
      - { name: outbound_uris, type: TEXT, doc: "JSON array of the URIs it links." }
      - { name: stale_ref_count, type: INT, doc: "How many of the files it cites changed since the page was pinned." }
      - { name: read_count, type: INT, doc: "Reads by agents and people." }
      - { name: agent_read_count, type: INT, doc: "Reads by agents." }
      - { name: last_read_at, type: TEXT, doc: "When it was last read (RFC 3339); NULL if never." }
      - { name: updated_at, type: TEXT, doc: "Updated (RFC 3339)." }
  - name: knowledge_read
    version: 1
    description: "every read of a knowledge page: an agent's (the `knowledge_read_record` model, from `record.read`) and a person's (their page visits)."
    fields:
      - { name: uri, type: TEXT, doc: "The page's URI." }
      - { name: actor, type: TEXT, doc: "`agent` or `person`." }
      - { name: thread_id, type: INT, doc: "The thread that read it; NULL when unknown." }
      - { name: turn_id, type: INT, doc: "The agent turn that read it; NULL for a person's." }
      - { name: via, type: TEXT, doc: "`tool` or `file` for an agent, `open` for a person." }
      - { name: at, type: TEXT, doc: "When (RFC 3339)." }
  - name: knowledge_touch
    version: 1
    description: "which threads wrote which knowledge pages, and when last (the `knowledge_touch_record` model)."
    fields:
      - { name: page, type: TEXT, doc: "The page's URI." }
      - { name: thread_id, type: INT, doc: "The thread (`v_thread.id`)." }
      - { name: last_seen_at, type: TEXT, doc: "When it last wrote the page (RFC 3339)." }
  - name: knowledge_ref
    version: 1
    description: "the files and directories each knowledge page pins, and whether each changed since (`v_ref_pin` of the pages)."
    fields:
      - { name: page, type: TEXT, doc: "The page's URI." }
      - { name: path, type: TEXT, doc: "The file or directory." }
      - { name: kind, type: TEXT, doc: "`file` or `dir`." }
      - { name: pinned_snapshot_id, type: INTEGER, doc: "The snapshot it was pinned to; NULL if never pinned." }
      - { name: pinned_vcs_rev, type: TEXT, doc: "The VCS revision nearest the pin." }
      - { name: pinned_vcs_rev_exact, type: INT, doc: "1 when the pin is exactly that revision." }
      - { name: latest_snapshot_id, type: INT, doc: "The latest primary snapshot of it." }
      - { name: stale, type: INT, doc: "1 when it changed after the pin." }
  - name: search_knowledge
    version: 1
    description: "what site search indexes for each knowledge page, in `v_oxplow_search_knowledge`'s shape: its title and its body."
    fields:
      - { name: uri, type: TEXT, doc: "The page's canonical ref: what a hit opens." }
      - { name: title, type: TEXT, doc: "The page's title." }
      - { name: body, type: TEXT, doc: "Its body." }
      - { name: stream_id, type: TEXT, doc: "Always NULL: a page is project-wide." }
      - { name: version, type: TEXT, doc: "Changes whenever the page's text does (its `updated_at`): a recompute reads the text of rows whose version moved only." }
  - name: request_link
    version: 1
    description: "the tasks each request worked on, in `v_oxplow_request_link`'s shape (request, task, basis, turn, thread_id, at, turns, started_at, last_ended_at, request_id), over the `request_task` model. `basis` keeps the model's names: `filed` and `edited` are core's `command`."
    fields:
      - { name: request, type: TEXT, doc: "The request (`v_request.uri`)." }
      - { name: task, type: TEXT, doc: "The task's URI; it may dangle." }
      - { name: basis, type: TEXT, doc: "`prompt`, `filed`, `edited`, `transition` or `assigned`." }
      - { name: turn, type: TEXT, doc: "The turn the evidence was recorded in (`v_agent_turn.uri`)." }
      - { name: thread_id, type: INT, doc: "That turn's thread (`v_thread.id`); NULL when no turn was named." }
      - { name: at, type: TEXT, doc: "When the link was recorded (RFC 3339)." }
      - { name: turns, type: INT, doc: "How many turns the request has so far." }
      - { name: started_at, type: TEXT, doc: "When the request's first turn started." }
      - { name: last_ended_at, type: TEXT, doc: "When its latest turn ended; NULL while one runs." }
      - { name: request_id, type: INT, doc: "The request's id (`v_request.id`)." }
  - name: thread_work_badge
    version: 1
    description: "A label for each thread that worked on tasks: how many are done and how many still open (\"3 done · 1 open\"), over the tasks its requests worked on. Decorates thread rows (Closed Threads)."
    fields:
      - { name: uri, type: TEXT, doc: "The thread's URI." }
      - { name: label, type: TEXT, doc: "\"3 done · 1 open\"." }
  - name: session_task_badge
    version: 1
    description: "One label per task the requests of a session's turns worked on (its title), in the order they were first worked on. Decorates agent session rows (Thread sessions)."
    fields:
      - { name: uri, type: TEXT, doc: "The agent session's URI." }
      - { name: label, type: TEXT, doc: "A task's title." }
  - name: snapshot_work_badge
    version: 1
    description: "A label per task the request of the turn that took a snapshot worked on: \"completed: X\" for a turn's end take, \"in flight: X\" for another take of a turn. Decorates snapshot rows (Local History)."
    fields:
      - { name: uri, type: TEXT, doc: "The snapshot's URI." }
      - { name: label, type: TEXT, doc: "\"completed: X\" or \"in flight: X\"." }
  - name: thread_tasks
    version: 9
    description: "Each thread's Work panel, one row per line in display order: the tasks the thread is working on (a project-manager view of tasks, never of turns or requests). In progress is the tasks assigned to it in progress (under their epic with the epic's other children); Up next is the ready and blocked tasks assigned to the thread, in its queue's order; Finished is the done tasks a request on the thread worked on (each once) and the knowledge pages it touched, since the list was cleared. It reads no request, so it changes only when tasks, their requests' links or the thread's knowledge touches do; what a thread's request is doing now is v_request's (the Work panel reads it for its own thread)."
    fields:
      - { name: thread_id, type: INT, doc: "The thread (v_thread.id)." }
      - { name: grp, type: TEXT, doc: "`In progress`, `Up next` or `Finished`." }
      - { name: g, type: INT, doc: "The group's place (0, 1, 3)." }
      - { name: ord, type: INT, doc: "The line's place in its group." }
      - { name: title, type: TEXT, doc: "What to show." }
      - { name: icon, type: TEXT, doc: "A viz icon name: a task state (`todo`, `blocked`, `in_progress`, `done`, …), `epic` or `knowledge`." }
      - { name: uri, type: TEXT, doc: "What the line opens (a task's URI, a knowledge page's)." }
      - { name: depth, type: INT, doc: "1 for an epic's child, else 0." }
      - { name: active, type: INT, doc: "1 for a task in progress on this thread." }
effects:
  - id: assign-on-start
    summary: An agent starting a task puts it last in its thread's queue; closing a task clears its assignee and place.
    on: [oxplow.task_record.changed]
    where: { cause: trigger }
    entry: effects/assign_on_start.star
  # A closed thread's open tasks, and an archived stream's threads', go back
  # to nobody. Core did these
  # on its own tables; before the flip the model holds no live task, so they
  # find nothing.
  - id: release-on-thread-close
    summary: A closed thread's open tasks go back to nobody, last in their queue.
    on: [thread.closed]
    needs: [sql.read]
    entry: effects/release_on_close.star
  - id: release-on-stream-archive
    summary: An archived stream's threads' open tasks go back to nobody.
    on: [stream.archived]
    needs: [sql.read]
    entry: effects/release_on_close.star
# Places where several task stores offer one action: a task page draws "New
# Task" once, whichever stores are on (a button with one, a menu with
# several). A store's command joins with `ui: { at: oxplow/task.new }`.
action_points:
  - name: knowledge.new
    label: New Page
    doc: Write a knowledge page. Each knowledge store offers its own way.
    context:
      title?: string
      body?: string
  - name: knowledge.delete
    label: Delete Page
    doc: Delete a knowledge page, for whichever store keeps it.
    item: uri
    context:
      uri: uri
  - name: task.new
    label: New Task
    doc: File a task. Each task store offers its own way.
    context:
      parent?: uri
      thread_id?: int
  # What can be done to a task, for whichever store holds it: the store's
  # command joins the point for its own items. Shared pages and the Work
  # board run these and name no store's command.
  - name: task.move
    label: Move Task
    doc: Put a task in one of its list's stages.
    item: uri
    context:
      uri: uri
      stage: string
  - name: task.edit
    label: Edit Task
    doc: Change a task's title, description or parent epic. A store's own fields (priority, …) are its own edit part's.
    item: uri
    context:
      uri: uri
      title?: string
      body?: string
      parent?: uri
  - name: task.unparent
    label: Make Top-level
    doc: Take a task out of its epic.
    item: uri
    context:
      uri: uri
  - name: task.delete
    label: Delete Task
    doc: Delete a task.
    item: uri
    context:
      uri: uri
  - name: task.comment
    label: Comment
    doc: Add a comment to a task.
    item: uri
    context:
      uri: uri
  - name: task.link
    label: Link
    doc: Link a task to another item.
    item: uri
    context:
      uri: uri
      to?: string
      type?: string
  - name: task.unlink
    label: Unlink
    doc: Remove a link from a task.
    item: uri
    context:
      uri: uri
      to: string
      type: string
# What a request's work touched: one row per request, task and basis.
resources:
  - name: task
    description: "A task, epic or other item of the project's task model."
    label: Task
    params: { provider: { required: true, pattern: '^[a-z][a-z0-9_-]*$' }, id: { required: true } }
    resolve: task
    searchable: search_task
    icon: check-square
  - name: knowledge
    description: "A page of one of the project's knowledge stores (oxwiki, an extension's)."
    label: Knowledge page
    params: { store: { required: true, pattern: '^[a-z][a-z0-9_-]*$' }, id: { required: true } }
    resolve: knowledge_page
    searchable: search_knowledge
    icon: book-open
  - name: knowledge_read_record
    label: Knowledge read
    description: "An agent's read of a knowledge page (oxplow's own record of it)."
    params:
      store: { required: true }
      id: { required: true }
  - name: knowledge_touch_record
    label: Knowledge touch
    description: "The last time a thread wrote a knowledge page."
    params:
      store: { required: true }
      id: { required: true }
  - name: request_task
    label: Request link
    description: "A link from a request to a task its turns changed, and how (filed, transition, assigned, edited; prompt for a link moved from core, where a person's prompt named the task)."
    params:
      store: { required: true }
      id: { required: true }
# The shared task and knowledge models every store fills, and oxplow's
# own fields on a task (who it is assigned to, its place in their queue).
# Stores write them through their collectors; this extension's own model
# (`request_task`) is written by its own collector.
fills:
  - model: oxplow/request_task
    stores: [oxplow]
  - model: oxplow/knowledge_read_record
    stores: [oxplow]
  - model: oxplow/knowledge_touch_record
    stores: [oxplow]
  # Claude Code's memories of this project, as pages of a read-only store:
  # Claude Code writes them, oxplow observes them. No id_pattern: a bare
  # `[[id]]` never names a memory.
  - model: oxplow/knowledge_record
    stores: [claude-memory]
    files: { root: "agent:claude", folder: memory, suffix: .md }
# The folder Claude Code keeps this project's memories in (its own data
# folder for the project; sessions in a worktree write there too).
files:
  - { root: "agent:claude", path: memory, access: read, watch: true }
models:
  - name: request_task
    resource: request_task
    key: key
    columns:
      # request|task|basis: the row's name.
      key: text
      request: uri
      task: uri
      basis: { type: text, values: [filed, transition, assigned, edited, prompt] }
      thread: uri
      turn_id: int
      at: time
  - name: knowledge_read_record
    resource: knowledge_read_record
    key: key
    columns:
      # page|at|via|turn: the read's name.
      key: text
      page: uri
      thread: uri
      turn_id: int
      via: { type: text, values: [tool, file] }
      at: time
  - name: knowledge_touch_record
    resource: knowledge_touch_record
    key: key
    columns:
      # thread|page: the touch's name.
      key: text
      page: uri
      thread: uri
      last_seen: time
  - name: task_record
    resource: task
    open: true
    key: id
    store_param: provider
    change_event: oxplow.task_record.changed
    search: { title: title, body: body }
    columns:
      id: text
      title: { type: text, markdown: {} }
      body: { type: text, markdown: {} }
      state: { type: text, values: [backlog, todo, in_progress, blocked, done, canceled] }
      stage: text
      stage_title: text
      parent: { type: uri, edge: task_record.parent }
      closed_at: time
      created_at: time
      updated_at: time
    children:
      links:
        key: [to, type]
        columns:
          to: uri
          type: { type: text, values: [blocks, discovered_from, relates_to, duplicates, supersedes, replies_to, about] }
          at: time
        edge: { to: to, type_from: type, prefix: "task_record_link:" }
      comments:
        key: [id]
        columns: { id: text, author: text, author_kind: { type: text, values: [person, agent, system] }, at: time, body: { type: text, markdown: {} } }
  - name: knowledge_record
    resource: knowledge
    open: true
    key: id
    change_event: oxplow.knowledge_record.changed
    search: { title: title, body: body }
    columns:
      id: text
      title: text
      body: { type: text, markdown: { pins: true } }
      kind: text
      url: text
      author: text
      updated_at: time
fields:
  - model: oxplow/task_record
    fields:
      - { name: assignee, title: Assignee, kind: text }
      - { name: rank, title: Rank, kind: number }
event_types:
  types:
    - type: oxplow.tasks.finished_cleared
      v: 1
      schema: event_types/finished_cleared.json
      summary: A person cleared a thread's Finished list in the Work panel. Subject — the thread.
ui:
  # Task facts on foundation's pages, which read no task: a label after any
  # cell that links to the thread, session or snapshot.
  decorators:
    - { dataset: thread_work_badge, resource: oxplow/thread, placement: row-badge, label: label }
    - { dataset: session_task_badge, resource: oxplow/agent_session, placement: row-badge, label: label }
    - { dataset: snapshot_work_badge, resource: oxplow/snapshot, placement: row-badge, label: label }
  # A task's page shows the agent's tokens on it and what another
  # thread shares with it.
  mounts:
    # The request summary's tasks (foundation's page reads no task).
    - { page: request-tasks, at: oxplow/request-summary.sections, position: { after: request }, title: Tasks }
    - { page: contribution-repair, at: oxplow/contribution-health.repair }
    - { page: task-tokens, at: oxplow/task-detail.sections }
    - { page: item-shared-work, at: oxplow/task-detail.sections }
    # A request's Changes page shows where it left its task's area and
    # where its agent struggled (empty on a snapshot's or a turn's).
    - { page: change-task, at: oxplow/diff-view.sections, position: { after: header }, title: Task }
    - { page: change-task-description, at: oxplow/diff-view.sections, position: { after: header }, title: Description }
    # A change's review, as one line at the top of each change page; the
    # line links to the Review page (`change-review`).
    - { page: change-review-brief, at: oxplow/diff-view.sections, position: { after: header } }
    - { page: change-review-brief, at: oxplow/commit.sections, position: { after: detail } }
    - { page: change-review-brief, at: oxplow/uncommitted-changes.sections, position: { after: clean } }
    # Above a file's diff: the files it usually changes with, left alone here.
    - { page: file-co-change, at: oxplow/diff.file-header }
    - { page: what-deviated, at: oxplow/diff-view.sections }
    - { page: struggled, at: oxplow/diff-view.sections }
configuration:
  version: 2
  schema:
    type: object
    additionalProperties: false
    properties:
      review:
        type: object
        additionalProperties: false
        x-category: review
        description: How the change review ranks its signals.
        properties:
          signals:
            type: array
            default: []
            description: "Signals whose severity you set yourself, or turn off: a row per signal kind (`test-deleted`, `lint-unwrap_expect`, …), from any extension. The last row for a kind wins."
            items:
              type: object
              additionalProperties: false
              required: [signal, severity]
              properties:
                signal: { type: string, description: "The signal's kind, as the Review page's Signals list shows it." }
                severity: { type: string, enum: [high, medium, info, "off"], description: "Its severity here, or off to hide it." }
      coChange:
        type: object
        additionalProperties: false
        x-category: review
        description: Which files count as usually committed together, and when one is dormant.
        properties:
          minShared: { type: integer, minimum: 1, default: 3, description: Commits two files must share to be a pair. }
          windowDays: { type: integer, minimum: 1, default: 180, description: How far back commits count. }
          maxFilesPerCommit: { type: integer, minimum: 1, default: 50, description: Commits touching more files than this are ignored (mass renames). }
          dormantDays: { type: integer, minimum: 1, default: 90, description: A file no commit touched in this many days is dormant. }
      struggle:
        type: object
        additionalProperties: false
        x-category: review
        description: When the agent is said to have struggled in a request.
        properties:
          repeatedEdits: { type: integer, minimum: 1, default: 5, description: Edits of one file at or above which it counts. }
          failedCommands: { type: integer, minimum: 1, default: 3, description: Failed shell commands at or above which they count. }
  categories:
    review:
      title: Review
      description: When the review views count two files as usually committed together, a file as dormant, or the agent as struggling.
      order: 85
commands:
  # This extension's review-policy settings (`configuration:` above), through
  # the host's configuration scope. A person sets them; a change republishes
  # the datasets that read them.
  - name: tasks.clear_finished
    summary: Clear a thread's Finished list in the Work panel — what finished before now stops showing there.
    input_schema:
      type: object
      required: [thread_id]
      properties:
        thread_id: { type: [integer, string], description: "The thread's row id (v_thread.id)." }
      additionalProperties: false
    entry: handlers/clear_finished.star
    access: record
    examples:
      - { name: clears, input: { thread_id: 3 }, expect_commands: [] }
  # Who works on a task and its place in their queue, over the shared task
  # model's two oxplow fields.
  - name: tasks.assign
    summary: "Assign a task to a thread, the person, or nobody, at the end of that queue. Undoable."
    input_schema:
      type: object
      required: [uri]
      properties:
        uri: { type: string, description: "The task's URI." }
        to: { type: [string, "null"], description: "A thread's URI (oxplow:oxplow/thread?id=thr1), oxplow:oxplow/person, or null for nobody." }
      additionalProperties: false
    example: {"uri": "oxplow:oxplow/task?id=tsk1", "to": "oxplow:oxplow/person"}
    entry: handlers/assign.star
    needs: [sql.read]
    access: write
  - name: tasks.reorder
    summary: "Move a task within its assignee's queue (or among the unassigned): before or after another task there. Undoable."
    input_schema:
      type: object
      required: [uri]
      properties:
        uri: { type: string, description: "The task's URI." }
        before: { type: string, description: "Put it before this task (same queue)." }
        after: { type: string, description: "Put it after this task (same queue)." }
      additionalProperties: false
    example: {"uri": "oxplow:oxplow/task?id=tsk1", "before": "oxplow:oxplow/task?id=tsk2"}
    entry: handlers/reorder.star
    needs: [sql.read]
    access: write
custom_components:
  # The Work board: the tasks as cards in a column per stage, its own
  # toolbar, drag and card menu; oxplow draws its nav bar and confirms.
  - id: board
    title: Board
    description: "The tasks as a kanban board: a column per stage of the list, drag a card to move it, a card's menu to set its stage, fields and assignee."
    bundle: dist/board
    commands: [oxplow.tasks.assign, oxplow.tasks.reorder]
    # Whichever store holds a card answers these: the board names no store's command.
    action_points: [oxplow/task.move, oxplow/task.edit, oxplow/task.unparent, oxplow/task.delete]
panels:
  # What the thread is working on: its open task (with its epic), the
  # items assigned to it next, and what it finished; collapsed, the task.
  # Its header has no count, and opens the Work board.
  - { id: work, title: Work, icon: list-checks, scope: thread, body: work-panel, collapsed: work-line, open: 'oxplow:oxplow/page?page=work' }
  # What is assigned to the person: their open tasks, counted; the header
  # opens the Assigned to you page. Project-wide, so the thread is not a param.
  - { id: assigned, title: Assigned to you, icon: user, scope: project, body: assigned-panel, collapsed: assigned-line, count: assigned-count, open: 'oxplow:oxplow/page?page=assigned-to-you' }
# What the agent reads about the task model, while it has a live store.
skills:
  - { name: tasks, file: skills/tasks/SKILL.md, needs: [model:oxplow/task_record] }
  - { name: knowledge, file: skills/knowledge/SKILL.md, needs: [model:oxplow/knowledge_record] }
# Whether the work was tracked: of the requests that changed files, the share
# that has a task linked. It reads no workflow setting: it measures what
# happened, whatever the workflow.
collectors:
  - id: oxplow.review.unused
    doc: "A review check: after a change's analysis is stored, the functions it removed the last call to (a text search of the head tree finds no other mention), as rows of the review's open list."
    runtime: starlark
    entry: collectors/review/unused.star
    on: [change.analyzed]
    where: { phase: files }
    needs: [tree.read, sql.read]
    input: "SELECT :stream_id AS stream_id"
    sync: upsert
    entities:
      - name: review_unused
        key: id
        columns: { id: text, change_id: int, path: text, line: int, signal: text, title: text, why: text, uri: text }
  - id: oxplow.request_tracked
    doc: Whether a request that changed files has a task linked, recorded when a turn of it ends and none of its turns runs.
    runtime: starlark
    entry: collectors/request/tracked.star
    on: [agent.turn.ended]
    input: |
      SELECT r.uri AS request,
             EXISTS (SELECT 1 FROM v_oxplow_request_link rt WHERE rt.request_id = r.id) AS tracked,
             r.started_at AS placed_at
        FROM v_agent_turn t
        JOIN v_request r ON r.id = t.request_id
       WHERE t.id = :turn_id
         AND NOT EXISTS (SELECT 1 FROM v_agent_turn o
                          WHERE o.request_id = t.request_id AND o.ended_at IS NULL)
         AND EXISTS (SELECT 1 FROM v_tool_call_path p JOIN v_agent_turn pt ON pt.id = p.turn_id
                      WHERE pt.request_id = t.request_id)
    facts: [oxplow.request_tracked]
  - id: oxplow.request_task
    doc: "Links the request of the turn a task changed in to the task (the `oxplow/request_task` model), when the change's cause is a command or a field write (a reconcile links nothing)."
    runtime: starlark
    entry: collectors/request/task_links.star
    on: [oxplow.task_record.changed]
    where: { cause: [trigger, fields] }
    input: |
      SELECT r.uri AS request, t.thread_id AS thread_id, th.uri AS thread_uri,
             (SELECT group_concat(x.key, char(10)) FROM v_oxplow_request_task x
               WHERE x.request = r.uri) AS known
        FROM v_agent_turn t
        JOIN v_request r ON r.id = t.request_id
        LEFT JOIN v_thread th ON th.id = t.thread_id
       WHERE t.id = :turn_id
    sync: upsert
  - id: oxplow.request_task_prompt
    doc: "Links the request of a person's prompt to the tasks the prompt names (basis `prompt`), from the edges the prompt logging records."
    runtime: starlark
    entry: collectors/request/prompt_links.star
    on: [agent.prompt.submitted]
    input: |
      SELECT r.uri AS request, th.uri AS thread_uri, p.target_uri AS task
        FROM v_agent_turn t
        JOIN v_request r ON r.id = t.request_id
        JOIN v_thread th ON th.id = t.thread_id
        JOIN v_page_ref p ON p.source_uri = t.uri AND p.ref_type = 'prompt_mention'
                         AND p.target_resource = 'oxplow/task'
       -- A link keeps the first evidence (core's insert or ignore).
       WHERE t.id = :turn_id
         AND NOT EXISTS (SELECT 1 FROM v_oxplow_request_task x
                          WHERE x.key = r.uri || '|' || p.target_uri || '|prompt')
    sync: upsert
  - id: oxplow.request_task_assigned
    doc: "Links the request of a turn that ended to the tasks in progress and assigned to its thread (basis `assigned`)."
    runtime: starlark
    entry: collectors/request/assigned_links.star
    on: [agent.turn.ended]
    input: |
      SELECT r.uri AS request, th.uri AS thread_uri, w.uri AS task
        FROM v_agent_turn t
        JOIN v_request r ON r.id = t.request_id
        JOIN v_thread th ON th.id = t.thread_id
        JOIN v_oxplow_task w ON w.assignee = th.uri AND w.state = 'in_progress'
       -- A link keeps the first evidence (core's insert or ignore).
       WHERE t.id = :turn_id
         AND NOT EXISTS (SELECT 1 FROM v_oxplow_request_task x
                          WHERE x.key = r.uri || '|' || w.uri || '|assigned')
    sync: upsert
  - id: oxplow.knowledge_read
    doc: "Keeps an agent's read of a knowledge page (a `record.read` of a page, through a tool or its file) as a row of the `oxplow/knowledge_read_record` model."
    runtime: starlark
    entry: collectors/knowledge/reads.star
    on: [record.read]
    input: |
      SELECT th.uri AS thread_uri FROM v_thread th WHERE th.id = :thread_id
    sync: upsert
  - id: oxplow.knowledge_touch
    doc: "Keeps which thread wrote a knowledge page (a change of the knowledge model made in a thread's run: a store's command; a person's edit of a file has no thread) as a row of the `oxplow/knowledge_touch_record` model."
    runtime: starlark
    entry: collectors/knowledge/touches.star
    on: [oxplow.knowledge_record.changed]
    input: |
      SELECT th.uri AS thread_uri FROM v_thread th WHERE th.id = :thread_id
    sync: upsert
  - id: oxplow.claude_memories
    doc: "States each of Claude Code's memories of this project (the markdown files of its `memory/` folder) as a page of the knowledge store `claude-memory`, on start and whenever a memory file changes."
    runtime: starlark
    entry: collectors/knowledge/claude_memories.star
    needs: [files.read]
    on: [start, { files: "memory/*.md", root: "agent:claude" }]
  # What the project knows: the pages it keeps, restated whenever a page is
  # written, recorded or deleted, and whether a request read any.
  - id: oxplow.knowledge_pages
    doc: How many knowledge pages there are and how many are stale, by store and kind, restated when a page is written, changed or deleted (oxplow.knowledge_record.changed), and when a snapshot changes a file a page cites (snapshot.ref_drifted), since a cited file drifting is what makes a page stale; a snapshot of an uncited file restates nothing.
    runtime: starlark
    entry: collectors/knowledge/pages.star
    on: [oxplow.knowledge_record.changed, snapshot.ref_drifted]
    input: |
      SELECT n.placed_at, n.day, g.store, g.kind, g.pages, g.stale
        FROM (SELECT strftime('%Y-%m-%dT%H:%M:%fZ', 'now') AS placed_at, date('now') AS day) n
        LEFT JOIN (SELECT store, kind, count(*) AS pages,
                          sum(CASE WHEN stale_ref_count > 0 THEN 1 ELSE 0 END) AS stale
                     FROM v_oxplow_knowledge_page GROUP BY store, kind) g ON 1 = 1
    facts: [knowledge.pages, knowledge.stale_pages]
  - id: oxplow.request_read_knowledge
    doc: Whether a request that changed files read a knowledge page, recorded when a turn of it ends and none of its turns runs.
    runtime: starlark
    entry: collectors/knowledge/read.star
    on: [agent.turn.ended]
    input: |
      SELECT r.uri AS request,
             EXISTS (SELECT 1 FROM v_oxplow_knowledge_read k JOIN v_agent_turn kt ON kt.id = k.turn_id
                      WHERE k.actor = 'agent' AND kt.request_id = r.id) AS read,
             r.started_at AS placed_at
        FROM v_agent_turn t
        JOIN v_request r ON r.id = t.request_id
       WHERE t.id = :turn_id
         AND NOT EXISTS (SELECT 1 FROM v_agent_turn o
                          WHERE o.request_id = t.request_id AND o.ended_at IS NULL)
         AND EXISTS (SELECT 1 FROM v_tool_call_path p JOIN v_agent_turn pt ON pt.id = p.turn_id
                      WHERE pt.request_id = t.request_id)
    facts: [knowledge.read_requests]
  # The code metrics: scripts over each snapshot's tree.
  # Scripts over the snapshot's tree, through the same public surface
  # (`source_files()`, `code_metrics()`, `ast_query()`) any collector has.
  # Each one's metrics name it, so it runs only while one is on.
  # A whole-tree scan is minutes of CPU on a large tree, and a commit or
  # rebase moves several refs at once: one scan of the latest tree once
  # they settle, on a uri move (`trigger: git_refs`) rather than every save.
  - { id: oxplow.todos, doc: "Counts the TODO and FIXME markers in the project's files.", runtime: starlark, entry: collectors/code/todos.star, on: [snapshot.taken], facts: [oxplow.todo] }
  - { id: oxplow.fn_count, doc: "Counts the functions in each file, and their parameters.", runtime: starlark, entry: collectors/code/fn_count.star, on: [snapshot.taken], facts: [oxplow.parameter_count] }
  - { id: oxplow.high_complexity_fns, doc: "Finds the functions whose complexity is high.", runtime: starlark, entry: collectors/code/high_complexity_fns.star, on: [snapshot.taken], facts: [oxplow.complexity] }
  - { id: oxplow.long_functions, doc: "Finds the functions longer than 60 lines.", runtime: starlark, entry: collectors/code/long_functions.star, on: [snapshot.taken], facts: [oxplow.fn_length] }
  - { id: oxplow.doc_coverage, doc: "Measures how many items of the code have a doc comment.", runtime: starlark, entry: collectors/code/doc_coverage.star, on: [snapshot.taken], facts: [oxplow.doc_coverage] }
  - { id: oxplow.duplicate_lines, doc: "Finds the lines that the project's files repeat.", runtime: starlark, entry: collectors/code/duplicate_lines.star, whole_tree: true, on: [vcs.head.moved], settle: 60s, at_most: 15m, facts: [oxplow.duplicate_lines] }
dimensions:
  - {"key": "work.priority", "label": "Priority", "entity": "v_oxplow_task", "expr": "json_extract(e.native, '$.priority')", "description": "The priority of a task."}
  - {"key": "oxplow.task", "label": "Task", "valueType": "entity-ref", "subjectKind": "task", "from": {"dataset": "v_oxplow_request_link", "by": "request_id", "value": "task", "order": "CASE basis WHEN 'prompt' THEN 0 WHEN 'edited' THEN 1 WHEN 'filed' THEN 1 WHEN 'transition' THEN 2 ELSE 3 END, at"}, "description": "The task a fact's request worked on: the one the prompt named, else the one it filed or edited, else the one it moved."}
  - {"key": "oxplow.knowledge_store", "label": "Knowledge store", "valueType": "categorical", "description": "The store that keeps a knowledge page, such as oxwiki."}
  - {"key": "oxplow.knowledge_kind", "label": "Knowledge kind", "valueType": "categorical", "description": "The kind of page its store keeps it as (oxwiki: note)."}
measures:
  # The page counts: one capture per day, replaced when a page changes.
  - {"key": "knowledge.pages", "title": "Knowledge pages", "unit": "count", "temporalSemantics": "semi-additive", "fold": "last", "captureScope": "complete", "description": "How many knowledge pages there are, by store and kind, as of the day's last change."}
  - {"key": "knowledge.stale_pages", "title": "Stale knowledge pages", "unit": "count", "temporalSemantics": "semi-additive", "fold": "last", "captureScope": "complete", "description": "How many knowledge pages cite a file that changed since the page was pinned; num is the stale pages, den the pages."}
  # One capture per request at its start, replaced when the request is
  # recorded again: 1 when an agent read a page, 0 when not.
  - {"key": "knowledge.read_requests", "title": "Request read knowledge", "unit": "count", "subjectKind": "request", "temporalSemantics": "non-additive", "fold": "sum", "captureScope": "complete", "description": "1 when an agent read a knowledge page in a request that changed files, else 0, as of its latest turn."}
  # One capture per request at its start, replaced when the request is
  # recorded again: 1 when tracked, 0 when not.
  - {"key": "oxplow.request_tracked", "title": "Request tracked", "unit": "count", "subjectKind": "request", "temporalSemantics": "non-additive", "fold": "sum", "captureScope": "complete", "description": "1 when a request that changed files has a task linked, else 0, as of its latest turn."}
  # The code metrics' own measures (complexity, length and parameter count
  # are foundation's: core's change analysis records them too).
  - {"key": "oxplow.todo", "title": "TODO markers", "unit": "count", "subjectKind": "file", "temporalSemantics": "semi-additive", "fold": "last", "captureScope": "per-path", "description": "A TODO or FIXME marker in a file."}
  - {"key": "oxplow.duplicate_lines", "title": "Duplicated lines", "unit": "lines", "subjectKind": "block", "temporalSemantics": "semi-additive", "fold": "last", "captureScope": "complete", "description": "Lines that the project's files repeat."}
  - {"key": "oxplow.doc_coverage", "title": "Doc coverage", "unit": "%", "subjectKind": "file", "temporalSemantics": "semi-additive", "fold": "last", "captureScope": "per-path", "description": "Share of a file's items that have a doc comment."}
metrics:
  - {"key":"task.completed","title":"Tasks completed","entity":"v_oxplow_task","where":"state = 'done'","time":"closed_at","aggregation":"count","unit":"tasks","category":"operational","description":"Tasks done, by the day they were closed."}
  - {"key":"task.open","title":"Open tasks","entity":"v_oxplow_task","where":"state IN ('todo', 'in_progress', 'blocked')","aggregation":"count","unit":"tasks","category":"operational","description":"Tasks ready, in progress or blocked, captured over time."}
  - {"key":"tasks.tracked_requests_pct","title":"Tracked requests","measure": "oxplow.request_tracked", "expression": "RATIO(num, den)", "unit":"%","direction":"higher-better","displayKind":"gauge","category":"operational","description":"The share of the requests that changed files which have a task link.","sliceableDims":["oxplow.branch"]}
  - {"key":"knowledge.pages","title":"Knowledge pages","measure": "knowledge.pages", "expression": "SUM(value)", "unit":"count","direction":"neutral","displayKind":"gauge","category":"operational","description":"How many knowledge pages the enabled stores keep.","sliceableDims":["oxplow.knowledge_store","oxplow.knowledge_kind"]}
  - {"key":"knowledge.stale_pct","title":"Stale knowledge","measure": "knowledge.stale_pages", "expression": "RATIO(num, den)", "unit":"%","direction":"lower-better","displayKind":"gauge","category":"operational","description":"The share of knowledge pages that cite a file which changed since the page was pinned.","sliceableDims":["oxplow.knowledge_store","oxplow.knowledge_kind"]}
  - {"key":"knowledge.read_requests_pct","title":"Requests that read knowledge","measure": "knowledge.read_requests", "expression": "RATIO(num, den)", "unit":"%","direction":"higher-better","displayKind":"gauge","category":"operational","description":"The share of the requests that changed files in which an agent read a knowledge page.","sliceableDims":["oxplow.branch"]}
  - { key: oxplow.todos, title: "TODO / FIXME markers", measure: oxplow.todo, expression: "COUNT(*)", unit: "count", direction: lower-better, displayKind: gauge, category: static-quality, description: "TODO/FIXME/HACK/XXX/BUG markers in comments, across all languages.", sliceableDims: [oxplow.package, oxplow.language, oxplow.vcs_rev], collector: oxplow.todos }
  - { key: oxplow.fn_count, title: "function count", measure: oxplow.parameter_count, expression: "COUNT(*)", unit: "count", direction: neutral, displayKind: gauge, category: static-quality, description: "Total functions / methods defined, across all languages.", sliceableDims: [oxplow.package, oxplow.language, oxplow.vcs_rev], collector: oxplow.fn_count }
  - { key: oxplow.high_complexity_fns, title: "high-complexity functions", measure: oxplow.complexity, expression: "COUNT(*) FILTER (WHERE value >= 11)", unit: "count", direction: lower-better, displayKind: gauge, category: static-quality, description: "Functions whose cyclomatic complexity exceeds the threshold, across all languages.", sliceableDims: [oxplow.package, oxplow.language, oxplow.vcs_rev], collector: oxplow.high_complexity_fns }
  - { key: oxplow.long_functions, title: "long functions (>60 lines)", measure: oxplow.fn_length, expression: "COUNT(*) FILTER (WHERE value >= 61)", unit: "count", direction: lower-better, displayKind: gauge, category: static-quality, description: "Functions longer than 60 lines, across all languages.", sliceableDims: [oxplow.package, oxplow.language, oxplow.vcs_rev], collector: oxplow.long_functions }
  - { key: oxplow.doc_coverage, title: "Doc coverage", measure: oxplow.doc_coverage, expression: "RATIO(num, den)", unit: "%", direction: higher-better, displayKind: coverage, category: coverage, description: "% of public functions/methods carrying a doc comment (or docstring), across all languages.", sliceableDims: [oxplow.package, oxplow.language, oxplow.vcs_rev], collector: oxplow.doc_coverage, default: off }
  - { key: oxplow.duplicate_lines, title: "Duplicated lines", measure: oxplow.duplicate_lines, expression: "SUM(value)", unit: "lines", direction: lower-better, displayKind: findings, category: static-quality, description: "Lines in blocks duplicated elsewhere in the tree, both sides of each copy.", sliceableDims: [oxplow.vcs_rev], collector: oxplow.duplicate_lines }
