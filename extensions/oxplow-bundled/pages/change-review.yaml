title: Review
description: What to look at in one analysed change, worst first. Every review signal (oxplow-bundled's and other extensions') on one list, grouped by file, beside what the change was asked to do.
label: '{{row.tab}}'
params:
- name: change_id
  label: Change
answers:
- {"question":"What should I look at first in this change?","params":{"change_id":1}}
- {"question":"Did the agent weaken any tests?","params":{"change_id":1}}
loaders:
  name:
    sql: |
      -- The tab's name ({{row.tab}} in the label): this loader comes first.
      SELECT 'Review · ' || name AS tab FROM v_oxplow_review_change_name WHERE change_id = CAST(:change_id AS INTEGER)
  change:
    sql: |
      -- What the change was asked to do, from what made it: a request's or a
      -- turn's prompt, a commit's message.
      WITH f AS (
        SELECT count(*) AS n, coalesce(sum(additions), 0) AS a, coalesce(sum(deletions), 0) AS d
        FROM v_change_file WHERE change_id = CAST(:change_id AS INTEGER)
      )
      SELECT c.id AS change_id, c.kind, c.status,
             -- Until the analysis is done, the lists below are not yet
             -- complete: say so first.
             CASE c.status WHEN 'done' THEN ''
                           WHEN 'failed' THEN '_The analysis of this change failed, so the lists below are empty: ' || coalesce(c.error, 'unknown error') || '._' || char(10, 10)
                           ELSE '_Analyzing this change: the lists below are not complete yet._' || char(10, 10) END
             || coalesce(CASE c.kind
               WHEN 'request' THEN (SELECT r.prompt FROM v_request r WHERE r.id = CAST(c.target AS INTEGER))
               WHEN 'turn' THEN (SELECT t.prompt FROM v_agent_turn t WHERE t.id = CAST(c.target AS INTEGER))
               WHEN 'commit' THEN (SELECT m.subject || CASE WHEN m.body = '' THEN '' ELSE char(10, 10) || m.body END
                                   FROM v_commit m WHERE m.sha = c.target)
               WHEN 'working' THEN 'The uncommitted changes in the stream''s worktree. No request is attached to them.'
             END, 'Nothing says what this change was for.') AS asked,
             CASE c.kind WHEN 'request' THEN 'A request' WHEN 'turn' THEN 'A turn' WHEN 'commit' THEN 'A commit'
                         WHEN 'working' THEN 'Uncommitted changes' ELSE 'A range' END AS what,
             printf('%d file%s · +%d −%d', f.n, CASE f.n WHEN 1 THEN '' ELSE 's' END, f.a, f.d) AS size,
             CASE c.status WHEN 'failed' THEN 'Failed: ' || coalesce(c.error, 'unknown error')
                           WHEN 'done' THEN 'Done' ELSE 'Analyzing…' END AS analysis,
             -- A change of more files than the analysis reads (200) reads the
             -- files the languages parse first; say how many it read.
             CASE WHEN c.analyzed_files IS NOT NULL THEN
               printf('%d of %d file%s analysed', c.analyzed_files, c.changed_files,
                      CASE c.changed_files WHEN 1 THEN '' ELSE 's' END)
               || CASE WHEN c.analyzed_files < c.changed_files THEN ' (source files first)' ELSE '' END
             END AS analysed,
             c.base_revision, c.head_revision,
             -- Where its checks (collectors on `change.analyzed`) stand.
             (SELECT CASE WHEN count(*) = 0 THEN 'None ran'
                          WHEN sum(state <> 'ok') = 0 THEN 'Done'
                          ELSE trim(
                            CASE WHEN sum(state = 'pending') > 0 THEN printf('%d running ', sum(state = 'pending')) ELSE '' END
                            || CASE WHEN sum(state = 'failed') > 0 THEN printf('%d failed ', sum(state = 'failed')) ELSE '' END
                            || CASE WHEN sum(state = 'off') > 0 THEN printf('%d off ', sum(state = 'off')) ELSE '' END
                            || CASE WHEN sum(state = 'not_run') > 0 THEN printf('%d did not run', sum(state = 'not_run')) ELSE '' END)
                     END
              FROM v_oxplow_review_check k WHERE k.change_id = c.id) AS checks,
             -- The languages of its files whose pack is off: their files get
             -- no symbols, lint findings or code signals.
             (SELECT group_concat(title || ' ([turn on](oxplow:oxplow/extension?name=' || extension || '))', ', ')
              FROM (SELECT DISTINCT l.title, l.extension
                    FROM v_language l, json_each(l.extensions) e
                    WHERE l.enabled = 0 AND l.analyzable = 1
                      AND EXISTS (SELECT 1 FROM v_change_file cf
                                  WHERE cf.change_id = c.id AND lower(cf.path) LIKE '%.' || e.value)
                    ORDER BY l.title)) AS packs_off
      FROM v_change c, f WHERE c.id = CAST(:change_id AS INTEGER)
  look_here:
    sql: |
      -- One row per file with a `high` or `medium` signal: worst first,
      -- then by the file's look-here-first score. A signal about the whole
      -- change (no file) is its own row. Five signals per file at most; the
      -- row's expansion lists them all.
      WITH s AS (
        SELECT *, CASE severity WHEN 'high' THEN 1 WHEN 'medium' THEN 2 ELSE 3 END AS rank,
               row_number() OVER (PARTITION BY path
                                  ORDER BY CASE severity WHEN 'high' THEN 1 WHEN 'medium' THEN 2 ELSE 3 END, line, title) AS nth
        FROM v_oxplow_review_signal_shown WHERE change_id = CAST(:change_id AS INTEGER)
      ),
      f AS (
        SELECT path, min(rank) AS rank,
               json_group_array(json_object('text', title, 'hint', why))
                 FILTER (WHERE rank <= 2 AND nth <= 5) AS signals,
               count(*) FILTER (WHERE rank <= 2) AS n
        FROM s GROUP BY path
      )
      SELECT f.path, coalesce(f.path, 'The whole change') AS file,
             CASE WHEN f.n > 5
                  THEN json_insert(f.signals, '$[#]', json_object('text', printf('%d more', f.n - 5), 'hint', 'Open the row for all of them.'))
                  ELSE f.signals END AS signals_all,
             CASE f.rank WHEN 1 THEN 'high' ELSE 'medium' END AS severity,
             CASE f.rank WHEN 1 THEN 'danger' ELSE 'warning' END AS tone,
             c.id AS change_id, c.base_revision, c.head_revision
      FROM f JOIN v_change c ON c.id = CAST(:change_id AS INTEGER)
      LEFT JOIN v_oxplow_change_interest i ON i.change_id = CAST(:change_id AS INTEGER) AND i.path = f.path
      WHERE f.rank <= 2
      ORDER BY f.rank, coalesce(i.interest, 0) DESC, f.path
  by_area:
    sql: |
      -- Each area opens its Signals page (a tab of its own).
      SELECT area,
             count(*) FILTER (WHERE severity = 'high') AS high,
             count(*) FILTER (WHERE severity = 'medium') AS medium,
             count(*) FILTER (WHERE severity = 'info') AS info,
             uri('oxplow/page', 'page', 'change-review-signals', 'change_id', CAST(:change_id AS INTEGER), 'area', area) AS signals
      FROM v_oxplow_review_signal_shown WHERE change_id = CAST(:change_id AS INTEGER)
      GROUP BY area
      ORDER BY CASE area WHEN 'tests' THEN 1 WHEN 'verification' THEN 2 WHEN 'dependencies' THEN 3
                         WHEN 'code' THEN 4 WHEN 'scope' THEN 5 WHEN 'history' THEN 6 ELSE 7 END, area
  tests_summary:
    sql: |
      -- What the change did to its tests, in four facts: enough to tell
      -- whether to open the Tests page. Only a request has runs and
      -- coverage: a commit's or a range's facts say so.
      WITH t AS (
        SELECT count(*) AS n, sum(tests_before) AS tb, sum(tests_after) AS ta,
               sum(assertions_before) AS ab, sum(assertions_after) AS aa,
               sum(skips_before) AS sb, sum(skips_after) AS sa
        FROM v_change_test_file WHERE change_id = CAST(:change_id AS INTEGER)
      ),
      s AS (
        SELECT count(*) FILTER (WHERE area = 'tests' AND severity = 'high') AS high,
               count(*) FILTER (WHERE area = 'tests' AND severity = 'medium') AS medium,
               count(*) FILTER (WHERE signal = 'uncovered-lines') AS uncovered
        FROM v_oxplow_review_signal_shown WHERE change_id = CAST(:change_id AS INTEGER)
      ),
      r AS (
        SELECT count(*) AS n,
               (SELECT printf('%d passed, %d failed', r2.passed, r2.failed) FROM v_agent_turn t2
                JOIN v_test_run r2 ON r2.turn_id = t2.id
                WHERE c.kind = 'request' AND t2.request_id = CAST(c.target AS INTEGER)
                ORDER BY r2.captured_at DESC, r2.id DESC LIMIT 1) AS latest,
               (SELECT r2.failed FROM v_agent_turn t2 JOIN v_test_run r2 ON r2.turn_id = t2.id
                WHERE c.kind = 'request' AND t2.request_id = CAST(c.target AS INTEGER)
                ORDER BY r2.captured_at DESC, r2.id DESC LIMIT 1) AS failed,
               EXISTS (SELECT 1 FROM v_request_observation o
                       WHERE c.kind = 'request' AND o.request_id = CAST(c.target AS INTEGER)
                         AND o.kind = 'diff-coverage') AS covered,
               c.kind
        FROM v_change c
        LEFT JOIN v_agent_turn t ON c.kind = 'request' AND t.request_id = CAST(c.target AS INTEGER)
        LEFT JOIN v_test_run tr ON tr.turn_id = t.id
        WHERE c.id = CAST(:change_id AS INTEGER)
        GROUP BY c.id
      )
      SELECT CASE WHEN t.n = 0 THEN 'None changed'
                  ELSE printf('%d changed · tests %d → %d · assertions %d → %d · skips %d → %d',
                              t.n, t.tb, t.ta, t.ab, t.aa, t.sb, t.sa) END AS test_files,
             CASE WHEN t.aa < t.ab OR t.sa > t.sb OR t.ta < t.tb THEN 'warning' END AS test_files_tone,
             CASE WHEN s.high + s.medium = 0 THEN 'None'
                  ELSE trim(CASE WHEN s.high > 0 THEN printf('%d high', s.high) ELSE '' END
                            || CASE WHEN s.high > 0 AND s.medium > 0 THEN ' · ' ELSE '' END
                            || CASE WHEN s.medium > 0 THEN printf('%d medium', s.medium) ELSE '' END) END AS weakened,
             CASE WHEN s.high > 0 THEN 'danger' WHEN s.medium > 0 THEN 'warning' END AS weakened_tone,
             CASE WHEN r.kind <> 'request' THEN 'Only a request has runs'
                  WHEN r.latest IS NULL THEN 'None seen'
                  ELSE 'Latest: ' || r.latest || CASE WHEN r.n > 1 THEN printf(' · %d runs', r.n) ELSE '' END END AS runs,
             CASE WHEN r.kind = 'request' AND r.latest IS NULL THEN 'warning'
                  WHEN r.failed > 0 THEN 'danger' END AS runs_tone,
             CASE WHEN r.kind <> 'request' THEN 'Only a request has coverage'
                  WHEN NOT r.covered THEN 'No coverage report'
                  WHEN s.uncovered = 0 THEN 'None'
                  ELSE printf('Changed lines in %d file%s ran in no test', s.uncovered,
                              CASE s.uncovered WHEN 1 THEN '' ELSE 's' END) END AS uncovered,
             CASE WHEN s.uncovered > 0 THEN 'warning' END AS uncovered_tone
      FROM t, s, r
  code_summary:
    sql: |
      -- What the change did to its code, in four facts: enough to tell
      -- whether to open the Code page.
      WITH f AS (
        SELECT count(*) FILTER (WHERE status = 'added') AS added,
               count(*) FILTER (WHERE status = 'modified') AS changed,
               count(*) FILTER (WHERE status = 'deleted') AS removed,
               count(*) FILTER (WHERE complexity_delta > 0) AS grew
        FROM v_change_function WHERE change_id = CAST(:change_id AS INTEGER) AND is_test = 0
      ),
      s AS (
        SELECT count(*) FILTER (WHERE signal = 'signature-changed') AS signatures,
               count(*) FILTER (WHERE signal = 'public-removed') AS removed,
               count(*) FILTER (WHERE source = 'oxplow/review_signal_duplication') AS copies
        FROM v_oxplow_review_signal_shown WHERE change_id = CAST(:change_id AS INTEGER)
          AND source IN ('oxplow/review_signal_api', 'oxplow/review_signal_duplication')
      )
      SELECT CASE WHEN f.added + f.changed + f.removed = 0 THEN 'None changed'
                  ELSE trim(CASE WHEN f.added > 0 THEN printf('%d added · ', f.added) ELSE '' END
                            || CASE WHEN f.changed > 0 THEN printf('%d changed · ', f.changed) ELSE '' END
                            || CASE WHEN f.removed > 0 THEN printf('%d removed · ', f.removed) ELSE '' END, ' ·') END AS functions,
             CASE WHEN f.grew = 0 THEN 'No function got more complex'
                  ELSE printf('%d got more complex; the most is %s', f.grew,
                         (SELECT printf('`%s` +%d', CASE WHEN x.container <> '' THEN x.container || '::' ELSE '' END || x.name, x.complexity_delta)
                          FROM v_change_function x
                          WHERE x.change_id = CAST(:change_id AS INTEGER) AND x.is_test = 0 AND x.complexity_delta > 0
                          ORDER BY x.complexity_delta DESC, x.path, x.start_line LIMIT 1)) END AS complexity,
             CASE WHEN f.grew > 0 THEN 'warning' END AS complexity_tone,
             CASE WHEN s.signatures + s.removed = 0 THEN 'None'
                  ELSE trim(CASE WHEN s.signatures > 0 THEN printf('%d signature%s changed · ', s.signatures, CASE s.signatures WHEN 1 THEN '' ELSE 's' END) ELSE '' END
                            || CASE WHEN s.removed > 0 THEN printf('%d removed · ', s.removed) ELSE '' END, ' ·') END AS api,
             CASE WHEN s.signatures + s.removed > 0 THEN 'warning' END AS api_tone,
             CASE WHEN s.copies = 0 THEN 'None'
                  ELSE printf('%d block%s on changed lines repeat%s other code', s.copies,
                              CASE s.copies WHEN 1 THEN '' ELSE 's' END, CASE s.copies WHEN 1 THEN 's' ELSE '' END) END AS duplicates
      FROM f, s
rail:
  title: About
  from: change
  viz: detail
  columns:
  - { key: what, label: What }
  - { key: size, label: Size }
  - { key: analysis, label: Analysis }
  - { key: analysed, label: Files analysed }
  - { key: checks, label: Checks }
  - { key: packs_off, label: Packs off, format: markdown }
view:
  stack:
  - id: asked
    title: Asked
    description: What the change was asked to do. Judge the change against it, not only on its own.
    from: change
    viz: markdown
    markdown: { text: asked }
  - id: look-here
    title: Look Here
    description: The files with a high or medium signal, worst first, then by how much each changed. Open a row for each signal and its line.
    from: look_here
    viz: table
    edge: tone
    columns:
    - key: file
      label: File
      link: { kind: diff-at, from: path, base: base_revision, head: head_revision }
      expand: change-review-file
    - { key: signals_all, label: Signals, format: items }
    empty: No file has a high or medium signal.
  - id: tests
    title: Tests
    description: What the change did to its tests and what checked it. The arrow opens the Tests page.
    from: tests_summary
    viz: detail
    link: change-review-tests
    columns:
    - { key: test_files, label: Test files, tone: test_files_tone }
    - { key: weakened, label: Weakened, tone: weakened_tone }
    - { key: runs, label: Runs, tone: runs_tone }
    - { key: uncovered, label: Uncovered, tone: uncovered_tone }
  - id: code
    title: Code
    description: What the change did to its functions, its public API and its copies of other code. The arrow opens the Code page.
    from: code_summary
    viz: detail
    link: change-review-code
    columns:
    - { key: functions, label: Functions }
    - { key: complexity, label: Complexity, tone: complexity_tone, format: markdown }
    - { key: api, label: Public API, tone: api_tone }
    - { key: duplicates, label: Duplicates }
  - id: by-area
    title: By Area
    description: How many signals each area gave. `info` signals are context; they are listed under their file, not in Look Here. The arrow opens every signal on one page.
    from: by_area
    viz: table
    link: change-review-signals
    columns:
    - key: area
      label: Area
      link: { kind: page, from: signals }
    - { key: high, label: High }
    - { key: medium, label: Medium }
    - { key: info, label: Info }
    empty: No signals.
  - slot: sections
