title: Review
description: What to look at in one analysed change, worst first. Every review signal (oxplow-bundled's and other extensions') on one list, grouped by file, beside what the change was asked to do.
label: Review
params:
- name: change_id
  label: Change
answers:
- {"question":"What should I look at first in this change?","params":{"change_id":1}}
- {"question":"Did the agent weaken any tests?","params":{"change_id":1}}
loaders:
  change:
    sql: |
      -- What the change was asked to do, from what made it: a request's or a
      -- turn's prompt, a commit's message.
      WITH f AS (
        SELECT count(*) AS n, coalesce(sum(additions), 0) AS a, coalesce(sum(deletions), 0) AS d
        FROM v_change_file WHERE change_id = CAST(:change_id AS INTEGER)
      )
      SELECT c.id AS change_id, c.kind, c.status,
             -- Until the analysis is done, the lists below are not yet
             -- complete: say so first.
             CASE c.status WHEN 'done' THEN ''
                           WHEN 'failed' THEN '_The analysis of this change failed, so the lists below are empty: ' || coalesce(c.error, 'unknown error') || '._' || char(10, 10)
                           ELSE '_Analyzing this change: the lists below are not complete yet._' || char(10, 10) END
             || coalesce(CASE c.kind
               WHEN 'request' THEN (SELECT r.prompt FROM v_request r WHERE r.id = CAST(c.target AS INTEGER))
               WHEN 'turn' THEN (SELECT t.prompt FROM v_agent_turn t WHERE t.id = CAST(c.target AS INTEGER))
               WHEN 'commit' THEN (SELECT m.subject || CASE WHEN m.body = '' THEN '' ELSE char(10, 10) || m.body END
                                   FROM v_commit m WHERE m.sha = c.target)
               WHEN 'working' THEN 'The uncommitted changes in the stream''s worktree. No request is attached to them.'
             END, 'Nothing says what this change was for.') AS asked,
             CASE c.kind WHEN 'request' THEN 'A request' WHEN 'turn' THEN 'A turn' WHEN 'commit' THEN 'A commit'
                         WHEN 'working' THEN 'Uncommitted changes' ELSE 'A range' END AS what,
             printf('%d file%s · +%d −%d', f.n, CASE f.n WHEN 1 THEN '' ELSE 's' END, f.a, f.d) AS size,
             CASE c.status WHEN 'failed' THEN 'Failed: ' || coalesce(c.error, 'unknown error')
                           WHEN 'done' THEN 'Done' ELSE 'Analyzing…' END AS analysis,
             -- A change of more files than the analysis reads (200) reads the
             -- files the languages parse first; say how many it read.
             CASE WHEN c.analyzed_files IS NOT NULL THEN
               printf('%d of %d file%s analysed', c.analyzed_files, c.changed_files,
                      CASE c.changed_files WHEN 1 THEN '' ELSE 's' END)
               || CASE WHEN c.analyzed_files < c.changed_files THEN ' (source files first)' ELSE '' END
             END AS analysed,
             c.base_revision, c.head_revision,
             -- Where its checks (collectors on `change.analyzed`) stand.
             (SELECT CASE WHEN count(*) = 0 THEN 'None ran'
                          WHEN sum(state <> 'ok') = 0 THEN 'Done'
                          ELSE trim(
                            CASE WHEN sum(state = 'pending') > 0 THEN printf('%d running ', sum(state = 'pending')) ELSE '' END
                            || CASE WHEN sum(state = 'failed') > 0 THEN printf('%d failed ', sum(state = 'failed')) ELSE '' END
                            || CASE WHEN sum(state = 'off') > 0 THEN printf('%d off', sum(state = 'off')) ELSE '' END)
                     END
              FROM v_oxplow_review_check k WHERE k.change_id = c.id) AS checks,
             -- The languages of its files whose pack is off: their files get
             -- no symbols, lint findings or code signals.
             (SELECT group_concat(title || ' ([turn on](oxplow:oxplow/extension?name=' || extension || '))', ', ')
              FROM (SELECT DISTINCT l.title, l.extension
                    FROM v_language l, json_each(l.extensions) e
                    WHERE l.enabled = 0 AND l.analyzable = 1
                      AND EXISTS (SELECT 1 FROM v_change_file cf
                                  WHERE cf.change_id = c.id AND lower(cf.path) LIKE '%.' || e.value)
                    ORDER BY l.title)) AS packs_off
      FROM v_change c, f WHERE c.id = CAST(:change_id AS INTEGER)
  look_here:
    sql: |
      -- One row per file with a `high` or `medium` signal: worst first,
      -- then by the file's look-here-first score. A signal about the whole
      -- change (no file) is its own row. Five signals per file at most; the
      -- row's expansion lists them all.
      WITH s AS (
        SELECT *, CASE severity WHEN 'high' THEN 1 WHEN 'medium' THEN 2 ELSE 3 END AS rank,
               row_number() OVER (PARTITION BY path
                                  ORDER BY CASE severity WHEN 'high' THEN 1 WHEN 'medium' THEN 2 ELSE 3 END, line, title) AS nth
        FROM v_oxplow_review_signal_shown WHERE change_id = CAST(:change_id AS INTEGER)
      ),
      f AS (
        SELECT path, min(rank) AS rank,
               json_group_array(json_object('text', title, 'hint', why))
                 FILTER (WHERE rank <= 2 AND nth <= 5) AS signals,
               count(*) FILTER (WHERE rank <= 2) AS n
        FROM s GROUP BY path
      )
      SELECT f.path, coalesce(f.path, 'The whole change') AS file,
             CASE WHEN f.n > 5
                  THEN json_insert(f.signals, '$[#]', json_object('text', printf('%d more', f.n - 5), 'hint', 'Open the row for all of them.'))
                  ELSE f.signals END AS signals_all,
             CASE f.rank WHEN 1 THEN 'high' ELSE 'medium' END AS severity,
             CASE f.rank WHEN 1 THEN 'danger' ELSE 'warning' END AS tone,
             c.id AS change_id, c.base_revision, c.head_revision
      FROM f JOIN v_change c ON c.id = CAST(:change_id AS INTEGER)
      LEFT JOIN v_oxplow_change_interest i ON i.change_id = CAST(:change_id AS INTEGER) AND i.path = f.path
      WHERE f.rank <= 2
      ORDER BY f.rank, coalesce(i.interest, 0) DESC, f.path
  all_signals:
    sql: |
      SELECT '[All signals](' || uri('oxplow/page', 'page', 'change-review-signals', 'change_id', CAST(:change_id AS INTEGER)) || ') · '
             || '[Tests](' || uri('oxplow/page', 'page', 'change-review-tests', 'change_id', CAST(:change_id AS INTEGER)) || ') · '
             || '[Code](' || uri('oxplow/page', 'page', 'change-review-code', 'change_id', CAST(:change_id AS INTEGER)) || ')' AS text
  by_area:
    sql: |
      -- `signals` opens the Signals page narrowed to the area; `more` opens
      -- the page that goes deeper into it (Tests, Code), if there is one.
      SELECT area,
             count(*) FILTER (WHERE severity = 'high') AS high,
             count(*) FILTER (WHERE severity = 'medium') AS medium,
             count(*) FILTER (WHERE severity = 'info') AS info,
             uri('oxplow/page', 'page', 'change-review-signals', 'change_id', CAST(:change_id AS INTEGER)) || '#area=' || area AS signals,
             CASE WHEN area IN ('tests', 'verification') THEN uri('oxplow/page', 'page', 'change-review-tests', 'change_id', CAST(:change_id AS INTEGER))
                  WHEN area = 'code' THEN uri('oxplow/page', 'page', 'change-review-code', 'change_id', CAST(:change_id AS INTEGER)) END AS more,
             CASE WHEN area IN ('tests', 'verification') THEN 'Tests' WHEN area = 'code' THEN 'Code' END AS more_label
      FROM v_oxplow_review_signal_shown WHERE change_id = CAST(:change_id AS INTEGER)
      GROUP BY area
      ORDER BY CASE area WHEN 'tests' THEN 1 WHEN 'verification' THEN 2 WHEN 'dependencies' THEN 3
                         WHEN 'code' THEN 4 WHEN 'scope' THEN 5 WHEN 'history' THEN 6 ELSE 7 END, area
rail:
  title: About
  from: change
  viz: detail
  columns:
  - { key: what, label: What }
  - { key: size, label: Size }
  - { key: analysis, label: Analysis }
  - { key: analysed, label: Files analysed }
  - { key: checks, label: Checks }
  - { key: packs_off, label: Packs off, format: markdown }
view:
  stack:
  - id: asked
    title: Asked
    description: What the change was asked to do. Judge the change against it, not only on its own.
    from: change
    viz: markdown
    markdown: { text: asked }
  - id: look-here
    title: Look Here
    description: The files with a high or medium signal, worst first, then by how much each changed. Open a row for each signal and its line.
    from: look_here
    viz: table
    columns:
    - key: file
      label: File
      link: { kind: diff-at, from: path, base: base_revision, head: head_revision }
      expand: change-review-file
    - { key: severity, label: Severity, format: badge, tone: tone }
    - { key: signals_all, label: Why, format: items }
    empty: No file has a high or medium signal.
  - id: by-area
    title: By Area
    description: How many signals each area gave. `info` signals are context; they are listed under their file, not in Look Here.
    from: by_area
    viz: table
    columns:
    - key: area
      label: Area
      link: { kind: page, from: signals }
    - { key: high, label: High }
    - { key: medium, label: Medium }
    - { key: info, label: Info }
    - key: more_label
      label: Details
      link: { kind: page, from: more }
    empty: No signals.
  - id: pages
    title: Go Deeper
    description: Every signal in one table, and the pages for what the change did to its tests and its code.
    from: all_signals
    viz: markdown
    markdown: { text: text }
  - slot: sections
