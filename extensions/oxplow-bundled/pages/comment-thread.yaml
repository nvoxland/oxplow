title: "Comment thread"
description: "What has been said in a comment thread."
params:
- name: comment
  default: ""
answers:
- {"question":"What has been said in this comment thread?","params":{"comment":"oxplow:oxplow/comment?id=cmt1"},"skill":"oxplow-extension"}
