title: History Graph
description: The stream's commits as a graph — a lane per line of descent, a dot per commit — with branch and tag labels. It stands in for oxplow's plain commit list on Git History.
hidden: true
params:
- name: stream_id
  label: Stream
- name: head_sha
  label: Head commit
- name: reveal_sha
  role: filter
  label: Commit to reveal
  default: ''
- name: limit
  role: filter
  label: Commits
  default: 500
data:
  history_graph:
    sql: |
      WITH RECURSIVE reach(sha) AS (
        SELECT :head_sha
        UNION
        SELECT p.value FROM reach
          JOIN v_commit c ON c.sha = reach.sha, json_each(c.parents) p
      )
      SELECT c.sha, c.author, c.email, c.committed_at, c.subject, c.parents,
             (SELECT json_group_array(b.name) FROM v_branch b
               WHERE b.kind = 'local' AND b.head_sha = c.sha) AS branches,
             (SELECT json_group_array(t.name) FROM v_tag t WHERE t.sha = c.sha) AS tags,
             (SELECT b.name FROM v_branch b
               WHERE b.kind = 'local' AND b.stream_id = :stream_id LIMIT 1) AS current_branch
      FROM v_commit c JOIN reach USING (sha)
      ORDER BY c.committed_at DESC, c.sha
      LIMIT :limit
view:
  from: history_graph
  viz: custom
  custom:
    component: history-graph
