title: New Item
description: "The form for a new item on the active work list - its title, description, starting state, who it's for (nobody unless picked) and the list's own fields."
icon: plus
needs:
- work_items
params:
- name: thread_id
- name: parent
loaders:
  new_task:
    sql: |
      SELECT 'todo' AS state, :parent AS parent_uri
  new_task_parents:
    sql: |
      SELECT w.uri AS value, w.title AS label
      FROM v_work_item w
      WHERE w.state NOT IN ('done', 'canceled')
        AND EXISTS (SELECT 1 FROM v_capability_provider p
                    WHERE p.capability = 'work_items' AND p.active = 1
                      AND json_extract(p.features, '$.hierarchy') = 1)
        AND EXISTS (SELECT 1 FROM v_work_item c WHERE c.parent_uri = w.uri)
      ORDER BY w.assignee IS NOT (SELECT uri FROM v_thread WHERE id = :thread_id), w.title
  new_task_states:
    sql: |
      SELECT 'todo' AS value, 'To Do' AS label
      UNION ALL
      SELECT 'backlog', 'Backlog'
      UNION ALL
      SELECT 'blocked', 'Blocked'
  # Who it's for: nobody (the default: any thread may take it), you, or an
  # open thread.
  new_task_assignees:
    sql: |
      SELECT uri('oxplow/person') AS value, 'Me' AS label, NULL AS "group"
      UNION ALL
      SELECT * FROM (
        SELECT t.uri, t.title, s.title
        FROM v_thread t
        JOIN v_stream s ON s.id = t.stream_id
        WHERE t.closed_at IS NULL AND t.archived_at IS NULL AND s.archived_at IS NULL
        ORDER BY s.kind <> 'primary', s.title, t.sort_index, t.id)
view:
  from: new_task
  viz: form
  form:
    command: oxplow.work_item.new
    then: replace
    fields:
    - title
    - body
    - state
    - assignee
    - parent_uri
    - name: native
      from: oxplow/work-item-fields
    choices:
      state: oxplow/new-task#new_task_states
      assignee: oxplow/new-task#new_task_assignees
      parent_uri: oxplow/new-task#new_task_parents
    again:
      label: Save and Another
      keep:
      - state
      - assignee
      - parent_uri
      - native
