title: Planning
description: What's ready to pick up, what's parked in the backlog, and the notes that changed lately.
category: Work
loaders:
  ready_tasks:
    sql: |
      SELECT w.uri, w.title, th.title AS thread
      FROM v_work_item w JOIN v_thread th ON th.id = w.thread_id
      WHERE w.state = 'todo'
      ORDER BY th.sort_index, w.rank IS NULL, w.rank, w.created_at
      LIMIT 50
  backlog_tasks:
    sql: |
      SELECT uri, title
      FROM v_work_item
      WHERE thread_id IS NULL AND state = 'todo'
      ORDER BY rank IS NULL, rank, created_at
      LIMIT 50
  recent_notes:
    sql: |
      SELECT slug, title, updated_at FROM v_wiki_page ORDER BY updated_at DESC LIMIT 10
view:
  stack:
  - id: ready-tasks
    title: Ready
    from: ready_tasks
    viz: table
    columns:
    - key: title
      label: Item
      link:
        kind: page
        from: uri
    - key: thread
      label: Thread
    empty: Nothing is ready.
  - id: backlog-tasks
    title: Backlog
    from: backlog_tasks
    viz: table
    columns:
    - key: title
      label: Item
      link:
        kind: page
        from: uri
    empty: The backlog is empty.
  - id: recent-notes
    title: Recent Notes
    from: recent_notes
    viz: table
    columns:
    - key: title
      label: Note
      link:
        kind: wiki
        from: slug
    - key: updated_at
      label: Updated
    empty: No notes yet.
