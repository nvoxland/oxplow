title: Hand Off Work
description: Hand work to another open thread, any stream's. Its agent gets it at the start of its next prompt, and nothing wakes it. Taking it moves the work item there.
params:
- name: uri
  label: From thread
loaders:
  handoff_recipients:
    sql: |
      SELECT uri_param(t.uri, 'id') AS value, t.title AS label, s.title AS "group"
      FROM v_thread t
      JOIN v_stream s ON s.id = t.stream_id
      WHERE t.closed_at IS NULL AND t.archived_at IS NULL AND s.archived_at IS NULL
        AND t.uri IS NOT :uri
      ORDER BY s.kind <> 'primary', s.title, t.sort_index, t.id
  handoff_items:
    sql: |
      SELECT w.uri AS value, w.title AS label
      FROM v_work_item w
      JOIN v_thread t ON t.id = w.thread_id
      WHERE t.uri = :uri AND w.state NOT IN ('done', 'canceled')
      ORDER BY w.rank, w.uri
view:
  viz: form
  form:
    command: oxplow.handoff.send
    defaults:
      from_thread: '{{param.uri.id}}'
    fixed:
    - from_thread
    fields:
    - from_thread
    - to_thread
    - work_item
    - body
    choices:
      to_thread: oxplow-bundled/hand-off#handoff_recipients
      work_item: oxplow-bundled/hand-off#handoff_items
