title: Context Read
description: "The project docs the agent read during this effort."
hidden: true
params:
- name: effort_id
  label: Effort
loaders:
  context_read:
    sql: |
      SELECT DISTINCT path
      FROM v_context_read
      WHERE effort_id = :effort_id
      ORDER BY path
view:
  from: context_read
  viz: list
  columns:
  - key: path
    label: Doc
    link:
      kind: file
  empty: The agent read no project docs during this effort.
