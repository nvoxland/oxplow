title: Metric groups
description: A metric's biggest groups under the dimension the list is sliced by, each with its trend and latest value.
hidden: true
params:
- name: key
- name: unit
  default: ''
- name: slice
  default: ''
- name: range
  type: date_range
  role: filter
  default: 7d
  presets:
  - 1d
  - 7d
  - 30d
  - all
- name: branch
  type: branch
  role: filter
answers:
- {"question":"What is this metric's latest value in each group of a dimension?","about":"oxplow/metric","params":{"key":"oxplow.coverage.abs_pct","slice":"oxplow.language"},"skill":"oxplow-metrics"}
loaders:
  metrics_slices:
    sql: |
      WITH pts AS (
        SELECT p.group_value, p.captured_at, p.value FROM v_metric_point p
        WHERE p.metric = :key AND p.dimension = :slice AND p.group_value IS NOT NULL
          AND (:branch IS NULL OR p.branch = :branch)
          AND (:range_from IS NULL OR p.captured_at >= :range_from)
          AND (:range_to IS NULL OR p.captured_at <= :range_to)
      ), g AS (
        SELECT d.group_value,
               (SELECT t.value FROM pts t WHERE t.group_value = d.group_value ORDER BY t.captured_at DESC LIMIT 1) AS latest,
               (SELECT json_group_array(t.value) FROM (SELECT value FROM pts WHERE group_value = d.group_value ORDER BY captured_at) t) AS trend
        FROM (SELECT DISTINCT group_value FROM pts) d
      ), ranked AS (
        SELECT g.*, row_number() OVER (ORDER BY latest DESC, group_value) AS n, count(*) OVER () AS total FROM g
      )
      SELECT group_value AS title, trend, latest, nullif(:unit, '') AS unit FROM ranked WHERE n <= 3
      UNION ALL
      SELECT '+ ' || (total - 3) || ' more', NULL, NULL, NULL FROM ranked WHERE n = 4
view:
  from: metrics_slices
  viz: list
  columns:
  - key: title
    label: Group
  - key: trend
    label: Trend
    format: sparkline
    width: 150
  - key: latest
    label: Latest
    unit: unit
    width: 140
  empty: Not sliced. Pick a Slice by this metric has, in the filters.
