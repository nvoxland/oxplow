title: Task List
description: "The work items in one state, on a thread, its stream, everything or the backlog, with epics over their children and the finished ones latest first, and a quick add."
icon: check-square
category: Work
keywords: work items list backlog history done finished in progress
needs:
- work_items
params:
- name: show
  type: choice
  role: filter
  label: Show
  default: thread
  options:
  - { value: thread, label: This thread }
  - { value: stream, label: This stream }
  - { value: all, label: Everywhere }
  - { value: backlog, label: Backlog }
- name: state
  type: choice
  role: filter
  label: State
  default: todo
  options:
  - { value: todo, label: To do }
  - { value: in_progress, label: In progress }
  - { value: blocked, label: Blocked }
  - { value: done, label: Done }
  - { value: canceled, label: Canceled }
- name: priority
  type: choice
  role: filter
  label: Priority
  default: any
  options:
  - { value: any, label: Any }
  - { value: urgent, label: Urgent }
  - { value: high, label: High }
  - { value: medium, label: Medium }
  - { value: low, label: Low }
- name: q
  type: search
  role: filter
  label: Search
- name: thread_id
- name: stream_id
answers:
- {"question":"What work is in progress, across every provider?","params":{"show":"all","state":"in_progress"},"skill":"work-items"}
- {"question":"What is in the backlog?","params":{"show":"backlog"},"skill":"work-items"}
- {"question":"What has this thread finished?","params":{"show":"thread","state":"done","thread_id":1},"skill":"work-items"}
loaders:
  # The scope (with no thread, "this thread" is everything) and the form a
  # new item is filed with.
  row:
    sql: |
      SELECT CASE WHEN :show = 'thread' AND :thread_id IS NULL THEN 'all' ELSE :show END AS scope,
             uri('oxplow/page', 'page', 'new-task') AS new_task
    columns:
    - key: scope
  # What the quick add files: To Do (Blocked while the list shows blocked
  # items) on this thread, or in the backlog while it shows the backlog.
  new_item:
    sql: |
      SELECT CASE :state WHEN 'blocked' THEN 'blocked' ELSE 'todo' END AS state,
             CASE WHEN :scope = 'backlog' THEN NULL ELSE 'thr' || :thread_id END AS thread
    params:
      scope:
        from: row.scope
  items:
    page: oxplow/work-items
    loader: items
    params:
      show: { from: row.scope }
      state: { param: state }
      priority: { param: priority }
      q: { param: q }
      thread_id: { param: thread_id }
      stream_id: { param: stream_id }
  list:
    sql: |
      SELECT i.*,
             CASE WHEN :scope <> 'thread' THEN i.thread END AS thread_shown
      FROM items i
      ORDER BY i.ord
    params:
      scope:
        from: row.scope
actions:
- { id: new, label: New Task…, open: new_task, prominent: true, icon: plus }
# The quick add sits in the rail (Details), above the filters.
rail:
  id: add
  title: New item
  from: new_item
  viz: form
  form:
    command: oxplow.work_item.create
    then: stay
    fields: [title]
view:
  id: list
  replaceable: work_item.list
  title: Task List
  from: list
  viz: list
  depth: depth
  # An urgent or high item's coloured bar, as on the board's cards.
  edge: prio_tone
  columns:
  - key: title
    label: Item
    link:
      kind: page
      from: uri
  - key: summary
    label: Description
  - key: thread_shown
    label: Thread
  - key: closed_at
    label: Closed
    format: relative
  empty: Nothing here in this state. Add one under New item.
  actions:
  - id: reorder
    label: Reorder
    command: oxplow.work_item.reorder
    row: true
    drag: true
    when: can_order
    input:
      uri: '{{row.uri}}'
      before: '{{before.uri}}'
  - id: nest
    label: Nest under
    command: oxplow.work_item.update
    row: true
    drag: true
    when: can_nest
    input:
      uri: '{{row.uri}}'
      parent_uri: '{{onto.uri}}'
  - id: to-todo
    label: Mark To Do
    command: oxplow.work_item.transition
    row: true
    bulk: true
    key: r
    when: not_todo
    input:
      uri: '{{row.uri}}'
      to: todo
  - id: to-in-progress
    label: Mark In Progress
    command: oxplow.work_item.transition
    row: true
    bulk: true
    key: i
    when: not_in_progress
    input:
      uri: '{{row.uri}}'
      to: in_progress
  - id: to-blocked
    label: Mark Blocked
    command: oxplow.work_item.transition
    row: true
    bulk: true
    key: b
    when: not_blocked
    input:
      uri: '{{row.uri}}'
      to: blocked
  - id: to-done
    label: Mark Done
    command: oxplow.work_item.transition
    row: true
    bulk: true
    key: d
    when: not_done
    input:
      uri: '{{row.uri}}'
      to: done
  - id: to-canceled
    label: Mark Canceled
    command: oxplow.work_item.transition
    row: true
    bulk: true
    when: not_canceled
    input:
      uri: '{{row.uri}}'
      to: canceled
  - id: priority-urgent
    label: Priority Urgent
    command: oxplow.work_item.update
    row: true
    bulk: true
    when: can_prioritize
    input:
      uri: '{{row.uri}}'
      native:
        priority: urgent
  - id: priority-high
    label: Priority High
    command: oxplow.work_item.update
    row: true
    bulk: true
    when: can_prioritize
    input:
      uri: '{{row.uri}}'
      native:
        priority: high
  - id: priority-medium
    label: Priority Medium
    command: oxplow.work_item.update
    row: true
    bulk: true
    when: can_prioritize
    input:
      uri: '{{row.uri}}'
      native:
        priority: medium
  - id: priority-low
    label: Priority Low
    command: oxplow.work_item.update
    row: true
    bulk: true
    when: can_prioritize
    input:
      uri: '{{row.uri}}'
      native:
        priority: low
  - id: unparent
    label: Make top-level
    command: oxplow.work_item.update
    row: true
    bulk: true
    when: has_parent
    input:
      uri: '{{row.uri}}'
      parent_uri: ''
  - id: shelve
    label: Send to backlog
    command: oxplow.work_item.move
    row: true
    bulk: true
    when: can_shelve
    input:
      uri: '{{row.uri}}'
      to: backlog
  - id: bring
    label: Bring to this thread
    command: oxplow.work_item.move
    row: true
    bulk: true
    when: can_bring
    input:
      uri: '{{row.uri}}'
      to:
        thread: '{{row.thread_ref}}'
  - id: delete
    label: Delete
    command: oxplow.work_item.delete
    row: true
    bulk: true
    when: can_delete
    input:
      uri: '{{row.uri}}'
