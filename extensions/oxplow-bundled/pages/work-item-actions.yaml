title: Work item actions
description: "One work item's moves, for an agent: Mark done, or Record a block on another item."
needs:
- work_items
params:
- name: uri
  label: Work item
answers:
- {"question":"Mark a work item done.","about":"oxplow/work_item","params":{"uri":"oxplow:oxplow/work_item?id=tsk1&provider=oxplow"},"skill":"work-items"}
- {"question":"Record that one work item blocks another.","about":"oxplow/work_item","params":{"uri":"oxplow:oxplow/work_item?id=tsk1&provider=oxplow"},"skill":"work-items"}
loaders:
  item:
    sql: |
      SELECT w.uri, w.title, coalesce(w.stage_title, w.stage) AS stage_title, w.state AS icon
      FROM v_work_item w WHERE w.uri = :uri
actions:
- id: done
  label: Mark done
  command: oxplow.work_item.transition
  input:
    uri: '{{param.uri}}'
    to: done
- id: blocks
  label: Record a block…
  command: oxplow.work_item.link
  form: true
  fixed:
  - uri
  - link_type
  input:
    uri: '{{param.uri}}'
    link_type: blocks
view:
  id: item
  from: item
  viz: detail
  columns:
  - key: title
    label: Item
    link:
      kind: page
      from: uri
  - key: stage_title
    label: Stage
    icon: icon
  empty: This work item isn't on the active work list.
