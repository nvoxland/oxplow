title: Link Effort to Task
description: Link an effort to one of the open tasks, or take its link away.
needs:
- task_tracker
params:
- name: uri
  label: Effort
loaders:
  changes_link_items:
    sql: |
      SELECT w.uri AS value, w.title AS label
      FROM v_task w WHERE w.state NOT IN ('done', 'canceled')
      ORDER BY w.updated_at DESC LIMIT 200
view:
  viz: form
  form:
    command: oxplow.effort.link
    defaults:
      effort: '{{param.uri.id}}'
    fixed:
    - effort
    fields:
    - task
    choices:
      task: oxplow/link-effort#changes_link_items
