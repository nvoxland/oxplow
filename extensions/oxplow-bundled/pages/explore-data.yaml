title: Explore Data
icon: database
category: Data
keywords: sql query schema semantic layer page
params:
- name: dataset
  label: Dataset
  default: ''
loaders:
  explore_catalog:
    sql: |
      -- One line each: the first sentence. The whole paragraph is the dataset's own page.
      SELECT view, owner, CASE WHEN instr(description, '. ') > 0 THEN substr(description, 1, instr(description, '. ')) ELSE description END AS description, view = :dataset AS current
      FROM v_dataset
      ORDER BY owner <> 'core', owner, view
view:
  component:
    id: explore-data
rail:
  id: explore-catalog
  from: explore_catalog
  viz: list
  emphasis: current
  columns:
  - key: view
    label: Dataset
    select: dataset
  - key: owner
    label: Owner
  - key: description
    label: Holds
  empty: No datasets are published.
