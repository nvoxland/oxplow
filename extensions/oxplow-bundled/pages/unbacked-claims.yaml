title: Unbacked Claims
description: Things your agents said about their work in this stream that nothing backs up (no evidence, or no passing latest test run), newest first.
category: Work
params:
- name: stream_id
  label: Stream
loaders:
  unbacked_claims:
    sql: |
      SELECT c.statement, c.kind, t.title AS thread, c.work_item, c.created_at
      FROM v_claim c
      JOIN v_thread t ON t.id = c.thread_id
      JOIN v_oxplow_bundled_claim_status s ON s.uri = c.uri
      WHERE t.stream_id = :stream_id AND s.verified = 0
      ORDER BY c.created_at DESC, c.id DESC
      LIMIT 100
view:
  from: unbacked_claims
  viz: table
  columns:
  - key: statement
    label: Claim
    link:
      kind: page
      from: work_item
  - key: kind
    label: Kind
  - key: thread
    label: Thread
  - key: created_at
    label: When
  empty: Every claim in this stream is backed (or none were made).
