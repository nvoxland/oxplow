title: Knowledge
description: The project's knowledge pages across every store that is on, newest change first (or oldest), and the stale ones.
icon: book-open
category: Knowledge
keywords: knowledge wiki notes pages oxwiki memory instructions
needs:
- model:oxplow/knowledge_record
params:
- name: filter
  type: search
  role: filter
  label: Search
  default: ''
# One store's pages, or every store's (`all`).
- name: store
  type: choice
  role: filter
  label: Store
  default: all
  options_from: '#store_options'
- name: order
  type: choice
  role: filter
  label: Order
  default: newest
  options:
  - { value: newest, label: Newest first }
  - { value: oldest, label: Oldest first }
# Which pages cite a file: for an agent that asks (the page itself needs none).
- name: path
  default: ''
answers:
- {"question":"Which knowledge pages are there, and which store keeps each?","params":{},"skill":"knowledge"}
- {"question":"Which knowledge pages cite files that changed since they were written?","params":{},"skill":"knowledge"}
- {"question":"Which knowledge pages talk about this file?","about":"oxplow/file","params":{"path":"src/lib.rs"},"skill":"knowledge"}
loaders:
  # The form a new page is written in; none while no store that oxplow
  # writes is on.
  row:
    sql: |
      SELECT uri('oxplow/page', 'page', 'new-knowledge-page') AS new_page
  # The store filter's choices: every store, then each one.
  store_options:
    sql: |
      SELECT 'all' AS value, 'All stores' AS label, 0 AS ord
      UNION ALL
      SELECT s.store, s.store, 1 FROM v_model_store s WHERE s.model = 'oxplow/knowledge_record'
      ORDER BY ord, label
  pages:
    sql: |
      SELECT p.uri, p.store, p.id, p.kind, p.title, p.updated_at, p.stale_ref_count
      FROM v_oxplow_knowledge_page p
      WHERE (:store = 'all' OR p.store = :store)
        AND (coalesce(:filter, '') = ''
             OR instr(lower(p.title), lower(:filter)) > 0
             OR instr(lower(p.body), lower(:filter)) > 0)
      ORDER BY CASE WHEN :order = 'oldest' THEN p.updated_at END ASC,
               CASE WHEN :order = 'oldest' THEN NULL ELSE p.updated_at END DESC,
               p.title
  stale_pages:
    sql: |
      SELECT p.uri, p.store, p.id, p.title, p.stale_ref_count,
             uri('oxplow/page', 'page', 'knowledge-freshness', 'store', p.store, 'id', p.id) AS freshness_uri
      FROM v_oxplow_knowledge_page p
      WHERE p.stale_ref_count > 0 AND (:store = 'all' OR p.store = :store)
      ORDER BY p.stale_ref_count DESC, p.title
  about_file:
    sql: |
      SELECT p.uri, p.title, p.store,
             CASE WHEN r.stale THEN 'changed since the page was written' ELSE 'current' END AS stale
      FROM v_oxplow_knowledge_ref r JOIN v_oxplow_knowledge_page p ON p.uri = r.page
      WHERE :path <> '' AND r.path = :path
      ORDER BY p.title
actions:
- { id: new, label: New page…, open: new_page, when: new_page, prominent: true, icon: plus }
view:
  stack:
  - id: pages
    title: Pages
    from: pages
    viz: table
    columns:
    - key: store
      label: Store
      width: 90
    - key: kind
      label: Kind
      width: 90
    - key: title
      label: Page
      link:
        kind: page
        from: uri
      highlight: filter
    - key: updated_at
      label: Modified
      format: relative
      width: 120
    empty: No pages yet. Add one with New page, or ask the agent to write down what it learns.
    actions:
    # A destructive action sits in the row's right-click menu, and the
    # command asks first.
    - id: delete
      label: Delete
      point: oxplow/knowledge.delete
      row: true
      context:
        uri: '{{row.uri}}'
  - id: stale_pages
    title: Stale pages
    description: Pages that cite a file which changed after the page was written or last verified.
    from: stale_pages
    viz: table
    columns:
    - key: title
      label: Page
      link:
        kind: page
        from: uri
    - key: store
      label: Store
      width: 90
    - key: stale_ref_count
      label: Changed files
      format: integer
      width: 110
    - key: freshness_uri
      label: Files
      link:
        kind: page
        from: freshness_uri
    empty: No page cites a file that has changed.
  - id: about_file
    title: Pages that cite the file
    from: about_file
    viz: table
    columns:
    - key: title
      label: Page
      link:
        kind: page
        from: uri
    - key: store
      label: Store
      width: 90
    - key: stale
      label: Changed since
      width: 110
    empty: Name a file in the path filter to see the pages that cite it.
