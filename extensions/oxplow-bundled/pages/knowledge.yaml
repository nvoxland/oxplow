title: Knowledge
description: The project's knowledge pages across every store that is on, newest change first, the stale ones, and what was read and written lately.
icon: book-open
category: Knowledge
keywords: knowledge wiki notes pages oxwiki memory instructions
needs:
- knowledge
params:
- name: filter
  role: filter
  label: Search titles + bodies
  default: ''
# Which pages cite a file: for an agent that asks (the page itself needs none).
- name: path
  default: ''
answers:
- {"question":"Which knowledge pages are there, and which store keeps each?","params":{},"skill":"oxplow-wiki-capture"}
- {"question":"Which knowledge pages cite files that changed since they were written?","params":{},"skill":"oxplow-wiki-capture"}
- {"question":"Which knowledge pages talk about this file?","about":"oxplow/file","params":{"path":"src/lib.rs"},"skill":"oxplow-wiki-capture"}
loaders:
  # The form a new page is written in; none while no store that oxplow
  # writes is on.
  row:
    sql: |
      SELECT CASE WHEN EXISTS (SELECT 1 FROM v_capability_provider p
                               WHERE p.capability = 'knowledge' AND p.active = 1
                                 AND json_extract(p.features, '$.edit') = 1)
                  THEN uri('oxplow/page', 'page', 'new-knowledge-page') END AS new_page
  # Every store the project declares, on or off, with its pages.
  stores:
    sql: |
      SELECT s.provider AS store,
             CASE WHEN s.active = 1 THEN 'On' ELSE 'Off' END AS status,
             (SELECT group_concat(json_extract(k.value, '$.title'), ', ') FROM json_each(s.kinds) k) AS kinds,
             (SELECT count(*) FROM v_knowledge_page p WHERE p.store = s.provider) AS page_count,
             (SELECT count(*) FROM v_knowledge_page p WHERE p.store = s.provider AND p.stale_ref_count > 0) AS stale,
             CASE WHEN NOT EXISTS (SELECT 1 FROM v_capability_provider a WHERE a.capability = 'knowledge' AND a.active = 1)
                  THEN 'No knowledge store is on. Turn oxwiki on in Settings → Integrations, or enable an extension''s store.' END AS notice
      FROM v_capability_provider s
      WHERE s.capability = 'knowledge'
      ORDER BY s.provider
  # Whether a row's store lets oxplow write it: Delete is offered then.
  pages:
    sql: |
      SELECT p.uri, p.store, p.id, p.kind, p.title, p.read_count, p.updated_at, p.stale_ref_count,
             CASE WHEN :filter = '' THEN p.excerpt
                  WHEN instr(lower(b.body), lower(:filter)) = 0 THEN p.excerpt
                  ELSE replace(substr(b.body, max(1, instr(lower(b.body), lower(:filter)) - 40), 120), char(10), ' ') END AS snippet,
             coalesce((SELECT json_extract(s.features, '$.edit') FROM v_capability_provider s
                       WHERE s.capability = 'knowledge' AND s.provider = p.store), 0) AS can_edit
      FROM v_knowledge_page p
      JOIN v_knowledge_body b ON b.uri = p.uri
      WHERE :filter = ''
         OR instr(lower(p.title), lower(:filter)) > 0
         OR instr(lower(b.body), lower(:filter)) > 0
      ORDER BY p.updated_at DESC, p.title
  stale_pages:
    sql: |
      SELECT p.uri, p.store, p.id, p.title, p.stale_ref_count,
             uri('oxplow/page', 'page', 'knowledge-freshness', 'store', p.store, 'id', p.id) AS freshness_uri
      FROM v_knowledge_page p
      WHERE p.stale_ref_count > 0
      ORDER BY p.stale_ref_count DESC, p.title
  # The last twenty things that happened to a page: it was written, or an
  # agent read it.
  activity:
    sql: |
      SELECT * FROM (
        SELECT p.uri, p.id, p.title, 'Written' AS what, p.updated_at AS at, p.store AS who
        FROM v_knowledge_page p
        UNION ALL
        SELECT p.uri, p.id, p.title, 'Read', r.at, r.actor || ' (' || r.via || ')'
        FROM v_knowledge_read r JOIN v_knowledge_page p ON p.uri = r.uri)
      ORDER BY at DESC LIMIT 20
  about_file:
    sql: |
      SELECT p.uri, p.title, p.store, r.stale
      FROM v_knowledge_ref r JOIN v_knowledge_page p ON p.uri = r.page
      WHERE :path <> '' AND r.path = :path
      ORDER BY p.title
actions:
- { id: new, label: New page…, open: new_page, when: new_page, prominent: true, icon: plus }
view:
  stack:
  - id: stores
    title: Stores
    description: Where pages are kept. Several stores can be on at once; every page is recorded and tracked the same way whichever store keeps it.
    from: stores
    viz: table
    lead: notice
    columns:
    - key: store
      label: Store
    - key: status
      label: State
      width: 70
    - key: kinds
      label: Kinds of page
    - key: page_count
      label: Pages
      format: integer
      width: 80
    - key: stale
      label: Stale
      format: integer
      width: 80
    empty: No knowledge store is declared.
  - id: pages
    title: Pages
    from: pages
    viz: table
    columns:
    - key: store
      label: Store
      width: 90
    - key: kind
      label: Kind
      width: 90
    - key: title
      label: Page
      link:
        kind: page
        from: uri
      highlight: filter
    - key: snippet
      label: Text
      highlight: filter
    - key: read_count
      label: Reads
      format: integer
      width: 70
    - key: updated_at
      label: Modified
      format: relative
      width: 120
    empty: No pages yet. Add one with New page, or ask the agent to write down what it learns.
    actions:
    # A destructive action sits in the row's right-click menu, and the
    # command asks first.
    - id: delete
      label: Delete
      command: oxplow.knowledge.delete_page
      row: true
      when: can_edit
      input:
        store: '{{row.store}}'
        id: '{{row.id}}'
  - id: stale_pages
    title: Stale pages
    description: Pages that cite a file which changed after the page was written or last verified.
    from: stale_pages
    viz: table
    columns:
    - key: title
      label: Page
      link:
        kind: page
        from: uri
    - key: store
      label: Store
      width: 90
    - key: stale_ref_count
      label: Changed files
      format: integer
      width: 110
    - key: freshness_uri
      label: Files
      link:
        kind: page
        from: freshness_uri
    empty: No page cites a file that has changed.
  - id: activity
    title: Recent reads and writes
    from: activity
    viz: table
    columns:
    - key: title
      label: Page
      link:
        kind: page
        from: uri
    - key: what
      label: What
      width: 80
    - key: who
      label: By
    - key: at
      label: When
      format: relative
      width: 120
    empty: Nothing has been read or written yet.
  - id: about_file
    title: Pages that cite the file
    from: about_file
    viz: table
    columns:
    - key: title
      label: Page
      link:
        kind: page
        from: uri
    - key: store
      label: Store
      width: 90
    - key: stale
      label: Changed since
      width: 110
    empty: Name a file in the path filter to see the pages that cite it.
