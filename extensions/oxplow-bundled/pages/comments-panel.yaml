title: Comments
description: "The stream's open comments, for you and for the agent to act on."
hidden: true
params:
- name: stream_id
  label: Stream
loaders:
  comments:
    sql: |
      SELECT who, open, uri('oxplow/page', 'page', 'comments') AS inbox FROM (
        SELECT 'For me' AS who, 0 AS ord, count(*) AS open
        FROM v_comment WHERE stream_id = :stream_id AND status = 'open' AND intent <> 'followup'
        UNION ALL
        SELECT 'For the agent', 1, count(*)
        FROM v_comment WHERE stream_id = :stream_id AND status = 'open' AND intent = 'followup'
      )
      WHERE open > 0
      ORDER BY ord
view:
  from: comments
  viz: table
  columns:
  - key: who
    label: Who
    link:
      kind: page
      from: inbox
  - key: open
    label: Open
    link:
      kind: page
      from: inbox
  empty: No open comments
