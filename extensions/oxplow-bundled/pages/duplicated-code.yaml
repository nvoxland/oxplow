title: Duplicated Code
description: The blocks of code the stream's latest whole-tree duplicate scan found repeated elsewhere in the project, the biggest first, each with the copy it repeats.
icon: copy
category: Code
keywords: duplicate duplication copy paste clone quality
params:
- name: stream_id
answers:
- question: Which code is duplicated in this project?
- question: What are the biggest copied blocks, and where are their copies?
see_also:
- { page: oxplow/metric, params: { metric: oxplow.duplicate_lines } }
loaders:
  # The latest whole-tree scan (the `oxplow.duplicate_lines` collector, run
  # after the branch moves): its capture restates the tree, so its facts are
  # the project's duplicates now. A change's own scans are its Change
  # Analysis', not this page's.
  scan:
    sql: |
      SELECT c.id, c.captured_at,
             CASE WHEN c.snapshot_id IS NOT NULL THEN 'snap:' || c.snapshot_id
                  WHEN c.closest_vcs_rev IS NOT NULL THEN 'git:' || c.closest_vcs_rev END AS version
      FROM v_capture c
      WHERE c.producer = 'oxplow.duplicate_lines' AND c.status = 'done'
        AND (:stream_id IS NULL OR c.stream_id = :stream_id)
      ORDER BY c.captured_at DESC, c.id DESC
      LIMIT 1
  # Each fact is one side of a block, its `detail` the other side
  # (`path:start-end`); each pair is listed once, from the side that sorts first.
  blocks:
    sql: |
      WITH side AS (
        SELECT f.path, f.line AS start_line, CAST(f.value AS INTEGER) AS lines, f.detail,
               replace(f.detail, rtrim(f.detail, '0123456789-'), '') AS peer_range
        FROM v_fact f
        WHERE f.capture_id = (SELECT id FROM scan) AND f.measure_key = 'oxplow.duplicate_lines'
      ), pair AS (
        SELECT path, start_line, lines,
               substr(detail, 1, length(detail) - length(peer_range) - 1) AS peer,
               CAST(substr(peer_range, 1, instr(peer_range, '-') - 1) AS INTEGER) AS peer_line,
               peer_range
        FROM side
      )
      SELECT path, start_line, lines, peer, peer_line,
             path || ':' || start_line || '-' || (start_line + lines - 1) || '|' || peer || ':' || peer_range AS pair,
             (SELECT version FROM scan) AS version
      FROM pair
      WHERE path < peer OR (path = peer AND start_line < peer_line)
      ORDER BY lines DESC, path, start_line
      LIMIT 200
  # Counted over the whole scan, not the listed rows (`blocks` stops at
  # 200): each block is two facts, one per side.
  summary:
    sql: |
      WITH total AS (
        SELECT count(*) / 2 AS blocks, CAST(coalesce(sum(value), 0) / 2 AS INTEGER) AS lines
        FROM v_fact
        WHERE capture_id = (SELECT id FROM scan) AND measure_key = 'oxplow.duplicate_lines'
      )
      SELECT t.blocks, t.lines,
             CASE
               WHEN NOT EXISTS (SELECT 1 FROM scan)
                 THEN 'The whole-tree duplicate scan hasn''t run yet. It runs about a minute after the branch moves (a commit, a checkout or a pull), at most every 15 minutes, while the **Duplicated lines** metric is on.'
               WHEN t.blocks = 0
                 THEN 'No duplicated blocks in the project, as of the scan ' || (SELECT captured_at FROM scan) || '.'
               ELSE printf('%,d duplicated block%s, %,d lines in all, as of the scan %s.%s',
                           t.blocks, CASE t.blocks WHEN 1 THEN '' ELSE 's' END, t.lines,
                           (SELECT captured_at FROM scan),
                           CASE WHEN t.blocks > 200 THEN ' The 200 biggest are listed.' ELSE '' END)
             END AS summary
      FROM total t
view:
  stack:
  - id: summary
    title: Summary
    hide_title: true
    viz: markdown
    from: summary
    markdown: { text: summary }
  - id: blocks
    title: Duplicate Blocks
    from: blocks
    viz: table
    columns:
    - key: path
      label: File
      link:
        kind: compare
        from: pair
        head: version
    - key: start_line
      label: Line
    - key: lines
      label: Lines
      format: integer
    - key: peer
      label: Copy Of
      link:
        kind: file
        line: peer_line
    - key: peer_line
      label: At line
    empty: No duplicated blocks.
