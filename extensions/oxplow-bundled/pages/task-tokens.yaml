title: Agent Tokens
description: What the agent was asked while working this work item, and what each turn cost.
hidden: true
params:
- name: uri
data:
  task_token_summary:
    sql: |
      SELECT printf('**%,d** tokens · %d turn%s · in %,d · out %,d · cache-write %,d · cache-read %,d',
                    sum(u.input_tokens + u.output_tokens + u.cache_creation_input_tokens + u.cache_read_input_tokens),
                    count(*), CASE count(*) WHEN 1 THEN '' ELSE 's' END,
                    sum(u.input_tokens), sum(u.output_tokens),
                    sum(u.cache_creation_input_tokens), sum(u.cache_read_input_tokens)) AS summary
      FROM v_token_usage u JOIN v_effort e ON e.id = u.effort_id
      WHERE e.work_item = :uri
      HAVING count(*) > 0
  task_turns:
    sql: |
      SELECT u.recorded_at AS at, u.prompt, u.model,
             u.input_tokens + u.output_tokens + u.cache_creation_input_tokens + u.cache_read_input_tokens AS tokens
      FROM v_token_usage u JOIN v_effort e ON e.id = u.effort_id
      WHERE e.work_item = :uri
      ORDER BY u.recorded_at DESC
view:
  stack:
  - id: task-token-summary
    title: Token Total
    from: task_token_summary
    viz: markdown
    empty: No token data collected.
  - id: task-turns
    title: Turns
    from: task_turns
    viz: table
    columns:
    - key: at
      label: When
    - key: prompt
      label: Prompt
    - key: model
      label: Model
    - key: tokens
      label: Tokens
    empty: No turns recorded.
