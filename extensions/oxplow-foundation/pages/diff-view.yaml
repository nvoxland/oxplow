title: Changes
description: 'What changed between two points of the project: a snapshot, an effort or a turn, or any two points picked here. The renderer of `snapshot`, `effort` and `turn`.'
icon: git-compare
for:
- oxplow/snapshot
- oxplow/effort
- oxplow/turn
default: true
params:
- name: uri
- name: start
  type: choice
  role: filter
  options_from: oxplow-foundation/changes-starts
  label: From
  default: ''
- name: end
  type: choice
  role: filter
  options_from: oxplow-foundation/changes-ends
  label: To
  default: ''
- name: stream_id
data:
  row:
    sql: |
      WITH res AS (
        SELECT uri_resource(:uri) AS kind, uri_param(:uri, 'id') AS id
      ), derived AS (
        SELECT 'effort' AS subject, e.id AS effort_row, e.work_item,
               CASE WHEN e.start_snapshot_id IS NOT NULL THEN 'snap:' || e.start_snapshot_id ELSE '' END AS s,
               CASE WHEN e.end_snapshot_id IS NOT NULL THEN 'snap:' || e.end_snapshot_id ELSE 'working' END AS en
        FROM res, v_effort e WHERE res.kind = 'oxplow/effort' AND e.id = CAST(substr(res.id, 4) AS INTEGER)
        UNION ALL
        SELECT 'turn', NULL, NULL, 'snap:' || t.start_snapshot_id,
               CASE WHEN t.snapshot_id IS NOT NULL THEN 'snap:' || t.snapshot_id ELSE 'working' END
        FROM res, v_agent_turn t WHERE res.kind = 'oxplow/turn' AND t.id = CAST(substr(res.id, 4) AS INTEGER)
          AND t.start_snapshot_id IS NOT NULL
        UNION ALL
        SELECT 'snapshot', NULL, NULL,
               coalesce((SELECT 'snap:' || max(p.id) FROM v_snapshot p WHERE p.stream_id = n.stream_id AND p.id < n.id), ''),
               'snap:' || n.id
        FROM res, v_snapshot n WHERE res.kind = 'oxplow/snapshot' AND n.id = CAST(res.id AS INTEGER)
        UNION ALL
        SELECT 'range', NULL, NULL, '', '' FROM res WHERE res.kind IS NULL
      ), chosen AS (
        SELECT CASE WHEN coalesce(:end, '') <> '' THEN 'range' ELSE d.subject END AS subject,
               CASE WHEN coalesce(:end, '') <> '' THEN NULL ELSE d.effort_row END AS effort_row,
               CASE WHEN coalesce(:end, '') <> '' THEN NULL ELSE d.work_item END AS work_item,
               CASE WHEN coalesce(:end, '') <> '' THEN CASE WHEN :start = 'none' THEN '' ELSE coalesce(:start, '') END ELSE d.s END AS start_rev,
               CASE WHEN coalesce(:end, '') <> '' THEN :end ELSE d.en END AS end_rev
        FROM derived d
      )
      SELECT subject, start_rev, end_rev, coalesce(work_item, '') AS work_item,
             effort_row AS effort_id,
             CASE WHEN effort_row IS NOT NULL THEN 'eff' || effort_row END AS effort,
             (end_rev = 'working') AS in_progress,
             (SELECT r.id FROM v_change r WHERE r.kind = 'range' AND r.target = start_rev || '..' || end_rev) AS range_change_id,
             CASE WHEN effort_row IS NOT NULL
                  THEN (SELECT c.id FROM v_change c WHERE c.kind = 'effort' AND c.target = CAST(effort_row AS TEXT))
                  ELSE (SELECT r.id FROM v_change r WHERE r.kind = 'range' AND r.target = start_rev || '..' || end_rev) END AS change_id
      FROM chosen WHERE end_rev <> ''
    columns:
    - key: subject
    - key: start_rev
    - key: end_rev
    - key: work_item
    - key: effort_id
    - key: effort
    - key: in_progress
    - key: range_change_id
    - key: change_id
  header:
    sql: |
      WITH ends AS (
        SELECT 'from' AS role, :start_rev AS rev UNION ALL SELECT 'to', :end_rev
      ), shown AS (
        SELECT role,
               CASE WHEN rev = '' THEN '(initial)'
                    WHEN rev = 'working' THEN 'working tree'
                    WHEN rev LIKE 'snap:%' THEN coalesce((SELECT substr(s.created_at, 1, 19) || coalesce(' (' || substr(s.revision, 5, 7) || ')', '')
                                                          FROM v_snapshot s WHERE s.id = CAST(substr(rev, 6) AS INTEGER)), rev)
                    ELSE substr(rev, 5, 7) END AS label
        FROM ends
      )
      SELECT CASE WHEN :subject = 'effort' THEN 'Effort' WHEN :subject = 'turn' THEN 'Turn'
                  WHEN :subject = 'snapshot' THEN 'Snapshot' ELSE 'Comparison' END AS what,
             (SELECT label FROM shown WHERE role = 'from') AS from_label,
             (SELECT label FROM shown WHERE role = 'to') AS to_label,
             (SELECT w.title FROM v_work_item w WHERE w.uri = :work_item) AS item,
             :work_item AS item_ref,
             CASE WHEN :in_progress THEN CASE :subject
                  WHEN 'effort' THEN 'Effort is in progress - diffing the start snapshot against the live working tree, which keeps changing until it closes.'
                  WHEN 'turn' THEN 'Turn is still running - diffing its start snapshot against the live working tree, which keeps changing until the turn ends.'
                  ELSE 'Diffing against the live working tree, which keeps changing.' END END AS note
    params:
      subject:
        from: row.subject
      start_rev:
        from: row.start_rev
      end_rev:
        from: row.end_rev
      work_item:
        from: row.work_item
      in_progress:
        from: row.in_progress
  description:
    sql: |
      SELECT coalesce(w.body, '') AS body FROM v_work_item w WHERE w.uri = :work_item AND trim(w.body) <> ''
    params:
      work_item:
        from: row.work_item
  verdict:
    sql: |
      SELECT 1 AS verdict WHERE 0
    params:
      effort_id:
        from: row.effort_id
  concurrent:
    sql: |
      WITH r AS (
        SELECT CASE WHEN :start_rev LIKE 'snap:%' THEN CAST(substr(:start_rev, 6) AS INTEGER) ELSE 0 END AS lo,
               CASE WHEN :end_rev LIKE 'snap:%' THEN CAST(substr(:end_rev, 6) AS INTEGER) ELSE 9223372036854775807 END AS hi,
               (SELECT s.created_at FROM v_snapshot s WHERE :start_rev LIKE 'snap:%' AND s.id = CAST(substr(:start_rev, 6) AS INTEGER)) AS lo_at
        WHERE :start_rev LIKE 'snap:%' OR :end_rev LIKE 'snap:%'
      )
      SELECT e.title AS effort, coalesce(e.work_item, e.uri) AS ref
      FROM v_effort e, r
      WHERE (:effort_id IS NULL OR e.id <> :effort_id)
        AND e.start_snapshot_id IS NOT NULL
        AND e.start_snapshot_id <= r.hi
        AND (e.end_snapshot_id IS NULL OR e.end_snapshot_id >= r.lo)
        AND NOT (e.ended_at IS NOT NULL AND r.lo_at IS NOT NULL AND e.ended_at < r.lo_at)
      ORDER BY e.started_at
    params:
      start_rev:
        from: row.start_rev
      end_rev:
        from: row.end_rev
      effort_id:
        from: row.effort_id
  files:
    sql: |
      WITH RECURSIVE ch(base_revision, head_revision) AS (
        SELECT base_revision, head_revision FROM v_change WHERE id = :range_change_id
      ), f(path, status) AS (
        SELECT path, status FROM v_change_file
        WHERE change_id = :range_change_id
          AND (:subject <> 'effort' OR path IN (SELECT path FROM v_effort_file WHERE effort_id = :effort_id))
      ), d(path) AS (
        SELECT substr(path, 1, length(rtrim(path, replace(path, '/', ''))) - 1) FROM f WHERE instr(path, '/') > 0
        UNION
        SELECT substr(path, 1, length(rtrim(path, replace(path, '/', ''))) - 1) FROM d WHERE instr(path, '/') > 0
      )
      SELECT path AS id,
             CASE WHEN instr(path, '/') > 0 THEN substr(path, 1, length(rtrim(path, replace(path, '/', ''))) - 1) END AS parent,
             substr(path, length(rtrim(path, replace(path, '/', ''))) + 1) AS name,
             'folder' AS icon, NULL AS file,
             (SELECT base_revision FROM ch) AS base_revision, (SELECT head_revision FROM ch) AS head_revision
      FROM d
      UNION ALL
      SELECT path, CASE WHEN instr(path, '/') > 0 THEN substr(path, 1, length(rtrim(path, replace(path, '/', ''))) - 1) END,
             substr(path, length(rtrim(path, replace(path, '/', ''))) + 1), status, path,
             (SELECT base_revision FROM ch), (SELECT head_revision FROM ch)
      FROM f
      ORDER BY 1
    params:
      range_change_id:
        from: row.range_change_id
      effort_id:
        from: row.effort_id
      subject:
        from: row.subject
  extensions:
    sql: |
      SELECT c.name, c.change,
             coalesce((SELECT group_concat(e.value, char(10)) FROM json_each(c.errors) e), '') AS errors,
             coalesce((SELECT group_concat(l.value, char(10)) FROM json_each(c.lines) l), '') AS does,
             coalesce((SELECT group_concat(json_extract(x.value, '$.id') || ' (' || json_extract(x.value, '$.change') || ')', ', ')
                       FROM json_each(c.page_changes) x), '') AS pages
      FROM v_extension_change c
      WHERE c.base = :start_rev AND c.head = :end_rev AND c.stream_id = :stream_id
      ORDER BY c.name
    params:
      start_rev:
        from: row.start_rev
      end_rev:
        from: row.end_rev
view:
  stack:
  - id: effort
    embed:
      page: oxplow-foundation/changes-effort
  - id: header
    title: Range
    from: header
    viz: detail
    columns:
    - key: what
      label: Of
    - key: from_label
      label: From
    - key: to_label
      label: To
    - key: item
      label: Work item
      link:
        kind: page
        from: item_ref
    - key: note
      label: Note
    empty: ''
  - id: description
    title: Description
    from: description
    viz: markdown
    markdown:
      text: body
    empty: ''
  - id: verdict
    title: ''
    replaceable: effort.verdict
    from: verdict
    viz: table
    columns:
    - key: verdict
    empty: ''
  - id: concurrent
    title: Concurrent Efforts
    from: concurrent
    viz: list
    columns:
    - key: effort
      label: Effort
      link:
        kind: page
        from: ref
  - id: files
    title: Files Changed
    from: files
    viz: tree
    tree:
      id: id
      parent: parent
      label: name
    columns:
    - key: name
      label: File
      icon: icon
      link:
        kind: diff-at
        from: file
        base: base_revision
        head: head_revision
    empty: No file changes between these points.
  - id: extensions
    title: Extension Changes
    from: extensions
    viz: table
    columns:
    - key: name
      label: Extension
    - key: change
      label: Change
      width: 90
    - key: does
      label: What it changes
    - key: pages
      label: Pages
    - key: errors
      label: Problems
    empty: ''
  - slot: sections
