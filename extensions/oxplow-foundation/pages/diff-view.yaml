title: Changes
description: 'What changed between two points of the project: a snapshot, a request or a turn, or any two points picked here. The renderer of `snapshot`, `request` and `turn`.'
icon: git-compare
for:
- oxplow/snapshot
- oxplow/request
- oxplow/turn
default: true
params:
- name: uri
- name: start
  type: choice
  role: filter
  options_from: '#changes_starts'
  label: From
  default: ''
- name: end
  type: choice
  role: filter
  options_from: '#changes_ends'
  label: To
  default: ''
- name: stream_id
loaders:
  row:
    sql: |
      WITH res AS (
        SELECT uri_resource(:uri) AS kind, uri_param(:uri, 'id') AS id
      ), rq AS (
        -- A request on the snapshot line of the stream of its first turn.
        SELECT CAST(substr(res.id, 4) AS INTEGER) AS id, th.stream_id AS stream_id,
               min(t.started_at) AS began, max(t.ended_at) AS ended, max(t.ended_at IS NULL) AS running
        FROM res, v_agent_turn t JOIN v_thread th ON th.id = t.thread_id
        WHERE res.kind = 'oxplow/request' AND t.request_id = CAST(substr(res.id, 4) AS INTEGER)
          AND th.stream_id = (SELECT th2.stream_id FROM v_agent_turn t2 JOIN v_thread th2 ON th2.id = t2.thread_id
                               WHERE t2.request_id = t.request_id ORDER BY t2.id LIMIT 1)
        GROUP BY th.stream_id
      ), derived AS (
        -- A turn: from the last take at or before it started to its own
        -- turn_end take, else the last take at or before it ended.
        SELECT 'turn' AS subject, t.id AS turn_row, NULL AS request_row, NULL AS task,
               coalesce((SELECT 'snap:' || p.id FROM v_snapshot p
                          WHERE p.stream_id = th.stream_id AND p.created_at <= t.started_at
                          ORDER BY p.created_at DESC, p.id DESC LIMIT 1), '') AS s,
               CASE WHEN t.ended_at IS NULL THEN 'working'
                    ELSE coalesce((SELECT 'snap:' || p.id FROM v_snapshot p
                                    WHERE p.stream_id = th.stream_id
                                      AND (p.created_at <= t.ended_at
                                           OR p.id IN (SELECT o.snapshot_id FROM v_snapshot_op o
                                                        WHERE o.trigger = 'turn_end' AND o.turn_id = t.id))
                                    ORDER BY p.created_at DESC, p.id DESC LIMIT 1), 'working') END AS en
        FROM res, v_agent_turn t JOIN v_thread th ON th.id = t.thread_id
        WHERE res.kind = 'oxplow/turn' AND t.id = CAST(substr(res.id, 4) AS INTEGER)
        UNION ALL
        -- A request: the same, across its turns on the stream.
        SELECT 'request', NULL, rq.id,
               (SELECT x.task FROM v_request_task x WHERE x.request_id = rq.id ORDER BY x.at, x.task LIMIT 1),
               coalesce((SELECT 'snap:' || p.id FROM v_snapshot p
                          WHERE p.stream_id = rq.stream_id AND p.created_at <= rq.began
                          ORDER BY p.created_at DESC, p.id DESC LIMIT 1), ''),
               CASE WHEN rq.running THEN 'working'
                    ELSE coalesce((SELECT 'snap:' || p.id FROM v_snapshot p
                                    WHERE p.stream_id = rq.stream_id
                                      AND (p.created_at <= rq.ended
                                           OR p.id IN (SELECT o.snapshot_id FROM v_snapshot_op o
                                                         JOIN v_agent_turn tt ON tt.id = o.turn_id
                                                        WHERE o.trigger = 'turn_end' AND tt.request_id = rq.id))
                                    ORDER BY p.created_at DESC, p.id DESC LIMIT 1), 'working') END
        FROM rq
        UNION ALL
        SELECT 'snapshot', NULL, NULL, NULL,
               coalesce((SELECT 'snap:' || max(p.id) FROM v_snapshot p WHERE p.stream_id = n.stream_id AND p.id < n.id), ''),
               'snap:' || n.id
        FROM res, v_snapshot n WHERE res.kind = 'oxplow/snapshot' AND n.id = CAST(res.id AS INTEGER)
        UNION ALL
        SELECT 'range', NULL, NULL, NULL, '', '' FROM res WHERE res.kind IS NULL
      ), chosen AS (
        SELECT CASE WHEN coalesce(:end, '') <> '' THEN 'range' ELSE d.subject END AS subject,
               CASE WHEN coalesce(:end, '') <> '' THEN NULL ELSE d.turn_row END AS turn_row,
               CASE WHEN coalesce(:end, '') <> '' THEN NULL ELSE d.request_row END AS request_row,
               CASE WHEN coalesce(:end, '') <> '' THEN NULL ELSE d.task END AS task,
               CASE WHEN coalesce(:end, '') <> '' THEN CASE WHEN :start = 'none' THEN '' ELSE coalesce(:start, '') END ELSE d.s END AS start_rev,
               CASE WHEN coalesce(:end, '') <> '' THEN :end ELSE d.en END AS end_rev
        FROM derived d
      )
      SELECT subject, start_rev, end_rev, coalesce(task, '') AS task,
             (end_rev = 'working') AS in_progress,
             (SELECT r.id FROM v_change r WHERE r.kind = 'range' AND r.target = start_rev || '..' || end_rev) AS range_change_id,
             CASE WHEN turn_row IS NOT NULL
                  THEN coalesce((SELECT c.id FROM v_change c WHERE c.kind = 'turn' AND c.target = CAST(turn_row AS TEXT)),
                                (SELECT r.id FROM v_change r WHERE r.kind = 'range' AND r.target = start_rev || '..' || end_rev))
                  WHEN request_row IS NOT NULL
                  THEN coalesce((SELECT c.id FROM v_change c WHERE c.kind = 'request' AND c.target = CAST(request_row AS TEXT)),
                                (SELECT r.id FROM v_change r WHERE r.kind = 'range' AND r.target = start_rev || '..' || end_rev))
                  ELSE (SELECT r.id FROM v_change r WHERE r.kind = 'range' AND r.target = start_rev || '..' || end_rev) END AS change_id
      FROM chosen WHERE end_rev <> ''
    columns:
    - key: subject
    - key: start_rev
    - key: end_rev
    - key: task
    - key: in_progress
    - key: range_change_id
    - key: change_id
  changes_starts:
    sql: |
      SELECT value, label, "group" FROM (
        SELECT '' AS value, 'Nothing - the whole tree' AS label, 'Start' AS "group", 1 AS k, 0 AS n
        UNION ALL
        SELECT 'snap:' || s.id, substr(s.created_at, 1, 19) || coalesce(' - ' || substr(s.revision, 5, 7), ''),
               coalesce(s.branch, 'Snapshots'), 0, s.id
        FROM v_snapshot s
        WHERE s.stream_id = :stream_id
          AND (coalesce(:end, '') NOT LIKE 'snap:%' OR s.id < CAST(substr(:end, 6) AS INTEGER))
      ) ORDER BY k DESC, n DESC LIMIT 41
  changes_ends:
    sql: |
      SELECT value, label, "group" FROM (
        SELECT 'working' AS value, 'Working tree' AS label, 'Now' AS "group", 1 AS k, 0 AS n
        UNION ALL
        SELECT 'snap:' || s.id, substr(s.created_at, 1, 19) || coalesce(' - ' || substr(s.revision, 5, 7), ''),
               coalesce(s.branch, 'Snapshots'), 0, s.id
        FROM v_snapshot s
        WHERE s.stream_id = :stream_id
          AND (coalesce(:start, '') NOT LIKE 'snap:%' OR s.id > CAST(substr(:start, 6) AS INTEGER))
      ) ORDER BY k DESC, n DESC LIMIT 41
  header:
    sql: |
      WITH ends AS (
        SELECT 'from' AS role, :start_rev AS rev UNION ALL SELECT 'to', :end_rev
      ), shown AS (
        SELECT role,
               CASE WHEN rev = '' THEN '(initial)'
                    WHEN rev = 'working' THEN 'working tree'
                    WHEN rev LIKE 'snap:%' THEN coalesce((SELECT substr(s.created_at, 1, 19) || coalesce(' (' || substr(s.revision, 5, 7) || ')', '')
                                                          FROM v_snapshot s WHERE s.id = CAST(substr(rev, 6) AS INTEGER)), rev)
                    ELSE substr(rev, 5, 7) END AS label
        FROM ends
      )
      SELECT CASE WHEN :subject = 'turn' THEN 'Turn' WHEN :subject = 'request' THEN 'Request'
                  WHEN :subject = 'snapshot' THEN 'Snapshot' ELSE 'Comparison' END AS what,
             (SELECT label FROM shown WHERE role = 'from') AS from_label,
             (SELECT label FROM shown WHERE role = 'to') AS to_label,
             (SELECT w.title FROM v_task w WHERE w.uri = :task) AS item,
             :task AS item_ref,
             CASE WHEN :in_progress THEN CASE :subject
                  WHEN 'turn' THEN 'Turn is still running - diffing its start snapshot against the live working tree, which keeps changing until the turn ends.'
                  WHEN 'request' THEN 'Request is still running - diffing its start snapshot against the live working tree, which keeps changing until it ends.'
                  ELSE 'Diffing against the live working tree, which keeps changing.' END END AS note
    params:
      subject:
        from: row.subject
      start_rev:
        from: row.start_rev
      end_rev:
        from: row.end_rev
      task:
        from: row.task
      in_progress:
        from: row.in_progress
  description:
    sql: |
      SELECT coalesce(w.body, '') AS body FROM v_task w WHERE w.uri = :task AND trim(w.body) <> ''
    params:
      task:
        from: row.task
  concurrent:
    sql: |
      -- The other requests (any thread) whose turns changed a path of this
      -- change while it was being made: the window is the two points' take
      -- times (open at the start for the whole tree, at the end for the
      -- working tree). Joined by integer ids; the subject's own request
      -- (a turn's, for a turn) is left out.
      WITH win AS (
        SELECT coalesce((SELECT s.created_at FROM v_snapshot s WHERE :start_rev LIKE 'snap:%' AND s.id = CAST(substr(:start_rev, 6) AS INTEGER)), '') AS lo,
               coalesce((SELECT s.created_at FROM v_snapshot s WHERE :end_rev LIKE 'snap:%' AND s.id = CAST(substr(:end_rev, 6) AS INTEGER)), '9999') AS hi
      ), own AS (
        SELECT CASE WHEN :subject = 'request' THEN CAST(substr(uri_param(:uri, 'id'), 4) AS INTEGER)
                    WHEN :subject = 'turn' THEN (SELECT x.request_id FROM v_agent_turn x WHERE x.id = CAST(substr(uri_param(:uri, 'id'), 4) AS INTEGER))
               END AS request_id
      )
      SELECT CASE WHEN instr(r.prompt, char(10)) > 0 THEN substr(r.prompt, 1, instr(r.prompt, char(10)) - 1) ELSE r.prompt END AS prompt,
             r.uri AS ref,
             th.title AS thread,
             group_concat(DISTINCT tf.path) AS shared
      FROM v_change_file cf
      JOIN v_turn_file tf ON tf.path = cf.path AND tf.confidence IN ('claimed', 'sole')
      JOIN v_agent_turn t ON t.id = tf.turn_id
      JOIN v_request r ON r.id = t.request_id
      JOIN v_thread th ON th.id = t.thread_id, win, own
      WHERE cf.change_id = :range_change_id
        AND (own.request_id IS NULL OR r.id <> own.request_id)
        AND tf.last_changed_at >= win.lo AND tf.first_changed_at <= win.hi
      GROUP BY r.id
      ORDER BY r.started_at, r.id
    params:
      subject:
        from: row.subject
      start_rev:
        from: row.start_rev
      end_rev:
        from: row.end_rev
      range_change_id:
        from: row.range_change_id
  files:
    sql: |
      WITH ch(base_revision, head_revision) AS (
        SELECT base_revision, head_revision FROM v_change WHERE id = :range_change_id
      )
      SELECT path, status, (SELECT base_revision FROM ch) AS base_revision, (SELECT head_revision FROM ch) AS head_revision
      FROM v_change_file
      WHERE change_id = :range_change_id
      ORDER BY path
    params:
      range_change_id:
        from: row.range_change_id
  extensions:
    sql: |
      SELECT c.name, c.change,
             coalesce((SELECT group_concat(json_extract(e.value, '$.shown'), char(10)) FROM json_each(c.errors) e), '') AS errors,
             coalesce((SELECT group_concat(l.value, char(10)) FROM json_each(c.lines) l), '') AS does,
             coalesce((SELECT group_concat(json_extract(x.value, '$.id') || ' (' || json_extract(x.value, '$.change') || ')', ', ')
                       FROM json_each(c.page_changes) x), '') AS pages
      FROM v_extension_change c
      WHERE c.base = :start_rev AND c.head = :end_rev AND c.stream_id = :stream_id
      ORDER BY c.name
    params:
      start_rev:
        from: row.start_rev
      end_rev:
        from: row.end_rev
view:
  stack:
  - id: header
    title: Range
    from: header
    viz: detail
    columns:
    - key: what
      label: Of
    - key: from_label
      label: From
    - key: to_label
      label: To
    - key: item
      label: Task
      link:
        kind: page
        from: item_ref
    - key: note
      label: Note
    empty: No range picked.
  - id: description
    title: Description
    from: description
    viz: markdown
    markdown:
      text: body
    empty: No description.
  - id: concurrent
    title: Other Requests On These Files
    from: concurrent
    viz: table
    columns:
    - key: prompt
      label: Request
      link:
        kind: page
        from: ref
    - key: thread
      label: Thread
      width: 140
    - key: shared
      label: Shared files
    empty: No other request changed these files in the same window.
  - id: files
    title: Files Changed
    from: files
    viz: tree
    tree:
      path: path
      status: status
    columns:
    - key: path
      label: File
      link:
        kind: diff-at
        from: path
        base: base_revision
        head: head_revision
    empty: No file changes between these points.
  - id: extensions
    title: Extension Changes
    from: extensions
    viz: table
    columns:
    - key: name
      label: Extension
    - key: change
      label: Change
      width: 90
    - key: does
      label: What it changes
    - key: pages
      label: Pages
    - key: errors
      label: Problems
    empty: No extension changed.
  - slot: sections
