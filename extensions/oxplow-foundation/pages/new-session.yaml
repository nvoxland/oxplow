title: New Session
description: Start a session on this thread with one of the project's agents, or bring an earlier one back.
icon: plus
params:
- name: stream_id
- name: thread_id
- name: q
  role: filter
  label: Find an earlier session
  type: search
data:
  start:
    sql: |
      SELECT uri_param(t.uri, 'id') AS thread,
             (SELECT h.id FROM v_agent_harness h WHERE h.enabled = 1 ORDER BY h.position LIMIT 1) AS harness
      FROM v_thread t
      WHERE t.id = :thread_id
  earlier:
    sql: |
      WITH RECURSIVE
      words(word, rest) AS (
        SELECT '', lower(trim(coalesce(:q, ''))) || ' '
        UNION ALL
        SELECT substr(rest, 1, instr(rest, ' ') - 1), trim(substr(rest, instr(rest, ' ') + 1))
          || CASE WHEN trim(substr(rest, instr(rest, ' ') + 1)) = '' THEN '' ELSE ' ' END
        FROM words WHERE rest <> ''
      ),
      sessions AS (
        SELECT a.id, a.uri, a.thread_id, a.harness, a.resume_session_id AS native, a.display_name,
               coalesce(nullif(trim(a.title), ''), nullif(trim(a.native_title), '')) AS given_name,
               a.closed_at, a.closed_reason, a.updated_at, th.title AS thread_title,
               a.closed_at IS NULL AS is_open, a.thread_id = :thread_id AS here
        FROM v_agent_session a JOIN v_thread th ON th.id = a.thread_id
        WHERE th.stream_id = :stream_id
      ),
      rich AS (
        SELECT s.*,
               (s.closed_at IS NOT NULL AND s.here AND s.closed_reason = 'closed') AS reopenable,
               coalesce(s.closed_at, s.updated_at) AS at,
               (SELECT count(*) FROM v_agent_turn t WHERE t.agent_session_id = s.id) AS turns,
               (SELECT t.prompt FROM v_agent_turn t WHERE t.agent_session_id = s.id ORDER BY t.id DESC LIMIT 1) AS last_prompt
        FROM sessions s
      ),
      convs AS (
        SELECT c.harness, c.native_id, c.title, c.first_prompt, c.updated_at, c.size_bytes, c.problem,
               (SELECT r.id FROM rich r WHERE r.harness = c.harness AND r.native = c.native_id
                 ORDER BY r.is_open DESC, r.reopenable DESC, r.at DESC LIMIT 1) AS sid
        FROM v_agent_conversation c
      ),
      listed AS (
        SELECT c.harness, c.native_id AS conversation, c.title AS c_title, c.first_prompt,
               c.updated_at AS c_at, c.size_bytes, NULL AS problem, c.sid, 1 AS has_conv
        FROM convs c WHERE c.problem IS NULL AND c.native_id IS NOT NULL
        UNION ALL
        SELECT c.harness, NULL, NULL, NULL, NULL, NULL, c.problem, NULL, 0
        FROM convs c WHERE c.problem IS NOT NULL
        UNION ALL
        SELECT r.harness, NULL, NULL, NULL, NULL, NULL, NULL, r.id, 0
        FROM rich r
        WHERE r.id NOT IN (SELECT sid FROM convs WHERE sid IS NOT NULL)
          AND ((r.is_open AND r.here)
               OR (NOT r.is_open AND (coalesce(r.native, '') <> '' OR r.turns > 0)
                   AND (r.reopenable OR coalesce(r.native, '') <> '')))
      ),
      classified AS (
        SELECT l.*, r.uri AS session, r.display_name, r.given_name, r.thread_title, r.here,
               r.turns, r.last_prompt, r.native AS s_native,
               CASE
                 WHEN l.problem IS NOT NULL THEN 'none'
                 WHEN r.id IS NULL THEN 'resume'
                 WHEN r.is_open THEN CASE WHEN r.here THEN 'switch' ELSE 'none' END
                 WHEN r.reopenable THEN 'reopen'
                 WHEN l.has_conv OR coalesce(r.native, '') <> '' THEN 'resume'
                 ELSE 'none'
               END AS action,
               coalesce(l.c_at, r.at) AS at
        FROM listed l LEFT JOIN rich r ON r.id = l.sid
      ),
      shown AS (
        SELECT c.*,
               CASE
                 WHEN c.problem IS NOT NULL THEN c.harness || ' couldn''t list its saved sessions: ' || c.problem
                 ELSE coalesce(nullif(trim(c.c_title), ''), c.given_name, nullif(trim(c.first_prompt), ''),
                               nullif(trim(c.last_prompt), ''), c.conversation, c.session)
               END AS label,
               CASE c.action
                 WHEN 'reopen' THEN 'closed here'
                 WHEN 'switch' THEN 'open in this thread'
                 WHEN 'none' THEN CASE WHEN c.problem IS NOT NULL THEN 'unavailable'
                                       WHEN c.session IS NOT NULL THEN 'open in ' || c.display_name || ' (' || c.thread_title || ')'
                                       ELSE 'open elsewhere' END
                 ELSE CASE WHEN c.session IS NULL THEN 'not started in oxplow'
                           WHEN c.here THEN 'closed here'
                           ELSE 'from ' || coalesce(nullif(c.thread_title, ''), 'another thread') END
               END AS note,
               coalesce(c.conversation, c.s_native) AS resume_native
        FROM classified c
      )
      SELECT CASE WHEN s.action = 'switch' THEN s.session END AS session_uri,
             s.label, s.note, s.harness, s.at, CASE WHEN s.turns > 0 THEN s.turns END AS turns, s.size_bytes,
             s.action = 'reopen' AS can_reopen, s.action = 'resume' AS can_resume,
             s.session, s.resume_native AS conversation,
             (SELECT uri_param(t.uri, 'id') FROM v_thread t WHERE t.id = :thread_id) AS thread,
             CASE WHEN s.action = 'none' THEN 'muted' END AS tone,
             uri_param(s.session, 'id') AS session_id
      FROM shown s
      WHERE NOT EXISTS (SELECT 1 FROM words w WHERE w.word <> ''
                        AND instr(lower(s.label || ' ' || coalesce(s.note, '') || ' ' || s.harness || ' '
                                        || coalesce(s.first_prompt, '') || ' ' || coalesce(s.last_prompt, '')
                                        || ' ' || coalesce(s.thread_title, '')), w.word) = 0)
      ORDER BY s.action = 'none', s.at DESC
view:
  stack:
  - id: start
    title: Start a new session
    from: start
    viz: form
    form:
      command: oxplow.agent_session.open
      then: replace
      fields:
      - harness
      - remember
      choices:
        harness: oxplow-foundation/new-session-harnesses
  - id: earlier
    title: Earlier sessions
    from: earlier
    viz: table
    columns:
    - key: label
      label: Session
      link:
        kind: page
        from: session_uri
      tone: tone
    - key: note
      label: Status
      width: 220
      tone: tone
    - key: harness
      label: Agent
      width: 90
    - key: at
      label: Last active
      format: relative
      width: 100
    - key: turns
      label: Turns
      width: 60
    - key: size_bytes
      label: Size
      format: bytes
      width: 80
    empty: No earlier sessions for this worktree.
    actions:
    - id: reopen
      label: Reopen
      command: oxplow.agent_session.reopen
      input:
        session: '{{row.session_id}}'
      row: true
      when: can_reopen
      primary: true
      then: replace
    - id: resume
      label: Resume
      command: oxplow.agent_session.open
      input:
        thread: '{{row.thread}}'
        harness: '{{row.harness}}'
        resume: '{{row.conversation}}'
      row: true
      when: can_resume
      primary: true
      then: replace
  - slot: sections
