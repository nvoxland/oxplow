title: Dimensions to slice by
description: The dimensions a metric can be split by, for the Metrics list's Slice By.
hidden: true
data:
  metrics_dimensions:
    sql: |
      SELECT '' AS value, 'No slicing' AS label
      UNION ALL
      SELECT key, label FROM v_dimension
      ORDER BY 2
view:
  from: metrics_dimensions
  viz: table
