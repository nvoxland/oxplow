title: Symbols
description: The definitions oxplow finds in the stream's files, nested under their container and grouped by file. Give a path for one file's outline, or a filter to find a symbol by name.
icon: list-tree
category: Code
params:
- name: stream_id
- name: path
  label: File (empty for every file)
  default: ''
- name: filter
  role: filter
  label: Name contains
  default: ''
data:
  symbols:
    sql: |
      WITH matched AS (
        SELECT * FROM v_symbol
        WHERE stream_id = :stream_id
          AND (:path = '' OR path = :path)
          AND (:filter = '' OR name LIKE '%' || replace(replace(replace(:filter, '\', '\\'), '%', '\%'), '_', '\_') || '%' ESCAPE '\')
        ORDER BY path, line, col LIMIT 5000)
      SELECT path AS id, NULL AS parent, path AS label, path, 1 AS line
      FROM matched WHERE :path = '' GROUP BY path
      UNION ALL
      SELECT s.uri, coalesce(
               (SELECT min(p.uri) FROM matched p
                WHERE p.path = s.path AND s.container IS NOT NULL
                  AND CASE WHEN p.container IS NULL THEN p.name ELSE p.container || '::' || p.name END = s.container),
               CASE WHEN :path = '' THEN s.path END),
             s.kind || ' ' || s.name || CASE WHEN s.signature IS NULL THEN '' ELSE '(' || s.signature || ')' END,
             s.path, s.line
      FROM matched s
view:
  from: symbols
  viz: tree
  tree:
    id: id
    parent: parent
    label: label
  columns:
  - key: label
    label: Symbol
    link:
      kind: file
      from: path
      line: line
  empty: No symbols. Symbols come from oxplow's own parsing of each supported language, collected at each snapshot.
