title: Context
description: 'What you collected for agents, in this thread''s own basket and your named baskets. The next prompt here carries this thread''s basket and every basket attached to it.'
icon: at-sign
category: Work
keywords: basket collected agent prompt note review attach
params:
- name: thread_id
loaders:
  next:
    sql: |
      SELECT c.id, c.kind,
             coalesce(c.label, c.source_uri, substr(c.text, 1, 80)) AS what,
             c.source_uri, substr(c.text, 1, 200) AS preview, c.note,
             coalesce(c.basket, 'This Thread') AS basket, c.added_at
      FROM v_context_item c
      LEFT JOIN v_context_basket b ON b.id = c.basket_id
      WHERE c.thread_id = :thread_id OR b.attached_thread_id = :thread_id
      ORDER BY c.basket_id IS NOT NULL, c.basket, c.added_at, c.id
  baskets:
    sql: |
      SELECT b.id, b.name, b.items,
             b.attached_thread_uri,
             (SELECT t.title FROM v_thread t WHERE t.id = b.attached_thread_id) AS attached_to,
             b.attached_thread_id = :thread_id AS attached_here,
             b.attached_thread_id IS NOT NULL AS attached,
             coalesce(b.attached_thread_id <> :thread_id, 1) AS attachable
      FROM v_context_basket b
      ORDER BY b.name
  in_baskets:
    sql: |
      SELECT c.id, c.kind,
             coalesce(c.label, c.source_uri, substr(c.text, 1, 80)) AS what,
             c.source_uri, substr(c.text, 1, 200) AS preview, c.note, c.basket, c.added_at
      FROM v_context_item c
      LEFT JOIN v_context_basket b ON b.id = c.basket_id
      WHERE c.basket_id IS NOT NULL AND b.attached_thread_id IS NOT :thread_id
      ORDER BY c.basket, c.added_at, c.id
view:
  stack:
  - id: next
    title: Next prompt
    from: next
    viz: table
    columns:
    - key: what
      label: Collected
      link:
        kind: page
        from: source_uri
    - key: basket
      label: Basket
      width: 120
    - key: preview
      label: Text
    - key: note
      label: Note
    - key: added_at
      label: Added
      format: relative
      width: 110
    empty: Nothing for this thread's next prompt yet. Add a page from its ☰ or text from a selection's right-click, with a note of what you want done about it, or attach one of your baskets.
    actions:
    - id: note
      label: Edit Note…
      command: oxplow.context.note
      form: true
      about: what
      input:
        item: '{{row.id}}'
        note: '{{row.note}}'
      fields:
      - name: note
        label: Note
        help: What you want the agent to do about it. Leave it empty to remove the note.
      row: true
    - id: remove
      label: Remove
      command: oxplow.context.remove
      input:
        item: '{{row.id}}'
      row: true
  - id: baskets
    title: Baskets
    from: baskets
    viz: table
    columns:
    - key: name
      label: Basket
    - key: items
      label: Items
      width: 70
    - key: attached_to
      label: Attached to
      link:
        kind: page
        from: attached_thread_uri
    empty: No named baskets. Pick "New basket…" when you add to context to start one.
    actions:
    - id: attach
      label: Attach to This Thread
      command: oxplow.context.attach
      when: attachable
      input:
        basket: '{{row.name}}'
        thread: thr{{param.thread_id}}
      row: true
    - id: detach
      label: Detach
      command: oxplow.context.detach
      when: attached
      input:
        basket: '{{row.name}}'
      row: true
    - id: rename
      label: Rename…
      command: oxplow.context.rename_basket
      form: true
      about: name
      input:
        basket: '{{row.name}}'
        name: '{{row.name}}'
      fields:
      - name: name
        label: Name
      row: true
    - id: clear-basket
      label: Clear
      command: oxplow.context.clear
      input:
        basket: '{{row.name}}'
      row: true
    - id: delete-basket
      label: Delete
      command: oxplow.context.delete_basket
      input:
        basket: '{{row.name}}'
      row: true
  - id: in_baskets
    title: In other baskets
    from: in_baskets
    viz: table
    columns:
    - key: what
      label: Collected
      link:
        kind: page
        from: source_uri
    - key: basket
      label: Basket
      width: 120
    - key: preview
      label: Text
    - key: note
      label: Note
    - key: added_at
      label: Added
      format: relative
      width: 110
    empty: Nothing in a basket not attached here.
    actions:
    - id: note
      label: Edit Note…
      command: oxplow.context.note
      form: true
      about: what
      input:
        item: '{{row.id}}'
        note: '{{row.note}}'
      fields:
      - name: note
        label: Note
        help: What you want the agent to do about it. Leave it empty to remove the note.
      row: true
    - id: remove
      label: Remove
      command: oxplow.context.remove
      input:
        item: '{{row.id}}'
      row: true
actions:
- id: clear
  label: Clear This Thread
  command: oxplow.context.clear
  input:
    thread: thr{{param.thread_id}}
  prominent: true
  icon: trash-2
