title: Backlog
description: "The work items on no thread, to pick from or file into."
icon: inbox
category: Work
needs:
- work_items
params:
- name: q
  role: filter
  label: Search
  default: ''
- name: thread_id
loaders:
  new_item:
    sql: |
      SELECT 'todo' AS state
  items:
    sql: |
      WITH feat AS (
        SELECT p.features AS f, p.fields AS fields FROM v_capability_provider p WHERE p.capability = 'work_items' AND p.active = 1
      )
      SELECT w.uri, w.title, w.state,
             (SELECT group_concat(n.value, ' · ')
                FROM json_each(CASE WHEN json_valid(w.native) THEN w.native ELSE '{}' END) n
               WHERE n.key IN (SELECT json_extract(f.value, '$.name')
                                 FROM json_each(CASE WHEN json_valid((SELECT fields FROM feat)) THEN (SELECT fields FROM feat) ELSE '[]' END) f
                                WHERE json_extract(f.value, '$.kind') = 'enum'
                                  AND coalesce(json_extract(f.value, '$.read_only'), 0) = 0)
                 AND n.value IS NOT NULL) AS fields,
             CASE WHEN w.parent_uri IS NOT NULL AND EXISTS (
                    SELECT 1 FROM v_work_item p WHERE p.uri = w.parent_uri AND p.thread_id IS NULL) THEN 1 ELSE 0 END AS depth,
             CASE WHEN coalesce(json_extract((SELECT f FROM feat), '$.hierarchy'), 0) = 1
                  THEN uri('oxplow/page', 'page', 'new-task', 'parent', w.uri) END AS add_child,
             CASE WHEN coalesce(json_extract((SELECT f FROM feat), '$.hierarchy'), 0) = 1 THEN '+' END AS plus,
             w.state <> 'todo' AS not_todo, w.state <> 'in_progress' AS not_in_progress,
             w.state <> 'blocked' AS not_blocked, w.state <> 'done' AS not_done, w.state <> 'canceled' AS not_canceled,
             coalesce(json_extract((SELECT f FROM feat), '$.ordering'), 0) AS can_order,
             coalesce(json_extract((SELECT f FROM feat), '$.delete'), 0) AS can_delete,
             (:thread_id IS NOT NULL AND coalesce(json_extract((SELECT f FROM feat), '$.lists'), 0) = 1) AS can_bring,
             'thr' || :thread_id AS thread_ref,
             EXISTS (SELECT 1 FROM json_each(CASE WHEN json_valid((SELECT fields FROM feat)) THEN (SELECT fields FROM feat) ELSE '[]' END) f
                      WHERE json_extract(f.value, '$.name') = 'priority' AND json_extract(f.value, '$.kind') = 'enum') AS can_prioritize
      FROM v_work_item w
      WHERE w.thread_id IS NULL
        AND (:q = '' OR instr(lower(w.title), lower(:q)) > 0 OR instr(lower(w.native), lower(:q)) > 0)
      ORDER BY coalesce((SELECT p.rank FROM v_work_item p WHERE p.uri = w.parent_uri AND p.thread_id IS NULL), w.rank), depth, w.rank
  count:
    sql: |
      SELECT count(*) AS n FROM v_work_item WHERE thread_id IS NULL
view:
  stack:
  - id: add
    title: New item
    from: new_item
    viz: form
    form:
      command: oxplow.work_item.create
      then: stay
      fields:
      - title
  - id: items
    title: Backlog
    from: items
    viz: list
    group:
      by: state
      values:
      - in_progress
      - todo
      - blocked
      - done
      - canceled
      labels:
        todo: To Do
        in_progress: In Progress
        blocked: Blocked
        done: Done
        canceled: Canceled
    depth: depth
    columns:
    - key: title
      label: Item
      link:
        kind: page
        from: uri
      icon: state
    - key: fields
      label: Fields
    - key: plus
      label: ''
      link:
        kind: page
        from: add_child
      width: 40
    empty: The backlog is empty. File an item above.
    actions:
    - id: reorder
      label: Reorder
      command: oxplow.work_item.reorder
      row: true
      drag: true
      when: can_order
      input:
        uri: '{{row.uri}}'
        before: '{{before.uri}}'
    - id: move
      label: Move to the state
      command: oxplow.work_item.transition
      row: true
      drag: true
      input:
        uri: '{{row.uri}}'
        to: '{{group.value}}'
    - id: to-todo
      label: Mark To Do
      command: oxplow.work_item.transition
      row: true
      bulk: true
      key: r
      when: not_todo
      input:
        uri: '{{row.uri}}'
        to: todo
    - id: to-in-progress
      label: Mark In Progress
      command: oxplow.work_item.transition
      row: true
      bulk: true
      key: i
      when: not_in_progress
      input:
        uri: '{{row.uri}}'
        to: in_progress
    - id: to-blocked
      label: Mark Blocked
      command: oxplow.work_item.transition
      row: true
      bulk: true
      key: b
      when: not_blocked
      input:
        uri: '{{row.uri}}'
        to: blocked
    - id: to-done
      label: Mark Done
      command: oxplow.work_item.transition
      row: true
      bulk: true
      key: d
      when: not_done
      input:
        uri: '{{row.uri}}'
        to: done
    - id: to-canceled
      label: Mark Canceled
      command: oxplow.work_item.transition
      row: true
      bulk: true
      when: not_canceled
      input:
        uri: '{{row.uri}}'
        to: canceled
    - id: priority-urgent
      label: Priority Urgent
      command: oxplow.work_item.update
      row: true
      bulk: true
      when: can_prioritize
      input:
        uri: '{{row.uri}}'
        native:
          priority: urgent
    - id: priority-high
      label: Priority High
      command: oxplow.work_item.update
      row: true
      bulk: true
      when: can_prioritize
      input:
        uri: '{{row.uri}}'
        native:
          priority: high
    - id: priority-medium
      label: Priority Medium
      command: oxplow.work_item.update
      row: true
      bulk: true
      when: can_prioritize
      input:
        uri: '{{row.uri}}'
        native:
          priority: medium
    - id: priority-low
      label: Priority Low
      command: oxplow.work_item.update
      row: true
      bulk: true
      when: can_prioritize
      input:
        uri: '{{row.uri}}'
        native:
          priority: low
    - id: bring
      label: Bring to this thread
      command: oxplow.work_item.move
      row: true
      bulk: true
      when: can_bring
      input:
        uri: '{{row.uri}}'
        to:
          thread: '{{row.thread_ref}}'
    - id: delete
      label: Delete
      command: oxplow.work_item.delete
      row: true
      bulk: true
      when: can_delete
      input:
        uri: '{{row.uri}}'
badge:
  loader: count
