title: Extensions
description: "Every extension this project knows, those needing attention first: whether a deployment of it runs, what it may reach and how many problems it has."
icon: package
category: System
keywords: deploy rollback permissions enable disable share health
loaders:
  summary:
    page: oxplow-foundation/extension-facts
    loader: summary
  # One row an extension, from the summary: "no" problems, else their count
  # (in the problem color, linking to the problems page).
  extensions:
    sql: |
      SELECT heading AS name, uri, deployed, permission_items,
             CASE WHEN problem_count > 0 THEN CAST(problem_count AS TEXT) ELSE 'no' END AS problems,
             CASE WHEN problem_count > 0 THEN 'danger' END AS problems_tone,
             CASE WHEN problem_count > 0 THEN problems_target END AS problems_target
      FROM summary
view:
  from: extensions
  viz: table
  columns:
  - { key: name, label: Name, link: { kind: page, from: uri } }
  - { key: deployed, label: Deployed, width: 90 }
  - { key: permission_items, label: Permissions, format: items }
  - { key: problems, label: Problems, width: 90, tone: problems_tone, link: { kind: page, from: problems_target } }
  empty: No extensions. One you or your agent writes in .oxplow/extensions/ shows here.
