title: Catalog
description: What oxplow knows and can do — what you can ask its agent, the data behind the answers, and what you can configure.
icon: book-open
category: System
keywords: ask prompts questions what can i help data config
loaders:
  ask:
    sql: |
      SELECT a.question AS prompt, a.about,
             coalesce(p.category, p.extension) AS offered_by
      FROM v_page_answer a JOIN v_page p ON p.uri = a.page_uri
      ORDER BY coalesce(p.category, p.extension), p.id, a.position
  configure:
    sql: |
      SELECT key, doc
      FROM v_config_key
      ORDER BY key
view:
  stack:
  - id: ask
    title: What you can ask
    from: ask
    viz: table
    group:
      by: offered_by
    columns:
    - key: prompt
      label: Question
    - key: about
      label: Also offered on
      width: 140
    empty: No questions to suggest.
    actions:
    - id: ask
      label: Ask
      command: oxplow.agent.draft
      input:
        text: '{{row.prompt}}'
      row: true
  - id: data
    title: What data there is
    embed:
      page: oxplow/data-catalog
  - id: configure
    title: What you can configure
    from: configure
    viz: table
    columns:
    - key: key
      label: Setting
      width: 220
    - key: doc
      label: What it does
    empty: Nothing to configure.
actions:
- id: settings
  label: Open Settings
  command: oxplow.window.navigate
  input:
    uri: oxplow:oxplow/page?page=settings
