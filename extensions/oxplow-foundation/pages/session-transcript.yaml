title: Session transcript
description: "What happened in an agent session, oldest first, 50 a page — each turn's prompt and answer, how many tool calls it made and what opened it: a person's prompt, a subagent's hand-back, a background job reporting back or another session's message."
params:
- name: session
  label: Session (`ses3`)
- name: turn
  role: filter
  label: Start at turn (`trn7`)
  default: ''
- name: page
  role: filter
  label: Page
  default: 1
answers:
- {"question":"What happened in this agent session, turn by turn?","params":{"session":"ses1"},"skill":"oxplow-runtime"}
loaders:
  session_transcript:
    sql: |
      WITH s AS (SELECT * FROM v_agent_session WHERE uri = uri('oxplow/agent_session', 'id', :session)),
      items AS (
        SELECT t.uri AS uri,
               t.started_at AS at,
               CASE t.source WHEN 'subagent' THEN 'hand-back' WHEN 'background_job' THEN 'background job'
                             WHEN 'peer' THEN 'message' ELSE 'turn' END AS kind,
               t.ended_at AS ended_at,
               t.prompt AS prompt,
               coalesce(t.answer, '') AS answer,
               (SELECT count(*) FROM v_tool_call c WHERE c.turn_id = t.id) AS tool_calls,
               -- Where its time went: in tools, waiting on the person, the rest.
               (SELECT CASE WHEN a.duration_ms IS NULL THEN NULL
                            ELSE (a.duration_ms / 1000) || 's'
                                 || CASE WHEN a.tool_ms IS NULL THEN ''
                                         ELSE ' — tools ' || (a.tool_ms / 1000) || 's, waiting '
                                              || (a.wait_ms / 1000) || 's, the rest '
                                              || (a.other_ms / 1000) || 's' END END
                  FROM v_turn_activity a WHERE a.turn_id = t.id) AS time
        FROM v_agent_turn t
        WHERE t.agent_session_id = (SELECT id FROM s)
      )
      SELECT i.uri, i.at, i.kind, i.ended_at, i.prompt, i.answer, i.tool_calls, i.time,
             s.thread_id AS thread_id, s.harness AS harness, s.resume_session_id AS conversation,
             (SELECT uri_param(th.uri, 'id') FROM v_thread th WHERE th.id = s.thread_id) AS thread_id_bare
      FROM items i, s
      WHERE :turn = '' OR i.at >= coalesce((SELECT started_at FROM v_agent_turn WHERE uri = uri('oxplow/turn', 'id', :turn)), '')
      ORDER BY i.at, i.uri
      LIMIT 50 OFFSET (max(CAST(:page AS INTEGER), 1) - 1) * 50
view:
  from: session_transcript
  viz: table
  columns:
  - key: at
    label: Started
  - key: kind
    label: What
  - key: ended_at
    label: Ended
  - key: prompt
    label: Prompt
  - key: answer
    label: Answer
  - key: tool_calls
    label: Tool calls
  - key: time
    label: Time
  empty: No turns are recorded for this session.
  actions:
  - id: resume
    label: Resume in a new session
    command: oxplow.agent_session.open
    row: true
    input:
      thread: '{{row.thread_id_bare}}'
      harness: '{{row.harness}}'
      resume: '{{row.conversation}}'
actions:
- id: reopen
  label: Reopen
  command: oxplow.agent_session.reopen
  input:
    session: '{{param.session}}'
