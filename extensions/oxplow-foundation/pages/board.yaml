title: Board
description: The work items of this thread, the backlog, or everything, as cards in a column per state. Drag a card to a column to move it through the work list; right-click for Move To.
icon: columns-3
category: Work
keywords: kanban columns state work items
params:
- name: thread_id
- name: show
  type: choice
  role: filter
  label: Show
  default: thread
  options:
  - value: thread
    label: This thread
  - value: backlog
    label: Backlog
  - value: all
    label: Everything
data:
  row:
    sql: |
      SELECT CASE WHEN :show = 'backlog' THEN 'backlog'
                  WHEN :show = 'thread' AND :thread_id IS NOT NULL THEN 'thread'
                  ELSE 'all' END AS scope
    columns:
    - key: scope
  board:
    sql: |
      SELECT w.uri, w.title, w.state,
             (SELECT group_concat(n.value, ' · ')
                FROM json_each(CASE WHEN json_valid(w.native) THEN w.native ELSE '{}' END) n
               WHERE n.key IN (SELECT json_extract(f.value, '$.name')
                                 FROM v_capability_provider cp, json_each(CASE WHEN json_valid(cp.fields) THEN cp.fields ELSE '[]' END) f
                                WHERE cp.capability = 'work_items' AND cp.active = 1
                                  AND json_extract(f.value, '$.kind') = 'enum'
                                  AND coalesce(json_extract(f.value, '$.read_only'), 0) = 0)
                 AND n.value IS NOT NULL) AS fields,
             (SELECT CASE count(*) WHEN 0 THEN '' WHEN 1 THEN '1 comment' ELSE count(*) || ' comments' END
                FROM v_work_item_comment c WHERE c.uri = w.uri) AS comments,
             w.state <> 'todo' AS not_todo, w.state <> 'in_progress' AS not_in_progress,
             w.state <> 'blocked' AS not_blocked, w.state <> 'done' AS not_done, w.state <> 'canceled' AS not_canceled
      FROM v_work_item w
      WHERE CASE :scope WHEN 'backlog' THEN w.thread_id IS NULL
                        WHEN 'thread' THEN w.thread_id = :thread_id
                        ELSE 1 END
      ORDER BY w.rank, w.created_at
    params:
      scope:
        from: row.scope
view:
  stack:
  - id: board
    replaceable: work_item.board
    title: Board
    from: board
    viz: board
    group:
      by: state
      values:
      - todo
      - in_progress
      - blocked
      - done
      - canceled
    columns:
    - key: title
      label: Task
      link:
        kind: page
        from: uri
    - key: fields
      label: Fields
    - key: comments
      label: Comments
    empty: No work items here.
    actions:
    - id: move
      label: Move
      command: oxplow.work_item.transition
      drag: true
      input:
        uri: '{{row.uri}}'
        to: '{{group.value}}'
    - id: to-todo
      label: Move to To Do
      command: oxplow.work_item.transition
      row: true
      when: not_todo
      input:
        uri: '{{row.uri}}'
        to: todo
    - id: to-in-progress
      label: Move to In Progress
      command: oxplow.work_item.transition
      row: true
      when: not_in_progress
      input:
        uri: '{{row.uri}}'
        to: in_progress
    - id: to-blocked
      label: Move to Blocked
      command: oxplow.work_item.transition
      row: true
      when: not_blocked
      input:
        uri: '{{row.uri}}'
        to: blocked
    - id: to-done
      label: Move to Done
      command: oxplow.work_item.transition
      row: true
      when: not_done
      input:
        uri: '{{row.uri}}'
        to: done
    - id: to-canceled
      label: Move to Canceled
      command: oxplow.work_item.transition
      row: true
      when: not_canceled
      input:
        uri: '{{row.uri}}'
        to: canceled
