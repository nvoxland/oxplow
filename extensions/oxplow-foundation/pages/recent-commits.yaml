title: Recent commits
description: The newest commits in the indexed history. For another branch or history past the index, use `oxplow_vcs_log`.
params:
- name: limit
  role: filter
  label: Commits
  default: 20
answers:
- {"question":"What were the latest commits on this stream?","params":{},"skill":"oxplow-codebase"}
loaders:
  recent_commits:
    sql: |
      SELECT c.sha, substr(c.sha, 1, 7) AS short, c.committed_at, c.author, c.subject
      FROM v_commit c
      ORDER BY c.committed_at DESC
      LIMIT :limit
# A list, as the Git dashboard's Recent Commits: the subject headlined, the
# rest on a line under it, so it reads in the page's column.
view:
  from: recent_commits
  viz: list
  columns:
  - key: subject
    label: Subject
    link:
      kind: commit
      from: sha
  - key: short
    label: Commit
  - key: author
    label: Who
  - key: committed_at
    label: When
    format: datetime
  empty: No commits are indexed.
