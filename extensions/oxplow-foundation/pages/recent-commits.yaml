title: Recent commits
description: The newest commits on the stream's own history; the scope widens to every indexed branch. For history past the index, use `oxplow_vcs_log`.
params:
- name: stream_id
- name: scope
  type: choice
  role: filter
  label: Branches
  options: [{ value: stream, label: This stream }, { value: all, label: Every indexed branch }]
  default: stream
- name: limit
  role: filter
  label: Commits
  default: 20
answers:
- {"question":"What were the latest commits on this stream?","params":{},"skill":"oxplow-codebase"}
loaders:
  recent_commits:
    sql: |
      -- The stream's history: every commit reachable from its head.
      WITH RECURSIVE reach(sha) AS (
        SELECT head_sha FROM v_stream WHERE id = :stream_id
        UNION
        SELECT p.value FROM reach JOIN v_commit c ON c.sha = reach.sha, json_each(c.parents) p
      )
      SELECT c.sha, substr(c.sha, 1, 7) AS short, c.committed_at, c.author, c.subject
      FROM v_commit c
      WHERE :scope = 'all' OR c.sha IN (SELECT sha FROM reach)
      ORDER BY c.committed_at DESC
      LIMIT :limit
# A list, as the Git dashboard's Recent Commits: the subject headlined, the
# rest on a line under it, so it reads in the page's column.
view:
  from: recent_commits
  viz: list
  columns:
  - key: subject
    label: Subject
    link:
      kind: commit
      from: sha
  - key: short
    label: Commit
  - key: author
    label: Who
  - key: committed_at
    label: When
    format: datetime
  empty: No commit in this history.
