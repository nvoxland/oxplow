title: "Thread notes"
description: "The notes left on a thread, newest first."
hidden: true
tool: thread_notes
params:
- name: thread
  default: ""
answers:
- {"question":"What notes were recorded on this thread?","params":{"thread":"thr1"},"skill":"work-items"}
data:
  thread_notes:
    sql: "SELECT n.uri, n.created_at, n.author, n.body FROM v_thread_note n WHERE n.thread_id = (SELECT id FROM v_thread WHERE uri = uri('oxplow/thread', 'id', :thread)) ORDER BY n.created_at DESC, n.id DESC"
view: { viz: table, from: thread_notes }
