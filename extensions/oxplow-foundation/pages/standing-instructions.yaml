title: "Standing instructions"
description: "The instructions the person set for a thread and its stream."
params:
- name: thread
  default: "oxplow:oxplow/thread?id=thr1"
answers:
- {"question":"What standing instructions did the person set for this thread and its stream?","about":"oxplow/thread","params":{"thread":"oxplow:oxplow/thread?id=thr1"},"skill":"oxplow-runtime"}
loaders:
