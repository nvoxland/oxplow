title: Go To
description: 'Where to go: the pages you bookmarked, then the pages you visited — recently, and the most over the last 30 days.'
icon: star
category: Work
keywords: bookmarks visits recent history
params:
- name: thread_id
loaders:
  # What the thread sees, the rule the rail's Go To panel reads too.
  bookmarks:
    page: oxplow/thread-bookmarks
    loader: bookmarks
    params: { thread_id: { param: thread_id } }
  recent:
    sql: |
      SELECT coalesce(nullif(trim(w.title), ''), nullif(trim(v.label), ''), v.uri) AS title, v.page_kind, v.uri
      FROM (
        SELECT page_id AS uri, page_kind, label, visited_at,
               row_number() OVER (PARTITION BY page_id ORDER BY visited_at DESC, id DESC) AS latest
        FROM v_page_visit
        WHERE thread_id = :thread_id AND page_kind <> 'agent_session'
      ) v
      LEFT JOIN v_knowledge_page w ON w.uri = v.uri
      WHERE v.latest = 1
      ORDER BY v.visited_at DESC
      LIMIT 25
  top:
    sql: |
      SELECT coalesce(nullif(trim(w.title), ''), nullif(trim(top.label), ''), top.uri) AS title,
             top.page_kind, top.uri, top.visits
      FROM (
        SELECT v.page_id AS uri,
               max(v.page_kind) AS page_kind,
               max(v.label) AS label,
               count(*) AS visits,
               max(v.visited_at) AS last
        FROM v_page_visit v
        JOIN v_thread t ON t.id = v.thread_id
        WHERE t.stream_id = (SELECT stream_id FROM v_thread WHERE id = :thread_id)
          AND v.page_kind <> 'agent_session'
          AND v.visited_at >= strftime('%Y-%m-%dT%H:%M:%SZ', 'now', '-30 days')
        GROUP BY v.page_id
      ) top
      LEFT JOIN v_knowledge_page w ON w.uri = top.uri
      ORDER BY top.visits DESC, top.last DESC
      LIMIT 25
view:
  stack:
  - id: bookmarks
    title: Bookmarks
    from: bookmarks
    viz: table
    columns:
    - key: title
      label: Page
      icon: page_kind
      link:
        kind: page
        from: uri
    - key: scope
      label: Scope
      width: 90
    empty: No bookmarks yet. Star a page to pin it here.
    actions:
    - id: to-thread
      label: Move to this thread
      command: oxplow.bookmark.set
      input:
        uri: '{{row.uri}}'
        page_kind: '{{row.page_kind}}'
        label: '{{row.title}}'
        scope: thread
        thread: '{{row.thread}}'
      row: true
    - id: to-stream
      label: Move to this stream
      command: oxplow.bookmark.set
      input:
        uri: '{{row.uri}}'
        page_kind: '{{row.page_kind}}'
        label: '{{row.title}}'
        scope: stream
        thread: '{{row.thread}}'
      row: true
    - id: to-project
      label: Move to the project
      command: oxplow.bookmark.set
      input:
        uri: '{{row.uri}}'
        page_kind: '{{row.page_kind}}'
        label: '{{row.title}}'
        scope: project
        thread: '{{row.thread}}'
      row: true
    - id: remove
      label: Remove bookmark
      command: oxplow.bookmark.remove
      input:
        uri: '{{row.uri}}'
        thread: '{{row.thread}}'
      row: true
  - id: recent
    title: Recently visited
    from: recent
    viz: table
    columns:
    - key: title
      label: Page
      icon: page_kind
      link:
        kind: page
        from: uri
    empty: No visits yet. Pages you open show up here, most recent first.
  - id: top
    title: Most visited
    from: top
    viz: table
    columns:
    - key: title
      label: Page
      icon: page_kind
      link:
        kind: page
        from: uri
    - key: visits
      label: Visits
      width: 80
    empty: No visits yet. The pages you open most over the last 30 days show up here.
