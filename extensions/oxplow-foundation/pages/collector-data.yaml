title: Collector data
description: One collector's run history, the row counts from its last successful run, and the facts it recorded.
label: '{{row.name}} data'
icon: activity
for: oxplow/collector
default: true
params:
- name: uri
  label: Collector
- name: range
  type: date_range
  role: filter
  label: Range
  default: 7d
  presets: [1d, 7d, 30d, 90d, all]
answers:
- {"question":"What did this collector record?","about":"oxplow/collector","params":{"uri":"oxplow:oxplow/collector?collector=oxplow/oxplow.request_outcome"},"skill":"oxplow-extension"}
loaders:
  about:
    sql: |
      SELECT k.id AS name, k.description, k.uri, k.id, k.namespace,
             k.last_run_at, k.last_outcome,
             NULLIF((SELECT json_group_array(json_object('text', j.key || ': ' || j.value))
                     FROM json_each(k.row_counts_json) j), '[]') AS row_counts
      FROM v_collector k WHERE k.uri = :uri
  runs:
    sql: |
      SELECT r.run_id, r.started_at, r.outcome, r.error, r.version, r.cpu_ms, r.ai_calls,
             NULLIF((SELECT json_group_array(json_object('text', j.key || ': ' || j.value))
                     FROM json_each(r.row_counts_json) j), '[]') AS row_counts
      FROM about k JOIN v_collector_run r ON r.owner = k.namespace AND r.id = k.id
      WHERE (:range_from IS NULL OR r.started_at >= :range_from)
        AND (:range_to IS NULL OR r.started_at <= :range_to)
      ORDER BY r.started_at DESC, r.run_id DESC LIMIT 200
  # A fact collector's captures carry its id as their producer; a report collector
  # records under the producer its report names, so it may have none here.
  recorded:
    sql: |
      SELECT f.captured_at, f.measure_key, f.value, f.subject, f.path, f.branch
      -- Its captures first, then their facts: a join the other way scans
      -- every fact.
      FROM v_fact f
      WHERE f.capture_id IN (
              SELECT c.id FROM v_capture c
              WHERE c.producer = (SELECT id FROM about)
                AND (:range_from IS NULL OR c.captured_at >= :range_from)
                AND (:range_to IS NULL OR c.captured_at <= :range_to))
      ORDER BY f.id DESC LIMIT 200
view:
  stack:
  - id: about
    title: About
    viz: detail
    from: about
    columns:
    - { key: name, label: Collector }
    - { key: description, label: What it gathers }
    - { key: last_run_at, label: Last run, format: datetime }
    - { key: last_outcome, label: Last outcome }
    - { key: row_counts, label: Rows after the last successful run, format: items }
    empty: This collector isn't known to the project.
  - id: runs
    title: Runs
    viz: table
    from: runs
    columns:
    - { key: started_at, label: When, format: datetime, expand: oxplow/run-details }
    - { key: outcome, label: Outcome }
    - { key: error, label: Error }
    - { key: version, label: Version }
    - { key: cpu_ms, label: CPU, format: duration }
    - { key: ai_calls, label: Model calls }
    - { key: row_counts, label: Rows, format: items }
    empty: No runs in this range.
  - id: recorded
    title: Facts it recorded
    viz: table
    chartable: true
    from: recorded
    columns:
    - { key: captured_at, label: Captured, format: datetime }
    - { key: measure_key, label: Measure }
    - { key: value, label: Value }
    - { key: subject, label: Subject }
    - { key: path, label: Path }
    - { key: branch, label: Branch }
    empty: 'Nothing recorded yet.'
