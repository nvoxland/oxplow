title: Commit
description: 'One commit: its message and who made it, its changed files, and the analysis other extensions add. The renderer of oxplow''s `commit` resource.'
label: '{{param.sha|short}}'
for: oxplow/commit
default: true
params:
- name: uri
  label: Commit
- name: sha
- name: stream_id
answers:
- {"question":"What did this commit change?","about":"oxplow/commit","params":{"sha":"abc123","stream_id":1},"skill":"oxplow-codebase"}
loaders:
  # First, so the page's actions read it: whether the stream's branch
  # carries the commit, by a walk over parents from the stream's head.
  # Revert is offered when it does, Cherry-pick when it doesn't. Its own
  # loader: `row` names the change plainly, which makes it on demand.
  branch:
    sql: |
      WITH RECURSIVE reach(sha) AS (
        SELECT head_sha FROM v_stream WHERE id = :stream_id
        UNION
        SELECT p.value FROM reach JOIN v_commit c ON c.sha = reach.sha, json_each(c.parents) p
      )
      SELECT EXISTS (SELECT 1 FROM reach WHERE sha = :sha) AS in_history,
             NOT EXISTS (SELECT 1 FROM reach WHERE sha = :sha) AS not_in_history
  row:
    sql: |
      SELECT id AS change_id, base_revision, head_revision
      FROM v_change WHERE kind = 'commit' AND target = :sha
    columns:
    - key: change_id
    - key: base_revision
    - key: head_revision
  detail:
    sql: |
      -- The message whole, subject first; the parents as facts: the first
      -- is the line the commit sits on, the second (a merge's) what came in.
      SELECT subject, CASE WHEN body = '' THEN subject ELSE subject || char(10, 10) || body END AS message,
             author || CASE WHEN email = '' THEN '' ELSE ' <' || email || '>' END AS author,
             committed_at, sha,
             CASE WHEN :in_history THEN 'Yes' ELSE 'No' END AS on_branch,
             first_parent, substr(first_parent, 1, 7) AS parent,
             json_extract(parents, '$[1]') AS merged_sha, substr(json_extract(parents, '$[1]'), 1, 7) AS merged
      FROM v_commit WHERE sha = :sha
    params:
      in_history:
        from: branch.in_history
  files:
    sql: |
      WITH RECURSIVE f(path, status, additions, deletions) AS (
        SELECT path, status, additions, deletions FROM v_commit_file WHERE sha = :sha
      ), d(path) AS (
        SELECT substr(path, 1, length(rtrim(path, replace(path, '/', ''))) - 1) FROM f WHERE instr(path, '/') > 0
        UNION
        SELECT substr(path, 1, length(rtrim(path, replace(path, '/', ''))) - 1) FROM d WHERE instr(path, '/') > 0
      )
      SELECT path AS id,
             CASE WHEN instr(path, '/') > 0 THEN substr(path, 1, length(rtrim(path, replace(path, '/', ''))) - 1) END AS parent,
             substr(path, length(rtrim(path, replace(path, '/', ''))) + 1) AS name,
             'folder' AS icon, NULL AS file, :base_revision AS base_revision, :head_revision AS head_revision
      FROM d
      UNION ALL
      SELECT path, CASE WHEN instr(path, '/') > 0 THEN substr(path, 1, length(rtrim(path, replace(path, '/', ''))) - 1) END,
             substr(path, length(rtrim(path, replace(path, '/', ''))) + 1), status, path, :base_revision, :head_revision
      FROM f
      ORDER BY 1
    params:
      base_revision:
        from: row.base_revision
      head_revision:
        from: row.head_revision
# Page actions, in the nav bar's menu: each only where it makes sense on
# the stream the page is open in (`when` reads the first loader's row).
actions:
- id: cherry-pick
  label: Cherry-pick
  command: oxplow.git.cherry_pick
  when: not_in_history
  input:
    stream: str{{param.stream_id}}
    rev: '{{param.sha}}'
- id: revert
  label: Revert
  command: oxplow.git.revert
  when: in_history
  input:
    stream: str{{param.stream_id}}
    rev: '{{param.sha}}'
view:
  stack:
  - id: detail
    title: About
    from: detail
    viz: detail
    lead: message
    columns:
    - key: committed_at
      label: Date
    - key: author
      label: Author
    - key: sha
      label: Commit
    - key: on_branch
      label: On this branch
    - key: parent
      label: Parent
      link:
        kind: commit
        from: first_parent
    - key: merged
      label: Merged
      when: merged_sha
      link:
        kind: commit
        from: merged_sha
    empty: Commit not found.
  - id: files
    title: Files
    from: files
    viz: tree
    tree:
      id: id
      parent: parent
      label: name
    columns:
    - key: name
      label: File
      icon: icon
      link:
        kind: diff-at
        from: file
        base: base_revision
        head: head_revision
    empty: The commit changed no files.
  - slot: sections
see_also:
  - { page: oxplow-foundation/git-history }
