title: File history
description: The commits that touched a file, or any file under a folder, newest first, on the stream's branch alone. For another branch or history past the index, use `oxplow_vcs_log`.
params:
- name: path
  label: File or folder (a repository path)
- name: stream_id
- name: limit
  role: filter
  label: Commits
  default: 20
answers:
- {"question":"Which commits touched this file, newest first?","about":"oxplow/file","params":{"path":"src/lib.rs"},"skill":"oxplow-codebase"}
- {"question":"What is the recent history of this file?","about":"oxplow/file","params":{"path":"src/lib.rs"},"skill":"oxplow-codebase"}
- {"question":"Who has changed this file the most?","about":"oxplow/file","params":{"path":"src/lib.rs"},"skill":"oxplow-codebase"}
loaders:
  row:
    sql: |
      SELECT coalesce(s.branch, 'detached at ' || substr(s.head_sha, 1, 7)) AS branch
      FROM v_stream s WHERE s.id = :stream_id
    columns:
    - key: branch
  file_history:
    sql: |
      -- The stream's history: every commit reachable from its head.
      WITH RECURSIVE reach(sha) AS (
        SELECT head_sha FROM v_stream WHERE id = :stream_id
        UNION
        SELECT p.value FROM reach JOIN v_commit c ON c.sha = reach.sha, json_each(c.parents) p
      )
      -- A file's commits, or a folder's: those that touched a file under it,
      -- once each, their lines summed.
      SELECT c.sha, substr(c.sha, 1, 7) AS short, c.committed_at, c.author, c.subject,
             CASE WHEN count(*) = 1 THEN max(f.status) END AS status,
             sum(f.additions) AS additions, sum(f.deletions) AS deletions,
             -- A modification is said by its counts alone.
             CASE WHEN count(*) > 1 THEN count(*) || ' files'
                  WHEN max(f.status) = 'added' THEN 'created'
                  WHEN max(f.status) = 'modified' THEN NULL
                  ELSE max(f.status) END AS change,
             '+' || sum(f.additions) AS added, '−' || sum(f.deletions) AS removed,
             'success' AS added_tone, 'danger' AS removed_tone
      FROM v_commit c JOIN v_commit_file f ON f.sha = c.sha
      WHERE (f.path = :path OR substr(f.path, 1, length(:path) + 1) = :path || '/')
        AND c.sha IN (SELECT sha FROM reach)
      GROUP BY c.sha
      ORDER BY c.committed_at DESC
      LIMIT :limit
# A list, as the Git dashboard's Recent Commits: the subject headlined, the
# rest on a line under it, so it reads in the page's column.
view:
  from: file_history
  viz: list
  columns:
  - key: subject
    label: Subject
    link:
      kind: commit
      from: sha
  - key: short
    label: Commit
  - key: author
    label: Who
  - key: committed_at
    label: When
    format: datetime
  - key: change
    label: Change
  - key: added
    label: Added
    tone: added_tone
  - key: removed
    label: Removed
    tone: removed_tone
  empty: No commit on this branch touched it.
# The branch whose history this is, said in the rail: it is about the page,
# not a section of it.
rail:
  id: about
  title: About
  from: row
  viz: detail
  columns:
  - key: branch
    label: Branch
