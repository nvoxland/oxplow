title: File history
description: The commits that touched a file, newest first, from the indexed history. For history past the index, use `oxplow_vcs_log`.
hidden: true
tool: file_history
params:
- name: path
  label: File (a repository path)
- name: limit
  role: filter
  label: Commits
  default: 20
data:
  file_history:
    sql: |
      SELECT c.sha, c.committed_at, c.author, c.subject, f.status, f.additions, f.deletions
      FROM v_commit c JOIN v_commit_file f ON f.sha = c.sha
      WHERE f.path = :path
      ORDER BY c.committed_at DESC
      LIMIT :limit
view:
  from: file_history
  viz: table
  columns:
  - key: sha
    label: Commit
  - key: committed_at
    label: When
  - key: author
    label: Author
  - key: subject
    label: Subject
  - key: status
    label: Change
  empty: No indexed commit touched it.
