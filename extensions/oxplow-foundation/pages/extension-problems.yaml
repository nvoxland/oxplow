title: Extension problems
description: "Everything wrong with an extension, a subsection each under its name: contributions that failed or stopped after failing, permissions waiting for approval, and load errors."
icon: triangle-alert
category: System
keywords: failing disabled repair collector effect provider
params:
- name: extension
  role: view
  label: Extension
answers:
- {"question":"Which extension providers or collectors are failing or disabled, and why?","params":{},"skill":"oxplow-extension"}
- {"question":"What is wrong with this extension?","about":"oxplow/extension","params":{"extension":"oxplow-foundation"},"skill":"oxplow-extension"}
loaders:
  problems:
    sql: |
      SELECT h.kind || ' ' || h.contribution AS title, h.namespace || '/' || h.kind || '/' || h.contribution AS id,
             e.uri AS extension_uri, e.name AS extension, h.kind, h.contribution,
             CASE h.state
               WHEN 'disabled' THEN 'Stopped after ' || coalesce(h.reason, 'repeated failures') || '.'
               ELSE 'Failing, ' || h.consecutive_failures || ' in a row.' END AS what,
             h.last_error AS error, h.last_ok_at, h.updated_at,
             (h.state = 'disabled') AS can_enable,
             (h.state = 'disabled' AND h.repair_item IS NOT NULL) AS can_repair,
             'Repair the extension described in [oxplow uri ' || coalesce(h.repair_item, '') || '] — read it first.' AS ask,
             NULL AS approves, h.namespace
      -- Health is the namespace's; it is listed under the extension that
      -- declares the contribution now.
      FROM v_contribution_health h
      JOIN v_extension e ON e.name = COALESCE((SELECT c.extension FROM v_contribution c WHERE c.uri = h.uri), (SELECT x.name FROM v_extension x WHERE x.namespace = h.namespace ORDER BY x.name LIMIT 1))
      WHERE h.state <> 'ok' AND (NULLIF(:extension, '') IS NULL OR e.name = :extension)
      UNION ALL
      SELECT 'Did not load cleanly', e.name || '/load/' || j.key, e.uri, e.name, 'extension', e.name,
             NULL, json_extract(j.value, '$.shown'), NULL, NULL, 0, 0, '', NULL, e.namespace
      FROM v_extension e, json_each(e.errors) j
      WHERE NULLIF(:extension, '') IS NULL OR e.name = :extension
      UNION ALL
      -- What its source asks for that nobody approved: a pending line is
      -- `<what> — <what it allows>`; the person approves on its page (Deploy),
      -- or, when an agent already asked to deploy it, decides that request
      -- on the Alerts page (one decision, not two).
      SELECT 'Needs your approval to run', e.name || '/approval', e.uri, e.name, 'extension', e.name,
             NULL,
             CASE WHEN EXISTS (SELECT 1 FROM v_command_proposal p
                               WHERE p.decision = 'pending'
                                 AND p.command IN ('oxplow.extension.deploy', 'oxplow.extension.enable', 'oxplow.extension.rollback')
                                 AND json_extract(p.input, '$.name') = e.name)
                  THEN 'An agent asked to deploy it: decide that under Needs your decision on the Alerts page.'
                  ELSE 'Deploy it on its page to approve.' END,
             NULL, NULL, 0, 0, '',
             (SELECT json_group_array(json_object(
                       'text', CASE WHEN instr(j.value, ' — ') > 0 THEN substr(j.value, 1, instr(j.value, ' — ') - 1) ELSE j.value END,
                       'hint', CASE WHEN instr(j.value, ' — ') > 0 THEN substr(j.value, instr(j.value, ' — ') + 3) END)
                     ORDER BY j.value)
              FROM json_each(e.pending) j),
             e.namespace
      FROM v_extension e
      WHERE json_array_length(e.pending) > 0 AND (NULLIF(:extension, '') IS NULL OR e.name = :extension)
      ORDER BY 4, 5, 6
view:
  from: problems
  viz: sections
  sections: { title: title, id: id, body: error, group: extension, group_link: extension_uri }
  columns:
  - { key: kind, label: Kind }
  - { key: what, label: State }
  - { key: approves, label: Waiting for your approval, format: items }
  - { key: last_ok_at, label: Last worked, format: relative }
  empty: Nothing is wrong with any extension.
  actions:
  - id: enable
    label: Start Again
    command: oxplow.contribution.enable
    row: true
    when: can_enable
    input:
      namespace: '{{row.namespace}}'
      kind: '{{row.kind}}'
      contribution: '{{row.contribution}}'
  - id: repair
    label: Repair with the Agent
    command: oxplow.agent.draft
    row: true
    when: can_repair
    input:
      text: '{{row.ask}}'
  - id: enable-all
    label: Start All Stopped
    command: oxplow.contribution.enable_all
    input: {}
    all: true
