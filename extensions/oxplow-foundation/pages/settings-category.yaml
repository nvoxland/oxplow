title: Settings category
label: 'Settings: {{param.category}}'
description: Edit any registered setting at an explicit local, project or global level, with effective values and inheritance shown separately.
icon: settings
refresh: true
see_also:
- { page: oxplow/settings }
- { page: oxplow/management }
params:
- { name: category, role: view, default: '' }
- { name: q, type: search, role: filter, label: Search settings, default: '' }
- name: show
  type: choice
  role: filter
  label: Show
  options: [{ value: all, label: All }, { value: changed, label: Changed }]
  default: all
- { name: setting, role: view, default: '' }
loaders:
  settings:
    sql: |
      SELECT * FROM v_config_value
      WHERE (coalesce(:category, '') = '' OR category = :category)
        AND (coalesce(:setting, '') = '' OR key = :setting)
        AND (coalesce(:q, '') = '' OR instr(lower(key), lower(:q)) > 0
          OR instr(lower(coalesce(title, '')), lower(:q)) > 0
          OR instr(lower(coalesce(doc, '')), lower(:q)) > 0
          OR instr(lower(coalesce(value, '')), lower(:q)) > 0
          OR instr(lower(coalesce(local_value, '')), lower(:q)) > 0
          OR instr(lower(coalesce(project_value, '')), lower(:q)) > 0
          OR instr(lower(coalesce(global_value, '')), lower(:q)) > 0)
        -- Changed: some level overrides it.
        AND (coalesce(:show, 'all') <> 'changed'
          OR 'set' IN (local_status, project_status, global_status))
      ORDER BY category_order, category_title, setting_order, key
view:
  id: settings-editor
  from: settings
  viz: settings
