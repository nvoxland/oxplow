title: Files
description: "The project's files as a tree, or only what changed (in the working tree, since the default branch or the upstream). The launcher's way into the Directory page at the worktree's root."
icon: folder-tree
category: Code
# The filters ride into the Directory page by name.
params:
- name: stream_id
- name: scope
  type: choice
  role: filter
  label: Show
  options_from: oxplow/files-scopes
  default: all
- name: compare
  type: choice
  role: filter
  label: Compare with
  options_from: oxplow/files-refs
  default: none
# The embed alone, not a section of a stack: the page is the one tree, with
# no Contents.
view:
  id: dir
  embed:
    page: oxplow/directory
    params:
      path: ''
      filesystem: oxplow:local
      rev: ''
