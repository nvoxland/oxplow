title: Thread work
description: The thread's work items — the ones assigned to it, in progress first, then to do, blocked and backlog in its queue's order, then the ones it finished, newest first — with the efforts that worked on each.
tool: thread_work
params:
- name: thread
  label: Thread (`thr3`)
answers:
- {"question":"What is assigned to this thread, and what has it finished?","params":{"thread":"thr1"},"skill":"work-items"}
loaders:
  thread_work:
    sql: |
      SELECT w.uri, w.title, w.state,
             coalesce((SELECT group_concat(e.uri, ' ') FROM v_effort e WHERE e.work_item = w.uri), '') AS efforts
      FROM v_work_item w
      WHERE w.assignee = uri('oxplow/thread', 'id', :thread)
         OR (w.state IN ('done', 'canceled')
             AND EXISTS (SELECT 1 FROM v_effort e JOIN v_thread t ON t.id = e.thread_id
                          WHERE e.work_item = w.uri AND t.uri = uri('oxplow/thread', 'id', :thread)))
      ORDER BY CASE w.state WHEN 'in_progress' THEN 0 WHEN 'todo' THEN 1 WHEN 'blocked' THEN 2
                            WHEN 'backlog' THEN 3 WHEN 'done' THEN 4 ELSE 5 END,
               CASE WHEN w.state IN ('done', 'canceled') THEN w.closed_at END DESC,
               coalesce(w.rank, 1e18),
               w.created_at
view:
  from: thread_work
  viz: table
  columns:
  - key: title
    label: Item
    link:
      kind: page
      from: uri
  - key: state
    label: State
  - key: efforts
    label: Efforts
  empty: The thread has no work items.
