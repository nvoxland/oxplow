title: Extension
description: One extension — where it comes from, its version, permissions and problems, everything it contributes by kind, and its deployments.
label: '{{param.name}}'
icon: package
for: oxplow/extension
default: true
params:
- name: uri
  label: Extension
- name: name
answers:
- {"question":"What does this extension contribute, and which deployment runs?","about":"oxplow/extension","params":{"uri":"oxplow:oxplow/extension?name=oxplow-foundation","name":"oxplow-foundation"},"skill":"oxplow-extension"}
- {"question":"What may this extension reach?","about":"oxplow/extension","params":{"uri":"oxplow:oxplow/extension?name=oxplow-foundation","name":"oxplow-foundation"},"skill":"oxplow-extension"}
loaders:
  # The row the page's actions read, and the link to its running manifest.
  about:
    sql: |
      SELECT c.name AS extension, c.description,
             CASE WHEN c.deployment IN ('deployed', 'shipped', 'source') THEN
                    uri('oxplow/file', 'filesystem', 'oxplow:extensions', 'path', c.name || '/extension.yaml')
                    || '#oxplow.renderer=oxplow-foundation/file-viewer' END AS manifest_target,
             (s.hash IS NOT NULL AND (c.deployment = 'undeployed'
                OR (c.hash IS NOT NULL AND s.hash != c.hash))) AS can_deploy,
             (c.deployment = 'deployed') AS can_rollback,
             (NOT c.enabled) AS can_enable,
             (c.enabled AND c.name != 'oxplow-foundation') AS can_disable,
             (c.origin = 'project') AS can_remove,
             (c.origin = 'project' AND NOT c.shared AND s.path LIKE '.oxplow/extensions/%') AS can_share,
             (c.origin = 'project' AND c.shared) AS can_unshare
      FROM content c LEFT JOIN v_extension_source s ON s.name = c.name
  summary:
    page: oxplow-foundation/extension-facts
    loader: summary
    params: { extension: { from: about.extension } }
  reach:
    page: oxplow-foundation/extension-facts
    loader: reach
    params: { extension: { from: about.extension } }
  about_facts:
    sql: |
      SELECT a.description, s.origin_text, s.origin_target, s.version_text, s.permission_items, s.problems_label, s.problems_target,
             CASE WHEN a.manifest_target IS NOT NULL THEN 'Read its running extension.yaml' END AS manifest,
             a.manifest_target
      FROM about a LEFT JOIN summary s ON s.extension = a.extension
  # The resource kinds some page draws: a contribution of one links to it,
  # where the rest of its definition is.
  drawn:
    sql: SELECT DISTINCT j.value AS resource FROM v_page p, json_each(p.renders) j
  # Every contribution, whatever its kind, in one list: its name, what it
  # is and, when a page draws its kind, a link to it.
  contributions:
    sql: |
      SELECT kind, title, description, link FROM (
        SELECT 1 AS rank, 'Pages' AS kind, p.title, p.description,
               CASE WHEN p.running_uri IS NOT NULL THEN p.running_uri || '#oxplow.renderer=oxplow-foundation/definition' END AS link
        FROM about a JOIN v_page p ON p.extension = a.extension
        UNION ALL
        SELECT 2, 'Commands', m.id, m.summary,
               CASE WHEN d.resource IS NOT NULL THEN m.uri || '#oxplow.renderer=oxplow-foundation/command' END
        FROM about a JOIN v_command m ON m.extension = a.extension
             LEFT JOIN drawn d ON d.resource = 'oxplow/command'
        UNION ALL
        SELECT 3, 'Skills', s.name, s.description, CASE WHEN d.resource IS NOT NULL THEN s.uri END
        FROM about a JOIN v_skill s ON s.extension = a.extension
             LEFT JOIN drawn d ON d.resource = 'oxplow/skill'
        UNION ALL
        SELECT 4, 'Custom components', k.title, k.description, CASE WHEN d.resource IS NOT NULL THEN k.uri END
        FROM about a JOIN v_custom_component k ON k.extension = a.extension
             LEFT JOIN drawn d ON d.resource = 'oxplow/custom_component'
        UNION ALL
        -- A slot is a page mounted on another: named by both.
        SELECT 5, 'Slots', COALESCE(mp.title, s.page) || ' on ' || COALESCE(hp.title, s.host), mp.description,
               CASE WHEN d.resource IS NOT NULL THEN s.uri END
        FROM about a JOIN v_slot s ON s.extension = a.extension
             LEFT JOIN v_page mp ON mp.id = s.page
             LEFT JOIN v_page hp ON hp.id = s.host
             LEFT JOIN drawn d ON d.resource = 'oxplow/slot'
        UNION ALL
        SELECT 6, 'Collectors', k.id, k.description,
               CASE WHEN d.resource IS NOT NULL THEN k.uri || '#oxplow.renderer=oxplow-foundation/collector' END
        FROM about a JOIN v_collector k ON k.extension = a.extension
             LEFT JOIN drawn d ON d.resource = 'oxplow/collector'
        UNION ALL
        SELECT 7, 'Metrics', m.title, m.description, CASE WHEN d.resource IS NOT NULL THEN c.uri END
        FROM about a JOIN v_contribution c ON c.extension = a.extension AND c.kind = 'metric'
             JOIN v_metric_spec m ON m.key = c.local
             LEFT JOIN drawn d ON d.resource = 'oxplow/metric'
        UNION ALL
        SELECT 8, 'Measures', m.title, m.description,
               CASE WHEN d.resource IS NOT NULL THEN c.uri || '#oxplow.renderer=oxplow-foundation/measure' END
        FROM about a JOIN v_contribution c ON c.extension = a.extension AND c.kind = 'measure'
             JOIN v_measure m ON m.key = c.local
             LEFT JOIN drawn d ON d.resource = 'oxplow/measure'
        UNION ALL
        SELECT 9, 'Dimensions', m.label, m.description,
               CASE WHEN d.resource IS NOT NULL THEN c.uri || '#oxplow.renderer=oxplow-foundation/dimension' END
        FROM about a JOIN v_contribution c ON c.extension = a.extension AND c.kind = 'dimension'
             JOIN v_dimension m ON m.key = c.local
             LEFT JOIN drawn d ON d.resource = 'oxplow/dimension'
        UNION ALL
        SELECT 10, 'Resources', r.label, r.description,
               CASE WHEN d.resource IS NOT NULL THEN c.uri || '#oxplow.renderer=oxplow-foundation/resource' END
        FROM about a JOIN v_contribution c ON c.extension = a.extension AND c.kind = 'resource'
             JOIN v_resource r ON r.resource = c.global_name
             LEFT JOIN drawn d ON d.resource = 'oxplow/resource'
        UNION ALL
        SELECT 11, 'Implementations', i.title, i.description, CASE WHEN d.resource IS NOT NULL THEN c.uri END
        FROM about a JOIN v_contribution c ON c.extension = a.extension AND c.kind = 'implementation'
             JOIN v_capability_provider i ON i.extension = c.extension AND i.capability || '.' || i.provider = c.local
             LEFT JOIN drawn d ON d.resource = 'oxplow/implementation'
      )
      ORDER BY rank, title
  deployments:
    sql: |
      -- Newest first: the top one is what runs (unless a roll back made an
      -- older one run; that one alone offers no Roll Back to This).
      SELECT d.name, d.hash, NOT d.active AS inactive,
             strftime('%Y-%m-%d %H:%M', d.deployed_at) AS deployed,
             substr(d.hash, 1, 7) AS version,
             CASE WHEN d."commit" IS NULL THEN NULL
                  ELSE substr(d."commit", 1, 7) || CASE WHEN d.dirty THEN ' + uncommitted changes' ELSE '' END END AS "commit"
      FROM about a JOIN v_extension_deployment d ON d.name = a.extension
      ORDER BY d.deployed_at DESC
view:
  stack:
  - id: about
    title: About
    viz: detail
    from: about_facts
    lead: description
    columns:
    - { key: origin_text, label: From, link: { kind: page, from: origin_target } }
    - { key: version_text, label: Version }
    - { key: permission_items, label: Permissions, format: items }
    - { key: problems_label, label: Problems, link: { kind: page, from: problems_target } }
    - { key: manifest, label: Manifest, link: { kind: page, from: manifest_target } }
    empty: This extension isn't known to the project.
  - id: contributions
    title: Contributions
    description: 'Everything the extension brings, by kind: its pages, commands, skills, components, slots, collectors, metrics, measures, dimensions, resources and capability implementations. A name is a link when a page draws that kind.'
    viz: table
    from: contributions
    group:
      by: kind
    columns:
    - { key: title, label: Name, link: { kind: page, from: link } }
    - { key: description, label: What it is }
    empty: No contributions.
  - id: deployments
    title: Deployments
    viz: table
    from: deployments
    empty: No deployments yet. A deploy copies the extension's source here.
    columns:
    - { key: deployed, label: Deployed }
    - { key: version, label: Version }
    - { key: commit, label: From commit }
    actions:
    - id: rollback
      label: Roll Back to This
      command: oxplow.extension.rollback
      input:
        name: '{{row.name}}'
        to: '{{row.hash}}'
      row: true
      when: inactive
  - slot: runs
actions:
- id: deploy
  label: Deploy
  command: oxplow.extension.deploy
  input:
    name: '{{row.extension}}'
  when: can_deploy
- id: rollback
  label: Roll Back
  command: oxplow.extension.rollback
  input:
    name: '{{row.extension}}'
  when: can_rollback
- id: enable
  label: Enable
  command: oxplow.extension.enable
  input:
    name: '{{row.extension}}'
  when: can_enable
- id: disable
  label: Disable
  command: oxplow.extension.disable
  input:
    name: '{{row.extension}}'
  when: can_disable
- id: share
  label: Share with the Team
  command: oxplow.extension.share
  input:
    name: '{{row.extension}}'
  when: can_share
- id: unshare
  label: Stop Sharing
  command: oxplow.extension.unshare
  input:
    name: '{{row.extension}}'
  when: can_unshare
- id: remove
  label: Remove…
  command: oxplow.extension.remove
  input:
    name: '{{row.extension}}'
  when: can_remove
see_also:
  - { page: oxplow-foundation/extensions }
  - { page: oxplow-foundation/extension-problems, params: { extension: { from: about.extension } } }
