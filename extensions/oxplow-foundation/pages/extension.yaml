title: Extension
description: One extension — where it comes from, what runs, what it contributes, what it may reach, its pages and its deployments. The renderer of oxplow's `extension` resource.
label: '{{param.name}}'
icon: package
for: oxplow/extension
default: true
params:
- name: uri
  label: Extension
- name: name
answers:
- {"question":"What does this extension contribute, and which deployment runs?","about":"oxplow/extension","params":{"uri":"oxplow:oxplow/extension?name=oxplow-foundation","name":"oxplow-foundation"},"skill":"oxplow-extension"}
- {"question":"What may this extension reach?","about":"oxplow/extension","params":{"uri":"oxplow:oxplow/extension?name=oxplow-foundation","name":"oxplow-foundation"},"skill":"oxplow-extension"}
loaders:
  # The row the page's actions read, and the link to its running manifest.
  about:
    sql: |
      SELECT c.name AS extension, c.description,
             CASE WHEN c.deployment IN ('deployed', 'shipped', 'source') THEN
                    uri('oxplow/file', 'filesystem', 'oxplow:extensions', 'path', c.name || '/extension.yaml')
                    || '#oxplow.renderer=oxplow-foundation/file-viewer' END AS manifest_target,
             (s.hash IS NOT NULL AND (c.deployment = 'undeployed'
                OR (c.hash IS NOT NULL AND s.hash != c.hash))) AS can_deploy,
             (c.deployment = 'deployed') AS can_rollback,
             (NOT c.enabled) AS can_enable,
             (c.enabled AND c.name != 'oxplow-foundation') AS can_disable,
             (c.origin = 'project') AS can_remove,
             (c.origin = 'project' AND NOT c.shared AND s.path LIKE '.oxplow/extensions/%') AS can_share,
             (c.origin = 'project' AND c.shared) AS can_unshare
      FROM content c LEFT JOIN v_extension_source s ON s.name = c.name
  summary:
    page: oxplow-foundation/extension-facts
    loader: summary
    params: { extension: { from: about.extension } }
  reach:
    page: oxplow-foundation/extension-facts
    loader: reach
    params: { extension: { from: about.extension } }
  about_facts:
    sql: |
      SELECT a.description, s.origin_text, s.runs_text, s.permission_items, s.problems_label, s.problems_target,
             CASE WHEN a.manifest_target IS NOT NULL THEN 'Read its running extension.yaml' END AS manifest,
             a.manifest_target
      FROM about a LEFT JOIN summary s ON s.extension = a.extension
  contributions:
    sql: |
      SELECT count(*) || ' ' || kind || CASE WHEN count(*) = 1 THEN '' ELSE 's' END AS text
      FROM v_contribution WHERE extension = (SELECT extension FROM about) AND kind <> 'page'
      GROUP BY kind ORDER BY kind
  pages:
    sql: |
      SELECT p.title, p.id, p.description,
             CASE WHEN p.running_uri IS NOT NULL THEN p.running_uri || '#oxplow.renderer=oxplow-foundation/definition' END AS definition
      FROM about a JOIN v_page p ON p.extension = a.extension
      ORDER BY p.title
  permissions:
    sql: |
      SELECT upper(substr(text, 1, 1)) || substr(text, 2) || '.' AS text FROM reach
  deployments:
    sql: |
      SELECT d.name, d.hash, d.deployed_at, NOT d.active AS inactive,
             'Deployment ' || substr(d.hash, 1, 7) || CASE WHEN d.active THEN ', running now' ELSE '' END
             || CASE WHEN d."commit" IS NULL THEN '' ELSE ', from commit ' || substr(d."commit", 1, 7)
                     || CASE WHEN d.dirty THEN ' with uncommitted changes' ELSE '' END END AS text
      FROM about a JOIN v_extension_deployment d ON d.name = a.extension
      ORDER BY d.deployed_at DESC
view:
  stack:
  - id: about
    title: About
    viz: detail
    from: about_facts
    columns:
    - { key: description, label: What it is }
    - { key: origin_text, label: From }
    - { key: runs_text, label: Runs }
    - { key: permission_items, label: Permissions }
    - { key: problems_label, label: Problems, link: { kind: page, from: problems_target } }
    - { key: manifest, label: Manifest, link: { kind: page, from: manifest_target } }
    empty: This extension isn't known to the project.
  - id: contributes
    title: Contributes
    stack:
    - id: pages
      title: Pages
      viz: sections
      from: pages
      sections: { title: title, id: id, link: definition, body: description }
      empty: It has no pages.
    - id: kinds
      title: Everything else
      viz: list
      from: contributions
      empty: Nothing else.
      columns:
      - { key: text, label: Contribution }
  - id: permissions
    title: What it may reach
    viz: list
    from: permissions
    empty: Nothing beyond the baseline.
    columns:
    - { key: text, label: Permission }
  - id: deployments
    title: Deployments
    viz: list
    from: deployments
    empty: No deployments yet. A deploy copies the extension's source here.
    columns:
    - { key: text, label: Deployment }
    - { key: deployed_at, label: Deployed, format: relative }
    actions:
    - id: rollback
      label: Roll Back to This
      command: oxplow.extension.rollback
      input:
        name: '{{row.name}}'
        to: '{{row.hash}}'
      row: true
      when: inactive
  - slot: runs
actions:
- id: deploy
  label: Deploy
  command: oxplow.extension.deploy
  input:
    name: '{{row.extension}}'
  when: can_deploy
- id: rollback
  label: Roll Back
  command: oxplow.extension.rollback
  input:
    name: '{{row.extension}}'
  when: can_rollback
- id: enable
  label: Enable
  command: oxplow.extension.enable
  input:
    name: '{{row.extension}}'
  when: can_enable
- id: disable
  label: Disable
  command: oxplow.extension.disable
  input:
    name: '{{row.extension}}'
  when: can_disable
- id: share
  label: Share with the Team
  command: oxplow.extension.share
  input:
    name: '{{row.extension}}'
  when: can_share
- id: unshare
  label: Stop Sharing
  command: oxplow.extension.unshare
  input:
    name: '{{row.extension}}'
  when: can_unshare
- id: remove
  label: Remove…
  command: oxplow.extension.remove
  input:
    name: '{{row.extension}}'
  when: can_remove
