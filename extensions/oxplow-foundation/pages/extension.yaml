title: Extension
description: One extension — where it comes from, its version, permissions and problems, everything it contributes by kind, and its deployments.
label: '{{param.name}}'
icon: package
for: oxplow/extension
default: true
params:
- name: uri
  label: Extension
- name: name
answers:
- {"question":"What does this extension contribute, and which deployment runs?","about":"oxplow/extension","params":{"uri":"oxplow:oxplow/extension?name=oxplow-foundation","name":"oxplow-foundation"},"skill":"oxplow-extension"}
- {"question":"What may this extension reach?","about":"oxplow/extension","params":{"uri":"oxplow:oxplow/extension?name=oxplow-foundation","name":"oxplow-foundation"},"skill":"oxplow-extension"}
loaders:
  # The row the page's actions read, and the link to its running manifest.
  about:
    sql: |
      SELECT c.name AS extension, c.description,
             CASE WHEN c.deployment IN ('deployed', 'shipped', 'source') THEN
                    uri('oxplow/file', 'filesystem', 'oxplow:extensions', 'path', c.name || '/extension.yaml')
                    || '#oxplow.renderer=oxplow-foundation/file-viewer' END AS manifest_target,
             (s.hash IS NOT NULL AND (c.deployment = 'undeployed'
                OR (c.hash IS NOT NULL AND s.hash != c.hash))) AS can_deploy,
             (c.deployment = 'deployed') AS can_rollback,
             (NOT c.enabled) AS can_enable,
             (c.enabled AND c.name != 'oxplow-foundation') AS can_disable,
             (c.origin = 'project') AS can_remove,
             (c.origin = 'project' AND NOT c.shared AND s.path LIKE '.oxplow/extensions/%') AS can_share,
             (c.origin = 'project' AND c.shared) AS can_unshare
      FROM content c LEFT JOIN v_extension_source s ON s.name = c.name
  summary:
    page: oxplow-foundation/extension-facts
    loader: summary
    params: { extension: { from: about.extension } }
  reach:
    page: oxplow-foundation/extension-facts
    loader: reach
    params: { extension: { from: about.extension } }
  about_facts:
    sql: |
      SELECT a.description, s.origin_text, s.origin_target, s.version_text, s.permission_items, s.problems_label, s.problems_target,
             CASE WHEN a.manifest_target IS NOT NULL THEN 'Read its running extension.yaml' END AS manifest,
             a.manifest_target
      FROM about a LEFT JOIN summary s ON s.extension = a.extension
  # The resource kinds some page draws: a contribution of one links to it.
  drawn:
    sql: SELECT DISTINCT j.value AS resource FROM v_page p, json_each(p.renders) j
  pages:
    sql: |
      -- What a page shows: the resource kinds it draws, else its launcher category.
      SELECT p.title, p.id, p.description,
             CASE WHEN p.running_uri IS NOT NULL THEN p.running_uri || '#oxplow.renderer=oxplow-foundation/definition' END AS definition,
             COALESCE((SELECT group_concat(r.label, ', ')
                       FROM json_each(p.renders) j JOIN v_resource r ON r.resource = j.value),
                      p.category) AS shows
      FROM about a JOIN v_page p ON p.extension = a.extension
      ORDER BY p.title
  commands:
    sql: |
      SELECT m.id AS command, m.summary AS description, m.scope AS permission,
             CASE m.confirm WHEN 'never' THEN NULL
                  ELSE upper(substr(m.confirm, 1, 1)) || substr(m.confirm, 2) END AS asks,
             CASE WHEN m.undoable THEN 'Yes' END AS undo,
             CASE WHEN d.resource IS NOT NULL THEN m.uri END AS link
      FROM about a JOIN v_command m ON m.extension = a.extension
           LEFT JOIN drawn d ON d.resource = 'oxplow/command'
      ORDER BY m.id
  skills:
    sql: |
      SELECT s.name AS title, s.description, s.kind
      FROM about a JOIN v_skill s ON s.extension = a.extension
      ORDER BY s.name
  components:
    sql: |
      SELECT k.title, k.description,
             (SELECT group_concat(j.value, ', ') FROM json_each(k.commands) j) AS can_run,
             CASE k.sql WHEN 'read' THEN 'Reads your data' END AS data
      FROM about a JOIN v_custom_component k ON k.extension = a.extension
      ORDER BY k.title
  slots:
    sql: |
      SELECT COALESCE(mp.title, s.page) AS title, COALESCE(hp.title, s.host) AS host, s.slot,
             hp.uri AS host_link
      FROM about a JOIN v_slot s ON s.extension = a.extension
           LEFT JOIN v_page mp ON mp.id = s.page
           LEFT JOIN v_page hp ON hp.id = s.host
      ORDER BY title
  collectors:
    sql: |
      SELECT k.id AS title, k.description,
             CASE k.trigger WHEN 'events' THEN 'As events arrive' WHEN 'run' THEN 'When it is run' ELSE k.trigger END AS runs,
             k.last_run_at, COALESCE(k.error, k.last_status) AS status,
             CASE WHEN d.resource IS NOT NULL THEN k.uri END AS link
      FROM about a JOIN v_collector k ON k.extension = a.extension
           LEFT JOIN drawn d ON d.resource = 'oxplow/collector'
      ORDER BY k.id
  metrics:
    sql: |
      SELECT m.title, m.description, m.unit,
             CASE m.direction WHEN 'higher-better' THEN 'Higher' WHEN 'lower-better' THEN 'Lower' END AS better,
             CASE WHEN d.resource IS NOT NULL THEN c.uri END AS link
      FROM about a JOIN v_contribution c ON c.extension = a.extension AND c.kind = 'metric'
           JOIN v_metric_spec m ON m.key = c.local
           LEFT JOIN drawn d ON d.resource = 'oxplow/metric'
      ORDER BY m.title
  measures:
    sql: |
      SELECT m.title, m.description, m.unit, m.subject_kind AS of,
             CASE WHEN d.resource IS NOT NULL THEN c.uri END AS link
      FROM about a JOIN v_contribution c ON c.extension = a.extension AND c.kind = 'measure'
           JOIN v_measure m ON m.key = c.local
           LEFT JOIN drawn d ON d.resource = 'oxplow/measure'
      ORDER BY m.title
  dimensions:
    sql: |
      SELECT m.label AS title, m.description, m.key, m.subject_kind AS of,
             CASE WHEN d.resource IS NOT NULL THEN c.uri END AS link
      FROM about a JOIN v_contribution c ON c.extension = a.extension AND c.kind = 'dimension'
           JOIN v_dimension m ON m.key = c.local
           LEFT JOIN drawn d ON d.resource = 'oxplow/dimension'
      ORDER BY m.label
  resources:
    sql: |
      -- A resource kind: its URI form, and the pages that draw it.
      SELECT r.label AS title, r.description, 'oxplow:' || r.resource AS uri_form,
             (SELECT count(*) FROM v_page p, json_each(p.renders) j WHERE j.value = r.resource) AS pages,
             CASE WHEN r.searchable THEN 'Yes' END AS searchable
      FROM about a JOIN v_contribution c ON c.extension = a.extension AND c.kind = 'resource'
           JOIN v_resource r ON r.resource = c.global_name
      ORDER BY r.label
  implementations:
    sql: |
      SELECT i.title, i.description, i.capability_title AS capability,
             CASE WHEN i.active THEN 'Yes' END AS active
      FROM about a JOIN v_contribution c ON c.extension = a.extension AND c.kind = 'implementation'
           JOIN v_capability_provider i ON i.extension = c.extension AND i.capability || '.' || i.provider = c.local
      ORDER BY i.capability_title, i.title
  deployments:
    sql: |
      -- Newest first: the top one is what runs (unless a roll back made an
      -- older one run; that one alone offers no Roll Back to This).
      SELECT d.name, d.hash, NOT d.active AS inactive,
             strftime('%Y-%m-%d %H:%M', d.deployed_at) AS deployed,
             substr(d.hash, 1, 7) AS version,
             CASE WHEN d."commit" IS NULL THEN NULL
                  ELSE substr(d."commit", 1, 7) || CASE WHEN d.dirty THEN ' + uncommitted changes' ELSE '' END END AS "commit"
      FROM about a JOIN v_extension_deployment d ON d.name = a.extension
      ORDER BY d.deployed_at DESC
view:
  stack:
  - id: about
    title: About
    viz: detail
    from: about_facts
    columns:
    - { key: description, label: What it is }
    - { key: origin_text, label: From, link: { kind: page, from: origin_target } }
    - { key: version_text, label: Version }
    - { key: permission_items, label: Permissions, format: items }
    - { key: problems_label, label: Problems, link: { kind: page, from: problems_target } }
    - { key: manifest, label: Manifest, link: { kind: page, from: manifest_target } }
    empty: This extension isn't known to the project.
  - id: pages
    title: Pages
    viz: table
    from: pages
    hide_empty: true
    columns:
    - { key: title, label: Page, link: { kind: page, from: definition } }
    - { key: description, label: What it is }
    - { key: shows, label: Shows }
  - id: commands
    title: Commands
    viz: table
    from: commands
    hide_empty: true
    columns:
    - { key: command, label: Command, link: { kind: page, from: link } }
    - { key: description, label: What it does }
    - { key: permission, label: Permission }
    - { key: asks, label: Asks first }
    - { key: undo, label: Undo }
  - id: skills
    title: Skills
    viz: table
    from: skills
    hide_empty: true
    columns:
    - { key: title, label: Skill }
    - { key: description, label: What it teaches }
  - id: components
    title: Custom components
    viz: table
    from: components
    hide_empty: true
    columns:
    - { key: title, label: Component }
    - { key: description, label: What it is }
    - { key: can_run, label: Can run }
    - { key: data, label: Data }
  - id: slots
    title: Slots
    viz: table
    from: slots
    hide_empty: true
    columns:
    - { key: title, label: Page }
    - { key: host, label: Shown on, link: { kind: page, from: host_link } }
    - { key: slot, label: At }
  - id: collectors
    title: Collectors
    viz: table
    from: collectors
    hide_empty: true
    columns:
    - { key: title, label: Collector, link: { kind: page, from: link } }
    - { key: description, label: What it collects }
    - { key: runs, label: Runs }
    - { key: last_run_at, label: Last run, format: relative }
    - { key: status, label: Status }
  - id: metrics
    title: Metrics
    viz: table
    from: metrics
    hide_empty: true
    columns:
    - { key: title, label: Metric, link: { kind: page, from: link } }
    - { key: description, label: What it measures }
    - { key: unit, label: Unit }
    - { key: better, label: Better when }
  - id: measures
    title: Measures
    viz: table
    from: measures
    hide_empty: true
    columns:
    - { key: title, label: Measure, link: { kind: page, from: link } }
    - { key: description, label: What it records }
    - { key: unit, label: Unit }
    - { key: of, label: Of }
  - id: dimensions
    title: Dimensions
    viz: table
    from: dimensions
    hide_empty: true
    columns:
    - { key: title, label: Dimension, link: { kind: page, from: link } }
    - { key: description, label: What it is }
    - { key: key, label: Key }
    - { key: of, label: Of }
  - id: resources
    title: Resources
    viz: table
    from: resources
    hide_empty: true
    columns:
    - { key: title, label: Resource }
    - { key: description, label: What it is }
    - { key: uri_form, label: URI }
    - { key: pages, label: Pages that draw it }
    - { key: searchable, label: Searchable }
  - id: implementations
    title: Implementations
    viz: table
    from: implementations
    hide_empty: true
    columns:
    - { key: title, label: Provider }
    - { key: description, label: What it does }
    - { key: capability, label: Of }
    - { key: active, label: Active }
  - id: deployments
    title: Deployments
    viz: table
    from: deployments
    empty: No deployments yet. A deploy copies the extension's source here.
    columns:
    - { key: deployed, label: Deployed }
    - { key: version, label: Version }
    - { key: commit, label: From commit }
    actions:
    - id: rollback
      label: Roll Back to This
      command: oxplow.extension.rollback
      input:
        name: '{{row.name}}'
        to: '{{row.hash}}'
      row: true
      when: inactive
  - slot: runs
actions:
- id: deploy
  label: Deploy
  command: oxplow.extension.deploy
  input:
    name: '{{row.extension}}'
  when: can_deploy
- id: rollback
  label: Roll Back
  command: oxplow.extension.rollback
  input:
    name: '{{row.extension}}'
  when: can_rollback
- id: enable
  label: Enable
  command: oxplow.extension.enable
  input:
    name: '{{row.extension}}'
  when: can_enable
- id: disable
  label: Disable
  command: oxplow.extension.disable
  input:
    name: '{{row.extension}}'
  when: can_disable
- id: share
  label: Share with the Team
  command: oxplow.extension.share
  input:
    name: '{{row.extension}}'
  when: can_share
- id: unshare
  label: Stop Sharing
  command: oxplow.extension.unshare
  input:
    name: '{{row.extension}}'
  when: can_unshare
- id: remove
  label: Remove…
  command: oxplow.extension.remove
  input:
    name: '{{row.extension}}'
  when: can_remove
