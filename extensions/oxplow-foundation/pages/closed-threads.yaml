title: Closed Threads
description: "The stream's closed threads, newest first. A thread's finished work is bundled's badge after it."
icon: archive
category: System
params:
- name: stream_id
loaders:
  closed_threads:
    sql: |
      SELECT t.uri, t.title, t.closed_at,
             uri_param(t.uri, 'id') AS thread
      FROM v_thread t
      WHERE t.stream_id = :stream_id AND t.closed_at IS NOT NULL AND t.archived_at IS NULL
      ORDER BY t.closed_at DESC, t.id DESC
view:
  from: closed_threads
  viz: table
  columns:
  - key: title
    label: Thread
    link:
      kind: page
      from: uri
  - key: closed_at
    label: Closed
    format: relative
    width: 120
  empty: No closed threads. Threads you close from the rail's menu show up here.
  actions:
  - id: reopen
    label: Reopen
    command: oxplow.thread.reopen
    input:
      thread: '{{row.thread}}'
    row: true
