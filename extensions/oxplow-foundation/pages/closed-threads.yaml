title: Closed Threads
description: "The stream's closed threads, newest first, with the work each finished."
icon: archive
category: System
params:
- name: stream_id
loaders:
  closed_threads:
    sql: |
      SELECT t.uri, t.title, t.closed_at,
             coalesce((SELECT group_concat(n || ' ' || label, ' · ')
                       -- By stage, as the list names it; open buckets first.
                       FROM (SELECT count(*) AS n, coalesce(w.stage_title, w.stage) AS label,
                                    CASE w.state WHEN 'todo' THEN 0 WHEN 'in_progress' THEN 1 WHEN 'blocked' THEN 2
                                                 WHEN 'backlog' THEN 3 WHEN 'done' THEN 4 ELSE 5 END AS rank
                             FROM v_work_item w WHERE w.uri IN (SELECT e.work_item FROM v_effort e WHERE e.thread_id = t.id)
                             GROUP BY w.stage ORDER BY rank, label)), '') AS work,
             uri_param(t.uri, 'id') AS thread
      FROM v_thread t
      WHERE t.stream_id = :stream_id AND t.closed_at IS NOT NULL AND t.archived_at IS NULL
      ORDER BY t.closed_at DESC, t.id DESC
view:
  from: closed_threads
  viz: table
  columns:
  - key: title
    label: Thread
  - key: closed_at
    label: Closed
    format: relative
    width: 120
  - key: work
    label: Work
  empty: No closed threads. Threads you close from the rail's menu show up here, with the work they finished.
  actions:
  - id: reopen
    label: Reopen
    command: oxplow.thread.reopen
    input:
      thread: '{{row.thread}}'
    row: true
