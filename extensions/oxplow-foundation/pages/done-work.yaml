title: Done Work
description: Every closed work item (done and canceled) on the thread's list, the latest first.
icon: circle-check
category: Work
params:
- name: thread_id
data:
  done_work:
    sql: |
      SELECT w.uri, w.title, w.state, w.closed_at
      FROM v_work_item w
      WHERE w.thread_id = :thread_id AND w.state IN ('done', 'canceled')
      ORDER BY w.closed_at DESC, w.rank
view:
  from: done_work
  viz: table
  columns:
  - key: title
    label: Item
    link:
      kind: page
      from: uri
    icon: state
  - key: state
    label: State
    width: 110
  - key: closed_at
    label: Closed
    format: relative
    width: 120
  empty: Nothing is done yet. Items you finish (or cancel) show up here, latest first.
  actions:
  - id: reopen
    label: Reopen
    command: oxplow.work_item.transition
    input:
      uri: '{{row.uri}}'
      to: todo
    row: true
