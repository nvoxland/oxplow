title: Alerts
description: 'Everything that needs you: decisions and hints waiting on you, failed operations, undelivered events and reactions, and extensions not running as they should.'
icon: bell
category: System
answers:
- {"question":"Which events couldn't be delivered to their consumer?","params":{},"skill":"oxplow-extension"}
loaders:
  decisions:
    sql: |
      SELECT 1
  notices:
    sql: |
      SELECT n.id,
             CASE WHEN instr(n.message, char(10)) > 0 THEN substr(n.message, 1, instr(n.message, char(10)) - 1) ELSE n.message END AS message,
             CASE WHEN th.title IS NULL THEN NULL ELSE 'Thread: ' || th.title END AS thread,
             uri('oxplow/page', 'page', 'thread-work', 'thread', 'thr' || n.thread_id) AS thread_uri,
             n.created_at
      FROM v_agent_nudge n LEFT JOIN v_thread th ON th.id = n.thread_id
      WHERE n.audience = 'person' AND n.delivered_at IS NULL
      ORDER BY n.id DESC
  operations:
    sql: |
      SELECT event_id, label, at, seen, (NOT seen) AS unseen, CASE WHEN seen THEN 'muted' ELSE 'danger' END AS tone
      FROM v_op_error WHERE dismissed = 0 ORDER BY at DESC
view:
  stack:
  - id: decisions
    title: Needs your decision
    description: 'An agent asked to run a command its policy keeps for you, such as changing a setting. Approve or Decline each; nothing else clears it.'
    from: decisions
    viz: approvals
  - id: notices
    title: Notices
    description: 'Things oxplow noticed about the work and tells you rather than an agent, such as a hint it muted for an agent after it kept firing. Nothing to do but read: Dismiss one from its right-click, or Clear notices.'
    from: notices
    viz: table
    columns:
    - key: message
      label: Notice
      expand: oxplow-foundation/alerts-notice
    - key: thread
      label: Thread
      width: 160
      link:
        kind: page
        from: thread_uri
    - key: created_at
      label: When
      format: relative
      width: 130
    empty: No notices.
    actions:
    - id: dismiss
      label: Dismiss
      command: oxplow.hint.dismiss
      input:
        nudge: '{{row.id}}'
      row: true
    - id: clear
      label: Clear notices
      command: oxplow.hint.dismiss_all
      input: {}
      all: true
  - id: operations
    title: Failed operations
    description: 'Something you started from the app failed. Each row opens into how it ended and its output; an agent can read the same record. Mark Seen keeps one without the red, Dismiss hides it.'
    from: operations
    viz: table
    columns:
    - key: label
      label: Operation
      tone: tone
      expand: oxplow-foundation/alerts-operation
    - key: at
      label: When
      format: relative
      width: 130
    empty: No failed operations.
    actions:
    - id: seen
      label: Mark Seen
      command: oxplow.op_error.mark_seen
      input:
        event: '{{row.event_id}}'
      row: true
      when: unseen
    - id: dismiss
      label: Dismiss
      command: oxplow.op_error.dismiss
      input:
        event: '{{row.event_id}}'
      row: true
    - id: clear
      label: Clear failed operations
      command: oxplow.op_error.dismiss_all
      input: {}
      all: true
  - id: deliveries
    title: Undelivered events
    description: "Oxplow's own plumbing: every change is an event, and a consumer that threw on one parks it here. Retry hands it over again; Discard drops it for good and asks first."
    embed:
      page: oxplow-foundation/alerts-deliveries
  - id: reactions
    title: Failed reactions
    description: "An extension's effect that reacts to an event and failed on its last try, with why. Some try again by themselves; Retry runs one now."
    embed:
      page: oxplow-foundation/alerts-reactions
  - id: extensions
    title: Extensions with problems
    description: "Everything wrong with an extension, under its name: a contribution that failed or stopped after failing (Start Again, or Repair with the Agent), permissions waiting for your approval (Deploy it on its page), and load errors. It leaves this list when the extension is fixed and deployed."
    embed:
      page: oxplow-foundation/extension-problems
see_also:
  - { page: oxplow-foundation/extension-problems }
  - { page: oxplow-foundation/collectors }
