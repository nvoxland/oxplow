title: New Item
description: File an item on the active work list - its title, its description, the state it starts in, and the list's own fields.
icon: plus
needs:
- work_items
params:
- name: thread_id
- name: parent
data:
  new_task:
    sql: |
      SELECT 'todo' AS state, :parent AS parent_uri,
             (SELECT uri_param(t.uri, 'id') FROM v_thread t WHERE t.id = :thread_id) AS thread
view:
  from: new_task
  viz: form
  form:
    command: oxplow.work_item.create
    then: replace
    fields:
    - title
    - body
    - state
    - thread
    - parent_uri
    - name: native
      from: oxplow-foundation/work-item-fields
    choices:
      state: oxplow-foundation/new-task-states
      thread: oxplow-foundation/new-task-threads
      parent_uri: oxplow-foundation/new-task-parents
    again:
      label: Save and Another
      keep:
      - state
      - thread
      - parent_uri
      - native
