title: Metric
description: 'One metric: what it is, its trend over a range and branch (split by a dimension if you like), and its recordings. The renderer of oxplow''s `metric` resource.'
label: '{{row.title}}'
for: oxplow/metric
default: true
params:
- name: uri
- name: metric
- name: range
  type: date_range
  role: filter
  label: Range
  default: 7d
  presets:
  - 1d
  - 2d
  - 3d
  - 7d
  - 30d
  - all
- name: branch
  type: branch
  role: filter
  label: Branch
- name: slice
  type: choice
  role: filter
  label: Slice by
  options_from: oxplow-foundation/metrics-dimensions
  default: ''
answers:
- {"question":"How has this metric moved, newest capture first?","about":"oxplow/metric","params":{"metric":"oxplow.coverage.abs_pct"},"skill":"oxplow-metrics"}
loaders:
  row:
    sql: |
      SELECT c.title AS title FROM v_metric_catalog c WHERE c.key = :metric
    columns:
    - key: title
  header:
    sql: |
      WITH pts AS (
        SELECT p.captured_at, p.value FROM v_metric_point p
        WHERE p.metric = :metric
          AND (:branch IS NULL OR p.branch = :branch)
          AND (:range_from IS NULL OR p.captured_at >= :range_from)
          AND (:range_to IS NULL OR p.captured_at <= :range_to)
      ), agg AS (
        SELECT coalesce(json_extract(s.entity_json, '$.aggregation'), s.aggregation) AS aggregation, s.key
        FROM v_metric_spec s WHERE s.key = :metric
      )
      SELECT c.title, s.description, c.key AS id, s.display_kind AS type, (SELECT aggregation FROM agg) AS aggregation,
             s.source_measure AS measure, c.scope, c.category, c.language, s.unit, s.direction,
             s.target, s.warn_at, s.fail_at, c.enabled,
             CASE (SELECT aggregation FROM agg)
               WHEN 'sum' THEN 'Total: ' || (SELECT round(sum(value), 2) FROM pts)
               WHEN 'avg' THEN 'Average: ' || (SELECT round(avg(value), 2) FROM pts)
               ELSE CASE WHEN (SELECT count(*) FROM pts) >= 2
                         THEN 'Change: ' || (SELECT round((SELECT value FROM pts ORDER BY captured_at DESC LIMIT 1)
                                                           - (SELECT value FROM pts ORDER BY captured_at LIMIT 1), 2)) END
             END AS in_range,
             (c.enabled = 0) AS can_enable
      FROM v_metric_catalog c LEFT JOIN v_metric_spec s ON s.key = c.key
      WHERE c.key = :metric
  chart:
    sql: |
      WITH pts AS (
        SELECT p.captured_at, p.value, p.group_value FROM v_metric_point p
        WHERE p.metric = :metric AND p.dimension = :slice
          AND (:branch IS NULL OR p.branch = :branch)
          AND (:range_from IS NULL OR p.captured_at >= :range_from)
          AND (:range_to IS NULL OR p.captured_at <= :range_to)
      ), agg AS (
        SELECT coalesce(json_extract(s.entity_json, '$.aggregation'), s.aggregation) AS aggregation, s.target
        FROM v_metric_spec s WHERE s.key = :metric
      )
      SELECT p.captured_at AS at,
             CASE (SELECT aggregation FROM agg)
               WHEN 'sum' THEN sum(p.value) OVER (PARTITION BY p.group_value ORDER BY p.captured_at)
               WHEN 'avg' THEN avg(p.value) OVER (PARTITION BY p.group_value ORDER BY p.captured_at ROWS BETWEEN 4 PRECEDING AND CURRENT ROW)
               ELSE p.value END AS value,
             coalesce(p.group_value, 'all') AS series,
             CASE WHEN coalesce((SELECT aggregation FROM agg), '') NOT IN ('sum', 'avg') THEN (SELECT target FROM agg) END AS target
      FROM pts p ORDER BY p.captured_at
  unchecked:
    sql: |
      SELECT DISTINCT e.path,
             CASE e.reason WHEN 'oversize' THEN 'over the size limit' WHEN 'binary' THEN 'binary' WHEN 'unreadable' THEN 'unreadable' ELSE e.reason END AS reason
      FROM v_capture_exclusion e
      WHERE e.unchecked = 1 AND e.producer IN (
        SELECT DISTINCT c.producer FROM v_capture c JOIN v_fact f ON f.capture_id = c.id
        WHERE f.measure_key = (SELECT source_measure FROM v_metric_spec WHERE key = :metric))
      ORDER BY e.path LIMIT 200
  recordings:
    sql: |
      WITH pts AS (
        SELECT p.captured_at, p.value, p.branch, p.capture_id FROM v_metric_point p
        WHERE p.metric = :metric
          AND (:branch IS NULL OR p.branch = :branch)
          AND (:range_from IS NULL OR p.captured_at >= :range_from)
          AND (:range_to IS NULL OR p.captured_at <= :range_to)
      )
      SELECT p.captured_at AS time, p.value, (SELECT unit FROM v_metric_spec WHERE key = :metric) AS unit,
             p.branch, substr(c.closest_vcs_rev, 1, 8) AS version,
             CASE WHEN c.provenance = 'observed' THEN 'observed' ELSE '⚠ ' || coalesce(c.provenance, '?') END AS trust
      FROM pts p LEFT JOIN v_capture c ON c.id = p.capture_id
      ORDER BY p.captured_at DESC LIMIT 200
  # The measure it is built on (a metric may have none).
  built_on:
    sql: |
      SELECT m.title, uri('oxplow/measure', 'measure', m.key) AS uri, m.description
      FROM v_metric_spec s JOIN v_measure m ON m.key = s.source_measure WHERE s.key = :metric
view:
  stack:
  - id: header
    title: About
    from: header
    viz: detail
    columns:
    - key: title
      label: Metric
    - key: description
      label: About
    - key: in_range
      label: In range
    - key: id
      label: ID
    - key: type
      label: Type
    - key: aggregation
      label: Aggregation
    - key: measure
      label: Measure
    - key: scope
      label: Scope
    - key: category
      label: Category
    - key: language
      label: Language
    - key: unit
      label: Unit
    - key: direction
      label: Direction
    - key: target
      label: Target
    - key: warn_at
      label: Warn at
    - key: fail_at
      label: Fail at
    - key: enabled
      label: Enabled
    empty: That metric isn't known to this project.
    actions:
    - id: enable
      label: Enable
      command: oxplow.metric.enable
      when: can_enable
      input:
        keys:
        - '{{param.metric}}'
        enabled: true
    - id: disable
      label: Disable
      command: oxplow.metric.enable
      when: enabled
      input:
        keys:
        - '{{param.metric}}'
        enabled: false
  - id: chart
    title: Trend
    from: chart
    viz: line
    chart:
      x: at
      y: value
      series: series
      targets: target
    empty: No recordings in this range.
  - id: unchecked
    title: Unchecked files
    from: unchecked
    viz: list
    columns:
    - key: path
      label: File
      link:
        kind: file
        from: path
    - key: reason
      label: Why
    empty: ''
  - id: recordings
    title: Recordings
    from: recordings
    viz: table
    columns:
    - key: time
      label: Time
      format: datetime
    - key: value
      label: Value
      unit: unit
    - key: branch
      label: Branch
    - key: version
      label: Version
    - key: trust
      label: Trust
    empty: No recordings in range.
see_also:
  - { from: built_on }
  - { page: oxplow-foundation/metrics-recorded }
