title: Effort files
description: The files an effort changed, with how.
hidden: true
params:
- name: effort
  label: Effort (`eff9`)
answers:
- {"question":"List this effort's files without writing SQL.","about":"oxplow/effort","params":{"effort":"eff1"},"skill":"oxplow-runtime"}
- {"question":"Which files did this effort touch?","about":"oxplow/effort","params":{"effort":"eff1"},"skill":"oxplow-runtime"}
loaders:
  effort_files:
    sql: |
      SELECT f.path, f.change_kind, f.source
      FROM v_effort_file f
      WHERE f.effort_id = (SELECT id FROM v_effort WHERE uri = uri('oxplow/effort', 'id', :effort))
      ORDER BY f.path
view:
  from: effort_files
  viz: table
  columns:
  - key: path
    label: File
    link:
      kind: file
      from: path
  - key: change_kind
    label: Change
  - key: source
    label: Seen by
  empty: The effort changed no files.
