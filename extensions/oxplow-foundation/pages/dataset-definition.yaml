title: Dataset definition
description: What a dataset holds, who publishes it, its fields, and what reads it or supplies its data.
label: '{{row.view}}'
icon: database
for: oxplow/dataset
params:
- name: uri
  label: Dataset
answers:
- {"question":"What does this dataset hold, and what are its fields?","about":"oxplow/dataset","params":{"uri":"oxplow:oxplow/dataset?dataset=task"},"skill":"oxplow-extension"}
loaders:
  about:
    sql: |
      SELECT d.view, d.name, d.owner, d.kind, d.description
      FROM v_dataset d
      WHERE (d.owner = 'core' AND d.name = uri_param(:uri, 'dataset'))
         OR d.owner || '/' || d.name = uri_param(:uri, 'dataset')
  fields:
    sql: |
      SELECT f.name, f.sql_type, f.doc || CASE WHEN f.key_part IS NOT NULL THEN ' (part of the key)' ELSE '' END AS doc
      FROM about a JOIN v_field f ON f.view = a.view
      ORDER BY f.position
  reads:
    sql: |
      SELECT l.input, CASE l.kind WHEN 'ref' THEN 'Dataset' WHEN 'source' THEN 'Table' END AS kind,
             CASE WHEN d.view IS NOT NULL THEN
               uri_view(uri('oxplow/dataset', 'dataset', CASE WHEN d.owner = 'core' THEN d.name ELSE d.owner || '/' || d.name END),
                        'oxplow.renderer', 'oxplow/dataset-definition')
             END AS definition
      FROM about a JOIN v_dataset_lineage l ON l.view = a.view
      LEFT JOIN v_dataset d ON l.kind = 'ref' AND d.view = l.input
      WHERE l.kind IN ('ref', 'source')
      ORDER BY l.input, l.kind
  read_by:
    sql: |
      SELECT DISTINCT d.view,
             uri_view(uri('oxplow/dataset', 'dataset', CASE WHEN d.owner = 'core' THEN d.name ELSE d.owner || '/' || d.name END),
                      'oxplow.renderer', 'oxplow/dataset-definition') AS definition
      FROM about a JOIN v_dataset_lineage l ON l.kind = 'ref' AND l.input = a.view
      JOIN v_dataset d ON d.view = l.view
      ORDER BY d.view
view:
  stack:
  - id: about
    title: About
    viz: detail
    from: about
    lead: description
    columns:
    - { key: view, label: View }
    - { key: owner, label: Owner }
    - { key: kind, label: Kind }
    empty: That isn't a dataset oxplow publishes.
  - id: fields
    title: Fields
    viz: table
    from: fields
    columns:
    - { key: name, label: Field }
    - { key: sql_type, label: Type }
    - { key: doc, label: What it holds }
    empty: No fields.
  - id: reads
    title: Reads
    viz: list
    from: reads
    columns:
    - { key: input, label: Input, link: { kind: page, from: definition } }
    - { key: kind, label: Kind }
    empty: Reads no datasets or tables.
  - id: read-by
    title: Read by
    viz: list
    from: read_by
    columns:
    - { key: view, label: Dataset, link: { kind: page, from: definition } }
    empty: No datasets read this one.
