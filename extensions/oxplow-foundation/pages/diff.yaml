title: Diff
description: 'One file between two revisions, filling the page: the side-by-side (or unified) diff with Prev/Next, Ask About This and the analysis other extensions add under the header. `#lines=12` reveals a line on the newer side.'
label: '{{param.path}} ({{param.label}})'
icon: git-compare
params:
- name: path
- name: left
- name: right
- name: label
- name: base
- name: lines
  role: filter
data:
  diff:
    sql: |
      SELECT :path AS path, :left AS a, :right AS b, :lines AS lines, :base AS base, :label AS label
view:
  from: diff
  viz: diff
  diff:
    path: path
    from: a
    to: b
    lines: lines
    base: base
