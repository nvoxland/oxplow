title: Diff
description: 'One file between two revisions, filling the page: the diff with Prev/Next, Ask About This and what other extensions add under the header. `#lines=12` reveals a line.'
label: '{{param.path}} ({{param.label}})'
icon: git-compare
params:
- name: path
- name: left
- name: right
- name: label
- name: base
- name: lines
  role: filter
loaders:
  diff:
    sql: |
      SELECT :path AS path, :left AS a, :right AS b, :lines AS lines, :base AS base, :label AS label
view:
  stack:
  # What other extensions show for the file above its diff (bundled's
  # co-change files): pages mounted at `oxplow-foundation/diff.file-header`.
  - slot: file-header
  - id: diff
    from: diff
    viz: diff
    diff:
      path: path
      from: a
      to: b
      lines: lines
      base: base
