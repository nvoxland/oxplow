title: Diff
description: "One file between two revisions, filling the page: the diff, and what other extensions add under the header."
label: '{{param.path|basename}} ({{param.label}})'
icon: git-compare
params:
- name: path
- name: left
- name: right
- name: label
- name: base
- name: lines
  role: view
loaders:
  diff:
    sql: |
      SELECT :path AS path, :left AS a, :right AS b, :lines AS lines, :base AS base, :label AS label
view:
  stack:
  # What other extensions show for the file above its diff (bundled's
  # co-change files): pages mounted at `oxplow-foundation/diff.file-header`.
  - slot: file-header
  - id: diff
    title: Diff
    hide_title: true
    from: diff
    viz: diff
    diff:
      path: path
      from: a
      to: b
      lines: lines
      base: base
