title: Hook Events
description: The agent's activity on the stream — prompts, turns, tool calls, status changes and sessions — newest first, the last 200.
icon: activity
category: Activity
params:
- name: stream_id
loaders:
  hook_events:
    sql: |
      WITH shown AS (
        SELECT seq, at, substr(type, 7) AS kind, payload, payload_expired_at,
               coalesce(nullif(json_extract(payload, '$.paths[0]'), ''), nullif(json_extract(payload, '$.detail'), '')) AS target
        FROM v_event
        WHERE stream_id = :stream_id AND type LIKE 'agent.%'
        ORDER BY seq DESC LIMIT 200)
      SELECT seq, at, kind,
             CASE WHEN payload_expired_at IS NOT NULL THEN '(details expired)' ELSE
               CASE kind
                 WHEN 'tool.requested' THEN
                   coalesce(json_extract(payload, '$.tool'), '')
                   || CASE WHEN target IS NULL THEN '' ELSE ' · ' || CASE WHEN length(target) > 80 THEN substr(target, 1, 79) || '…' ELSE target END END
                   || CASE WHEN json_extract(payload, '$.decision') = 'denied' THEN ' · denied: ' || coalesce(json_extract(payload, '$.reason'), '') ELSE '' END
                 WHEN 'tool.finished' THEN
                   coalesce(json_extract(payload, '$.tool'), '')
                   || CASE WHEN target IS NULL THEN '' ELSE ' · ' || CASE WHEN length(target) > 80 THEN substr(target, 1, 79) || '…' ELSE target END END
                   || CASE json_extract(payload, '$.ok') WHEN 0 THEN ' · failed' WHEN 1 THEN ' · ok' ELSE '' END
                 WHEN 'turn.ended' THEN coalesce(json_extract(payload, '$.outcome'), '')
                 WHEN 'prompt.submitted' THEN CASE WHEN json_extract(payload, '$.reprompt') THEN 're-prompt' ELSE '' END
                 WHEN 'status.changed' THEN
                   coalesce(json_extract(payload, '$.state'), '')
                   || CASE WHEN coalesce(json_extract(payload, '$.detail'), '') = '' THEN ''
                           ELSE ' · ' || CASE WHEN length(json_extract(payload, '$.detail')) > 80 THEN substr(json_extract(payload, '$.detail'), 1, 79) || '…' ELSE json_extract(payload, '$.detail') END END
                 WHEN 'session.started' THEN coalesce(json_extract(payload, '$.harness'), '')
                   || CASE WHEN json_extract(payload, '$.resumed') THEN ' (resumed)' ELSE '' END
                 WHEN 'session.ended' THEN coalesce(json_extract(payload, '$.reason'), '')
                 ELSE '' END
             END AS detail,
             CASE kind WHEN 'prompt.submitted' THEN 'accent' WHEN 'turn.started' THEN 'accent'
                       WHEN 'tool.finished' THEN 'success' WHEN 'session.started' THEN 'warning'
                       WHEN 'session.ended' THEN 'danger' WHEN 'turn.ended' THEN 'danger'
                       ELSE 'muted' END AS tone
      FROM shown
      ORDER BY seq DESC
view:
  from: hook_events
  viz: table
  columns:
  - key: at
    label: At
    format: datetime
    width: 160
  - key: kind
    label: Event
    tone: tone
    width: 150
  - key: detail
    label: Detail
  empty: No agent activity yet.
