title: Uncommitted
description: "The stream's working tree against HEAD: the changed files, and the analysis other extensions add."
icon: git-branch
category: Git
params:
- name: stream_id
answers:
- {"question":"Which uncommitted files are staged, and which does git not track yet?","params":{"stream_id":1},"skill":"oxplow-codebase"}
loaders:
  # The stream's working change and its files: the one statement, which the
  # Git panel reads too.
  row:
    page: oxplow/worktree-files
    loader: change
    params: { stream_id: { param: stream_id } }
  clean:
    sql: |
      SELECT 'Nothing to commit.' AS message
      WHERE NOT EXISTS (SELECT 1 FROM v_change_file WHERE change_id = :change_id)
    params:
      change_id:
        from: row.change_id
  commit_form:
    sql: |
      SELECT 'str' || :stream_id AS stream, '' AS message
      WHERE EXISTS (SELECT 1 FROM v_change_file WHERE change_id = :change_id)
    params:
      change_id:
        from: row.change_id
  files:
    page: oxplow/worktree-files
    loader: files
    params: { stream_id: { param: stream_id }, show: changed_untracked }
view:
  stack:
  - id: clean
    title: Status
    hide_title: true
    from: clean
    viz: markdown
    markdown:
      text: message
    empty: ''
  - id: commit
    title: Commit
    from: commit_form
    viz: form
    empty: Nothing to commit.
    form:
      command: oxplow.vcs.commit
      fields:
      - message
      fixed: []
  - id: files
    title: Files
    from: files
    viz: tree
    tree:
      path: path
      status: status
    columns:
    - key: path
      label: File
      link:
        kind: diff-at
        from: path
        base: base_revision
        head: head_revision
    empty: Nothing is uncommitted.
  - slot: sections
