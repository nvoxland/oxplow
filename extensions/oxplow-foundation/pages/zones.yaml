title: "Zones"
description: "The project's zone rules and the files that fall outside every rule."
hidden: true
answers:
- {"question":"Which zone rules does this project have, and how many files does each claim?","params":{},"skill":"oxplow-extension"}
- {"question":"Which files fall outside every zone rule?","params":{},"skill":"oxplow-extension"}
loaders:
  zones:
    sql: "SELECT position, zone, patterns, files FROM v_zone ORDER BY position IS NULL, position"
  unmatched:
    sql: "SELECT path FROM v_zone_unmatched ORDER BY path"
view:
  stack:
  - { id: zones, viz: table, from: zones }
  - { id: unmatched, viz: table, from: unmatched }
