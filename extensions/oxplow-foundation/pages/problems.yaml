title: Problems
description: "What the stream's language servers report now, by file (files with errors first), most severe first within a file."
icon: triangle-alert
category: Code
params:
- name: stream_id
- name: severity
  role: filter
  label: Severity
  default: all
  options:
  - value: all
    label: All
  - value: error
    label: Errors
  - value: warning
    label: Warnings
  - value: information
    label: Information
  - value: hint
    label: Hints
answers:
- {"question":"Which files have compiler errors right now?","params":{"stream_id":1,"severity":"error"},"skill":"oxplow-codebase"}
loaders:
  problems:
    sql: |
      WITH shown AS (
        SELECT * FROM v_diagnostic
        WHERE stream_id = :stream_id AND (:severity = 'all' OR severity = :severity)),
      files AS (
        SELECT path,
               sum(severity = 'error') AS errors,
               sum(severity = 'warning') AS warnings
        FROM shown GROUP BY path)
      SELECT d.path, d.severity, d.message,
             trim(coalesce(d.source, '') || ' ' || coalesce(d.code, '')) AS origin,
             d.line || ':' || d.col AS position, d.line,
             CASE d.severity WHEN 'error' THEN 'danger' WHEN 'warning' THEN 'warning' ELSE 'muted' END AS tone
      FROM shown d JOIN files f ON f.path = d.path
      ORDER BY f.errors DESC, f.warnings DESC, d.path,
               CASE d.severity WHEN 'error' THEN 0 WHEN 'warning' THEN 1 WHEN 'information' THEN 2 ELSE 3 END,
               d.line, d.col
view:
  from: problems
  viz: table
  group:
    by: path
    link:
      kind: file
  columns:
  - key: severity
    label: Severity
    tone: tone
    width: 100
  - key: message
    label: Problem
    link:
      kind: file
      from: path
      line: line
  - key: origin
    label: Source
  - key: position
    label: At
    width: 80
  empty: No problems. Language servers report errors and warnings for the files they have open or indexed.
