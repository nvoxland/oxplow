title: Git
description: The stream's branch against its upstream, the working tree, the recent commits, the other streams, which of them can merge cleanly, and the recent remote branches.
icon: git-branch
category: Git
needs:
- vcs
params:
- name: stream_id
loaders:
  row:
    sql: |
      SELECT s.branch AS branch FROM v_stream s WHERE s.id = :stream_id
    columns:
    - key: branch
  upstream:
    sql: |
      SELECT b.name AS branch,
             CASE WHEN b.upstream IS NULL THEN 'No upstream'
                  ELSE 'tracks ' || b.upstream || '   ↑' || b.ahead || ' ↓' || b.behind END AS status
      FROM v_branch b WHERE b.kind = 'local' AND b.name = :branch
    params:
      branch:
        from: row.branch
  uncommitted:
    sql: |
      WITH w AS (
        SELECT c.id FROM v_change c WHERE c.kind = 'working' AND c.target = '' AND c.stream_id = :stream_id
      ), f AS (
        SELECT cf.status, cf.untracked FROM v_change_file cf JOIN w ON cf.change_id = w.id
      )
      SELECT CASE WHEN count(*) = 0 THEN 'No uncommitted files'
                  ELSE count(*) || ' changed'
                       || CASE WHEN sum(status = 'modified' AND untracked = 0) > 0 THEN ' · ' || sum(status = 'modified' AND untracked = 0) || ' modified' ELSE '' END
                       || CASE WHEN sum(status = 'added' AND untracked = 0) > 0 THEN ' · ' || sum(status = 'added' AND untracked = 0) || ' added' ELSE '' END
                       || CASE WHEN sum(status = 'deleted') > 0 THEN ' · ' || sum(status = 'deleted') || ' deleted' ELSE '' END
                       || CASE WHEN sum(untracked = 1) > 0 THEN ' · ' || sum(untracked = 1) || ' untracked' ELSE '' END END AS changes,
             uri('oxplow/page', 'page', 'uncommitted-changes') AS view
      FROM f
  recent:
    sql: |
      WITH RECURSIVE head(sha) AS (SELECT s.head_sha FROM v_stream s WHERE s.id = :stream_id),
      chain(sha, n) AS (
        SELECT sha, 1 FROM head WHERE sha IS NOT NULL
        UNION ALL
        SELECT c.first_parent, chain.n + 1 FROM chain JOIN v_commit c ON c.sha = chain.sha
        WHERE c.first_parent IS NOT NULL AND chain.n < 5
      )
      SELECT c.subject, c.uri AS commit_ref, c.author, c.committed_at,
             coalesce((SELECT group_concat(name, ', ') FROM (
               SELECT b.name FROM v_branch b WHERE b.head_sha = c.sha AND b.kind = 'local'
               UNION ALL SELECT t.name FROM v_tag t WHERE t.sha = c.sha)), '') AS refs,
             (SELECT '+' || coalesce(sum(f.additions), 0) || ' −' || coalesce(sum(f.deletions), 0) || ' · ' || count(*) || ' files'
                FROM v_commit_file f WHERE f.sha = c.sha) AS stats,
             'Recent commits' AS heading, uri('oxplow/page', 'page', 'git-history') AS history
      FROM chain JOIN v_commit c ON c.sha = chain.sha
      ORDER BY chain.n
  streams:
    sql: |
      WITH apart AS (
        SELECT d.head AS branch, d.ahead, d.behind FROM v_branch_divergence d WHERE d.base = :branch
      )
      SELECT s.title, s.branch AS other, :branch AS base, s.branch AS head,
             EXISTS (SELECT 1 FROM v_agent_status a JOIN v_thread t ON t.id = a.thread_id
                      WHERE t.stream_id = s.id AND a.state = 'running') AS working,
             coalesce((SELECT '↑' || a.ahead || ' ↓' || a.behind FROM apart a WHERE a.branch = s.branch), '') AS apart,
             coalesce((SELECT CASE WHEN count(*) = 0 THEN 'clean' ELSE count(*) || ' changed' END
                         FROM v_change c JOIN v_change_file f ON f.change_id = c.id
                        WHERE c.kind = 'working' AND c.target = '' AND c.stream_id = s.id), 'clean') AS uncommitted,
             coalesce((SELECT a.ahead > 0 FROM apart a WHERE a.branch = s.branch), 0) AS can_join
      FROM v_stream s
      WHERE s.id <> :stream_id AND s.archived_at IS NULL
      ORDER BY s.kind <> 'primary', s.title
    params:
      branch:
        from: row.branch
  readiness:
    sql: |
      SELECT coalesce(s.title, d.head) AS stream, d.head AS other, d.base,
             '↑' || d.ahead || ' ↓' || d.behind AS apart,
             CASE d.readiness WHEN 'clean' THEN 'Clean to merge' WHEN 'conflict' THEN 'Will conflict' ELSE 'Integrated' END AS readiness,
             CASE d.readiness WHEN 'clean' THEN 'good' WHEN 'conflict' THEN 'warn' ELSE 'muted' END AS tone,
             CASE WHEN d.readiness = 'conflict'
                  THEN (SELECT group_concat(x.value, ', ') FROM (SELECT value FROM json_each(d.overlapping_files) LIMIT 8) x) END AS overlap,
             (d.readiness = 'clean' AND :branch = d.base) AS can_merge
      FROM v_branch_divergence d LEFT JOIN v_stream s ON s.branch = d.head AND s.archived_at IS NULL
      WHERE d.ahead > 0 AND d.head <> d.base
      ORDER BY d.head
    params:
      branch:
        from: row.branch
  remotes:
    sql: |
      WITH apart AS (
        SELECT d.base AS short_name, d.ahead, d.behind FROM v_branch_divergence d WHERE d.head = :branch AND d.base LIKE '%/%'
      )
      SELECT b.remote || '/' || b.name AS short_name, b.remote, b.name AS remote_branch,
             c.subject, c.committed_at,
             coalesce((SELECT '↑' || a.ahead || ' ↓' || a.behind FROM apart a WHERE a.short_name = b.remote || '/' || b.name), '') AS apart,
             coalesce((SELECT a.behind > 0 FROM apart a WHERE a.short_name = b.remote || '/' || b.name), 0) AS can_pull,
             coalesce((SELECT a.ahead > 0 FROM apart a WHERE a.short_name = b.remote || '/' || b.name), 0) AS can_push
      FROM v_branch b LEFT JOIN v_commit c ON c.sha = b.head_sha
      WHERE b.kind = 'remote'
      ORDER BY c.committed_at DESC LIMIT 20
    params:
      branch:
        from: row.branch
view:
  stack:
  - id: upstream
    title: Upstream
    from: upstream
    viz: detail
    columns:
    - key: branch
      label: Branch
    - key: status
      label: Upstream
    empty: No branch is checked out.
    actions:
    - id: push
      label: Push
      command: oxplow.vcs.push
      input:
        stream: str{{param.stream_id}}
    - id: pull
      label: Pull
      command: oxplow.vcs.pull
      input:
        stream: str{{param.stream_id}}
    - id: fetch
      label: Fetch
      command: oxplow.vcs.fetch
      input:
        stream: str{{param.stream_id}}
  - id: uncommitted
    title: Uncommitted
    from: uncommitted
    viz: detail
    columns:
    - key: changes
      label: Changes
      link:
        kind: page
        from: view
  - id: recent
    title: Recent Commits
    from: recent
    viz: list
    group:
      by: heading
      link:
        kind: page
        from: history
    columns:
    - key: subject
      label: Commit
      link:
        kind: page
        from: commit_ref
    - key: refs
      label: Refs
      format: badge
    - key: author
      label: Who
    - key: committed_at
      label: When
      format: relative
      width: 110
    - key: stats
      label: Changed
    empty: No commits yet. Commits on this branch show up here as they're made.
  - id: streams
    title: Streams
    from: streams
    viz: list
    columns:
    - key: title
      label: Stream
      expand: oxplow-foundation/git-dashboard-between
    - key: other
      label: Branch
    - key: working
      label: Agent
      format: badge
    - key: uncommitted
      label: Working tree
    - key: apart
      label: Apart
    empty: No other streams.
    actions:
    - id: merge
      label: Merge into current
      command: oxplow.vcs.merge
      row: true
      when: can_join
      input:
        stream: str{{param.stream_id}}
        rev: '{{row.other}}'
    - id: rebase
      label: Rebase current onto
      command: oxplow.git.rebase
      row: true
      when: can_join
      input:
        stream: str{{param.stream_id}}
        rev: '{{row.other}}'
  - id: readiness
    title: Merge readiness
    from: readiness
    viz: list
    columns:
    - key: stream
      label: Stream
    - key: other
      label: Branch
    - key: apart
      label: Apart
    - key: readiness
      label: Readiness
      tone: tone
      format: badge
    - key: overlap
      label: Both changed
    empty: Every branch is integrated with the default branch.
    actions:
    - id: merge
      label: Merge into the default branch
      command: oxplow.vcs.merge
      row: true
      when: can_merge
      input:
        stream: str{{param.stream_id}}
        rev: '{{row.other}}'
  - id: remotes
    title: Recent Remote Branches
    from: remotes
    viz: list
    columns:
    - key: short_name
      label: Branch
    - key: subject
      label: Last commit
    - key: committed_at
      label: When
      format: relative
      width: 110
    - key: apart
      label: Apart
    empty: No remote branches.
    actions:
    - id: pull
      label: Pull into current
      command: oxplow.vcs.pull
      row: true
      when: can_pull
      input:
        stream: str{{param.stream_id}}
        remote: '{{row.remote}}'
        branch: '{{row.remote_branch}}'
    - id: push
      label: Push current to
      command: oxplow.vcs.push
      row: true
      when: can_push
      input:
        stream: str{{param.stream_id}}
        remote: '{{row.remote}}'
        branch: '{{row.remote_branch}}'
