title: Git Status
description: The stream's branch against its upstream, the working tree, the recent commits and the other streams.
icon: git-branch
category: Git
needs:
- vcs
params:
- name: stream_id
loaders:
  row:
    sql: |
      SELECT s.branch AS branch FROM v_stream s WHERE s.id = :stream_id
    columns:
    - key: branch
  # What a worktree's branch is compared with. Git doesn't record the branch
  # one came from, so it is the default branch, for a worktree made anywhere.
  base:
    sql: |
      SELECT b.name AS name FROM v_branch b WHERE b.kind = 'local' AND b.is_default = 1
  upstream:
    sql: |
      SELECT b.name AS branch,
             CASE WHEN w.id IS NOT NULL THEN 'Worktree' ELSE 'Repository' END AS heading,
             (b.upstream IS NULL AND EXISTS (SELECT 1 FROM v_branch r WHERE r.kind = 'remote')) AS can_publish,
             CASE WHEN b.upstream IS NULL AND NOT EXISTS (SELECT 1 FROM v_branch r WHERE r.kind = 'remote') THEN 'No remote'
                  WHEN b.upstream IS NULL THEN 'Not pushed yet'
                  WHEN b.ahead = 0 AND b.behind = 0 THEN 'In sync with ' || b.upstream
                  WHEN b.behind = 0 THEN b.ahead || ' ahead of ' || b.upstream
                  WHEN b.ahead = 0 THEN b.behind || ' behind ' || b.upstream
                  ELSE b.ahead || ' ahead of, ' || b.behind || ' behind ' || b.upstream END AS remote,
             (b.upstream IS NOT NULL AND b.ahead > 0) AS can_push,
             b.upstream IS NOT NULL AS has_upstream,
             w.id IS NOT NULL AS on_worktree,
             :base AS base,
             CASE WHEN d.ahead = 0 AND d.behind = 0 THEN 'Even with ' || :base
                  WHEN d.behind = 0 THEN d.ahead || ' ahead of ' || :base
                  WHEN d.ahead = 0 THEN d.behind || ' behind ' || :base
                  ELSE d.ahead || ' ahead of, ' || d.behind || ' behind ' || :base END AS compared,
             coalesce(d.behind > 0, 0) AS can_join
      FROM v_branch b
      LEFT JOIN v_stream w ON w.id = :stream_id AND w.kind = 'worktree' AND :base <> b.name
      LEFT JOIN v_branch_divergence d ON w.id IS NOT NULL AND d.base = :base AND d.head = :branch
      WHERE b.kind = 'local' AND b.name = :branch
    params:
      branch:
        from: row.branch
      base:
        from: base.name
  uncommitted:
    sql: |
      WITH w AS (
        SELECT c.id FROM v_change c WHERE c.kind = 'working' AND c.target = '' AND c.stream_id = :stream_id
      ), f AS (
        SELECT cf.status, cf.untracked FROM v_change_file cf JOIN w ON cf.change_id = w.id
      )
      SELECT CASE WHEN count(*) = 0 THEN 'No uncommitted files'
                  ELSE count(*) || ' changed'
                       || CASE WHEN sum(status = 'modified' AND untracked = 0) > 0 THEN ' · ' || sum(status = 'modified' AND untracked = 0) || ' modified' ELSE '' END
                       || CASE WHEN sum(status = 'added' AND untracked = 0) > 0 THEN ' · ' || sum(status = 'added' AND untracked = 0) || ' added' ELSE '' END
                       || CASE WHEN sum(status = 'deleted') > 0 THEN ' · ' || sum(status = 'deleted') || ' deleted' ELSE '' END
                       || CASE WHEN sum(untracked = 1) > 0 THEN ' · ' || sum(untracked = 1) || ' untracked' ELSE '' END END AS changes,
             uri('oxplow/page', 'page', 'uncommitted-changes') AS view
      FROM f
  recent:
    sql: |
      WITH RECURSIVE head(sha) AS (SELECT s.head_sha FROM v_stream s WHERE s.id = :stream_id),
      chain(sha, n) AS (
        SELECT sha, 1 FROM head WHERE sha IS NOT NULL
        UNION ALL
        SELECT c.first_parent, chain.n + 1 FROM chain JOIN v_commit c ON c.sha = chain.sha
        WHERE c.first_parent IS NOT NULL AND chain.n < 5
      )
      SELECT c.subject, c.uri AS commit_ref, c.author, c.committed_at,
             coalesce((SELECT group_concat(name, ', ') FROM (
               SELECT b.name FROM v_branch b WHERE b.head_sha = c.sha AND b.kind = 'local'
               UNION ALL SELECT t.name FROM v_tag t WHERE t.sha = c.sha)), '') AS refs,
             (SELECT '+' || coalesce(sum(f.additions), 0) || ' −' || coalesce(sum(f.deletions), 0) || ' · ' || count(*) || ' files'
                FROM v_commit_file f WHERE f.sha = c.sha) AS stats
      FROM chain JOIN v_commit c ON c.sha = chain.sha
      ORDER BY chain.n
  streams:
    sql: |
      WITH apart AS (
        SELECT d.head AS branch, d.ahead, d.behind FROM v_branch_divergence d WHERE d.base = :branch
      )
      SELECT s.title, s.branch AS other, :branch AS base, s.branch AS head,
             EXISTS (SELECT 1 FROM v_agent_status a JOIN v_thread t ON t.id = a.thread_id
                      WHERE t.stream_id = s.id AND a.state = 'running') AS working,
             coalesce((SELECT '↑' || a.ahead || ' ↓' || a.behind FROM apart a WHERE a.branch = s.branch), '') AS apart,
             coalesce((SELECT CASE WHEN count(*) = 0 THEN 'clean' ELSE count(*) || ' changed' END
                         FROM v_change c JOIN v_change_file f ON f.change_id = c.id
                        WHERE c.kind = 'working' AND c.target = '' AND c.stream_id = s.id), 'clean') AS uncommitted,
             coalesce((SELECT a.ahead > 0 FROM apart a WHERE a.branch = s.branch), 0) AS can_join
      FROM v_stream s
      WHERE s.id <> :stream_id AND s.archived_at IS NULL
      ORDER BY s.kind <> 'primary', s.title
    params:
      branch:
        from: row.branch
view:
  stack:
  - id: upstream
    title: Repository
    title_from: heading
    callout: true
    icon: git-branch
    from: upstream
    viz: detail
    columns:
    - key: branch
      label: Branch
    - key: remote
      label: Remote
    - key: compared
      label: Compared with
      when: on_worktree
    empty: No branch is checked out.
    actions:
    - id: merge-base
      label: Merge
      command: oxplow.vcs.merge
      when: on_worktree
      enabled: can_join
      fact: compared
      input:
        stream: str{{param.stream_id}}
        rev: '{{row.base}}'
    - id: rebase-base
      label: Rebase
      command: oxplow.git.rebase
      when: on_worktree
      enabled: can_join
      fact: compared
      input:
        stream: str{{param.stream_id}}
        rev: '{{row.base}}'
    - id: publish
      label: Publish
      when: can_publish
      fact: remote
      command: oxplow.git.publish
      input:
        stream: str{{param.stream_id}}
    - id: push
      label: Push
      when: has_upstream
      enabled: can_push
      fact: remote
      command: oxplow.vcs.push
      input:
        stream: str{{param.stream_id}}
    - id: pull
      label: Pull
      command: oxplow.vcs.pull
      fact: remote
      when: has_upstream
      input:
        stream: str{{param.stream_id}}
    - id: fetch
      label: Fetch
      command: oxplow.vcs.fetch
      fact: remote
      when: has_upstream
      input:
        stream: str{{param.stream_id}}
  - id: uncommitted
    title: Uncommitted
    from: uncommitted
    viz: detail
    columns:
    - key: changes
      label: Changes
      link:
        kind: page
        from: view
  - id: recent
    title: Recent Commits
    collapsible: true
    link: git-history
    from: recent
    viz: list
    columns:
    - key: subject
      label: Commit
      link:
        kind: page
        from: commit_ref
    - key: refs
      label: Refs
      format: badge
    - key: author
      label: Who
    - key: committed_at
      label: When
      format: relative
      width: 110
    - key: stats
      label: Changed
    empty: No commits yet. Commits on this branch show up here as they're made.
  - id: streams
    title: Streams
    collapsible: true
    from: streams
    viz: list
    columns:
    - key: title
      label: Stream
      expand: oxplow-foundation/git-dashboard-between
    - key: other
      label: Branch
    - key: working
      label: Agent
      format: badge
    - key: uncommitted
      label: Working tree
    - key: apart
      label: Apart
    empty: No other streams.
    actions:
    - id: merge
      label: Merge into current
      command: oxplow.vcs.merge
      row: true
      when: can_join
      input:
        stream: str{{param.stream_id}}
        rev: '{{row.other}}'
    - id: rebase
      label: Rebase current onto
      command: oxplow.git.rebase
      row: true
      when: can_join
      input:
        stream: str{{param.stream_id}}
        rev: '{{row.other}}'
