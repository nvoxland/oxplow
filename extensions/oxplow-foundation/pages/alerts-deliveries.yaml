title: Undelivered events
description: Events a consumer couldn't take. Retry runs the event through its consumer again; Discard gives up on it for that consumer.
hidden: true
answers:
- {"question":"Which events couldn't be delivered to their consumer?","params":{},"skill":"oxplow-extension"}
loaders:
  alerts_deliveries:
    sql: |
      SELECT id, consumer || ' couldn''t take ' || event_type || ' (event ' || event_seq || '), '
               || CASE attempts WHEN 1 THEN 'once' ELSE attempts || ' times' END AS what,
             error
      FROM v_event_dead_letter WHERE state = 'pending' ORDER BY id DESC
view:
  from: alerts_deliveries
  viz: table
  columns:
  - key: what
    label: Event
  - key: error
    label: Error
  empty: Every event was delivered.
  actions:
  - id: retry
    label: Retry
    command: oxplow.delivery.retry
    input:
      id: '{{row.id}}'
    row: true
  - id: discard
    label: Discard
    command: oxplow.delivery.discard
    input:
      id: '{{row.id}}'
    row: true
