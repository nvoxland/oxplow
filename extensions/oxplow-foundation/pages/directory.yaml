title: Directory
description: "A folder as an expandable tree, on the stream's worktree or the filesystem and revision its URI names. The renderer of oxplow's `dir` resource (`[[dir:src]]`)."
label: '{{param.path|basename}}'
for: oxplow/dir
default: true
params:
- name: uri
  label: Folder
- name: path
  label: Path
- name: filesystem
  label: Filesystem
  default: oxplow:local
- name: rev
  label: Revision
  default: ''
- name: stream_id
# Show and Compare with read git, so they apply only to the worktree now;
# on any other filesystem or revision they are ignored (the choices offer
# only "all files" and "no comparison" there).
- name: scope
  type: choice
  role: filter
  label: Show
  options_from: oxplow/files-scopes
  default: all
- name: compare
  type: choice
  role: filter
  label: Compare with
  options_from: oxplow/files-refs
  default: none
# The folder a lazy branch reads; set by the tree, never by a person.
- name: folder
  role: view
  default: ''
answers:
- {"question":"What is in the src folder of this stream's worktree, and which of its files changed?","params":{"stream_id":1,"path":"src"},"skill":"oxplow-codebase"}
loaders:
  row:
    sql: |
      SELECT v.is_local, v.shown, v.scope AS eff_scope, v.compare AS eff_compare,
             CASE v.scope WHEN 'all' THEN 'all' WHEN 'changed' THEN 'changed' ELSE 'changed_untracked' END AS show,
             CASE WHEN v.scope = 'all' THEN v.shown ELSE :path END AS list_folder
      FROM (SELECT (:filesystem = 'oxplow:local' AND :rev = '') AS is_local,
                   CASE WHEN :folder <> '' THEN :folder ELSE :path END AS shown,
                   CASE WHEN :filesystem = 'oxplow:local' AND :rev = '' THEN :scope ELSE 'all' END AS scope,
                   CASE WHEN :filesystem = 'oxplow:local' AND :rev = '' THEN :compare ELSE 'none' END AS compare) v
    columns:
    - key: is_local
    - key: shown
    - key: eff_scope
    - key: eff_compare
    - key: show
    - key: list_folder
  # Where a branch comparison starts: the merge base with the branch Show
  # names. `d.base = :eff_scope` names the one pair, so the divergence
  # dataset walks that pair alone; a correlated `d.base = v.scope` named no
  # pair and walked every branch against HEAD on every run of every folder,
  # also with Show at "all files" (where nothing reads it).
  range:
    sql: |
      SELECT CASE WHEN :eff_scope IN ('all', 'uncommitted', 'changed') THEN ''
                  ELSE coalesce((SELECT 'git:' || d.merge_base || '..working' FROM v_branch_divergence d
                                 WHERE d.base = :eff_scope AND d.head = 'HEAD'), '') END AS change_target
    columns:
    - key: change_target
    params:
      eff_scope:
        from: row.eff_scope
  # The files the Show filter names: the one statement (`worktree-files`),
  # a folder's level when all files are shown (a lazy tree), else every
  # changed file under the folder (the tree makes their folders).
  files:
    page: oxplow/worktree-files
    loader: files
    params:
      stream_id: { param: stream_id }
      show: { from: row.show }
      target: { from: range.change_target }
      folder: { from: row.list_folder }
      filesystem: { param: filesystem }
      rev: { param: rev }
  tree:
    sql: |
      SELECT f.path AS id, f.path, f.status,
             substr(f.path, length(rtrim(f.path, replace(f.path, '/', ''))) + 1) AS name,
             f.is_dir, (f.is_dir AND :eff_scope = 'all') AS opens,
             CASE
               WHEN f.is_dir THEN NULL
               WHEN :eff_compare <> 'none' THEN uri('oxplow/page', 'page', 'diff', 'path', f.path, 'left', 'git:' || :eff_compare, 'right', 'working', 'label', :eff_compare || '..working')
               WHEN :eff_scope <> 'all' THEN uri('oxplow/page', 'page', 'diff', 'path', f.path, 'left', f.base_revision, 'right', 'working', 'label', 'changes')
               ELSE f.uri
             END AS target,
             CASE WHEN f.is_dir THEN f.uri END AS folder_uri,
             json_array(f.path) AS paths_json,
             (NOT f.is_dir) AS is_file,
             :is_local AS can_write,
             (:is_local AND f.status = 'untracked') AS is_untracked,
             CASE WHEN f.is_dir THEN f.path || '/' ELSE rtrim(f.path, replace(f.path, '/', '')) END || 'new-file.txt' AS new_file_path,
             CASE WHEN f.is_dir THEN f.path || '/' ELSE rtrim(f.path, replace(f.path, '/', '')) END || 'new-folder' AS new_folder_path,
             (:is_local AND NOT EXISTS (SELECT 1 FROM v_config_value g, json_each(g.value) e
                     WHERE g.key = 'oxplow.generated.exclude' AND e.value = substr(f.path, length(rtrim(f.path, replace(f.path, '/', ''))) + 1))) AS can_mark,
             (:is_local AND EXISTS (SELECT 1 FROM v_config_value g, json_each(g.value) e
                     WHERE g.key = 'oxplow.generated.exclude' AND e.value = substr(f.path, length(rtrim(f.path, replace(f.path, '/', ''))) + 1))) AS marked
      FROM files f
      ORDER BY f.is_dir DESC, f.path
    params:
      eff_scope:
        from: row.eff_scope
      eff_compare:
        from: row.eff_compare
      is_local:
        from: row.is_local
  # The folder above it (none at the top of the filesystem).
  parent_folder:
    sql: |
      SELECT CASE WHEN :path LIKE '%/%' THEN rtrim(rtrim(:path, replace(:path, '/', '')), '/') ELSE '' END AS title,
             uri('oxplow/dir', 'filesystem', NULLIF(:filesystem, 'oxplow:local'),
                 'path', rtrim(rtrim(:path, replace(:path, '/', '')), '/'),
                 'rev', NULLIF(:rev, '')) AS uri
      WHERE :path LIKE '%/%'
view:
  stack:
  - id: tree
    title: Files
    hide_title: true
    from: tree
    viz: tree
    tree:
      path: path
      status: status
      lazy: folder
      branch: opens
    columns:
    - key: path
      label: Name
      link:
        kind: page
        from: target
    empty: (empty) With Show set to changed files, nothing has changed.
    actions:
    - id: new-file
      label: New File…
      command: oxplow.file.create
      row: true
      when: can_write
      form: true
      fixed:
      - stream
      - content
      input:
        stream: str{{param.stream_id}}
        path: '{{row.new_file_path}}'
        content: ''
    - id: new-folder
      label: New Directory…
      command: oxplow.file.create_directory
      row: true
      when: can_write
      form: true
      fixed:
      - stream
      input:
        stream: str{{param.stream_id}}
        path: '{{row.new_folder_path}}'
    - id: rename
      label: Rename…
      command: oxplow.file.rename
      row: true
      when: can_write
      form: true
      fixed:
      - stream
      - from
      input:
        stream: str{{param.stream_id}}
        from: '{{row.id}}'
        to: '{{row.id}}'
    - id: delete
      label: Delete
      command: oxplow.file.delete
      row: true
      when: can_write
      key: Delete
      input:
        stream: str{{param.stream_id}}
        path: '{{row.id}}'
    - id: open-folder
      label: Open Folder
      command: oxplow.window.navigate
      row: true
      when: is_dir
      input:
        uri: '{{row.folder_uri}}'
    - id: usages
      label: Find Usages
      command: oxplow.window.quick_open
      row: true
      input:
        query: '{{row.name}}'
    - id: add
      label: Add
      command: oxplow.vcs.stage
      row: true
      when: is_untracked
      input:
        stream: str{{param.stream_id}}
        paths: '{{row.paths_json|json}}'
    - id: mark-generated
      label: Mark as Generated
      command: oxplow.file.mark_generated
      row: true
      when: can_mark
      input:
        entry: '{{row.name}}'
    - id: unmark-generated
      label: Unmark as Generated
      command: oxplow.file.mark_generated
      row: true
      when: marked
      input:
        entry: '{{row.name}}'
        generated: false
see_also:
  - { from: parent_folder }
