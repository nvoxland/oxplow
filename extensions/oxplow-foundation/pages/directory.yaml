title: Directory
description: "A folder's contents, on the stream's worktree or the filesystem and revision its URI names, folders first. The renderer of oxplow's `dir` resource (`[[dir:src]]`)."
label: '{{param.path|basename}}'
for: oxplow/dir
default: true
params:
- name: uri
  label: Folder
- name: path
  label: Path
- name: filesystem
  label: Filesystem
  default: oxplow:local
- name: rev
  label: Revision
  default: ''
- name: stream_id
answers:
- {"question":"What is in the src folder of this stream's worktree, and which of its files changed?","params":{"stream_id":1,"path":"src"},"skill":"oxplow-extension"}
loaders:
  directory:
    sql: |
      SELECT name, kind, status,
             CASE kind WHEN 'dir' THEN 'folder' ELSE 'file' END AS icon,
             uri AS target
      FROM v_file
      WHERE stream_id = :stream_id AND filesystem = :filesystem AND rev = :rev AND parent = :path
      ORDER BY kind = 'dir' DESC, name
view:
  from: directory
  viz: list
  columns:
  - key: name
    label: Name
    link:
      kind: page
      from: target
    icon: icon
  - key: status
    label: Change
    format: badge
  empty: (empty)
