title: Extension facts
description: "What can be said about extensions in words: where each comes from, what runs, its state, what it may reach, what it waits on and any problems. One extension, or every one with the ones needing attention first."
hidden: true
params:
- name: extension
  type: search
  label: Extension
answers:
- {"question":"What may each extension reach, in words?","params":{},"skill":"oxplow-extension"}
loaders:
  # What each permission means, one row per scope an extension holds.
  reach:
    sql: |
      SELECT e.name AS extension, j.key AS ord, j.value AS scope,
             CASE
               WHEN j.value = 'sql.read' THEN 'read your project''s data with SQL'
               WHEN j.value = 'sql.write' THEN 'change your project''s data with SQL'
               WHEN j.value = 'files.read' THEN 'read your project''s files'
               WHEN j.value = 'files.write' THEN 'change your project''s files'
               WHEN j.value = 'ai.compute' THEN 'use your AI model key'
               WHEN j.value = 'process.run' THEN 'run programs on your machine'
               WHEN j.value = 'agent.write' THEN 'give your agents instructions'
               WHEN j.value LIKE 'network:%' THEN 'reach ' || substr(j.value, 9) || ' over the network'
               WHEN j.value LIKE 'secrets:%' THEN 'read the secret ' || substr(j.value, 9)
               WHEN j.value LIKE 'commands:%' THEN 'run the commands matching ' || substr(j.value, 10)
               ELSE 'use the ' || j.value || ' permission'
             END AS text
      FROM v_extension e, json_each(e.permissions) j
      WHERE :extension IS NULL OR e.name = :extension
      ORDER BY e.name, j.key
  # One row per extension: each fact a column, in words.
  summary:
    sql: |
      WITH x AS (
        SELECT e.name, e.uri, e.origin, e.enabled, e.deployment, e.hash, e.shared, e.pending, e.version,
               d.deployed_at,
               s.hash AS source_hash, s.path AS source_path,
               COALESCE(h.failing, 0) AS failing, COALESCE(h.disabled, 0) AS disabled,
               json_array_length(e.errors) AS load_problems,
               json_array_length(e.pending) AS awaiting
        FROM v_extension e LEFT JOIN v_extension_source s ON s.name = e.name
             LEFT JOIN v_extension_deployment d ON d.name = e.name AND d.hash = e.hash
             LEFT JOIN (SELECT extension, sum(state = 'failing') AS failing, sum(state = 'disabled') AS disabled
                        FROM v_contribution_health GROUP BY extension) h ON h.extension = e.name
        WHERE :extension IS NULL OR e.name = :extension
      )
      SELECT *
      FROM (
      SELECT x.name AS extension, x.name || CASE WHEN x.enabled THEN '' ELSE ' (disabled)' END AS heading,
             x.name AS id, x.uri, x.origin,
             -- Where it comes from: oxplow's own, or its folder in the project
             -- (a link to that folder).
             CASE WHEN x.origin = 'bundled' THEN 'Shipped with oxplow'
                  ELSE COALESCE(x.source_path
                         || CASE WHEN x.deployment = 'deployed' AND x.source_hash <> x.hash
                                 THEN ' (changed since it was deployed)' ELSE '' END,
                       'Not on this machine') END AS origin_text,
             CASE WHEN x.origin <> 'bundled' AND x.source_path IS NOT NULL
                  THEN uri('oxplow/dir', 'path', x.source_path) END AS origin_target,
             -- Which version runs: its declared version, the deployment and when
             -- it was deployed.
             CASE x.deployment
               WHEN 'deployed' THEN COALESCE(x.version || ', ', '') || 'deployment ' || substr(x.hash, 1, 7)
                    || COALESCE(', deployed ' || strftime('%Y-%m-%d', x.deployed_at), '')
               WHEN 'shipped' THEN COALESCE(x.version || ', ', '') || 'the copy shipped with oxplow'
               WHEN 'source' THEN 'Its source folder, as it is'
               WHEN 'undeployed' THEN 'Never deployed'
               ELSE 'Not on this machine' END
               || CASE WHEN x.enabled THEN '' ELSE ' (Disabled)' END AS version_text,
             -- Each scope as it is written, alphabetically, with what it lets
             -- the extension do as its hover.
             NULLIF((SELECT json_group_array(json_object('text', r.scope, 'hint', 'May ' || r.text || '.') ORDER BY r.scope)
                     FROM reach r WHERE r.extension = x.name), '[]') AS permission_items,
             CASE WHEN x.failing + x.disabled + x.load_problems + x.awaiting > 0 THEN
               'Problems: ' || (
                 SELECT group_concat(part, '; ') FROM (
                   SELECT x.disabled || CASE WHEN x.disabled = 1 THEN ' contribution' ELSE ' contributions' END || ' stopped after failing' AS part WHERE x.disabled > 0
                   UNION ALL SELECT x.failing || CASE WHEN x.failing = 1 THEN ' contribution' ELSE ' contributions' END || ' failing' WHERE x.failing > 0
                   UNION ALL SELECT x.awaiting || CASE WHEN x.awaiting = 1 THEN ' permission' ELSE ' permissions' END || ' waiting for your approval' WHERE x.awaiting > 0
                   UNION ALL SELECT x.load_problems || CASE WHEN x.load_problems = 1 THEN ' problem' ELSE ' problems' END || ' loading it' WHERE x.load_problems > 0))
             END AS problems_label,
             uri('oxplow/page', 'page', 'extension-problems') || '#extension=' || x.name AS problems_target,
             (NOT x.enabled OR json_array_length(x.pending) > 0 OR x.load_problems > 0 OR x.failing + x.disabled > 0
              OR (x.source_hash IS NOT NULL AND x.hash IS NOT NULL AND x.source_hash <> x.hash)) AS attention
      FROM x)
      ORDER BY attention DESC, origin, extension
view:
  from: summary
  viz: sections
  sections: { title: heading, id: id, link: uri }
  columns:
  - { key: origin_text, label: From, link: { kind: page, from: origin_target } }
  - { key: version_text, label: Version }
  - { key: permission_items, label: Permissions, format: items }
  - { key: problems_label, label: Problems, link: { kind: page, from: problems_target } }
  empty: No extensions.
