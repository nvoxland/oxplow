title: New Stream
description: "The form for a new stream, which is its own worktree and its own threads: on a branch (local, or remote as a local branch that tracks it), on a new branch made from any revision, or on a worktree already on disk."
icon: plus
needs:
- vcs
params:
- name: tab
  label: Start from
  default: new
  options:
  - { value: new, label: New Branch }
  - { value: worktree, label: From Worktree }
  - { value: branch, label: From Branch }
answers:
- {"question":"Which branches could a new stream start on?","params":{},"skill":"oxplow-codebase"}
- {"question":"Which worktrees of this repository could a new stream adopt?","params":{"tab":"worktree"},"skill":"oxplow-codebase"}
loaders:
  # A new stream's branch: a local one no stream has out, or a remote one
  # with no local copy (checked out as a local branch that tracks it). One
  # in a working copy no stream uses is that copy, adopted.
  branches:
    sql: |
      WITH loose AS (
        SELECT path, branch FROM v_vcs_workspace WHERE is_main = 0 AND stream_id IS NULL
      )
      SELECT b.name AS value, b.name AS branch, 'Local' AS place, b.subject, b.committed_at,
             CASE WHEN b.upstream IS NULL OR (b.ahead = 0 AND b.behind = 0) THEN NULL
                  ELSE trim(CASE WHEN b.ahead > 0 THEN '↑' || b.ahead ELSE '' END || ' ' ||
                            CASE WHEN b.behind > 0 THEN '↓' || b.behind ELSE '' END)
             END AS sync,
             (SELECT 'In worktree ' || replace(l.path, rtrim(l.path, replace(l.path, '/', '')), '')
              FROM loose l WHERE l.branch = b.name) AS note,
             b.is_default
      FROM v_branch b
      WHERE b.kind = 'local' AND b.stream_id IS NULL
      UNION ALL
      SELECT r.remote || '/' || r.name, r.name, r.remote, r.subject, r.committed_at,
             NULL, 'Makes a local branch that tracks it', 0
      FROM v_branch r
      WHERE r.kind = 'remote'
        AND NOT EXISTS (SELECT 1 FROM v_branch l WHERE l.kind = 'local' AND l.name = r.name)
      ORDER BY is_default DESC, committed_at DESC, value
  new_form:
    sql: |
      SELECT 'new' AS source, CAST(NULL AS TEXT) AS new_branch,
             (SELECT name FROM v_branch WHERE kind = 'local' ORDER BY is_default DESC, name LIMIT 1) AS start_point
  # What a new branch can start from: any revision; these are offered.
  start_points:
    sql: |
      SELECT value, label, "group" FROM (
        SELECT name AS value, name AS label, 'Branches' AS "group", 0 AS k, is_default AS d
        FROM v_branch WHERE kind = 'local'
        UNION ALL
        SELECT remote || '/' || name, remote || '/' || name, 'Remote branches', 1, 0
        FROM v_branch WHERE kind = 'remote'
        UNION ALL
        SELECT name, name, 'Tags', 2, 0 FROM v_tag
      )
      ORDER BY k, d DESC, value
  # The repository's working copies no stream uses (made by oxplow or not).
  worktrees:
    sql: |
      SELECT w.path AS value, w.path,
             replace(w.path, rtrim(w.path, replace(w.path, '/', '')), '') AS folder,
             coalesce(w.branch, 'detached') AS branch,
             w.subject, w.committed_at,
             CASE WHEN w.changes > 0 THEN w.changes END AS changes
      FROM v_vcs_workspace w
      WHERE w.is_main = 0 AND w.stream_id IS NULL
      ORDER BY w.committed_at DESC, w.path
view:
  stack:
  - id: start
    title: Start from
    hide_title: true
    switch:
      param: tab
      children:
      - id: new
        title: New Branch
        from: new_form
        viz: form
        form:
          command: oxplow.stream.create
          then: replace
          submit: Create Stream
          defaults: { source: new }
          fixed: [source]
          fields:
          - { name: new_branch, label: Branch name, help: "A new worktree is made on it; the stream and the worktree's folder are named for it." }
          - { name: start_point, label: Start from, help: "A branch, a remote branch, a tag or a commit." }
          choices:
            start_point: { from: oxplow/new-stream#start_points, open: true }
      - id: worktree
        title: From Worktree
        description: This repository's worktrees that no stream uses, whoever made them. Click one to start a stream in it.
        from: worktrees
        viz: table
        single_line: true
        empty: Every worktree of this repository already has a stream.
        columns:
        - { key: folder, label: Worktree, width: 200 }
        - { key: branch, label: Branch, width: 180 }
        - { key: subject, label: Last commit }
        - { key: committed_at, label: When, format: relative, width: 100 }
        - { key: changes, label: Changed, format: integer, width: 80 }
        actions:
        - id: create
          label: Create Stream…
          row: true
          primary: true
          form: true
          icon: plus
          command: oxplow.stream.create
          then: replace
          about: path
          input: { source: worktree, worktree: '{{row.value}}', title: '{{row.folder}}' }
          fixed: [source, worktree]
          fields:
          - { name: title, label: Stream name }
      - id: branch
        title: From Branch
        description: Local branches no stream works on, and remote branches with no local copy. Click one to start a stream on it.
        from: branches
        viz: table
        single_line: true
        empty: Every branch already has a stream. Start a new branch instead.
        columns:
        - { key: branch, label: Branch, width: 220 }
        - { key: place, label: Where, width: 72 }
        - { key: subject, label: Last commit }
        - { key: committed_at, label: When, format: relative, width: 100 }
        - { key: sync, label: Upstream, width: 80 }
        - { key: note, label: Note, width: 170 }
        actions:
        - id: create
          label: Create Stream…
          row: true
          primary: true
          form: true
          icon: plus
          command: oxplow.stream.create
          then: replace
          about: value
          input: { source: existing, existing_branch: '{{row.value}}', title: '{{row.branch}}' }
          fixed: [source, existing_branch]
          fields:
          - { name: title, label: Stream name }
