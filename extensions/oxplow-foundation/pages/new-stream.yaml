title: New Stream
description: "The form for a new stream, which is its own worktree and its own threads: on an existing branch, on a new branch forked from another, or on an adopted worktree."
icon: plus
needs:
- vcs
answers:
- {"question":"Which branches exist, and which is the default?","params":{},"skill":"oxplow-codebase"}
- {"question":"Which worktrees of this repository could a new stream adopt?","params":{},"skill":"oxplow-codebase"}
loaders:
  new_stream:
    sql: |
      SELECT 'Stream ' || (SELECT count(*) + 1 FROM v_stream WHERE archived_at IS NULL) AS title,
             'existing' AS source,
             (SELECT name FROM v_branch WHERE kind = 'local' ORDER BY is_default DESC, name LIMIT 1) AS existing_branch,
             (SELECT name FROM v_branch WHERE kind = 'local' ORDER BY is_default DESC, name LIMIT 1) AS start_point
  new_stream_branches:
    sql: |
      SELECT b.name AS value, b.name AS label, 'Branches' AS "group"
      FROM v_branch b
      WHERE b.kind = 'local'
      ORDER BY b.is_default DESC, b.name
  new_stream_worktrees:
    sql: |
      SELECT w.path AS value,
             CASE WHEN w.branch IS NULL OR w.branch = '' THEN '[detached] ' ELSE '[' || w.branch || '] ' END || w.path AS label
      FROM v_vcs_workspace w
      WHERE w.is_main = 0 AND w.stream_id IS NULL
      ORDER BY w.path
view:
  from: new_stream
  viz: form
  form:
    command: oxplow.stream.create
    then: replace
    fields:
    - title
    - source
    - name: existing_branch
      visible_if:
        source:
        - existing
    - name: new_branch
      visible_if:
        source:
        - new
    - name: start_point
      visible_if:
        source:
        - new
    - name: worktree
      visible_if:
        source:
        - worktree
    choices:
      existing_branch: oxplow-foundation/new-stream#new_stream_branches
      start_point: oxplow-foundation/new-stream#new_stream_branches
      worktree: oxplow-foundation/new-stream#new_stream_worktrees
