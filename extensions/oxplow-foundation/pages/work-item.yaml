title: Work Item
description: 'One work item, whichever list it is on: its state, title, fields and description, where it is and when it changed, its links, comments and efforts.'
label: '{{row.title}}'
for: oxplow/work_item
default: true
comments: true
needs:
- work_items
- work_items.links
- work_items.comments
params:
- name: uri
- name: thread_id
- name: stream_id
data:
  row:
    sql: |
      SELECT w.title AS title FROM v_work_item w WHERE w.uri = :uri
    columns:
    - key: title
  state:
    sql: |
      SELECT w.uri, w.state AS "to" FROM v_work_item w WHERE w.uri = :uri
  fields:
    sql: |
      SELECT w.uri, w.title, w.native FROM v_work_item w WHERE w.uri = :uri
  body:
    sql: |
      SELECT w.uri, coalesce(w.body, '') AS body FROM v_work_item w WHERE w.uri = :uri
  info:
    sql: |
      WITH feat AS (
        SELECT p.features AS f FROM v_capability_provider p WHERE p.capability = 'work_items' AND p.active = 1
      )
      SELECT w.uri, w.native_id AS id, w.provider,
             CASE WHEN w.thread_id IS NULL THEN 'Backlog'
                  ELSE coalesce((SELECT t.title FROM v_thread t WHERE t.id = w.thread_id), w.thread_id) END AS list,
             (SELECT p.title FROM v_work_item p WHERE p.uri = w.parent_uri) AS parent,
             w.parent_uri, w.created_at, w.updated_at, w.closed_at,
             (w.thread_id IS NULL AND :thread_id IS NOT NULL
                AND coalesce((SELECT json_extract(f, '$.lists') FROM feat), 0) = 1) AS can_bring,
             (w.thread_id IS NOT NULL AND w.thread_id = :thread_id
                AND coalesce((SELECT json_extract(f, '$.lists') FROM feat), 0) = 1) AS can_send,
             'thr' || :thread_id AS thread_ref,
             coalesce((SELECT json_extract(f, '$.delete') FROM feat), 0) AS can_delete
      FROM v_work_item w WHERE w.uri = :uri
  links:
    sql: |
      SELECT l.to_uri AS other, coalesce((SELECT w.title FROM v_work_item w WHERE w.uri = l.to_uri), l.to_uri) AS item,
             l.link_type, 'to' AS direction, 1 AS outbound
      FROM v_work_item_link l WHERE l.from_uri = :uri
      UNION ALL
      SELECT l.from_uri, coalesce((SELECT w.title FROM v_work_item w WHERE w.uri = l.from_uri), l.from_uri),
             l.link_type, 'from', 0
      FROM v_work_item_link l WHERE l.to_uri = :uri
  comments:
    sql: |
      SELECT c.id, c.author, c.body, c.created_at
      FROM v_work_item_comment c WHERE c.uri = :uri ORDER BY c.created_at, c.id
  activity:
    sql: |
      SELECT e.uri, e.title, e.started_at, e.ended_at,
             (SELECT count(*) FROM v_effort_file f WHERE f.effort_id = e.id) AS files,
             e.summary
      FROM v_effort e WHERE e.work_item = :uri ORDER BY e.started_at DESC, e.id DESC
view:
  stack:
  - id: state
    replaceable: work_item.detail.state
    title: State
    from: state
    viz: form
    form:
      command: oxplow.work_item.transition
      mode: edit
      fields:
      - to
  - id: fields
    title: Details
    from: fields
    viz: form
    form:
      command: oxplow.work_item.update
      mode: edit
      fields:
      - title
      - name: native
        from: oxplow-foundation/work-item-fields
  - id: body
    replaceable: work_item.detail
    title: Description
    from: body
    viz: markdown
    markdown:
      text: body
    actions:
    - id: save
      label: Save
      command: oxplow.work_item.update
      edit: true
      fixed:
      - uri
      input:
        uri: '{{row.uri}}'
        body: '{{row.body}}'
  - id: info
    title: About
    from: info
    viz: detail
    columns:
    - key: id
      label: ID
    - key: provider
      label: List
    - key: list
      label: On
    - key: parent
      label: Parent
      link:
        kind: page
        from: parent_uri
    - key: created_at
      label: Created
      format: relative
    - key: updated_at
      label: Updated
      format: relative
    - key: closed_at
      label: Closed
      format: relative
    empty: This work item isn't on the active work list.
    actions:
    - id: bring
      label: Bring to this thread
      command: oxplow.work_item.move
      row: true
      when: can_bring
      input:
        uri: '{{row.uri}}'
        to:
          thread: '{{row.thread_ref}}'
    - id: send
      label: Send to backlog
      command: oxplow.work_item.move
      row: true
      when: can_send
      input:
        uri: '{{row.uri}}'
        to: backlog
    - id: delete
      label: Delete
      command: oxplow.work_item.delete
      row: true
      then: close
      when: can_delete
      input:
        uri: '{{row.uri}}'
  - id: links
    title: Links
    from: links
    viz: table
    columns:
    - key: link_type
      label: Link
      width: 130
    - key: direction
      label: Direction
      width: 90
    - key: item
      label: Item
      link:
        kind: page
        from: other
    empty: No links.
    actions:
    - id: link
      label: Link…
      command: oxplow.work_item.link
      form: true
      fixed:
      - uri
      input:
        uri: '{{param.uri}}'
        link_type: relates_to
    - id: unlink
      label: Unlink
      command: oxplow.work_item.unlink
      row: true
      when: outbound
      input:
        uri: '{{param.uri}}'
        target: '{{row.other}}'
        link_type: '{{row.link_type}}'
  - id: comments
    title: Comments
    from: comments
    viz: list
    columns:
    - key: author
      label: Who
      width: 90
    - key: body
      label: Says
    - key: created_at
      label: When
      format: relative
      width: 110
    empty: No comments.
    actions:
    - id: comment
      label: Comment…
      command: oxplow.work_item.comment
      form: true
      fixed:
      - uri
      input:
        uri: '{{param.uri}}'
  - id: activity
    title: Activity
    from: activity
    viz: table
    columns:
    - key: title
      label: Effort
      link:
        kind: page
        from: uri
    - key: started_at
      label: Started
      format: relative
      width: 120
    - key: ended_at
      label: Ended
      format: relative
      width: 120
    - key: files
      label: Files
      width: 70
    - key: summary
      label: Summary
    empty: No effort on this item yet.
  - slot: sections
