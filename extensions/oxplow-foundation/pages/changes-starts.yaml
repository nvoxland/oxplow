title: Starting points
description: The points a comparison can start from - the whole tree, or one of the stream's recent snapshots, before the end.
hidden: true
params:
- name: stream_id
- name: end
  default: ''
loaders:
  changes_starts:
    sql: |
      SELECT value, label, "group" FROM (
        SELECT '' AS value, 'Nothing - the whole tree' AS label, 'Start' AS "group", 1 AS k, 0 AS n
        UNION ALL
        SELECT 'snap:' || s.id, substr(s.created_at, 1, 19) || coalesce(' - ' || substr(s.revision, 5, 7), ''),
               coalesce(s.branch, 'Snapshots'), 0, s.id
        FROM v_snapshot s
        WHERE s.stream_id = :stream_id
          AND (coalesce(:end, '') NOT LIKE 'snap:%' OR s.id < CAST(substr(:end, 6) AS INTEGER))
      ) ORDER BY k DESC, n DESC LIMIT 41
view:
  from: changes_starts
  viz: table
