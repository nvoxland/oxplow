title: Skill
description: One skill — what it teaches an agent, whether it is a skill or a slash command, what it needs, and the extension that declares it.
label: '{{row.name}}'
icon: book-open
for: oxplow/skill
params:
- name: uri
  label: Skill
answers:
- {"question":"What does this skill teach an agent?","about":"oxplow/skill","params":{"uri":"oxplow:oxplow/skill?skill=oxplow/work-items"},"skill":"oxplow-extension"}
loaders:
  about:
    sql: |
      WITH f AS (
        -- The file inside the extension, under the extension's folder.
        SELECT *, extension || '/' || file AS rel
        FROM v_contribution WHERE uri = :uri
      )
      SELECT k.name AS name, COALESCE(k.description, f.description) AS description,
             f.extension, 'oxplow:oxplow/extension?name=' || f.extension AS extension_target,
             f.rel || CASE WHEN f.line IS NOT NULL THEN ', line ' || f.line ELSE '' END AS declared,
             CASE WHEN f.rel IS NOT NULL THEN
                    uri('oxplow/file', 'filesystem', 'oxplow:extensions', 'path', f.rel)
                    || CASE WHEN f.line IS NOT NULL THEN '#lines=' || f.line || '&' ELSE '#' END
                    || 'oxplow.renderer=oxplow/file-viewer' END AS declared_target
      FROM f JOIN v_skill k ON k.uri = f.uri
  facts:
    sql: |
      SELECT CASE k.kind WHEN 'command' THEN 'A slash command' WHEN 'skill' THEN 'A skill an agent loads when it applies' ELSE k.kind END AS is_a,
             NULLIF((SELECT json_group_array(json_object('text', j.value)) FROM json_each(k.needs) j), '[]') AS needs_items
      FROM v_skill k WHERE k.uri = :uri
  # The extension that declares it: one link.
  related:
    sql: |
      SELECT a.extension AS title, a.extension_target AS uri, e.description
      FROM about a LEFT JOIN v_extension e ON e.name = a.extension
view:
  stack:
  - id: about
    title: About
    viz: detail
    from: about
    lead: description
    columns:
    - { key: declared, label: Declared in, link: { kind: page, from: declared_target } }
    empty: This contribution isn't known to the project.
  - id: facts
    title: What it is
    viz: detail
    from: facts
    columns:
    - { key: is_a, label: It is }
    - { key: needs_items, label: Needs, format: items }
    empty: Skill not found.
see_also:
  - { from: related }
