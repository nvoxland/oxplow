title: Deployments
description: "Each deployment in the store (v_extension_deployment), of one extension or of all, newest first: the copy of a source a deploy made, what it was approved to reach, and which one runs."
hidden: true
params:
- name: extension
  type: search
  label: Extension
loaders:
  extensions_deployments:
    sql: |
      SELECT d.name, substr(d.hash, 1, 7) AS deployment, d.hash, d.deployed_at,
             CASE WHEN d.active THEN 'runs' ELSE '' END AS running,
             NOT d.active AS inactive,
             COALESCE((SELECT group_concat(p.value, ', ') FROM json_each(d.permissions) p), '') AS permissions,
             COALESCE(substr(d."commit", 1, 7) || CASE WHEN d.dirty THEN ' (uncommitted)' ELSE '' END, '') AS version,
             d.source
      FROM v_extension_deployment d
      WHERE :extension IS NULL OR d.name = :extension
      ORDER BY d.deployed_at DESC
view:
  from: extensions_deployments
  viz: table
  columns:
  - key: name
    label: Extension
  - key: deployment
    label: Deployment
    width: 90
  - key: deployed_at
    label: Deployed
    format: relative
    width: 120
  - key: running
    label: Runs
    width: 60
  - key: version
    label: Commit
    width: 150
  - key: permissions
    label: Permissions
  - key: source
    label: From
  empty: No deployments yet. A deploy copies an extension's source here.
  actions:
  - id: rollback
    label: Roll Back to This
    command: oxplow.extension.rollback
    input:
      name: '{{row.name}}'
      to: '{{row.hash}}'
    row: true
    when: inactive
