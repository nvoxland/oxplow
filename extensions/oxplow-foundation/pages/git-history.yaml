title: Git History
description: The stream's commits, newest first, as a lane graph; narrowed by text, author, branch, file or folder, a table of the matches with each one's lines changed.
icon: git-merge
label: '{{param.path|basename}} history'
category: Git
params:
- name: stream_id
- name: q
  role: filter
  label: Find
  type: search
- name: author
  type: choice
  role: filter
  label: Author
  default: ''
  options_from: '#authors'
- name: branch
  role: filter
  label: Branch
  type: branch
# What the page shows (its URI's `?`): a file's or folder's history is a
# tab of its own, never the open Git History narrowed.
- name: path
  label: File or folder
  default: ''
- name: head_sha
  label: Head commit
# The commit a link brings into view (marked, loaded even past the limit):
# set by the link, never typed, so not in the rail.
- name: reveal_sha
  role: view
  label: Commit to reveal
  default: ''
- name: limit
  role: filter
  label: Commits
  default: 500
answers:
- {"question":"Which commits touched this file, newest first?","about":"oxplow/file","params":{"path":"src/lib.rs"},"skill":"oxplow-codebase"}
- {"question":"What is the recent history of this file?","about":"oxplow/file","params":{"path":"src/lib.rs"},"skill":"oxplow-codebase"}
- {"question":"Who has changed this file the most?","about":"oxplow/file","params":{"path":"src/lib.rs"},"skill":"oxplow-codebase"}
loaders:
  # The graph's rows: the newest `limit` reachable from the head, unfiltered
  # (lanes need every commit between two others), newest first so a child
  # comes before its parents; down to the revealed commit when it is older.
  graph:
    sql: |
      WITH RECURSIVE reach(sha) AS (
        SELECT coalesce(:head_sha, (SELECT head_sha FROM v_stream WHERE id = :stream_id))
        UNION
        SELECT p.value FROM reach
          JOIN v_commit c ON c.sha = reach.sha, json_each(c.parents) p
      ),
      ordered AS (
        SELECT c.sha, c.subject, c.author, c.committed_at, c.parents,
               (SELECT CASE WHEN count(*) > 0 THEN json_group_array(json(ref)) END FROM (
                  SELECT json_object('text', b.name, 'tone',
                           CASE WHEN b.name = (SELECT branch FROM v_stream WHERE id = :stream_id) THEN 'success' ELSE 'accent' END) AS ref
                  FROM v_branch b WHERE b.kind = 'local' AND b.head_sha = c.sha
                  UNION ALL SELECT json_object('text', t.name, 'tone', 'warning') FROM v_tag t WHERE t.sha = c.sha)) AS refs,
               c.sha = :reveal_sha AS revealed,
               row_number() OVER (ORDER BY c.committed_at DESC, c.sha) AS n
        FROM v_commit c JOIN reach USING (sha)
      )
      SELECT sha, subject, author, committed_at, parents, refs, revealed FROM ordered
      WHERE n <= max(CAST(:limit AS INTEGER), coalesce((SELECT n FROM ordered WHERE revealed), 0))
      ORDER BY n
  # The matches: every reachable commit matching `q`, `author`, `branch`
  # and `path` (a file, or any file under a folder), filtered before the
  # limit, so an older commit is found too. Each one's change: the lines
  # the path's files gained and lost (the whole commit's with no path);
  # created, deleted or renamed said in a word, several files by how many,
  # a modification by its counts alone.
  history:
    sql: |
      WITH RECURSIVE reach(sha) AS (
        SELECT coalesce(:head_sha, (SELECT head_sha FROM v_stream WHERE id = :stream_id))
        UNION
        SELECT p.value FROM reach
          JOIN v_commit c ON c.sha = reach.sha, json_each(c.parents) p
      ),
      on_branch(sha) AS (
        SELECT b.head_sha FROM v_branch b WHERE b.name = :branch AND b.kind = 'local'
        UNION
        SELECT p.value FROM on_branch
          JOIN v_commit c ON c.sha = on_branch.sha, json_each(c.parents) p
      ),
      matches AS (
        SELECT c.sha, c.subject, c.author, c.committed_at FROM v_commit c JOIN reach USING (sha)
        WHERE (:branch IS NULL OR :branch = '' OR c.sha IN (SELECT sha FROM on_branch))
          AND (:author = '' OR c.author = :author)
          AND (:q IS NULL OR :q = '' OR c.sha LIKE :q || '%' OR instr(lower(c.subject), lower(:q)) > 0
               OR instr(lower(c.author), lower(:q)) > 0 OR instr(lower(c.email), lower(:q)) > 0)
          AND (:path = '' OR EXISTS (SELECT 1 FROM v_commit_file f WHERE f.sha = c.sha
               AND (f.path = :path OR substr(f.path, 1, length(:path) + 1) = :path || '/')))
        ORDER BY (c.sha = :reveal_sha) DESC, c.committed_at DESC, c.sha
        LIMIT :limit
      ),
      lines AS (
        SELECT m.sha, count(f.path) AS files, max(f.status) AS status,
               coalesce(sum(f.additions), 0) AS additions, coalesce(sum(f.deletions), 0) AS deletions
        FROM matches m LEFT JOIN v_commit_file f ON f.sha = m.sha
          AND (:path = '' OR f.path = :path OR substr(f.path, 1, length(:path) + 1) = :path || '/')
        GROUP BY m.sha
      ),
      changed AS (
        SELECT m.*, l.files, l.additions, l.deletions,
               CASE WHEN l.files > 1 THEN l.files || ' files'
                    WHEN l.files = 0 OR l.status = 'modified' THEN NULL
                    WHEN l.status = 'added' THEN 'created'
                    ELSE l.status END AS change,
               (SELECT CASE WHEN count(*) > 0 THEN json_group_array(json(ref)) END FROM (
                  SELECT json_object('text', b.name, 'tone',
                           CASE WHEN b.name = (SELECT branch FROM v_stream WHERE id = :stream_id) THEN 'success' ELSE 'accent' END) AS ref
                  FROM v_branch b WHERE b.kind = 'local' AND b.head_sha = m.sha
                  UNION ALL SELECT json_object('text', t.name, 'tone', 'warning') FROM v_tag t WHERE t.sha = m.sha)) AS refs
        FROM matches m JOIN lines l USING (sha)
      )
      SELECT sha, subject, author, committed_at, refs, change, additions, deletions,
             CASE WHEN files = 0 THEN NULL
                  WHEN change IS NULL THEN json_array(
                    json_object('text', '+' || additions, 'tone', 'success'),
                    json_object('text', '−' || deletions, 'tone', 'danger'))
                  ELSE json_array(json_object('text', change, 'tone', 'muted'),
                    json_object('text', '+' || additions, 'tone', 'success'),
                    json_object('text', '−' || deletions, 'tone', 'danger'))
             END AS lines
      FROM changed
      ORDER BY (sha = :reveal_sha) DESC, committed_at DESC, sha
  # The Author choices: everyone who committed to the history.
  authors:
    sql: |
      WITH RECURSIVE reach(sha) AS (
        SELECT coalesce(:head_sha, (SELECT head_sha FROM v_stream WHERE id = :stream_id))
        UNION
        SELECT p.value FROM reach
          JOIN v_commit c ON c.sha = reach.sha, json_each(c.parents) p
      )
      SELECT value, label FROM (
        SELECT '' AS value, 'Anyone' AS label, 0 AS rank
        UNION
        SELECT DISTINCT c.author, c.author, 1 FROM v_commit c JOIN reach USING (sha) WHERE c.author <> ''
      )
      ORDER BY rank, lower(label)
# The graph while nothing filters; the matches while something does: both
# oxplow's own tables. The nav bar's "Git History" says what either is.
view:
  stack:
  - id: graph
    title: Commits
    hide_title: true
    when: { empty: [q, author, branch, path] }
    from: graph
    viz: table
    single_line: true
    reveal: revealed
    columns:
    - { key: sha, format: lanes, parents: parents }
    - key: subject
      label: Commit
      link:
        kind: commit
        from: sha
      badges: refs
    - key: author
      label: Author
      width: 160
    - key: committed_at
      label: When
      format: relative
      width: 120
    empty: This branch has no history yet.
  - id: history
    title: Commits
    hide_title: true
    when: { not_empty: [q, author, branch, path] }
    from: history
    viz: table
    single_line: true
    columns:
    - key: subject
      label: Commit
      link:
        kind: commit
        from: sha
      highlight: q
      badges: refs
    - key: lines
      label: Change
      format: marks
      width: 140
    - key: author
      label: Author
      width: 160
    - key: committed_at
      label: When
      format: relative
      width: 120
    empty: No commits match these filters.
