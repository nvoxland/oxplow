title: Branches and tags
description: What a file can be compared with - a branch, a remote branch or a tag.
hidden: true
params:
- name: filesystem
  default: oxplow:local
- name: rev
  default: ''
loaders:
  files_refs:
    sql: |
      SELECT 'none' AS value, 'No comparison' AS label, NULL AS "group"
      UNION ALL
      SELECT name, name, 'Branches' FROM v_branch WHERE :filesystem = 'oxplow:local' AND :rev = '' AND kind = 'local'
      UNION ALL
      SELECT remote || '/' || name, remote || '/' || name, 'Remote branches' FROM v_branch WHERE :filesystem = 'oxplow:local' AND :rev = '' AND kind = 'remote'
      UNION ALL
      SELECT name, name, 'Tags' FROM v_tag WHERE :filesystem = 'oxplow:local' AND :rev = ''
view:
  from: files_refs
  viz: table
