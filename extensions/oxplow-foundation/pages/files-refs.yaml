title: Branches and tags
description: What a file can be compared with - a branch, a remote branch or a tag.
hidden: true
loaders:
  files_refs:
    sql: |
      SELECT 'none' AS value, 'No comparison' AS label, NULL AS "group"
      UNION ALL
      SELECT name, name, 'Branches' FROM v_branch WHERE kind = 'local'
      UNION ALL
      SELECT remote || '/' || name, remote || '/' || name, 'Remote branches' FROM v_branch WHERE kind = 'remote'
      UNION ALL
      SELECT name, name, 'Tags' FROM v_tag
view:
  from: files_refs
  viz: table
