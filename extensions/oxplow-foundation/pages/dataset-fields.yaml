title: Fields of a dataset
description: The fields of one dataset, for the Sort by and Filter field choices of its data page.
hidden: true
params:
- name: uri
loaders:
  dataset_fields:
    sql: |
      SELECT '' AS value, 'None' AS label, -1 AS position
      UNION ALL
      SELECT f.name, f.name, f.position
      FROM v_dataset d JOIN v_field f ON f.view = d.view
      WHERE (d.owner = 'core' AND d.name = uri_param(:uri, 'dataset'))
         OR d.owner || '/' || d.name = uri_param(:uri, 'dataset')
      ORDER BY 3
view:
  from: dataset_fields
  viz: table
