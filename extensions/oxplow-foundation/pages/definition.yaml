title: Definition
description: What a page is made of, part by part — where it comes from (its file opens in the file view), what it is for and how it is used, its params with the values this run used, the loaders that read its data, the nodes that show them (embedded pages and mounted slots included) and its actions. Every page's ☰ menu opens it as Show Definition.
label: 'Definition: {{row.title}}'
icon: file-text
hidden: true
params:
- name: of
  label: Page (`<extension>/<page>`)
- name: params
  label: Its params (JSON)
- name: spec
  label: Inline page YAML
- name: stream_id
answers:
- {"question":"What is this page made of, and where does each part come from?","params":{"of":"oxplow-foundation/commit"}}
data:
  # First: the tab's label reads its row.
  scope:
    sql: |
      SELECT uri_param(uri, 'id') AS stream,
             coalesce((SELECT title FROM v_page WHERE id = :of), 'inline view') AS title
      FROM v_stream WHERE id = :stream_id
  page:
    command: oxplow.page.definition
    args: { page: { param: of }, spec: { param: spec }, params: { param: params }, stream_id: { from: scope.stream } }
    reads: [page, extension_deployment]
  # Where it comes from: an inline view has no file.
  about:
    sql: |
      SELECT title, page AS id, extension,
             CASE WHEN :spec IS NULL AND file <> '' THEN file END AS file,
             CASE WHEN bundled THEN 'ships with oxplow' ELSE 'yours' END AS origin,
             CASE WHEN deployment IS NULL THEN 'loaded from its source'
                  ELSE 'deployment ' || substr(deployment, 1, 12) END AS runs
      FROM page
  description:
    sql: SELECT description AS text FROM page WHERE description <> ''
  # How it is used, a line each: what it draws, how it is opened, its
  # tab, when it updates, comments, how an agent reads it, and the
  # questions an agent finds it by.
  usage:
    sql: |
      WITH p AS (
        SELECT *, json_array_length(page."for") AS draws,
               (SELECT group_concat('`' || value || '`', ', ') FROM json_each(page."for")) AS kinds
        FROM page
      ),
      lines(n, line) AS (
        SELECT 1, CASE WHEN draws = 0 THEN NULL
                       WHEN "default" THEN 'It draws ' || kinds || ' and is the page that opens one.'
                       ELSE 'It draws ' || kinds || ', but another page is the one that opens.' END FROM p
        UNION ALL
        SELECT 2, CASE WHEN category IS NOT NULL AND NOT hidden THEN 'It is in the launcher, under ' || category || '.'
                       WHEN draws > 0 AND "default" THEN 'It isn''t in the launcher: opening a ' || kinds || ' opens it.'
                       ELSE 'It isn''t in the launcher: links from other pages open it.' END FROM p
        UNION ALL
        SELECT 3, CASE WHEN label IS NULL THEN 'Its tab is named by its title' ELSE 'Its tab is named `' || label || '`' END
                  || CASE WHEN pinned THEN ' and stays pinned.' ELSE '.' END FROM p
        UNION ALL
        SELECT 4, CASE WHEN refresh THEN 'It runs again when its data changes, and has a Refresh button.'
                       ELSE 'It runs again when its data changes.' END FROM p
        UNION ALL
        SELECT 5, CASE WHEN comments THEN 'People can comment on it.' ELSE 'People can''t comment on it.' END FROM p
        UNION ALL
        SELECT 6, CASE WHEN tool IS NOT NULL THEN 'Agents get it as the tool `' || tool || '`, and read it with `oxplow_run_page`.'
                       ELSE 'An agent reads it with `oxplow_run_page`; it isn''t offered as a tool of its own.' END FROM p
        UNION ALL
        SELECT 7 + j.key, 'Agents find it for "' || (j.value ->> '$.question') || '"' FROM page, json_each(page.answers) j
      )
      SELECT line FROM lines WHERE line IS NOT NULL ORDER BY n
  usage_text:
    sql: SELECT group_concat('- ' || line, char(10)) AS text FROM usage
  params:
    sql: |
      SELECT j.value ->> '$.name' AS name, j.value ->> '$.label' AS label,
             coalesce(j.value ->> '$.role', 'resource') AS role, j.value ->> '$.type' AS type,
             j.value ->> '$.default' AS "default", j.value ->> '$.value' AS value
      FROM page, json_each(page.params) j
      ORDER BY j.key
  loaders:
    sql: |
      SELECT j.value ->> '$.name' AS name, j.value ->> '$.kind' AS kind,
             (SELECT group_concat(value, ', ') FROM json_each(j.value -> '$.uses')) AS uses,
             (SELECT group_concat(value, ', ') FROM json_each(j.value -> '$.reads')) AS reads,
             j.value ->> '$.rows' AS rows, j.value ->> '$.error' AS error,
             j.value ->> '$.source' AS source
      FROM page, json_each(page.loaders) j
      ORDER BY j.key
  queries:
    sql: |
      SELECT group_concat(
               '**`' || name || '`** — ' || kind
               || CASE WHEN uses IS NOT NULL THEN ' · uses `' || replace(uses, ', ', '`, `') || '`' ELSE '' END
               || CASE WHEN reads IS NOT NULL THEN ' · runs again when `' || replace(reads, ', ', '`, `') || '` change' ELSE '' END
               || ' · ' || CASE WHEN error IS NOT NULL THEN 'failed: ' || error
                                WHEN rows IS NULL THEN 'not run'
                                WHEN rows = 1 THEN '1 row' ELSE rows || ' rows' END
               || CASE WHEN source IS NULL THEN ''
                       WHEN kind = 'sql' THEN char(10) || char(10) || '```sql' || char(10) || source || char(10) || '```'
                       ELSE ': `' || source || '`' END,
               char(10) || char(10)) AS text
      FROM loaders
  nodes:
    sql: |
      SELECT j.key AS n, j.value ->> '$.id' AS id, j.value ->> '$.parent' AS parent,
             j.value ->> '$.depth' AS depth,
             j.value ->> '$.kind' AS kind, j.value ->> '$.viz' AS viz,
             j.value ->> '$.title' AS title, j.value ->> '$.loader' AS loader,
             j.value ->> '$.page' AS page, j.value ->> '$.detail' AS detail,
             (SELECT group_concat(value, ', ') FROM json_each(j.value -> '$.columns')) AS columns,
             -- A setting as words: `empty "None yet."`, a block's set
             -- fields (`terminal: of uri, thread thread`), never JSON.
             (SELECT group_concat(
                       CASE WHEN st.key = 'empty' THEN 'when empty: “' || st.value || '”'
                            WHEN st.type = 'object' THEN
                              st.key || ': ' || (SELECT group_concat(f.key || ' `' || f.value || '`', ', ')
                                                 FROM json_each(st.value) f WHERE f.type <> 'null')
                            ELSE st.key || ' `' || st.value || '`' END, ' · ')
              FROM json_each(j.value -> '$.settings') st) AS settings
      FROM page, json_each(page.nodes) j
      ORDER BY j.key
  # The view as an outline, a node a line, nested as the view nests: what
  # it is, what it shows, its title, columns and settings (embedded
  # pages' nodes say which page they are from).
  view:
    sql: |
      SELECT group_concat(
               substr('                                        ', 1, 2 * depth) || '- **' || id || '** — '
               || CASE kind
                    WHEN 'viz' THEN coalesce('the rows from `' || loader || '` (Data, above), shown as ', 'shown as ') || '`' || viz || '`'
                    WHEN 'stack' THEN 'its sections, one after another'
                    WHEN 'grid' THEN 'its tiles, side by side'
                    WHEN 'switch' THEN 'one of its sections at a time, picked ' || replace(detail, 'on ', 'by ')
                    WHEN 'embed' THEN 'the page ' || detail || ', inline'
                    WHEN 'slot' THEN 'where other extensions add their pages (' || detail || ')'
                    WHEN 'markdown' THEN 'text'
                    WHEN 'component' THEN 'the custom component ' || detail
                    ELSE kind END
               || CASE WHEN title IS NOT NULL AND title <> '' THEN ', under the heading “' || title || '”' ELSE '' END
               || CASE WHEN page <> (SELECT page FROM page) THEN ', from `' || page || '`' ELSE '' END
               || coalesce(char(10) || substr('                                        ', 1, 2 * depth + 2) || 'columns: ' || columns, '')
               || coalesce(char(10) || substr('                                        ', 1, 2 * depth + 2) || settings, ''),
               char(10)) AS text
      FROM (SELECT * FROM nodes ORDER BY n)
  actions:
    sql: |
      SELECT j.value ->> '$.label' AS label, j.value ->> '$.command' AS command,
             j.value ->> '$.on' AS "on",
             CASE WHEN j.value ->> '$.on' = 'page' THEN
                    CASE WHEN j.value ->> '$.prominent' THEN 'a button in the nav bar' ELSE 'the ☰ menu' END
                  WHEN j.value ->> '$.row' THEN 'each row of `' || (j.value ->> '$.on') || '`'
                  ELSE 'the `' || (j.value ->> '$.on') || '` section' END AS offered,
             j.value ->> '$.when' AS "when",
             CASE WHEN j.value ->> '$.form' THEN 'yes' ELSE 'no' END AS form
      FROM page, json_each(page.actions) j
      ORDER BY j.key
  # An inline view has no file to open: its YAML, as written.
  yaml:
    sql: |
      SELECT '### YAML' || char(10) || char(10) || '```yaml' || char(10) || yaml || char(10) || '```' AS text
      FROM page WHERE :spec IS NOT NULL
view:
  stack:
  - id: about
    title: ''
    viz: detail
    from: about
    columns:
    - { key: title, label: Title }
    - { key: id, label: Id }
    - { key: extension, label: Extension }
    - { key: file, label: File, link: { kind: file } }
    - { key: origin, label: Origin }
    - { key: runs, label: Runs }
  - id: description
    title: Description
    viz: markdown
    from: description
    empty: ''
    markdown: { text: text }
  - id: usage
    title: How it's used
    viz: markdown
    from: usage_text
    markdown: { text: text }
  - id: params
    title: Params
    viz: table
    from: params
    empty: It takes no params.
    columns:
    - { key: name, label: Name }
    - { key: label, label: Label }
    - { key: role, label: Role }
    - { key: type, label: Type }
    - { key: default, label: Default }
    - { key: value, label: This run }
  - id: data
    title: Data
    viz: markdown
    from: queries
    markdown: { text: text }
  - id: nodes
    title: View
    viz: markdown
    from: view
    markdown: { text: text }
  - id: actions
    title: Actions
    viz: table
    from: actions
    empty: It offers no actions.
    columns:
    - { key: label, label: Action }
    - { key: command, label: Command }
    - { key: offered, label: Offered on }
    - { key: when, label: Only when }
    - { key: form, label: Opens a form }
  # Only an inline view's: nothing at all for a page with a file.
  - id: yaml
    title: ''
    viz: markdown
    from: yaml
    empty: ''
    markdown: { text: text }
