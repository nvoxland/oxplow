title: Definition
description: What a page file is made of, part by part — a display mode of a page's YAML file, beside the File viewer's raw YAML.
label: 'Definition: {{param.path|basename}}'
icon: file-text
for: oxplow/file
accepts:
  path: '^[\w./-]+\.yaml$'
  content: definition
content: { text: true, max_bytes: 262144 }
params:
- name: uri
- name: path
- name: params
  role: view
  label: Its params (JSON)
- name: stream_id
answers:
- {"question":"What is this page made of, and where does each part come from?","params":{"uri":"oxplow:oxplow/file?path=oxplow-foundation/pages/commit.yaml&filesystem=oxplow:extensions","path":"oxplow-foundation/pages/commit.yaml"}}
loaders:
  # The stream, as the command that describes the page names it.
  stream:
    sql: |
      SELECT uri_param(uri, 'id') AS stream FROM v_stream WHERE id = :stream_id
  # The page the file is, from the text the system read (no rows when the
  # file is no page: then this mode isn't offered).
  definition:
    command: oxplow.page.describe
    args: { uri: { from: content.uri }, text: { from: content.text }, params: { param: params }, stream_id: { from: stream.stream } }
    reads: [page, extension_deployment]
  # Where it comes from: its source is this same file, raw, in the File
  # viewer.
  about:
    sql: |
      SELECT title, page AS id, extension,
             c.path AS source,
             c.uri || '#oxplow.renderer=oxplow-foundation/file-viewer' AS source_target,
             CASE WHEN bundled THEN 'ships with oxplow' ELSE 'yours' END AS origin,
             CASE WHEN deployment IS NULL THEN 'loaded from its source'
                  ELSE 'deployment ' || substr(deployment, 1, 12) END AS runs
      FROM definition, content c
  description:
    sql: SELECT description AS text FROM definition WHERE description <> ''
  # How it is used, a line each: what it draws, how it is opened, its
  # tab, when it updates, comments, how an agent reads it, and the
  # questions an agent finds it by.
  usage:
    sql: |
      WITH p AS (
        SELECT *, json_array_length(definition."for") AS draws,
               (SELECT group_concat('`' || value || '`', ', ') FROM json_each(definition."for")) AS kinds
        FROM definition
      ),
      lines(n, line) AS (
        SELECT 1, CASE WHEN draws = 0 THEN NULL
                       WHEN "default" THEN 'It draws ' || kinds || ' and is the page that opens one.'
                       ELSE 'It draws ' || kinds || ', but another page is the one that opens.' END FROM p
        UNION ALL
        SELECT 2, CASE WHEN draws > 0 THEN 'It is a display mode of ' || kinds || ' (Open With).'
                       WHEN category IS NOT NULL AND NOT hidden THEN 'It is in the launcher, under ' || category || '.'
                       ELSE 'It isn''t in the launcher: links from other pages open it.' END FROM p
        UNION ALL
        SELECT 3, CASE WHEN label IS NULL THEN 'Its tab is named by its title' ELSE 'Its tab is named `' || label || '`' END
                  || CASE WHEN pinned THEN ' and stays pinned.' ELSE '.' END FROM p
        UNION ALL
        SELECT 4, CASE WHEN refresh THEN 'It runs again when its data changes, and has a Refresh button.'
                       ELSE 'It runs again when its data changes.' END FROM p
        UNION ALL
        SELECT 5, CASE WHEN comments THEN 'People can comment on it.' ELSE 'People can''t comment on it.' END FROM p
        UNION ALL
        SELECT 6, CASE WHEN tool IS NOT NULL THEN 'Agents get it as the tool `' || tool || '`, and read it with `oxplow_run_page`.'
                       ELSE 'An agent reads it with `oxplow_run_page`; it isn''t offered as a tool of its own.' END FROM p
        UNION ALL
        SELECT 7 + j.key, 'Agents find it for "' || (j.value ->> '$.question') || '"' FROM definition, json_each(definition.answers) j
      )
      SELECT line FROM lines WHERE line IS NOT NULL ORDER BY n
  usage_text:
    sql: SELECT group_concat('- ' || line, char(10)) AS text FROM usage
  params:
    sql: |
      SELECT j.value ->> '$.name' AS name, j.value ->> '$.label' AS label,
             coalesce(j.value ->> '$.role', 'resource') AS role, j.value ->> '$.type' AS type,
             j.value ->> '$.default' AS "default", j.value ->> '$.value' AS value
      FROM definition, json_each(definition.params) j
      ORDER BY j.key
  loaders:
    sql: |
      SELECT j.value ->> '$.name' AS name, j.value ->> '$.kind' AS kind,
             (SELECT group_concat(value, ', ') FROM json_each(j.value -> '$.uses')) AS uses,
             (SELECT group_concat(value, ', ') FROM json_each(j.value -> '$.reads')) AS reads,
             j.value ->> '$.rows' AS rows, j.value ->> '$.error' AS error,
             j.value ->> '$.source' AS source, j.value -> '$.columns' AS result_columns
      FROM definition, json_each(definition.loaders) j
      ORDER BY j.key
  queries:
    sql: |
      SELECT group_concat(
               '**`' || name || '`** — ' || kind
               || CASE WHEN uses IS NOT NULL THEN ' · uses `' || replace(uses, ', ', '`, `') || '`' ELSE '' END
               || CASE WHEN reads IS NOT NULL THEN ' · runs again when `' || replace(reads, ', ', '`, `') || '` change' ELSE '' END
               || ' · ' || CASE WHEN error IS NOT NULL THEN 'failed: ' || error
                                WHEN rows IS NULL THEN 'not run'
                                WHEN rows = 1 THEN '1 row' ELSE rows || ' rows' END
               || CASE WHEN source IS NULL THEN ''
                       WHEN kind = 'sql' THEN char(10) || char(10) || '```sql' || char(10) || source || char(10) || '```'
                       ELSE ': `' || source || '`' END,
               char(10) || char(10)) AS text
      FROM loaders
  nodes:
    sql: |
      SELECT j.key AS n, j.value ->> '$.id' AS id, j.value ->> '$.parent' AS parent,
             j.value ->> '$.depth' AS depth,
             j.value ->> '$.kind' AS kind, j.value ->> '$.viz' AS viz,
             j.value ->> '$.title' AS title, j.value ->> '$.loader' AS loader,
             j.value ->> '$.page' AS page, j.value ->> '$.detail' AS detail,
             (SELECT group_concat(value, ', ') FROM json_each(j.value -> '$.columns')) AS columns,
             -- Its settings as bullets, never JSON: a role block's set
             -- fields each its own (`of: column uri` when it names a column
             -- of the rows it shows, else the value), `when empty: "…"`.
             (SELECT group_concat('- ' || line, char(10)) FROM (
                SELECT CASE WHEN st.key = 'empty' THEN 'when empty: “' || st.value || '”'
                            ELSE st.key || ': `' || st.value || '`' END AS line
                FROM json_each(j.value -> '$.settings') st WHERE st.type <> 'object'
                UNION ALL
                SELECT f.key || ': '
                       || CASE WHEN f.value IN (SELECT c.value FROM loaders l, json_each(l.result_columns) c
                                                WHERE l.name = j.value ->> '$.loader')
                               THEN 'column `' || f.value || '`' ELSE '`' || f.value || '`' END
                FROM json_each(j.value -> '$.settings') st, json_each(st.value) f
                WHERE st.type = 'object' AND f.type <> 'null')) AS settings
      FROM definition, json_each(definition.nodes) j
      ORDER BY j.key
  # The view as an outline, a node a line, nested as the view nests: a
  # short name for what it is (its heading, when it has one, first), then
  # its columns and settings (an embedded page's nodes say whose they are).
  view:
    sql: |
      SELECT group_concat(
               substr('                                        ', 1, 2 * depth) || '- '
               || CASE WHEN title IS NOT NULL AND title <> '' THEN '**' || title || '**: ' ELSE '' END
               || CASE kind
                    WHEN 'viz' THEN upper(substr(viz, 1, 1)) || substr(viz, 2) || coalesce(' of `' || loader || '`', '')
                    WHEN 'stack' THEN 'Stack of sections'
                    WHEN 'grid' THEN 'Grid of tiles'
                    WHEN 'switch' THEN 'Switch ' || detail
                    WHEN 'embed' THEN 'Page ' || detail
                    WHEN 'slot' THEN 'Slot ' || detail
                    WHEN 'markdown' THEN 'Text'
                    WHEN 'component' THEN 'Component ' || detail
                    ELSE kind END
               || CASE WHEN page <> (SELECT page FROM definition) THEN ' (from `' || page || '`)' ELSE '' END
               || coalesce(char(10) || substr('                                        ', 1, 2 * depth + 2) || '- columns: ' || columns, '')
               || coalesce(char(10) || substr('                                        ', 1, 2 * depth + 2)
                           || replace(settings, char(10), char(10) || substr('                                        ', 1, 2 * depth + 2)), ''),
               char(10)) AS text
      FROM (SELECT * FROM nodes ORDER BY n)
  actions:
    sql: |
      SELECT j.value ->> '$.label' AS label,
             coalesce(j.value ->> '$.command', 'opens ' || (j.value ->> '$.open')) AS command,
             j.value ->> '$.on' AS "on",
             CASE WHEN j.value ->> '$.on' = 'page' THEN
                    CASE WHEN j.value ->> '$.prominent' THEN 'a button in the nav bar' ELSE 'the ☰ menu' END
                  WHEN j.value ->> '$.row' THEN 'each row of `' || (j.value ->> '$.on') || '`'
                  ELSE 'the `' || (j.value ->> '$.on') || '` section' END AS offered,
             j.value ->> '$.when' AS "when",
             CASE WHEN j.value ->> '$.form' THEN 'yes' ELSE 'no' END AS form
      FROM definition, json_each(definition.actions) j
      ORDER BY j.key
view:
  stack:
  - id: about
    title: About
    viz: detail
    from: about
    columns:
    - { key: title, label: Title }
    - { key: id, label: Id }
    - { key: extension, label: Extension }
    - { key: source, label: Source, link: { kind: page, from: source_target } }
    - { key: origin, label: Origin }
    - { key: runs, label: Runs }
  - id: description
    title: Description
    viz: markdown
    from: description
    empty: ''
    markdown: { text: text }
  - id: usage
    title: How it's used
    viz: markdown
    from: usage_text
    markdown: { text: text }
  - id: params
    title: Params
    viz: table
    from: params
    empty: It takes no params.
    columns:
    - { key: name, label: Name }
    - { key: label, label: Label }
    - { key: role, label: Role }
    - { key: type, label: Type }
    - { key: default, label: Default }
    - { key: value, label: This run }
  - id: loaders
    title: Data Loaders
    viz: markdown
    from: queries
    markdown: { text: text }
  - id: nodes
    title: View
    viz: markdown
    from: view
    markdown: { text: text }
  - id: actions
    title: Actions
    viz: table
    from: actions
    empty: It offers no actions.
    columns:
    - { key: label, label: Action }
    - { key: command, label: Command }
    - { key: offered, label: Offered on }
    - { key: when, label: Only when }
    - { key: form, label: Opens a form }
