title: Text
description: "A file read-only, at a past revision or on another filesystem, or a binary file of the working tree, and the page that opens one; a binary or very large one says what it is instead. A working-tree text file is the Editor's alone, an image or a PDF the Media page's."
label: '{{param.path|basename}}{{row.suffix}}'
for: oxplow/file
# `accepts` rules all hold together; "a revision, a filesystem or a binary
# file, and not what Media shows" is a loader.
accepts:
  content: elsewhere
default: true
comments: true
params:
- name: uri
- name: path
- name: filesystem
- name: rev
- name: lines
  role: view
loaders:
  file_viewer:
    sql: |
      SELECT :path AS path, :filesystem AS filesystem, :rev AS rev, :lines AS lines,
             CASE
               WHEN COALESCE(:filesystem, 'oxplow:local') = 'oxplow:local' THEN
                 CASE WHEN COALESCE(:rev, 'working') = 'working' THEN '' ELSE ' (' || :rev || ')' END
               ELSE ' (' || :filesystem ||
                 CASE
                   WHEN :rev IS NULL THEN ''
                   WHEN length(:rev) > 12 AND :rev NOT GLOB '*[^0-9a-fA-F]*' THEN ' ' || substr(:rev, 1, 7)
                   ELSE ' ' || :rev
                 END || ')'
             END AS suffix,
             -- The working-tree file of a past revision of a local file.
             CASE
               WHEN COALESCE(:filesystem, 'oxplow:local') = 'oxplow:local'
                    AND :rev IS NOT NULL AND :rev NOT IN ('', 'working')
               THEN uri('oxplow/file', 'path', :path)
             END AS current_uri
  # Its history (the index has one for a local file only) and its folder, on
  # the file's own filesystem and revision.
  related:
    sql: |
      SELECT 'File history' AS title, uri('oxplow/page', 'page', 'file-history', 'path', :path) AS uri, 1 AS ord
      WHERE COALESCE(:filesystem, 'oxplow:local') = 'oxplow:local'
      UNION ALL
      SELECT rtrim(rtrim(:path, replace(:path, '/', '')), '/'),
             uri('oxplow/dir', 'filesystem', NULLIF(:filesystem, 'oxplow:local'),
                 'path', rtrim(rtrim(:path, replace(:path, '/', '')), '/'),
                 'rev', NULLIF(NULLIF(:rev, ''), 'working'))
             , 2
      WHERE :path LIKE '%/%'
      ORDER BY ord
  # Offered where there is nothing to edit: a past revision, another
  # filesystem, or a binary file — but not an image or a PDF, which the
  # Media page draws as itself (its `is_media` lists the same names: raw
  # bytes are no mode of one).
  elsewhere:
    sql: |
      SELECT 1 AS n
      WHERE (:rev IS NOT NULL OR :filesystem IS NOT NULL
             OR EXISTS (SELECT 1 FROM content WHERE is_text = 0))
        AND NOT (lower(:path) GLOB '*.png' OR lower(:path) GLOB '*.jpg' OR lower(:path) GLOB '*.jpeg'
                 OR lower(:path) GLOB '*.gif' OR lower(:path) GLOB '*.webp' OR lower(:path) GLOB '*.svg'
                 OR lower(:path) GLOB '*.bmp' OR lower(:path) GLOB '*.ico' OR lower(:path) GLOB '*.avif'
                 OR lower(:path) GLOB '*.pdf')
actions:
- { id: open-current, label: Open current version, open: current_uri, when: current_uri }
view:
  from: file_viewer
  viz: code
  code:
    path: path
    filesystem: filesystem
    revision: rev
    lines: lines
see_also:
  - { from: related }
