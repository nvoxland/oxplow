title: Worktrees to adopt
description: The repository's worktrees that are not a stream yet.
hidden: true
needs:
- vcs
answers:
- {"question":"Which worktrees of this repository could a new stream adopt?","params":{},"skill":"oxplow-extension"}
data:
  new_stream_worktrees:
    sql: |
      SELECT w.path AS value,
             CASE WHEN w.branch IS NULL OR w.branch = '' THEN '[detached] ' ELSE '[' || w.branch || '] ' END || w.path AS label
      FROM v_vcs_workspace w
      WHERE w.is_main = 0 AND w.stream_id IS NULL
      ORDER BY w.path
view:
  from: new_stream_worktrees
  viz: table
