title: Snapshots
description: The newest snapshots of a stream's working tree (every stream's when none is named), each with its parent, what triggered it and whether it ran over its time budget.
hidden: true
params:
- name: stream
  label: Stream (`str1`)
  default: ''
- name: limit
  role: filter
  label: Snapshots
  default: 20
answers:
- {"question":"What snapshots has this stream taken lately?","params":{},"skill":"oxplow-codebase"}
loaders:
  snapshots:
    sql: |
      SELECT o.snapshot_id, o.at, o.parent_snapshot_id, o.trigger, o.over_budget, o.elapsed_ms, o.file_count
      FROM v_snapshot_op o
      WHERE :stream = '' OR o.stream_id = (SELECT id FROM v_stream WHERE uri = uri('oxplow/stream', 'id', :stream))
      ORDER BY o.seq DESC
      LIMIT :limit
view:
  from: snapshots
  viz: table
  columns:
  - key: snapshot_id
    label: Snapshot
  - key: at
    label: Taken
  - key: parent_snapshot_id
    label: Parent
  - key: trigger
    label: Trigger
  - key: over_budget
    label: Over budget
  - key: elapsed_ms
    label: ms
  - key: file_count
    label: Files
  empty: No snapshots yet.
