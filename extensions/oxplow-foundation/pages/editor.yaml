title: Editor
description: 'A file of the working tree, edited: unsaved edits shared with every tab showing it, Save writing it. The renderer of a `file` with no `rev` and no `filesystem`.'
label: '{{param.path|basename}}'
for: oxplow/file
accepts:
  rev: absent
  filesystem: absent
default: true
comments: true
params:
- name: uri
- name: path
- name: filesystem
- name: lines
  role: filter
loaders:
  editor:
    sql: |
      SELECT :path AS path, :filesystem AS filesystem, :lines AS lines
view:
  from: editor
  viz: editor
  editor:
    path: path
    filesystem: filesystem
    lines: lines
