title: Editor
description: 'A file of the working tree, edited: unsaved edits shared with every tab showing it, Save writing it; `#lines=12` lands on a line. The renderer of `file` with no `rev`.'
label: '{{param.path|basename}}'
for: oxplow/file
accepts:
  rev: absent
default: true
comments: true
params:
- name: uri
- name: path
- name: lines
  role: filter
loaders:
  editor:
    sql: |
      SELECT :path AS path, :lines AS lines
view:
  from: editor
  viz: editor
  editor:
    path: path
    lines: lines
