title: Editor
description: "A text file of the working tree, edited: unsaved edits shared with every tab showing it. The renderer of a `file` with no `rev` and no `filesystem`; a binary file is viewed, not edited."
label: '{{param.path|basename}}'
for: oxplow/file
accepts:
  rev: absent
  filesystem: absent
  content: editable
default: true
comments: true
params:
- name: uri
- name: path
- name: filesystem
- name: lines
  role: view
loaders:
  editor:
    sql: |
      SELECT :path AS path, :filesystem AS filesystem, :lines AS lines
  # The file's folder: its path up to the last slash (none at the root).
  folder:
    sql: |
      SELECT rtrim(rtrim(:path, replace(:path, '/', '')), '/') AS title,
             uri('oxplow/dir', 'path', rtrim(rtrim(:path, replace(:path, '/', '')), '/')) AS uri
      WHERE :path LIKE '%/%'
  # Text, or not there yet: a binary file has nothing to edit.
  editable:
    sql: |
      SELECT 1 AS n WHERE NOT EXISTS (SELECT 1 FROM content WHERE is_text = 0)
view:
  from: editor
  viz: editor
  editor:
    path: path
    filesystem: filesystem
    lines: lines
see_also:
  - { page: oxplow-foundation/file-history, params: { path: { param: path } } }
  - { from: folder }
