title: "Contribution health"
description: "The extension providers and collectors that are failing or disabled; an extension that files repair tasks adds the open one."
params:
- name: namespace
  default: ""
- name: contribution
  default: ""
answers:
- {"question":"Which extension providers or collectors are failing or disabled, and why?","params":{},"skill":"oxplow-extension"}
loaders:
  unhealthy:
    sql: "SELECT namespace, contribution, kind, state, reason, last_error FROM v_contribution_health WHERE state <> 'ok'"
view:
  stack:
  - { id: unhealthy, title: Failing or disabled, viz: table, from: unhealthy }
  # Where an extension that files repair tasks shows the open one.
  - slot: repair
