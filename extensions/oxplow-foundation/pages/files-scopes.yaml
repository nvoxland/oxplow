title: File scopes
description: Which files the Files page lists - all of them, or only those changed in the working tree, since the default branch, or since the upstream.
hidden: true
params:
- name: stream_id
loaders:
  files_scopes:
    sql: |
      SELECT 'all' AS value, 'All files' AS label
      UNION ALL
      SELECT 'uncommitted', 'Uncommitted changes'
      WHERE EXISTS (SELECT 1 FROM v_stream s JOIN v_branch b ON b.kind = 'local' AND b.name = s.branch WHERE s.id = :stream_id)
      UNION ALL
      SELECT d.name, 'Changes since ' || d.name
      FROM v_branch d JOIN v_stream s ON s.id = :stream_id
      WHERE d.kind = 'local' AND d.is_default = 1 AND d.name <> s.branch
      UNION ALL
      SELECT b.upstream, 'Unpushed, since ' || b.upstream
      FROM v_branch b JOIN v_stream s ON s.id = :stream_id
      WHERE b.kind = 'local' AND b.name = s.branch AND b.upstream IS NOT NULL
view:
  from: files_scopes
  viz: table
