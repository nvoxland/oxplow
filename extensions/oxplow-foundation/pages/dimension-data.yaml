title: Dimension data
description: The values facts carry for one dimension, with how many facts have each, most common first.
label: '{{row.name}} data'
icon: list-tree
for: oxplow/dimension
default: true
params:
- name: uri
  label: Dimension
- name: measure
  type: choice
  role: filter
  label: Measure
  options_from: '#chosen'
- name: range
  type: date_range
  role: filter
  label: Range
  default: 30d
  presets: [1d, 7d, 30d, 90d, all]
answers:
- {"question":"Which values does this dimension take, and how often?","about":"oxplow/dimension","params":{"uri":"oxplow:oxplow/dimension?dimension=oxplow.language"},"skill":"oxplow-extension"}
loaders:
  about:
    sql: |
      SELECT d.key, d.label AS name, d.description, d.value_type
      FROM v_dimension d WHERE d.key = uri_param(:uri, 'dimension')
  # The Measure choice's list, and one measure's facts at a time (every
  # fact at once is too many to scan): the chosen one, else the first of
  # this list. The measures about what the dimension describes first (its subject
  # kind), then every other. Read from the declarations: scanning facts for
  # which carry it is too slow on a real project.
  chosen:
    sql: |
      SELECT m.key AS value, m.title AS label
      FROM v_measure m, v_dimension d
      WHERE d.key = uri_param(:uri, 'dimension')
      ORDER BY (d.subject_kind IS NOT NULL AND m.subject_kind = d.subject_kind) DESC, m.title
  measure:
    sql: |
      SELECT COALESCE(NULLIF(:measure, ''), (SELECT value FROM chosen LIMIT 1)) AS key,
             COALESCE((SELECT label FROM chosen WHERE value = :measure), (SELECT label FROM chosen LIMIT 1)) AS title
  seen:
    sql: |
      SELECT CAST(json_extract(f.dims_json, '$."' || (SELECT key FROM about) || '"') AS TEXT) AS value,
             count(*) AS facts, max(f.captured_at) AS latest
      FROM v_fact f
      WHERE f.measure_key = read_measure((SELECT key FROM measure))
        AND json_extract(f.dims_json, '$."' || (SELECT key FROM about) || '"') IS NOT NULL
        AND (:range_from IS NULL OR f.captured_at >= :range_from)
        AND (:range_to IS NULL OR f.captured_at <= :range_to)
      GROUP BY 1 ORDER BY 2 DESC, 1 LIMIT 500
view:
  stack:
  - id: about
    title: About
    viz: detail
    from: about
    lead: description
    columns:
    - { key: name, label: Dimension }
    - { key: value_type, label: Its values }
    empty: That dimension isn't known to the project.
  - id: seen
    title: Values
    viz: table
    from: seen
    columns:
    - { key: value, label: Value }
    - { key: facts, label: Facts, format: integer }
    - { key: latest, label: Latest, format: datetime }
    empty: No fact carries this dimension in this range.
