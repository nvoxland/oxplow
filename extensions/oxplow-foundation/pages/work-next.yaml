title: Next
description: What to pick up next on a thread. Ready means `todo` with no open blocker. First the items assigned to the thread, in its queue's order — when the first is an epic (an item with children), it and its ready descendants as one unit; otherwise every ready one that isn't an epic. With none assigned, the pool, any thread's to take — ready items assigned to nobody, by priority (`role` `pool`). Starting one assigns it to the thread.
tool: work_next
params:
- name: thread
  label: Thread (`thr3`)
answers:
- {"question":"What should I pick up next on this thread?","params":{"thread":"thr1"},"skill":"work-items"}
loaders:
  work_next:
    sql: |
      WITH items AS (
        SELECT * FROM v_work_item WHERE assignee = uri('oxplow/thread', 'id', :thread)),
      held AS (
        SELECT l.to_uri FROM v_work_item_link l JOIN v_work_item b ON b.uri = l.from_uri
        WHERE l.link_type = 'blocks' AND b.state NOT IN ('done', 'canceled')),
      epics AS (SELECT DISTINCT parent_uri AS uri FROM items WHERE parent_uri IS NOT NULL),
      ready AS (
        SELECT * FROM items WHERE state = 'todo' AND uri NOT IN (SELECT to_uri FROM held)),
      head AS (
        SELECT uri FROM ready ORDER BY rank IS NULL, rank, created_at LIMIT 1),
      below(uri) AS (
        SELECT i.uri FROM items i JOIN head h ON i.parent_uri = h.uri
        UNION SELECT i.uri FROM items i JOIN below b ON i.parent_uri = b.uri),
      mine AS (
        SELECT r.uri, r.title,
               CASE WHEN r.uri IN (SELECT uri FROM head) AND r.uri IN (SELECT uri FROM epics) THEN 'epic'
                    WHEN r.uri IN (SELECT uri FROM below) THEN 'child'
                    ELSE 'ready' END AS role,
               r.rank, r.created_at
        FROM ready r
        WHERE CASE WHEN (SELECT uri FROM head) IN (SELECT uri FROM epics)
                   THEN r.uri IN (SELECT uri FROM head) OR r.uri IN (SELECT uri FROM below)
                   ELSE r.uri NOT IN (SELECT uri FROM epics) END),
      -- Nothing assigned and ready: the pool, any thread's to take, the
      -- most pressing first.
      pool AS (
        SELECT p.uri, p.title, 'pool' AS role, p.rank, p.created_at,
               CASE json_extract(CASE WHEN json_valid(p.native) THEN p.native END, '$.priority')
                 WHEN 'urgent' THEN 0 WHEN 'high' THEN 1 WHEN 'low' THEN 3 ELSE 2 END AS urgency
        FROM v_work_item p
        WHERE NOT EXISTS (SELECT 1 FROM mine)
          AND p.assignee IS NULL AND p.state = 'todo'
          AND p.uri NOT IN (SELECT to_uri FROM held)
          AND p.uri NOT IN (SELECT parent_uri FROM v_work_item WHERE parent_uri IS NOT NULL))
      SELECT uri, title, role FROM (
        SELECT uri, title, role, 0 AS grp,
               row_number() OVER (ORDER BY role = 'child', rank IS NULL, rank, created_at) AS ord
        FROM mine
        UNION ALL
        SELECT uri, title, role, 1,
               row_number() OVER (ORDER BY urgency, rank IS NULL, rank, created_at)
        FROM pool)
      ORDER BY grp, ord
view:
  from: work_next
  viz: table
  columns:
  - key: title
    label: Item
    link:
      kind: page
      from: uri
  - key: role
    label: ''
  empty: Nothing is ready.
