title: "References"
description: "What points at a thing, and what a wiki page points at."
params:
- name: target
  default: ""
- name: source
  default: ""
answers:
- {"question":"What points at this file — pages, commits, work items?","about":"oxplow/file","params":{"target":"oxplow:oxplow/file?path=src/lib.rs"},"skill":"oxplow-wiki-capture"}
- {"question":"What does this wiki page point at?","params":{"source":"oxplow:oxplow/wiki?slug=auth-flow"},"skill":"oxplow-wiki-capture"}
loaders:
  pointing_at:
    sql: "SELECT source_uri, ref_type FROM v_page_ref WHERE target_uri = :target ORDER BY source_uri"
  points_to:
    sql: "SELECT target_uri, ref_type FROM v_page_ref WHERE source_uri = :source ORDER BY target_uri"
view:
  stack:
  - { id: pointing_at, title: Pointing at it, viz: table, from: pointing_at }
  - { id: points_to, title: It points to, viz: table, from: points_to }
