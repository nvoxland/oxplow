title: Implementation
description: One implementation of a capability — what it provides, whether it is the one in use, what it can do, and the extension that declares it.
label: '{{row.name}}'
icon: settings
for: oxplow/implementation
params:
- name: uri
  label: Implementation
answers:
- {"question":"What does this implementation provide, and is it in use?","about":"oxplow/implementation","params":{"uri":"oxplow:oxplow/implementation?implementation=oxplow/work_items.oxplow"},"skill":"oxplow-extension"}
loaders:
  about:
    sql: |
      WITH f AS (
        -- The file inside the extension, under the extension's folder.
        SELECT *, extension || '/' || file AS rel
        FROM v_contribution WHERE uri = :uri
      )
      SELECT i.title AS name, COALESCE(i.description, f.description) AS description,
             f.extension, 'oxplow:oxplow/extension?name=' || f.extension AS extension_target,
             f.rel || CASE WHEN f.line IS NOT NULL THEN ', line ' || f.line ELSE '' END AS declared,
             CASE WHEN f.rel IS NOT NULL THEN
                    uri('oxplow/file', 'filesystem', 'oxplow:extensions', 'path', f.rel)
                    || CASE WHEN f.line IS NOT NULL THEN '#lines=' || f.line || '&' ELSE '#' END
                    || 'oxplow.renderer=oxplow/file-viewer' END AS declared_target
      FROM f JOIN v_capability_provider i ON i.extension = f.extension AND i.capability || '.' || i.provider = f.local
  facts:
    sql: |
      SELECT i.capability_title AS capability,
             CASE WHEN i.active THEN 'Yes, this one is in use' ELSE 'No' END AS in_use,
             CASE WHEN i.available THEN 'Yes' ELSE 'No' END AS available,
             CASE i.chosen_by WHEN 'default' THEN 'It is the default'
                              WHEN 'declared' THEN 'A declaration chose it'
                              ELSE 'Nobody has chosen it' END AS chosen,
             NULLIF((SELECT json_group_array(json_object('text', j.key)) FROM json_each(i.features) j
                     WHERE j.value IS NOT NULL AND j.value <> 0 AND j.value <> 'false'), '[]') AS feature_items
      FROM v_contribution c JOIN v_capability_provider i
           ON i.extension = c.extension AND i.capability || '.' || i.provider = c.local
      WHERE c.kind = 'implementation' AND c.uri = :uri
  # The extension that declares it: one link.
  related:
    sql: |
      SELECT a.extension AS title, a.extension_target AS uri, e.description
      FROM about a LEFT JOIN v_extension e ON e.name = a.extension
view:
  stack:
  - id: about
    title: About
    viz: detail
    from: about
    lead: description
    columns:
    - { key: declared, label: Declared in, link: { kind: page, from: declared_target } }
    empty: This contribution isn't known to the project.
  - id: facts
    title: What it provides
    viz: detail
    from: facts
    columns:
    - { key: capability, label: Capability }
    - { key: in_use, label: In use }
    - { key: available, label: Available }
    - { key: chosen, label: Chosen }
    - { key: feature_items, label: It can, format: items }
    empty: Implementation not found.
see_also:
  - { from: related }
