title: Agent Session
description: An agent's session — its terminal, and what it asked for that waits on you.
label: '{{row.display_name}}'
for: oxplow/agent_session
default: true
pinned: true
params:
- name: uri
loaders:
  row:
    sql: |
      SELECT s.uri, 'ses' || s.id AS session, s.display_name, s.title, th.uri AS thread,
             coalesce(s.resume_session_id, '') AS conversation_id,
             coalesce(s.resume_session_id, '') || ':' || coalesce(s.fork_next, 0) AS conversation,
             coalesce(json_extract(p.features, '$.conversation_fork'), 0) = 1 AS can_fork
      FROM v_agent_session s
      JOIN v_thread th ON th.id = s.thread_id
      LEFT JOIN v_capability_provider p ON p.capability = 'agent_harness' AND p.provider = s.harness
      WHERE s.uri = :uri
    columns:
    - key: display_name
    - key: uri
    - key: thread
  agent_session_terminal:
    sql: |
      SELECT :uri AS uri, :thread AS thread, :conversation AS conversation
    params:
      thread:
        from: row.thread
      conversation:
        from: row.conversation
  # Its thread's work, and the efforts whose files it edited.
  related:
    sql: |
      SELECT 'Thread work' AS title, uri('oxplow/page', 'page', 'thread-work', 'thread', 'thr' || s.thread_id) AS uri,
             'The work items of its thread' AS description, 1 AS ord
      FROM v_agent_session s WHERE s.uri = :uri
      UNION ALL
      SELECT e.title, e.uri, 'An effort whose files this session edited', 2
      FROM v_effort e
      WHERE e.id IN (SELECT f.effort_id FROM v_effort_file f
                     WHERE f.agent_session_id = (SELECT s.id FROM v_agent_session s WHERE s.uri = :uri))
      ORDER BY ord, 1
  agent_session_conversations:
    sql: |
      SELECT c.native_id AS value,
             coalesce(nullif(c.title, ''), nullif(c.first_prompt, ''), c.native_id)
               || CASE WHEN c.native_id = s.resume_session_id THEN ' — this session''s'
                       WHEN o.session_uri IS NOT NULL THEN ' — open in another session'
                       ELSE '' END AS label
      FROM v_agent_session s
      JOIN v_thread th ON th.id = s.thread_id
      JOIN v_agent_conversation c ON c.stream_id = th.stream_id AND c.harness = s.harness
      LEFT JOIN v_agent_session_binding o
        ON o.native_id = c.native_id AND o.unbound_at IS NULL AND o.session_uri <> s.uri
      WHERE s.uri = :uri AND c.problem IS NULL AND c.native_id IS NOT NULL
      ORDER BY c.updated_at DESC
view:
  stack:
  - id: agent-session-terminal
    title: Terminal
    hide_title: true
    from: agent_session_terminal
    viz: terminal
    terminal:
      of: uri
      conversation: conversation
      thread: thread
actions:
- id: rename
  label: Rename…
  form: true
  command: oxplow.agent_session.rename
  input:
    session: '{{row.session}}'
    title: '{{row.display_name}}'
  fixed:
  - session
  fields:
  - name: title
    label: Name
    help: What this session's tab and lists call it.
  - name: native
    label: Also rename it in the agent
    help: Names the conversation in the agent's own list too (Codex). Only for an agent that can, and not undone with the rename.
- id: fork
  label: Fork into New Session…
  form: true
  command: oxplow.agent_session.fork_conversation
  input:
    session: '{{row.session}}'
    conversation: '{{row.conversation_id}}'
  fixed:
  - session
  fields:
  - name: conversation
    label: Conversation
    help: The saved conversation the new session starts from. The one this session is on is marked.
  choices:
    conversation: oxplow/agent-session#agent_session_conversations
  when: can_fork
see_also:
  - { from: related }
