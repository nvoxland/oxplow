title: Agent Session
description: An agent's session — its terminal, and what it asked for that waits on you.
label: '{{row.display_name}}'
for: oxplow/agent_session
default: true
pinned: true
params:
- name: uri
loaders:
  row:
    sql: |
      SELECT s.uri, 'ses' || s.id AS session, s.display_name, s.title, th.uri AS thread,
             coalesce(s.resume_session_id, '') AS conversation_id,
             coalesce(s.resume_session_id, '') || ':' || coalesce(s.fork_next, 0) AS conversation,
             coalesce(json_extract(p.features, '$.conversation_fork'), 0) = 1 AS can_fork
      FROM v_agent_session s
      JOIN v_thread th ON th.id = s.thread_id
      LEFT JOIN v_capability_provider p ON p.capability = 'agent_harness' AND p.provider = s.harness
      WHERE s.uri = :uri
    columns:
    - key: display_name
    - key: uri
    - key: thread
  agent_session_waiting:
    sql: |
      SELECT :thread AS thread
    params:
      thread:
        from: row.thread
  agent_session_terminal:
    sql: |
      SELECT :uri AS uri, :thread AS thread, :conversation AS conversation
    params:
      thread:
        from: row.thread
      conversation:
        from: row.conversation
view:
  stack:
  - id: agent-session-waiting
    title: Waiting on you
    hide_title: true
    from: agent_session_waiting
    viz: approvals
  - id: agent-session-terminal
    title: Terminal
    hide_title: true
    from: agent_session_terminal
    viz: terminal
    terminal:
      of: uri
      conversation: conversation
      thread: thread
actions:
- id: rename
  label: Rename…
  form: true
  command: oxplow.agent_session.rename
  input:
    session: '{{row.session}}'
    title: '{{row.display_name}}'
  fixed:
  - session
  fields:
  - name: title
    label: Name
    help: What this session's tab and lists call it.
  - name: native
    label: Also rename it in the agent
    help: Names the conversation in the agent's own list too (Codex). Only for an agent that can, and not undone with the rename.
- id: fork
  label: Fork into New Session…
  form: true
  command: oxplow.agent_session.fork_conversation
  input:
    session: '{{row.session}}'
    conversation: '{{row.conversation_id}}'
  fixed:
  - session
  fields:
  - name: conversation
    label: Conversation
    help: The saved conversation the new session starts from. The one this session is on is marked.
  choices:
    conversation: oxplow-foundation/agent-session-conversations
  when: can_fork
