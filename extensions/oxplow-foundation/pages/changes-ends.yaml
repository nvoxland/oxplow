title: Ending points
description: The points a comparison can end at - the working tree, or one of the stream's recent snapshots, after the start.
hidden: true
params:
- name: stream_id
- name: start
  default: ''
data:
  changes_ends:
    sql: |
      SELECT value, label, "group" FROM (
        SELECT 'working' AS value, 'Working tree' AS label, 'Now' AS "group", 1 AS k, 0 AS n
        UNION ALL
        SELECT 'snap:' || s.id, substr(s.created_at, 1, 19) || coalesce(' - ' || substr(s.revision, 5, 7), ''),
               coalesce(s.branch, 'Snapshots'), 0, s.id
        FROM v_snapshot s
        WHERE s.stream_id = :stream_id
          AND (coalesce(:start, '') NOT LIKE 'snap:%' OR s.id > CAST(substr(:start, 6) AS INTEGER))
      ) ORDER BY k DESC, n DESC LIMIT 41
view:
  from: changes_ends
  viz: table
