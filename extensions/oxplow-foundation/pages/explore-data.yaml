title: Explore Data
icon: database
category: Data
keywords: sql query schema semantic layer page
params:
- name: model
  label: Dataset
  default: ''
data:
  explore_catalog:
    sql: |
      SELECT view, owner, description, view = :model AS current
      FROM v_dataset
      ORDER BY owner <> 'core', owner, view
view:
  component:
    id: explore-data
rail:
  id: explore-catalog
  from: explore_catalog
  viz: list
  emphasis: current
  columns:
  - key: view
    label: Dataset
    select: model
  - key: owner
    label: Owner
  - key: description
    label: Holds
  empty: No datasets are published.
