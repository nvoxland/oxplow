manifest: 2
name: oxplow-foundation
# Its commands are oxplow's own: `oxplow.<area>.<verb>`.
namespace: oxplow
description: oxplow's own commands, declared like any extension's — each backed by an operation of a scope. Required; it can't be disabled.
engine: ">=0.7"
# What it reaches beyond the baseline: its AI providers call models, its
# effort collector reads the datasets with its own SQL.
permissions: [sql.read, files.read, ai.compute, agent.write]
custom_components:
  # Settings → Integrations: hand-written, with no build step.
  - { id: integrations, title: Integrations, bundle: components/integrations, sql: read, commands: [oxplow.provider.check_instance, oxplow.provider.set_instance, oxplow.provider.add_instance, oxplow.provider.turn_off_here, oxplow.provider.remove_instance, oxplow.provider.set_credential, oxplow.provider.begin_sign_in, oxplow.provider.complete_sign_in, oxplow.provider.cancel_sign_in, oxplow.provider.sync], description: "The Settings area for the instances of external providers: adding one, signing in and checking it." }
intent:
  purpose: >-
    Declare oxplow's own commands — what a person, an agent and a page can
    do to oxplow's records, the repository and the project — over the
    scopes' operations, so nothing about them is special to core.
  origin: null
  examples:
    - name: a person bookmarks a page for their thread
      input: { command: oxplow.bookmark.set, input: { uri: "oxplow:oxplow/page?page=git-dashboard", page_kind: git-dashboard, scope: thread, thread: "thr1" } }
      expect: the page in v_bookmark at the thread's scope, undone by oxplow.bookmark.remove
    - name: definition-reads-a-pages-title-origin-and-nodes
      input: { page: definition, params: { uri: 'oxplow:oxplow/file?path=oxplow-foundation/pages/commit.yaml&filesystem=oxplow:extensions', path: oxplow-foundation/pages/commit.yaml } }
      expect: the tab named for the file, then the page's source, the other pages that draw the file, its params, loaders, nodes and actions; no YAML (the File viewer shows that)
    - name: definition-is-offered-for-a-page-yaml-beside-the-file-viewer
      input: { command: oxplow.page.renderers, input: { uri: 'oxplow:oxplow/file?path=oxplow-foundation/pages/commit.yaml&filesystem=oxplow:extensions' } }
      expect: the File viewer and Definition for a running page's file, only the File viewer for a YAML file that is no page
    - name: definition-is-not-offered-for-a-yaml-that-is-not-a-page
      input: { command: oxplow.page.renderers, input: { uri: 'oxplow:oxplow/file?path=notes.yaml&filesystem=oxplow:temp' } }
      expect: the File viewer alone, for YAML that holds no page or does not parse
    - name: closed-threads-lists-closed-threads-with-their-work
      input: { page: closed-threads, params: { stream_id: 1 } }
      expect: the stream's closed threads only, each with a Reopen action
    - name: work-next-offers-the-ready-items-or-the-first-epic-with-its-children
      input: { page: work-next, params: { thread: thr1 } }
      expect: ready items in list order, a blocked one held until its blocker closes, a ready epic with its ready descendants
    - name: catalog-lists-prompts-and-config-keys
      input: { page: catalog }
      expect: the questions grouped by who offers them with Ask on each, and the config keys
    - name: data-catalog-lists-datasets-with-their-fields
      input: { page: data-catalog, params: { dataset: "" } }
      expect: every dataset with its owner, what it holds and its fields
    - name: data-catalog-names-one-datasets-fields
      input: { page: data-catalog, params: { dataset: effort } }
      expect: one dataset's fields with their docs and key
    - name: thread-settings-start-from-the-saved-prompt-and-list-open-sessions
      input: { page: thread-settings, params: { thread: thr1 } }
      expect: the thread's saved prompt and ref, its open agent sessions
    - name: forking-a-conversation-opens-a-new-session-beside-the-original
      input: { page: agent-session, params: { uri: "oxplow:oxplow/agent_session?id=ses1" } }
      expect: a new session on the same conversation marked to fork, the original untouched
    - name: stream-settings-start-from-the-saved-prompt
      input: { page: stream-settings, params: { stream: str1 } }
      expect: the stream's ref and an empty saved prompt
    - name: settings-values-are-listed-by-group-with-their-source-and-ask
      input: { page: settings, params: { q: snapshotRetentionDays } }
      expect: a setting under its group with its source, its control's page and its Ask request
    - name: settings-search-narrows-by-key-doc-or-value
      input: { page: settings, params: { q: snapshotretention } }
      expect: a search narrows the settings; one matching nothing leaves none
    - name: comments-inbox-lists-threads-by-target-and-a-picked-one-reads-in-order
      input: { page: comments, params: { stream_id: 1, days: "0" } }
      expect: open threads under their target, a resolved one only when the filter reaches back, a picked thread as its messages in order
    - name: alerts-operation-reads-how-a-failure-ended
      input: { page: alerts-operation, params: { event_id: "<a failure's event>" } }
      expect: a failure's command and stderr; one that captured nothing says so
    - name: alerts-lists-failures-until-seen-and-dismissed
      input: { page: alerts }
      expect: a failure red until seen, muted after, gone once dismissed; the other parts empty over a quiet project
    - name: alerts-deliveries-list-nothing-over-a-quiet-project
      input: { page: alerts-deliveries }
      expect: nothing listed over a quiet project
    - name: alerts-reactions-list-nothing-over-a-quiet-project
      input: { page: alerts-reactions }
      expect: nothing listed over a quiet project
    - name: settings-agents-area-hands-set-agents-each-new-order
      input: { page: settings, params: { area: agents } }
      expect: agents in priority order with the lists a row hands set_agents; what new threads start with; the saved prompt addition
    - name: settings-ai-area-lists-providers-roles-and-calls
      input: { page: settings, params: { area: ai } }
      expect: a provider with its kind and a saved key (never the key), a role with its binding, a role bound to nothing with its fallback
    - name: ai-provider-kinds-offer-every-declared-kind
      input: { page: ai-provider-kinds }
      expect: the declared AI provider kinds
    - name: ai-provider-choices-list-the-configured-providers
      input: { page: ai-provider-choices }
      expect: the configured providers
    - name: changes-frames-an-effort-and-a-picked-range
      input: { page: diff-view, params: { uri: "oxplow:oxplow/effort?id=eff1", stream_id: 1 } }
      expect: an effort's own bracket to the working tree, a picked end as a range, nothing without a URI
    - name: changes-effort-names-the-effort-it-is-of
      input: { page: changes-effort, params: { effort_id: 1, effort: eff1 } }
      expect: the effort is open and named for Rename and Link to task
    - name: settings-data-area-lists-entities-collectors-and-effects
      input: { page: settings, params: { area: data } }
      expect: the entities, the collectors and the declared effects
    - name: data-entity-rows-counts-an-open-entitys-rows
      input: { page: data-entity-rows, params: { name: v_work_item } }
      expect: the rows an open entity holds
    - name: data-effect-backfill-says-what-it-would-do
      input: { page: data-effect-backfill, params: { effect: oxplow-bundled/store-reasoning } }
      expect: a backfill plan for an enabled effect, none for one nothing declares
    - name: recent-commits-lists-the-latest-first
      input: { page: recent-commits }
      expect: the latest commits, newest first, cut to the limit
    - name: file-history-lists-the-commits-that-touched-a-file
      input: { page: file-history }
      expect: the commits that touched a file, newest first
    - name: the-command-page-says-what-a-command-needs-and-whether-it-asks-first
      input: { page: command, params: { uri: "oxplow:oxplow/command?command=oxplow.agent.draft" } }
      expect: a command's permission, whether it asks first and can be undone, and where it is declared
    - name: the-skill-page-says-what-a-skill-is
      input: { page: skill, params: { uri: "oxplow:oxplow/skill?skill=oxplow-foundation/work-items" } }
      expect: a skill's description and whether it is a skill or a slash command
    - name: the-component-page-links-the-commands-it-may-run
      input: { page: custom-component, params: { uri: "oxplow:oxplow/custom_component?custom_component=oxplow-foundation/integrations" } }
      expect: a custom component's code, whether it reads data, and a link to each command it may run
    - name: the-collector-page-says-when-a-collector-runs-and-how-it-last-went
      input: { page: collector, params: { uri: "oxplow:oxplow/collector?collector=oxplow-foundation/oxplow.effort_test_outcome" } }
      expect: when a collector runs, whether it is enabled and its last run
    - name: the-measure-page-says-what-a-measure-counts-and-lists-its-metrics
      input: { page: measure, params: { uri: "oxplow:oxplow/measure?measure=oxplow.tokens" } }
      expect: a measure's unit and how it adds up, and the metrics built on it
    - name: the-dimension-page-says-what-a-dimension-slices-by
      input: { page: dimension, params: { uri: "oxplow:oxplow/dimension?dimension=oxplow.language" } }
      expect: a dimension's value type, what it describes and whether it is stored per value
    - name: the-resource-page-lists-the-pages-that-draw-a-resource-kind
      input: { page: resource, params: { uri: "oxplow:oxplow/resource?resource=oxplow-foundation/commit" } }
      expect: a resource kind's URI form and the pages that draw it
    - name: the-implementation-page-says-whether-an-implementation-is-in-use
      input: { page: implementation, params: { uri: "oxplow:oxplow/implementation?implementation=oxplow-foundation/work_items.oxplow" } }
      expect: an implementation's capability, whether it is in use and what it can do
    - name: a-command-row-of-an-extension-links-to-the-commands-page
      input: { page: extension, params: { uri: "oxplow:oxplow/extension?name=oxplow-foundation", name: oxplow-foundation } }
      expect: each command row of the Extension page links to its own command page
    - name: effort-files-lists-what-an-effort-claimed
      input: { page: effort-files }
      expect: the files an effort claimed, by path
    - name: thread-work-lists-a-threads-items
      input: { page: thread-work }
      expect: a thread's items by state
    - name: effort-summary-reads-an-effort-at-a-glance
      input: { page: effort-summary }
      expect: one effort at a glance
    - name: the-test-outcome-says-how-an-efforts-tests-went
      input: { sql: v_fact }
      expect: four counts over an effort's runs, and the time from the first red to the next green
    - name: asserted-failures-have-no-identity-so-distinct-falls-back-to-the-peak
      input: { sql: v_fact }
      expect: a run with only a failure count names no test, so distinct falls back to the peak
    - name: snapshots-lists-newest-first-with-trigger-and-budget
      input: { page: snapshots }
      expect: snapshots come newest first, each with its parent, trigger and whether it ran over budget
    - name: problems-lists-diagnostics-by-file-with-errors-first
      input: { page: problems }
      expect: the problems page lists what its loaders read
    - name: symbols-nest-under-their-container-and-group-by-file
      input: { page: symbols }
      expect: the symbols page lists what its loaders read
    - name: hook-events-lists-the-agents-activity-newest-first
      input: { page: hook-events }
      expect: the hook-events page lists what its loaders read
    - name: go-to-lists-the-bookmarks-of-a-thread
      input: { page: go-to }
      expect: the go-to page lists what its loaders read
    - name: local-history-lists-snapshots-newest-first
      input: { page: local-history }
      expect: the local-history page lists what its loaders read
    - name: git-history-lists-commits-newest-first-narrowed-by-text-and-author
      input: { page: git-history }
      expect: the git-history page lists what its loaders read
    - name: the-commit-page-reads-a-commit-its-change-and-its-files-as-a-tree
      input: { page: commit }
      expect: a commit page makes its change and lists the files as a tree
    - name: the-uncommitted-page-lists-the-working-tree-with-untracked-marked
      input: { page: uncommitted-changes, params: { stream_id: 1 } }
      expect: the working tree's files as a tree, untracked ones marked, and the commit form
    - name: the-git-dashboard-reads-the-branch-the-tree-and-the-recent-commits
      input: { page: git-dashboard, params: { stream_id: 1 } }
      expect: the stream's branch with no upstream, the working tree, the last commits; the rest empty
    - name: the-files-page-lists-a-folder-or-the-changed-files
      input: { page: files-scopes, params: { stream_id: 1 } }
      expect: all files a folder at a time, or the changed files in their folders, each opening a diff
    - name: the-directory-lists-a-folders-folders-then-its-files
      input: { page: directory, params: { stream_id: 1, path: src } }
      expect: the folder's folders, then its files by name, each opening its folder or file
    - name: the-directory-lists-a-folder-on-another-filesystem
      input: { page: directory, params: { stream_id: 1, path: '', filesystem: 'oxplow:extensions' } }
      expect: the extensions that run, each a folder on that filesystem
    - name: the-file-viewer-opens-the-current-version-of-a-local-file-at-a-past-revision
      input: { page: file-viewer, params: { path: 'src/main.rs', rev: 'git:HEAD' } }
      expect: the working-tree file's URI in current_uri, which the Open current version page action opens; none for the working tree or another filesystem
    - name: the-extensions-page-lists-every-extension-and-what-needs-repair
      input: { page: extensions, params: {} }
      expect: a section per extension headed by its name, each fact a sentence, the ones needing attention first, no repair buttons
    - name: extension-problems-groups-each-problem-under-its-extension
      input: { page: extension-problems, params: { extension: oxplow-foundation } }
      expect: the extension is a group heading with an arrow to its page and each problem a subsection under it
    - name: extension-problems-collects-what-is-failing-or-turned-off
      input: { page: extension-problems, params: {} }
      expect: everything wrong with an extension under its name (stopped or failing contributions, permissions waiting for approval, load errors), with Start Again, Repair with the Agent and Start All Stopped
    - name: extension-pages-are-a-table-row-each-linking-to-its-definition
      input: { page: extension, params: { uri: 'oxplow:oxplow/extension?name=oxplow-foundation', name: oxplow-foundation } }
      expect: its pages as a table, each title linking to the Definition of its running file, with its description and what it shows
    - name: extension-contributions-are-a-table-per-kind
      input: { page: extension, params: { uri: 'oxplow:oxplow/extension?name=oxplow-foundation', name: oxplow-foundation } }
      expect: each kind it contributes is a top-level table, a row per contribution with its name (a link where a page draws it), its description and the facts that matter for its kind; a kind it doesn't have isn't shown
    - name: an-extension-lists-its-permissions-as-scopes-with-a-hint-each
      input: { page: extension, params: { uri: 'oxplow:oxplow/extension?name=oxplow-foundation', name: oxplow-foundation } }
      expect: each scope as written with its explanation as a hover; nothing waits on approval for a running extension
    - name: every-shipped-resource-dimension-and-implementation-describes-itself
      input: { sql: "SELECT count(*) FROM v_resource WHERE coalesce(description, '') = ''" }
      expect: foundation's resources, dimensions and implementations each carry a one-sentence description
    - name: the-command-page-links-to-its-extension
      input: { page: command, params: { uri: 'oxplow:oxplow/command?command=oxplow.agent.draft' } }
      expect: its see-also links name the extension that declares it
    - name: the-skill-page-links-to-its-extension
      input: { page: skill, params: { uri: 'oxplow:oxplow/skill?skill=oxplow-foundation/work-items' } }
      expect: its see-also links name the extension that declares it
    - name: the-custom-component-page-links-to-its-extension
      input: { page: custom-component, params: { uri: 'oxplow:oxplow/custom_component?custom_component=oxplow-foundation/integrations' } }
      expect: its see-also links name the extension that declares it
    - name: the-dimension-page-links-to-its-extension
      input: { page: dimension, params: { uri: 'oxplow:oxplow/dimension?dimension=oxplow.language' } }
      expect: its see-also links name the extension that declares it
    - name: the-resource-page-links-to-its-extension
      input: { page: resource, params: { uri: 'oxplow:oxplow/resource?resource=oxplow-foundation/commit' } }
      expect: its see-also links name the extension that declares it
    - name: the-implementation-page-links-to-its-extension
      input: { page: implementation, params: { uri: 'oxplow:oxplow/implementation?implementation=oxplow-foundation/work_items.oxplow' } }
      expect: its see-also links name the extension that declares it
    - name: the-measure-page-links-to-its-extension-and-the-list-it-belongs-to
      input: { page: measure, params: { uri: 'oxplow:oxplow/measure?measure=oxplow.tokens' } }
      expect: its see-also links name the extension that declares it and the list it belongs to
    - name: the-collector-page-links-to-its-extension-and-the-list-it-belongs-to
      input: { page: collector, params: { uri: 'oxplow:oxplow/collector?collector=oxplow-foundation/oxplow.effort_test_outcome' } }
      expect: its see-also links name the extension that declares it and the list it belongs to
    - name: the-editor-links-to-the-files-history-and-its-folder
      input: { page: editor, params: { path: src/sub/c.rs } }
      expect: its see-also links open the file's history and its folder
    - name: the-file-viewer-links-to-the-files-history-and-its-folder
      input: { page: file-viewer, params: { path: src/sub/c.rs, rev: 'git:HEAD' } }
      expect: its see-also links open a local file's history and its folder
    - name: the-metric-data-page-lists-its-recordings-alone
      input: { page: metric-data, params: { uri: "oxplow:oxplow/metric?metric=agent.tokens.total", metric: agent.tokens.total } }
      expect: its recordings and the files its measure could not check, and no definition or trend
    - name: the-metric-page-links-to-its-measure-and-the-metrics-list
      input: { page: metric, params: { metric: agent.tokens.total } }
      expect: its see-also links open the measure it is built on and the metrics list
    - name: the-definition-page-links-to-the-page-and-its-extension
      input: { page: definition, params: { uri: 'oxplow:oxplow/file?path=oxplow-foundation/pages/problems.yaml&filesystem=oxplow:extensions', path: oxplow-foundation/pages/problems.yaml, stream_id: 1 } }
      expect: its see-also links open the page it describes and its extension
    - name: the-directory-links-to-its-parent-folder-and-the-files-page
      input: { page: directory, params: { stream_id: 1, path: src/sub } }
      expect: its see-also links open the parent folder and the Files page
    - name: the-agent-session-links-to-its-threads-work-and-the-efforts-it-ran
      input: { page: agent-session, params: { uri: 'oxplow:oxplow/agent_session?id=ses1' } }
      expect: its see-also links open its thread's work and the efforts it ran
    - name: the-alerts-page-links-to-extension-problems-and-collectors
      input: { page: alerts }
      expect: its see-also links open the extension problems and the collectors
    - name: the-collector-page-links-to-its-extensions-problems-when-it-is-not-ok
      input: { page: collector, params: { uri: 'oxplow:oxplow/collector?collector=oxplow-foundation/oxplow.effort_test_outcome' } }
      expect: an unhealthy collector's see-also links open its extension's problems
    - name: the-extension-page-links-to-all-extensions-and-its-problems
      input: { page: extension, params: { uri: 'oxplow:oxplow/extension?name=oxplow-foundation', name: oxplow-foundation } }
      expect: its see-also links are Extensions and Extension problems for this extension
    - name: the-commit-page-links-to-git-history
      input: { page: commit, params: { uri: 'oxplow:oxplow/commit?sha=abc1234', sha: abc1234, stream_id: 1 } }
      expect: its see-also link is Git History
    - name: the-collector-page-says-what-it-is-in-a-paragraph-above-its-facts
      input: { page: collector, params: {uri:"oxplow:oxplow/collector?collector=oxplow-foundation/oxplow.effort_test_outcome"} }
      expect: its description is a paragraph above the facts
    - name: the-command-page-says-what-it-is-in-a-paragraph-above-its-facts
