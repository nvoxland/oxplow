      expect: its description is a paragraph above the facts
    - name: the-skill-page-says-what-it-is-in-a-paragraph-above-its-facts
      input: { page: skill, params: {uri:"oxplow:oxplow/skill?skill=oxplow-foundation/work-items"} }
      expect: its description is a paragraph above the facts
    - name: the-dataset-definition-page-says-what-it-is-in-a-paragraph-above-its-facts
      input: { page: dataset-definition, params: {uri:"oxplow:oxplow/dataset?dataset=work_item"} }
      expect: its description is a paragraph above the facts
    - name: the-extension-page-reads-a-shipped-extension
      input: { page: extension, params: { uri: 'oxplow:oxplow/extension?name=oxplow-foundation', name: oxplow-foundation } }
      expect: where it comes from, what runs, its pages with a link to each Definition, what it may reach in words, its deployments, and a slot for its runs
    - name: the-extension-page-is-offered-for-an-extension-uri
      input: { command: oxplow.page.renderers, input: { uri: 'oxplow:oxplow/extension?name=oxplow-foundation' } }
