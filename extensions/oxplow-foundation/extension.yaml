# What the coding agent reads about the work list: its commands (with no
# list they're a sink), and oxplow's tasks' ready queue while they are it.
skills:
  - { name: work-items, file: skills/work-items/SKILL.md }
  - { name: work-next, kind: command, file: commands/work-next.md }
# What oxplow runs by default: the work list, the effort policy, snapshots
# and the wiki (a project chooses another provider in Settings), and the agent
# harnesses and AI providers — core's built-ins, many of each at once (every
# one of those declared here is active).
implementations:
  - { capability: work_items, id: oxplow, entry: "oxplow:tasks", skills: [work-next], description: "The work list that oxplow keeps itself." }
  - { capability: effort_policy, id: oxplow, entry: "oxplow:commit-or-switch", description: "Ends an effort when its work is committed or the agent switches to other work." }
  - { capability: snapshots, id: hashes, entry: "oxplow:snapshot-hashes", description: "Saves the project's files as snapshots named by their hashes." }
  - { capability: knowledge, id: oxplow, entry: "oxplow:wiki", description: "The wiki that oxplow keeps in the project." }
  - { capability: agent_harness, id: claude, entry: "oxplow:claude-code", title: Claude, icon: icons/claude.svg, description: "Runs Claude Code as a coding agent." }
  - { capability: agent_harness, id: codex, entry: "oxplow:codex-cli", title: Codex, icon: icons/codex.svg, description: "Runs Codex as a coding agent." }
  - { capability: agent_harness, id: opencode, entry: "oxplow:opencode", title: OpenCode, icon: icons/opencode.svg, description: "Runs OpenCode as a coding agent." }
  # AI providers: each the Rust kind it is (`provider:`, oxplow-ai-rig) —
  # Rig's for all but TypeSafe — at its API's default URL. Declaring one
  # points a person's key at that URL, so it needs `permissions.ai`.
  - { capability: ai_provider, id: anthropic, title: Anthropic, provider: anthropic, config: { baseUrl: "https://api.anthropic.com" }, description: "Anthropic's models, such as Claude." }
  - { capability: ai_provider, id: openai, title: OpenAI, provider: openai, config: { baseUrl: "https://api.openai.com/v1" }, description: "OpenAI's models." }
  - { capability: ai_provider, id: openai_compatible, title: An OpenAI-compatible API, provider: openai_compatible, description: "Any service that speaks the OpenAI API." }
  - { capability: ai_provider, id: openrouter, title: OpenRouter, provider: openrouter, config: { baseUrl: "https://openrouter.ai/api/v1" }, description: "Many makers' models, through OpenRouter." }
  - { capability: ai_provider, id: gemini, title: Google Gemini, provider: gemini, config: { baseUrl: "https://generativelanguage.googleapis.com" }, description: "Google's Gemini models." }
  - { capability: ai_provider, id: mistral, title: Mistral, provider: mistral, config: { baseUrl: "https://api.mistral.ai" }, description: "Mistral's models." }
  - { capability: ai_provider, id: groq, title: Groq, provider: groq, config: { baseUrl: "https://api.groq.com/openai/v1" }, description: "Models that run on Groq's hardware." }
  - { capability: ai_provider, id: deepseek, title: DeepSeek, provider: deepseek, config: { baseUrl: "https://api.deepseek.com" }, description: "DeepSeek's models." }
  - { capability: ai_provider, id: xai, title: xAI, provider: xai, config: { baseUrl: "https://api.x.ai" }, description: "xAI's Grok models." }
  - { capability: ai_provider, id: ollama, title: Ollama, provider: ollama, config: { baseUrl: "http://localhost:11434/v1" }, description: "Models that run on your own machine, through Ollama." }
  - { capability: ai_provider, id: llamacpp, title: llama.cpp server, provider: llamacpp, config: { baseUrl: "http://localhost:8080/v1" }, description: "Models that run in a local llama.cpp server." }
  - { capability: ai_provider, id: typesafe, title: TypeSafe, provider: typesafe, config: { baseUrl: "https://api.typesafe.ai" }, description: "A model service that only answers typed questions." }
collectors:
  # What an effort's test runs came to, recorded when it finishes: the
  # quality gate, the worst run, the tests it broke, the red runs and the time
  # to the first green (`oxplow.tests.*`, `effort.time_to_green_ms`). Its
  # input is the effort's measured runs (`tests` captures) with their failed
  # cases, oldest first.
  - id: oxplow.effort_test_outcome
    doc: How an effort's tests went, recorded when it finishes.
    runtime: starlark
    entry: collectors/effort/test_outcome.star
    on: [effort.finished]
    input: |
      SELECT r.id AS run,
             COALESCE(r.failed, 0) AS failed,
             (SELECT count(*) FROM v_test_case a WHERE a.run_id = r.id) AS cases,
             CAST(strftime('%s', cap.captured_at) AS INTEGER) * 1000
               + CAST(substr(cap.captured_at, 21, 3) AS INTEGER) AS at_ms,
             CASE WHEN c.name IS NULL THEN NULL
                  ELSE uri('oxplow/test', 'class', c.classname, 'name', c.name) END AS "case",
             uri_param(e.uri, 'id') AS effort
      FROM v_capture cap
      JOIN v_test_run r ON r.id = cap.id
      JOIN v_effort e ON e.id = cap.effort_id
      LEFT JOIN v_test_case c ON c.run_id = r.id AND c.status = 'failed'
      WHERE cap.producer = 'tests' AND cap.effort_id = :effort_id
      ORDER BY cap.captured_at, r.id
    facts: [oxplow.effort_test_outcome, oxplow.effort_time_to_green]
metrics:
  # what oxplow records itself
  - {"key":"agent.tokens.input","title":"Input tokens","measure": "oxplow.tokens", "expression": "SUM(value) FILTER (WHERE dim('oxplow.token_kind') = 'input')", "unit":"tokens","direction":"neutral","displayKind":"gauge","category":"operational","description":"Input tokens consumed by the agent.","sliceableDims":["oxplow.model"]}
  - {"key":"agent.tokens.output","title":"Output tokens","measure": "oxplow.tokens", "expression": "SUM(value) FILTER (WHERE dim('oxplow.token_kind') = 'output')", "unit":"tokens","direction":"neutral","displayKind":"gauge","category":"operational","description":"Output tokens produced by the agent.","sliceableDims":["oxplow.model"]}
  - {"key":"agent.tokens.total","title":"Total tokens","measure": "oxplow.tokens", "expression": "SUM(value)", "unit":"tokens","direction":"neutral","displayKind":"gauge","category":"operational","description":"Total tokens (input + output) used by the agent.","sliceableDims":["oxplow.model"]}
  - {"key":"agent.tokens.cache_read","title":"Cache-read tokens","measure": "oxplow.cache_tokens", "expression": "SUM(value) FILTER (WHERE dim('oxplow.token_kind') = 'cache_read')", "unit":"tokens","direction":"neutral","displayKind":"gauge","category":"operational","description":"Prompt tokens served from cache instead of re-processed.","sliceableDims":["oxplow.model"]}
  - {"key":"agent.tokens.cache_creation","title":"Cache-write tokens","measure": "oxplow.cache_tokens", "expression": "SUM(value) FILTER (WHERE dim('oxplow.token_kind') = 'cache_creation')", "unit":"tokens","direction":"neutral","displayKind":"gauge","category":"operational","description":"Prompt tokens written into the cache (the cache-warming cost).","sliceableDims":["oxplow.model"]}
  - {"key":"agent.tokens.cache_hit_pct","title":"Cache hit ratio","measure": "oxplow.cache_usage", "expression": "RATIO(num, den)", "unit":"%","direction":"higher-better","displayKind":"gauge","category":"operational","description":"Prompt-side cache hit ratio: cache-read / (input + cache-read + cache-write).","sliceableDims":["oxplow.model"]}
  - {"key":"task.tokens","title":"Tokens per effort","measure": "oxplow.effort_tokens", "expression": "AVG(value)", "unit":"tokens","direction":"lower-better","displayKind":"gauge","category":"operational","description":"Avg tokens (all kinds) a closed effort spent — the cost of a unit of work, in tokens.","sliceableDims":["oxplow.branch","oxplow.effort"]}
  - {"key":"agent.turns","title":"Agent turns","measure": "oxplow.turn", "expression": "SUM(value)", "unit":"count","direction":"neutral","displayKind":"gauge","category":"operational","description":"Number of agent turns.","sliceableDims":["oxplow.model"]}
  - {"key":"effort.cycle_time_ms","title":"Effort cycle time","measure": "oxplow.cycle_time", "expression": "AVG(value)", "unit":"ms","direction":"lower-better","displayKind":"gauge","category":"operational","description":"How long an effort stayed open (close minus start).","sliceableDims":["oxplow.branch","oxplow.effort"]}
  - {"key":"work_item.efforts","title":"Efforts per work item","measure": "oxplow.work_item_effort", "expression": "AVG(value)", "unit":"count","direction":"lower-better","displayKind":"gauge","category":"operational","description":"Number of efforts spent on a work item (the redo-rate signal).","sliceableDims":["oxplow.branch","oxplow.effort"]}
  - {"key":"task.tokens.wasted","title":"Wasted tokens","measure": "oxplow.token_waste", "expression": "SUM(value)", "unit":"tokens","direction":"lower-better","displayKind":"gauge","category":"operational","description":"Tokens spent in closed efforts whose commits were later reverted.","sliceableDims":["oxplow.branch","oxplow.effort"]}
  - {"key":"task.tokens.wasted_pct","title":"Wasted-token ratio","measure": "oxplow.token_waste", "expression": "RATIO(num, den)", "unit":"%","direction":"lower-better","displayKind":"gauge","category":"operational","description":"Share of effort token spend that was later reverted — wasted ÷ all metered spend, across closed efforts.","sliceableDims":["oxplow.branch","oxplow.effort"]}
  - {"key":"task.steering","title":"Steering per effort","measure": "oxplow.effort_steering", "expression": "AVG(value)", "unit":"per effort","direction":"lower-better","displayKind":"gauge","category":"operational","description":"Avg steering events per closed effort (user prompts + Stop-hook nudges + review comments) — the autonomy number; lower means more autonomous.","sliceableDims":["oxplow.branch","oxplow.effort"]}
  - {"key":"effort.time_to_green_ms","title":"Time to green","measure": "oxplow.effort_time_to_green", "expression": "AVG(value)", "unit":"ms","direction":"lower-better","displayKind":"gauge","category":"testing","description":"Avg wall-clock from an effort's first red test run to its first green — only efforts that went red and recovered count.","sliceableDims":["oxplow.branch","oxplow.effort"]}
  - {"key":"agent.nudges.fired","title":"Nudges fired","measure": "oxplow.nudge", "expression": "SUM(value)", "unit":"count","direction":"lower-better","displayKind":"event","category":"operational","description":"Count of nudges fired to the agent.","sliceableDims":["subject","oxplow.branch","oxplow.thread"]}
  - {"key":"oxplow.tests.passed","title":"Tests passed","measure": "oxplow.test_case", "expression": "COUNT(*) FILTER (WHERE dim('oxplow.status') = 'passed')", "unit":"count","direction":"higher-better","displayKind":"gauge","category":"testing","description":"Known tests currently passing — each test's latest recorded status, unioned across runners.","sliceableDims":["oxplow.branch"]}
  - {"key":"oxplow.tests.failed","title":"Tests failed","measure": "oxplow.test_case", "expression": "COUNT(*) FILTER (WHERE dim('oxplow.status') = 'failed')", "unit":"count","direction":"lower-better","displayKind":"gauge","category":"testing","description":"Known tests currently failing — each test's latest recorded status, unioned across runners.","sliceableDims":["oxplow.branch"]}
  - {"key":"oxplow.tests.total","title":"Tests total","measure": "oxplow.test_case", "expression": "COUNT(*)", "unit":"count","direction":"neutral","displayKind":"gauge","category":"testing","description":"All known tests — union across runners, each counted at its latest recorded status.","sliceableDims":["oxplow.branch"]}
  - {"key":"oxplow.tests.duration_ms","title":"Test suite duration","measure": "oxplow.test_duration", "expression": "SUM(value)", "unit":"ms","direction":"lower-better","displayKind":"gauge","category":"testing","description":"Total wall-clock time of the known test suite.","sliceableDims":["oxplow.branch"]}
  - {"key":"oxplow.tests.slowest_ms","title":"Slowest test","measure": "oxplow.test_duration", "expression": "MAX(value)", "unit":"ms","direction":"lower-better","displayKind":"gauge","category":"testing","description":"Wall-clock time of the slowest single test.","sliceableDims":["oxplow.branch"]}
  - {"key":"oxplow.tests.failed_at_close","title":"Tests failed at close","measure": "oxplow.effort_test_outcome", "expression": "AVG(value) FILTER (WHERE dim('oxplow.tests_stat') = 'at_close')", "unit":"per effort","direction":"lower-better","displayKind":"gauge","category":"testing","description":"Failing tests in the effort's final run, averaged across closed efforts — did work close green.","sliceableDims":["oxplow.branch"]}
  - {"key":"oxplow.tests.peak_failed","title":"Peak tests failed","measure": "oxplow.effort_test_outcome", "expression": "AVG(value) FILTER (WHERE dim('oxplow.tests_stat') = 'peak')", "unit":"per effort","direction":"lower-better","displayKind":"gauge","category":"testing","description":"Most tests failing in any single run during an effort, averaged across closed efforts.","sliceableDims":["oxplow.branch"]}
  - {"key":"oxplow.tests.distinct_failed","title":"Distinct tests failed","measure": "oxplow.effort_test_outcome", "expression": "AVG(value) FILTER (WHERE dim('oxplow.tests_stat') = 'distinct_failed')", "unit":"per effort","direction":"lower-better","displayKind":"gauge","category":"testing","description":"Distinct tests that went red at least once during an effort, averaged across closed efforts.","sliceableDims":["oxplow.branch"]}
  - {"key":"oxplow.tests.red_runs","title":"Red test runs","measure": "oxplow.effort_test_outcome", "expression": "AVG(value) FILTER (WHERE dim('oxplow.tests_stat') = 'red_runs')", "unit":"per effort","direction":"lower-better","displayKind":"gauge","category":"testing","description":"Test runs with at least one failure during an effort, averaged across closed efforts.","sliceableDims":["oxplow.branch"]}
  - {"key":"oxplow.coverage.abs_pct","title":"Coverage","measure": "oxplow.coverage", "expression": "RATIO(num, den)", "unit":"%","direction":"higher-better","displayKind":"coverage","category":"coverage","description":"Whole-report coverage %.","sliceableDims":["oxplow.branch","oxplow.vcs_rev"],"target":80.0,"warnAt":80.0,"failAt":50.0}
  - {"key":"oxplow.coverage.branch_pct","title":"Branch coverage","measure": "oxplow.coverage.branch", "expression": "RATIO(num, den)", "unit":"%","direction":"higher-better","displayKind":"coverage","category":"coverage","description":"Whole-report branch coverage %.","sliceableDims":["oxplow.branch","oxplow.vcs_rev"]}
  - {"key":"oxplow.coverage.function_pct","title":"Function coverage","measure": "oxplow.coverage.function", "expression": "RATIO(num, den)", "unit":"%","direction":"higher-better","displayKind":"coverage","category":"coverage","description":"Whole-report function/method coverage %.","sliceableDims":["oxplow.branch","oxplow.vcs_rev"]}
  - {"key":"oxplow.coverage.untested_files","title":"Untested files","measure": "oxplow.coverage", "expression": "COUNT(*) FILTER (WHERE value <= 0)", "unit":"count","direction":"lower-better","displayKind":"findings","category":"coverage","description":"Instrumented files with 0% line coverage.","sliceableDims":["oxplow.branch","oxplow.vcs_rev"]}
  - {"key":"oxplow.analysis.errors","title":"Analysis errors","measure": "oxplow.lint_hit", "expression": "COUNT(*) FILTER (WHERE severity = 'error')", "unit":"count","direction":"lower-better","displayKind":"gauge","category":"static-quality","description":"Static-analysis errors in the latest run.","sliceableDims":["oxplow.branch","oxplow.vcs_rev"]}
  - {"key":"oxplow.analysis.warnings","title":"Analysis warnings","measure": "oxplow.lint_hit", "expression": "COUNT(*) FILTER (WHERE severity = 'warning')", "unit":"count","direction":"lower-better","displayKind":"gauge","category":"static-quality","description":"Static-analysis warnings in the latest run.","sliceableDims":["oxplow.branch","oxplow.vcs_rev"]}
  - {"key":"work.tasks_completed","title":"Tasks completed","entity":"v_work_item","where":"state = 'done'","time":"closed_at","aggregation":"count","unit":"tasks","category":"operational","description":"Work items done, by the day they were closed."}
  - {"key":"work.open_tasks","title":"Open tasks","entity":"v_work_item","where":"state IN ('todo', 'in_progress', 'blocked')","aggregation":"count","unit":"tasks","category":"operational","description":"Work items ready, in progress or blocked, captured over time."}
# What oxplow's URIs name (`oxplow:oxplow/<resource>?<params>`): declared
# here like any extension's resources, so none is special
# (the resource URI grammar). A param's `pattern` matches its decoded value.
resources:
  - name: project
    description: "The project oxplow is open on."
    label: Project
    params: { id: { required: true, pattern: '^[A-Za-z0-9._-]+$' } }
    icon: package
  - name: stream
    description: "A line of work with its own branch and checkout."
    label: Stream
    params: { id: { required: true, pattern: '^str[0-9]+$' } }
    resolve: stream
    icon: git-branch
  - name: thread
    description: "A conversation of work inside a stream, with its tasks and agent sessions."
    label: Thread
    params: { id: { required: true, pattern: '^thr[0-9]+$' } }
    resolve: thread
    searchable: search_thread
    icon: message-square
  - name: effort
    description: "A stretch of one thread's work that oxplow tracks from its start to its finish."
    label: Effort
    params: { id: { required: true, pattern: '^eff[0-9]+$' } }
    resolve: effort
    searchable: search_effort
    icon: flag
  - name: turn
    description: "One turn of an agent's conversation: a prompt and the agent's reply."
    label: Agent turn
    params: { id: { required: true, pattern: '^trn[0-9]+$' } }
    resolve: agent_turn
    title: prompt
    searchable: search_turn
    icon: activity
  - name: snapshot
    description: "A saved copy of the project's files at one moment."
    label: Snapshot
    params: { id: { required: true, pattern: '^[A-Za-z0-9]+$' } }
    resolve: snapshot
    title: created_at
    icon: history
  - name: commit
    description: "A git commit."
    label: Commit
    params: { sha: { required: true, pattern: '^[0-9a-f]{7,64}$' } }
    resolve: commit
    title: subject
    searchable: search_commit
    icon: git-commit
    wikilink: { prefix: git, param: sha }
  - name: branch
    description: "A git branch."
    label: Branch
    params: { name: { required: true } }
    icon: git-branch
  - name: file
    description: "A file on a filesystem at a revision."
    label: File
    params: { path: { required: true }, rev: { pattern: '^[!-~]+$' }, filesystem: { pattern: '^[a-z][a-z0-9_-]*:[a-z][a-z0-9_-]*$' } }
    icon: file-text
    wikilink: { prefix: file, param: path }
  - name: dir
    description: "A folder on a filesystem at a revision."
    label: Directory
    params: { path: { required: true }, rev: { pattern: '^[!-~]+$' }, filesystem: { pattern: '^[a-z][a-z0-9_-]*:[a-z][a-z0-9_-]*$' } }
