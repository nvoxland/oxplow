    wikilink: { prefix: dir, param: path }
  - name: symbol
    description: "A named item in source code, such as a function or a type."
    label: Symbol
    params: { path: { required: true }, symbol: { required: true }, rev: { pattern: '^[a-z]+:[!-~]+$' } }
    resolve: symbol
    title: name
