    - name: the-measure-page-says-what-it-is-in-a-paragraph-above-its-facts
      input: { page: measure, params: {uri:"oxplow:oxplow/measure?measure=oxplow.tokens"} }
      expect: its description is a paragraph above the facts
    - name: the-resource-page-says-what-it-is-in-a-paragraph-above-its-facts
      input: { page: resource, params: {uri:"oxplow:oxplow/resource?resource=oxplow-foundation/commit"} }
      expect: its description is a paragraph above the facts
    - name: the-measure-data-page-says-what-it-is-in-a-paragraph-above-its-facts
