manifest: 2
name: oxplow-foundation
# Its commands are oxplow's own: `oxplow.<area>.<verb>`.
namespace: oxplow
description: oxplow's own commands, declared like any extension's — each backed by an operation of a scope. Required; it can't be disabled.
sharing: shared
engine: ">=0.7"
intent:
  purpose: >-
    Declare oxplow's own commands — what a person, an agent and a lens can
    do to oxplow's records, the repository and the project — over the
    scopes' operations, so nothing about them is special to core.
  origin: null
  examples:
    - name: a person bookmarks a page for their thread
      input: { command: oxplow.bookmark.set, input: { ref: "page:git-dashboard", page_kind: git-dashboard, scope: thread, thread: "thread:thr1" } }
      expect: the page in v_bookmark at the thread's scope, undone by oxplow.bookmark.remove
# The agent harnesses, ACP agents and AI providers oxplow runs: core's
# built-ins, many of each at once (every one declared here is active).
implementations:
  - { capability: agent_harness, id: claude, entry: "oxplow:claude-code", title: Claude }
  - { capability: agent_harness, id: codex, entry: "oxplow:codex-cli", title: Codex }
  - { capability: agent_harness, id: opencode, entry: "oxplow:opencode", title: OpenCode }
  - { capability: agent_harness, id: acp, entry: "oxplow:acp", title: ACP }
  - { capability: acp_adapter, id: claude, entry: "oxplow:acp-adapter", config: { command: claude-agent-acp, systemPrompt: meta } }
  - { capability: acp_adapter, id: gemini, entry: "oxplow:acp-adapter", config: { command: gemini, args: [--acp] } }
  - { capability: acp_adapter, id: codex, entry: "oxplow:acp-adapter", config: { command: codex-acp } }
  - { capability: ai_provider, id: anthropic, entry: "oxplow:anthropic" }
  - { capability: ai_provider, id: openai, entry: "oxplow:openai-compatible", title: OpenAI, config: { baseUrl: "https://api.openai.com/v1" } }
  - { capability: ai_provider, id: openai_compatible, entry: "oxplow:openai-compatible" }
  - { capability: ai_provider, id: openrouter, entry: "oxplow:openrouter" }
  - { capability: ai_provider, id: typesafe, entry: "oxplow:typesafe" }
commands:
  # agent_input.write — the window's; a person's only (oxplow never types for the agent).
  - name: agent.draft
    summary: "Put text in the shown thread's agent input, unsent."
    scope: agent_input.write
    op: draft
    invokers: { human: true, agent: false, lens: true }
  - name: lens.draft_with_agent
    summary: "Start a prompt asking your agent to build a lens, in its input, unsent."
    scope: agent_input.write
    op: draft
    invokers: { human: true, agent: false, lens: false }
    ui: { label: "New Lens with Your Agent…", group: Tasks, input: { text: "Build me an oxplow lens (a page I can open with Cmd+P) that shows " }, when: "threadShown" }
  # agent_sessions.write
  - name: agent_session.close
    summary: "Close an agent session (`agent_session:ses3`): its open turn ends and its process — the terminal agent or ACP agent — stops. An agent's waits for a person."
    scope: agent_sessions.write
    op: close
    confirm: destructive
    invokers: { human: true, agent: true, lens: true }
  - name: agent_session.open
    summary: "Open an agent session on a thread (`thread:thr1`): a slot the person's UI starts an agent in. It only adds the slot — nothing is started or typed for it. `harness` (default: the project's first enabled agent), `acp_agent` for an ACP one, `title`. An agent opens one only in its own stream."
    scope: agent_sessions.write
    op: open
    invokers: { human: true, agent: true, lens: true }
    ui: { label: "New Agent Session…", group: Tasks, keywords: [agent, session, start], form: "page:new-session", when: "threadShown" }
  - name: agent_session.rename
    summary: "Rename an agent session (`agent_session:ses3`)."
    scope: agent_sessions.write
    op: rename
    invokers: { human: true, agent: true, lens: true }
  # bookmarks.write — a person's navigation, not the agent's.
  - name: bookmark.set
    summary: "Bookmark a page at a scope (`thread`, `stream` or `project`), moving it there if it's bookmarked at another."
    scope: bookmarks.write
    op: set
    invokers: { human: true, agent: false, lens: true }
  - name: bookmark.remove
    summary: "Take a page's bookmark off, whichever scope it's at."
    scope: bookmarks.write
    op: remove
    invokers: { human: true, agent: false, lens: true }
  # collectors.sync
  - name: collector.sync
    summary: "Run an approved collector now, refreshing what it collects (runs the collector's program or script, which the bus doesn't own). It never approves: an unapproved exec collector is refused. A project report collector (`records:`) reads its report now and records what it parses in `thread` (an agent's own): point at the report, never report numbers yourself."
    scope: collectors.sync
    op: sync
    invokers: { human: true, agent: true, lens: true }
  # config.read
  - name: config.get
    summary: "One .oxplow/project.yaml key: its doc, value schema and current value."
    scope: config.read
    op: get
    invokers: { human: true, agent: true, lens: true }
  - name: config.list_keys
    summary: "Every .oxplow/project.yaml key with its doc, value schema, current value and whether only a person may set it."
    scope: config.read
    op: list_keys
    invokers: { human: true, agent: true, lens: true }
  # config.write
  - name: config.set
    summary: "Set one .oxplow/project.yaml key — or, with `layer: personal`, a person's own choice in .oxplow/personal.yaml (only `activeProviders`). The value is validated against the key's schema and the file's own rules, written to the file, and logged as config.changed; undo restores the prior value. Human-only keys need a person's confirmation."
    scope: config.write
    op: set
    invokers: { human: true, agent: true, lens: true }
  - name: config.unset
    summary: "Remove one .oxplow/project.yaml key so it returns to its default (or, with `layer: personal`, a person's own choice); logged as config.changed, undo restores it."
    scope: config.write
    op: unset
    invokers: { human: true, agent: true, lens: true }
  # dashboards.write
  - name: dashboard.add_item
    summary: "Add a tile to a dashboard: `query` (pinned `sql`, checked like query_sql, shown per `display` — a lens viz, or `metric` for the metric card with its key as `metric` in `options_json`), `lens` (`lens_id`) or `text` (`options_json` `{\"text\": …}`). `options_json` may also set its size and title; `position` where it goes."
    scope: dashboards.write
    op: add_item
    invokers: { human: true, agent: true, lens: true }
  - name: dashboard.create
    summary: "Create an empty dashboard (a grid of tiles); fill it with `oxplow.dashboard.add_item`."
    scope: dashboards.write
    op: create
    invokers: { human: true, agent: true, lens: true }
    ui: {"label": "New Dashboard…", "group": "Tasks", "input": {"title": "Untitled dashboard"}, "open_after": "page:custom-dashboard?id={{result.id}}"}
  - name: dashboard.delete
    summary: "Delete a dashboard and its tiles. A person's, confirmed."
    scope: dashboards.write
    op: delete
    invokers: { human: true, agent: false, lens: true }
    confirm: destructive
  - name: dashboard.remove_item
    summary: "Remove a tile from its dashboard (`dti7`)."
    scope: dashboards.write
    op: remove_item
    invokers: { human: true, agent: true, lens: true }
  - name: dashboard.rename
    summary: "Rename a dashboard (`dsh3`)."
    scope: dashboards.write
    op: rename
    invokers: { human: true, agent: true, lens: true }
  - name: dashboard.reorder_items
    summary: "Reorder a dashboard's tiles (`order`: tile ids in their new order)."
    scope: dashboards.write
    op: reorder_items
    invokers: { human: true, agent: true, lens: true }
  - name: dashboard.update_item
    summary: "Change a tile's options (`dti7`); a query tile's `sql` is checked again."
    scope: dashboards.write
    op: update_item
    invokers: { human: true, agent: true, lens: true }
  # diagnostics.write
  - name: ui.report_error
    summary: "Record an operation that failed in front of the person in the app, as the app showed it, so the agent can read it in `v_op_error`. The app's own: a person's only."
    scope: diagnostics.write
    op: report_error
    invokers: { human: true, agent: false, lens: false }
  # editor.write — the window's; an agent saves in its own thread.
  - name: editor.save
    summary: "Save a file's unsaved changes (`ref`: its tab, `file:src/a.rs`; none saves the one your thread shows)."
    scope: editor.write
    op: save
    invokers: { human: true, agent: true, lens: true }
    ui: { label: Save, group: File, shortcut: "Ctrl/Cmd+S", while_typing: true, menu: { bar: file, group: 2_save, order: 10 }, when: "fileDirty" }
  # efforts.write
  - name: effort.close
    summary: "Close an effort (by id, or a thread's open one), optionally as of a past point and with a summary."
    scope: efforts.write
    op: close
    invokers: { human: true, agent: true, lens: true }
  - name: effort.confirm_decision
    summary: "Confirm a decision oxplow inferred from an effort (`decision:<id>`): it was made, as stated. A person's review."
    scope: efforts.write
    op: confirm_decision
    invokers: { human: true, agent: false, lens: true }
  - name: effort.dismiss_decision
    summary: "Dismiss a decision oxplow inferred from an effort (`decision:<id>`): it wasn't made, or not like that. A person's review."
    scope: efforts.write
    op: dismiss_decision
    invokers: { human: true, agent: false, lens: true }
  - name: effort.link
    summary: "Link an effort (by id, or a thread's open one) to a work item, or unlink it with `work_item: null`."
    scope: efforts.write
    op: link
    invokers: { human: true, agent: true, lens: true }
  - name: effort.open
    summary: "Open an effort — a span of a thread's work — on a thread (yours by default), optionally linked to a work item. The thread's current effort closes first. oxplow opens efforts itself; this is for policies, people and corrections."
    scope: efforts.write
    op: open
    invokers: { human: true, agent: true, lens: true }
  - name: effort.record_claim
    summary: "Record a CLAIM about your work before you report it done: \"tests pass\", \"no behavior change\", \"handles empty input\". Cite `evidence_ref` (`run:<id>`, a test name) when you have it — an unbacked claim shows as unverified for a person to check, so don't claim what you didn't verify. Returns `{ id, effort }`."
    scope: efforts.write
    op: record_claim
    invokers: { human: true, agent: true, lens: true }
  - name: effort.record_decision
    summary: "Record a DECISION you made while working: a fork where you picked one approach over others without asking (where to put something, which library, what to leave out, how to read an ambiguous ask). People review these first, so record the non-obvious ones as you make them — not trivia. Attaches to `work_item`'s open effort, else your thread's. Returns `{ id, effort }`."
    scope: efforts.write
    op: record_decision
    invokers: { human: true, agent: true, lens: true }
  - name: effort.reopen_decision
    summary: "Take back a review of an inferred decision (`decision:<id>`): it is unconfirmed again."
    scope: efforts.write
    op: reopen_decision
    invokers: { human: true, agent: false, lens: true }
  - name: effort.report
    summary: "Optional: describe the thread's current (else latest) effort — a `summary` of what shipped, and any `impacts` beyond the edits (a wiki page, a work item, a commit, a finding). Without one, the summary is your last turn's final message; files and test runs are observed. Returns `{ effort, link_warnings }`."
    scope: efforts.write
    op: report
    invokers: { human: true, agent: true, lens: true }
  - name: effort.unverify_claim
    summary: "Take back a claim's verification (`claim:<id>`): it cites nothing again."
    scope: efforts.write
    op: unverify_claim
    invokers: { human: true, agent: false, lens: true }
  - name: effort.update
    summary: "Set an effort's own title, or clear it back to its default with `title: null`."
    scope: efforts.write
    op: update
    invokers: { human: true, agent: true, lens: true }
  - name: effort.verify_claim
    summary: "Verify a claim an agent made about its work (`claim:<id>`), citing what backs it (`reviewer` when you checked it yourself). A person's review."
    scope: efforts.write
    op: verify_claim
    invokers: { human: true, agent: false, lens: true }
  # effects.read
  - name: effect.backfill_plan
    summary: "How many events an `oxplow.effect.backfill` would have an effect react to: the matching ones it never reacted to, the log positions they span (pass `to_seq` to the backfill to run on just these), and how many one run reacts to (`batch`)."
    scope: effects.read
    op: backfill_plan
    invokers: { human: true, agent: true, lens: true }
  # effects.run
  - name: effect.backfill
    summary: "Have an effect react to the matching events it never reacted to — those logged before its approval, or while it waited to be approved again — oldest first, once each. The effect may call outside oxplow for every one of them. It runs as it is now; `oxplow.effect.backfill_plan` says how many events that is."
    scope: effects.run
    op: backfill
    invokers: { human: true, agent: false, lens: false }
    confirm: always
  - name: effect.retry
    summary: "Have an effect react again to an event its reaction to failed, as its next attempt. If the failed attempt was interrupted with a step outside oxplow under way, that step may already have run: retrying sends it again. It runs the effect as it is now, composing afresh from the event."
    scope: effects.run
    op: retry
    invokers: { human: true, agent: false, lens: false }
    confirm: always
  # extensions.enable
  - name: contribution.enable
    summary: "Enable a disabled extension provider, collector or effect on this machine again, clearing an automatic disable (a provider's process restarts, a system the bus doesn't own)."
    scope: extensions.enable
    op: enable
    invokers: { human: true, agent: false, lens: false }
    lifecycle: experimental
  # extensions.install
  - name: extension.install
    summary: "Install a published extension from a git repo (its root holds `extension.yaml`) into `oxplow/extensions/<name>/` of a stream's worktree, at the commit a person reviewed (`reviewed_sha`, from `review_extension`). Always a person's decision: an agent's run becomes a proposal. Refuses to overwrite — `oxplow.extension.update` does that."
    scope: extensions.install
    op: install
    invokers: { human: true, agent: true, lens: true }
    confirm: always
  - name: extension.update
    summary: "Update an installed extension to the reviewed commit of the git URL and ref it was installed from. Only for extensions installed with `oxplow.extension.install`; ones written in this repo are edited in place. Always a person's decision."
    scope: extensions.install
    op: update
    invokers: { human: true, agent: true, lens: true }
    confirm: always
  # files.write
  - name: snapshot.restore_file
    summary: "Restore a captured file (a `file_snapshot` id) into its stream's worktree, overwriting what's at its path now. A person confirms it."
    scope: files.write
    op: restore_file
    invokers: { human: true, agent: true, lens: true }
    confirm: destructive
  - name: file.save
    summary: "Write a file of a stream's worktree with the content saved (what the editor's Save writes); logs `file.saved`. Its content isn't kept in the record, its size is."
    scope: files.write
    op: save
    invokers: { human: true, agent: true, lens: true }
  # hints.write
  - name: hint.dismiss
    summary: "Dismiss a hint raised to the person (a `v_agent_nudge` row with audience `person`)."
    scope: hints.write
    op: dismiss
    invokers: { human: true, agent: false, lens: true }
  # knowledge.write
  - name: knowledge.add_comment
    summary: "Comment on a span of a page (its `target`), with a first message. `intent`: `note` (the agent leaves it alone) or `followup` (the agent should act on it). An agent comments on its own stream, in its own thread."
    scope: knowledge.write
    op: add_comment
    invokers: { human: true, agent: true, lens: true }
  - name: knowledge.add_note
    summary: "Add a note to a thread — an agent's own (a finding, why it paused, context for whoever picks it up). An empty body allocates one for a subagent to fill in with `oxplow.knowledge.update_note`. Returns the note and `link_warnings` for `[[…]]` links that don't resolve."
    scope: knowledge.write
    op: add_note
    invokers: { human: true, agent: true, lens: true }
  - name: knowledge.delete_comment
    summary: "Delete a comment and its messages (`comment:cmt12`). A person's, confirmed."
    scope: knowledge.write
    op: delete_comment
    invokers: { human: true, agent: false, lens: true }
    confirm: destructive
  - name: knowledge.delete_page
    summary: "Delete a knowledge (wiki) page and its links."
    scope: knowledge.write
    op: delete_page
    invokers: { human: true, agent: true, lens: true }
    confirm: destructive
  - name: knowledge.link
    summary: "Link a knowledge page to a page, file, directory, task or commit (added under its Related heading)."
    scope: knowledge.write
    op: link
    invokers: { human: true, agent: true, lens: true }
  - name: knowledge.relocate_comment
    summary: "Store where a comment's quote (`comment:cmt12`) sits in its page's content now (`selectors_json`), or that it is gone (`orphaned`). The renderer's, after it re-finds the quote."
    scope: knowledge.write
    op: relocate_comment
    invokers: { human: true, agent: false, lens: true }
  - name: knowledge.reply_comment
    summary: "Reply on a comment (`comment:cmt12`)."
    scope: knowledge.write
    op: reply_comment
    invokers: { human: true, agent: true, lens: true }
  - name: knowledge.resync
    summary: "Restate a knowledge page from its file on disk (the repair when a row and its file disagree); a missing file deletes the page."
    scope: knowledge.write
    op: resync
    invokers: { human: true, agent: true, lens: true }
  - name: knowledge.update_comment
    summary: "Change a comment (`comment:cmt12`): its `intent`, its `status` (`open` / `resolved`), or re-attach it to a new span (`quote` and `selectors_json` together)."
    scope: knowledge.write
    op: update_comment
    invokers: { human: true, agent: true, lens: true }
  - name: knowledge.update_note
    summary: "Replace a thread note's body (`thread_note:not12`) — a subagent filling in the note it was given. An agent updates only its own thread's notes."
    scope: knowledge.write
    op: update_note
    invokers: { human: true, agent: true, lens: true }
  - name: knowledge.write_page
    summary: "Write a knowledge (wiki) page: its body, every [[link]] resolving, and the files you re-read against it (verified_refs) or took out (removed_refs)."
    scope: knowledge.write
    op: write_page
    invokers: { human: true, agent: true, lens: true }
  # lenses.show
  - name: lens.show
    summary: "Show the person an answer in their thread: an existing lens with params, or a lens of your own (title, query, viz). It renders beside the conversation, where they can keep it."
    scope: lenses.show
    op: show
    invokers: { human: true, agent: true, lens: true }
  # lenses.write
  - name: lens.keep
    summary: "Keep an answer from a thread, or a lens spec of your own, as a private lens (a page the person can reopen, pin and share), recording where it came from. Kept in another stream's worktree, it shows in the app once that stream is merged (`live: false`)."
    scope: lenses.write
    op: keep
    invokers: { human: true, agent: true, lens: true }
  - name: lens.share
    summary: "Move a private lens into a shared extension (created shared when missing), refused unless it passes the shared checks; committing it is how the team gets it."
    scope: lenses.write
    op: share
    invokers: { human: true, agent: false, lens: false }
  # lsp.install
  - name: lsp.install_server
    summary: "Download and install a language server (a Mason package) and register its binary. A person's decision: an agent's run becomes a proposal."
    scope: lsp.install
    op: install_server
    invokers: { human: true, agent: true, lens: true }
    confirm: always
  - name: lsp.remove_server
    summary: "Uninstall a language server: delete its files, manifest entry and registrations. A person's decision."
    scope: lsp.install
    op: remove_server
    invokers: { human: true, agent: true, lens: true }
    confirm: always
  # metrics.read
  - name: metric.scaffold
    summary: "A starter for a new metric; writes nothing. Returns `scriptPath` + `script` (a Starlark gauge) and `projectYaml` (the measure, gauge and metric entries). Write the script, then add the entries with `oxplow.config.set` on `measures`, `gauges` and `metrics` (a gauge runs a program, so a person confirms it)."
    scope: metrics.read
    op: scaffold
    invokers: { human: true, agent: true, lens: true }
  # metrics.write
  - name: metric.enable
    summary: "Turn metrics on or off in this project (.oxplow/project.yaml `metrics:`); logged as config.changed, undo restores the previous list."
    scope: metrics.write
    op: enable
    invokers: { human: true, agent: true, lens: true }
  - name: metric.rebuild
    summary: "Rebuild code metrics over the whole tree: run every gauge that needs a baseline (every gauge with `force`) over the latest snapshot. Reports how many ran and which failed."
    scope: metrics.write
    op: rebuild
    invokers: { human: true, agent: true, lens: true }
  - name: metric.record
    summary: "Record an asserted number for a metric (provenance `asserted`): a value oxplow didn't compute, like a CI import. The metric needs a source measure and must not be a `count`; the fact is stamped to match the metric's own filter."
    scope: metrics.write
    op: record
    invokers: { human: true, agent: true, lens: true }
  # projects.write — the app shell's; a person's.
  - name: project.create
    summary: "Pick a folder and create a project in it, opened in a new window. A folder that already is a project is refused."
    scope: projects.write
    op: create
    invokers: { human: true, agent: false, lens: false }
    ui: { label: "New Project…", group: File, menu: { bar: file, group: 1_project, order: 10 }, when: "shellAvailable" }
  - name: project.open
    summary: "Open a folder that is a project (`path`, else pick one), in this window or a new one (`new_window`)."
    scope: projects.write
    op: open
    invokers: { human: true, agent: false, lens: false }
    ui: { label: "Open Project…", group: File, input: { new_window: false }, menu: { bar: file, group: 1_project, order: 20 }, when: "shellAvailable" }
  - name: project.open_in_new_window
    summary: "Pick a folder that is a project and open it in a new window."
    scope: projects.write
    op: open
    invokers: { human: true, agent: false, lens: false }
    ui: { label: "Open Project in New Window…", group: File, input: { new_window: true }, menu: { bar: file, group: 1_project, order: 30 }, when: "shellAvailable" }
  # providers.sync
  - name: provider.sync
    summary: "Read a provider instance's collectors now (all, or one), restating the items it tracks (runs the provider process, a system the bus doesn't own)."
    scope: providers.sync
    op: sync
    invokers: { human: true, agent: true, lens: true }
    lifecycle: experimental
  # streams.write
  - name: stream.rename
    summary: "Rename a stream (`stream:str1`)."
    scope: streams.write
    op: rename
    invokers: { human: true, agent: true, lens: true }
  - name: stream.set_prompt
    summary: "Set (or clear) the text appended to every agent prompt in a stream. A person's: it steers the agents."
    scope: streams.write
    op: set_prompt
    invokers: { human: true, agent: false, lens: true }
  # tabs.write — the window's; an agent's acts in its own thread's tabs.
  - name: tab.open
    summary: "Open a tab (`ref`: a page's ref — `file:src/a.rs`, `work_item:oxplow:tsk3`) in your thread's tabs, without bringing it to the front."
    scope: tabs.write
    op: open
    invokers: { human: true, agent: true, lens: true }
  - name: tab.focus
    summary: "Bring a tab (`ref`) to the front of your thread's tabs, opening it first if it isn't open."
    scope: tabs.write
    op: focus
    invokers: { human: true, agent: true, lens: true }
  - name: tab.close
    summary: "Close a tab (`ref`) in your thread's tabs."
    scope: tabs.write
    op: close
    invokers: { human: true, agent: true, lens: true }
  # test_runs.write
  - name: test.record_run
    summary: "Record a test run with pass/fail counts oxplow couldn't read from its output, marked `asserted`. oxplow records runs it sees in shell commands itself; this is for runs it couldn't parse. The run is the thread's open effort's. Returns `{ recorded, observationId }`."
    scope: test_runs.write
    op: record_run
    invokers: { human: true, agent: true, lens: true }
  # threads.write
  - name: thread.close
    summary: "Close a thread (`thread:thr12`) — history, reopenable. Its open effort and its agent sessions close, and their processes stop. An agent closes only its own thread."
    scope: threads.write
    op: close
    invokers: { human: true, agent: true, lens: true }
  - name: thread.create
    summary: "Start a thread on a stream (`stream:str1`) — or fork one (`from: thread:thr3`). It has no agent session yet (`oxplow.agent_session.open`). It becomes the stream's writer when it has none, else joins the queue."
    scope: threads.write
    op: create
    invokers: { human: true, agent: true, lens: true }
    ui: { label: "New Thread…", group: Tasks, form: new-thread, when: "streamShown" }
  - name: thread.demote
    summary: "Move a stream's writer back into the queue, leaving the stream with no writer."
    scope: threads.write
    op: demote
