    op: write_page
    invokers: { human: true, agent: true, lens: true }
    example: {"slug": "auth-flow", "title": "Auth flow", "body": "# Auth flow\n\nThe callback validates `next` before redirecting. See [[src/auth.rs]].", "verified_refs": ["src/auth.rs"]}
  # lenses.show
  - name: lens.show
    summary: "Show the person an answer in their thread: an existing lens with params, or a lens of your own (title, query, viz). It renders beside the conversation, where they can keep it."
    scope: lenses.show
    op: show
    invokers: { human: true, agent: true, lens: true }
    example: {"spec": {"title": "Open tasks", "query": "SELECT ref, title, state FROM v_work_item WHERE state = 'todo' ORDER BY rank", "viz": "table"}}
  # lenses.write
  - name: lens.keep
    summary: "Keep an answer from a thread, or a lens spec of your own, as a private lens (a page the person can reopen, pin and share), recording where it came from. Kept in another stream's worktree, it shows in the app once that stream is merged (`live: false`)."
    scope: lenses.write
    op: keep
    invokers: { human: true, agent: true, lens: true }
    example: {"spec": {"title": "Open tasks", "query": "SELECT ref, title, state FROM v_work_item WHERE state = 'todo' ORDER BY rank", "viz": "table"}, "extension": "my-lenses"}
  - name: lens.share
    summary: "Move a private lens into a shared extension (created shared when missing), refused unless it passes the shared checks; committing it is how the team gets it."
    scope: lenses.write
    op: share
    invokers: { human: true, agent: false, lens: false }
  # lsp.install
  - name: lsp.install_server
    summary: "Download and install a language server (a Mason package) and register its binary. A person's decision: an agent's run becomes a proposal."
    scope: lsp.install
    op: install_server
    invokers: { human: true, agent: true, lens: true }
    confirm: always
    example: {"package": "rust-analyzer"}
  - name: lsp.remove_server
    summary: "Uninstall a language server: delete its files, manifest entry and registrations. A person's decision."
    scope: lsp.install
    op: remove_server
    invokers: { human: true, agent: true, lens: true }
    confirm: always
    example: {"package": "rust-analyzer"}
  # metrics.read
  - name: metric.scaffold
    summary: "A starter for a new metric, as a private extension; writes nothing. Returns `name`, `dir` (`oxplow/extensions/<name>`) and `files`, each with its project-relative path: the extension.yaml (a measure, a Starlark fact collector, the metric), the collector script, a lens and an example with its fixture. Write them with your own tools, then check it (`validate_extension`); its collector runs only once a person approves it. `oxplow.metric.enable` turns the metric on or off in .oxplow/project.yaml."
    scope: metrics.read
    op: scaffold
    invokers: { human: true, agent: true, lens: true }
    example: {"name": "complex-fns", "language": "rust", "glob": "crates/**/*.rs"}
  # metrics.write
  - name: metric.enable
    summary: "Turn metrics on or off in this project (.oxplow/project.yaml `metrics:`); logged as config.changed, undo restores the previous list."
    scope: metrics.write
    op: enable
    invokers: { human: true, agent: true, lens: true }
    example: {"keys": ["complex_fns.count"], "enabled": true}
  - name: metric.rebuild
    summary: "Rebuild code metrics over the whole tree: run every gauge that needs a baseline (every gauge with `force`) over the latest snapshot. Reports how many ran and which failed."
    scope: metrics.write
    op: rebuild
    invokers: { human: true, agent: true, lens: true }
    example: {"force": true}
  - name: metric.record
    summary: "Record an asserted number for a metric (provenance `asserted`): a value oxplow didn't compute, like a CI import. The metric needs a source measure and must not be a `count`; the fact is stamped to match the metric's own filter."
    scope: metrics.write
    op: record
    invokers: { human: true, agent: true, lens: true }
    example: {"key": "complex_fns.count", "value": 12, "subject": "file:src/auth.rs"}
  # projects.write — the app shell's; a person's.
  - name: project.create
    summary: "Pick a folder and create a project in it, opened in a new window. A folder that already is a project is refused."
    scope: projects.write
    op: create
    invokers: { human: true, agent: false, lens: false }
    ui: { label: "New Project…", group: File, menu: { bar: file, group: 1_project, order: 10 }, when: "shellAvailable" }
  - name: project.open
    summary: "Open a folder that is a project (`path`, else pick one), in this window or a new one (`new_window`)."
    scope: projects.write
    op: open
    invokers: { human: true, agent: false, lens: false }
    ui: { label: "Open Project…", group: File, input: { new_window: false }, menu: { bar: file, group: 1_project, order: 20 }, when: "shellAvailable" }
  - name: project.open_in_new_window
    summary: "Pick a folder that is a project and open it in a new window."
    scope: projects.write
    op: open
    invokers: { human: true, agent: false, lens: false }
    ui: { label: "Open Project in New Window…", group: File, input: { new_window: true }, menu: { bar: file, group: 1_project, order: 30 }, when: "shellAvailable" }
  # providers.sync
  - name: provider.sync
    summary: "Read a provider instance's collectors now (all, or one), restating the items it tracks (runs the provider process, a system the bus doesn't own)."
    scope: providers.sync
    op: sync
    invokers: { human: true, agent: true, lens: true }
    lifecycle: experimental
    example: {"instance": "issues/issues"}
  # streams.write
  - name: stream.rename
    summary: "Rename a stream (`stream:str1`)."
    scope: streams.write
    op: rename
    invokers: { human: true, agent: true, lens: true }
    example: {"stream": "stream:str1", "title": "Login fix"}
  - name: stream.set_prompt
    summary: "Set (or clear) the text appended to every agent prompt in a stream. A person's: it steers the agents."
    scope: streams.write
    op: set_prompt
    invokers: { human: true, agent: false, lens: true }
  # tabs.write — the window's; an agent's acts in its own thread's tabs.
  - name: tab.open
    summary: "Open a tab (`ref`: a page's ref — `file:src/a.rs`, `work_item:oxplow:tsk3`) in your thread's tabs, without bringing it to the front."
    scope: tabs.write
    op: open
    invokers: { human: true, agent: true, lens: true }
    example: {"ref": "file:src/main.rs"}
  - name: tab.focus
    summary: "Bring a tab (`ref`) to the front of your thread's tabs, opening it first if it isn't open."
    scope: tabs.write
    op: focus
    invokers: { human: true, agent: true, lens: true }
    example: {"ref": "file:src/main.rs"}
  - name: tab.close
    summary: "Close a tab (`ref`) in your thread's tabs."
    scope: tabs.write
    op: close
    invokers: { human: true, agent: true, lens: true }
    example: {"ref": "file:src/main.rs"}
  # test_runs.write
  - name: test.record_run
    summary: "Record a test run with pass/fail counts oxplow couldn't read from its output, marked `asserted`. oxplow records runs it sees in shell commands itself; this is for runs it couldn't parse. The run is the thread's open effort's. Returns `{ recorded, observationId }`."
    scope: test_runs.write
    op: record_run
    invokers: { human: true, agent: true, lens: true }
    example: {"command": "cargo nextest run -p oxplow-app", "passed": 120, "failed": 0, "total": 120, "duration_ms": 41200}
  # threads.write
  - name: thread.close
    summary: "Close a thread (`thread:thr12`) — history, reopenable. Its open effort and its agent sessions close, and their processes stop. An agent closes only its own thread."
    scope: threads.write
    op: close
    invokers: { human: true, agent: true, lens: true }
    example: {"thread": "thread:thr12"}
  - name: thread.create
    summary: "Start a thread on a stream (`stream:str1`) — or fork one (`from: thread:thr3`). It has no agent session yet (`oxplow.agent_session.open`). It becomes the stream's writer when it has none, else joins the queue."
    scope: threads.write
    op: create
    invokers: { human: true, agent: true, lens: true }
    ui: { label: "New Thread…", group: Tasks, form: new-thread, when: "streamShown" }
    example: {"stream": "stream:str1", "title": "Fix the login redirect loop"}
  - name: thread.demote
    summary: "Move a stream's writer back into the queue, leaving the stream with no writer."
    scope: threads.write
    op: demote
    invokers: { human: true, agent: true, lens: true }
    example: {"thread": "thread:thr12"}
  - name: thread.promote
    summary: "Make a thread its stream's writer (the one thread whose agent may change the worktree); the current writer joins the queue. Undo hands the worktree back."
    scope: threads.write
    op: promote
    invokers: { human: true, agent: true, lens: true }
    example: {"thread": "thread:thr12"}
  - name: thread.rename
    summary: "Rename a thread (`thread:thr12`)."
    scope: threads.write
    op: rename
    invokers: { human: true, agent: true, lens: true }
    example: {"thread": "thread:thr12", "title": "Fix the login redirect loop"}
  - name: thread.reopen
    summary: "Reopen a closed thread (`thread:thr12`); it joins its stream's queue. An agent reopens only its own thread."
    scope: threads.write
    op: reopen
    invokers: { human: true, agent: true, lens: true }
    example: {"thread": "thread:thr12"}
  - name: thread.reorder
    summary: "Reorder a stream's threads (`order`: thread refs in their new order)."
    scope: threads.write
    op: reorder
    invokers: { human: true, agent: false, lens: true }
  - name: thread.set_prompt
    summary: "Set (or clear) the text appended to a thread's agent prompt. A person's: it steers the agent."
    scope: threads.write
    op: set_prompt
    invokers: { human: true, agent: false, lens: true }
  # vcs.remote
  - name: vcs.fetch
    summary: "Fetch from a remote."
    scope: vcs.remote
    op: fetch
    invokers: { human: true, agent: true, lens: false }
    example: {"stream": "stream:str1", "remote": "origin"}
  - name: vcs.pull
    summary: "Pull into the stream's branch (its upstream, or a named remote branch)."
    scope: vcs.remote
    op: pull
    invokers: { human: true, agent: true, lens: false }
    ui: {"label": "Pull Changes", "group": "Git", "input": {"stream": "{{stream}}"}, "background": true, "when": "vcsEnabled"}
    example: {"stream": "stream:str1"}
  - name: vcs.push
    summary: "Push the stream's branch (to its upstream, or a named remote branch)."
    scope: vcs.remote
    op: push
    invokers: { human: true, agent: true, lens: false }
    ui: {"label": "Push Changes", "group": "Git", "input": {"stream": "{{stream}}"}, "background": true, "when": "vcsEnabled"}
    example: {"stream": "stream:str1"}
  # vcs.write
  - name: git.cherry_pick
    summary: "Apply one commit onto the stream's branch."
    scope: vcs.write
    op: cherry_pick
    invokers: { human: true, agent: true, lens: false }
    example: {"stream": "stream:str1", "rev": "3f9c2a1"}
  - name: git.ignore
    summary: "Add a pattern to the workspace's `.gitignore`."
    scope: vcs.write
    op: ignore
    invokers: { human: true, agent: true, lens: false }
    example: {"stream": "stream:str1", "entry": "target/"}
  - name: git.rebase
    summary: "Rebase the stream's branch onto a revision (rewrites its commits)."
    scope: vcs.write
    op: rebase
    invokers: { human: true, agent: true, lens: false }
    confirm: destructive
    example: {"stream": "stream:str1", "rev": "main"}
  - name: git.revert
    summary: "Commit the inverse of one commit onto the stream's branch."
    scope: vcs.write
    op: revert
    invokers: { human: true, agent: true, lens: false }
    confirm: destructive
    example: {"stream": "stream:str1", "rev": "3f9c2a1"}
  - name: vcs.checkout_branch
    summary: "Switch the stream's workspace to a branch (creating it with `create`)."
    scope: vcs.write
    op: checkout_branch
    invokers: { human: true, agent: true, lens: false }
    example: {"stream": "stream:str1", "name": "login-fix", "create": true}
  - name: vcs.commit
    summary: "Commit the stream's changes (untracked files too, unless `include_untracked: false`); returns the new revision."
    scope: vcs.write
    op: commit
    invokers: { human: true, agent: true, lens: false }
    ui: { label: "Commit Changes…", group: Git, form: commit, when: "streamShown && vcsEnabled" }
    example: {"stream": "stream:str1", "message": "fix: stop the login redirect loop"}
  - name: vcs.delete_branch
    summary: "Delete a branch (`force` even when unmerged)."
    scope: vcs.write
    op: delete_branch
    invokers: { human: true, agent: true, lens: false }
    confirm: destructive
    example: {"stream": "stream:str1", "name": "login-fix"}
  - name: vcs.discard
    summary: "Throw away the workspace's changes to paths, back to the head's version."
    scope: vcs.write
    op: discard
    invokers: { human: true, agent: true, lens: false }
    confirm: destructive
    example: {"stream": "stream:str1", "paths": ["src/auth.rs"]}
  - name: vcs.merge
    summary: "Merge a revision into the stream's branch; the result lists any conflicts left after oxplow's smart merge."
    scope: vcs.write
    op: merge
    invokers: { human: true, agent: true, lens: false }
    confirm: destructive
    example: {"stream": "stream:str1", "rev": "main"}
  - name: vcs.rename_branch
    summary: "Rename a branch."
    scope: vcs.write
    op: rename_branch
    invokers: { human: true, agent: true, lens: false }
    example: {"stream": "stream:str1", "from": "login-fix", "to": "fix-login-loop"}
  - name: vcs.resolve_conflict
    summary: "Settle one conflicted path: take `ours`, `theirs`, or `auto` (smart merge)."
    scope: vcs.write
    op: resolve_conflict
    invokers: { human: true, agent: true, lens: false }
    example: {"stream": "stream:str1", "path": "src/auth.rs", "choice": "auto"}
  - name: vcs.stage
    summary: "Stage paths for the next commit."
    scope: vcs.write
    op: stage
    invokers: { human: true, agent: true, lens: false }
    example: {"stream": "stream:str1", "paths": ["src/auth.rs"]}
  # window.show — the window's; a person's.
  - name: window.find
    summary: "Show the find bar in the file the window shows."
    scope: window.show
    op: find
    invokers: { human: true, agent: false, lens: false }
    ui: { label: Find, group: Edit, shortcut: "Ctrl/Cmd+F", while_typing: true, menu: { bar: edit, group: 1_find, order: 10 }, when: "fileShown" }
  - name: window.quick_open
    summary: "Show the search box (files, pages, commands)."
    scope: window.show
    op: quick_open
    invokers: { human: true, agent: false, lens: false }
    ui: { label: "Quick Open…", group: File, shortcut: "Ctrl/Cmd+P", while_typing: true, menu: { bar: file, group: 3_go, order: 10 }, when: "streamShown" }
  # work_items.write
  - name: work_item.comment
    summary: "Comment on a work item (oxplow: a note shown with the task)."
    scope: work_items.write
    op: comment
    invokers: { human: true, agent: true, lens: true }
    needs: [work_items.comments]
    example: {"ref": "work_item:oxplow:tsk12", "body": "Found the cause: the redirect keeps the stale `next` param."}
  - name: work_item.create
    summary: "File a work item on the active tracker (the one the person chose), optionally straight into a state. `thread` is the thread it's filed on: absent, an agent's own (a person's lands on the backlog). `native` is the tracker's own fields as its create declares them (oxplow: { priority }). On oxplow the result carries `link_warnings`: the `[[…]]` links in the body that don't resolve."
    scope: work_items.write
    op: create
    invokers: { human: true, agent: true, lens: true }
    ui: {"label": "New Task…", "group": "Tasks", "keywords": ["work item"], "form": "page:new-task", "shortcut": "Ctrl/Cmd+Shift+N"}
    example: {"title": "Fix the login redirect loop", "body": "Signing in from /settings bounces back to /login.", "state": "todo"}
  - name: work_item.delete
    summary: "Delete a work item."
    scope: work_items.write
    op: delete
    invokers: { human: true, agent: true, lens: true }
    confirm: destructive
    needs: [work_items.delete]
    example: {"ref": "work_item:oxplow:tsk12"}
  - name: work_item.link
    summary: "Link a work item to another of the same provider, or to any ref it is `about` (`collector:triage/hot`, `effort:eff12`, `file:src/a.rs`), by a link type the provider names (oxplow: blocks, relates_to, discovered_from, duplicates, supersedes, replies_to, about). Only an item target must exist; a ref may name something since gone. Undone by work_item.unlink."
    scope: work_items.write
    op: link
    invokers: { human: true, agent: true, lens: true }
    needs: [work_items.links]
    example: {"ref": "work_item:oxplow:tsk12", "target": "work_item:oxplow:tsk9", "link_type": "blocks"}
  - name: work_item.unlink
    summary: "Remove a work item's link (`ref`, `target`, `link_type`, as it was linked). Undone by work_item.link."
    scope: work_items.write
    op: unlink
    invokers: { human: true, agent: true, lens: true }
    needs: [work_items.links]
    example: {"ref": "work_item:oxplow:tsk12", "target": "work_item:oxplow:tsk9", "link_type": "blocks"}
  - name: work_item.move
    summary: "Move a work item to a thread's list or the backlog (at the end, or before/after an item there)."
    scope: work_items.write
    op: move
    invokers: { human: true, agent: true, lens: true }
    needs: [work_items.lists]
    example: {"ref": "work_item:oxplow:tsk12", "to": {"thread": "thr3"}}
  - name: work_item.reorder
    summary: "Put a work item before or after another on its list (neither: at its end)."
    scope: work_items.write
    op: reorder
    invokers: { human: true, agent: true, lens: true }
    needs: [work_items.ordering]
    example: {"ref": "work_item:oxplow:tsk12", "before": "work_item:oxplow:tsk9"}
  - name: work_item.transition
    summary: "Move a work item to a canonical state (todo, in_progress, blocked, done, canceled), optionally naming the provider's own state."
    scope: work_items.write
    op: transition
    invokers: { human: true, agent: true, lens: true }
    example: {"ref": "work_item:oxplow:tsk12", "to": "in_progress"}
  - name: work_item.update
    summary: "Edit a work item's title, body, parent or native fields and, optionally, move it to a state — all in one run (see oxplow.work_item.transition for the state's effects). On oxplow the result carries `link_warnings` for the body's `[[…]]` links."
    scope: work_items.write
    op: update
    invokers: { human: true, agent: true, lens: true }
    example: {"ref": "work_item:oxplow:tsk12", "title": "Fix the login redirect loop", "body": "Reproduces only with a stale session cookie."}
  # worktrees.write
  - name: stream.adopt_worktree
    summary: "Make an existing worktree of this repository a stream. A person's."
    scope: worktrees.write
    op: adopt_worktree
    invokers: { human: true, agent: false, lens: false }
  - name: stream.archive
    summary: "Archive a stream and its threads (`delete_worktree` also removes its working copy from disk). Refused while an agent is running in it. A person's, confirmed."
    scope: worktrees.write
    op: archive
    invokers: { human: true, agent: false, lens: false }
    confirm: destructive
  - name: stream.create_worktree
    summary: "Create a stream on a new worktree beside the project (`git worktree add`), on a new branch forked from `branch_source`."
    scope: worktrees.write
    op: create_worktree
    invokers: { human: true, agent: true, lens: false }
    ui: {"label": "New Stream…", "group": "Tasks", "keywords": ["worktree", "branch"], "form": "page:new-stream"}
    example: {"slug": "login-fix", "title": "Login fix", "branch": "login-fix", "branch_source": "main"}

# What oxplow records itself. The measures and dimensions its producers
# (tokens, efforts, tests, coverage, analysis) and the code collectors write
# facts on, and the metrics over them; the producers' Rust only records the facts.
measures:
  - {"key": "oxplow.complexity", "title": "Cyclomatic complexity", "unit": "count", "subjectKind": "symbol", "temporalSemantics": "semi-additive", "captureScope": "per-path"}
  - {"key": "oxplow.fn_length", "title": "Function length", "unit": "lines", "subjectKind": "symbol", "temporalSemantics": "semi-additive", "captureScope": "per-path"}
  - {"key": "oxplow.parameter_count", "title": "Parameter count", "unit": "count", "subjectKind": "symbol", "temporalSemantics": "semi-additive", "captureScope": "per-path"}
  - {"key": "oxplow.todo", "title": "TODO markers", "unit": "count", "subjectKind": "file", "temporalSemantics": "semi-additive", "captureScope": "per-path"}
  - {"key": "oxplow.coverage", "title": "Line coverage", "unit": "%", "subjectKind": "file", "temporalSemantics": "semi-additive", "captureScope": "complete"}
  - {"key": "oxplow.test_case", "title": "Test case", "unit": "count", "subjectKind": "test", "temporalSemantics": "semi-additive", "captureScope": "per-subject"}
  - {"key": "oxplow.lint_hit", "title": "Static-analysis hit", "unit": "count", "subjectKind": "file", "temporalSemantics": "semi-additive", "captureScope": "complete"}
  - {"key": "oxplow.duplicate_lines", "title": "Duplicated lines", "unit": "lines", "subjectKind": "symbol", "temporalSemantics": "semi-additive", "captureScope": "complete"}
  - {"key": "oxplow.tokens", "title": "Agent tokens", "unit": "count", "subjectKind": "model", "temporalSemantics": "additive", "captureScope": "complete"}
  - {"key": "oxplow.cycle_time", "title": "Effort cycle time", "unit": "ms", "subjectKind": "effort", "temporalSemantics": "non-additive", "captureScope": "complete"}
  - {"key": "oxplow.ast_hit", "title": "AST idiom hits", "unit": "count", "subjectKind": "file", "temporalSemantics": "semi-additive", "captureScope": "per-path"}
  - {"key": "oxplow.turn", "title": "Agent turns", "unit": "count", "subjectKind": "model", "temporalSemantics": "additive", "captureScope": "complete"}
  - {"key": "oxplow.work_item_effort", "title": "Efforts per work item", "unit": "count", "subjectKind": "work_item", "temporalSemantics": "non-additive", "captureScope": "complete"}
  - {"key": "oxplow.nudge", "title": "Nudges fired", "unit": "count", "temporalSemantics": "additive", "captureScope": "complete"}
  - {"key": "oxplow.effort_test_outcome", "title": "Effort test outcome", "unit": "count", "subjectKind": "effort", "temporalSemantics": "non-additive", "captureScope": "complete"}
  - {"key": "oxplow.test_duration", "title": "Test duration", "unit": "ms", "subjectKind": "test", "temporalSemantics": "semi-additive", "captureScope": "per-subject"}
  - {"key": "oxplow.cache_tokens", "title": "Prompt-cache tokens", "unit": "count", "subjectKind": "model", "temporalSemantics": "additive", "captureScope": "complete"}
  - {"key": "oxplow.cache_usage", "title": "Prompt-cache hit ratio", "unit": "%", "subjectKind": "model", "temporalSemantics": "non-additive", "captureScope": "complete"}
  - {"key": "oxplow.effort_tokens", "title": "Effort token spend", "unit": "count", "subjectKind": "effort", "temporalSemantics": "non-additive", "captureScope": "complete"}
  - {"key": "oxplow.effort_steering", "title": "Effort steering events", "unit": "count", "subjectKind": "effort", "temporalSemantics": "non-additive", "captureScope": "complete"}
  - {"key": "oxplow.effort_time_to_green", "title": "Effort time to green", "unit": "ms", "subjectKind": "effort", "temporalSemantics": "non-additive", "captureScope": "complete"}
  - {"key": "oxplow.token_waste", "title": "Reverted-effort token waste", "unit": "count", "subjectKind": "effort", "temporalSemantics": "non-additive", "captureScope": "complete"}
  - {"key": "oxplow.coverage.branch", "title": "Branch coverage", "unit": "%", "subjectKind": "file", "temporalSemantics": "semi-additive", "captureScope": "complete"}
  - {"key": "oxplow.coverage.function", "title": "Function coverage", "unit": "%", "subjectKind": "file", "temporalSemantics": "semi-additive", "captureScope": "complete"}
  - {"key": "oxplow.doc_coverage", "title": "Doc coverage", "unit": "%", "subjectKind": "file", "temporalSemantics": "semi-additive", "captureScope": "per-path"}
dimensions:
  - {"key": "oxplow.language", "label": "Language", "valueType": "categorical"}
