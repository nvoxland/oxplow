  # efforts.write
  - name: effort.close
    summary: "Close an effort (by id, or a thread's open one), optionally as of a past point and with a summary."
    scope: efforts.write
    op: close
    invokers: { human: true, agent: true, lens: true }
    example: {"effort": "effort:eff12", "summary": "Fixed the login redirect loop."}
  - name: effort.confirm_decision
    summary: "Confirm a decision oxplow inferred from an effort (`decision:<id>`): it was made, as stated. A person's review."
    scope: efforts.write
    op: confirm_decision
    invokers: { human: true, agent: false, lens: true }
  - name: effort.dismiss_claim
    summary: "Dismiss a claim oxplow read in an effort's answers (`claim:<id>`): the agent didn't claim it, or didn't mean it. It stays dismissed when the effort is read again. A person's review."
    scope: efforts.write
    op: dismiss_claim
    invokers: { human: true, agent: false, lens: true }
  - name: effort.dismiss_decision
    summary: "Dismiss a decision oxplow inferred from an effort (`decision:<id>`): it wasn't made, or not like that. A person's review."
    scope: efforts.write
    op: dismiss_decision
    invokers: { human: true, agent: false, lens: true }
  - name: effort.link
    summary: "Link an effort (by id, or a thread's open one) to a work item, or unlink it with `work_item: null`."
    scope: efforts.write
    op: link
    invokers: { human: true, agent: true, lens: true }
    example: {"effort": "effort:eff12", "work_item": "work_item:oxplow:tsk42"}
  - name: effort.open
    summary: "Open an effort — a span of a thread's work — on a thread (yours by default), optionally linked to a work item. The thread's current effort closes first. oxplow opens efforts itself; this is for policies, people and corrections."
    scope: efforts.write
    op: open
    invokers: { human: true, agent: true, lens: true }
    example: {"thread": "thread:thr3", "work_item": "work_item:oxplow:tsk42"}
  - name: effort.record_decision
    summary: "Record a DECISION you made while working: a fork where you picked one approach over others without asking (where to put something, which library, what to leave out, how to read an ambiguous ask). People review these first, so record the non-obvious ones as you make them — not trivia. Attaches to `work_item`'s open effort, else your thread's. Returns `{ id, effort }`."
    scope: efforts.write
    op: record_decision
    invokers: { human: true, agent: true, lens: true }
    example: {"question": "Where should the redirect target be validated?", "choice": "In the callback handler", "alternatives": ["In the login page", "In a middleware"], "why": "It is the only place that sees both the session and the requested path.", "confidence": "medium"}
  - name: effort.reopen_claim
    summary: "Take back a claim's dismissal (`claim:<id>`): it's unreviewed again."
    scope: efforts.write
    op: reopen_claim
    invokers: { human: true, agent: false, lens: true }
  - name: effort.reopen_decision
    summary: "Take back a review of an inferred decision (`decision:<id>`): it is unconfirmed again."
    scope: efforts.write
    op: reopen_decision
    invokers: { human: true, agent: false, lens: true }
  - name: effort.replace_inferred_decisions
    summary: "Replace an effort's inferred decisions (`effort:eff<id>`) with a model's proposals — at most 8 forks the agent seems to have resolved without recording them. Its recorded and reviewed decisions stay. They wait for a person's review and are never shown to the agent. Returns `{ effort, count }`."
    scope: efforts.write
    op: replace_inferred_decisions
    invokers: { human: true, agent: true, lens: true }
    example: {"effort": "effort:eff12", "decisions": [{"question": "Which CSV library?", "choice": "csv crate", "alternatives": ["hand-rolled writer"], "why": "Quoting rules are easy to get wrong.", "confidence": "medium"}]}
  - name: effort.replace_inferred_claims
    summary: "Replace an effort's claims (`effort:eff<id>`) with the ones a model read in its answers — at most 8 statements like \"tests pass\" or \"no behavior change\", each with its kind and what it cites. Claims a reviewer dismissed or verified stay. Returns `{ effort, count }`."
    scope: efforts.write
    op: replace_inferred_claims
    invokers: { human: true, agent: true, lens: true }
    example: {"effort": "effort:eff12", "claims": [{"statement": "The parser tests pass.", "kind": "tests_pass", "evidence_ref": "run:42"}]}
  - name: effort.report
    summary: "Optional: describe the thread's current (else latest) effort — a `summary` of what shipped, any `impacts` beyond the edits (a wiki page, a work item, a commit, a finding), and the `claims` you can back (each `{ statement, kind, evidence_ref? }`; they replace the ones an earlier report stated that nobody reviewed). Without one, the summary is your last turn's final message; files and test runs are observed. Returns `{ effort, link_warnings }`."
    scope: efforts.write
    op: report
    invokers: { human: true, agent: true, lens: true }
    example: {"summary": "Fixed the login redirect loop: the callback kept the stale `next` parameter.", "impacts": [{"kind": "file", "id": "src/auth.rs", "action": "updated"}, {"kind": "work_item", "id": "work_item:oxplow:tsk42", "action": "completed"}], "claims": [{"statement": "the auth tests pass", "kind": "tests_pass", "evidence_ref": "run:12"}]}
  - name: effort.unverify_claim
    summary: "Take back a claim's verification (`claim:<id>`): it's unreviewed again, citing `evidence` (what it cited before) or nothing."
    scope: efforts.write
    op: unverify_claim
    invokers: { human: true, agent: false, lens: true }
  - name: effort.update
    summary: "Set an effort's own title, or clear it back to its default with `title: null`."
    scope: efforts.write
    op: update
    invokers: { human: true, agent: true, lens: true }
    example: {"effort": "effort:eff12", "title": "Fix the login redirect loop"}
  - name: effort.verify_claim
    summary: "Verify a claim oxplow read in an agent's answers (`claim:<id>`), citing what backs it (what it already cites, else `reviewer` when you checked it yourself). A person's review."
    scope: efforts.write
    op: verify_claim
    invokers: { human: true, agent: false, lens: true }
  # effects.read
  - name: effect.backfill_plan
    summary: "How many events an `oxplow.effect.backfill` would have an effect react to: the matching ones it never reacted to, the log positions they span (pass `to_seq` to the backfill to run on just these), and how many one run reacts to (`batch`)."
    scope: effects.read
    op: backfill_plan
    invokers: { human: true, agent: true, lens: true }
    example: {"effect": "oxplow-bundled/infer-reasoning", "since": "2026-10-01T00:00:00Z"}
  # effects.run
  - name: effect.backfill
    summary: "Have an effect react to the matching events it never reacted to — those logged before its approval, or while it waited to be approved again — oldest first, once each. The effect may call outside oxplow for every one of them. It runs as it is now; `oxplow.effect.backfill_plan` says how many events that is."
    scope: effects.run
    op: backfill
    invokers: { human: true, agent: false, lens: false }
    confirm: always
  - name: effect.retry
    summary: "Have an effect react again to an event its reaction to failed, as its next attempt. If the failed attempt was interrupted with a step outside oxplow under way, that step may already have run: retrying sends it again. It runs the effect as it is now, composing afresh from the event."
    scope: effects.run
    op: retry
    invokers: { human: true, agent: false, lens: false }
    confirm: always
