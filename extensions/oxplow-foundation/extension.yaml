    icon: bell
  - name: claim
    description: "A statement an agent made about its work, which can be checked."
    label: Claim
    params: { id: { required: true, pattern: '^[0-9]+$' } }
    resolve: claim
    title: statement
    icon: circle-dot
  - name: decision
    description: "A choice that an agent or a person made, with its reason."
    label: Decision
    params: { id: { required: true, pattern: '^[0-9]+$' } }
    resolve: decision
    title: question
    searchable: search_decision
    icon: circle-dot
  - name: job_run
    description: "One run of a durable job."
    label: Job run
    params: { id: { required: true, pattern: '^[0-9a-f-]{36}$' } }
    resolve: job_run
