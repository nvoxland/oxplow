    icon: inbox
  - name: terminal
    description: "A terminal running in a stream's checkout."
    label: Terminal
    params: { id: { required: true, pattern: '^trm[0-9]+$' } }
    resolve: terminal
    title: title
    icon: terminal
  - name: subagent
    description: "A helper agent that an agent session started."
    label: Subagent
    params: { session: { required: true, pattern: '^ses[0-9]+$' }, agent: { required: true, pattern: '^[!-.0-~]+$' } }
