  - name: dataset
    description: "A table or view of data in oxplow's query layer."
    label: Dataset
    params: { dataset: { required: true, pattern: '^[a-z][a-z0-9-]*/[a-z][a-z0-9_.-]*$' } }
    icon: database
  - name: measure
    description: "A quantity that facts record, such as lines of code."
    label: Measure
    params: { measure: { required: true } }
    icon: bar-chart-3
  - name: metric
    description: "A number that oxplow tracks over time."
    label: Metric
    params: { metric: { required: true } }
    icon: bar-chart-3
  - name: dimension
    description: "An axis that metrics can be split by."
    label: Dimension
    params: { dimension: { required: true } }
    icon: columns-3
  - name: collector
    description: "A program that gathers data into oxplow's datasets."
    label: Collector
    params: { collector: { required: true, pattern: '^[a-z][a-z0-9-]*/[a-z][a-z0-9_.-]*$' } }
    resolve: collector_run
    title: id
    icon: database
  - name: event_type
    description: "A kind of event that oxplow records."
    label: Event type
    params: { event_type: { required: true } }
    icon: zap
  - name: resource
    description: "A kind of thing that a URI can name."
    label: Resource
    params: { resource: { required: true, pattern: '^[a-z][a-z0-9-]*/[a-z][a-z0-9_]*$' } }
    icon: link
  - name: command
    description: "An action that can be run on the command bus."
    label: Command
    params: { command: { required: true } }
    icon: zap
  - name: job
    description: "A durable task that can call a language model."
    label: Job
    params: { job: { required: true, pattern: '^[a-z][a-z0-9-]*/[a-z][a-z0-9_.-]*$' } }
    icon: server
  - name: ai_profile
    description: "A saved way of calling a language model."
    label: AI profile
    params: { ai_profile: { required: true, pattern: '^[a-z][a-z0-9-]*/[a-z][a-z0-9_.-]*$' } }
    icon: server
  - name: effect
    description: "A reaction that runs when an event happens."
    label: Effect
    params: { effect: { required: true, pattern: '^[a-z][a-z0-9-]*/[a-z][a-z0-9_.-]*$' } }
    icon: zap
  - name: advisory
    description: "A short note that an extension adds to an agent's context."
    label: Advisory
    params: { advisory: { required: true, pattern: '^[a-z][a-z0-9-]*/[a-z][a-z0-9_.-]*$' } }
    icon: bell
  - name: skill
    description: "Instructions that oxplow gives a coding agent."
    label: Skill
    params: { skill: { required: true, pattern: '^[a-z][a-z0-9-]*/[a-z][a-z0-9_.-]*$' } }
    icon: book-open
  - name: implementation
    description: "One way to provide a capability, such as a work list or an agent."
    label: Implementation
    params: { implementation: { required: true, pattern: '^[a-z][a-z0-9-]*/[a-z][a-z0-9_.-]*$' } }
    icon: box
  - name: provider
    description: "A program that connects oxplow to an outside service."
    label: Provider
    params: { provider: { required: true, pattern: '^[a-z][a-z0-9-]*/[a-z][a-z0-9_.-]*$' } }
    icon: server
  - name: page
    description: "A page that an extension draws."
    label: Page
    params: { page: { required: true } }
    additional: true
    searchable: search_page
    icon: file-text
  - name: view
    description: "A page made to be looked at, which a person can save."
    label: View
    params: { id: { required: true } }
    additional: true
    icon: sparkles
  - name: panel
    description: "A panel that an extension adds to the side of the window."
    label: Panel
    params: { panel: { required: true, pattern: '^[a-z][a-z0-9-]*/[a-z][a-z0-9_.-]*$' } }
    icon: layout-dashboard
  - name: slot
    description: "A place on a page where another extension's page can be shown."
    label: Slot
    params: { slot: { required: true, pattern: '^[a-z][a-z0-9-]*/[a-z][a-z0-9_.-]*$' } }
    icon: box
  - name: decorator
    description: "A label that an extension adds to a record."
    label: Decorator
    params: { decorator: { required: true, pattern: '^[a-z][a-z0-9-]*/[a-z][a-z0-9_.-]*$' } }
    icon: tag
  - name: replacement
    description: "A built-in part of the window that an extension replaces."
    label: Replacement
    params: { replacement: { required: true, pattern: '^[a-z][a-z0-9-]*/[a-z][a-z0-9_.-]*$' } }
    icon: copy
  - name: custom_component
    description: "A part of a page that an extension draws with its own code."
    label: Custom component
    params: { custom_component: { required: true, pattern: '^[a-z][a-z0-9-]*/[a-z][a-z0-9_.-]*$' } }
    icon: box
commands:
  # agent_input.write — the window's agent input.
  - name: agent.draft
    summary: "Put text in the shown thread's agent input, unsent."
    scope: agent_input.write
    op: draft
    example: {"text": "Also check the error paths."}
  - name: page.draft_with_agent
    summary: "Start a prompt asking your agent to build a page, in its input, unsent."
    scope: agent_input.write
    op: draft
    ui: { label: "New Page with Your Agent…", group: Tasks, input: { text: "Build me an oxplow page (one I can open with Cmd+P) that shows " }, when: "threadShown" }
    example: {"text": "Build me an oxplow page (one I can open with Cmd+P) that shows open tasks by thread"}
  # agent_sessions.write
  - name: agent_session.close
    summary: "Close an agent session (`ses3`): its open turn ends and its process stops. Its conversation is kept: `oxplow.agent_session.reopen` (its undo) opens it again."
    scope: agent_sessions.write
    op: close
    example: {"session": "ses3"}
  - name: agent_session.reopen
    summary: "Reopen an agent session a person closed (`ses3`): its tab returns and its agent resumes the saved conversation. Not one its thread's or stream's close took, and not on a closed thread."
    scope: agent_sessions.write
    op: reopen
    ui: { label: "Reopen Session", group: Tasks, about: oxplow/agent_session, about_when: reopenable, input: { session: "{{uri.id}}" }, open_after: "oxplow:oxplow/agent_session?id={{result.id}}" }
    example: {"session": "ses3"}
  - name: agent_session.open
    summary: "Open an agent session on a thread (`thr1`): a slot the person's UI starts an agent in. It only adds the slot — nothing is started or typed for it. `harness` (default: the project's first enabled agent), `title`, and `resume`: a saved conversation of the harness to start on (refused when it is open in another session). An agent opens one only in its own stream."
    scope: agent_sessions.write
    op: open
    ui: { label: "New Agent Session…", group: Tasks, keywords: [agent, session, start], form: "oxplow:oxplow/page?page=new-session", open_after: "oxplow:oxplow/agent_session?id={{result.id}}", when: "threadShown" }
    example: {"thread": "thr3", "title": "Review pass"}
  - name: agent_session.open_claude
    summary: "Open a Claude terminal session on the thread shown; its tab starts the agent."
    scope: agent_sessions.write
    op: open
    ui: { label: "New Claude Session", group: Tasks, keywords: [agent, session, start, claude], input: { thread: "{{thread}}", harness: claude }, open_after: "oxplow:oxplow/agent_session?id={{result.id}}", when: "threadShown && enabledAgents =~ /(^|,)claude(,|$)/" }
    example: {"thread": "thr3", "harness": "claude"}
  - name: agent_session.open_codex
    summary: "Open a Codex terminal session on the thread shown; its tab starts the agent."
    scope: agent_sessions.write
    op: open
    ui: { label: "New Codex Session", group: Tasks, keywords: [agent, session, start, codex], input: { thread: "{{thread}}", harness: codex }, open_after: "oxplow:oxplow/agent_session?id={{result.id}}", when: "threadShown && enabledAgents =~ /(^|,)codex(,|$)/" }
    example: {"thread": "thr3", "harness": "codex"}
  - name: agent_session.open_opencode
    summary: "Open an OpenCode terminal session on the thread shown; its tab starts the agent."
    scope: agent_sessions.write
    op: open
    ui: { label: "New OpenCode Session", group: Tasks, keywords: [agent, session, start, opencode], input: { thread: "{{thread}}", harness: opencode }, open_after: "oxplow:oxplow/agent_session?id={{result.id}}", when: "threadShown && enabledAgents =~ /(^|,)opencode(,|$)/" }
    example: {"thread": "thr3", "harness": "opencode"}
  - name: agent_session.rename
    summary: "Rename an agent session (`ses3`)."
    scope: agent_sessions.write
    op: rename
    example: {"session": "ses3", "title": "Review pass"}
  - name: agent_session.fork_conversation
    summary: "Fork a saved conversation into a NEW agent session beside `ses3`, on its thread and harness: the new session's first launch continues a copy of the conversation `ses3` is on, or of `conversation`, and the original stays saved. `ses3` is untouched and keeps running. Returns the new session and its `uri`. Refused for a harness that can't fork. A person's only."
    scope: agent_sessions.write
    op: fork_conversation
    # Never offered by itself (it needs the session): the agent session page's form action runs it and opens the new session's tab.
    ui: { label: "Fork into New Session…", group: Tasks, open_after: "{{result.uri}}", when: "false" }
    example: {"session": "ses3"}
  - name: agent_session.start_fresh
    summary: "Give an agent session a new conversation (`ses3`): forgets its saved conversation. The only way a session gets a new conversation; resuming never does."
    scope: agent_sessions.write
    op: start_fresh
    confirm: destructive
    example: {"session": "ses3"}
  # agent_text.read
  - name: skill.read
    summary: "Read one of oxplow's skills (its SKILL.md). It says how to do a kind of oxplow work, e.g. `oxplow-extension` for building pages. A skill sends you to `references/<name>.md` for detail: pass that `<name>` as `reference`. For agents that don't load skill files themselves; your instructions list the names."
    scope: agent_text.read
    op: skill
    tool: get_skill
    example: {"name": "oxplow-extension", "reference": "page-format"}
  # ai.compute
  - name: ai.decide
    summary: "Ask a model a typed question about some text. Yes/no (`noul`, returns the probability of yes), `choice` among options, or `score` on ordered levels, each with probabilities, on the `decide` role. Good for second opinions like \"is this diff risky?\". Recorded (as the asking thread's call): the same questions on the same text are answered once (`cached`). Fails if the role has no model; the person assigns one in Settings → AI."
    scope: ai.compute
    op: decide
    tool: ai_decide
    example: {"state": "<a diff>", "questions": {"risky": {"type": "noul", "instructions": "Does this change alter public behavior?"}}}
  - name: ai.summarize
    summary: "Summarize text with the `summarize` role. A model the person configured in Settings → AI, optionally with a focus. Useful for long logs or documents you don't need verbatim. Recorded (as the asking thread's call): the same text and focus are summarized once."
    scope: ai.compute
    op: summarize
    tool: ai_summarize
    example: {"text": "<a long log>", "focus": "risks"}
  # ai.settings, ai.test — Settings → AI (a key is a secret: never read back or recorded).
  - name: ai.set_provider
    summary: "Add or replace an AI provider: its kind and API base, and its key (kept in the OS keychain, never read back or recorded). Left out, the stored key stays."
    scope: ai.settings
    op: set_provider
    example: {"id": "anthropic", "kind": "anthropic", "key": "sk-ant-…"}
  - name: ai.remove_provider
    summary: "Remove an AI provider and its key. Refused while a role uses it."
    scope: ai.settings
    op: remove_provider
    confirm: always
    example: {"id": "anthropic"}
  - name: ai.set_role
    summary: "Bind a role (`main`, `summarize`, `decide`, or an extension's profile `acme/review`) to a provider and model, or unbind it with neither. `restrict` forbids `tools`, `sql`, `streaming` or `images` for the binding."
    scope: ai.settings
    op: set_role
    example: {"role": "summarize", "provider": "anthropic", "model": "claude-haiku-5-5"}
  - name: ai.test_provider
    summary: "Make one small call to a provider's model to check its key, URL and model; returns the reply. Spends the person's key."
    scope: ai.test
    op: test_provider
    example: {"id": "anthropic", "model": "claude-haiku-5-5"}
  # bookmarks.write — the person's navigation.
  - name: bookmark.set
    summary: "Bookmark a page at a scope (`thread`, `stream` or `project`), moving it there if it's bookmarked at another."
    scope: bookmarks.write
    op: set
    example: {"uri": "oxplow:oxplow/page?page=git-dashboard", "page_kind": "page", "label": "Git dashboard", "scope": "thread", "thread": "thr3"}
  - name: bookmark.remove
    summary: "Take a page's bookmark off, whichever scope it's at."
    scope: bookmarks.write
    op: remove
    example: {"uri": "oxplow:oxplow/page?page=git-dashboard", "thread": "thr3"}
  # context.write — the person's context basket for a thread's agents.
  - name: context.add
    summary: "Put a page (`uri`) or a piece of text (`text`, from `uri` when known) in a thread's context basket. The next prompt to any agent in that thread carries everything waiting there, then the basket is empty. The person's: an agent can't add to it."
    scope: context.write
    op: add
    example: {"thread": "thr1", "uri": "oxplow:oxplow/commit?sha=abc1234", "label": "abc1234"}
  - name: context.remove
    summary: "Take an item (`v_thread_context.id`) out of its thread's context basket."
    scope: context.write
    op: remove
    example: {"item": 12}
  - name: context.clear
    summary: "Empty a thread's context basket of everything still waiting; what was delivered stays as a record."
    scope: context.write
    op: clear
    example: {"thread": "thr1"}
  # changes.read
  - name: change.ensure
    summary: "Analyze a change and return its row (`v_change`). A commit vs its parent, an effort (start → end), or a stream's uncommitted work vs HEAD. Then read the analysis with oxplow_query_sql: v_change_file (files, zones), v_oxplow_bundled_change_interest (look-here-first scores, when oxplow-bundled is on), v_change_function (added/deleted/modified functions, deltas, churn), v_change_import (cross-zone imports), v_oxplow_bundled_change_co_change (files whose usual partners are missing, or that were dormant; oxplow-bundled), v_change_duplicate (copied blocks; arrives a little later). Cached: commits and closed efforts are analyzed once. It fills a derived cache and changes no record."
    scope: changes.read
    op: ensure
    tool: ensure_change
    example: {"kind": "commit", "sha": "HEAD"}
  # collectors.preview
  - name: collector.preview
    summary: "Dry-run a collector, storing nothing. Runs the deployed entity collector against a stream's files and data (a draft's code doesn't run outside a throwaway: test a source you're writing with `$OXPLOW_BIN extension test <name>`); a fact collector, which only computes, runs that stream's own script. Returns what it would store: an entity collector's rows (first 50 per entity, coerced to the declared columns), or a fact collector's (`facts:`) facts as `{ owner, id, facts: [{ measure, value, subject, … }] }`, computed over the stream's latest snapshot (a collector that reads `input` rows is previewed through an example: `oxplow extension test`). oxplow.collector.sync runs it for real, and collected data is project-wide. Pass `event` (`{ type, payload, anchors? }`) to preview an `on:` collector on the event it reacts to. An exec collector still needs a person's approval of that exact version; starlark/jaq collectors run without it."
    scope: collectors.preview
    op: preview
    tool: preview_collector
    example: {"owner": "work", "id": "hot"}
  # credentials.write
  - name: collector.set_credential
    summary: "Set (or, with no `value`, clear) a credential a collector declares: the value goes to the OS keychain and is never read back, so `v_collector_credential` only says whether one is set."
    scope: credentials.write
    op: set_credential
    example: {"collector": "oxplow:oxplow/collector?collector=triage/hot", "name": "TOKEN", "value": "ghp_example"}
  - name: extension.set_secret
    summary: "Keep a host secret a provider's credential refers to (`v_extension_secret.reference`; left out, a fresh reference is made): the value goes to the OS keychain and is never read back. A provider running on the secret restarts."
    scope: credentials.write
    op: set_secret
    example: {"extension": "linear", "value": "lin_api_example"}
  - name: extension.revoke_secret
    summary: "Forget a host secret (`extension` and the `reference` from `v_extension_secret`): out of the OS keychain, and a provider running on it restarts."
    scope: credentials.write
    op: revoke_secret
    confirm: destructive
    example: {"extension": "linear", "reference": {"schemaVersion": 1, "id": "0197a1c2-7b3e-7c4d-8a5f-1b2c3d4e5f60"}}
  # collectors.sync
  - name: collector.sync
    summary: "Run an approved collector now, refreshing what it collects. It runs over the tree as it is (a fact collector takes a snapshot first, so a file just written is read), through the collector's program or script, which the bus doesn't own. It never approves: an unapproved exec collector is refused. A project report collector (`records:`) reads its report now and records what it parses in `thread` (an agent's own): point at the report, never report numbers yourself."
    scope: collectors.sync
    op: sync
    example: {"collector": "work/hot"}
  # config.read
  - name: config.get
    summary: "One .oxplow/project.yaml key: its doc, value schema and current value."
    scope: config.read
    op: get
    example: {"key": "metricRetentionDays"}
  - name: config.list_keys
    summary: "Every .oxplow/project.yaml key with its doc, value schema, current value and whether only a person may set it."
    scope: config.read
    op: list_keys
    example: {}
  # config.write
  - name: config.set
    summary: "Set one .oxplow/project.yaml key, or with `layer: personal` a person's own choice in .oxplow/personal.yaml. Those are (`activeProviders`, `newThreadSession`, `enableExtensions`, `disableExtensions`, `extensionSources`, `enableBundledExtensions`). The value is validated against the key's schema and the file's own rules, written to the file, and logged as config.changed; undo restores the prior value."
    scope: config.write
    op: set
    example: {"key": "metricRetentionDays", "value": 30}
  - name: file.mark_generated
    summary: "Mark a file or folder (by the name the project's `generated` list holds it by: `target`, `dist`, `*.min.js`) as generated, or with `generated: false` take the mark off. Writes the `generated` key's `exclude` list in .oxplow/project.yaml (logged as config.changed, undoable); snapshots and change views leave marked paths out."
    scope: config.write
    op: mark_generated
    example: {"entry": "dist"}
  - name: capability.choose
    summary: "Choose which implementation a capability uses (`work_items`, `effort_policy`, `snapshots`, …): the project's choice in .oxplow/project.yaml (`activeProviders`), or with `layer: personal` this person's own in .oxplow/personal.yaml. Leave `provider` out to go back to the default (for a personal choice, the same as the project). Logged as config.changed, undoable."
    scope: config.write
    op: choose_provider
    example: {"capability": "snapshots", "provider": "oxplow-bundled/diffs"}
  - name: replacement.choose
    summary: "Choose whose component shows where an extension replaces a core one (`replacements` in .oxplow/project.yaml): an extension's name, or `oxplow` for oxplow's own. Leave `whose` out for the default. Logged as config.changed, undoable."
    scope: config.write
    op: choose_replacement
    example: {"target": "work_item.board", "whose": "task-views"}
  - name: agent.set_agents
    summary: "Set which agent harnesses are on, by key, in priority order: the first is a new session's default. Each must be registered. Writes `agents` in .oxplow/project.yaml (logged as config.changed, undoable)."
    scope: config.write
    op: set_agents
    example: {"agents": ["claude", "codex"]}
  - name: agent.set_setting
    summary: "Set one of an agent harness's declared settings (`agentConfig.<agent>.<key>`, what its launch reads); a blank value clears it. Logged as config.changed, undoable."
    scope: config.write
    op: set_agent_setting
    example: {"agent": "claude", "key": "model", "value": "opus"}
  - name: agent.set_prompt_append
    summary: "Set the text appended to every agent's system prompt (`agentPromptAppend`); blank removes it. It applies to sessions started after. Logged as config.changed, undoable."
    scope: config.write
    op: set_prompt_append
    example: {"text": "Prefer small commits."}
  - name: config.unset
    summary: "Remove one .oxplow/project.yaml key so it returns to its default (or, with `layer: personal`, a person's own choice); logged as config.changed, undo restores it."
    scope: config.write
    op: unset
    example: {"key": "metricRetentionDays"}
  - name: delivery.retry
    summary: "Run an event a consumer couldn't take through that consumer again, now. The letter is `retried`, or stays `pending` with the new error."
    scope: deliveries.write
    op: retry
    example: {"id": 3}
  - name: delivery.discard
    summary: "Give up on an event a consumer couldn't take; it stays visible as `discarded`. A person is asked first."
    scope: deliveries.write
    op: discard
    confirm: destructive
    example: {"id": 3}
  - name: ui.report_error
    summary: "Record an operation that failed in front of the person in the app, as the app showed it, so the agent can read it in `v_op_error`. The app's own."
    scope: diagnostics.write
    op: report_error
    example: {"label": "Merge bugfixes into current", "command": "git merge bugfixes", "message": "CONFLICT in src/auth.rs", "exit_code": 1, "thread": "thr3"}
  - name: op_error.mark_seen
    summary: "Mark a failed operation as seen: the person opened its output (`v_op_error.seen`)."
    scope: diagnostics.write
    op: mark_op_error_seen
    example: {"event": "ev1042"}
  - name: op_error.dismiss
    summary: "Dismiss a failed operation: the app no longer lists it (`v_op_error.dismissed`). The agent can still read it."
    scope: diagnostics.write
    op: dismiss_op_error
    example: {"event": "ev1042"}
  - name: op_error.dismiss_all
    summary: "Dismiss every failed operation the person hasn't dismissed."
    scope: diagnostics.write
    op: dismiss_all_op_errors
    example: {}
  # editor.write — the window's; an agent saves in its own thread.
  - name: editor.save
    summary: "Save a file's unsaved changes (`uri`: its tab, `oxplow:oxplow/file?path=src/a.rs`). With none it saves the page your thread shows: its file, or the page's own edits (a wiki page's draft)."
    scope: editor.write
    op: save
    ui: { label: Save, group: File, shortcut: "Ctrl/Cmd+S", while_typing: true, menu: { bar: file, group: 2_save, order: 10 }, when: "pageDirty" }
    example: {"uri": "oxplow:oxplow/file?path=src/main.rs"}
  # efforts.write
  - name: effort.close
    summary: "Close an effort (by id, or a thread's open one), optionally as of a past point and with a summary."
    scope: efforts.write
    op: close
    example: {"effort": "eff12", "summary": "Fixed the login redirect loop."}
  - name: effort.confirm_decision
    summary: "Confirm a decision oxplow inferred from an effort (`<id>`): it was made, as stated."
    scope: efforts.write
    op: confirm_decision
    example: {"decision": 3}
  - name: effort.dismiss_claim
    summary: "Dismiss a claim oxplow read in an effort's answers (`<id>`): the agent didn't claim it, or didn't mean it. It stays dismissed when the effort is read again."
    scope: efforts.write
    op: dismiss_claim
    example: {"claim": 7}
  - name: effort.dismiss_decision
    summary: "Dismiss a decision oxplow inferred from an effort (`<id>`): it wasn't made, or not like that."
    scope: efforts.write
    op: dismiss_decision
    example: {"decision": 3}
  - name: effort.link
    summary: "Link an effort (by id, or a thread's open one) to a work item, or unlink it with `work_item: null`."
    scope: efforts.write
    op: link
    example: {"effort": "eff12", "work_item": "oxplow:oxplow/work_item?id=tsk42&provider=oxplow"}
  - name: effort.open
    summary: "Open an effort — a span of a thread's work — on a thread (yours by default), optionally linked to a work item. The thread's current effort closes first. oxplow opens efforts itself; this is for policies, people and corrections."
    scope: efforts.write
    op: open
    example: {"thread": "thr3", "work_item": "oxplow:oxplow/work_item?id=tsk42&provider=oxplow"}
  - name: effort.record_decision
    summary: "Record a DECISION you made while working: a fork where you picked one approach over others without asking (where to put something, which library, what to leave out, how to read an ambiguous ask). People review these first, so record the non-obvious ones as you make them — not trivia. Attaches to `work_item`'s open effort, else your thread's. Returns `{ id, effort }`."
    scope: efforts.write
    op: record_decision
    example: {"question": "Where should the redirect target be validated?", "choice": "In the callback handler", "alternatives": ["In the login page", "In a middleware"], "why": "It is the only place that sees both the session and the requested path.", "confidence": "medium"}
  - name: effort.reopen_claim
    summary: "Take back a claim's dismissal (`<id>`): it's unreviewed again."
    scope: efforts.write
    op: reopen_claim
    example: {"claim": 7}
  - name: effort.reopen_decision
    summary: "Take back a review of an inferred decision (`<id>`): it is unconfirmed again."
    scope: efforts.write
    op: reopen_decision
    example: {"decision": 3}
  - name: effort.replace_inferred_decisions
    summary: "Replace an effort's inferred decisions (`eff<id>`) with a model's proposals — at most 8 forks the agent seems to have resolved without recording them. Its recorded and reviewed decisions stay. They wait for a person's review and are never shown to the agent. Returns `{ effort, count }`."
    scope: efforts.write
    op: replace_inferred_decisions
    example: {"effort": "eff12", "decisions": [{"question": "Which CSV library?", "choice": "csv crate", "alternatives": ["hand-rolled writer"], "why": "Quoting rules are easy to get wrong.", "confidence": "medium"}]}
  - name: effort.replace_inferred_claims
    summary: "Replace an effort's claims (`eff<id>`) with the ones a model read in its answers — at most 8 statements like \"tests pass\" or \"no behavior change\", each with its kind and what it cites. Claims a reviewer dismissed or verified stay. Returns `{ effort, count }`."
    scope: efforts.write
    op: replace_inferred_claims
    example: {"effort": "eff12", "claims": [{"statement": "The parser tests pass.", "kind": "tests_pass", "evidence": "oxplow:oxplow/run?id=42"}]}
  - name: effort.report
    summary: "Optional: describe the thread's current (else latest) effort. It takes a `summary` of what shipped, any `impacts` beyond the edits (a wiki page, a work item, a commit, a finding), and the `claims` you can back (each `{ statement, kind, evidence? }`; they replace the ones an earlier report stated that nobody reviewed). Without one, the summary is your last turn's final message; files and test runs are observed. Returns `{ effort, link_warnings }`."
    scope: efforts.write
    op: report
    example: {"summary": "Fixed the login redirect loop: the callback kept the stale `next` parameter.", "impacts": [{"kind": "file", "id": "src/auth.rs", "action": "updated"}, {"kind": "work_item", "id": "oxplow:oxplow/work_item?id=tsk42&provider=oxplow", "action": "completed"}], "claims": [{"statement": "the auth tests pass", "kind": "tests_pass", "evidence": "oxplow:oxplow/run?id=12"}]}
  - name: effort.unverify_claim
    summary: "Take back a claim's verification (`<id>`): it's unreviewed again, citing `evidence` (what it cited before) or nothing."
    scope: efforts.write
    op: unverify_claim
    example: {"claim": 7, "evidence": "oxplow:oxplow/run?id=12"}
  - name: effort.update
    summary: "Set an effort's own title, or clear it back to its default with `title: null`."
    scope: efforts.write
    op: update
    example: {"effort": "eff12", "title": "Fix the login redirect loop"}
  - name: effort.verify_claim
    summary: "Verify a claim oxplow read in an agent's answers (`<id>`), citing what backs it (what it already cites, else `reviewer` when you checked it yourself)."
    scope: efforts.write
    op: verify_claim
    example: {"claim": 7, "evidence": "oxplow:oxplow/run?id=12"}
  # effects.read
  - name: effect.backfill_plan
    summary: "How many events an `oxplow.effect.backfill` would have an effect react to: the matching ones it never reacted to, the log positions they span (pass `to_seq` to the backfill to run on just these), and how many one run reacts to (`batch`)."
    scope: effects.read
    op: backfill_plan
    example: {"effect": "oxplow-bundled/infer-reasoning", "since": "2026-10-01T00:00:00Z"}
  # effects.run
  - name: effect.backfill
    summary: "Have an effect react to the matching events it never reacted to — those logged before its approval, or while it waited to be approved again — oldest first, once each. The effect may call outside oxplow for every one of them. It runs as it is now; `oxplow.effect.backfill_plan` says how many events that is."
    scope: effects.run
    op: backfill
    confirm: always
    example: {"effect": "oxplow-bundled/infer-reasoning", "since": "2026-10-01T00:00:00Z"}
  - name: effect.retry
    summary: "Have an effect react again to an event its reaction to failed, as its next attempt. If the failed attempt was interrupted with a step outside oxplow under way, that step may already have run: retrying sends it again. It runs the effect as it is now, composing afresh from the event."
    scope: effects.run
    op: retry
    confirm: always
    example: {"effect": "oxplow-bundled/infer-reasoning", "event": "ev1042"}
  # jobs.manage
  - name: job_run.cancel
    summary: "Stop a running or queued job run (`<id>`), whichever extension started it (`v_job_run`). A queued one ends at once; a running one drops its model call and ends `cancelled` with what it had written."
    scope: jobs.manage
    op: cancel
    example: {"job_run": "01990000-0000-7000-8000-000000000000"}
  # extensions.check
  - name: extension.draft_status
    summary: "How a stream's draft of an extension differs from what runs. Reads the extension's source in the stream's checkout (yours unless `stream_id` names another) and compares it with the running version: `differs`, the running `deployed_hash` (null when none runs) and the draft's `source_hash`, and for `pages` (page files, by id) and `commands` (by name) the `added`, `removed` and `changed` ones. `draft` is true when that checkout is not the main stream's: a draft deploys only once its change is on the main branch. A deploy that would remove a page or command warns about it."
    scope: extensions.check
    op: draft_status
    example: {"name": "my-extension"}
  - name: extension.validate
    summary: "Check an extension after editing it. The same report as `oxplow extension check`: manifest and lifecycle errors with file:line, unresolved cross-references, plus a dry run of its models, advisories and command examples on this build's schema with no data — never the project's database (SQL errors, columns that differ from the contract). It doesn't run a page's loaders: `oxplow extension test` does. `ok: true` means it works; `warnings` are worth fixing but don't block. Returns the report (`ok`, `errors`, `warnings`, `impact`, `services`, `profiles`), not the parsed extension (`oxplow extension check --json` prints that)."
    scope: extensions.check
    op: validate
    tool: validate_extension
    example: {"name": "my-extension"}
  # extensions.deploy
  - name: extension.deploy
    summary: "Deploy an extension from its source: check it, copy it into the store (`.oxplow/runtime/extensions/<name>/<hash>/`) and make that deployment the one oxplow runs. The source is the main stream's checkout (`.oxplow/extensions/<name>/`, or where `extensionSources` points), uncommitted changes included: deploy to let the person see a change, commit once they are happy. From another stream, a source inside the project is that stream's draft and is refused (check and test it there); a source outside the project deploys from any stream. Nothing runs an edit to a source until it is deployed. The same source again is `already: true`. A deployment that doesn't load or prepare changes nothing and its problems are the error. Turns the extension on for the person when nothing turns it on yet. A source whose `permissions:` add to what the extension runs with now asks a person first — an agent's deploy becomes a proposal naming each permission it adds, and runs once a person approves it. Returns `{ name, hash, already, warnings }` once the deployment runs."
    scope: extensions.deploy
    op: deploy
    example: {"name": "my-extension"}
  - name: extension.write_page
    summary: "Write a page file into an extension's source. The `spec` is the page's YAML text; it must parse as a page or nothing is written. Creates the extension when it is missing and replaces the page when it exists. With `deploy: true` it then deploys. Refused for a bundled extension, and from another stream when the source is inside the project. Returns `{ page, path, deployed }`."
    scope: pages.author
    op: write_page
    example: {"extension": "my-pages", "page": "overview", "spec": "title: Overview\nloaders:\n  a: { sql: \"SELECT 1 AS n\" }\nview: { viz: table, from: a }\n", "deploy": true}
  - name: extension.new_dashboard
    summary: "Start a new, empty dashboard. It is a page in the Dashboards launcher category whose view is an empty grid, written into `extension` (default `my-pages`, created when missing) with its name taken from the title, and deployed. Its tiles are other pages, embedded, which the person adds with Pin to Dashboard. Refused when a page by that name exists. Returns `{ page, path, deployed }`."
    scope: pages.author
    op: new_dashboard
    example: {"title": "Release health"}
  - name: extension.rollback
    summary: "Make an earlier deployment of an extension the one oxplow runs: `to` (a hash or its start, from `v_extension_deployment`), else the one before the active one. A bundled extension with nothing older returns to the deployment that ships with oxplow. Rolling back to one with more `permissions:` than what runs asks a person first, as a deploy does."
    scope: extensions.deploy
    op: rollback
    example: {"name": "my-extension"}
  - name: extension.enable
    summary: "Turn an extension on for you (`.oxplow/personal.yaml`), over the project's list. One with no deployment here is deployed from the main checkout's source (asking first when it declares `permissions:`)."
    scope: extensions.deploy
    op: enable
    example: {"name": "my-extension"}
  - name: extension.disable
    summary: "Turn an extension off for you (`.oxplow/personal.yaml`), whoever listed it. oxplow-foundation is always on."
    scope: extensions.deploy
    op: disable
    example: {"name": "my-extension"}
  - name: extension.remove
    summary: "Remove an extension: out of both lists, no longer run, its deployments, stored state and settings forgotten. Its source folder stays; delete it yourself if you want it gone."
    scope: extensions.deploy
    op: remove
    confirm: destructive
    example: {"name": "my-extension"}
  - name: extension.share
    summary: "Share an extension with the team: git sees its source (`.oxplow/.gitignore`) and it moves from your list to the project's (`.oxplow/project.yaml`). Commit both. Only a source in `.oxplow/extensions/` is shared this way."
    scope: extensions.deploy
    op: share
    example: {"name": "my-extension"}
  - name: extension.unshare
    summary: "Stop sharing an extension: git no longer sees its source and it moves back from the project's list to yours."
    scope: extensions.deploy
    op: unshare
    example: {"name": "my-extension"}
  # extensions.enable
  - name: contribution.enable
    summary: "Enable a disabled extension provider, collector or effect on this machine again, clearing an automatic disable (a provider's process restarts, a system the bus doesn't own)."
    scope: extensions.enable
    op: enable
    lifecycle: experimental
    example: {"extension": "oxplow-bundled", "kind": "effect", "contribution": "infer-reasoning"}
  - name: contribution.enable_all
    summary: "Enable every extension contribution that stopped after repeated failures on this machine again — one extension's (`extension`) or all — each as `oxplow.contribution.enable` does it. Returns the rows it enabled."
    scope: extensions.enable
    op: enable_all
    lifecycle: experimental
    example: {"extension": "oxplow-bundled"}
  # files.write
  - name: snapshot.restore_file
    summary: "Restore a captured file (a `file_snapshot` id) into its stream's worktree, overwriting what's at its path now. A person confirms it."
    scope: files.write
    op: restore_file
    confirm: destructive
    example: {"file_snapshot": 42}
  - name: file.create
    summary: "Make a file in a stream's worktree. The folders above it are made too; it is refused when the file exists. Logs `file.created`."
    scope: files.write
    op: create
    # Never offered by itself (it needs a path): a page form action runs it and opens the file.
    ui: { label: "New File…", group: File, open_after: "{{result.uri}}", when: "false" }
    example: {"stream": "str1", "path": "docs/notes.md", "content": "# Notes\n"}
  - name: file.create_directory
    summary: "Make a directory in a stream's worktree. Those above it are made too. Logs `file.directory_created`."
    scope: files.write
    op: create_directory
    example: {"stream": "str1", "path": "docs/guide"}
  - name: file.rename
    summary: "Move a file or directory of a stream's worktree. It is refused when the target exists. Logs `file.renamed`, which the window follows with its open editors."
    scope: files.write
    op: rename
    example: {"stream": "str1", "from": "src/old.rs", "to": "src/new.rs"}
  - name: file.delete
    summary: "Remove a file, or a directory with all it holds, from a stream's worktree. A person is asked first. Logs `file.deleted`, which the window follows by closing its editors."
    scope: files.write
    op: delete
    confirm: destructive
    example: {"stream": "str1", "path": "docs/obsolete.md"}
  - name: file.save
    summary: "Write a file of a stream's worktree with the content saved (what the editor's Save writes); logs `file.saved`. Its content isn't kept in the record, its size is."
    scope: files.write
    op: save
    example: {"stream": "str1", "path": "src/main.rs", "content": "fn main() {\n    println!(\"hello\");\n}\n"}
  - name: code.rename
    summary: "Rename a symbol in every file. Its language server finds the symbol at a place in a file (`uri`, 1-based `line` and `col`); its edits are written into the stream's worktree. Logs `file.saved` per file changed. Undo puts the files back, unless the server also created, renamed or deleted files."
    scope: files.write
    op: rename_symbol
    example: {"stream": "str1", "uri": "oxplow:oxplow/file?path=src/lib.rs", "line": 10, "col": 5, "new_name": "Gadget"}
  # handoffs.write
  - name: handoff.send
    summary: "Hand work to another open thread (any stream's): what it is and what its agent needs to know, and the work item it hands over, if any. The thread's agent is given it at its next prompt; the person sees it at once. Nothing wakes an agent. Returns the handoff and `link_warnings`."
    scope: handoffs.write
    op: send
    example: {"to_thread": "thr4", "work_item": "oxplow:oxplow/work_item?id=tsk12&provider=oxplow", "body": "The parser fix is in; the remaining failure is the timezone case in [[src/dates.rs]]."}
  - name: handoff.resolve
    summary: "Take or decline a handoff to your thread. Taking one moves its work item onto your thread. Its sender reads the note."
    scope: handoffs.write
    op: resolve
    example: {"handoff": "hnd3", "outcome": "taken"}
  - name: handoff.settle
    summary: "Record how a handoff ended: `taken` or `declined` (its recipient; `oxplow.handoff.resolve` also moves its work item), `withdrawn` (its sender), each only while open; `open` again undoes it."
    scope: handoffs.write
    op: settle
    example: {"handoff": "hnd3", "state": "withdrawn", "note": "Fixed it here after all."}
  # hints.write
  - name: hint.dismiss
    summary: "Dismiss a hint raised to the person (a `v_agent_nudge` row with audience `person`)."
    scope: hints.write
    op: dismiss
    example: {"nudge": 12}
  # knowledge.read
  - name: knowledge.comments
    summary: "List comments. Threaded annotations the user anchored to a text selection in a page (wiki body, code file line, task detail). `id` is a thread (`thr…`) or stream (`str…`) id; `scope` is inferred from its prefix, so usually pass only `id`. `status` filters: \"all\" (default), \"open\", or \"needs_response\" (open follow-ups whose latest message isn't yours — what the user wants you to act on). Each result carries the anchored `quote`, the message thread, and `intent` (note vs followup). Reply with `oxplow.knowledge.reply_comment { comment, body }`; resolve with `oxplow.knowledge.update_comment { comment, status: \"resolved\" }`."
    scope: knowledge.read
    op: comments
    tool: list_comments
    example: {"id": "str1", "status": "needs_response"}
  - name: knowledge.drift
    summary: "What a wiki page's file drifted. The unified diff between the snapshot the file was pinned to and the file's CURRENT on-disk content — so you can read just what drifted instead of re-opening the whole file. Find the drifted files with `oxplow.sql.query` over `v_knowledge_ref` (`stale = 1`; per page, `v_knowledge_page.stale_ref_count`), then call this per file. Returns `{ slug, path, pinned_snapshot_id, status, unified_diff, truncated }`; `status` is one of drifted | unchanged | not_a_ref | no_pin | binary | no_contents (the pin was taken by 'Track changes only', which keeps no text)."
    scope: knowledge.read
    op: drift
    tool: wiki_ref_drift
    example: {"slug": "architecture", "path": "src/app/main.py"}
  # knowledge.write
  - name: knowledge.add_comment
    summary: "Comment on a span of a page (its `target`), with a first message. `intent`: `note` (the agent leaves it alone) or `followup` (the agent should act on it). An agent comments on its own stream, in its own thread."
    scope: knowledge.write
    op: add_comment
    example: {"stream": "str1", "target": "oxplow:oxplow/wiki?slug=vcs-capability", "quote": "Every provider implements Vcs", "intent": "followup", "body": "This is out of date: GitProvider also implements WorkspaceFiles."}
  - name: knowledge.delete_comment
    summary: "Delete a comment and its messages (`cmt12`). A person is asked first."
    scope: knowledge.write
    op: delete_comment
    confirm: destructive
    example: {"comment": "cmt12"}
  - name: knowledge.delete_page
    summary: "Delete a knowledge (wiki) page and its links."
    scope: knowledge.write
    op: delete_page
    confirm: destructive
    example: {"slug": "auth-flow"}
  - name: knowledge.link
    summary: "Link a knowledge page to a page, file, directory, task or commit (added under its Related heading)."
    scope: knowledge.write
    op: link
    example: {"page": "auth-flow", "target": "src/session.rs"}
  - name: knowledge.relocate_comment
    summary: "Store where a comment's quote (`cmt12`) sits in its page's content now (`selectors_json`), or that it is gone (`orphaned`). The renderer's, after it re-finds the quote."
    scope: knowledge.write
    op: relocate_comment
    example: {"comment": "cmt12", "selectors_json": "[]", "orphaned": false}
  - name: knowledge.reply_comment
    summary: "Reply on a comment (`cmt12`)."
    scope: knowledge.write
    op: reply_comment
    example: {"comment": "cmt4", "body": "Fixed in the page."}
  - name: knowledge.resync
    summary: "Restate a knowledge page from its file on disk (the repair when a row and its file disagree); a missing file deletes the page."
    scope: knowledge.write
    op: resync
    example: {"slug": "auth-flow"}
  - name: knowledge.update_comment
    summary: "Change a comment (`cmt12`): its `intent`, its `status` (`open` / `resolved`), or re-attach it to a new span (`quote` and `selectors_json` together)."
    scope: knowledge.write
    op: update_comment
    example: {"comment": "cmt4", "status": "resolved"}
  - name: knowledge.verify_files
    summary: "Re-pin a page's files to now without rewriting it: `files` are the files you re-read against the page as it stands (all of the page's files when omitted). The page is the one core records; a file the page does not cite is refused."
    scope: knowledge.write
    op: verify_files
    example: {"slug": "auth-flow", "files": ["src/auth.rs"]}
  - name: knowledge.write_page
    summary: "Write a knowledge (wiki) page: its body, every [[link]] resolving, and the files you re-read against it (verified_files) or took out (removed_files)."
    scope: knowledge.write
    op: write_page
    example: {"slug": "auth-flow", "title": "Auth flow", "body": "# Auth flow\n\nThe callback validates `next` before redirecting. See [[src/auth.rs]].", "verified_files": ["src/auth.rs"]}
  - name: lsp.restart_server
    summary: "Restart a stream's language server for a language: the session is torn down and started again with the open documents replayed."
    scope: lsp.control
    op: restart_server
    example: {"stream": "str1", "language": "rust"}
  - name: lsp.install_server
    summary: "Download and install a language server (a Mason package) and register its binary. A person is asked first."
    scope: lsp.install
    op: install_server
    confirm: always
    example: {"package": "rust-analyzer"}
  - name: lsp.remove_server
    summary: "Uninstall a language server: delete its files, manifest entry and registrations."
    scope: lsp.install
    op: remove_server
    confirm: always
    example: {"package": "rust-analyzer"}
  # lsp.read
  - name: code.definition
    summary: "Where a symbol is defined. Typed locations (`{ path, range: { start: { line, col }, end } }`, 1-based; paths workspace-relative, absolute outside it), from the file's language server. `v_lsp_server` says which languages have one."
    scope: lsp.read
    op: definition
    tool: code_definition
    example: {"stream_id": "str1", "path": "src/lib.rs", "line": 10, "col": 5}
  - name: code.references
    summary: "Every reference to a symbol. Typed locations (1-based) at a position, the declaration included unless `include_declaration` is false."
    scope: lsp.read
    op: references
    tool: code_references
    example: {"stream_id": "str1", "path": "src/lib.rs", "line": 10, "col": 5}
  - name: code.hover
    summary: "A position's hover. The symbol's type/signature and docs, as markdown (`{ contents, range }`), or null."
    scope: lsp.read
    op: hover
    tool: code_hover
    example: {"stream_id": "str1", "path": "src/lib.rs", "line": 10, "col": 5}
  - name: code.call_hierarchy
    summary: "A symbol's callers or callees. The callers (`direction: incoming`) or callees (`outgoing`): each `{ symbol, at }` — the caller/callee and where the calls are. [] when the position has no call-hierarchy item."
    scope: lsp.read
    op: call_hierarchy
    tool: code_call_hierarchy
    example: {"stream_id": "str1", "path": "src/lib.rs", "line": 10, "col": 5, "direction": "incoming"}
  - name: code.symbols
    summary: "The symbols a file declares. Functions, classes, methods, modules, …), nested ones naming their container, as `{ source, symbols }`. `source` says what answered: `language_server` (any configured language whose server runs; `{ name, kind, container, location }`) or `tree_sitter` (no server serves the file, so oxplow's own offline analysis reads the file's live content, the uncommitted edits included; `{ kind, name, containerPath, startLine, endLine }`, empty for an unsupported or unparseable file). `v_symbol` holds the stored symbols of captured files."
    scope: lsp.read
    op: symbols
    tool: code_symbols
    example: {"path": "src/lib.rs"}
  - name: code.workspace_symbols
    summary: "Find symbols by name across the workspace. Fuzzy, server-defined, from one language's running server: typed symbols with their locations. Use to find a definition by name without a file/position. Needs a running server (`v_lsp_server`); without one, search the stored symbols in `v_symbol`."
    scope: lsp.read
    op: workspace_symbols
    tool: code_workspace_symbols
    example: {"language": "rust", "query": "Services"}
  # metrics.read
  - name: metric.scaffold
    summary: "A starter for a new metric, as an extension of its own; writes nothing. Returns `name`, `dir` (`.oxplow/extensions/<name>`) and `files`, each with its project-relative path: the extension.yaml (a measure, a Starlark fact collector, the metric), the collector script, a page and an example with its fixture. Write them with your own tools, check it (`oxplow_validate_extension`), then deploy it (`oxplow.extension.deploy`); its collector runs once the extension is deployed. `oxplow.metric.enable` turns the metric on or off in .oxplow/project.yaml."
    scope: metrics.read
    op: scaffold
    example: {"name": "complex-fns", "language": "python", "glob": "src/**/*.py"}
  # metrics.write
  - name: metric.enable
    summary: "Turn metrics on or off in this project (.oxplow/project.yaml `metrics:`); logged as config.changed, undo restores the previous list."
    scope: metrics.write
    op: enable
    example: {"keys": ["complex_fns.count"], "enabled": true}
  - name: metric.rebuild
    summary: "Rebuild code metrics over the whole tree: run every gauge that needs a baseline (every gauge with `force`) over the latest snapshot. Reports how many ran and which failed."
    scope: metrics.write
    op: rebuild
    example: {"force": true}
  - name: metric.record
    summary: "Record an asserted number for a metric (provenance `asserted`): a value oxplow didn't compute, like a CI import. The metric needs a source measure and must not be a `count`; the fact is stamped to match the metric's own filter."
    scope: metrics.write
    op: record
    example: {"key": "complex_fns.count", "value": 12, "subject": "oxplow:oxplow/file?path=src/auth.rs"}
  # pages.read
  - name: page.run
    summary: "Read what a page shows. Give `page` (`<extension>/<slug>`, from `oxplow.page.find` or `v_page`) or `spec` (an inline page of your own as YAML: `title`, `loaders:` with sql / rows / page loaders, `view:`; it only reads), `params` by name (the rest take your thread's context or their defaults). `format: \"text\"` (default) is the page's text, each node under `[node <id>]` (an embedded page's nodes `[node <embed>/<id>]`), so you can point the person at one with `oxplow_navigate` and `#node=<id>`; `format: \"json\"` is each loader's columns and rows (up to 200, with `truncated`) and the tree; `loader` narrows json to one loader. `draft: true` reads your stream's draft of the page's extension (its source in your worktree, not deployed) over live data; its commands are the deployed ones."
    scope: pages.read
    op: run
    tool: run_page
    example: {"page": "oxplow-foundation/problems", "format": "text"}
  - name: page.find
    summary: "Find the pages that answer a question. A `question` (in words) matches the questions pages say they answer, then their titles and descriptions; `about` (a uri) keeps the pages that show that kind of thing and binds its uri (`bind`). Each comes with its params, so you can `oxplow_run_page` it, or show it to the person with `oxplow_navigate`. Look here before writing SQL for something a person will look at."
    scope: pages.read
    op: find
    tool: find_page
    example: {"question": "which tests failed this week"}
  - name: page.show
    summary: "Show the person a page beside the conversation. Give `page` (`<extension>/<slug>`, from `oxplow.page.find`) with `params`, or `spec`: a page of your own as YAML (`title`, `loaders:` with sql / rows / page loaders, `view:` with table, list, chart, tree, number or markdown nodes; it only reads) — kept as a page file on `oxplow:temp` (`oxplow:oxplow/page?page=temp/<id>`) the person can save to the wiki or as a page. It opens as a tab of your thread when their window is open (`opened`), and returns the page's text so you can keep your prose short."
    scope: pages.show
    op: show
    tool: show_page
    example: {"spec": "title: Failing tests\nloaders:\n  t: { sql: \"SELECT name, status FROM v_test_case WHERE status = 'failed'\" }\nview: { viz: table, from: t }\n"}
  - name: page.describe
    summary: "What a page file is made of. `uri` is the file (`oxplow:oxplow/file?path=…`): on `oxplow:extensions` a page that runs (`<extension>/pages/<slug>.yaml`; with a `rev` that isn't the running deployment, that deployment's copy), on `oxplow:temp` a view's file, on the worktree a page file under `extensions/<name>/pages/` or `.oxplow/extensions/<name>/pages/` (`text` is the file as you have it, else it is read). Gives its extension, source file and deployment, its params, its loaders (each one's sql, command, page or rows) and its node tree, each node with the page and file it comes from and the loader it shows — embedded pages and mounted slots included: what the person sees on the Definition page. A file that is no page (other YAML, YAML that doesn't parse) gives no rows."
    scope: pages.read
    op: describe
    example: {"uri": "oxplow:oxplow/file?path=oxplow-foundation/pages/commit.yaml&filesystem=oxplow:extensions", "params": {"sha": "abc1234"}}
  - name: page.renderers
    summary: "The pages that can draw a uri, in the order Open With lists them: each `page` (`<extension>/<slug>`), its `title` and whether it is the `default`. A page is offered when its `for` names the uri's resource, its `accepts` hold for the uri's params, and — if it says `accepts: { content: <loader> }` — that loader of its own has a row (the daemon runs only that loader, 2 s at most; a failure is not offered). `oxplow_navigate` a uri with `#oxplow.renderer=<page>` to open it in one of them."
    scope: pages.read
    op: renderers
    example: {"uri": "oxplow:oxplow/file?path=src/main.rs"}
  - name: page.run_action
    summary: "Press a page's action as the page acting for you. A whole-page action (the page's `actions`), or a node's (`node`, as `[node <id>]` names it in the page's text) — for a row action, `row` is the row it runs on (column → value, as `oxplow.page.run` returned it; it must be one of the node's rows). The command it declares runs as the page for you, so the same rules apply as if you ran it yourself."
    scope: pages.write
    op: run_action
    tool: run_page_action
    example: {"page": "acme/review", "node": "items", "action": "finish", "row": {"id": "tsk12"}}
  - name: page.open
    summary: "What the person is looking at in a thread. It is the page the thread has open in the window they were in last (`pageId` such as `oxplow:oxplow/work_item?id=tsk42&provider=oxplow`, `oxplow:oxplow/file?path=src/a.rs`, `oxplow:oxplow/page?page=review/waiting`; its kind; the detail the page publishes; which window, whether it's on screen, how fresh), and `others`, the page each other window has open there. When it's a page, `pageRun` is the window's own run of it as text (each node under `[node <id>]`), with `focus`, the node they are on: what is on their screen. `tab` reads one of the thread's tabs instead (an id `oxplow_list_tabs` listed). Use it when the person says \"this\", \"what I'm looking at\" or \"this page\". `open` is null when no window reported one."
    scope: pages.read
    op: open
    tool: get_open_page
    example: {"thread_id": "thr3"}
  - name: page.list_tabs
    summary: "The tabs the person's windows show. Each tab's id (a uri you can read or open), kind, title, thread, stream, agent session when it is one, whether it is selected in its thread and on screen, which window, and whether the report is stale. `scope` is `thread` (default: yours, or `thread`), `stream` (every thread in that thread's stream) or `project`. `unreported` lists threads in scope no window reported. Use it to resolve \"the other tab\" or \"the session in the other thread\". Read-only: it opens nothing."
    scope: pages.read
    op: list_tabs
    tool: list_tabs
    example: {"scope": "stream"}
  # projects.write — the app shell's.
  - name: project.create
    summary: "Pick a folder and create a project in it, opened in a new window. A folder that already is a project is refused."
    scope: projects.write
    op: create
    ui: { label: "New Project…", group: File, menu: { bar: file, group: 1_project, order: 10 }, when: "shellAvailable" }
    example: {}
  - name: project.open
    summary: "Open a folder that is a project (`path`, else pick one), in this window or a new one (`new_window`)."
    scope: projects.write
    op: open
    ui: { label: "Open Project…", group: File, input: { new_window: false }, menu: { bar: file, group: 1_project, order: 20 }, when: "shellAvailable" }
    example: {"path": "/Users/me/src/app", "new_window": false}
  - name: project.open_in_new_window
    summary: "Pick a folder that is a project and open it in a new window."
    scope: projects.write
    op: open
    ui: { label: "Open Project in New Window…", group: File, input: { new_window: true }, menu: { bar: file, group: 1_project, order: 30 }, when: "shellAvailable" }
    example: {"path": "/Users/me/src/app", "new_window": true}
  # providers.sync
  - name: provider.sync
    summary: "Read a provider instance's collectors now (all, or one), restating the items it tracks (runs the provider process, a system the bus doesn't own)."
    scope: providers.sync
    op: sync
    lifecycle: experimental
    example: {"instance": "issues/issues"}
  # providers.write
  - name: provider.check_instance
    summary: "Check a provider instance against a config without enabling it or writing anything: consent, start, handshake, `check`. Returns the instance's view (`v_provider_instance`), its health the outcome (runs the provider process, a system the bus doesn't own)."
    scope: providers.write
    op: check_instance
    example: {"instance": "issues/issues", "config": {"team": "core"}}
  - name: provider.set_instance
    summary: "Save a provider instance's config and turn it on or off. Turning it on checks it first: an unapproved or unconfigured instance is refused and nothing is written (starts or stops the provider process, a system the bus doesn't own)."
    scope: providers.write
    op: set_instance
    example: {"instance": "issues/issues", "enabled": true, "config": {"team": "core"}}
  - name: provider.add_instance
    summary: "Add another instance of an extension's provider (`instance` is `<extension>/<name>`), the project's or `scope: global` the person's own on this machine. It is off until configured and turned on."
    scope: providers.write
    op: add_instance
    example: {"instance": "issues/work", "provider": "issues", "scope": "project"}
  - name: provider.turn_off_here
    summary: "Turn a global provider instance off in this project only: the project gets its own entry for it, off."
    scope: providers.write
    op: turn_off_here
    example: {"instance": "issues/work"}
  - name: provider.remove_instance
    summary: "Remove a provider instance: it stops, and its config entry and its credentials on this machine go."
    scope: providers.write
    op: remove_instance
    confirm: destructive
    example: {"instance": "issues/work"}
  # credentials.write
  - name: provider.set_credential
    summary: "Set (or, with no `value`, forget) a credential of a provider instance: the value goes to the OS keychain and is never read back, so `v_provider_instance` only says whether one is set. The instance restarts on it. A credential signed in for takes no value; forgetting it signs out."
    scope: credentials.write
    op: set_instance_credential
    example: {"instance": "issues/issues", "name": "TOKEN", "value": "ghp_example"}
  - name: provider.begin_sign_in
    summary: "Start signing in for a provider instance's credential (one its provider declares with `oauth:`), its redirect coming back to `redirect_port` on the person's machine. Returns the page to open in the browser and the sign-in's number (`signIn`)."
    scope: credentials.write
    op: begin_sign_in
    example: {"instance": "issues/issues", "name": "TOKEN", "redirect_port": 53682}
  - name: provider.complete_sign_in
    summary: "Hand a sign-in the redirect the browser was sent to (`redirect`: its path and query). Another sign-in's is refused and the sign-in waits on. Its own: the token goes to the OS keychain and the instance restarts on it. Returns `{ outcome }`: `signed_in`, `failed` or `not_this_sign_in`."
    scope: credentials.write
    op: complete_sign_in
    example: {"instance": "issues/issues", "name": "TOKEN", "redirect": "/callback?code=abc&state=xyz"}
  - name: provider.cancel_sign_in
    summary: "End a sign-in (its number from `begin_sign_in`) the person left or whose browser never opened: nothing of it is kept."
    scope: credentials.write
    op: cancel_sign_in
    example: {"instance": "issues/issues", "name": "TOKEN", "sign_in": 3}
  # records.read
  - name: records.read
    summary: "Read what a uri names. Its dataset's row (every column), what sits beside it (a work item's links and comments, a commit's or an effort's files) and, for a body no dataset holds, its content. `oxplow:oxplow/file?path=src/a.rs` reads the working tree; `oxplow:oxplow/file?path=src/a.rs&rev=git:HEAD#lines=10-40` a revision's lines (`@snap:<id>` a local-history snapshot); `oxplow:oxplow/event?id=<id>#part=output` (or `#input`, `#prompt`) one of your stream's events' stored bodies; `oxplow:oxplow/page?page=<ext>/<slug>` a page's definition (its YAML, source and deployment); `stream` reads a file or page in another stream's worktree. `oxplow:oxplow/ai_call?id=<id>#part=request` (or `#response`) a recorded dataset call's bodies. Any `uri` a dataset's column holds reads the same way (`work_item:…`, `oxplow:oxplow/commit?sha=…`, `oxplow:oxplow/effort?id=…`, `oxplow:oxplow/thread?id=…`, `oxplow:oxplow/wiki?slug=…`). Content stops at 64 KB, saying so."
    scope: records.read
    op: read
    tool: read
    example: {"uri": "oxplow:oxplow/file?path=src/auth.rs&rev=git:HEAD#lines=10-40"}
  # search.read
  - name: search.find
    summary: "Site-wide BM25 search across every searchable resource (`v_resource.searchable`: work items, wiki pages, comments, thread notes, an extension's) and file contents. Tokens match as stemmed prefixes. `stream_id` scopes file/stream-bound hits to one worktree (wiki etc. always included); omit it to search everything. `resources` optionally restricts to some of those (`oxplow/wiki`), or `oxplow/file`. Each hit names the `uri` it found and its `resource` (read it with `oxplow_read`, show it with `oxplow_navigate`); best first."
    scope: search.read
    op: search
    tool: search
    example: {"query": "oauth redirect", "resources": ["oxplow/wiki", "oxplow/work_item"], "limit": 10}
  # sql.read
  - name: sql.query
    summary: "Run ONE read-only SQL statement over the published `v_*` datasets. It takes `SELECT`/`WITH` over the views pages and the UI read (`v_dataset` lists them; physical tables are refused). Joins across views are fine. Metrics read as columns of a grid: `SELECT bucket, zone, MEASURE('<metric key>') FROM metric_grid('day'|'week'|'month'[, '<dimension>'])` (keys in v_metric_spec, dimensions in v_dimension). Positional params `?1`, `?2`, … bind from `params`. Returns `{columns, rows, truncated, reads, generation, coverage}`; rows are positional arrays; `truncated` means more rows existed than `limit`. `coverage` names the collector behind each collected model it read and how its last run stands (`current`, `stale`, `failed`, `disabled`, `needs_approval`, `never`): a complete result over a failed collector is still missing data. Writes, PRAGMA, ATTACH and multiple statements are rejected; queries time out after 5s. `v_field` documents every field (column)."
    scope: sql.read
    op: query
    tool: query_sql
    example: {"sql": "SELECT uri, title, state FROM v_work_item WHERE state = ?1 LIMIT 20", "params": ["todo"]}
  # streams.write
  - name: stream.rename
    summary: "Rename a stream (`str1`)."
    scope: streams.write
    op: rename
    example: {"stream": "str1", "title": "Login fix"}
  - name: stream.set_prompt
    summary: "Set (or clear) the text appended to every agent prompt in a stream. It steers the stream's agents."
    scope: streams.write
    op: set_prompt
    example: {"stream": "str1", "prompt": "Prefer small, reviewable commits."}
  # tabs.write — the window's; an agent's acts in its own thread's tabs.
  - name: tab.open
    summary: "Open a tab (`uri`: a page's uri — `oxplow:oxplow/file?path=src/a.rs`, `oxplow:oxplow/work_item?id=tsk3&provider=oxplow`) in your thread's tabs, without bringing it to the front."
    scope: tabs.write
    op: open
    example: {"uri": "oxplow:oxplow/file?path=src/main.rs"}
  - name: tab.focus
    summary: "Bring a tab (`uri`) to the front of your thread's tabs, opening it first if it isn't open."
    scope: tabs.write
    op: focus
    example: {"uri": "oxplow:oxplow/file?path=src/main.rs"}
  - name: tab.close
    summary: "Close a tab (`uri`) in your thread's tabs."
    scope: tabs.write
    op: close
    example: {"uri": "oxplow:oxplow/file?path=src/main.rs"}
  # terminals.write
  - name: terminal.open
    summary: "Open a terminal: a shell (`$SHELL -l`) in a stream's worktree, at the end of its terminals. `title` defaults to the next \"Terminal N\". Answers `{ id, uri, title }`; the shell starts when a page attaches to the URI."
    scope: terminals.write
    op: open
    example: {"stream": "str2", "title": "build"}
  - name: terminal.rename
    summary: "Give a terminal another title (`trm3`)."
    scope: terminals.write
    op: rename
    example: {"terminal": "trm3", "title": "server"}
  - name: terminal.close
    summary: "Close a terminal (`trm3`): its shell ends and its row goes. A person is asked first, since the shell may hold work (ends a process, a system the bus doesn't own)."
    scope: terminals.write
    op: close
    confirm: destructive
    example: {"terminal": "trm3"}
  # test_runs.write
  - name: test.record_run
    summary: "Record a test run with pass/fail counts oxplow couldn't read from its output, marked `asserted`. oxplow records runs it sees in shell commands itself; this is for runs it couldn't parse. The run is the thread's open effort's. Returns `{ recorded, observationId }`."
    scope: test_runs.write
    op: record_run
    example: {"command": "pytest tests/app", "passed": 120, "failed": 0, "total": 120, "duration_ms": 41200}
  # threads.write
  - name: thread.close
    summary: "Close a thread (`thr12`) — history, reopenable. Its open effort and its agent sessions close, and their processes stop. An agent closes only its own thread."
    scope: threads.write
    op: close
    example: {"thread": "thr12"}
  - name: thread.create
    summary: "Start a thread on a stream (`str1`) — or fork one (`from: thr3`). It has no agent session yet (`oxplow.agent_session.open`). It shares the stream's worktree with the stream's other threads."
    scope: threads.write
    op: create
    ui: { label: "New Thread…", group: Tasks, form: new-thread, when: "streamShown" }
    example: {"stream": "str1", "title": "Fix the login redirect loop"}
  - name: thread.mark
    summary: "Mark a thread's tab with a colour (`amber`, `red`, `green`, `blue` or `violet`) for grouping threads your way; no `mark` clears it. It changes nothing else."
    scope: threads.write
    op: mark
    example: {"thread": "thr12", "mark": "amber"}
  - name: thread.rename
    summary: "Rename a thread (`thr12`)."
    scope: threads.write
    op: rename
    example: {"thread": "thr12", "title": "Fix the login redirect loop"}
  - name: thread.reopen
    summary: "Reopen a closed thread (`thr12`). An agent reopens only its own thread."
    scope: threads.write
    op: reopen
    example: {"thread": "thr12"}
  - name: thread.set_prompt
    summary: "Set (or clear) the text appended to a thread's agent prompt. It steers the thread's agent."
    scope: threads.write
    op: set_prompt
    example: {"thread": "thr3", "prompt": "Work on the login flow only."}
  # vcs.read
  - name: vcs.blame
    summary: "Blame a file. The revision, author and time that last changed each line, at `revision` (default `working`; an uncommitted line names no revision)."
    scope: vcs.read
    op: blame
    tool: vcs_blame
    example: {"path": "src/lib.rs"}
  - name: vcs.branches
    summary: "A stream's branches: name, remote, head revision and whether it is the default."
    scope: vcs.read
    op: branches
    tool: vcs_branches
    example: {}
  - name: vcs.diff
    summary: "What changed between two versions of the tree. Per file with line counts; versions are `working`, `snap:<id>` or `git:<rev>`; `from` absent diffs against the empty tree. `since_fork: true` compares `to` with where it forked from `from` — a branch's own changes against `git:main`."
    scope: vcs.read
    op: diff
    tool: diff
    example: {"from": "git:main", "to": "working", "since_fork": true}
  # vcs.remote
  - name: vcs.log
    summary: "A stream's history from a revision, newest first, paged, with no horizon and any branch. It takes `from` (a branch, tag or id; the head by default), `path` (only revisions that changed it), `limit` (50, at most 500), `cursor` (the previous page's `next_cursor`). Past what `v_commit` indexes, this is the way."
    scope: vcs.read
    op: log
    tool: vcs_log
    example: {"from": "main", "path": "src/lib.rs", "limit": 20}
  - name: vcs.status
    summary: "A stream's changed files against its head (added, modified, deleted, untracked, conflicted) and the operation in progress, if one is."
    scope: vcs.read
    op: status
    tool: vcs_status
    example: {}
  - name: vcs.fetch
    summary: "Fetch from a remote."
    scope: vcs.remote
    op: fetch
    example: {"stream": "str1", "remote": "origin"}
  - name: vcs.pull
    summary: "Pull into the stream's branch (its upstream, or a named remote branch)."
    scope: vcs.remote
    op: pull
    ui: {"label": "Pull Changes", "group": "Git", "input": {"stream": "{{stream}}"}, "background": true, "when": "vcsEnabled"}
    example: {"stream": "str1"}
  - name: vcs.push
    summary: "Push the stream's branch (to its upstream, or a named remote branch)."
    scope: vcs.remote
    op: push
    ui: {"label": "Push Changes", "group": "Git", "input": {"stream": "{{stream}}"}, "background": true, "when": "vcsEnabled"}
    example: {"stream": "str1"}
  # vcs.write
  - name: git.cherry_pick
    summary: "Apply one commit onto the stream's branch."
    scope: vcs.write
    op: cherry_pick
    example: {"stream": "str1", "rev": "3f9c2a1"}
  - name: git.ignore
    summary: "Add a pattern to the workspace's `.gitignore`."
    scope: vcs.write
    op: ignore
    example: {"stream": "str1", "entry": "target/"}
  - name: git.rebase
    summary: "Rebase the stream's branch onto a revision (rewrites its commits)."
    scope: vcs.write
    op: rebase
    confirm: destructive
    example: {"stream": "str1", "rev": "main"}
  - name: git.revert
    summary: "Commit the inverse of one commit onto the stream's branch."
    scope: vcs.write
    op: revert
    confirm: destructive
    example: {"stream": "str1", "rev": "3f9c2a1"}
  - name: vcs.checkout_branch
    summary: "Switch the stream's workspace to a branch (creating it with `create`)."
    scope: vcs.write
    op: checkout_branch
    example: {"stream": "str1", "name": "login-fix", "create": true}
  - name: vcs.commit
    summary: "Commit the stream's changes (untracked files too, unless `include_untracked: false`); returns the new revision."
    scope: vcs.write
    op: commit
    ui: { label: "Commit Changes…", group: Git, form: "oxplow:oxplow/page?page=uncommitted-changes", when: "streamShown && vcsEnabled" }
    example: {"stream": "str1", "message": "fix: stop the login redirect loop"}
  - name: vcs.delete_branch
    summary: "Delete a branch (`force` even when unmerged)."
    scope: vcs.write
    op: delete_branch
    confirm: destructive
    example: {"stream": "str1", "name": "login-fix"}
  - name: vcs.discard
    summary: "Throw away the workspace's changes to paths, back to the head's version."
    scope: vcs.write
    op: discard
    confirm: destructive
    example: {"stream": "str1", "paths": ["src/auth.rs"]}
  - name: vcs.merge
    summary: "Merge a revision into the stream's branch; the result lists any conflicts left after oxplow's smart merge."
    scope: vcs.write
    op: merge
    confirm: destructive
    example: {"stream": "str1", "rev": "main"}
  - name: vcs.uncommit
    summary: "Take back the stream's last commit (`rev`, whose parent is `parent`): the head returns to `parent` and the commit's changes stay staged. Refused when the head moved on, a remote holds the commit, or a merge or rebase is in progress. This is what Undo on a commit runs."
    scope: vcs.write
    op: uncommit
    example: {"stream": "str1", "rev": "3f9c2a1", "parent": "8b41d0e"}
  - name: vcs.rename_branch
    summary: "Rename a branch."
    scope: vcs.write
    op: rename_branch
    example: {"stream": "str1", "from": "login-fix", "to": "fix-login-loop"}
  - name: vcs.resolve_conflict
    summary: "Settle one conflicted path: take `ours`, `theirs`, or `auto` (smart merge)."
    scope: vcs.write
    op: resolve_conflict
    example: {"stream": "str1", "path": "src/auth.rs", "choice": "auto"}
  - name: vcs.stage
    summary: "Stage paths for the next commit."
    scope: vcs.write
    op: stage
    example: {"stream": "str1", "paths": ["src/auth.rs"]}
  # window.show — the window's.
  - name: window.find
    summary: "Show the find bar in the file the window shows."
    scope: window.show
    op: find
    ui: { label: Find, group: Edit, shortcut: "Ctrl/Cmd+F", while_typing: true, menu: { bar: edit, group: 1_find, order: 10 }, when: "fileShown" }
    example: {}
  - name: window.quick_open
    summary: "Show the search box (files, pages, commands), starting on `query` when given."
    scope: window.show
    op: quick_open
    ui: { label: "Quick Open…", group: File, shortcut: "Ctrl/Cmd+P", while_typing: true, menu: { bar: file, group: 3_go, order: 10 }, when: "streamShown" }
    example: {}
  - name: window.navigate
    summary: "Take the person to a uri: opens and focuses its page (a file's editor, a work item, effort, wiki page, directory or `oxplow:oxplow/page?page=<route>`), or selects a `stream:` / `thread:`. `stream` switches to that stream first. Changes what the person sees. Returns `{ opened, stream }`."
    scope: window.show
    op: navigate
    example: {"uri": "oxplow:oxplow/file?path=src/auth.rs"}
    tool: navigate
  # work_items.write
  - name: work_item.comment
    summary: "Comment on a work item (oxplow: a note shown with the task)."
    scope: work_items.write
    op: comment
    needs: [work_items.comments]
    example: {"uri": "oxplow:oxplow/work_item?id=tsk12&provider=oxplow", "body": "Found the cause: the redirect keeps the stale `next` param."}
  - name: work_item.create
    summary: "File a work item on the active tracker (the one the person chose), optionally straight into a state. `thread` is the thread it's filed on: absent, an agent's own (a person's lands on the backlog). `native` is the tracker's own fields as its create declares them (oxplow: { priority }). On oxplow the result carries `link_warnings`: the `[[…]]` links in the body that don't resolve."
    scope: work_items.write
    op: create
    example: {"title": "Fix the login redirect loop", "body": "Signing in from /settings bounces back to /login.", "state": "todo"}
  - name: work_item.delete
    summary: "Delete a work item."
    scope: work_items.write
    op: delete
    confirm: destructive
    needs: [work_items.delete]
    example: {"uri": "oxplow:oxplow/work_item?id=tsk12&provider=oxplow"}
  - name: work_item.link
    summary: "Link a work item to another of the same provider, or to any uri it is about. The uri: (`oxplow:oxplow/collector?collector=triage/hot`, `oxplow:oxplow/effort?id=eff12`, `oxplow:oxplow/file?path=src/a.rs`), by a link type the provider names (oxplow: blocks, relates_to, discovered_from, duplicates, supersedes, replies_to, about). Only an item target must exist; a uri may name something since gone. Undone by work_item.unlink."
    scope: work_items.write
    op: link
    needs: [work_items.links]
    example: {"uri": "oxplow:oxplow/work_item?id=tsk12&provider=oxplow", "target": "oxplow:oxplow/work_item?id=tsk9&provider=oxplow", "link_type": "blocks"}
  - name: work_item.unlink
    summary: "Remove a work item's link (`uri`, `target`, `link_type`, as it was linked). Undone by work_item.link."
    scope: work_items.write
    op: unlink
    needs: [work_items.links]
    example: {"uri": "oxplow:oxplow/work_item?id=tsk12&provider=oxplow", "target": "oxplow:oxplow/work_item?id=tsk9&provider=oxplow", "link_type": "blocks"}
  - name: work_item.move
    summary: "Move a work item to a thread's list or the backlog (at the end, or before/after an item there)."
    scope: work_items.write
    op: move
    needs: [work_items.lists]
    example: {"uri": "oxplow:oxplow/work_item?id=tsk12&provider=oxplow", "to": {"thread": "thr3"}}
  - name: work_item.reorder
    summary: "Put a work item before or after another on its list (neither: at its end)."
    scope: work_items.write
    op: reorder
    needs: [work_items.ordering]
    example: {"uri": "oxplow:oxplow/work_item?id=tsk12&provider=oxplow", "before": "oxplow:oxplow/work_item?id=tsk9&provider=oxplow"}
  - name: work_item.transition
    summary: "Move a work item to a canonical state (todo, in_progress, blocked, done, canceled), optionally naming the provider's own state."
    scope: work_items.write
    op: transition
    example: {"uri": "oxplow:oxplow/work_item?id=tsk12&provider=oxplow", "to": "in_progress"}
  - name: work_item.update
    summary: "Edit a work item's title, body, parent or native fields and, optionally, move it to a state — all in one run (see oxplow.work_item.transition for the state's effects). On oxplow the result carries `link_warnings` for the body's `[[…]]` links."
    scope: work_items.write
    op: update
    example: {"uri": "oxplow:oxplow/work_item?id=tsk12&provider=oxplow", "title": "Fix the login redirect loop", "body": "Reproduces only with a stale session cookie."}
  # worktrees.write
  - name: stream.archive
    summary: "Archive a stream and its threads (`delete_worktree` also removes its working copy from disk). Refused while an agent is running in it. A person is asked first."
    scope: worktrees.write
    op: archive
    confirm: destructive
    example: {"stream": "str2", "delete_worktree": false}
  - name: stream.create
    summary: "Create a stream on a worktree beside the project: of an existing branch (`existing_branch`), of a new one forked from `start_point` (`new_branch`), or adopted from one already on disk (`worktree`). The folder is made from the title."
    scope: worktrees.write
    op: create
    ui: {"label": "New Stream…", "group": "Tasks", "keywords": ["worktree", "branch"], "form": "oxplow:oxplow/page?page=new-stream", "open_after": "oxplow:oxplow/stream?id={{result.id}}"}
    example: {"title": "Login fix", "source": "new", "new_branch": "login-fix", "start_point": "main"}

# What oxplow records itself. The measures and dimensions its producers
# (tokens, efforts, tests, coverage, analysis) and the code collectors write
# facts on, and the metrics over them; the producers' Rust only records the facts.
measures:
  - {"key": "oxplow.complexity", "title": "Cyclomatic complexity", "unit": "count", "subjectKind": "symbol", "temporalSemantics": "semi-additive", "fold": "last", "captureScope": "per-path", "description": "Cyclomatic complexity of a function."}
  - {"key": "oxplow.fn_length", "title": "Function length", "unit": "lines", "subjectKind": "symbol", "temporalSemantics": "semi-additive", "fold": "last", "captureScope": "per-path", "description": "Length of a function, in lines."}
  - {"key": "oxplow.parameter_count", "title": "Parameter count", "unit": "count", "subjectKind": "symbol", "temporalSemantics": "semi-additive", "fold": "last", "captureScope": "per-path", "description": "Number of parameters a function takes."}
  - {"key": "oxplow.coverage", "title": "Line coverage", "unit": "%", "subjectKind": "file", "temporalSemantics": "semi-additive", "fold": "last", "captureScope": "complete", "description": "Share of a file's lines that tests ran."}
  - {"key": "oxplow.test_case", "title": "Test case", "unit": "count", "subjectKind": "test", "temporalSemantics": "semi-additive", "fold": "last", "captureScope": "per-subject", "description": "A test case and how its last run went."}
  - {"key": "oxplow.lint_hit", "title": "Static-analysis hit", "unit": "count", "subjectKind": "file", "temporalSemantics": "semi-additive", "fold": "last", "captureScope": "complete", "description": "One finding of a static-analysis rule."}
  - {"key": "oxplow.tokens", "title": "Agent tokens", "unit": "count", "subjectKind": "model", "temporalSemantics": "additive", "fold": "sum", "captureScope": "complete", "description": "Tokens an agent used, by model."}
  - {"key": "oxplow.cycle_time", "title": "Effort cycle time", "unit": "ms", "subjectKind": "effort", "temporalSemantics": "non-additive", "fold": "sum", "captureScope": "complete", "description": "Time from an effort's start to its finish."}
  - {"key": "oxplow.turn", "title": "Agent turns", "unit": "count", "subjectKind": "model", "temporalSemantics": "additive", "fold": "sum", "captureScope": "complete", "description": "Turns an agent took in a conversation."}
  - {"key": "oxplow.work_item_effort", "title": "Efforts per work item", "unit": "count", "subjectKind": "work_item", "temporalSemantics": "non-additive", "fold": "sum", "captureScope": "complete", "description": "Efforts spent on a work item."}
  - {"key": "oxplow.nudge", "title": "Nudges fired", "unit": "count", "temporalSemantics": "additive", "fold": "sum", "captureScope": "complete", "description": "Nudges that oxplow sent to an agent."}
  - {"key": "oxplow.effort_test_outcome", "title": "Effort test outcome", "unit": "count", "subjectKind": "effort", "temporalSemantics": "non-additive", "fold": "sum", "captureScope": "complete", "description": "A figure of how an effort's tests went, such as runs or failures."}
  - {"key": "oxplow.test_duration", "title": "Test duration", "unit": "ms", "subjectKind": "test", "temporalSemantics": "semi-additive", "fold": "last", "captureScope": "per-subject", "description": "Time a test run took."}
  - {"key": "oxplow.cache_tokens", "title": "Prompt-cache tokens", "unit": "count", "subjectKind": "model", "temporalSemantics": "additive", "fold": "sum", "captureScope": "complete", "description": "Tokens an agent read from or wrote to the model's prompt cache."}
  - {"key": "oxplow.cache_usage", "title": "Prompt-cache hit ratio", "unit": "%", "subjectKind": "model", "temporalSemantics": "non-additive", "fold": "sum", "captureScope": "complete", "description": "Share of an agent's prompt tokens that the cache served."}
  - {"key": "oxplow.effort_tokens", "title": "Effort token spend", "unit": "count", "subjectKind": "effort", "temporalSemantics": "non-additive", "fold": "sum", "captureScope": "complete", "description": "Tokens an agent spent during an effort."}
  - {"key": "oxplow.effort_steering", "title": "Effort steering events", "unit": "count", "subjectKind": "effort", "temporalSemantics": "non-additive", "fold": "sum", "captureScope": "complete", "description": "Times a person steered an agent during an effort."}
  - {"key": "oxplow.effort_time_to_green", "title": "Effort time to green", "unit": "ms", "subjectKind": "effort", "temporalSemantics": "non-additive", "fold": "sum", "captureScope": "complete", "description": "Time from an effort's first red test run to its first green one."}
  - {"key": "oxplow.token_waste", "title": "Reverted-effort token waste", "unit": "count", "subjectKind": "effort", "temporalSemantics": "non-additive", "fold": "sum", "captureScope": "complete", "description": "Tokens spent on an effort that was later reverted."}
  - {"key": "oxplow.coverage.branch", "title": "Branch coverage", "unit": "%", "subjectKind": "file", "temporalSemantics": "semi-additive", "fold": "last", "captureScope": "complete", "description": "Share of a file's branches that tests ran."}
  - {"key": "oxplow.coverage.function", "title": "Function coverage", "unit": "%", "subjectKind": "file", "temporalSemantics": "semi-additive", "fold": "last", "captureScope": "complete", "description": "Share of a file's functions that tests ran."}
dimensions:
  - {"key": "oxplow.language", "label": "Language", "valueType": "categorical", "description": "The programming language of a file."}
  - {"key": "oxplow.severity", "label": "Severity", "valueType": "categorical", "promote": true, "description": "How serious a finding or a diagnostic is."}
  - {"key": "oxplow.status", "label": "Status", "valueType": "categorical", "promote": true, "description": "The state a thing is in, such as passed or failed."}
  - {"key": "oxplow.branch", "label": "Branch", "valueType": "categorical", "description": "The git branch a fact was recorded on."}
  - {"key": "oxplow.model", "label": "Model", "valueType": "categorical", "subjectKind": "model", "description": "The language model that did the work."}
  - {"key": "oxplow.agent", "label": "Agent", "valueType": "categorical", "subjectKind": "agent", "description": "The coding agent that did the work."}
  - {"key": "oxplow.package", "label": "Package", "valueType": "categorical", "description": "The package a file belongs to."}
  - {"key": "oxplow.test_suite", "label": "Test suite", "valueType": "categorical", "description": "The test suite a test belongs to."}
  - {"key": "oxplow.rule", "label": "Rule", "valueType": "categorical", "promote": true, "description": "The rule that raised a finding."}
  - {"key": "oxplow.token_kind", "label": "Token kind", "valueType": "categorical", "promote": true, "description": "The kind of token in source code, such as an identifier or a keyword."}
  - {"key": "oxplow.tests_stat", "label": "Test outcome stat", "valueType": "categorical", "subjectKind": "effort", "promote": true, "description": "Which test figure of an effort a fact holds, such as passed or failed."}
  - {"key": "work.priority", "label": "Priority", "entity": "v_work_item", "expr": "json_extract(e.native, '$.priority')", "description": "The priority of a work item."}
