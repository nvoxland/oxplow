manifest: 2
name: oxplow-foundation
# Its commands are oxplow's own: `oxplow.<area>.<verb>`.
namespace: oxplow
description: oxplow's own commands, declared like any extension's — each backed by an operation of a scope. Required; it can't be disabled.
sharing: shared
engine: ">=0.7"
intent:
  purpose: >-
    Declare oxplow's own commands — what a person, an agent and a lens can
    do to oxplow's records, the repository and the project — over the
    scopes' operations, so nothing about them is special to core.
  origin: null
  examples:
    - name: a person bookmarks a page for their thread
      input: { command: oxplow.bookmark.set, input: { ref: "page:git-dashboard", page_kind: git-dashboard, scope: thread, thread: "thread:thr1" } }
      expect: the page in v_bookmark at the thread's scope, undone by oxplow.bookmark.remove
# The agent harnesses, ACP agents and AI providers oxplow runs: core's
# built-ins, many of each at once (every one declared here is active).
implementations:
  - { capability: agent_harness, id: claude, entry: "oxplow:claude-code", title: Claude }
  - { capability: agent_harness, id: codex, entry: "oxplow:codex-cli", title: Codex }
  - { capability: agent_harness, id: opencode, entry: "oxplow:opencode", title: OpenCode }
  - { capability: agent_harness, id: acp, entry: "oxplow:acp", title: ACP }
  - { capability: acp_adapter, id: claude, entry: "oxplow:acp-adapter", config: { command: claude-agent-acp, systemPrompt: meta } }
  - { capability: acp_adapter, id: gemini, entry: "oxplow:acp-adapter", config: { command: gemini, args: [--acp] } }
  - { capability: acp_adapter, id: codex, entry: "oxplow:acp-adapter", config: { command: codex-acp } }
  # AI providers are scripts a person approves (Settings → Data → Programs).
  - { capability: ai_provider, id: anthropic, title: Anthropic, entry: providers/anthropic.star, config: { baseUrl: "https://api.anthropic.com", ops: [complete, completeTyped, streamTyped] } }
  - { capability: ai_provider, id: openai, title: OpenAI, entry: providers/openai_compatible.star, config: { baseUrl: "https://api.openai.com/v1", ops: [complete, completeTyped, streamTyped] } }
  - { capability: ai_provider, id: openai_compatible, title: An OpenAI-compatible API, entry: providers/openai_compatible.star, config: { ops: [complete, completeTyped, streamTyped] } }
  - { capability: ai_provider, id: openrouter, title: OpenRouter, entry: providers/openrouter.star, config: { baseUrl: "https://openrouter.ai/api/v1", ops: [complete, decide] } }
  - { capability: ai_provider, id: typesafe, title: TypeSafe, entry: providers/typesafe.star, config: { baseUrl: "https://api.typesafe.ai", ops: [decide] } }
collectors:
  # The code metrics: scripts over the snapshot's tree, through the same
  # public surface (`source_files()`, `code_metrics()`, `ast_query()`) any
  # collector has. Each one's metrics name it, so it runs only while one is on.
  - { id: oxplow.todos, doc: "TODO / FIXME markers", runtime: starlark, entry: collectors/code/todos.star, trigger: { on: [snapshot.taken] }, facts: [oxplow.todo] }
  - { id: oxplow.fn_count, doc: "function count", runtime: starlark, entry: collectors/code/fn_count.star, trigger: { on: [snapshot.taken] }, facts: [oxplow.parameter_count] }
  - { id: oxplow.high_complexity_fns, doc: "high-complexity functions", runtime: starlark, entry: collectors/code/high_complexity_fns.star, trigger: { on: [snapshot.taken] }, facts: [oxplow.complexity] }
  - { id: oxplow.long_functions, doc: "long functions (>60 lines)", runtime: starlark, entry: collectors/code/long_functions.star, trigger: { on: [snapshot.taken] }, facts: [oxplow.fn_length] }
  - { id: oxplow.doc_coverage, doc: "Doc coverage", runtime: starlark, entry: collectors/code/doc_coverage.star, trigger: { on: [snapshot.taken] }, facts: [oxplow.doc_coverage] }
  # A whole-tree scan is minutes of CPU on a large tree, and a commit or
  # rebase moves several refs at once: one scan of the latest tree once
  # they settle, on a ref move (`trigger: git_refs`) rather than every save.
  - { id: oxplow.duplicate_lines, doc: "Duplicated lines", runtime: starlark, entry: collectors/code/duplicate_lines.star, whole_tree: true, trigger: { on: [snapshot.taken], where: { trigger: git_refs }, settle: 60s, at_most: 15m }, facts: [oxplow.duplicate_lines] }
  - { id: oxplow.rust.unsafe_blocks, doc: "unsafe blocks", runtime: starlark, entry: collectors/rust/unsafe_blocks.star, trigger: { on: [snapshot.taken] }, facts: [oxplow.ast_hit] }
  - { id: oxplow.rust.unwrap_expect_calls, doc: "unwrap / expect calls", runtime: starlark, entry: collectors/rust/unwrap_expect_calls.star, trigger: { on: [snapshot.taken] }, facts: [oxplow.ast_hit] }
  - { id: oxplow.rust.panic_macros, doc: "panic-family macros", runtime: starlark, entry: collectors/rust/panic_macros.star, trigger: { on: [snapshot.taken] }, facts: [oxplow.ast_hit] }
  - { id: oxplow.ts.any_usage, doc: "any usage", runtime: starlark, entry: collectors/ts/any_usage.star, trigger: { on: [snapshot.taken] }, facts: [oxplow.ast_hit] }
  - { id: oxplow.ts.non_null_assertions, doc: "non-null assertions", runtime: starlark, entry: collectors/ts/non_null_assertions.star, trigger: { on: [snapshot.taken] }, facts: [oxplow.ast_hit] }
  - { id: oxplow.ts.console_calls, doc: "console.* calls", runtime: starlark, entry: collectors/ts/console_calls.star, trigger: { on: [snapshot.taken] }, facts: [oxplow.ast_hit] }
  - { id: oxplow.ts.ts_ignore, doc: "ts-ignore / ts-expect-error", runtime: starlark, entry: collectors/ts/ts_ignore.star, trigger: { on: [snapshot.taken] }, facts: [oxplow.ast_hit] }
  - { id: oxplow.clojure.defn_count, doc: "defn count", runtime: starlark, entry: collectors/clojure/defn_count.star, trigger: { on: [snapshot.taken] }, facts: [oxplow.ast_hit] }
  - { id: oxplow.csharp.empty_catch, doc: "empty catch blocks", runtime: starlark, entry: collectors/csharp/empty_catch.star, trigger: { on: [snapshot.taken] }, facts: [oxplow.ast_hit] }
  - { id: oxplow.csharp.blocking_async_calls, doc: "blocking async calls (.Result / .Wait())", runtime: starlark, entry: collectors/csharp/blocking_async_calls.star, trigger: { on: [snapshot.taken] }, facts: [oxplow.ast_hit] }
  # What an effort's test runs came to, recorded when it finishes: the
  # quality gate, the worst run, the tests it broke, the red runs and the time
  # to the first green (`oxplow.tests.*`, `effort.time_to_green_ms`). Its
  # input is the effort's measured runs (`tests` captures) with their failed
  # cases, oldest first.
  - id: oxplow.effort_test_outcome
    doc: An effort's test outcome, when it finishes.
    runtime: starlark
    entry: collectors/effort/test_outcome.star
    trigger:
      on: [effort.finished]
    input: |
      SELECT r.id AS run,
             COALESCE(r.failed, 0) AS failed,
             (SELECT count(*) FROM v_test_case a WHERE a.run_id = r.id) AS cases,
             CAST(strftime('%s', cap.captured_at) AS INTEGER) * 1000
               + CAST(substr(cap.captured_at, 21, 3) AS INTEGER) AS at_ms,
             'test:' || c.classname || '::' || c.name AS "case",
             e.ref AS effort
      FROM v_capture cap
      JOIN v_test_run r ON r.id = cap.id
      JOIN v_effort e ON e.id = cap.effort_id
      LEFT JOIN v_test_case c ON c.run_id = r.id AND c.status = 'failed'
      WHERE cap.producer = 'tests' AND cap.effort_id = :effort_id
      ORDER BY cap.captured_at, r.id
    facts: [oxplow.effort_test_outcome, oxplow.effort_time_to_green]
metrics:
  # The code metrics. The four behind `v_function` and the TODO count are on
  # by default; the rest are opt-in (`metrics: - use: <key>` in project.yaml).
  - { key: oxplow.todos, title: "TODO / FIXME markers", sourceMeasure: oxplow.todo, aggregation: count, unit: "count", direction: lower-better, displayKind: gauge, category: static-quality, description: "TODO/FIXME/HACK/XXX/BUG markers in comments, across all languages.", sliceableDims: [oxplow.package, oxplow.language, oxplow.vcs_rev], collector: oxplow.todos }
  - { key: oxplow.fn_count, title: "function count", sourceMeasure: oxplow.parameter_count, aggregation: count, unit: "count", direction: neutral, displayKind: gauge, category: static-quality, description: "Total functions / methods defined, across all languages.", sliceableDims: [oxplow.package, oxplow.language, oxplow.vcs_rev], collector: oxplow.fn_count }
  - { key: oxplow.high_complexity_fns, title: "high-complexity functions", sourceMeasure: oxplow.complexity, aggregation: count, filter: { minValue: 11.0 }, unit: "count", direction: lower-better, displayKind: gauge, category: static-quality, description: "Functions whose cyclomatic complexity exceeds the threshold, across all languages.", sliceableDims: [oxplow.package, oxplow.language, oxplow.vcs_rev], collector: oxplow.high_complexity_fns }
  - { key: oxplow.long_functions, title: "long functions (>60 lines)", sourceMeasure: oxplow.fn_length, aggregation: count, filter: { minValue: 61.0 }, unit: "count", direction: lower-better, displayKind: gauge, category: static-quality, description: "Functions longer than 60 lines, across all languages.", sliceableDims: [oxplow.package, oxplow.language, oxplow.vcs_rev], collector: oxplow.long_functions }
  - { key: oxplow.doc_coverage, title: "Doc coverage", sourceMeasure: oxplow.doc_coverage, aggregation: ratio, unit: "%", direction: higher-better, displayKind: coverage, category: coverage, description: "% of public functions/methods carrying a doc comment (or docstring), across all languages.", sliceableDims: [oxplow.package, oxplow.language, oxplow.vcs_rev], collector: oxplow.doc_coverage, default: off }
  - { key: oxplow.duplicate_lines, title: "Duplicated lines", sourceMeasure: oxplow.duplicate_lines, aggregation: sum, unit: "lines", direction: lower-better, displayKind: findings, category: static-quality, description: "Lines in blocks duplicated elsewhere in the tree, both sides of each copy.", sliceableDims: [oxplow.vcs_rev], collector: oxplow.duplicate_lines, default: off }
  - { key: oxplow.rust.unsafe_blocks, title: "unsafe blocks", sourceMeasure: oxplow.ast_hit, aggregation: sum, filter: { dimEq: [oxplow.rule, unsafe_block] }, unit: count, direction: lower-better, displayKind: gauge, category: static-quality, language: rust, description: "Count of `unsafe` blocks in the codebase.", sliceableDims: [oxplow.package, oxplow.language, oxplow.vcs_rev], target: 0.0, collector: oxplow.rust.unsafe_blocks, default: off }
  - { key: oxplow.rust.unwrap_expect_calls, title: "unwrap / expect calls", sourceMeasure: oxplow.ast_hit, aggregation: sum, filter: { dimEq: [oxplow.rule, unwrap_expect] }, unit: count, direction: lower-better, displayKind: gauge, category: static-quality, language: rust, description: "Calls to `.unwrap()` / `.expect()` that can panic at runtime.", sliceableDims: [oxplow.package, oxplow.language, oxplow.vcs_rev], collector: oxplow.rust.unwrap_expect_calls, default: off }
  - { key: oxplow.rust.panic_macros, title: "panic-family macros", sourceMeasure: oxplow.ast_hit, aggregation: sum, filter: { dimEq: [oxplow.rule, panic_macro] }, unit: count, direction: lower-better, displayKind: gauge, category: static-quality, language: rust, description: "Uses of `panic!` / `unreachable!` / `todo!` and similar panic macros.", sliceableDims: [oxplow.package, oxplow.language, oxplow.vcs_rev], collector: oxplow.rust.panic_macros, default: off }
  - { key: oxplow.ts.any_usage, title: "any usage", sourceMeasure: oxplow.ast_hit, aggregation: sum, filter: { dimEq: [oxplow.rule, any_usage] }, unit: count, direction: lower-better, displayKind: gauge, category: static-quality, language: typescript, description: "Uses of the `any` type.", sliceableDims: [oxplow.package, oxplow.language, oxplow.vcs_rev], collector: oxplow.ts.any_usage, default: off }
  - { key: oxplow.ts.non_null_assertions, title: "non-null assertions", sourceMeasure: oxplow.ast_hit, aggregation: sum, filter: { dimEq: [oxplow.rule, non_null_assertion] }, unit: count, direction: lower-better, displayKind: gauge, category: static-quality, language: typescript, description: "Non-null assertions (`!`).", sliceableDims: [oxplow.package, oxplow.language, oxplow.vcs_rev], collector: oxplow.ts.non_null_assertions, default: off }
  - { key: oxplow.ts.console_calls, title: "console.* calls", sourceMeasure: oxplow.ast_hit, aggregation: sum, filter: { dimEq: [oxplow.rule, console_call] }, unit: count, direction: lower-better, displayKind: gauge, category: static-quality, language: typescript, description: "Calls to `console.*`.", sliceableDims: [oxplow.package, oxplow.language, oxplow.vcs_rev], collector: oxplow.ts.console_calls, default: off }
  - { key: oxplow.ts.ts_ignore, title: "ts-ignore / ts-expect-error", sourceMeasure: oxplow.ast_hit, aggregation: sum, filter: { dimEq: [oxplow.rule, ts_ignore] }, unit: count, direction: lower-better, displayKind: gauge, category: static-quality, language: typescript, description: "`@ts-ignore` / `@ts-expect-error` suppressions.", sliceableDims: [oxplow.package, oxplow.language, oxplow.vcs_rev], collector: oxplow.ts.ts_ignore, default: off }
  - { key: oxplow.clojure.defn_count, title: "defn count", sourceMeasure: oxplow.ast_hit, aggregation: sum, filter: { dimEq: [oxplow.rule, defn] }, unit: count, direction: neutral, displayKind: gauge, category: static-quality, language: clojure, description: "Number of `defn` definitions.", sliceableDims: [oxplow.package, oxplow.language, oxplow.vcs_rev], collector: oxplow.clojure.defn_count, default: off }
  - { key: oxplow.csharp.empty_catch, title: "empty catch blocks", sourceMeasure: oxplow.ast_hit, aggregation: sum, filter: { dimEq: [oxplow.rule, empty_catch] }, unit: count, direction: lower-better, displayKind: gauge, category: static-quality, language: csharp, description: "Empty `catch` blocks that swallow exceptions.", sliceableDims: [oxplow.package, oxplow.language, oxplow.vcs_rev], collector: oxplow.csharp.empty_catch, default: off }
  - { key: oxplow.csharp.blocking_async_calls, title: "blocking async calls (.Result / .Wait())", sourceMeasure: oxplow.ast_hit, aggregation: sum, filter: { dimEq: [oxplow.rule, blocking_async] }, unit: count, direction: lower-better, displayKind: gauge, category: static-quality, language: csharp, description: "Blocking calls on async code (`.Result` / `.Wait()`).", sliceableDims: [oxplow.package, oxplow.language, oxplow.vcs_rev], collector: oxplow.csharp.blocking_async_calls, default: off }
  # what oxplow records itself
  - {"key":"agent.tokens.input","title":"Input tokens","sourceMeasure":"oxplow.tokens","aggregation":"sum","filter":{"dimEq":["oxplow.token_kind","input"]},"unit":"tokens","direction":"neutral","displayKind":"gauge","category":"operational","description":"Input tokens consumed by the agent.","sliceableDims":["oxplow.model"]}
  - {"key":"agent.tokens.output","title":"Output tokens","sourceMeasure":"oxplow.tokens","aggregation":"sum","filter":{"dimEq":["oxplow.token_kind","output"]},"unit":"tokens","direction":"neutral","displayKind":"gauge","category":"operational","description":"Output tokens produced by the agent.","sliceableDims":["oxplow.model"]}
  - {"key":"agent.tokens.total","title":"Total tokens","sourceMeasure":"oxplow.tokens","aggregation":"sum","unit":"tokens","direction":"neutral","displayKind":"gauge","category":"operational","description":"Total tokens (input + output) used by the agent.","sliceableDims":["oxplow.model"]}
  - {"key":"agent.tokens.cache_read","title":"Cache-read tokens","sourceMeasure":"oxplow.cache_tokens","aggregation":"sum","filter":{"dimEq":["oxplow.token_kind","cache_read"]},"unit":"tokens","direction":"neutral","displayKind":"gauge","category":"operational","description":"Prompt tokens served from cache instead of re-processed.","sliceableDims":["oxplow.model"]}
  - {"key":"agent.tokens.cache_creation","title":"Cache-write tokens","sourceMeasure":"oxplow.cache_tokens","aggregation":"sum","filter":{"dimEq":["oxplow.token_kind","cache_creation"]},"unit":"tokens","direction":"neutral","displayKind":"gauge","category":"operational","description":"Prompt tokens written into the cache (the cache-warming cost).","sliceableDims":["oxplow.model"]}
  - {"key":"agent.tokens.cache_hit_pct","title":"Cache hit ratio","sourceMeasure":"oxplow.cache_usage","aggregation":"ratio","unit":"%","direction":"higher-better","displayKind":"gauge","category":"operational","description":"Prompt-side cache hit ratio: cache-read / (input + cache-read + cache-write).","sliceableDims":["oxplow.model"]}
  - {"key":"task.tokens","title":"Tokens per effort","sourceMeasure":"oxplow.effort_tokens","aggregation":"avg","unit":"tokens","direction":"lower-better","displayKind":"gauge","category":"operational","description":"Avg tokens (all kinds) a closed effort spent — the cost of a unit of work, in tokens.","sliceableDims":["oxplow.branch","oxplow.effort"]}
  - {"key":"agent.turns","title":"Agent turns","sourceMeasure":"oxplow.turn","aggregation":"sum","unit":"count","direction":"neutral","displayKind":"gauge","category":"operational","description":"Number of agent turns.","sliceableDims":["oxplow.model"]}
  - {"key":"effort.cycle_time_ms","title":"Effort cycle time","sourceMeasure":"oxplow.cycle_time","aggregation":"avg","unit":"ms","direction":"lower-better","displayKind":"gauge","category":"operational","description":"How long an effort stayed open (close minus start).","sliceableDims":["oxplow.branch","oxplow.effort"]}
  - {"key":"work_item.efforts","title":"Efforts per work item","sourceMeasure":"oxplow.work_item_effort","aggregation":"avg","unit":"count","direction":"lower-better","displayKind":"gauge","category":"operational","description":"Number of efforts spent on a work item (the redo-rate signal).","sliceableDims":["oxplow.branch","oxplow.effort"]}
  - {"key":"task.tokens.wasted","title":"Wasted tokens","sourceMeasure":"oxplow.token_waste","aggregation":"sum","unit":"tokens","direction":"lower-better","displayKind":"gauge","category":"operational","description":"Tokens spent in closed efforts whose commits were later reverted.","sliceableDims":["oxplow.branch","oxplow.effort"]}
  - {"key":"task.tokens.wasted_pct","title":"Wasted-token ratio","sourceMeasure":"oxplow.token_waste","aggregation":"ratio","unit":"%","direction":"lower-better","displayKind":"gauge","category":"operational","description":"Share of effort token spend that was later reverted — wasted ÷ all metered spend, across closed efforts.","sliceableDims":["oxplow.branch","oxplow.effort"]}
  - {"key":"task.steering","title":"Steering per effort","sourceMeasure":"oxplow.effort_steering","aggregation":"avg","unit":"per effort","direction":"lower-better","displayKind":"gauge","category":"operational","description":"Avg steering events per closed effort (user prompts + Stop-hook nudges + review comments) — the autonomy number; lower means more autonomous.","sliceableDims":["oxplow.branch","oxplow.effort"]}
  - {"key":"effort.time_to_green_ms","title":"Time to green","sourceMeasure":"oxplow.effort_time_to_green","aggregation":"avg","unit":"ms","direction":"lower-better","displayKind":"gauge","category":"testing","description":"Avg wall-clock from an effort's first red test run to its first green — only efforts that went red and recovered count.","sliceableDims":["oxplow.branch","oxplow.effort"]}
  - {"key":"agent.nudges.fired","title":"Nudges fired","sourceMeasure":"oxplow.nudge","aggregation":"sum","unit":"count","direction":"lower-better","displayKind":"event","category":"operational","description":"Count of nudges fired to the agent.","sliceableDims":["subject","oxplow.branch","oxplow.thread"]}
  - {"key":"oxplow.tests.passed","title":"Tests passed","sourceMeasure":"oxplow.test_case","aggregation":"count","filter":{"dimEq":["oxplow.status","passed"]},"unit":"count","direction":"higher-better","displayKind":"gauge","category":"testing","description":"Known tests currently passing — each test's latest recorded status, unioned across runners.","sliceableDims":["oxplow.branch"]}
  - {"key":"oxplow.tests.failed","title":"Tests failed","sourceMeasure":"oxplow.test_case","aggregation":"count","filter":{"dimEq":["oxplow.status","failed"]},"unit":"count","direction":"lower-better","displayKind":"gauge","category":"testing","description":"Known tests currently failing — each test's latest recorded status, unioned across runners.","sliceableDims":["oxplow.branch"]}
  - {"key":"oxplow.tests.total","title":"Tests total","sourceMeasure":"oxplow.test_case","aggregation":"count","unit":"count","direction":"neutral","displayKind":"gauge","category":"testing","description":"All known tests — union across runners, each counted at its latest recorded status.","sliceableDims":["oxplow.branch"]}
  - {"key":"oxplow.tests.duration_ms","title":"Test suite duration","sourceMeasure":"oxplow.test_duration","aggregation":"sum","unit":"ms","direction":"lower-better","displayKind":"gauge","category":"testing","description":"Total wall-clock time of the known test suite.","sliceableDims":["oxplow.branch"]}
  - {"key":"oxplow.tests.slowest_ms","title":"Slowest test","sourceMeasure":"oxplow.test_duration","aggregation":"max","unit":"ms","direction":"lower-better","displayKind":"gauge","category":"testing","description":"Wall-clock time of the slowest single test.","sliceableDims":["oxplow.branch"]}
  - {"key":"oxplow.tests.failed_at_close","title":"Tests failed at close","sourceMeasure":"oxplow.effort_test_outcome","aggregation":"avg","filter":{"dimEq":["oxplow.tests_stat","at_close"]},"unit":"per effort","direction":"lower-better","displayKind":"gauge","category":"testing","description":"Failing tests in the effort's final run, averaged across closed efforts — did work close green.","sliceableDims":["oxplow.branch"]}
  - {"key":"oxplow.tests.peak_failed","title":"Peak tests failed","sourceMeasure":"oxplow.effort_test_outcome","aggregation":"avg","filter":{"dimEq":["oxplow.tests_stat","peak"]},"unit":"per effort","direction":"lower-better","displayKind":"gauge","category":"testing","description":"Most tests failing in any single run during an effort, averaged across closed efforts.","sliceableDims":["oxplow.branch"]}
  - {"key":"oxplow.tests.distinct_failed","title":"Distinct tests failed","sourceMeasure":"oxplow.effort_test_outcome","aggregation":"avg","filter":{"dimEq":["oxplow.tests_stat","distinct_failed"]},"unit":"per effort","direction":"lower-better","displayKind":"gauge","category":"testing","description":"Distinct tests that went red at least once during an effort, averaged across closed efforts.","sliceableDims":["oxplow.branch"]}
  - {"key":"oxplow.tests.red_runs","title":"Red test runs","sourceMeasure":"oxplow.effort_test_outcome","aggregation":"avg","filter":{"dimEq":["oxplow.tests_stat","red_runs"]},"unit":"per effort","direction":"lower-better","displayKind":"gauge","category":"testing","description":"Test runs with at least one failure during an effort, averaged across closed efforts.","sliceableDims":["oxplow.branch"]}
  - {"key":"oxplow.coverage.abs_pct","title":"Coverage","sourceMeasure":"oxplow.coverage","aggregation":"ratio","unit":"%","direction":"higher-better","displayKind":"coverage","category":"coverage","description":"Whole-report coverage %.","sliceableDims":["oxplow.branch","oxplow.vcs_rev"],"target":80.0,"warnAt":80.0,"failAt":50.0}
  - {"key":"oxplow.coverage.branch_pct","title":"Branch coverage","sourceMeasure":"oxplow.coverage.branch","aggregation":"ratio","unit":"%","direction":"higher-better","displayKind":"coverage","category":"coverage","description":"Whole-report branch coverage %.","sliceableDims":["oxplow.branch","oxplow.vcs_rev"]}
  - {"key":"oxplow.coverage.function_pct","title":"Function coverage","sourceMeasure":"oxplow.coverage.function","aggregation":"ratio","unit":"%","direction":"higher-better","displayKind":"coverage","category":"coverage","description":"Whole-report function/method coverage %.","sliceableDims":["oxplow.branch","oxplow.vcs_rev"]}
  - {"key":"oxplow.coverage.untested_files","title":"Untested files","sourceMeasure":"oxplow.coverage","aggregation":"count","filter":{"maxValue":0},"unit":"count","direction":"lower-better","displayKind":"findings","category":"coverage","description":"Instrumented files with 0% line coverage.","sliceableDims":["oxplow.branch","oxplow.vcs_rev"]}
  - {"key":"oxplow.analysis.errors","title":"Analysis errors","sourceMeasure":"oxplow.lint_hit","aggregation":"count","filter":{"severity":"error"},"unit":"count","direction":"lower-better","displayKind":"gauge","category":"static-quality","description":"Static-analysis errors in the latest run.","sliceableDims":["oxplow.branch","oxplow.vcs_rev"]}
  - {"key":"oxplow.analysis.warnings","title":"Analysis warnings","sourceMeasure":"oxplow.lint_hit","aggregation":"count","filter":{"severity":"warning"},"unit":"count","direction":"lower-better","displayKind":"gauge","category":"static-quality","description":"Static-analysis warnings in the latest run.","sliceableDims":["oxplow.branch","oxplow.vcs_rev"]}
  - {"key":"work.tasks_completed","title":"Tasks completed","entity":"v_work_item","where":"state = 'done'","time":"closed_at","aggregation":"count","unit":"tasks","category":"operational","description":"Work items done, by the day they were closed."}
  - {"key":"work.open_tasks","title":"Open tasks","entity":"v_work_item","where":"state IN ('todo', 'in_progress', 'blocked')","aggregation":"count","unit":"tasks","category":"operational","description":"Work items ready, in progress or blocked, captured over time."}
commands:
  # agent_input.write — the window's; a person's only (oxplow never types for the agent).
  - name: agent.draft
    summary: "Put text in the shown thread's agent input, unsent."
    scope: agent_input.write
    op: draft
    invokers: { human: true, agent: false, lens: true }
  - name: lens.draft_with_agent
    summary: "Start a prompt asking your agent to build a lens, in its input, unsent."
    scope: agent_input.write
    op: draft
    invokers: { human: true, agent: false, lens: false }
    ui: { label: "New Lens with Your Agent…", group: Tasks, input: { text: "Build me an oxplow lens (a page I can open with Cmd+P) that shows " }, when: "threadShown" }
  # agent_sessions.write
