title: Go To (collapsed)
description: The Go To panel collapsed — the same pages as its open view, of the kind its header picks, each as its icon alone.
params:
- name: thread_id
  label: Thread
- name: mode
  role: filter
  label: Show
  default: bookmarks
  options:
  - { value: bookmarks, label: Bookmarks, icon: star }
  - { value: recent, label: Recent, icon: history }
  - { value: top, label: Most visited, icon: activity }
loaders:
  go_to:
    page: oxplow/thread-go-to
    loader: pages
    params: { thread_id: { param: thread_id }, mode: { param: mode } }
view:
  from: go_to
  viz: icons
  columns:
  - key: title
    label: Page
    icon: page_kind
    link:
      kind: page
      from: uri
  empty: Nothing here yet
