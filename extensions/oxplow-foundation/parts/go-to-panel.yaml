title: Go To
description: The thread's bookmarks, the pages it opened last, or the ones it opens most — one kind at a time, picked by the icons in the panel's header.
params:
- name: thread_id
  label: Thread
- name: device_id
# The panel's header toggle: each kind an icon, its label the hover.
- name: mode
  role: filter
  label: Show
  default: bookmarks
  options:
  - { value: bookmarks, label: Bookmarks, icon: star }
  - { value: recent, label: Recent, icon: history }
  - { value: top, label: Most visited, icon: activity }
loaders:
  # Its rows are also the app's Go menu (macOS): it reads `grp`, `title`
  # and `uri`, so keep those names.
  go_to:
    page: oxplow/thread-go-to
    loader: pages
    params: { thread_id: { param: thread_id }, device_id: { param: device_id }, mode: { param: mode } }
view:
  from: go_to
  viz: list
  columns:
  - key: title
    label: Page
    icon: page_kind
    link:
      kind: page
      from: uri
  empty: Nothing here yet
