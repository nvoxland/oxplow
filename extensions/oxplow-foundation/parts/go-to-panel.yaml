title: Go To
description: The pages you bookmarked — this thread's, its stream's and the project's — then the thread's recent or most visited pages.
params:
- name: thread_id
  label: Thread
- name: mode
  role: filter
  label: Show
  default: recent
  options:
  - value: recent
    label: Recent
  - value: top
    label: Most visited
loaders:
  # What the thread sees: the one rule, which the Go To page reads too.
  bookmarks:
    page: oxplow-foundation/thread-bookmarks
    loader: bookmarks
    params: { thread_id: { param: thread_id } }
  # Its rows are also the app's Go menu (macOS): it reads `grp`, `title`
  # and `uri`, so keep those names.
  go_to:
    sql: |
      WITH
      visit AS (
        SELECT page_id AS uri, page_kind, label, visited_at,
               row_number() OVER (PARTITION BY page_id ORDER BY visited_at DESC, id DESC) AS latest
        FROM v_page_visit
        WHERE thread_id = :thread_id AND page_kind <> 'agent_session'
      ),
      recent AS (
        SELECT uri, page_kind, label, row_number() OVER (ORDER BY visited_at DESC) AS ord
        FROM visit WHERE latest = 1
      ),
      top AS (
        SELECT uri, page_kind, label, visits, row_number() OVER (ORDER BY visits DESC, last DESC) AS ord FROM (
          SELECT uri, max(CASE latest WHEN 1 THEN page_kind END) AS page_kind,
                 max(CASE latest WHEN 1 THEN label END) AS label,
                 count(*) AS visits, max(visited_at) AS last
          FROM visit
          WHERE visited_at >= strftime('%Y-%m-%dT%H:%M:%SZ', 'now', '-30 days')
          GROUP BY uri
        )
      ),
      row AS (
        SELECT 0 AS g, row_number() OVER (ORDER BY added_at DESC, id DESC) AS ord,
               'Bookmarks' AS grp, uri, page_kind, title AS label, NULL AS visits
        FROM bookmarks
        UNION ALL
        SELECT 1, ord, 'History', uri, page_kind, label, NULL FROM recent
        WHERE :mode = 'recent' AND ord <= 5
        UNION ALL
        SELECT 1, ord, 'Most visited', uri, page_kind, label, visits FROM top
        WHERE :mode = 'top' AND ord <= 5
      )
      -- A wiki page shows its title now, not the one it had then.
      SELECT r.grp,
             coalesce(nullif(trim(w.title), ''), nullif(trim(r.label), ''), r.uri)
               || CASE WHEN r.visits IS NULL THEN '' ELSE ' · ' || r.visits || '×' END AS title,
             r.page_kind, r.uri
      FROM row r LEFT JOIN v_knowledge_page w ON w.uri = r.uri
      ORDER BY r.g, r.ord
view:
  from: go_to
  viz: list
  group:
    by: grp
  columns:
  - key: title
    label: Page
    icon: page_kind
    link:
      kind: page
      from: uri
  empty: No bookmarks or history yet
