title: Undelivered events
description: "Events a consumer couldn't take, with the consumer of each."
loaders:
  alerts_deliveries:
    sql: |
      SELECT id, consumer, event_type, attempts, last_failed_at, error
      FROM v_event_dead_letter WHERE state = 'pending' ORDER BY id DESC
view:
  from: alerts_deliveries
  viz: table
  columns:
  - key: consumer
    label: Consumer
  - key: event_type
    label: Event
  - key: attempts
    label: Tries
    format: integer
    width: 60
  - key: last_failed_at
    label: When
    format: relative
    width: 130
  - key: error
    label: Error
  empty: Every event was delivered.
  actions:
  - id: retry
    label: Retry
    command: oxplow.delivery.retry
    input:
      id: '{{row.id}}'
    row: true
  - id: discard
    label: Discard
    command: oxplow.delivery.discard
    input:
      id: '{{row.id}}'
    row: true
