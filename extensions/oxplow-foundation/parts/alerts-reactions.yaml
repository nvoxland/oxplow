title: Failed reactions
description: "Effects that failed on an event."
loaders:
  alerts_reactions:
    sql: |
      SELECT r.effect, r.event_id, coalesce(e.type, 'an event') AS event_type,
             -- The extension whose effect it is: the source chip every alert uses.
             json_object('kind', 'extension', 'label', r.effect,
                         'uri', uri('oxplow/extension', 'name', r.extension)) AS source,
             r.attempt || CASE WHEN r.retry_at IS NULL THEN '' ELSE ', tries again by itself' END AS tries,
             coalesce(r.finished_at, r.started_at) AS at,
             r.reason
      FROM v_effect_run r LEFT JOIN v_event e ON e.id = r.event_id
      WHERE r.latest = 1 AND r.state = 'failed' ORDER BY r.id DESC
view:
  from: alerts_reactions
  viz: table
  columns:
  - key: source
    label: Reaction
    format: source
  - key: event_type
    label: Event
  - key: tries
    label: Tries
    width: 160
  - key: at
    label: When
    format: relative
    width: 130
  - key: reason
    label: Why
  empty: No reaction failed.
  actions:
  - id: retry
    label: Retry
    command: oxplow.effect.retry
    input:
      effect: '{{row.effect}}'
      event: '{{row.event_id}}'
    row: true
  - id: retry_all
    label: Retry all
    command: oxplow.effect.retry_all
    input: {}
    all: true
