# The Command data page lists a command's runs from the audit, newest first, narrowed by
# outcome, who ran it and when.
given:
  - { command: oxplow.thread.create, input: { stream: str1, title: One } }
  - { command: oxplow.thread.create, input: { stream: str1, title: Two } }
when:
  page: oxplow/command-data
  params: { uri: "oxplow:oxplow/command?command=oxplow.thread.create" }
expect:
  label: oxplow.thread.create data
  loaders:
    about: { rows: [{ name: oxplow.thread.create }] }
    runs: { rows: 2 }
steps:
  - params: { outcome: failed }
    expect:
      loaders:
        runs: { rows: 0 }
  - params: { who: agent }
    expect:
      loaders:
        runs: { rows: 0 }
  - params: { who: person }
    expect:
      loaders:
        runs: { rows: 2 }
