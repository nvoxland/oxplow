# The Command data page lists a command's runs from the audit, newest first, narrowed by
# outcome, who ran it and when.
given:
  - { command: oxplow.work_item.create, input: { title: One } }
  - { command: oxplow.work_item.create, input: { title: Two } }
when:
  page: oxplow-foundation/command-data
  params: { uri: "oxplow:oxplow/command?command=oxplow.work_item.create" }
expect:
  label: oxplow.work_item.create data
  loaders:
    about: { rows: [{ name: oxplow.work_item.create }] }
    runs: { rows: 2 }
  see_also:
    - { title: Definition, uri: "oxplow:oxplow/command?command=oxplow.work_item.create#oxplow.renderer=oxplow-foundation/command" }
steps:
  - params: { outcome: failed }
    expect:
      loaders:
        runs: { rows: 0 }
  - params: { who: agent }
    expect:
      loaders:
        runs: { rows: 0 }
  - params: { who: person }
    expect:
      loaders:
        runs: { rows: 2 }
