# The Command data page lists runs newest first, including reads and their costs.
given:
  - { command: oxplow.thread.create, input: { stream: str1, title: One } }
  - { command: oxplow.thread.create, input: { stream: str1, title: Two } }
  - command: oxplow.sql.query
    input:
      sql: >
        SELECT run_id FROM v_command_run
        WHERE command = 'oxplow.thread.create'
        ORDER BY id DESC
    bind: writes
when:
  page: oxplow/command-data
  params: { uri: "oxplow:oxplow/command?command=oxplow.thread.create" }
expect:
  label: oxplow.thread.create data
  loaders:
    about: { rows: [{ name: oxplow.thread.create }] }
    runs:
      rows:
        - { run_id: "$writes.rows[0][0]", started_at: $any, version: $any, cpu_ms: $any, changed: 1, extension: null }
        - { run_id: "$writes.rows[1][0]", started_at: $any, version: $any, cpu_ms: $any, changed: 1, extension: null }
steps:
  - params: { outcome: failed }
    expect:
      loaders:
        runs: { rows: 0 }
  - params: { who: agent }
    expect:
      loaders:
        runs: { rows: 0 }
  - params: { who: person }
    expect:
      loaders:
        runs: { rows: 2 }
  - params: { uri: "oxplow:oxplow/command?command=oxplow.sql.query" }
    expect:
      loaders:
        runs:
          rows:
            - { run_id: $any, started_at: $any, version: $any, cpu_ms: $any, changed: 0 }
  - params: { uri: "oxplow:oxplow/command?command=oxplow.sql.query", changed: changed }
    expect:
      loaders:
        runs: { rows: 0 }
