# The Command data page lists a command's runs from the audit, newest first, narrowed by
# outcome, who ran it and when.
given:
  - { command: oxplow.task.create, input: { title: One } }
  - { command: oxplow.task.create, input: { title: Two } }
when:
  page: oxplow/command-data
  params: { uri: "oxplow:oxplow/command?command=oxplow.task.create" }
expect:
  label: oxplow.task.create data
  loaders:
    about: { rows: [{ name: oxplow.task.create }] }
    runs: { rows: 2 }
steps:
  - params: { outcome: failed }
    expect:
      loaders:
        runs: { rows: 0 }
  - params: { who: agent }
    expect:
      loaders:
        runs: { rows: 0 }
  - params: { who: person }
    expect:
      loaders:
        runs: { rows: 2 }
