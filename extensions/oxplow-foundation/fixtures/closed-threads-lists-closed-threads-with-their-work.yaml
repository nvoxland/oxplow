# Closed Threads lists only the stream's closed threads, each with a
# Reopen action.
given:
  - { command: oxplow.thread.create, input: { stream: str1, title: Old }, bind: old }
  - { command: oxplow.thread.create, input: { stream: str1, title: Live } }
  - { command: oxplow.thread.close, input: { thread: $old.id } }
when: { page: closed-threads, params: { stream_id: 1 } }
expect:
  loaders:
    closed_threads: { rows: [{ title: Old, work: "" }] }
  nodes: [{ id: closed_threads, kind: viz, actions: [reopen] }]
