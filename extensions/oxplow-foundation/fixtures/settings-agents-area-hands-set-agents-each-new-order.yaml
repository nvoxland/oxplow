# Agent enablement is independent, with no priority or implicit default.
given:
  - command: oxplow.config.set
    input: { key: oxplow.agents.codex.enabled, value: false, level: project }
when: { page: settings-category, params: { category: agents, setting: oxplow.agents.codex.enabled } }
expect:
  loaders:
    settings:
      rows:
        - { key: oxplow.agents.codex.enabled, value: 'false', project_value: 'false', origin: project }
  nodes:
    - { id: settings-editor, kind: viz, viz: settings }
