# The Measure choices of a dimension's data page, from the declarations: the
# measures about what the dimension describes (its subject kind) first, then
# every other, by title. No "all measures": a dimension's values are counted
# over one measure's facts at a time (Dimension data's default is the first).
when:
  query: oxplow-foundation/dimension-measures
  params: { uri: "oxplow:oxplow/dimension?dimension=oxplow.model" }
expect:
  rows: { contains: [{ value: oxplow.tokens, label: Agent tokens }, { value: oxplow.complexity }] }
