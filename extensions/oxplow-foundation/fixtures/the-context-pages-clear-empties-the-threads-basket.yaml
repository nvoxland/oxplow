# The Context page: its Next prompt section lists what the person collected, and
# Clear This Thread — a whole-page action, bound to the page's `thread_id` —
# empties the thread's own basket through the page-action path.
given:
  - { command: oxplow.context.add, input: { thread: thr1, uri: "oxplow:oxplow/page?page=problems", label: "oxplow:oxplow/page?page=problems" } }
  - { command: oxplow.context.add, input: { thread: thr1, uri: "oxplow:oxplow/page?page=git-history", label: "oxplow:oxplow/page?page=git-history" } }
when: { page: oxplow/context, params: { thread_id: 1 } }
expect: { loaders: { next: { rows: 2 } } }
steps:
  - press: { action: clear }
    expect: { ok: true }
  - expect: { loaders: { next: { rows: 0 } } }
