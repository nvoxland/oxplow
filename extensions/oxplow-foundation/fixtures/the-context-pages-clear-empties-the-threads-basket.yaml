# The Context page: its Waiting section lists what the person collected, and
# Clear — a whole-page action, bound to the page's `thread_id` — empties it
# through the page-action path, leaving what was delivered.
given:
  - { command: oxplow.context.add, input: { thread: thr1, uri: "oxplow:oxplow/page?page=problems", label: "oxplow:oxplow/page?page=problems" } }
  - { command: oxplow.context.add, input: { thread: thr1, uri: "oxplow:oxplow/page?page=git-history", label: "oxplow:oxplow/page?page=git-history" } }
when: { page: oxplow/context, params: { thread_id: 1 } }
expect: { loaders: { waiting: { rows: 2 } } }
steps:
  - press: { action: clear }
    expect: { ok: true }
  - expect: { loaders: { waiting: { rows: 0 } } }
