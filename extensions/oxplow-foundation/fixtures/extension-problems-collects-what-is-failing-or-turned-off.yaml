# The problems page lists failing or disabled contributions under their
# extension, with Start Again; over a quiet project it has none. (The repair
# action belongs to the extension that files repair tasks.)
when:
  page: oxplow/extension-problems
expect:
  loaders:
    problems:
      rows: 0
  nodes:
    - { id: problems, kind: viz, viz: sections, actions: [{ id: enable }, { id: enable-all }] }
