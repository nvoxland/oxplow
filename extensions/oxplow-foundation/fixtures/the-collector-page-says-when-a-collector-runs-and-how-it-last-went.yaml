# A collector page says what it gathers, when it runs, whether it is enabled and how it last went.
when: { page: oxplow-foundation/collector, params: { uri: "oxplow:oxplow/collector?collector=oxplow-foundation/oxplow.effort_test_outcome" } }
expect:
  label: oxplow.effort_test_outcome
  loaders:
    about:
      rows: [{ name: oxplow.effort_test_outcome, extension: oxplow-foundation }]
    facts:
      rows: [{ runs: When the events it listens for happen, enabled: "Yes" }]
