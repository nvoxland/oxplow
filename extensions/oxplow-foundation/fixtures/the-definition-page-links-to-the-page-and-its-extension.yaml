# "See also": a definition links to the page it describes, opened (only a
# page that opens by itself: not one that draws a resource or is hidden)
# and to the extension that declares the page.
when:
  page: oxplow-foundation/definition
  params:
    uri: "oxplow:oxplow/file?path=oxplow-foundation/pages/problems.yaml&filesystem=oxplow:extensions"
    path: oxplow-foundation/pages/problems.yaml
    stream_id: 1
expect:
  see_also:
    - { title: Problems, uri: "oxplow:oxplow/page?page=problems" }
    - { title: oxplow-foundation, uri: "oxplow:oxplow/extension?name=oxplow-foundation" }
steps:
  - params:
      uri: "oxplow:oxplow/file?path=oxplow-foundation/pages/commit.yaml&filesystem=oxplow:extensions"
      path: oxplow-foundation/pages/commit.yaml
    expect:
      see_also:
        - { title: oxplow-foundation, uri: "oxplow:oxplow/extension?name=oxplow-foundation" }
