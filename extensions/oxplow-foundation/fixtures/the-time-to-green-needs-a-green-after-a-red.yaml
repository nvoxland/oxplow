# Red twice and never green again: the outcome counts are made, the time to
# green is not (and a project that is never red has none either, as the
# single-green-run fixture shows).
given:
  - observe:
      turn:
        prompt: Fix the failing tests
        runs:
          - { at: "2026-01-01T00:00:00.005Z", cases: [{ name: a, status: failed }] }
          - { at: "2026-01-01T00:00:00.009Z", cases: [{ name: a, status: failed }] }
when:
  sql: SELECT value FROM v_fact WHERE measure_key = 'oxplow.request_time_to_green'
expect:
  rows: []
steps:
  - when: { sql: "SELECT dims_json, value FROM v_fact WHERE measure_key = 'oxplow.request_test_outcome' ORDER BY dims_json" }
    expect:
      rows:
        - { dims_json: '{"oxplow.tests_stat":"at_close"}', value: 1.0 }
        - { dims_json: '{"oxplow.tests_stat":"distinct_failed"}', value: 1.0 }
        - { dims_json: '{"oxplow.tests_stat":"peak"}', value: 1.0 }
        - { dims_json: '{"oxplow.tests_stat":"red_runs"}', value: 2.0 }
