# Red twice and never green again: the outcome counts are made, the time to
# green is not (and a project that is never red has none either, as the
# single-green-run fixture shows).
given:
  - { command: oxplow.effort.open, input: { thread: thr1 } }
  - observe: { test_run: { effort: eff1, at: "2026-01-01T00:00:00.005Z", cases: [{ name: a, status: failed }] } }
  - observe: { test_run: { effort: eff1, at: "2026-01-01T00:00:00.009Z", cases: [{ name: a, status: failed }] } }
  - observe: { collect: { effort: eff1, collectors: [oxplow.effort_test_outcome] } }
when:
  sql: SELECT value FROM v_fact WHERE measure_key = 'oxplow.effort_time_to_green'
expect:
  rows: []
steps:
  - when: { sql: "SELECT dims_json, value FROM v_fact WHERE measure_key = 'oxplow.effort_test_outcome' ORDER BY dims_json" }
    expect:
      rows:
        - { dims_json: '{"oxplow.tests_stat":"at_close"}', value: 1.0 }
        - { dims_json: '{"oxplow.tests_stat":"distinct_failed"}', value: 1.0 }
        - { dims_json: '{"oxplow.tests_stat":"peak"}', value: 1.0 }
        - { dims_json: '{"oxplow.tests_stat":"red_runs"}', value: 2.0 }
