# The Resource data page lists the instances of a kind: the rows of the dataset it resolves to.
when:
  page: oxplow/resource-data
  params: { uri: "oxplow:oxplow/resource?resource=oxplow/stream" }
expect:
  label: Stream data
  loaders:
    resolved: { rows: [{ view: v_stream }] }
    instances: { rows: 1 }
