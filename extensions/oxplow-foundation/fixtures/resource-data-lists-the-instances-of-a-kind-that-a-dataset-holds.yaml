# The Resource data page lists the instances of a kind: the rows of the dataset it resolves to.
when:
  page: oxplow-foundation/resource-data
  params: { uri: "oxplow:oxplow/resource?resource=oxplow-foundation/stream" }
expect:
  label: Stream data
  loaders:
    resolved: { rows: [{ view: v_stream }] }
    instances: { rows: 1 }
  see_also:
    - { title: Explore Data, uri: "oxplow:oxplow/page?dataset=v_stream&page=explore-data" }
