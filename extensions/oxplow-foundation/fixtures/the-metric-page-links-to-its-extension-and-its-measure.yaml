# "See also": a metric links to the extension it comes from and the measure
# it is built on; one built on no measure links to no
# measure.
when:
  page: oxplow-foundation/metric
  params: { metric: agent.tokens.total }
expect:
  see_also:
    - { title: oxplow-foundation, uri: "oxplow:oxplow/extension?name=oxplow-foundation" }
    - { title: Agent tokens, uri: "oxplow:oxplow/measure?measure=oxplow.tokens" }
steps:
  - params: { metric: work.tasks_completed }
    expect:
      see_also:
        - { title: oxplow-foundation, uri: "oxplow:oxplow/extension?name=oxplow-foundation" }
