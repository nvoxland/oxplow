# "See also": the page links to the extension that declares it.
requires: [oxplow-bundled]
when:
  page: oxplow/skill
  params:
    uri: "oxplow:oxplow/skill?skill=oxplow/track-work"
expect:
  see_also:
    contains:
      - { title: oxplow-bundled, uri: "oxplow:oxplow/extension?name=oxplow-bundled" }
