# "See also": a resource kind a dataset holds links to its data; a kind none holds does not.
when:
  page: oxplow-foundation/resource
  params: { uri: "oxplow:oxplow/resource?resource=oxplow-foundation/stream" }
expect:
  see_also:
    contains:
      - { title: Data, uri: "oxplow:oxplow/resource?resource=oxplow-foundation/stream#oxplow.renderer=oxplow-foundation/resource-data" }
steps:
  - params: { uri: "oxplow:oxplow/resource?resource=oxplow-foundation/file" }
    expect:
      see_also:
        - { title: oxplow-foundation, uri: "oxplow:oxplow/extension?name=oxplow-foundation" }
