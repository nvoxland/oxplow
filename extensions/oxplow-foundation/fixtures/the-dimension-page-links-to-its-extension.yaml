# "See also": the page links to the extension that declares it.
when:
  page: oxplow-foundation/dimension
  params:
    uri: "oxplow:oxplow/dimension?dimension=oxplow.language"
expect:
  see_also:
    contains:
      - { title: oxplow-foundation, uri: "oxplow:oxplow/extension?name=oxplow-foundation" }
      - { title: Data, uri: "oxplow:oxplow/dimension?dimension=oxplow.language#oxplow.renderer=oxplow-foundation/dimension-data" }
