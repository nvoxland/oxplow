# A session's `tasks` column names the tasks the requests of its turns
# worked on, in the order they were first worked on.
requires: [oxplow-bundled]
given:
  - { command: oxplow.agent_session.open, input: { thread: thr1, harness: claude }, bind: ses }
  - { command: oxplow.task.create, input: { title: First task }, bind: one }
  - { command: oxplow.task.create, input: { title: Second task }, bind: two }
  - observe:
      turn:
        session: $ses.id
        prompt: do one
        during:
          - { command: oxplow.task.transition, input: { uri: $one.uri, to: in_progress }, as: agent }
  - observe:
      turn:
        session: $ses.id
        prompt: do two
        during:
          - { command: oxplow.task.transition, input: { uri: $two.uri, to: in_progress }, as: agent }
when: { page: oxplow/thread-sessions, params: { thread: thr1 } }
expect:
  loaders:
    thread_sessions:
      rows:
        - { harness: claude, tasks: "First task; Second task" }
