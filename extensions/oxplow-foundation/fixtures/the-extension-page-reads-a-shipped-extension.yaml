# An extension that ships with oxplow, in words: the same facts as the
# Extensions page (where it comes from, its version, its permissions, its
# problems), its pages with a link to each Definition, a table per kind of its other contributions, and its deployments. The page's actions are the ones its row allows.
when:
  page: oxplow-foundation/extension
  params:
    uri: "oxplow:oxplow/extension?name=oxplow-foundation"
    name: oxplow-foundation
expect:
  label: oxplow-foundation
  loaders:
    about_facts:
      rows:
        - { origin_text: Shipped with oxplow, origin_target: null, version_text: $any, permission_items: $any, manifest: Read its running extension.yaml }
    pages:
      rows:
        contains:
          - { title: Commit, definition: $any }
  nodes:
    - { id: about, kind: viz }
    - { id: pages, kind: viz }
    - { id: commands, kind: viz }
    - { id: deployments, kind: viz }
    - { id: runs, kind: slot }
