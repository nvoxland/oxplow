# An extension that ships with oxplow, in words: where it comes from, what
# runs, what it may reach, its pages with a link to each Definition, and its
# deployments. The page's actions are the ones its row allows.
when:
  page: oxplow-foundation/extension
  params:
    uri: "oxplow:oxplow/extension?name=oxplow-foundation"
    name: oxplow-foundation
expect:
  label: oxplow-foundation
  loaders:
    about_facts:
      rows:
        - { origin_text: Ships with oxplow., manifest: Read its running extension.yaml }
    permissions:
      rows:
        contains:
          - { text: "Read your project's data with SQL." }
    pages:
      rows:
        contains:
          - { title: Commit, definition: $any }
  nodes:
    - { id: about, kind: viz }
    - { id: pages, kind: viz }
    - { id: permissions, kind: viz }
    - { id: deployments, kind: viz }
    - { id: runs, kind: slot }
