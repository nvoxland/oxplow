# The state a work item can be moved to are the five, each with the plain
# name a person reads, not the stored value.
when: { page: oxplow-foundation/work-item-states }
expect:
  loaders:
    work_item_states:
      rows:
        - { value: todo, label: To Do }
        - { value: in_progress, label: In Progress }
        - { value: blocked, label: Blocked }
        - { value: done, label: Done }
        - { value: canceled, label: Canceled }
