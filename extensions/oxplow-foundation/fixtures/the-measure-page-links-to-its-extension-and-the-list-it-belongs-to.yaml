# "See also": the page links to the extension that declares it and to the page that lists measures.
when:
  page: oxplow-foundation/measure
  params:
    uri: "oxplow:oxplow/measure?measure=oxplow.tokens"
expect:
  see_also:
    contains:
      - { title: oxplow-foundation, uri: "oxplow:oxplow/extension?name=oxplow-foundation" }
      - { title: Metrics, uri: "oxplow:oxplow/page?page=metrics-recorded" }
