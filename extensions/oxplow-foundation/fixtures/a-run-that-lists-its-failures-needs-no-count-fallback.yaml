# A report that names its failing tests is counted by the names it lists, not
# by the failure count it also asserts.
given:
  - observe:
      turn:
        prompt: Fix the failing tests
        runs:
          - { at: "2026-01-01T00:00:00.100Z", asserted_failed: 2, cases: [{ name: a, status: failed }] }
          - { at: "2026-01-01T00:00:00.200Z", cases: [{ name: a, status: passed }] }
when:
  sql: SELECT dims_json, value FROM v_fact WHERE measure_key = 'oxplow.request_test_outcome' ORDER BY dims_json
expect:
  rows:
    - { dims_json: '{"oxplow.tests_stat":"at_close"}', value: 0.0 }
    - { dims_json: '{"oxplow.tests_stat":"distinct_failed"}', value: 1.0 }
    - { dims_json: '{"oxplow.tests_stat":"peak"}', value: 1.0 }
    - { dims_json: '{"oxplow.tests_stat":"red_runs"}', value: 1.0 }
