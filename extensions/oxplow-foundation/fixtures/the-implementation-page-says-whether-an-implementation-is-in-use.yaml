# An implementation page says which capability it implements, whether it is in use and what it can do.
when: { page: oxplow/implementation, params: { uri: "oxplow:oxplow/implementation?implementation=oxplow/knowledge.oxplow" } }
expect:
  label: oxplow's wiki
  loaders:
    about:
      rows: [{ name: "oxplow's wiki", extension: oxplow-foundation }]
    facts:
      rows: [{ capability: Knowledge, in_use: "Yes, this one is in use" }]
