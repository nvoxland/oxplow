# An implementation page says which capability it implements, whether it is in use and what it can do.
when: { page: oxplow/implementation, params: { uri: "oxplow:oxplow/implementation?implementation=oxplow/agent_harness.claude" } }
expect:
  label: Claude
  loaders:
    about:
      rows: [{ name: Claude, extension: oxplow-foundation }]
    facts:
      rows: [{ capability: Agent harness, in_use: "Yes, this one is in use" }]
