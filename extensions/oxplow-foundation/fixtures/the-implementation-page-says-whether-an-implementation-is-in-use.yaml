# An implementation page says which capability it implements, whether it is in use and what it can do.
when: { page: oxplow/implementation, params: { uri: "oxplow:oxplow/implementation?implementation=oxplow/task_tracker.oxtask" } }
expect:
  label: oxtask
  loaders:
    about:
      rows: [{ name: "oxtask", extension: oxplow-foundation }]
    facts:
      rows: [{ capability: Task tracker, in_use: "Yes, this one is in use" }]
