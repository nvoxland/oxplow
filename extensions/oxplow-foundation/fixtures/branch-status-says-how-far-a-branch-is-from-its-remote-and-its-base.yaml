# How far a stream's branch is from its upstream and, on a worktree, from
# the default branch: the Branch part's one row (`status`), and the
# comparisons in one line as coloured marks (↑ what the other lacks, ↓ what
# it has). A branch with no upstream says why.
given:
  - observe: { turn: { prompt: base, write: { path: base.txt, body: "x\n" } } }
  - { command: oxplow.vcs.stage, input: { stream: str1, paths: [base.txt] } }
  - { command: oxplow.vcs.commit, input: { stream: str1, message: base } }
  - { command: oxplow.vcs.checkout_branch, input: { stream: str1, name: feat, create: true } }
  - observe: { turn: { prompt: feature, write: { path: feat.txt, body: "f\n" } } }
  - { command: oxplow.vcs.stage, input: { stream: str1, paths: [feat.txt] } }
  - { command: oxplow.vcs.commit, input: { stream: str1, message: feature }, bind: feature }
  - { command: oxplow.vcs.checkout_branch, input: { stream: str1, name: main, create: false } }
  - observe: { turn: { prompt: more, write: { path: main.txt, body: "m\n" } } }
  - { command: oxplow.vcs.stage, input: { stream: str1, paths: [main.txt] } }
  - { command: oxplow.vcs.commit, input: { stream: str1, message: more }, bind: more }
  - { command: oxplow.stream.create, input: { title: Feat, source: existing, existing_branch: feat }, bind: feat }
  - observe:
      refs:
        branches:
          - { name: main, head: $more.rev, stream: 1, default: true, upstream: origin/main, ahead: 2, behind: 1 }
          - { name: origin/main, kind: remote, head: $more.rev }
          - { name: feat, head: $feature.rev, stream: 2 }
# The worktree: not pushed yet (there is a remote), one commit each way from
# the default branch it is a worktree of.
when: { query: "oxplow/branch-status#line", params: { stream_id: 2 } }
expect:
  rows:
    - sync: '[{"text":"Not pushed yet","tone":"muted","hint":"the branch has no upstream"},{"text":"worktree of main","tone":"muted","hint":"the default branch this worktree is compared with","gap":true},{"text":"↑1","tone":"success","hint":"1 commit main lacks"},{"text":"↓1","tone":"warning","hint":"1 commit from main"}]'
steps:
  - when: { query: "oxplow/branch-status#status", params: { stream_id: 2 } }
    expect:
      rows:
        - { branch: feat, heading: Worktree of main, remote: Not pushed yet, can_publish: 1, on_worktree: 1, ahead_says: 1 commit main lacks, behind_says: 1 commit from main }
  # The Branch part's facts: each comparison as its marks.
  - when: { query: "oxplow/branch-status#facts", params: { stream_id: 2 } }
    expect:
      rows:
        - remote_marks: '[{"text":"Not pushed yet","tone":"muted","hint":"the branch has no upstream"}]'
          base_marks: '[{"text":"main","tone":"muted","hint":"the default branch this worktree is compared with"},{"text":"↑1","tone":"success","hint":"1 commit main lacks"},{"text":"↓1","tone":"warning","hint":"1 commit from main"}]'
  # The main stream: its upstream only (it is no worktree).
  - when: { query: "oxplow/branch-status#line", params: { stream_id: 1 } }
    expect:
      rows:
        - sync: '[{"text":"origin/main","tone":"muted","hint":"the upstream"},{"text":"↑2","tone":"success","hint":"2 commits origin/main lacks"},{"text":"↓1","tone":"warning","hint":"1 commit from origin/main"}]'
  - when: { query: "oxplow/branch-status#status", params: { stream_id: 1 } }
    expect:
      rows:
        - { branch: main, heading: Repository, remote: "2 ahead of, 1 behind origin/main", has_upstream: 1, can_push: 1, on_worktree: 0 }
  - when: { query: "oxplow/branch-status#facts", params: { stream_id: 1 } }
    expect:
      rows:
        - remote_marks: '[{"text":"origin/main","tone":"muted","hint":"the upstream"},{"text":"↑2","tone":"success","hint":"2 commits origin/main lacks"},{"text":"↓1","tone":"warning","hint":"1 commit from origin/main"}]'
          base_marks: null
