# Registry metadata supplies the category and every row names an explicit write level.
when: { page: settings, params: { q: oxplow.snapshots.retentionDays } }
expect:
  loaders:
    settings_values:
      rows:
        - key: oxplow.snapshots.retentionDays
          grp: snapshots
          source: default
steps:
  - given:
      - command: oxplow.config.set
        input: { key: oxplow.snapshots.retentionDays, value: 14, level: local }
        confirmed: true
  - expect:
      loaders:
        settings_values:
          rows: [{ key: oxplow.snapshots.retentionDays, source: local, value: '14' }]
  - params: { q: no such setting anywhere }
    expect: { loaders: { settings_values: { rows: 0 } } }
