# The full registry inventory supplies metadata, effective source and level overrides.
when: { page: settings, params: { q: oxplow.snapshots.retentionDays } }
expect:
  loaders:
    settings_values:
      rows:
        - key: oxplow.snapshots.retentionDays
          category: snapshots
          origin: default
steps:
  - given:
      - command: oxplow.config.set
        input: { key: oxplow.snapshots.retentionDays, value: 14, level: local }
        confirmed: true
  - expect:
      loaders:
        settings_values:
          rows: [{ key: oxplow.snapshots.retentionDays, origin: local, value: '14', local_status: set }]
  - params: { q: no such setting anywhere }
    expect: { loaders: { settings_values: { rows: 0 } } }
