# A thread's settings page: its prompt form starts from the saved prompt and
# names the thread by its ref (which the command takes); it lists the
# thread's open agent sessions, and nothing for a thread that isn't there; the
# page's row names its tab.
given:
  - { command: oxplow.thread.set_prompt, input: { thread: thr1, prompt: Be brief. } }
  - { command: oxplow.agent_session.open, input: { thread: thr1, harness: claude } }
input: { page: thread-settings, params: { thread: thr1 } }
expect:
  loaders:
    # The page's row names its tab.
    row: { rows: [{ title: Thread }] }
    prompt: { rows: [{ thread: thr1, prompt: Be brief. }] }
    sessions: { rows: [{ uri: "oxplow:oxplow/agent_session?id=ses1" }] }
steps:
  - params: { thread: thr999 }
    expect: { loaders: { sessions: { rows: 0 } } }
