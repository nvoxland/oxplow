given:
- command: oxplow.config.set
  input:
    key: oxplow.ai.openrouter.enabled
    value: true
    level: global
- command: oxplow.config.set
  input:
    key: oxplow.ai.openrouter.apiKey
    value: sk-secret-123
    level: global
- command: oxplow.config.set
  input:
    key: oxplow.ai.roles.summarize
    value:
      provider: openrouter
      model: m1
      restrict:
      - tools
    level: project
when:
  page: management
  params:
    area: ai
expect:
  loaders:
    ai_providers:
      columns:
      - id
      - kind
      - base_url
      - key
      - test_model
      rows:
      - id: fixture
      - id: openrouter
        kind: OpenRouter
        key: Key saved
        test_model: m1
    ai_roles:
      columns:
      - role
      - description
      - bound
      - problem
      - provider
      - model
      - restrict
      - can_assign
      - can_unassign
      rows:
      - role: main
      - role: summarize
        bound: openrouter · m1
        restrict: '["tools"]'
      - role: decide
      - role: assistant
    ai_calls:
      rows: 0
steps:
- given:
  - command: oxplow.config.unset
    input:
      key: oxplow.ai.roles.summarize
      level: project
- expect:
    loaders:
      ai_roles:
        rows:
          contains:
          - role: summarize
            bound: fixture · fixture
