# `viz: sections` with `group:`: the Extension page gives each contribution
# besides its pages a subsection under its kind's plural name: its human
# name as the title, its description from its own dataset as the body, and
# a link to the page that draws it (a metric's page; none for a command).
# A command's summary, a skill's description and a component's sentence
# come from v_command, v_skill and v_custom_component.
when:
  page: oxplow-foundation/extension
  params:
    uri: "oxplow:oxplow/extension?name=oxplow-foundation"
    name: oxplow-foundation
expect:
  nodes:
    - { id: contributions, kind: viz, viz: sections }
  loaders:
    contributions:
      rows:
        contains:
          - { grp: Commands, title: oxplow.agent.draft, body: $any, link: null }
          - { grp: Skills, body: $any }
          - { grp: Custom components, body: $any }
          - { grp: Metrics, title: Nudges fired, body: Count of nudges fired to the agent., link: "oxplow:oxplow/metric?metric=agent.nudges.fired" }
          - { grp: Measures, title: Nudges fired }
          - { grp: Dimensions, title: Agent }
          - { grp: Implementations, title: Claude }
  text: { contains: ["Metrics", "Count of nudges fired to the agent."] }
