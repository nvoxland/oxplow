# A throwaway oxplow runs with no host, as a daemon run alone does: the
# Devices page says no device can reach it, lists no device, and its
# settings form starts from what is saved (nothing: other devices off).
when: { page: oxplow/devices, params: {} }
expect:
  label: Devices
  loaders:
    standing:
      rows:
        - { other_devices: "No host runs for this oxplow, so no device can reach it.", open_at: null, port: "7400" }
    pairing:
      rows: []
    devices:
      rows: []
    settings:
      rows:
        - { allow_other_devices: 0, address: "", port: null, names: "", tls_cert: "", tls_key: "" }
