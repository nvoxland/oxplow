# What a thing is, is a paragraph under the About heading, above its facts
# (the node's `lead:`), not a "What it is" row and not a section of its own.
when:
  page: oxplow/dataset-definition
  params:
    uri: "oxplow:oxplow/dataset?dataset=work_item"
expect:
  nodes:
    - { id: about, kind: viz, viz: detail }
  text: { contains: ["## About [node about]\n\nThe active work list's items \u2014 the work-"] }
