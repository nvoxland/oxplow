given:
  - command: oxplow.config.set
    input: { key: oxplow.agents.opencode.model, value: shared-model, level: project }
  - command: oxplow.config.set
    input: { key: oxplow.agents.opencode.model, value: private-model, level: local }
when: { page: settings-category, params: { category: agents, setting: oxplow.agents.opencode.model } }
expect:
  loaders:
    settings:
      rows:
        - { key: oxplow.agents.opencode.model, value: '"private-model"', project_value: '"shared-model"', local_value: '"private-model"', origin: local }
