# "See also": a wiki page links to the Wiki and to the work items that link
# to it by [[slug]].
given:
  - { command: oxplow.knowledge.write_page, input: { slug: otters, title: Otters, body: "# Otters\n" } }
  - { command: oxplow.work_item.create, input: { title: Feed the otters, body: "See [[otters]].", thread: thr1 } }
when: { page: wiki-page, params: { uri: "oxplow:oxplow/wiki?slug=otters", slug: otters } }
expect:
  see_also:
    - { title: Wiki, uri: "oxplow:oxplow/page?page=wiki-index" }
    - { title: Feed the otters, uri: "oxplow:oxplow/work_item?id=tsk1&provider=oxplow" }
