# The Collector data page shows what a collector recorded: the rows its last run
# counted and, for a fact collector, the facts of the captures made under its id.
given:
  - observe: { turn: { prompt: Fix a, runs: [{ at: "2026-01-01T00:00:01Z", cases: [{ name: a, status: failed }, { name: b, status: passed }] }] } }
when:
  page: oxplow/collector-data
  params: { uri: "oxplow:oxplow/collector?collector=oxplow/oxplow.request_outcome", range: all }
expect:
  label: oxplow.request_outcome data
  loaders:
    about: { rows: [{ name: oxplow.request_outcome, last_outcome: ok }] }
    recorded: { rows: { contains: [{ measure_key: oxplow.request_test_outcome }] } }
