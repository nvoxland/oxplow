# What to pick up next on a thread's list: ready items in list order, an
# open blocker holding one until it closes, and a ready epic first coming
# with its ready descendants as one unit.
# (Oxplow's own work list, effort policy and wiki are bundled's.)
requires: [oxplow-bundled]
when: { page: work-next, params: { thread: thr1 } }
steps:
  - expect: { loaders: { work_next: { rows: 0 } } }
  - given:
      - { command: oxplow.work_item.create, input: { title: a, thread: thr1 }, bind: a }
      - { command: oxplow.work_item.create, input: { title: b, thread: thr1, state: blocked } }
      - { command: oxplow.work_item.create, input: { title: c, thread: thr1 } }
  - expect: { loaders: { work_next: { rows: [{ title: a, role: ready }, { title: c, role: ready }] } } }
    bind: { c: 'loaders.work_next.rows[1].uri' }
  # An open blocker holds a; a closed one doesn't.
  - given:
      - { command: oxplow.work_item.create, input: { title: z }, bind: z }
      - { command: oxplow.work_item.link, input: { uri: $z.uri, target: $a.uri, link_type: blocks } }
  - expect: { loaders: { work_next: { rows: [{ title: c, role: ready }] } } }
  - given: [{ command: oxplow.work_item.transition, input: { uri: $z.uri, to: done } }]
  - expect: { loaders: { work_next: { rows: [{ title: a, role: ready }, { title: c, role: ready }] } } }
  # c is next, and becomes an epic once it has children.
  - given:
      - { command: oxplow.work_item.transition, input: { uri: $a.uri, to: done } }
      - { command: oxplow.work_item.create, input: { title: x, thread: thr1 }, bind: x }
      - { command: oxplow.work_item.transition, input: { uri: $x.uri, to: in_progress } }
      - { command: oxplow.work_item.create, input: { title: c1, thread: thr1, parent_uri: $c }, bind: c1 }
      - { command: oxplow.work_item.create, input: { title: c2, thread: thr1, parent_uri: $c, state: done } }
      - { command: oxplow.work_item.create, input: { title: g, thread: thr1, parent_uri: $c1.uri } }
      - { command: oxplow.work_item.create, input: { title: y, thread: thr1 } }
  - expect:
      loaders:
        work_next: { rows: [{ title: c, role: epic }, { title: c1, role: child }, { title: g, role: child }] }
