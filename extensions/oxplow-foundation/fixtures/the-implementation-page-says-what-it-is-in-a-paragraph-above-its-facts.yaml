# What a thing is, is a paragraph under the About heading, above its facts
# (the node's `lead:`), not a "What it is" row and not a section of its own.
when:
  page: oxplow/implementation
  params:
    uri: "oxplow:oxplow/implementation?implementation=oxplow/knowledge.oxwiki"
expect:
  nodes:
    - { id: about, kind: viz, viz: detail }
  text: { contains: ["## About [node about]\n\noxplow's own knowledge store: a wiki of markdown pages kept in the project's .oxplow/oxwiki folder."] }
