when:
  page: oxplow/management
  params:
    area: integrations
expect:
  loaders:
    capabilities:
      rows:
        contains:
        - capability: snapshots
          provider: ''
          is_default: 1
        - capability: snapshots
          provider: hashes
          can_choose: 1
steps:
- given:
  - command: oxplow.config.set
    input:
      key: oxplow.activeProviders.snapshots
      value: hashes
      level: project
- when:
    sql: SELECT provider, chosen_by FROM v_capability_provider WHERE capability =
      'snapshots' AND active = 1
  expect:
    rows:
    - provider: hashes
      chosen_by: project
- given:
  - command: oxplow.config.unset
    input:
      key: oxplow.activeProviders.snapshots
      level: project
- when:
    sql: SELECT provider, chosen_by FROM v_capability_provider WHERE capability =
      'snapshots' AND active = 1
  expect:
    rows:
    - provider: oxplow
      chosen_by: default
