# A turn's end take is labelled with the tasks its request worked on:
# "completed: <task>"; a request that worked on none is "Unlinked work".
requires: [oxplow-bundled]
given:
  - { command: oxplow.task.create, input: { title: Fix it }, bind: item }
  - observe: { turn: { prompt: Chat } }
  - observe: { snapshot: { trigger: turn_end, branch: main, files: [{ path: a.txt, hash: h1 }] } }
  - observe:
      turn:
        prompt: Fix it
        during:
          - { command: oxplow.task.transition, input: { uri: $item.uri, to: in_progress }, as: agent }
  - observe: { snapshot: { trigger: turn_end, branch: main, files: [{ path: a.txt, hash: h2 }] } }
when: { page: oxplow/local-history, params: { stream_id: 1, mode: recent } }
expect:
  loaders:
    recent:
      rows:
        - { subject: "completed: Fix it", why: turn end }
        - { subject: "completed: Unlinked work", why: turn end }
