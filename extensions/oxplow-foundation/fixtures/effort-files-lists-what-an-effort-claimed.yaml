# The files an effort's edits claimed, by path, with how each changed.
given:
  - { command: oxplow.effort.open, input: { thread: thr1 } }
  - observe:
      turn:
        prompt: Make the files
        tools:
          - { name: Edit, kind: edit, paths: [b.rs], ok: true }
          - { name: Edit, kind: edit, paths: [a.rs], ok: true }
when: { page: oxplow/effort-files, params: { effort: eff1 } }
expect:
  loaders:
    effort_files:
      rows:
        - { path: a.rs, source: claimed }
        - { path: b.rs, source: claimed }
