# "See also": the page links to the extension that declares it and to the page that lists collectors.
when:
  page: oxplow-foundation/collector
  params:
    uri: "oxplow:oxplow/collector?collector=oxplow-foundation/oxplow.effort_test_outcome"
expect:
  see_also:
    contains:
      - { title: oxplow-foundation, uri: "oxplow:oxplow/extension?name=oxplow-foundation" }
      - { title: Collectors, uri: "oxplow:oxplow/page?page=collectors" }
