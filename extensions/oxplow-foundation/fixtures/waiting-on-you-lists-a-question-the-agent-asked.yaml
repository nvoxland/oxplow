# A thread whose agent put a question to the person is waiting on them, linked to the thread, until a prompt moves it on.
given:
  - { command: oxplow.agent_session.open, input: { thread: thr1, harness: claude } }
  - observe: { turn: { prompt: go, open: true, tools: [{ name: AskUserQuestion, kind: ask, question: "Pick A or B?", pre: true }] } }
when: { page: oxplow/waiting-on-you }
expect:
  loaders:
    waiting_on_me:
      rows: [{ what: Waiting for your answer, title: "Pick A or B?", uri: "oxplow:oxplow/thread?id=thr1" }]
steps:
  - given:
      # The person answers: a new turn starts.
      - observe: { turn: { prompt: A, answer: Done. } }
  - expect: { loaders: { waiting_on_me: { rows: 0 } } }
