              - { title: f6.rs }
              - { title: f5.rs }
              - { title: f4.rs }
              - { title: f3.rs }
              - { title: f2.rs }
              - { title: f1.rs }
              - { title: f0.rs }
      # The collapsed view follows the header's pick.
      collapsed:
        loaders:
          go_to:
            rows: 6
  - when: { choices: { mode: top } }
    expect:
      body:
        loaders:
          go_to:
            rows:
              - { grp: Most visited, title: DEV.md, times: "3×", at: null }
