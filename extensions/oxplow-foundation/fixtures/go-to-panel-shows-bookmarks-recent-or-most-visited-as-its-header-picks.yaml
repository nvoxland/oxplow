# The rail's Go To panel: one kind of page at a time, picked by its header's
# icons — the thread's bookmarks (first), its recent pages (when each was
# opened) or its most visited (how often), 20 at most, so the panel can grow
# to show them all. Collapsed, the first six of them, as icons.
given:
  - { command: oxplow.bookmark.set, input: { uri: "oxplow:oxplow/page?page=git-dashboard", page_kind: git-dashboard, label: Git, scope: thread, thread: thr1 } }
  - { command: oxplow.bookmark.set, input: { uri: "oxplow:oxplow/file?path=a.rs", page_kind: file, label: a.rs, scope: project, thread: thr1 } }
  - observe: { visit: { page: "oxplow:oxplow/file?path=DEV.md", kind: file, label: DEV.md, thread: thr1 } }
  - observe: { visit: { page: "oxplow:oxplow/file?path=DEV.md", kind: file, label: DEV.md, thread: thr1 } }
  - observe: { visit: { page: "oxplow:oxplow/file?path=DEV.md", kind: file, label: DEV.md, thread: thr1 } }
  - observe: { visit: { page: "oxplow:oxplow/page?page=settings", kind: settings, label: Settings, thread: thr1 } }
  - observe: { visit: { page: "oxplow:oxplow/agent_session?id=ses1", kind: agent_session, label: Claude, thread: thr1 } }
  - observe: { visit: { page: "oxplow:oxplow/file?path=f0.rs", kind: file, label: f0.rs, thread: thr1 } }
  - observe: { visit: { page: "oxplow:oxplow/file?path=f1.rs", kind: file, label: f1.rs, thread: thr1 } }
  - observe: { visit: { page: "oxplow:oxplow/file?path=f2.rs", kind: file, label: f2.rs, thread: thr1 } }
  - observe: { visit: { page: "oxplow:oxplow/file?path=f3.rs", kind: file, label: f3.rs, thread: thr1 } }
  - observe: { visit: { page: "oxplow:oxplow/file?path=f4.rs", kind: file, label: f4.rs, thread: thr1 } }
  - observe: { visit: { page: "oxplow:oxplow/file?path=f5.rs", kind: file, label: f5.rs, thread: thr1 } }
  - observe: { visit: { page: "oxplow:oxplow/file?path=f6.rs", kind: file, label: f6.rs, thread: thr1 } }
  - observe: { visit: { page: "oxplow:oxplow/file?path=f7.rs", kind: file, label: f7.rs, thread: thr1 } }
  - observe: { visit: { page: "oxplow:oxplow/file?path=f8.rs", kind: file, label: f8.rs, thread: thr1 } }
  - observe: { visit: { page: "oxplow:oxplow/file?path=f9.rs", kind: file, label: f9.rs, thread: thr1 } }
  - observe: { visit: { page: "oxplow:oxplow/file?path=f10.rs", kind: file, label: f10.rs, thread: thr1 } }
  - observe: { visit: { page: "oxplow:oxplow/file?path=f11.rs", kind: file, label: f11.rs, thread: thr1 } }
  - observe: { visit: { page: "oxplow:oxplow/file?path=f12.rs", kind: file, label: f12.rs, thread: thr1 } }
  - observe: { visit: { page: "oxplow:oxplow/file?path=f13.rs", kind: file, label: f13.rs, thread: thr1 } }
  - observe: { visit: { page: "oxplow:oxplow/file?path=f14.rs", kind: file, label: f14.rs, thread: thr1 } }
  - observe: { visit: { page: "oxplow:oxplow/file?path=f15.rs", kind: file, label: f15.rs, thread: thr1 } }
  - observe: { visit: { page: "oxplow:oxplow/file?path=f16.rs", kind: file, label: f16.rs, thread: thr1 } }
  - observe: { visit: { page: "oxplow:oxplow/file?path=f17.rs", kind: file, label: f17.rs, thread: thr1 } }
  - observe: { visit: { page: "oxplow:oxplow/file?path=f18.rs", kind: file, label: f18.rs, thread: thr1 } }
  - observe: { visit: { page: "oxplow:oxplow/file?path=f19.rs", kind: file, label: f19.rs, thread: thr1 } }
when: { panel: go-to, thread: thr1 }
expect:
  choices: [{ name: mode, value: bookmarks }]
  body:
    loaders:
      go_to:
        rows:
          - { grp: Bookmarks, title: a.rs, uri: "oxplow:oxplow/file?path=a.rs" }
          - { grp: Bookmarks, title: Git, uri: "oxplow:oxplow/page?page=git-dashboard" }
  collapsed:
    loaders:
      go_to:
        rows:
          - { title: a.rs, page_kind: file }
          - { title: Git, page_kind: git-dashboard }
  count: null
steps:
  - when: { choices: { mode: recent } }
    expect:
      choices: [{ name: mode, value: recent }]
      body:
        loaders:
          go_to:
            rows:
              # 20 of the 22 it opened: Settings and DEV.md are older.
              - { grp: Recent, title: f19.rs, times: null }
              - { title: f18.rs }
              - { title: f17.rs }
              - { title: f16.rs }
