# Settings → Data: the entities, the collectors (by who runs them) and the
# effects oxplow's own extensions declare.
input: { page: settings, params: { area: data } }
expect:
  loaders:
    data_entities:
      columns: [name, owner, kind, description]
      rows: $any
    data_sources:
      columns: [uri, collector, extension, id, trigger, state, tone, last_run_at, rows, problem, missing, can_enable_again]
      rows: $any
    data_effects:
      rows:
        - { effect: oxplow-bundled/infer-reasoning }
        - { effect: oxplow-bundled/repair-disabled }
        - { effect: oxplow-bundled/store-reasoning }
        - { effect: oxplow-bundled/verify-unchecked }
