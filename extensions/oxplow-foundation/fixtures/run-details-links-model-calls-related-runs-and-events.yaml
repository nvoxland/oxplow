requires: [oxplow-bundled, oxtask]
model: { replies: ["A contribution needs repair."] }
given:
  - command: oxplow.ai.summarize
    as: agent
    input: { text: "The contribution is disabled after repeated failures." }
  - command: oxplow.sql.query
    input:
      sql: |
        SELECT (SELECT run_id FROM v_command_run WHERE command = 'oxplow.ai.summarize') AS run_id,
               (SELECT uri FROM v_ai_call WHERE role = 'summarize') AS call_uri
    bind: summary
  - observe:
      event:
        type: contribution.disabled
        payload:
          contribution: "oxplow:oxplow/collector?collector=work/hot"
          reason: Repeated failures
  - command: oxplow.sql.query
    input:
      sql: |
        SELECT
          (SELECT run_id FROM v_command_run WHERE command = 'oxplow.command.sequence' AND actor_kind = 'effect') AS run_id,
          (SELECT uri FROM v_effect_run JOIN v_contribution_run USING (run_id)
           WHERE effect = 'oxtask/repair-disabled') AS parent_uri,
          (SELECT uri FROM v_command_run WHERE command = 'oxplow.extension_store.write' AND actor_kind = 'effect') AS child_uri,
          (SELECT uri FROM v_event WHERE type = 'contribution.disabled') AS event_uri
    bind: reaction
when: { part: run-details, params: { run_id: "$summary.rows[0][0]" } }
expect:
  loaders:
    model_calls:
      rows: [{ model: fixture, uri: "$summary.rows[0][1]" }]
steps:
  - params: { run_id: "$reaction.rows[0][0]" }
    expect:
      loaders:
        related_runs:
          rows:
            - { relation: Parent, uri: "$reaction.rows[0][1]" }
            - { relation: Child, uri: "$reaction.rows[0][2]" }
        cause:
          rows: [{ type: contribution.disabled, uri: "$reaction.rows[0][3]" }]
