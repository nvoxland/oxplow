# When a turn of a request ends, the request's test outcome is four counts over
# the runs its turns recorded — red at the close, the peak, the distinct failing tests, the red
# runs — and the time from the first red to the next green. A record-only run
# (a run with no report) counts for none of it.
given:
  - observe:
      turn:
        prompt: Fix the failing tests
        runs:
          - { at: "2026-01-01T00:00:01Z", cases: [{ name: a, status: failed }, { name: b, status: failed }, { name: c, status: passed }] }
          - { at: "2026-01-01T00:00:20Z", producer: test-run, cases: [{ name: a, status: failed }, { name: b, status: failed }, { name: c, status: failed }] }
          - { at: "2026-01-01T00:00:31.500Z", cases: [{ name: a, status: failed }, { name: b, status: passed }] }
          - { at: "2026-01-01T00:01:01.250Z", cases: [{ name: a, status: passed }] }
when:
  sql: SELECT measure_key, dims_json, subject, value, numerator, denominator FROM v_fact WHERE measure_key IN ('oxplow.request_test_outcome', 'oxplow.request_time_to_green') ORDER BY measure_key, dims_json
expect:
  rows:
    - { measure_key: oxplow.request_test_outcome, dims_json: '{"oxplow.tests_stat":"at_close"}', subject: "oxplow:oxplow/request?id=req1", value: 0.0, numerator: 0.0, denominator: 1.0 }
    - { measure_key: oxplow.request_test_outcome, dims_json: '{"oxplow.tests_stat":"distinct_failed"}', value: 2.0, numerator: 2.0, denominator: 1.0 }
    - { measure_key: oxplow.request_test_outcome, dims_json: '{"oxplow.tests_stat":"peak"}', value: 2.0, numerator: 2.0, denominator: 1.0 }
    - { measure_key: oxplow.request_test_outcome, dims_json: '{"oxplow.tests_stat":"red_runs"}', value: 2.0, numerator: 2.0, denominator: 1.0 }
    - { measure_key: oxplow.request_time_to_green, subject: "oxplow:oxplow/request?id=req1", value: 60250.0, numerator: 60250.0, denominator: 1.0 }
steps:
  - when: { sql: "SELECT branch IS NOT NULL AS has_branch FROM v_fact WHERE measure_key = 'oxplow.request_test_outcome' LIMIT 1" }
    expect: { rows: [{ has_branch: 1 }] }
