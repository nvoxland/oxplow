# The uncommitted page makes the stream's working change and lists the
# working tree's files as a tree, an untracked one is an added file, as in the rail and the summary;
# the commit form shows once there are files to commit.
given:
  - observe: { turn: { prompt: base, write: { path: tracked.txt, body: "x\n" } } }
  - { command: oxplow.vcs.stage, input: { stream: str1, paths: [tracked.txt] } }
  - { command: oxplow.vcs.commit, input: { stream: str1, message: base } }
  - observe: { turn: { prompt: change, write: { path: tracked.txt, body: "changed\n" } } }
  - observe: { turn: { prompt: loose, write: { path: loose.txt, body: "n\n" } } }
  - observe: { analyze: { kind: working } }
when: { page: oxplow/uncommitted-changes, params: { stream_id: 1 } }
expect:
  loaders:
    row: { rows: [{ change_id: $any }] }
    files:
      rows:
        contains:
          - { id: tracked.txt, icon: modified }
          - { id: loose.txt, icon: added }
    commit_form: { rows: [{ stream: str1 }] }
steps:
  # The commit form submits for real, and the commit is read back. (The page
  # drawn again after it is the app's: the working change is analyzed again
  # as the files are watched, which a throwaway oxplow does not do.)
  - submit: { node: commit, input: { stream: str1, message: Add the loose file } }
    expect: { ok: true }
  - when: { command: oxplow.vcs.log, input: { stream_id: str1, limit: 1 } }
    expect: { ok: true, result: { revisions: [{ subject: Add the loose file }] } }
