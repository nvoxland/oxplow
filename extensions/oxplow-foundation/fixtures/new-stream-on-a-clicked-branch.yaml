# A click on a branch on New Stream's Branch tab opens Create Stream for it:
# the branch is fixed, the name starts as the branch's and can be changed.
# The stream made, the branch has one, so the tab no longer offers it.
given:
  - observe: { turn: { prompt: base, write: { path: base.txt, body: "x\n" } } }
  - { command: oxplow.vcs.stage, input: { stream: str1, paths: [base.txt] } }
  - { command: oxplow.vcs.commit, input: { stream: str1, message: base }, bind: base }
  - { command: oxplow.vcs.checkout_branch, input: { stream: str1, name: feat, create: true } }
  - { command: oxplow.vcs.checkout_branch, input: { stream: str1, name: main, create: false } }
  - observe:
      refs:
        branches:
          - { name: main, head: $base.rev, stream: 1, default: true }
          - { name: feat, head: $base.rev }
when: { page: new-stream, params: { tab: branch } }
expect:
  loaders:
    branches: { rows: [{ value: feat, branch: feat }] }
steps:
  - press: { action: create, node: branch, row: { value: feat }, input: { title: Feat work } }
    expect: { ok: true }
  - given:
      - observe:
          refs:
            branches:
              - { name: main, head: $base.rev, stream: 1, default: true }
              - { name: feat, head: $base.rev, stream: 2 }
  - when: { page: new-stream, params: { tab: branch } }
    expect:
      loaders:
        branches: { rows: [] }
