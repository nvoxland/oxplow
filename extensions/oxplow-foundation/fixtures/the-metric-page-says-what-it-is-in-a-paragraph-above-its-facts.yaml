# What a thing is, is a paragraph under the About heading, above its facts
# (the node's `lead:`), not a "What it is" row and not a section of its own.
when:
  page: oxplow-foundation/metric
  params:
    uri: "oxplow:oxplow/metric?metric=agent.tokens.total"
    metric: agent.tokens.total
expect:
  nodes:
    - { id: about, kind: viz, viz: detail }
  text: { contains: ["## About [node about]\n\nTotal tokens (input + output) used by th"] }
