given:
- command: oxplow.capability.choose
  input:
    capability: snapshots
    provider: hashes
    level: project
- command: oxplow.capability.choose
  input:
    capability: snapshots
    provider: oxplow
    level: local
when:
  page: management
  params:
    area: integrations
expect:
  loaders:
    capabilities:
      rows:
        contains:
        - capability: snapshots
          provider: hashes
          project_choice: hashes
          local_choice: oxplow
        - capability: snapshots
          provider: oxplow
          project_choice: hashes
          local_choice: oxplow
steps:
- given:
  - command: oxplow.config.unset
    input:
      key: oxplow.activeProviders.snapshots
      level: local
- when:
    sql: SELECT provider, chosen_by FROM v_capability_provider WHERE capability =
      'snapshots' AND active = 1
  expect:
    rows:
    - provider: hashes
      chosen_by: project
- when:
    page: management
    params:
      area: integrations
  expect:
    loaders:
      capabilities:
        rows:
          contains:
          - capability: snapshots
            provider: hashes
            project_choice: hashes
            local_choice: null
