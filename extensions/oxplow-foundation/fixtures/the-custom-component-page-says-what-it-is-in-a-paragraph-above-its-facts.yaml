# What a thing is, is a paragraph under the About heading, above its facts
# (the node's `lead:`), not a "What it is" row and not a section of its own.
when:
  page: oxplow-foundation/custom-component
  params:
    uri: "oxplow:oxplow/custom_component?custom_component=oxplow-foundation/integrations"
expect:
  nodes:
    - { id: about, kind: viz, viz: detail }
  text: { contains: ["## About [node about]\n\nThe Settings area for the instances of e"] }
