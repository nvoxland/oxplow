# Waiting on you raises its alert and counts in its panel's header while
# anything waits on the person: here a question an agent asked.
# (Tasks assigned to the person are the Assigned to you panel's, not counted
# here.)
given:
  - { command: oxplow.agent_session.open, input: { thread: thr1, harness: claude } }
when: { page: oxplow/waiting-on-you }
expect:
  loaders: { waiting_on_me: { rows: 0 } }
  alert: { firing: false }
steps:
  - given:
      - observe: { turn: { prompt: go, open: true, tools: [{ name: AskUserQuestion, kind: ask, question: "Pick A or B?", pre: true }] } }
  - expect:
      loaders: { waiting_on_me: { rows: [{ what: Waiting for your answer, title: "Pick A or B?" }] } }
      alert: { firing: true, message: "Waiting on you: 1" }
  - when: { part: oxplow/waiting-count }
    expect: { badge: 1 }
