# Everything an extension contributes is one table, grouped by kind (pages,
# commands, skills, components, slots, collectors, metrics, measures,
# dimensions, resources, implementations): a row per contribution with its
# name (linking to the page that draws its kind, where the rest of its
# definition is) and what it is in words. The section is always on the
# page; an extension with nothing says so.
when:
  page: oxplow-foundation/extension
  params:
    uri: "oxplow:oxplow/extension?name=oxplow-foundation"
    name: oxplow-foundation
expect:
  nodes:
    - { id: contributions, kind: viz, viz: table }
  loaders:
    contributions:
      rows:
        contains:
          - { kind: Commands, title: oxplow.agent.draft, description: "Put text in the shown thread's agent input, unsent." }
          - { kind: Skills, description: $any }
          - { kind: Custom components, title: Integrations }
          - { kind: Metrics, title: Nudges fired, description: Count of nudges fired to the agent., link: "oxplow:oxplow/metric?metric=agent.nudges.fired" }
          - { kind: Measures, title: Nudges fired }
          - { kind: Dimensions, title: Agent, description: The coding agent that did the work. }
          - { kind: Implementations, title: Claude, description: Runs Claude Code as a coding agent. }
          - { kind: Resources, title: Commit, description: A git commit. }
          - { kind: Collectors, description: "How an effort's tests went, recorded when it finishes." }
  text: { contains: ["Metrics", "Count of nudges fired to the agent."] }
