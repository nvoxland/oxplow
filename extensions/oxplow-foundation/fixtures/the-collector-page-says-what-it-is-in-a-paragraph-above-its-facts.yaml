# What a thing is, is a paragraph under the About heading, above its facts
# (the node's `lead:`), not a "What it is" row and not a section of its own.
when:
  page: oxplow/collector
  params:
    uri: "oxplow:oxplow/collector?collector=oxplow/oxplow.effort_test_outcome"
expect:
  nodes:
    - { id: about, kind: viz, viz: detail }
  text: { contains: ["## About [node about]\n\nHow an effort's tests went, recorded whe"] }
