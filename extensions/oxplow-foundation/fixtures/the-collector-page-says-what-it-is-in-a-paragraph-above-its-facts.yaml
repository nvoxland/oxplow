# markdown section bound to its description), not a "What it is" row.
when:
  page: oxplow-foundation/collector
  params:
    uri: "oxplow:oxplow/collector?collector=oxplow-foundation/oxplow.effort_test_outcome"
expect:
  nodes:
    - { id: description, kind: viz, viz: markdown }
