# The notice that a language's pack is off links to the pack, and Alerts
# offers to turn it on (`oxplow.extension.enable`); another notice offers
# nothing of the kind.
given:
  - observe: { nudge: { kind: oxplow/language-pack, message: "This project has Python files. Turn on the [Python language pack](oxplow:oxplow/extension?name=oxplow-python) to get its symbols, metrics and review signals.", audience: person } }
  - observe: { nudge: { kind: x/muted, message: "Muted x for the agent.", audience: person } }
when: { query: alerts#notices }
expect:
  rows:
    - { pack: null }
    - { pack: oxplow-python }
