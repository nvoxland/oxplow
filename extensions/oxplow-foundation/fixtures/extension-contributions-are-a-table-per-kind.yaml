# Each kind an extension contributes is a top-level table of its own, a row
# per contribution with only its name (linking to the page that draws its
# kind, where the rest of its definition is) and what it is in words. A kind
# the extension doesn't have keeps its table, saying so: the page has one shape.
# Parts and queries are tables of their own, apart from its pages.
when:
  page: oxplow-foundation/extension
  params:
    uri: "oxplow:oxplow/extension?name=oxplow-foundation"
    name: oxplow-foundation
expect:
  nodes:
    - { id: parts, kind: viz, viz: table }
    - { id: queries, kind: viz, viz: table }
    - { id: commands, kind: viz, viz: table }
    - { id: skills, kind: viz, viz: table }
    - { id: components, kind: viz, viz: table }
    - { id: collectors, kind: viz, viz: table }
    - { id: metrics, kind: viz, viz: table }
    - { id: measures, kind: viz, viz: table }
    - { id: dimensions, kind: viz, viz: table }
    - { id: resources, kind: viz, viz: table }
    - { id: implementations, kind: viz, viz: table }
  loaders:
    resource_pages:
      rows:
        contains:
          - { title: Commit, description: $any, link: $any }
    parts: { rows: { contains: [{ title: Undelivered events }] } }
    queries: { rows: { contains: [{ id: oxplow-foundation/metrics-dimensions }] } }
    commands:
      rows:
        contains:
          - { title: oxplow.agent.draft, description: "Put text in the shown thread's agent input, unsent." }
    skills: { rows: { contains: [{ description: $any }] } }
    components: { rows: { contains: [{ title: Integrations }] } }
    metrics:
      rows:
        contains:
          - { title: Nudges fired, description: Count of nudges fired to the agent., link: "oxplow:oxplow/metric?metric=agent.nudges.fired" }
    measures: { rows: { contains: [{ title: Nudges fired }] } }
    dimensions: { rows: { contains: [{ title: Agent, description: The coding agent that did the work. }] } }
    implementations: { rows: { contains: [{ title: Claude, description: Runs Claude Code as a coding agent. }] } }
    resources: { rows: { contains: [{ title: Commit, description: A git commit. }] } }
    collectors: { rows: { contains: [{ description: "How an effort's tests went, recorded when it finishes." }] } }
  text: { contains: ["## Metrics", "Count of nudges fired to the agent."] }
