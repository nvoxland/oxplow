# Work handed from one thread to another is an open handoff until its
# recipient takes it; taking it settles it and moves its task onto the
# taking thread (here thr1, the thread an `as: agent` step acts for): bundled
# reacts to the settlement.
requires: [oxplow-bundled, oxtask]
given:
  - { command: oxplow.thread.create, input: { stream: str1, title: Docs }, bind: docs }
  - { command: oxtask.task.create, input: { title: Write the guide, stage: ready } }
  - { command: oxplow.tasks.assign, input: { uri: "oxplow:oxplow/task?id=tsk1&provider=oxtask", to: "oxplow:oxplow/thread?id=thr2" } }
  - { command: oxplow.handoff.send, input: { from_thread: $docs.id, to_thread: thr1, task: "oxplow:oxplow/task?id=tsk1&provider=oxtask", body: The outline is done; write the rest. } }
when: { sql: "SELECT state, body FROM v_handoff" }
expect: { rows: [{ state: open, body: The outline is done; write the rest. }] }
steps:
  - when: { sql: "SELECT t.title AS thread FROM v_oxplow_task w JOIN v_thread t ON t.uri = w.assignee WHERE w.title = 'Write the guide'" }
    expect: { rows: [{ thread: Docs }] }
  - given:
      - { command: oxplow.handoff.resolve, input: { handoff: hnd1, outcome: taken }, as: agent }
  - when: { sql: "SELECT state FROM v_handoff" }
    expect: { rows: [{ state: taken }] }
  - when: { sql: "SELECT t.id AS thread_id FROM v_oxplow_task w JOIN v_thread t ON t.uri = w.assignee WHERE w.title = 'Write the guide'" }
    expect: { rows: [{ thread_id: 1 }] }
