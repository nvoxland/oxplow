# Definition is a display mode of a page's YAML file: the system reads the
# file (`content`), `oxplow.page.describe` says what page it is, and the
# page shows it part by part: where it comes from (its source
# opens the same running copy in the File viewer, the raw YAML), what
# it is for, how it is used (one line each), its params with this run's
# values, its loaders, its nodes and its actions where they sit. The tab is
# named for the file; the raw YAML is the File viewer's, one Open With away.
when:
  page: oxplow-foundation/definition
  params:
    uri: "oxplow:oxplow/file?path=oxplow-foundation/pages/commit.yaml&filesystem=oxplow:extensions"
    path: oxplow-foundation/pages/commit.yaml
    params: '{"sha":"abc1234"}'
    stream_id: 1
expect:
  label: "Definition: commit.yaml"
  loaders:
    about:
      rows:
        - title: Commit
          id: oxplow-foundation/commit
          extension: oxplow-foundation
          origin: ships with oxplow
          source: oxplow-foundation/pages/commit.yaml
          source_target: "oxplow:oxplow/file?filesystem=oxplow:extensions&path=oxplow-foundation/pages/commit.yaml#oxplow.renderer=oxplow-foundation/file-viewer"
    description:
      rows: 1
    usage:
      rows:
        - { line: "It draws `oxplow/commit` and is the page that opens one." }
        - { line: "It is a display mode of `oxplow/commit` (Open With)." }
        - { line: $any }
        - { line: "It runs again when its data changes." }
        - { line: "People can't comment on it." }
        - { line: "An agent reads it with `oxplow_run_page`; it isn't offered as a tool of its own." }
        - { line: "Agents find it for \"What did this commit change?\"" }
    params:
      rows:
        - { name: uri }
        - { name: sha, value: abc1234 }
        - { name: stream_id }
    loaders:
      rows:
        - { name: content, kind: content }
        - { name: row, kind: sql }
        - { name: detail, kind: sql }
        - { name: files, kind: sql, uses: row }
    nodes:
      rows:
        - { id: stack, kind: stack }
        - { id: detail, kind: viz, viz: detail, loader: detail, columns: "subject (Subject), body (Message), author (Author), committed_at (Date), sha (Version), parents (Parents)" }
        - { id: files, kind: viz, viz: tree, loader: files, columns: name (File) }
        - { id: sections, kind: slot, detail: "`oxplow-foundation/commit.sections`" }
    view:
      rows:
        - text: |-
            - Stack of sections
              - **Commit**: Detail of `detail`
                - columns: subject (Subject), body (Message), author (Author), committed_at (Date), sha (Version), parents (Parents)
                - when empty: “Commit not found.”
              - **Files**: Tree of `files`
                - columns: name (File)
                - when empty: “The commit changed no files.”
                - id: column `id`
                - parent: column `parent`
                - label: column `name`
              - Slot `oxplow-foundation/commit.sections`
    actions:
      rows:
        - { label: Cherry-pick, command: oxplow.git.cherry_pick, on: detail }
        - { label: Revert, command: oxplow.git.revert, on: detail }
