# The data catalog lists every model with its owner, what it holds and its
# columns (the page's text shows the first rows only; `v_effort` and
# `v_model` are found by name, which is how the list is read).
given:
  - { command: oxplow.effort.open, input: { thread: thr1 } }
when: { page: data-catalog, params: { model: "" } }
expect:
  text: { contains: ["| Model | Owner | Holds | Columns |", "| v_agent_conversation | core |"] }
steps:
  - params: { model: effort }
    expect: { loaders: { catalog: { rows: [{ view: v_effort, owner: core }] } } }
  - params: { model: model }
    expect: { loaders: { catalog: { rows: [{ view: v_model, owner: core }] } } }
