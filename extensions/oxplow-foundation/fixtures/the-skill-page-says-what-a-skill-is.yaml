# A skill page names the skill, what it teaches and whether it is a skill or a slash command.
requires: [oxplow-bundled]
when: { page: oxplow/skill, params: { uri: "oxplow:oxplow/skill?skill=oxplow/tasks" } }
expect:
  label: tasks
  loaders:
    about:
      rows: [{ name: tasks, extension: oxplow-bundled }]
    facts:
      rows: [{ is_a: A skill an agent loads when it applies }]
