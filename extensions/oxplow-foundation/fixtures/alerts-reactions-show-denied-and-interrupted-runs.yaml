given:
  - observe:
      run:
        kind: effect
        extension: acme
        contribution: publish
        outcome: denied
        error: Missing grant
        decisions:
          - { need: host, name: denied.example, decision: denied, reason: missing grant }
  - observe:
      run:
        kind: effect
        extension: acme
        contribution: notify
        outcome: interrupted
        error: Oxplow stopped before the reaction ended
  - observe:
      run:
        kind: effect
        extension: acme
        contribution: completed
        outcome: ok
  - command: oxplow.sql.query
    input: { sql: "SELECT run_id FROM v_effect_run WHERE extension = 'acme' AND outcome = 'denied'" }
    bind: denied
when: { part: alerts-reactions }
expect:
  loaders:
    alerts_reactions:
      rows:
        - { effect: acme/notify, outcome: interrupted, error: Oxplow stopped before the reaction ended }
        - { effect: acme/publish, outcome: denied, error: Missing grant }
  text:
    contains: [Outcome, denied, interrupted]
steps:
  - when: { part: run-details, params: { run_id: "$denied.rows[0][0]" } }
    expect:
      loaders:
        decisions:
          rows:
            - { need: host, name: denied.example, decision: denied, reason: missing grant }
