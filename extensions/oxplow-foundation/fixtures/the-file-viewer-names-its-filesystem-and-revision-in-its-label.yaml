# The File viewer draws a file of any filesystem at any revision; its tab
# label carries the filesystem and revision only when they aren't the
# working tree's: nothing for the working tree, the revision for the local
# filesystem, the filesystem (and a deployment's hash cut to 7) for another.
when:
  page: oxplow-foundation/file-viewer
  params: { path: "notes.md" }
expect:
  loaders:
    file_viewer:
      rows: [{ path: "notes.md", suffix: "" }]
steps:
  - when: { page: oxplow-foundation/file-viewer, params: { path: "notes.md", rev: "git:HEAD" } }
    expect:
      loaders:
        file_viewer:
          rows: [{ suffix: " (git:HEAD)" }]
  - when: { page: oxplow-foundation/file-viewer, params: { path: "oxplow-foundation/extension.yaml", filesystem: "oxplow:extensions", rev: "4f9c2e1a7b3d5f60" } }
    expect:
      loaders:
        file_viewer:
          rows: [{ suffix: " (oxplow:extensions 4f9c2e1)" }]
  - when: { page: oxplow-foundation/file-viewer, params: { path: "abc.yaml", filesystem: "oxplow:temp" } }
    expect:
      loaders:
        file_viewer:
          rows: [{ suffix: " (oxplow:temp)" }]
