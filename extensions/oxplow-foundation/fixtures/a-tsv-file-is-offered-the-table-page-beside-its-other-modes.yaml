# A `.tsv` file gets a second mode, Table: its rows drawn as a table.
temp:
  sheet.tsv: "name\tn\nant\t1\n"
when:
  command: oxplow.page.renderers
  input: { uri: "oxplow:oxplow/file?path=data.tsv" }
expect:
  ok: true
  result:
    renderers:
      - { page: oxplow-foundation/editor, default: true }
      - { page: oxplow-foundation/tsv, default: false }
steps:
  - when:
      command: oxplow.page.renderers
      input: { uri: "oxplow:oxplow/file?path=sheet.tsv&filesystem=oxplow:temp" }
    expect:
      ok: true
      result:
        renderers:
          - { page: oxplow-foundation/file-viewer }
          - { page: oxplow-foundation/tsv }
