# A `.json`, `.yaml` or `.yml` file gets a mode, Tree: its values as a tree.
# A YAML file that is no page has no Definition, so the Text view then Tree.
temp:
  shape.yaml: "just: a list\nof: notes\n"
  shape.json: "{\"a\": 1}"
when:
  command: oxplow.page.renderers
  input: { uri: "oxplow:oxplow/file?path=package.json" }
expect:
  ok: true
  result:
    renderers:
      - { page: oxplow/data-file, default: false }
      - { page: oxplow/editor, default: true }
steps:
  - when:
      command: oxplow.page.renderers
      input: { uri: "oxplow:oxplow/file?path=shape.yaml&filesystem=oxplow:temp" }
    expect:
      ok: true
      result:
        renderers:
          - { page: oxplow/data-file }
          - { page: oxplow/file-viewer }
  - when:
      command: oxplow.page.renderers
      input: { uri: "oxplow:oxplow/file?path=shape.json&filesystem=oxplow:temp" }
    expect:
      ok: true
      result:
        renderers:
          - { page: oxplow/data-file }
          - { page: oxplow/file-viewer }
