# What an extension may reach is its scopes as written, each an item with
# its explanation as the hover: [{ text, hint }]. Nothing waits on a person
# for an extension that runs.
when:
  page: oxplow-foundation/extension
  params:
    uri: "oxplow:oxplow/extension?name=oxplow-foundation"
    name: oxplow-foundation
expect:
  loaders:
    reach:
      rows:
        contains:
          - { scope: sql.read, text: "read your project's data with SQL" }
    about_facts:
      rows:
        - { approval_items: null }
