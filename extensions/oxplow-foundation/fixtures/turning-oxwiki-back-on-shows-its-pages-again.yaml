# Off then on again: oxwiki is active once more and the page written before
# is back, as it was.
given:
  - { command: oxplow.knowledge.write_page, input: { id: arch, body: "# Arch\n" } }
  - { command: oxplow.knowledge.set_oxwiki, input: { on: false } }
  - { command: oxplow.knowledge.set_oxwiki, input: { on: true } }
when:
  sql: |
    SELECT p.provider, p.active, p.chosen_by, k.id, k.title
      FROM v_capability_provider p JOIN v_knowledge_page k ON k.store = p.provider
     WHERE p.capability = 'knowledge'
expect:
  rows: [{ provider: oxwiki, active: 1, chosen_by: declared, id: arch, title: Arch }]
