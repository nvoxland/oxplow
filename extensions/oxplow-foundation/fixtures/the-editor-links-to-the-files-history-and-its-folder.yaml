# "See also": the Editor links to the file's history and to its folder
# (none for a file at the project root).
when:
  page: oxplow/editor
  params: { path: "src/sub/c.rs" }
expect:
  see_also:
    - { title: File history, uri: "oxplow:oxplow/page?page=file-history&path=src/sub/c.rs" }
    - { title: src/sub, uri: "oxplow:oxplow/dir?path=src/sub" }
steps:
  - params: { path: "top.txt" }
    expect:
      see_also:
        - { title: File history, uri: "oxplow:oxplow/page?page=file-history&path=top.txt" }
