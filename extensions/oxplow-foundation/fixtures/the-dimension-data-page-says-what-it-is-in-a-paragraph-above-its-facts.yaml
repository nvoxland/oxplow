# What a thing is, is a paragraph of text above its facts (a heading-less
# markdown section bound to its description), not a "What it is" row.
when:
  page: oxplow-foundation/dimension-data
  params:
    uri: "oxplow:oxplow/dimension?dimension=oxplow.language"
expect:
  nodes:
    - { id: description, kind: viz, viz: markdown }
