# A dimension page says what it slices by and the kind of value it takes.
when: { page: oxplow/dimension, params: { uri: "oxplow:oxplow/dimension?dimension=oxplow.language" } }
expect:
  label: Language
  loaders:
    about:
      rows: [{ name: Language, extension: oxplow-foundation }]
    facts:
      rows: [{ key: oxplow.language, values_are: "Categorical: one of a set of values" }]
