# The From and To choices of the Changes page (its changes_starts and
# changes_ends loaders): the whole tree to start from, the working tree to end at.
when: { page: diff-view, params: { stream_id: 1 } }
expect:
  loaders:
    changes_starts: { rows: { contains: [{ value: "", label: "Nothing - the whole tree" }] } }
    changes_ends: { rows: { contains: [{ value: working, label: Working tree }] } }
