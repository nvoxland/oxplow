# With no filter the page is the graph of the loaded commits; with one set
# it is oxplow's own table of the matches.
given:
  - observe: { commit: { sha: aaaaaaa, at: "2026-01-01T00:00:00Z", author: ann, email: ann@x, subject: First work } }
  - observe: { commit: { sha: bbbbbbb, at: "2026-01-02T00:00:00Z", author: bob, email: bob@x, subject: Second work, parents: [aaaaaaa] } }
when: { page: oxplow/git-history, params: { stream_id: 1, head_sha: bbbbbbb } }
expect:
  nodes: [{ id: graph, viz: custom }]
  loaders:
    graph: { rows: [{ sha: bbbbbbb }, { sha: aaaaaaa }] }
steps:
  - params: { stream_id: 1, head_sha: bbbbbbb, q: first }
    expect:
      nodes: [{ id: history, viz: table }]
      loaders:
        history: { rows: [{ sha: aaaaaaa }] }
      text: { contains: ["First work"] }
  - params: { stream_id: 1, head_sha: bbbbbbb, author: bob }
    expect:
      nodes: [{ id: history, viz: table }]
      loaders:
        history: { rows: [{ sha: bbbbbbb }] }
