# A notice raised to the person lists by its first line, with the agent it
# is about as the source chip every alert uses (its thread's title, opening
# the thread); the row expands into the whole text.
given:
  - { command: oxplow.thread.create, input: { stream: str1, title: Helper }, bind: helper }
  - observe: { nudge: { kind: x/muted, message: "Muted x for the agent. It said:\n# Deltas\n- a: 1", thread: $helper.id, audience: person } }
when: { page: alerts }
expect:
  loaders:
    notices:
      rows:
        - message: "Muted x for the agent. It said:"
          source: '{"kind":"agent","label":"Helper","uri":"oxplow:oxplow/page?page=thread-work&thread=thr2"}'

