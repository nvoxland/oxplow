# The Effort part of the Changes page: whether the effort is open, and the
# effort Rename… and Link to task… act on: offered on its one row.
given:
  - { command: oxplow.effort.open, input: { thread: thr1 } }
when: { page: changes-effort, params: { effort_id: 1, effort: eff1 } }
expect:
  loaders:
    changes_effort: { rows: [{ state: Open, effort: eff1 }] }
  actions: [{ id: rename, one_row: true }, { id: link, one_row: true }]
