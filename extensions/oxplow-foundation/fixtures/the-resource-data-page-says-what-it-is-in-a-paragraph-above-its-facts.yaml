# What a thing is, is a paragraph under the About heading, above its facts
# (the node's `lead:`), not a "What it is" row and not a section of its own.
when:
  page: oxplow/resource-data
  params:
    uri: "oxplow:oxplow/resource?resource=oxplow/stream"
expect:
  nodes:
    - { id: about, kind: viz, viz: detail }
  text: { contains: ["## About [node about]\n\nA line of work with its own branch and c"] }
