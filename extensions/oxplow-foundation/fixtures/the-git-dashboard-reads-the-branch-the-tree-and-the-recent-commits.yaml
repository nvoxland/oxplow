# Git Status: the stream's branch with no upstream, the working tree's
# changed files with the commit form (the Uncommitted page, embedded), and
# the last commits. The commit form commits from Git Status.
given:
  - observe: { turn: { prompt: new, write: { path: new.txt, body: "x\n" } } }
  - observe: { analyze: { kind: working } }
  - observe: { commit: { sha: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", at: "2023-11-14T22:13:20Z", author: Ada, email: ada@example.com, subject: first } }
  - observe:
      refs:
        branches: [{ name: main, head: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", stream: 1, default: true }]
        heads: [{ stream: 1, sha: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" }]
when: { page: oxplow-foundation/git-dashboard, params: { stream_id: 1 } }
expect:
  loaders:
    row: { rows: [{ branch: main }] }
    upstream: { rows: [{ branch: main, heading: Repository, remote: No remote, can_publish: 0, can_push: 0, has_upstream: 0, on_worktree: 0, compared: null }] }
    recent: { rows: [{ subject: first, commit_ref: $any }] }
    uncommitted/files: { rows: { contains: [{ id: new.txt, icon: added }] } }
    uncommitted/commit_form: { rows: [{ stream: str1 }] }
steps:
  - submit: { node: uncommitted/commit, input: { stream: str1, message: Add new } }
    expect: { ok: true }
  - when: { command: oxplow.vcs.log, input: { stream_id: str1, limit: 1 } }
    expect: { ok: true, result: { revisions: [{ subject: Add new }] } }
  - when: { part: oxplow-foundation/git-dashboard-between, params: { base: main, head: main, stream_id: 1, target_stream: 1 } }
    expect: { loaders: { git_dashboard_between: { rows: 0 } } }
