# The commits reachable from the stream's head, newest first, narrowed by
# text, author or branch, with the branches and tags at each.
given:
  - observe: { commit: { sha: aaa111, at: "2023-11-14T22:13:20Z", author: ann, email: ann@x, subject: First } }
  - observe: { commit: { sha: bbb222, at: "2023-11-14T22:15:00Z", author: bob, email: bob@x, subject: Second fix, parents: [aaa111] } }
  - observe: { commit: { sha: ccc333, at: "2023-11-14T22:16:40Z", author: ann, email: ann@x, subject: Third, parents: [bbb222] } }
  - observe: { commit: { sha: ddd444, at: "2023-11-14T22:15:50Z", author: ann, email: ann@x, subject: Side work, parents: [aaa111] } }
  - observe:
      refs:
        branches: [{ name: main, head: ccc333, stream: 1 }, { name: side, head: ddd444 }]
        tags: [{ name: v1, sha: bbb222 }]
        heads: [{ stream: 1, sha: ccc333 }]
# No head given: the stream's. The side branch isn't reachable from it.
when: { page: oxplow/git-history, params: { stream_id: 1 } }
expect:
  loaders:
    history:
      rows:
        - { subject: Third, refs: main }
        - { subject: Second fix, refs: v1 }
        - { subject: First, refs: null }
steps:
  - params: { stream_id: 1, q: fix }
    expect: { loaders: { history: { rows: [{ subject: Second fix }] } } }
  - params: { stream_id: 1, author: ann }
    expect: { loaders: { history: { rows: [{ subject: Third }, { subject: First }] } } }
  - params: { stream_id: 1, branch: side }
    expect: { loaders: { history: { rows: [{ subject: First }] } } }
