# "See also": the page links to the extension that declares it.
when:
  page: oxplow-foundation/command
  params:
    uri: "oxplow:oxplow/command?command=oxplow.agent.draft"
expect:
  see_also:
    contains:
      - { title: oxplow-foundation, uri: "oxplow:oxplow/extension?name=oxplow-foundation" }
      - { title: Data, uri: "oxplow:oxplow/command?command=oxplow.agent.draft#oxplow.renderer=oxplow-foundation/command-data" }
