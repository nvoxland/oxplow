# The Dimension data page lists the values one measure's facts carry for a
# dimension, most common first. With no measure chosen it uses the first
# choice: a measure about what the dimension describes (Model → Agent tokens).
given:
  - observe: { facts: { measure: oxplow.tokens, items: [{ value: 10, dims: { oxplow.model: opus } }, { value: 5, dims: { oxplow.model: opus } }, { value: 7, dims: { oxplow.model: haiku } }] } }
when:
  page: oxplow-foundation/dimension-data
  params: { uri: "oxplow:oxplow/dimension?dimension=oxplow.model" }
expect:
  label: Model data
  loaders:
    about: { rows: [{ name: Model }] }
    measure: { rows: [{ key: oxplow.tokens, title: Agent tokens }] }
    seen: { rows: [{ value: opus, facts: 2 }, { value: haiku, facts: 1 }] }
  see_also:
    - { title: Definition, uri: "oxplow:oxplow/dimension?dimension=oxplow.model#oxplow.renderer=oxplow-foundation/dimension" }
    - { title: Explore Data, uri: "oxplow:oxplow/page?dataset=v_fact&page=explore-data" }
steps:
  - params: { measure: oxplow.complexity }
    expect:
      loaders:
        seen: { rows: 0 }
