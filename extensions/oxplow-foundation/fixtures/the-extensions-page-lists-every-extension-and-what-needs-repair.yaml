# The overview is a document: a section per extension, headed by its name
# (a link to its page), each fact a sentence. It has no repair buttons: a
# problem (stopped contributions, permissions waiting for approval, load errors) is one line linking to the problems page.
when:
  page: oxplow-foundation/extensions
expect:
  label: Extensions
  loaders:
    summary:
      rows:
        contains:
          - { extension: oxplow-foundation, uri: "oxplow:oxplow/extension?name=oxplow-foundation", heading: oxplow-foundation, origin_text: Shipped with oxplow, origin_target: null, permission_items: $any }
  nodes:
    - { id: summary, kind: viz, viz: sections }
  actions: []
  text: { contains: ["oxplow-foundation", "Shipped with oxplow"] }
