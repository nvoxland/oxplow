# The overview is a document: a section per extension, headed by its name
# (a link to its page), each fact a sentence. It has no repair buttons: a
# problem is a one-line summary linking to the problems page.
when:
  page: oxplow-foundation/extensions
expect:
  label: Extensions
  loaders:
    facts:
      rows:
        contains:
          - { extension: oxplow-foundation, extension_uri: "oxplow:oxplow/extension?name=oxplow-foundation", text: Ships with oxplow. }
          - { extension: oxplow-foundation, text: "Turned on." }
  nodes:
    - { id: facts, kind: viz }
  actions: []
