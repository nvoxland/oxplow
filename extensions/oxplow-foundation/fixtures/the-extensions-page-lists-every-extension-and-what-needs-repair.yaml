# The overview is one table, an extension a row: its name (a link to its
# page, with "(disabled)" when it is off), whether a deployment runs, its
# permissions, and its problems ("no", else how many, linking to the
# problems page).
when:
  page: oxplow-foundation/extensions
expect:
  label: Extensions
  loaders:
    extensions:
      columns: [name, uri, deployed, permission_items, problems, problems_tone, problems_target]
      rows:
        contains:
          - { name: oxplow-foundation, uri: "oxplow:oxplow/extension?name=oxplow-foundation", deployed: "yes", permission_items: $any, problems: "no", problems_tone: null, problems_target: null }
  nodes:
    - { id: extensions, kind: viz, viz: table }
  actions: []
  text: { contains: ["oxplow-foundation"] }
