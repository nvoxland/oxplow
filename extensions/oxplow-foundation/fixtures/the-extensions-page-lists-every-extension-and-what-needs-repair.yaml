# The overview is a document: a section per extension, headed by its name
# (a link to its page), each fact a sentence. It has no repair buttons: a
# problem is a one-line summary linking to the problems page.
when:
  page: oxplow-foundation/extensions
expect:
  label: Extensions
  loaders:
    summary:
      rows:
        contains:
          - { extension: oxplow-foundation, uri: "oxplow:oxplow/extension?name=oxplow-foundation", heading: oxplow-foundation, origin_text: Ships with oxplow., permission_items: $any, approval_items: null }
  nodes:
    - { id: summary, kind: viz, viz: sections }
  actions: []
  text: { contains: ["oxplow-foundation", "Ships with oxplow."] }
