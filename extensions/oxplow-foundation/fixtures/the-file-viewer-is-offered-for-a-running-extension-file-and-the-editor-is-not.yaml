# A file of a running extension is read-only: the Text view draws it, the
# Editor is not offered.
when:
  command: oxplow.page.renderers
  input: { uri: "oxplow:oxplow/file?path=oxplow-foundation/extension.yaml&filesystem=oxplow:extensions" }
expect:
  ok: true
  result:
    renderers:
      - { page: oxplow/data-file, default: false }
      - { page: oxplow/file-viewer, default: true }
