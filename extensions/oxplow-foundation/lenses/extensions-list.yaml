title: Extensions
description: "Each extension, from its listing (v_extension) and its source as it is now (v_extension_source): running a deployment, out of date when its source changed since, and what it may reach (its permissions, approved when it was deployed). A deploy that adds permissions asks you first."
query: |
  SELECT e.name, e.origin, e.enabled, e.deployment,
         substr(e.hash, 1, 7) AS running,
         CASE WHEN s.hash IS NOT NULL AND e.hash IS NOT NULL AND s.hash != e.hash
              THEN 'out of date' ELSE '' END AS source_state,
         CASE WHEN e.permissions = '{}' THEN '' ELSE e.permissions END AS permissions,
         CASE WHEN e.pending = '[]' THEN '' ELSE e.pending END AS waiting_on,
         json_array_length(e.errors) AS problems,
         (s.hash IS NOT NULL AND (e.deployment = 'undeployed'
            OR (e.hash IS NOT NULL AND s.hash != e.hash))) AS can_deploy,
         (e.deployment = 'deployed') AS can_rollback,
         (e.origin = 'project' AND NOT e.enabled) AS can_enable,
         (e.enabled AND e.name != 'oxplow-foundation') AS can_disable,
         (e.origin = 'project') AS can_remove,
         (e.origin = 'project' AND NOT e.shared AND s.path LIKE '.oxplow/extensions/%') AS can_share,
         (e.origin = 'project' AND e.shared) AS can_unshare
  FROM v_extension e LEFT JOIN v_extension_source s USING (name)
  ORDER BY e.origin, e.name
columns:
  - { key: name, label: Extension }
  - { key: origin, label: From, width: 90 }
  - { key: deployment, label: Runs, width: 100 }
  - { key: running, label: Deployment, width: 90 }
  - { key: source_state, label: Source, width: 90 }
  - { key: permissions, label: Permissions }
  - { key: waiting_on, label: Waiting on }
  - { key: problems, label: Problems, width: 80 }
actions:
  - { id: deploy, label: Deploy, command: oxplow.extension.deploy, input: { name: "{{row.name}}" }, row: true, when: can_deploy }
  - { id: rollback, label: Roll Back, command: oxplow.extension.rollback, input: { name: "{{row.name}}" }, row: true, when: can_rollback }
  - { id: enable, label: Enable, command: oxplow.extension.enable, input: { name: "{{row.name}}" }, row: true, when: can_enable }
  - { id: disable, label: Disable, command: oxplow.extension.disable, input: { name: "{{row.name}}" }, row: true, when: can_disable }
  - { id: share, label: Share with the Team, command: oxplow.extension.share, input: { name: "{{row.name}}" }, row: true, when: can_share }
  - { id: unshare, label: Stop Sharing, command: oxplow.extension.unshare, input: { name: "{{row.name}}" }, row: true, when: can_unshare }
  - { id: remove, label: Remove…, command: oxplow.extension.remove, input: { name: "{{row.name}}" }, row: true, when: can_remove }
empty: No extensions. One you or your agent writes in .oxplow/extensions/ shows here, ready to deploy.
hidden: true
