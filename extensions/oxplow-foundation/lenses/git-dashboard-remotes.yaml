title: Recent Remote Branches
description: The 20 remote branches with the newest commits, and how far this stream's branch is from each. Pull into and Push to are on the right-click menu.
params:
  - { name: stream_id }
  - { name: branch }
query: |
  WITH apart AS (
    SELECT d.base AS short_name, d.ahead, d.behind FROM v_branch_divergence d WHERE d.head = :branch AND d.base LIKE '%/%'
  )
  SELECT b.remote || '/' || b.name AS short_name, b.remote, b.name AS remote_branch,
         c.subject, c.committed_at,
         coalesce((SELECT '↑' || a.ahead || ' ↓' || a.behind FROM apart a WHERE a.short_name = b.remote || '/' || b.name), '') AS apart,
         coalesce((SELECT a.behind > 0 FROM apart a WHERE a.short_name = b.remote || '/' || b.name), 0) AS can_pull,
         coalesce((SELECT a.ahead > 0 FROM apart a WHERE a.short_name = b.remote || '/' || b.name), 0) AS can_push
  FROM v_branch b LEFT JOIN v_commit c ON c.sha = b.head_sha
  WHERE b.kind = 'remote'
  ORDER BY c.committed_at DESC LIMIT 20
viz: list
columns:
  - { key: short_name, label: Branch }
  - { key: subject, label: Last commit }
  - { key: committed_at, label: When, format: relative, width: 110 }
  - { key: apart, label: Apart }
actions:
  - { id: pull, label: Pull into current, command: oxplow.vcs.pull, row: true, when: can_pull, input: { stream: "str{{param.stream_id}}", remote: "{{row.remote}}", branch: "{{row.remote_branch}}" } }
  - { id: push, label: Push current to, command: oxplow.vcs.push, row: true, when: can_push, input: { stream: "str{{param.stream_id}}", remote: "{{row.remote}}", branch: "{{row.remote_branch}}" } }
empty: No remote branches.
hidden: true
