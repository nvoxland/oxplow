title: Context
description: "What you collected for this thread's agents: pages from a page's ☰ and text from a selection's right-click. The next prompt to any agent in the thread carries what waits here, then it moves to Delivered."
params:
  - { name: thread_id }
viz: document
sections:
  - { id: waiting, lens: context-waiting }
  - { id: delivered, lens: context-delivered }
actions:
  - { id: clear, label: Clear, command: oxplow.context.clear, input: { thread: "thr{{param.thread_id}}" }, prominent: true, icon: trash-2 }
hidden: true
