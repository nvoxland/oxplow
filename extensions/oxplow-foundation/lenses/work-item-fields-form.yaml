title: Details
description: The item's title and the work list's own fields (priority, labels, ...). Save applies them together.
params:
  - { name: uri }
query: |
  SELECT w.uri, w.title, w.native FROM v_work_item w WHERE w.uri = :uri
viz: form
form:
  command: oxplow.work_item.update
  mode: edit
  fields:
    - title
    - { name: native, from: oxplow-foundation/work-item-fields }
hidden: true
