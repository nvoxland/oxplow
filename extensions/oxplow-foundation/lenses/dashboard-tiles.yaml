title: Dashboard tiles
description: "A dashboard's tiles, in its order: drag to reorder, right-click for a tile's size, chart and removal, click a heading to edit it."
params:
  - { name: id }
  - { name: range, type: date_range, role: filter, label: Range, default: all, presets: [1d, 2d, 3d, 7d, 30d, all] }
  - { name: branch, type: branch, role: filter, label: Branch }
query: |
  SELECT 'dti' || i.id AS id, i.kind,
         CASE WHEN json_extract(i.options_json, '$.display') = 'metric' THEN 1 ELSE 0 END AS is_metric,
         json_extract(i.options_json, '$.title') AS title,
         json_extract(i.options_json, '$.size') AS size,
         json_extract(i.options_json, '$.lensId') AS lens,
         json_extract(i.options_json, '$.sql') AS sql,
         json_extract(i.options_json, '$.display') AS display,
         json_extract(i.options_json, '$.chart') AS chart,
         json_extract(i.options_json, '$.metric') AS metric,
         json_extract(i.options_json, '$.viz') AS viz,
         json_extract(i.options_json, '$.text') AS text
  FROM v_dashboard_item i WHERE 'dsh' || i.dashboard_id = :id ORDER BY i.sort_index
viz: dashboard
tile: { id: id, title: title, size: size, lens: lens, sql: sql, display: display, chart: chart, metric: metric, viz: viz, text: text }
actions:
  - { id: reorder, label: Reorder, command: oxplow.dashboard.reorder_items, drag: true, input: { dashboard: "{{param.id}}", order: "{{order.id}}" } }
  - { id: edit-text, label: Save, command: oxplow.dashboard.update_item, edit: true, fixed: [item], input: { item: "{{row.id}}", text: "{{row.text}}" } }
  - { id: rename, label: Rename…, command: oxplow.dashboard.update_item, row: true, form: true, fixed: [item], input: { item: "{{row.id}}", title: "{{row.title}}" } }
  - { id: line, label: Chart as Line, command: oxplow.dashboard.update_item, row: true, when: is_metric, input: { item: "{{row.id}}", viz: line } }
  - { id: number, label: Chart as Number, command: oxplow.dashboard.update_item, row: true, when: is_metric, input: { item: "{{row.id}}", viz: number } }
  - { id: small, label: "Size: Small", command: oxplow.dashboard.update_item, row: true, input: { item: "{{row.id}}", size: small } }
  - { id: wide, label: "Size: Wide", command: oxplow.dashboard.update_item, row: true, input: { item: "{{row.id}}", size: wide } }
  - { id: tall, label: "Size: Tall", command: oxplow.dashboard.update_item, row: true, input: { item: "{{row.id}}", size: tall } }
  - { id: full, label: "Size: Full", command: oxplow.dashboard.update_item, row: true, input: { item: "{{row.id}}", size: full } }
  - { id: remove, label: Remove, command: oxplow.dashboard.remove_item, row: true, key: Delete, input: { item: "{{row.id}}" } }
empty: No tiles yet. Add a metric or a heading above; the agent can pin a chart or a lens too.
hidden: true
