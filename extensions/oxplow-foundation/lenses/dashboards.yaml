title: Dashboards
description: Your dashboards — grids of metric and lens tiles. New Dashboard makes an empty one and opens it.
query: |
  SELECT d.title, d.uri, d.updated_at, 'dashboard' AS kind
  FROM v_dashboard d
  ORDER BY d.sort_index, d.id
columns:
  - { key: title, label: Dashboard, icon: kind, link: { kind: page, from: uri } }
  - { key: updated_at, label: Changed, format: relative, width: 120 }
actions:
  - { id: new, label: New Dashboard, command: oxplow.dashboard.create, input: { title: Untitled dashboard } }
empty: No dashboards yet. A dashboard is a grid of metric and lens tiles. Create one here, or have the agent build it.
hidden: true
