title: About
description: Where the item is and when it changed. Right-click for moving it between a thread and the backlog, and Delete.
params:
  - { name: uri }
  - { name: thread_id }
query: |
  WITH feat AS (
    SELECT p.features AS f FROM v_capability_provider p WHERE p.capability = 'work_items' AND p.active = 1
  )
  SELECT w.uri, w.native_id AS id, w.provider,
         CASE WHEN w.thread_id IS NULL THEN 'Backlog'
              ELSE coalesce((SELECT t.title FROM v_thread t WHERE t.id = w.thread_id), w.thread_id) END AS list,
         (SELECT p.title FROM v_work_item p WHERE p.uri = w.parent_uri) AS parent,
         w.parent_uri, w.created_at, w.updated_at, w.closed_at,
         (w.thread_id IS NULL AND :thread_id IS NOT NULL
            AND coalesce((SELECT json_extract(f, '$.lists') FROM feat), 0) = 1) AS can_bring,
         (w.thread_id IS NOT NULL AND w.thread_id = :thread_id
            AND coalesce((SELECT json_extract(f, '$.lists') FROM feat), 0) = 1) AS can_send,
         'thr' || :thread_id AS thread_ref,
         coalesce((SELECT json_extract(f, '$.delete') FROM feat), 0) AS can_delete
  FROM v_work_item w WHERE w.uri = :uri
viz: detail
columns:
  - { key: id, label: ID }
  - { key: provider, label: List }
  - { key: list, label: On }
  - { key: parent, label: Parent, link: { kind: page, from: parent_uri } }
  - { key: created_at, label: Created, format: relative }
  - { key: updated_at, label: Updated, format: relative }
  - { key: closed_at, label: Closed, format: relative }
actions:
  - { id: bring, label: Bring to this thread, command: oxplow.work_item.move, row: true, when: can_bring, input: { uri: "{{row.uri}}", to: { thread: "{{row.thread_ref}}" } } }
  - { id: send, label: Send to backlog, command: oxplow.work_item.move, row: true, when: can_send, input: { uri: "{{row.uri}}", to: backlog } }
  - { id: delete, label: Delete, command: oxplow.work_item.delete, row: true, when: can_delete, input: { uri: "{{row.uri}}" } }
empty: This work item isn't on the active work list.
hidden: true
