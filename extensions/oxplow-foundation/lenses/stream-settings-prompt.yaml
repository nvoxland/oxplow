title: Custom prompt
description: The standing instructions the person set for every agent session in a stream. Save applies them to sessions started after it.
params:
  - { name: stream, label: Stream }
query: |
  SELECT uri_param(s.uri, 'id') AS stream, coalesce(s.prompt, '') AS prompt
  FROM v_stream s
  WHERE s.uri = uri('oxplow/stream', 'id', :stream)
viz: form
form:
  command: oxplow.stream.set_prompt
  mode: edit
  fields: [prompt]
hidden: true
