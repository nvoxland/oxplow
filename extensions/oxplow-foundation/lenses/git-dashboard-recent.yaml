title: Recent Commits
description: The last five commits on the stream's head, with the branches and tags on them and how much each changed.
params:
  - { name: stream_id }
query: |
  WITH RECURSIVE head(sha) AS (SELECT s.head_sha FROM v_stream s WHERE s.id = :stream_id),
  chain(sha, n) AS (
    SELECT sha, 1 FROM head WHERE sha IS NOT NULL
    UNION ALL
    SELECT c.first_parent, chain.n + 1 FROM chain JOIN v_commit c ON c.sha = chain.sha
    WHERE c.first_parent IS NOT NULL AND chain.n < 5
  )
  SELECT c.subject, c.uri AS commit_ref, c.author, c.committed_at,
         coalesce((SELECT group_concat(name, ', ') FROM (
           SELECT b.name FROM v_branch b WHERE b.head_sha = c.sha AND b.kind = 'local'
           UNION ALL SELECT t.name FROM v_tag t WHERE t.sha = c.sha)), '') AS refs,
         (SELECT '+' || coalesce(sum(f.additions), 0) || ' −' || coalesce(sum(f.deletions), 0) || ' · ' || count(*) || ' files'
            FROM v_commit_file f WHERE f.sha = c.sha) AS stats,
         'Recent commits' AS heading, uri('oxplow/page', 'page', 'git-history') AS history
  FROM chain JOIN v_commit c ON c.sha = chain.sha
  ORDER BY chain.n
viz: list
group: { by: heading, link: { kind: page, from: history } }
columns:
  - { key: subject, label: Commit, link: { kind: page, from: commit_ref } }
  - { key: refs, label: Refs, format: badge }
  - { key: author, label: Who }
  - { key: committed_at, label: When, format: relative, width: 110 }
  - { key: stats, label: Changed }
empty: No commits yet. Commits on this branch show up here as they're made.
hidden: true
