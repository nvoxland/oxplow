title: Health
description: "Each extension's providers, collectors and effects on this machine. Three failures in a row turn one off until you turn it back on; its repair task is the agent's to read."
query: |
  SELECT h.extension, h.kind, h.contribution,
         CASE h.state
           WHEN 'disabled' THEN 'Disabled: ' || coalesce(h.reason, 'no reason recorded')
           WHEN 'failing' THEN 'Failing (' || h.consecutive_failures || ' in a row)'
                               || CASE WHEN h.last_error IS NULL THEN '' ELSE ': ' || h.last_error END
           ELSE 'OK' || CASE WHEN h.mean_ms IS NULL THEN '' ELSE ' · ' || CAST(round(h.mean_ms) AS INTEGER) || ' ms on average' END
                     || CASE WHEN h.fresh THEN '' ELSE ' · missed its schedule' END
                     || CASE WHEN h.dead_letters > 0 THEN ' · ' || h.dead_letters || ' undelivered' ELSE '' END
         END AS status,
         CASE h.state WHEN 'disabled' THEN 'danger' WHEN 'failing' THEN 'warn'
              ELSE CASE WHEN h.fresh AND h.dead_letters = 0 THEN 'muted' ELSE 'warn' END END AS tone,
         (h.state = 'disabled') AS can_enable,
         (h.state = 'disabled' AND h.repair_item IS NOT NULL) AS can_repair,
         'Repair the extension described in [oxplow uri ' || coalesce(h.repair_item, '') || '] — read it first.' AS ask
  FROM v_contribution_health h
  ORDER BY h.extension, h.contribution
viz: table
group: { by: extension }
columns:
  - { key: contribution, label: Contribution }
  - { key: kind, label: Kind, width: 90 }
  - { key: status, label: State, tone: tone }
actions:
  - { id: enable, label: Enable Again, command: oxplow.contribution.enable, row: true, when: can_enable, input: { extension: "{{row.extension}}", kind: "{{row.kind}}", contribution: "{{row.contribution}}" } }
  - { id: repair, label: Repair with the Agent, command: oxplow.agent.draft, row: true, when: can_repair, input: { text: "{{row.ask}}" } }
  - { id: enable-all, label: Enable All Disabled, command: oxplow.contribution.enable_all, input: {} }
empty: Nothing to repair.
hidden: true
