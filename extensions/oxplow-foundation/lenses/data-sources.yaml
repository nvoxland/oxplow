title: Collectors
description: The programs and scripts that bring data in, each with its last run. Sync Now runs one; credentials are set under Extensions.
query: |
  SELECT c.uri, c.extension || '/' || c.id AS collector, c.extension, c.id,
         CASE c.trigger WHEN 'call' THEN 'manual' WHEN 'schedule' THEN 'scheduled' WHEN 'events' THEN 'on events' ELSE 'after a run' END AS trigger,
         CASE c.state WHEN 'disabled' THEN 'Off on this machine' WHEN 'failing' THEN 'Failed' WHEN 'never_run' THEN 'Never run' ELSE 'Ok' END AS state,
         CASE c.state WHEN 'disabled' THEN 'warning' WHEN 'failing' THEN 'danger' WHEN 'ok' THEN 'success' END AS tone,
         c.last_run_at,
         (SELECT group_concat(j.value || ' ' || j.key, ' · ') FROM json_each(coalesce(c.row_counts_json, '{}')) j) AS rows,
         coalesce(c.disabled_reason, c.error) AS problem,
         (SELECT 'Needs ' || group_concat(k.name, ', ') || ' (set it under Extensions).' FROM v_collector_credential k
           WHERE k.collector = c.uri AND NOT k.is_set) AS missing,
         (c.enabled = 0) AS can_enable_again
  FROM v_collector c ORDER BY c.extension, c.id
viz: table
columns:
  - { key: collector, label: Collector }
  - { key: trigger, label: Runs, width: 100 }
  - { key: state, label: State, tone: tone, format: badge, width: 130 }
  - { key: last_run_at, label: Last run, format: relative, width: 110 }
  - { key: rows, label: Rows }
  - { key: problem, label: Problem, tone: tone }
  - { key: missing, label: Credentials }
actions:
  - { id: sync, label: Sync Now, command: oxplow.collector.sync, row: true, primary: true, input: { collector: "{{row.collector}}" } }
  - { id: enable-again, label: Enable Again, command: oxplow.contribution.enable, row: true, when: can_enable_again, input: { extension: "{{row.extension}}", kind: collector, contribution: "{{row.id}}" } }
  - { id: enable-all, label: Enable All Disabled, command: oxplow.contribution.enable_all, input: {} }
empty: No collectors. An extension can declare one to bring in outside data.
hidden: true
