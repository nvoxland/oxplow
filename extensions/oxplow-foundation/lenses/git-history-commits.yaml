title: Commits
description: The commits reachable from the stream's HEAD, newest first, with the branches and tags at each. Name text, an author or a branch to narrow them. An extension may draw this as a graph instead (`vcs.history.graph`).
params:
  - { name: stream_id }
  - { name: head_sha, label: Head commit }
  - { name: reveal_sha, label: Commit to reveal, default: "" }
  - { name: limit, label: Commits, default: 500 }
  - { name: q, label: Find, type: search }
  - { name: author, label: Author, default: "" }
  - { name: branch, label: Branch, type: branch }
query: |
  WITH RECURSIVE reach(sha) AS (
    SELECT coalesce(:head_sha, (SELECT head_sha FROM v_stream WHERE id = :stream_id))
    UNION
    SELECT p.value FROM reach
      JOIN v_commit c ON c.sha = reach.sha, json_each(c.parents) p
  ),
  on_branch(sha) AS (
    SELECT b.head_sha FROM v_branch b WHERE b.name = :branch AND b.kind = 'local'
    UNION
    SELECT p.value FROM on_branch
      JOIN v_commit c ON c.sha = on_branch.sha, json_each(c.parents) p
  )
  SELECT c.sha, c.subject, c.author, c.committed_at,
         (SELECT group_concat(name, ', ') FROM (
            SELECT b.name AS name FROM v_branch b WHERE b.kind = 'local' AND b.head_sha = c.sha
            UNION ALL SELECT t.name FROM v_tag t WHERE t.sha = c.sha)) AS refs
  FROM v_commit c JOIN reach USING (sha)
  WHERE (:branch IS NULL OR c.sha IN (SELECT sha FROM on_branch))
    AND (:author = '' OR c.author = :author)
    AND (:q IS NULL OR c.sha LIKE :q || '%' OR instr(lower(c.subject), lower(:q)) > 0
         OR instr(lower(c.author), lower(:q)) > 0 OR instr(lower(c.email), lower(:q)) > 0)
  ORDER BY c.committed_at DESC, c.sha
  LIMIT :limit
columns:
  - { key: subject, label: Commit, link: { kind: commit, from: sha }, highlight: q }
  - { key: refs, label: Refs, width: 160 }
  - { key: author, label: Author, width: 160 }
  - { key: committed_at, label: When, format: relative, width: 120 }
empty: No commits.
hidden: true
