title: Suggested language servers
description: Servers for the languages oxplow edits that have none yet. One click installs it.
query: |
  WITH suggested(language, package) AS (VALUES
    ('rust', 'rust-analyzer'), ('go', 'gopls'),
    ('typescript', 'typescript-language-server'), ('javascript', 'typescript-language-server'),
    ('typescriptreact', 'typescript-language-server'), ('javascriptreact', 'typescript-language-server'),
    ('python', 'pyright'), ('lua', 'lua-language-server'), ('c', 'clangd'), ('cpp', 'clangd'),
    ('json', 'json-lsp'), ('yaml', 'yaml-language-server'), ('html', 'html-lsp'), ('css', 'css-lsp'),
    ('bash', 'bash-language-server'), ('shell', 'bash-language-server'),
    ('ruby', 'ruby-lsp'), ('zig', 'zls'))
  SELECT package, group_concat(language, ', ') AS languages
  FROM suggested
  WHERE language NOT IN (SELECT language_id FROM v_lsp_server)
  GROUP BY package
  ORDER BY package
viz: table
columns:
  - { key: package, label: Package }
  - { key: languages, label: For }
actions:
  - { id: install, label: Install, command: oxplow.lsp.install_server, input: { package: "{{row.package}}" }, row: true }
empty: Every language with a suggested server has one.
hidden: true
