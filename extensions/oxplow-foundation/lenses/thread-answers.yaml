title: Answers
description: What the thread's agents showed, newest first; one not kept yet is marked.
hidden: true
params:
  - { name: thread_id }
query: |
  SELECT title, uri, created_at, kept_lens, kept_lens IS NULL AS fresh
  FROM v_thread_answer WHERE thread_id = :thread_id
  ORDER BY created_at DESC, id DESC
viz: list
columns:
  - { key: title, link: { kind: page, from: uri } }
  - { key: created_at, format: relative }
emphasis: fresh
empty: No answers in this thread yet.
