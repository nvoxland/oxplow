title: Agents
description: "Enabled agents for this project, in priority order: the first enabled agent is the default for new sessions."
query: |
  SELECT h.id, h.title,
         CASE WHEN h.enabled THEN 'on' ELSE 'off' END AS state,
         CASE WHEN h.enabled THEN h.position + 1 END AS priority,
         h.enabled AND (SELECT count(*) FROM v_agent_harness WHERE enabled = 1) > 1 AS can_disable,
         NOT h.enabled AS can_enable,
         h.enabled AND h.position > 0 AS can_up,
         h.enabled AND h.position < (SELECT count(*) FROM v_agent_harness WHERE enabled = 1) - 1 AS can_down,
         json_insert((SELECT json_group_array(x.id ORDER BY x.position) FROM v_agent_harness x WHERE x.enabled = 1), '$[#]', h.id) AS with_it,
         (SELECT json_group_array(x.id ORDER BY x.position) FROM v_agent_harness x WHERE x.enabled = 1 AND x.id <> h.id) AS without_it,
         (SELECT json_group_array(x.id ORDER BY CASE WHEN x.id = h.id THEN x.position - 1.5 ELSE x.position END)
            FROM v_agent_harness x WHERE x.enabled = 1) AS moved_up,
         (SELECT json_group_array(x.id ORDER BY CASE WHEN x.id = h.id THEN x.position + 1.5 ELSE x.position END)
            FROM v_agent_harness x WHERE x.enabled = 1) AS moved_down
  FROM v_agent_harness h
  ORDER BY h.position
viz: table
columns:
  - { key: title, label: Agent }
  - { key: state, label: State, width: 80 }
  - { key: priority, label: Priority, width: 90 }
actions:
  - { id: enable, label: Enable, command: oxplow.agent.set_agents, input: { agents: "{{row.with_it|json}}" }, row: true, when: can_enable }
  - { id: disable, label: Disable, command: oxplow.agent.set_agents, input: { agents: "{{row.without_it|json}}" }, row: true, when: can_disable }
  - { id: up, label: Move Up, command: oxplow.agent.set_agents, input: { agents: "{{row.moved_up|json}}" }, row: true, when: can_up }
  - { id: down, label: Move Down, command: oxplow.agent.set_agents, input: { agents: "{{row.moved_down|json}}" }, row: true, when: can_down }
empty: No agents are registered.
hidden: true
