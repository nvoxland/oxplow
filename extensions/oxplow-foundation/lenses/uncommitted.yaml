title: Uncommitted Changes
description: "The stream's working tree against HEAD: commit it, see the changed files, and the analysis other extensions add."
params:
  - { name: stream_id }
query: |
  SELECT id AS change_id, base_revision, head_revision
  FROM v_change WHERE kind = 'working' AND target = '' AND stream_id = :stream_id
columns: [{ key: change_id }, { key: base_revision }, { key: head_revision }]
viz: document
sections:
  - { id: commit, lens: uncommitted-commit }
  - { id: files, lens: uncommitted-files }
hidden: true
