title: Metric
description: The metric's definition, its headline for the range, and turning it on or off or adding it to a dashboard.
params:
  - { name: metric }
  - { name: range, type: date_range, role: filter, default: 7d, presets: [1d, 2d, 3d, 7d, 30d, all] }
  - { name: branch, type: branch, role: filter }
query: |
  WITH pts AS (
    SELECT p.captured_at, p.value FROM v_metric_point p
    WHERE p.metric = :metric
      AND (:branch IS NULL OR p.branch = :branch)
      AND (:range_from IS NULL OR p.captured_at >= :range_from)
      AND (:range_to IS NULL OR p.captured_at <= :range_to)
  ), agg AS (
    SELECT coalesce(json_extract(s.entity_json, '$.aggregation'), s.aggregation) AS aggregation, s.key
    FROM v_metric_spec s WHERE s.key = :metric
  )
  SELECT c.title, s.description, c.key AS id, s.display_kind AS type, (SELECT aggregation FROM agg) AS aggregation,
         s.source_measure AS measure, c.scope, c.category, c.language, s.unit, s.direction,
         s.target, s.warn_at, s.fail_at, c.enabled,
         CASE (SELECT aggregation FROM agg)
           WHEN 'sum' THEN 'Total: ' || (SELECT round(sum(value), 2) FROM pts)
           WHEN 'avg' THEN 'Average: ' || (SELECT round(avg(value), 2) FROM pts)
           ELSE CASE WHEN (SELECT count(*) FROM pts) >= 2
                     THEN 'Change: ' || (SELECT round((SELECT value FROM pts ORDER BY captured_at DESC LIMIT 1)
                                                       - (SELECT value FROM pts ORDER BY captured_at LIMIT 1), 2)) END
         END AS in_range,
         c.key AS key
  FROM v_metric_catalog c LEFT JOIN v_metric_spec s ON s.key = c.key
  WHERE c.key = :metric
viz: detail
columns:
  - { key: title, label: Metric }
  - { key: description, label: About }
  - { key: in_range, label: In range }
  - { key: id, label: ID }
  - { key: type, label: Type }
  - { key: aggregation, label: Aggregation }
  - { key: measure, label: Measure }
  - { key: scope, label: Scope }
  - { key: category, label: Category }
  - { key: language, label: Language }
  - { key: unit, label: Unit }
  - { key: direction, label: Direction }
  - { key: target, label: Target }
  - { key: warn_at, label: Warn at }
  - { key: fail_at, label: Fail at }
  - { key: enabled, label: Enabled }
actions:
  - { id: enable, label: Enable, command: oxplow.metric.enable, input: { keys: ["{{param.metric}}"], enabled: true } }
  - { id: disable, label: Disable, command: oxplow.metric.enable, input: { keys: ["{{param.metric}}"], enabled: false } }
  - { id: add-to-dashboard, label: Add to Dashboard…, command: oxplow.dashboard.add_item, form: true, fixed: [kind, display, metric, viz], choices: { dashboard: oxplow-foundation/metric-dashboards }, input: { kind: query, display: metric, metric: "{{param.metric}}", viz: line } }
empty: That metric isn't known to this project.
hidden: true
