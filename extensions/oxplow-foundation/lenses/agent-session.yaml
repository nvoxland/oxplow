title: Agent Session
description: An agent's session — its terminal, and what it asked for that waits on you. Rename it, move it to another of its saved conversations or fork one, or stop and start it.
hidden: true
params:
  - { name: uri }
query: |
  SELECT s.uri, 'ses' || s.id AS session, s.display_name, s.title, th.uri AS thread,
         s.stopped_by_user_at IS NOT NULL AS stopped,
         s.stopped_by_user_at IS NULL AS running,
         coalesce(s.resume_session_id, '') || ':' || coalesce(s.fork_next, 0) AS conversation,
         coalesce(json_extract(p.features, '$.conversation_list'), 0) = 1 AS can_choose,
         coalesce(json_extract(p.features, '$.conversation_fork'), 0) = 1 AS can_fork
  FROM v_agent_session s
  JOIN v_thread th ON th.id = s.thread_id
  LEFT JOIN v_capability_provider p ON p.capability = 'agent_harness' AND p.provider = s.harness
  WHERE s.uri = :uri
viz: document
columns: [{ key: display_name }, { key: uri }, { key: thread }]
sections:
  - { lens: agent-session-waiting, title: "" }
  - { lens: agent-session-terminal, title: "" }
actions:
  - { id: rename, label: Rename…, form: true, command: oxplow.agent_session.rename, input: { session: "{{row.session}}", title: "{{row.title}}" }, fixed: [session] }
  - { id: switch, label: Switch Conversation…, form: true, command: oxplow.agent_session.resume_conversation, input: { session: "{{row.session}}" }, fixed: [session], choices: { conversation: agent-session-conversations }, when: can_choose }
  - { id: fork, label: Fork Conversation…, form: true, command: oxplow.agent_session.fork_conversation, input: { session: "{{row.session}}" }, fixed: [session], choices: { conversation: agent-session-conversations }, when: can_fork }
  - { id: stop, label: Stop Agent, command: oxplow.agent_session.stop, input: { session: "{{row.session}}" }, when: running, prominent: true }
  - { id: start, label: Start Agent, command: oxplow.agent_session.start, input: { session: "{{row.session}}" }, when: stopped, prominent: true }
