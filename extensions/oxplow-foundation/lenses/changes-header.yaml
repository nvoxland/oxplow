title: Range
description: What is compared, and when.
params:
  - { name: subject }
  - { name: start_rev }
  - { name: end_rev }
  - { name: work_item }
  - { name: in_progress }
query: |
  WITH ends AS (
    SELECT 'from' AS role, :start_rev AS rev UNION ALL SELECT 'to', :end_rev
  ), shown AS (
    SELECT role,
           CASE WHEN rev = '' THEN '(initial)'
                WHEN rev = 'working' THEN 'working tree'
                WHEN rev LIKE 'snap:%' THEN coalesce((SELECT substr(s.created_at, 1, 19) || coalesce(' (' || substr(s.revision, 5, 7) || ')', '')
                                                      FROM v_snapshot s WHERE s.id = CAST(substr(rev, 6) AS INTEGER)), rev)
                ELSE substr(rev, 5, 7) END AS label
    FROM ends
  )
  SELECT CASE WHEN :subject = 'effort' THEN 'Effort' WHEN :subject = 'turn' THEN 'Turn'
              WHEN :subject = 'snapshot' THEN 'Snapshot' ELSE 'Comparison' END AS what,
         (SELECT label FROM shown WHERE role = 'from') AS from_label,
         (SELECT label FROM shown WHERE role = 'to') AS to_label,
         (SELECT w.title FROM v_work_item w WHERE w.uri = :work_item) AS item,
         :work_item AS item_ref,
         CASE WHEN :in_progress THEN CASE :subject
              WHEN 'effort' THEN 'Effort is in progress - diffing the start snapshot against the live working tree, which keeps changing until it closes.'
              WHEN 'turn' THEN 'Turn is still running - diffing its start snapshot against the live working tree, which keeps changing until the turn ends.'
              ELSE 'Diffing against the live working tree, which keeps changing.' END END AS note
viz: detail
columns:
  - { key: what, label: Of }
  - { key: from_label, label: From }
  - { key: to_label, label: To }
  - { key: item, label: Work item, link: { kind: page, from: item_ref } }
  - { key: note, label: Note }
empty: ""
hidden: true
