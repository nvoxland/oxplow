title: Threads
description: Open threads, and the resolved ones the filter reaches back to.
params:
  - { name: stream_id }
  - { name: days, default: "0" }
  - { name: comment }
query: |
  SELECT 'cmt' || c.id AS cid, c.uri, c.target,
         CASE c.target_resource
           WHEN 'oxplow/file' THEN uri_param(c.target, 'path')
           WHEN 'oxplow/wiki' THEN 'wiki/' || uri_param(c.target, 'slug')
           WHEN 'oxplow/work_item' THEN uri_param(c.target, 'id')
           WHEN 'oxplow/agent_session' THEN 'an agent session''s terminal'
           ELSE c.target END AS target_label,
         CASE c.intent WHEN 'followup' THEN 'follow-up' ELSE 'note' END AS kind,
         trim(CASE WHEN c.status = 'resolved' THEN 'resolved ' ELSE '' END
              || CASE WHEN c.orphaned THEN 'orphaned' ELSE '' END) AS state,
         c.quote,
         (SELECT m.author || ': ' || m.body FROM v_comment_message m
           WHERE m.comment = c.uri ORDER BY m.position DESC LIMIT 1) AS latest,
         CASE WHEN c.orphaned THEN 'Go to page' ELSE 'Go to location' END AS go,
         CASE WHEN c.orphaned THEN c.target
              ELSE c.target || CASE WHEN instr(c.target, '#') > 0 THEN '&' ELSE '#' END || 'comment=cmt' || c.id END AS go_ref,
         (c.status = 'open') AS is_open,
         (c.status = 'resolved') AS is_resolved,
         (c.intent = 'note') AS is_note,
         (c.intent = 'followup') AS is_followup
  FROM v_comment c
  WHERE c.stream_id = :stream_id
    AND (c.status = 'open'
         OR (CAST(coalesce(:days, '0') AS INTEGER) > 0
             AND julianday(c.resolved_at) >= julianday('now') - CAST(:days AS INTEGER)))
  ORDER BY target_label, c.created_at
viz: table
group: { by: target_label, link: { kind: page, from: target } }
columns:
  - { key: cid, label: Thread, width: 80, select: comment }
  - { key: kind, label: For, width: 90 }
  - { key: state, label: State, width: 120 }
  - { key: quote, label: Quote }
  - { key: latest, label: Latest }
  - { key: go, label: "", width: 130, link: { kind: page, from: go_ref } }
actions:
  - { id: reply, label: Reply…, command: oxplow.knowledge.reply_comment, form: true, input: { comment: "{{row.cid}}", body: "" }, row: true }
  - { id: resolve, label: Resolve, command: oxplow.knowledge.update_comment, input: { comment: "{{row.cid}}", status: resolved }, row: true, when: is_open }
  - { id: reopen, label: Reopen, command: oxplow.knowledge.update_comment, input: { comment: "{{row.cid}}", status: open }, row: true, when: is_resolved }
  - { id: followup, label: Make It a Follow-Up, command: oxplow.knowledge.update_comment, input: { comment: "{{row.cid}}", intent: followup }, row: true, when: is_note }
  - { id: note, label: Make It a Note, command: oxplow.knowledge.update_comment, input: { comment: "{{row.cid}}", intent: note }, row: true, when: is_followup }
  - { id: delete, label: Delete, command: oxplow.knowledge.delete_comment, input: { comment: "{{row.cid}}" }, row: true }
empty: No unresolved comments. Select text in a wiki page, file, work item or the agent's output to add one; the agent can answer them.
hidden: true
