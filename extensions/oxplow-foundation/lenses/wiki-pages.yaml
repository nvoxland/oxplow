title: Wiki pages
description: The wiki pages, most recently modified first — those not in the recently visited list. A filter lists the pages whose title or body contains it, with the text around the first match.
needs: [knowledge]
params:
  - { name: stream_id }
  - { name: filter, label: Search titles + bodies, default: "" }
query: |
  SELECT p.slug, p.title, p.updated_at,
         CASE WHEN :filter = '' THEN p.excerpt
              WHEN instr(lower(b.body), lower(:filter)) = 0 THEN p.excerpt
              ELSE replace(substr(b.body, max(1, instr(lower(b.body), lower(:filter)) - 40), 120), char(10), ' ') END AS snippet,
         '@.oxplow/wiki/' || p.slug || '.md ' AS mention
  FROM v_knowledge_page p
  JOIN v_knowledge_body b ON b.uri = p.uri
  WHERE CASE WHEN :filter = ''
             THEN p.uri NOT IN (
                    SELECT v.page_id FROM v_page_visit v JOIN v_thread t ON t.id = v.thread_id
                    WHERE v.page_kind = 'wiki' AND t.stream_id = :stream_id)
             ELSE instr(lower(p.title), lower(:filter)) > 0 OR instr(lower(b.body), lower(:filter)) > 0 END
  ORDER BY p.updated_at DESC
columns:
  - { key: title, label: Page, link: { kind: wiki, from: slug }, highlight: filter }
  - { key: snippet, label: Text, highlight: filter }
  - { key: updated_at, label: Modified, format: relative, width: 120 }
actions:
  - id: new
    label: "+ New"
    command: oxplow.knowledge.write_page
    form: true
    input: { slug: "", body: "" }
  - { id: ask, label: Add to agent context, command: oxplow.agent.draft, input: { text: "{{row.mention}}" }, row: true }
  - { id: delete, label: Delete, command: oxplow.knowledge.delete_page, input: { slug: "{{row.slug}}" }, row: true }
empty: No wiki pages. Use + New, or ask the agent to write down what it learns (pages live in `.oxplow/wiki/`).
hidden: true
