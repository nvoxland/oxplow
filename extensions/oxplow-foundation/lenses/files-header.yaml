title: Files header
description: The branch, what the working tree has changed, and Commit, Pull and Push.
params:
  - { name: stream_id }
  - { name: branch }
  - { name: compare, default: none }
query: |
  SELECT :branch AS branch,
         CASE WHEN count(f.status) = 0 THEN 'Working tree is clean'
              ELSE count(*) || ' changed' END AS changes,
         CASE WHEN :compare = 'none' THEN NULL ELSE 'Files open as a diff against ' || :compare END AS comparing
  FROM (SELECT cf.status FROM v_change c JOIN v_change_file cf ON cf.change_id = c.id
        WHERE c.kind = 'working' AND c.target = '' AND c.stream_id = :stream_id) f
viz: detail
columns:
  - { key: branch, label: Branch }
  - { key: changes, label: Changes }
  - { key: comparing, label: Comparing }
actions:
  - { id: commit, label: Commit Changes…, command: oxplow.vcs.commit, form: true, fixed: [stream], input: { stream: "str{{param.stream_id}}" } }
  - { id: pull, label: Pull, command: oxplow.vcs.pull, input: { stream: "str{{param.stream_id}}" } }
  - { id: push, label: Push, command: oxplow.vcs.push, input: { stream: "str{{param.stream_id}}" } }
hidden: true
