title: Commit
description: Its message, author, date and parents; Cherry-pick applies it onto the stream's branch, Revert commits its inverse.
params:
  - { name: sha }
  - { name: stream_id }
query: |
  SELECT subject, body, author || CASE WHEN email = '' THEN '' ELSE ' <' || email || '>' END AS author,
         committed_at, sha, parents
  FROM v_commit WHERE sha = :sha
viz: detail
columns:
  - { key: subject, label: Subject }
  - { key: body, label: Message }
  - { key: author, label: Author }
  - { key: committed_at, label: Date }
  - { key: sha, label: Version }
  - { key: parents, label: Parents }
actions:
  - { id: cherry-pick, label: Cherry-pick, command: oxplow.git.cherry_pick, input: { stream: "str{{param.stream_id}}", rev: "{{param.sha}}" } }
  - { id: revert, label: Revert, command: oxplow.git.revert, input: { stream: "str{{param.stream_id}}", rev: "{{param.sha}}" } }
empty: Commit not found.
hidden: true
