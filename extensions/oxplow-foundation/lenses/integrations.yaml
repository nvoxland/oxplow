title: Integrations
description: "Outside systems extensions connect through a program oxplow runs: the team shares each instance's config; each machine approves the program and keeps the credentials in its keychain."
# The component reads the models itself; this query is what makes the lens
# re-run (and the component re-read) when an instance, a credential or a
# collector's read changes, so it names them all.
query: |
  SELECT i.instance, i.state, i.detail, i.enabled, i.scope, i.overridden, i.config,
         i.consecutive_failures, i.last_ok_at, i.rate_limited_until, i.activity,
         (SELECT group_concat(c.name || ':' || c.is_set || ':' || coalesce(c.sign_in_state, ''), ',')
            FROM v_provider_credential c WHERE c.instance = i.instance) AS credentials,
         (SELECT group_concat(k.name || ':' || k.status || ':' || k.records || ':' || coalesce(k.last_read_at, ''), ',')
            FROM v_provider_collector k WHERE k.instance = i.instance) AS collectors
  FROM v_provider_instance i
  ORDER BY i.instance
viz: custom
custom: { component: integrations }
