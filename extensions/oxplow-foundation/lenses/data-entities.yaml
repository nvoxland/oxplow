title: Entities
description: What oxplow can query - its own data and what extension sources bring in. Open a row for how many rows it holds.
query: |
  SELECT name, owner, kind, description FROM v_data_entity ORDER BY owner <> 'core', owner, name
viz: table
columns:
  - { key: name, label: Entity, expand: data-entity-rows }
  - { key: owner, label: From, width: 140 }
  - { key: kind, label: Kind, width: 90 }
  - { key: description, label: What it holds }
actions:
  - { id: explore, label: Explore Data, command: oxplow.window.navigate, input: { uri: "oxplow:oxplow/page?page=explore-data" } }
empty: Nothing is published yet.
hidden: true
