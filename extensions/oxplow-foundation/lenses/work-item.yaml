title: Work Item
description: "One work item, whichever list it is on: its state, title and the list's own fields, its description (edited where it is read), where it is and when it changed, its links, comments and the efforts on it. The renderer of oxplow's `work_item` resource."
needs: [work_items]
params:
  - { name: uri }
  - { name: thread_id }
  - { name: stream_id }
viz: document
sections:
  - { id: state, lens: work-item-state, replaceable: work_item.detail.state }
  - { id: fields, lens: work-item-fields-form }
  - { id: body, lens: work-item-body, replaceable: work_item.detail }
  - { id: info, lens: work-item-info }
  - { id: links, lens: work-item-links }
  - { id: comments, lens: work-item-comments }
  - { id: activity, lens: work-item-activity }
hidden: true
