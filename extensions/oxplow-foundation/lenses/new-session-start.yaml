title: New Session
description: Start a session on this thread with one of the project's agents.
params:
  - { name: thread_id }
query: |
  SELECT uri_param(t.ref, 'id') AS thread,
         (SELECT h.id FROM v_agent_harness h WHERE h.enabled = 1 ORDER BY h.position LIMIT 1) AS harness
  FROM v_thread t
  WHERE t.id = :thread_id
viz: form
form:
  command: oxplow.agent_session.open
  then: replace
  fields: [harness, remember]
  choices:
    harness: oxplow-foundation/new-session-harnesses
hidden: true
