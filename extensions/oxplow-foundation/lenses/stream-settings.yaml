title: Stream Settings
description: A stream's settings — today its custom prompt.
params:
  - { name: stream, label: Stream }
query: SELECT s.title AS title FROM v_stream s WHERE s.uri = uri('oxplow/stream', 'id', :stream)
columns: [{ key: title }]
viz: document
sections:
  - id: hint
    markdown: Appended to the agent's system prompt for every thread inside this stream. Applies to agent sessions started after Save — existing sessions keep the prompt they launched with.
  - { id: prompt, title: Custom Prompt, lens: stream-settings-prompt }
hidden: true
