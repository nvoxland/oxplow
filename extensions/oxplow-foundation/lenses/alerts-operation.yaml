title: How it ended
description: One failed operation's command, exit and message, and its captured output.
params:
  - { name: event_id }
query: |
  SELECT e.command, e.message, e.exit_code, e.signal, e.duration_ms,
         CASE WHEN e.output_size IS NULL THEN 'No output was captured.'
              WHEN o.event_id IS NULL THEN 'The output has expired.'
              ELSE '' END AS output_note,
         o.stderr, o.stdout,
         CASE WHEN o.truncated THEN 'Only the first part was kept.' ELSE '' END AS truncated
  FROM v_op_error e LEFT JOIN v_op_error_output o ON o.event_id = e.event_id
  WHERE e.event_id = :event_id
viz: detail
columns:
  - { key: command, label: Command }
  - { key: message, label: Message }
  - { key: exit_code, label: Exit code }
  - { key: signal, label: Signal }
  - { key: duration_ms, label: Took, unit: ms }
  - { key: output_note, label: Output }
  - { key: stderr, label: stderr }
  - { key: stdout, label: stdout }
  - { key: truncated, label: "" }
hidden: true
