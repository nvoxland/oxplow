title: Files
description: The changed files in their folders, staged and untracked ones marked. A file opens its diff against HEAD.
params:
  - { name: change_id }
  - { name: base_revision }
  - { name: head_revision }
query: |
  WITH RECURSIVE f(path, status) AS (
    SELECT path, CASE WHEN untracked = 1 THEN 'untracked' ELSE status END
    FROM v_change_file WHERE change_id = :change_id
  ), d(path) AS (
    SELECT substr(path, 1, length(rtrim(path, replace(path, '/', ''))) - 1) FROM f WHERE instr(path, '/') > 0
    UNION
    SELECT substr(path, 1, length(rtrim(path, replace(path, '/', ''))) - 1) FROM d WHERE instr(path, '/') > 0
  )
  SELECT path AS id,
         CASE WHEN instr(path, '/') > 0 THEN substr(path, 1, length(rtrim(path, replace(path, '/', ''))) - 1) END AS parent,
         substr(path, length(rtrim(path, replace(path, '/', ''))) + 1) AS name,
         'folder' AS icon, NULL AS file, :base_revision AS base_revision, :head_revision AS head_revision
  FROM d
  UNION ALL
  SELECT path, CASE WHEN instr(path, '/') > 0 THEN substr(path, 1, length(rtrim(path, replace(path, '/', ''))) - 1) END,
         substr(path, length(rtrim(path, replace(path, '/', ''))) + 1), status, path, :base_revision, :head_revision
  FROM f
  ORDER BY 1
viz: tree
tree: { id: id, parent: parent, label: name }
columns:
  - { key: name, label: File, icon: icon, link: { kind: diff-at, from: file, base: base_revision, head: head_revision } }
empty: Working tree is clean.
hidden: true
