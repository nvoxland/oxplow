title: Every setting
description: Every setting that shapes this project, its value and where the value comes from (the defaults, your global config, the project, just you, an extension). Ask the Agent to Change This puts a request in the agent's input; a setting with a page of its own links to it.
params:
  - { name: q, type: search, role: filter, label: Search settings, default: "" }
query: |
  WITH s AS (
    SELECT c.key, c.doc, c.origin, c.extension,
           CASE
             WHEN c.value IS NULL OR c.value = 'null' THEN '—'
             WHEN json_type(c.value) = 'text' THEN
               CASE WHEN json_extract(c.value, '$') = '' THEN '""' ELSE json_extract(c.value, '$') END
             WHEN length(c.value) > 80 THEN substr(c.value, 1, 77) || '…'
             ELSE c.value
           END AS shown,
           CASE
             WHEN c.key IN ('projectName', 'zones', 'iconTint') THEN 1
             WHEN c.key IN ('agents', 'agentConfig', 'agentPromptAppend', 'injectSessionContext', 'personal.newThreadSession') THEN 2
             WHEN c.key = 'ai' OR c.key LIKE 'ai.%' THEN 3
             WHEN c.key LIKE 'snapshot%' OR c.key = 'generated' THEN 4
             WHEN c.key = 'testing' THEN 5
             WHEN c.key = 'lsp' THEN 6
             WHEN c.key IN ('extensions', 'extensionInstances') THEN 7
             WHEN c.key LIKE 'metric%' OR c.key LIKE 'dimension%' OR c.key IN ('collectors', 'measures') THEN 8
             ELSE 9
           END AS rank,
           CASE
             WHEN c.key IN ('agents', 'agentConfig', 'agentPromptAppend', 'personal.newThreadSession') THEN 'agents'
             WHEN c.key = 'ai' OR c.key LIKE 'ai.%' THEN 'ai'
             WHEN c.key = 'lsp' THEN 'lsp'
             WHEN c.key = 'extensions' THEN 'extensions'
             WHEN c.key IN ('extensionInstances', 'activeProviders') THEN 'integrations'
           END AS area,
           c.value AS raw
    FROM v_config_value c
  )
  SELECT key,
         CASE rank WHEN 1 THEN 'Project' WHEN 2 THEN 'Agents' WHEN 3 THEN 'AI' WHEN 4 THEN 'Snapshots'
                   WHEN 5 THEN 'Testing' WHEN 6 THEN 'Language Servers' WHEN 7 THEN 'Extensions'
                   WHEN 8 THEN 'Metrics & Data' ELSE 'Other' END AS grp,
         CASE origin WHEN 'default' THEN 'default' WHEN 'global' THEN 'your global config'
                     WHEN 'project' THEN 'project' WHEN 'personal' THEN 'just for you'
                     ELSE 'extension' END
           || CASE WHEN extension IS NOT NULL THEN ': ' || extension ELSE '' END AS source,
         shown AS value, doc,
         CASE WHEN area IS NULL THEN NULL ELSE 'Change It Here' END AS control,
         CASE WHEN area IS NULL THEN NULL
              ELSE 'oxplow:oxplow/page?page=settings#area=' || area END AS control_page,
         'Change the setting `' || key || '`'
           || CASE WHEN origin = 'extension' AND extension IS NOT NULL THEN ' from the `' || extension || '` extension' ELSE '' END
           || ' — ' || CASE WHEN doc IS NULL OR doc = '' THEN 'no description' ELSE doc END
           || ' It is now ' || shown || CASE WHEN origin = 'default' THEN ' (the default)' ELSE '' END
           || '. Change it to: ' || char(10)
           || CASE WHEN instr(key, '.') > 0
                   THEN '(It comes from ' || CASE WHEN origin = 'default' THEN 'the defaults' ELSE 'the ' || origin || ' config' END
                        || '; tell me how you''d change it.)'
                   ELSE '(Use oxplow.config.set; tell me what you changed.)' END AS ask
  FROM s
  WHERE coalesce(:q, '') = ''
     OR instr(lower(key), lower(:q)) > 0
     OR instr(lower(coalesce(doc, '')), lower(:q)) > 0
     OR instr(lower(coalesce(raw, '')), lower(:q)) > 0
  ORDER BY rank, key
viz: list
group: { by: grp }
columns:
  - { key: key, label: Setting, highlight: q }
  - { key: source, label: From, width: 170 }
  - { key: value, label: Value }
  - { key: doc, label: What it does }
  - { key: control, label: Change, width: 120, link: { kind: page, from: control_page } }
actions:
  - { id: ask, label: Ask the Agent to Change This, command: oxplow.agent.draft, input: { text: "{{row.ask}}" }, row: true }
empty: No settings match.
hidden: true
