title: Terminal
description: The stream's terminals — shells in its worktree — each kept running while you're elsewhere. The strip picks one; its menu renames or closes it.
hidden: true
params:
  - { name: stream_id }
  - { name: terminal }
query: |
  SELECT uri, title, 'trm' || id AS terminal
  FROM v_terminal WHERE stream_id = :stream_id
  ORDER BY position, id
viz: terminal
terminal: { of: uri, title: title }
columns:
  - { key: title, select: terminal }
actions:
  - { id: new, label: New Terminal, command: oxplow.terminal.open, input: { stream: "{{param.stream_id}}" } }
  - { id: rename, label: Rename…, row: true, form: true, command: oxplow.terminal.rename, input: { terminal: "{{row.terminal}}", title: "{{row.title}}" }, fixed: [terminal] }
  - { id: close, label: Close terminal, row: true, command: oxplow.terminal.close, input: { terminal: "{{row.terminal}}" } }
