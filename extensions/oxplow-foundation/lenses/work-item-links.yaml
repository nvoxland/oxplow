title: Links
description: What the item links to, and what links to it. Link… adds one; Unlink (right-click) removes one of its own.
needs: [work_items.links]
params:
  - { name: uri }
query: |
  SELECT l.to_uri AS other, coalesce((SELECT w.title FROM v_work_item w WHERE w.uri = l.to_uri), l.to_uri) AS item,
         l.link_type, 'to' AS direction, 1 AS outbound
  FROM v_work_item_link l WHERE l.from_uri = :uri
  UNION ALL
  SELECT l.from_uri, coalesce((SELECT w.title FROM v_work_item w WHERE w.uri = l.from_uri), l.from_uri),
         l.link_type, 'from', 0
  FROM v_work_item_link l WHERE l.to_uri = :uri
viz: table
columns:
  - { key: link_type, label: Link, width: 130 }
  - { key: direction, label: Direction, width: 90 }
  - { key: item, label: Item, link: { kind: page, from: other } }
actions:
  - { id: link, label: Link…, command: oxplow.work_item.link, form: true, fixed: [uri], input: { uri: "{{param.uri}}", link_type: relates_to } }
  - { id: unlink, label: Unlink, command: oxplow.work_item.unlink, row: true, when: outbound, input: { uri: "{{param.uri}}", target: "{{row.other}}", link_type: "{{row.link_type}}" } }
empty: No links.
hidden: true
