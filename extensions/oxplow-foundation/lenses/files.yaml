title: Files
description: "The project's files, or only what changed (in the working tree, since the default branch or the upstream), with Commit, Pull and Push on top. Right-click a file for its actions."
params:
  - { name: stream_id }
  - { name: scope, type: choice, role: filter, label: Show, options_from: files-scopes, default: all }
  - { name: compare, type: choice, role: filter, label: Compare with, options_from: files-refs, default: none }
query: |
  SELECT s.branch AS branch,
         CASE :scope WHEN 'all' THEN '' WHEN 'uncommitted' THEN 'working' ELSE 'range' END AS change_kind,
         CASE :scope WHEN 'all' THEN '' WHEN 'uncommitted' THEN ''
              ELSE coalesce((SELECT 'git:' || d.merge_base || '..working' FROM v_branch_divergence d WHERE d.base = :scope AND d.head = 'HEAD'), '') END AS change_target
  FROM v_stream s WHERE s.id = :stream_id
columns: [{ key: branch }, { key: change_kind }, { key: change_target }]
viz: document
sections:
  - { id: header, title: "", lens: files-header }
  - { id: tree, title: "", lens: files-tree }
