title: What you can ask
description: "Questions oxplow's agent answers: what each enabled extension's pages say they answer. Ask (right-click a row) puts one in the agent's input for you to edit and send."
query: |
  SELECT a.question AS prompt, a.about,
         coalesce(p.category, p.extension) AS offered_by
  FROM v_page_answer a JOIN v_page p ON p.uri = a.page_uri
  ORDER BY coalesce(p.category, p.extension), p.id, a.position
group: { by: offered_by }
columns:
  - { key: prompt, label: Question }
  - { key: about, label: Also offered on, width: 140 }
actions:
  - { id: ask, label: Ask, command: oxplow.agent.draft, input: { text: "{{row.prompt}}" }, row: true }
empty: No questions to suggest.
hidden: true
