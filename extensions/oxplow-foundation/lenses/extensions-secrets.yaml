title: Provider secrets
description: "The secrets extensions' providers use as a bearer token, and whether a value is kept. Values go to your keychain and never come back; Set… (Rotate… once one is set) asks for one, Revoke forgets it."
query: |
  SELECT s.extension, s.provider, s.name, s.reference, s.is_set,
         CASE WHEN s.is_set THEN 'Set' ELSE 'Not set' END AS status
  FROM v_extension_secret s
  ORDER BY s.extension, s.provider, s.name
viz: table
group: { by: extension }
columns:
  - { key: name, label: Secret }
  - { key: provider, label: Provider, width: 160 }
  - { key: status, label: Value, width: 100 }
actions:
  - { id: set, label: Set…, command: oxplow.extension.set_secret, row: true, form: true, fixed: [extension, reference], input: { extension: "{{row.extension}}", reference: "{{row.reference|json}}" } }
  - { id: revoke, label: Revoke, command: oxplow.extension.revoke_secret, row: true, when: is_set, input: { extension: "{{row.extension}}", reference: "{{row.reference|json}}" } }
empty: No provider keeps a secret.
hidden: true
