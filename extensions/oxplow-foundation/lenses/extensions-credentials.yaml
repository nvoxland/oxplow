title: Credentials
description: "The credentials extensions' collectors declare (shared by an extension's collectors), and whether a value is kept. Values go to your keychain and never come back; Set… asks for one."
query: |
  SELECT substr(uri_param(c.collector, 'collector'), 1, instr(uri_param(c.collector, 'collector'), '/') - 1) AS extension,
         c.name, min(c.collector) AS collector, max(c.is_set) AS is_set,
         CASE WHEN max(c.is_set) THEN 'Saved in keychain' ELSE 'Not set' END AS status
  FROM v_collector_credential c
  GROUP BY 1, c.name
  ORDER BY 1, c.name
viz: table
group: { by: extension }
columns:
  - { key: name, label: Credential }
  - { key: status, label: Value, width: 160 }
actions:
  - { id: set, label: Set…, command: oxplow.collector.set_credential, row: true, form: true, fixed: [collector, name], input: { collector: "{{row.collector}}", name: "{{row.name}}" } }
  - { id: clear, label: Clear, command: oxplow.collector.set_credential, row: true, when: is_set, input: { collector: "{{row.collector}}", name: "{{row.name}}" } }
empty: No extension asks for a credential.
hidden: true
