title: Handoffs From This Thread
description: Work this thread handed to others, and how each ended. Withdraw one that is still open. Settled ones stay for a week.
params: [{ name: thread_id }]
query: |
  SELECT h.ref, h.state, tt.title AS to_thread, w.title AS item, w.ref AS item_ref,
         h.body, h.sent_at, h.delivered_at, h.note
  FROM v_handoff h
  JOIN v_thread tt ON tt.id = h.to_thread_id
  LEFT JOIN v_work_item w ON w.ref = h.work_item
  WHERE h.from_thread_id = :thread_id
    AND (h.state = 'open' OR julianday(h.settled_at) >= julianday('now') - 7)
  ORDER BY h.state <> 'open', h.sent_at DESC
viz: table
columns:
  - { key: to_thread, label: To }
  - { key: item, label: Item, link: { kind: page, from: item_ref } }
  - { key: body, label: What }
  - { key: state, label: State }
  - { key: delivered_at, label: Agent saw it }
  - { key: note, label: Their note }
actions:
  - { id: withdraw, label: Withdraw, command: oxplow.handoff.settle, input: { handoff: "{{row.ref}}", state: withdrawn }, row: true }
empty: This thread handed no work to another.
hidden: true
