title: Agent prompt additions
description: "Text appended to every agent's system prompt, in `.oxplow/project.yaml`. It applies to sessions started after Save; running ones keep the prompt they launched with."
query: |
  SELECT coalesce((SELECT json_extract(value, '$') FROM v_config_value WHERE key = 'agentPromptAppend'), '') AS text
viz: form
form:
  command: oxplow.agent.set_prompt_append
  mode: edit
  fields: [text]
hidden: true
