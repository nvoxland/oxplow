title: Next
description: What to pick up next on a thread's list. Ready means `todo` with no open blocker. When the first ready item is an epic (an item with children), it and its ready descendants, as one unit; otherwise every ready item that isn't an epic.
params:
  - { name: thread, label: Thread (`thread:thr3`) }
query: |
  WITH items AS (
    SELECT * FROM v_work_item
    WHERE thread_id = (SELECT id FROM v_thread WHERE ref = :thread)),
  held AS (
    SELECT l.to_ref FROM v_work_item_link l JOIN v_work_item b ON b.ref = l.from_ref
    WHERE l.link_type = 'blocks' AND b.state NOT IN ('done', 'canceled')),
  epics AS (SELECT DISTINCT parent_ref AS ref FROM items WHERE parent_ref IS NOT NULL),
  ready AS (
    SELECT * FROM items WHERE state = 'todo' AND ref NOT IN (SELECT to_ref FROM held)),
  head AS (
    SELECT ref FROM ready ORDER BY rank IS NULL, rank, created_at LIMIT 1),
  below(ref) AS (
    SELECT i.ref FROM items i JOIN head h ON i.parent_ref = h.ref
    UNION SELECT i.ref FROM items i JOIN below b ON i.parent_ref = b.ref)
  SELECT r.ref, r.title,
         CASE WHEN r.ref IN (SELECT ref FROM head) AND r.ref IN (SELECT ref FROM epics) THEN 'epic'
              WHEN r.ref IN (SELECT ref FROM below) THEN 'child'
              ELSE 'ready' END AS role
  FROM ready r
  WHERE CASE WHEN (SELECT ref FROM head) IN (SELECT ref FROM epics)
             THEN r.ref IN (SELECT ref FROM head) OR r.ref IN (SELECT ref FROM below)
             ELSE r.ref NOT IN (SELECT ref FROM epics) END
  ORDER BY role = 'child', r.rank IS NULL, r.rank, r.created_at
columns:
  - { key: title, label: Item, link: { kind: page, from: ref } }
  - { key: role, label: "" }
empty: Nothing is ready.
hidden: true
tool: work_next
