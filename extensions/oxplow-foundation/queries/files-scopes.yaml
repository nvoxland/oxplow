title: File scopes
description: Which files the Directory page lists - all of them, or on the worktree only those changed in the working tree, since the default branch, or since the upstream.
params:
- name: stream_id
- name: filesystem
  default: oxplow:local
- name: rev
  default: ''
loaders:
  files_scopes:
    sql: |
      SELECT 'all' AS value, 'All files' AS label
      UNION ALL
      SELECT 'uncommitted', 'Uncommitted changes'
      WHERE :filesystem = 'oxplow:local' AND :rev = '' AND EXISTS (SELECT 1 FROM v_stream s JOIN v_branch b ON b.kind = 'local' AND b.name = s.branch WHERE s.id = :stream_id)
      UNION ALL
      SELECT d.name, 'Changes since ' || d.name
      FROM v_branch d JOIN v_stream s ON s.id = :stream_id
      WHERE :filesystem = 'oxplow:local' AND :rev = '' AND d.kind = 'local' AND d.is_default = 1 AND d.name <> s.branch
      UNION ALL
      SELECT b.upstream, 'Unpushed, since ' || b.upstream
      FROM v_branch b JOIN v_stream s ON s.id = :stream_id
      WHERE :filesystem = 'oxplow:local' AND :rev = '' AND b.kind = 'local' AND b.name = s.branch AND b.upstream IS NOT NULL
