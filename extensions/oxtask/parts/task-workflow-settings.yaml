title: Task workflow
description: "How this project's agents use tasks, and what done means here. For the project; applies to agent sessions started after a change."
needs:
- model:oxplow/task_record
loaders:
  # oxtask's own settings, as the registry has them: title, choices (the
  # workflow's labeled `oneOf`), value and where it comes from.
  settings:
    sql: |
      SELECT * FROM v_config_value
      WHERE key IN ('oxtask.tasks.workflow', 'oxtask.tasks.definitionOfDone')
      ORDER BY setting_order, key
view:
  id: task-workflow-settings
  from: settings
  viz: settings
  # The project's choice: every change is the project's.
  settings: { level: project }
