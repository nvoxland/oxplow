title: Next
description: What to pick up next on a thread. Ready means `todo` with no open blocker. First the items assigned to the thread, in its queue's order — when the first is an epic (an item with children), it and its ready descendants as one unit; otherwise every ready one that isn't an epic. With none assigned, the pool, any thread's to take — ready items assigned to nobody, by priority (`role` `pool`). Starting one assigns it to the thread.
tool: next_task
params:
- name: thread
  label: Thread (`thr3`)
answers:
- {"question":"What should I pick up next on this thread?","params":{"thread":"thr1"},"skill":"oxtask"}
loaders:
  next_task:
    sql: |
      WITH me AS (SELECT id FROM v_thread WHERE uri = uri('oxplow/thread', 'id', :thread)),
      mine AS (SELECT q.* FROM v_oxtask_ready_queue q JOIN me ON q.thread_id = me.id)
      SELECT uri, title, role FROM (
        SELECT uri, title, role, 0 AS grp, ord FROM mine
        UNION ALL
        -- Nothing assigned and ready: the pool, any thread's to take.
        SELECT uri, title, role, 1, ord FROM v_oxtask_ready_queue
        WHERE thread_id IS NULL AND NOT EXISTS (SELECT 1 FROM mine))
      ORDER BY grp, ord
view:
  from: next_task
  viz: table
  columns:
  - key: title
    label: Task
    link:
      kind: page
      from: uri
  - key: role
    label: ''
  empty: Nothing is ready.
