title: New Task
description: "The form for a new oxtask task: its title, body, stage and priority, under a parent when one is named."
icon: plus
params:
- name: parent
- name: thread_id
loaders:
  new_task:
    sql: |
      SELECT '' AS title, '' AS body, 'ready' AS stage,
             CASE WHEN :parent <> '' THEN uri_param(:parent, 'id') END AS parent
view:
  from: new_task
  viz: form
  form:
    command: oxtask.task.create
    then: replace
    fields:
    - title
    - body
    - stage
    - priority
    - parent
