title: New task
description: "The form for a new oxtask task - its title, description, starting stage, priority and parent."
icon: plus
needs:
- model:oxplow/task_record
params:
- name: thread_id
- name: parent
loaders:
  new_task:
    sql: |
      SELECT 'ready' AS stage, CASE WHEN :parent <> '' THEN uri_param(:parent, 'id') END AS parent
  # Epics: the open tasks that have children.
  new_task_parents:
    sql: |
      SELECT w.native_id AS value, w.title AS label
      FROM v_oxplow_task w
      WHERE w.provider = 'oxtask' AND w.state NOT IN ('done', 'canceled')
        AND EXISTS (SELECT 1 FROM v_oxplow_task c WHERE c.parent_uri = w.uri)
      ORDER BY w.assignee IS NOT (SELECT uri FROM v_thread WHERE id = :thread_id), w.title
  # Where it may start: oxtask's backlog, to-do and blocked stages.
  new_task_stages:
    sql: |
      SELECT 'backlog' AS value, 'Backlog' AS label UNION ALL
      SELECT 'ready', 'Ready' UNION ALL
      SELECT 'blocked', 'Blocked'
view:
  from: new_task
  viz: form
  form:
    command: oxtask.task.create
    then: replace
    fields:
    - title
    - body
    - stage
    - priority
    - parent
    choices:
      stage: oxtask/new-task#new_task_stages
      parent: oxtask/new-task#new_task_parents
    again:
      label: Save and Another
      keep:
      - stage
      - priority
      - parent
