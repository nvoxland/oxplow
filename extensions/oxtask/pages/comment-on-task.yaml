title: Comment on task
description: "The form to add a comment to an oxtask task."
icon: message-square
params:
- name: uri
loaders:
  item:
    sql: |
      SELECT uri_param(:uri, 'id') AS id, '' AS body
view:
  from: item
  viz: form
  form:
    command: oxtask.task.comment
    then: replace
    fields:
    - id
    - body
