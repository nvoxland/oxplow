title: Move task
description: "The form to put an oxtask task in a stage."
icon: columns-3
params:
- name: uri
loaders:
  item:
    sql: |
      SELECT uri_param(:uri, 'id') AS id, coalesce((SELECT stage FROM v_oxplow_task_record WHERE uri = :uri), 'ready') AS stage
view:
  from: item
  viz: form
  form:
    command: oxtask.task.move
    then: replace
    fields:
    - id
    - stage
