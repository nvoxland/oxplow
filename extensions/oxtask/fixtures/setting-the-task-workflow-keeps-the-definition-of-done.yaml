# The project chooses how its agents use tasks: `set_workflow` writes the
# workflow and the definition of done to the project's settings, each
# alone or together, and reading them back gives what was set; one alone
# keeps the other. A value outside the presets is refused.
requires: [oxplow-bundled, oxtask]
given:
  - { command: oxtask.tasks.set_workflow, input: { workflow: person_files, definition_of_done: "Tests pass.\nCommitted." } }
  - { command: oxtask.tasks.set_workflow, input: { workflow: off } }
when: { command: oxtask.settings.read, input: {} }
expect:
  ok: true
  result: { values: { tasks: { workflow: "off", definitionOfDone: "Tests pass.\nCommitted." } } }
steps:
  - when: { command: oxtask.tasks.set_workflow, input: { workflow: sometimes } }
    expect: { ok: false }
  # An empty input changes nothing, so it is refused.
  - when: { command: oxtask.tasks.set_workflow, input: {} }
    expect: { ok: false }
  # A person's own workflow still wins for them: the project's write says so.
  - given:
      - command: oxtask.settings.write
        input: { schema_version: 1, personal: { expected: null, values: { tasks: { workflow: agent_tracks } } } }
  - when: { command: oxtask.tasks.set_workflow, input: { workflow: person_files } }
    expect:
      ok: true
      result: { tasks: { workflow: person_files }, personal_workflow: agent_tracks }
