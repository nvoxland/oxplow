# Independent registered leaves preserve one another, with local inheritance.
requires: [oxplow-bundled, oxtask]
given:
  - { command: oxtask.tasks.set_workflow, input: { workflow: person_files, definition_of_done: "Tests pass.\nCommitted." } }
  - { command: oxtask.tasks.set_workflow, input: { workflow: off } }
when: { command: oxplow.config.get, input: { key: oxtask.tasks.definitionOfDone, level: project } }
expect:
  ok: true
  result: { value: "Tests pass.\nCommitted.", origin: project }
steps:
  - when: { command: oxplow.config.get, input: { key: oxtask.tasks.workflow, level: project } }
    expect: { ok: true, result: { value: off, origin: project } }
  - when: { command: oxtask.tasks.set_workflow, input: { workflow: sometimes } }
    expect: { ok: false }
  - when: { command: oxtask.tasks.set_workflow, input: {} }
    expect: { ok: false }
  - given:
      - command: oxplow.config.set
        input: { key: oxtask.tasks.workflow, level: local, value: agent_tracks }
        confirmed: true
  - when: { command: oxtask.tasks.set_workflow, input: { workflow: person_files } }
    expect:
      ok: true
      result: { tasks: { workflow: person_files }, local_workflow: agent_tracks }
  - when: { command: oxplow.config.get, input: { key: oxtask.tasks.workflow } }
    expect: { ok: true, result: { value: agent_tracks, origin: local } }
  - when: { command: oxplow.config.get, input: { key: oxtask.tasks.definitionOfDone, level: project } }
    expect: { ok: true, result: { value: "Tests pass.\nCommitted." } }
