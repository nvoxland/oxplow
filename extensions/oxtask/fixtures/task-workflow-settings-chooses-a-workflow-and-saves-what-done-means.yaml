# Settings → Integrations → Task workflow: oxtask's two settings in the
# settings editor at project level (the workflow's choices labeled by its
# schema), the default workflow until the project chooses another.
requires: [oxplow-bundled, oxtask]
when: { part: task-workflow-settings }
expect:
  loaders:
    settings:
      rows:
        - { key: oxtask.tasks.definitionOfDone, value: '""', origin: default }
        - { key: oxtask.tasks.workflow, value: '"off"', origin: default }
steps:
  - given:
      - { command: oxplow.config.set, input: { key: oxtask.tasks.workflow, value: person_files, level: project } }
    expect:
      loaders:
        settings:
          rows:
            - { key: oxtask.tasks.definitionOfDone }
            - { key: oxtask.tasks.workflow, value: '"person_files"', origin: project }
