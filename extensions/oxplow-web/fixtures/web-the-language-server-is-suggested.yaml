# HTML and CSS's language server is suggested, by the pack that declares it: the
# language is declared by this pack, with no grammar.
given: []
when: { sql: "SELECT id, enabled, analyzable, lsp_package FROM v_language WHERE extension = 'oxplow-web' ORDER BY id" }
expect:
  rows:
    - { id: css, enabled: 1, analyzable: 0, lsp_package: css-lsp }
    - { id: html, enabled: 1, analyzable: 0, lsp_package: html-lsp }
