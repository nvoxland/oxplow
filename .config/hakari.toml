# This file contains settings for `cargo hakari`.
# See https://docs.rs/cargo-hakari/latest/cargo_hakari/config for a full list of options.

hakari-package = "oxplow-workspace-hack"

# Format version for hakari's output. Version 4 requires cargo-hakari 0.9.22 or above.
dep-format-version = "4"

# Setting workspace.resolver = "2" or higher in the root Cargo.toml is HIGHLY recommended.
# Hakari works much better with the v2 resolver. (The v2 and v3 resolvers are identical from
# hakari's perspective, so you're welcome to set either.)
#
# For more about the new feature resolver, see:
# https://blog.rust-lang.org/2021/03/25/Rust-1.51.0.html#cargos-new-feature-resolver
resolver = "2"

# Build-script (host) dependencies keep their own features, as cargo's
# resolver keeps them: unifying them into the app's would ship what only
# a build script asked for (`tauri-build` → `cargo_metadata` turns on
# serde_json's `unbounded_depth`, which drops its recursion limit).
unify-target-host = "none"

# Add triples corresponding to platforms commonly used by developers here.
# https://doc.rust-lang.org/rustc/platform-support.html
platforms = [
    # Developers' machines.
    "aarch64-apple-darwin",
    # CI (.github/workflows/ci.yml runs on ubuntu-latest).
    "x86_64-unknown-linux-gnu",
]

# Write out exact versions rather than a semver range. (Defaults to false.)
# exact-versions = true

# Crates only the desktop shell builds (Tauri and what only it pulls in)
# stay out of the hack's output, or every crate, the headless daemon among
# them, would build Tauri, AppKit and, on Linux, WebKit. No core crate
# builds these, so leaving them out costs no rebuilds. The features the
# shell turns on in crates the core shares stay unified (see
# `.context/working-in-this-repo.md`).
#
# The providers are binaries of their own, shipped out of the workspace
# (`scripts/install-linear.sh` builds one with `-p`): they and the crates
# they're built from don't depend on the hack, so a provider is built from
# its own dependencies only. Their features still count toward the union,
# so a workspace build and a `-p` build of the core stay the same build.
[final-excludes]
workspace-members = [
    "oxplow-code-dup",
    "oxplow-code-metrics",
    "oxplow-collect-plugin",
    "oxplow-coverage",
    "oxplow-domain",
    "oxplow-provider-fake",
    "oxplow-provider-linear",
    "oxplow-provider-mcp",
    "oxplow-provider-protocol",
]
third-party = [
    { name = "block2" },
    { name = "objc2" },
    { name = "objc2-app-kit" },
    { name = "objc2-core-foundation" },
    { name = "objc2-core-graphics" },
    { name = "objc2-foundation" },
    { name = "phf_shared" },
    { name = "semver" },
    { name = "tauri" },
    { name = "tauri-build" },
    { name = "tauri-utils" },
]
