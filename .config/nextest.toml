# cargo-nextest config. The JUnit profile makes `cargo nextest run`
# (and `cargo llvm-cov nextest`) emit a machine-readable test report at
# `target/nextest/<profile>/junit.xml`, which oxplow's collection
# subsystem parses into the per-test tree (see .context/collection.md +
# the `collection:` block in oxplow.yaml).
[profile.default.junit]
path = "junit.xml"

# A test that listens for real file changes runs with nothing beside it. Every
# test that boots oxplow starts FSEvents streams, and while the oxplow-app tests
# run, macOS delivers nothing to a new stream for over a minute (measured: no
# event in 60 s during that run, 0.05 s right after it). This doesn't help against
# a test run in another worktree, which stalls them the same way.
[[profile.default.overrides]]
filter = "(package(oxplow-fs-watch) & test(/^tests::/)) | test(/^stream_watch::tests::an_edit_on_disk/)"
threads-required = "num-test-threads"
