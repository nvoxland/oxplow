[package]
name = "oxplow-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Oxplow desktop app (Tauri shell)"

[[bin]]
name = "oxplow"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
oxplow-app = { workspace = true }
oxplow-config = { workspace = true }
oxplow-domain = { workspace = true }
oxplow-tauri-ipc = { workspace = true }
oxplow-mcp = { workspace = true }
oxplow-control-plane = { workspace = true }
tauri = { workspace = true, features = [] }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-clipboard-manager = { workspace = true }
tauri-plugin-shell = { workspace = true }
tauri-plugin-updater = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }

# Dock-icon tinting (`icon_tint`). Same crates and versions Tauri already
# resolves for its own `setApplicationIconImage` call, so this pins nothing new.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSImage", "NSApplication", "NSColor", "NSGraphics", "NSGraphicsContext", "block2"] }
objc2-foundation = "0.3"
block2 = "0.6"

[lints]
workspace = true
