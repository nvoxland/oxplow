manifest: 2
name: e2e
intent:
  purpose: >-
    The browser suite's extension: a fake work-item tracker, an effect, its
    pages, and a resource, so specs drive each through the UI.
  origin: null
  examples: []
# Its providers run programs, its effect reads with its own SQL and
# comments on (or deletes) work items.
permissions: [process.run, sql.read, commands:oxplow.work_item.comment, commands:oxplow.work_item.delete]
# `bin/provider` and `bin/scripted` are written when a suite daemon starts:
# they run the oxplow-provider-fake binary this checkout built, the second in
# harness mode.
providers:
  - id: fake
    capability: work_items
    entry: bin/provider
    declarations: provider.json
  # The agent every session runs: the fake harness (a scripted terminal
  # agent) behind the provider protocol, so no spec starts a real agent CLI.
  - id: scripted
    capability: agent_harness
    entry: bin/scripted
    declarations: harness.json
effects:
  - id: note-created
    summary: >-
      Comments on each created oxplow task; one titled "[fail]" fails, one
      titled "[delete]" asks to delete it.
    on: [work_item.created]
    entry: effects/note.star
    needs: [sql.read]
datasets:
  - name: item
    version: 2
    key: [uri]
    description: "Each oxplow task as an `e2e/item` URI: what the resource resolves."
    fields:
      - { name: uri, type: TEXT, doc: "`oxplow:e2e/item?id=<n>`." }
      - { name: title, type: TEXT, doc: "The item's title." }
resources:
  - name: item
    label: Item
    params: { id: { required: true, pattern: '^[0-9]+$' } }
    resolve: item
    wikilink: { prefix: item, param: id }
    icon: box
