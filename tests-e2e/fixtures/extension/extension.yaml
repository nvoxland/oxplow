manifest: 2
name: e2e
intent:
  purpose: >-
    The browser suite's extension: a fake work-item tracker, an effect, a
    lens with its page, and a resource, so specs drive each through the UI, and a scripted model
    provider that sorts text by its words.
  origin: null
  examples: []
# Its providers run programs, its model provider asks models, its effect
# reads with its own SQL and comments on (or deletes) work items.
permissions:
  process: true
  ai: true
  sql: read
  commands: [oxplow.work_item.comment, oxplow.work_item.delete]
# `bin/provider` and `bin/scripted` are written when a suite daemon starts:
# they run the oxplow-provider-fake binary this checkout built, the second in
# harness mode.
providers:
  - id: fake
    capability: work_items
    entry: bin/provider
    declarations: provider.json
  # The agent every session runs: the fake harness (a scripted terminal
  # agent) behind the provider protocol, so no spec starts a real agent CLI.
  - id: scripted
    capability: agent_harness
    entry: bin/scripted
    declarations: harness.json
# A model provider for specs that need an answer from a model, offline: its
# script sorts each TODO by its words (providers/sorter.star); the host's one
# HTTP call goes to the spec's own echo server (its instance's baseUrl).
implementations:
  - capability: ai_provider
    id: sorter
    title: E2E sorter
    entry: providers/sorter.star
    config: { ops: [decide] }
effects:
  - id: note-created
    summary: >-
      Comments on each created oxplow task; one titled "[fail]" fails, one
      titled "[delete]" asks to delete it.
    on: [work_item.created]
    entry: effects/note.star
    needs: [sql.read]
models:
  - name: item
    version: 2
    key: [uri]
    description: "Each oxplow task as an `e2e/item` URI: what the resource resolves."
    columns:
      - { name: uri, type: TEXT, doc: "`oxplow:e2e/item?id=<n>`." }
      - { name: title, type: TEXT, doc: "The item's title." }
pages:
  - { id: item, title: Item, for: e2e/item, default: true, lens: item }
  - { id: item-raw, title: Item (raw), for: e2e/item, lens: item-raw }
  - { id: overview, title: Item overview, category: Work, lens: overview }
resources:
  - name: item
    label: Item
    params: { id: { required: true, pattern: '^[0-9]+$' } }
    resolve: item
    wikilink: { prefix: item, param: id }
    icon: box
