[alias]
# `cargo cov` runs the workspace test suite under instrumentation via
# nextest, emitting BOTH reports oxplow's collection subsystem reads
# (see .context/collection.md + the `collection:` block in oxplow.yaml):
#   * lcov coverage  → target/coverage/lcov.info  (diff coverage)
#   * JUnit results  → target/nextest/default/junit.xml  (per-test tree,
#                       via the [profile.default.junit] in .config/nextest.toml)
# Requires cargo-llvm-cov + cargo-nextest (`cargo install cargo-llvm-cov
# cargo-nextest`); CI already uses llvm-cov.
# `--no-fail-fast` so a failure NAMES itself: without it nextest cancels on the
# first one and the run ends before printing which test failed, which is how an
# intermittent failure stayed unidentified across several runs (tsk175).
cov = "llvm-cov nextest --workspace --no-fail-fast --lcov --output-path target/coverage/lcov.info"
