generatedDirs:
- target
- .idea
- node_modules
- site
- target
- oxplow.iml
- apps/desktop/test-report.xml
collection:
  # `bun run test:collect` runs both stacks and emits all three reports:
  # `cargo cov` (= llvm-cov nextest) writes the Rust lcov + JUnit, then the
  # frontend `test:junit` script writes the bun JUnit.
  testCommand: bun run test:collect
  agentHint: "Run tests with `bun run test:collect` — not bare `cargo test`, `bun test`, or `bun run test`. Only `test:collect` emits the lcov + JUnit reports that oxplow parses into the effort's coverage panel. Run it before closing any task that changes logic."
  reports:
  # Rust (cargo cov)
  - { path: target/coverage/lcov.info, format: lcov }
  - { path: target/nextest/default/junit.xml, format: junit }
  # Frontend (bun run --cwd apps/desktop test:junit)
  - { path: apps/desktop/test-report.xml, format: junit }
  # Distinctive substrings so the hook recognizes a test run regardless of
  # which stack/command was invoked (built-ins already cover `bun test`).
  testRunPatterns:
  - cargo cov
  - llvm-cov
  - nextest
  - bun test
  - test:collect
  - test:junit
