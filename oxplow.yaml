agents:
- claude
- codex
- opencode
collection:
  testCommand: bun run test:collect
  reports:
  - path: target/coverage/lcov.info
    format: lcov
  - path: target/nextest/default/junit.xml
    format: junit
  - path: apps/desktop/test-report.xml
    format: junit
  - path: target/clippy.json
    format: clippy-json
  testRunPatterns:
  - cargo cov
  - llvm-cov
  - nextest
  - bun test
  - test:collect
  - test:junit
  analysisRunPatterns:
  - clippy --message-format=json
  agentHint: Run tests with `bun run test:collect` — not bare `cargo test`, `bun test`, or `bun run test`. Only `test:collect` emits the lcov + JUnit reports that oxplow parses into the effort's coverage panel. Run it before closing any task that changes logic.
metrics:
# Language-idiom metrics (per-language concepts).
- use: oxplow.rust.unsafe_blocks
- use: oxplow.rust.unwrap_expect_calls
- use: oxplow.rust.panic_macros
- use: oxplow.ts.any_usage
- use: oxplow.ts.non_null_assertions
- use: oxplow.ts.console_calls
- use: oxplow.ts.ts_ignore
# Language-agnostic code metrics (one metric, all languages).
- use: oxplow.todos
- use: oxplow.fn_count
- use: oxplow.high_complexity_fns
- use: oxplow.long_functions
