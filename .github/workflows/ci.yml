name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # webkit2gtk is required by Tauri on Linux; the rest are standard
      # build deps for the Rust→C native deps (libgit2 vendored, etc.).
      - name: Install Linux Tauri deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            tmux

      - name: Cache Cargo registry + target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # A NUL byte makes git and every grep-family tool treat a source file as
      # binary, so nothing in it is searchable — while it still compiles and its
      # tests still pass. In a codebase navigated by search that is a
      # correctness property (tsk173).
      - name: Sources are searchable (no NUL bytes)
        run: bun run lint:searchable

      # Frontend unit + component tests (happy-dom harness lives in
      # apps/desktop/bunfig.toml, so run from there).
      - name: Frontend tests
        run: bun test
        working-directory: apps/desktop

      # `bundle.externalBin` makes tauri-build validate the daemon sidecar
      # from oxplow-desktop's *build script*, so anything that compiles
      # that crate — cargo test, clippy --all-targets — needs it staged,
      # not just `tauri build` (tsk266). Debug profile: it shares the
      # dependency build with the test run below, so it costs almost
      # nothing here.
      - name: Stage the daemon sidecar
        run: bash apps/desktop/src-tauri/scripts/stage-daemon.sh debug

      - name: Cargo test
        run: cargo test --workspace --all-features

      # Drift guard: if `cargo test` regenerated TS bindings (because a
      # Rust signature changed), the diff fails the PR.
      - name: Verify generated TS bindings are up to date
        run: |
          if [ -n "$(git status --porcelain apps/desktop/src/tauri-bridge/generated)" ]; then
            echo "::error::tauri-specta bindings drifted — re-run cargo test and commit the result"
            git --no-pager diff apps/desktop/src/tauri-bridge/generated
            exit 1
          fi

      - name: Cargo fmt
        run: cargo fmt --all --check

      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # Browser-facing transport contract. The remote daemon is just
  # HTTP + WebSocket over the shared oxplow-rpc dispatch — exercisable
  # headless, no browser, no Tauri shell. This job pins the exact
  # contract the renderer's transport.ts depends on in remote/browser
  # mode: CORS preflight approval, the {status, data|error} envelope
  # shape per /ipc/:name, and the {channel, payload} frames on /events
  # for all three channels (oxplow | lsp | terminal). A regression in
  # any of these fails the build here, attributably — it's the guard
  # for the "works in Tauri, breaks in the browser" seam. The daemon is
  # headless (no tauri dep), so this job skips the webkit2gtk deps the
  # full build needs.
  daemon-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # tmux for the terminal/control-plane paths; build-essential for
      # the vendored native deps (libgit2). No webkit — daemon is headless.
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential tmux

      - name: Cache Cargo registry + target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Daemon contract tests
        run: cargo test -p oxplow-daemon

  # Dependency vulnerability scan (RustSec + npm advisories). Advisory-
  # only for now: each audit step is `continue-on-error` so a newly
  # published advisory in a transitive dep can't block unrelated PRs
  # before anyone has triaged it — the findings still show in the job
  # log (red ✗ on the step, green job). Once the tree is confirmed
  # clean, drop `continue-on-error` on each step to make it blocking,
  # and use `cargo audit --ignore RUSTSEC-XXXX-NNNN` to allowlist any
  # advisory we've consciously accepted.
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Cargo audit
        continue-on-error: true
        run: cargo audit

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: Bun audit
        continue-on-error: true
        run: bun audit

  coverage:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install Linux Tauri deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            tmux

      - name: Cache Cargo registry + target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-cov-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # Surfaces line/region coverage per crate. Workspace floor is
      # set to 62% lines — current baseline ~65%. The thinnest
      # crates (oxplow-mcp, oxplow-tauri-ipc command adapters) drag
      # the average; the floor lets the average drop a few points
      # before it fails so a single uncovered new file doesn't break
      # CI but a regression sweep does. Per-crate floors below catch
      # localized drops independent of the workspace average. Raise
      # the floor as crate coverage improves — EXCEPT the pass-through
      # adapter crates (oxplow-mcp, oxplow-tauri-ipc), which are
      # intentionally not coverage-chased (their floors are
      # catastrophe-catchers, not targets; see the "pass-through
      # crates" note in .context/working-in-this-repo.md).
      - name: Coverage report (with floor)
        run: cargo llvm-cov --workspace --summary-only --fail-under-lines 62

      # Per-crate floors so a regression in one crate (e.g. the IPC
      # command adapters going to 0% again) fails CI even if the
      # workspace average still clears 65%. Floors live in
      # scripts/coverage-floors.py.
      - name: Per-crate coverage floors
        run: cargo llvm-cov report --json | python3 scripts/coverage-floors.py

      - name: LCOV report
        run: cargo llvm-cov report --lcov --output-path lcov.info

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: warn
          retention-days: 30

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Tauri deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential

      - name: Cache Cargo registry + target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-build-

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: Tauri build
        run: bun run tauri:build
        env:
          # Unsigned build — no code-signing certs in CI. Tauri's
          # bundler still produces working installers; users will see
          # a "not signed" warning on macOS/Windows.
          CI: "true"
          # vite build under bun spawns Node for some plugins and the
          # default 1.5–2 GB heap is tight on macOS runners (observed
          # FATAL: heap out of memory during the bundler pass). 6 GB
          # leaves comfortable headroom on every runner.
          NODE_OPTIONS: "--max-old-space-size=6144"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: oxplow-${{ matrix.os }}
          path: |
            target/release/bundle/**/*.dmg
            target/release/bundle/**/*.app.tar.gz
            target/release/bundle/**/*.msi
            target/release/bundle/**/*.exe
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.deb
          if-no-files-found: warn
          retention-days: 14
