[workspace]
resolver = "2"
members = [
    "apps/desktop/src-tauri",
    "crates/oxplow-domain",
    "crates/oxplow-db",
    "crates/oxplow-config",
    "crates/oxplow-fs-watch",
    "crates/oxplow-git",
    "crates/oxplow-session",
    "crates/oxplow-runtime",
    "crates/oxplow-tmux",
    "crates/oxplow-pty",
    "crates/oxplow-lsp",
    "crates/oxplow-lsp-installer",
    "crates/oxplow-mcp",
    "crates/oxplow-app",
    "crates/oxplow-rpc",
    "crates/oxplow-daemon",
    "crates/oxplow-tauri-ipc",
    "crates/oxplow-plugin",
    "crates/oxplow-control-plane",
    "crates/oxplow-code-metrics",
    "crates/oxplow-code-dup",
    "crates/oxplow-code-deps",
    "crates/oxplow-coverage",
    "crates/oxplow-collect-plugin",
    "crates/oxplow-surface-parity",
    "crates/oxplow-sdk",
    "crates/oxplow-ai",
    "crates/oxplow-acp-fake",
    "crates/oxplow-provider-protocol",
    "crates/oxplow-provider-fake",
]

[workspace.package]
version = "0.7.0"
edition = "2021"
rust-version = "1.98"
authors = ["Nathan Voxland <nathan@voxland.net>"]
license = "MIT"
repository = "https://github.com/nvoxland/oxplow"

# Guardrail against careless `.unwrap()` in production code. Each crate
# opts in with `[lints] workspace = true`; tests are exempted via
# clippy.toml (allow-unwrap-in-tests). `expect_used` is intentionally
# NOT enabled — a documented `expect("why")` is the sanctioned way to
# assert an invariant. CI runs clippy with `-D warnings`, so this is
# effectively deny on opted-in crates. oxplow-db has not opted in yet
# (188 spawn_blocking JoinError unwraps pending a db.call() helper).
[workspace.lints.clippy]
unwrap_used = "warn"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.53", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt", "codec"] }
url = "2.5"
futures = "0.3"
async-trait = "0.1"

# Serialization & types
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
# HELD at rc.24 (tsk274). The three specta crates are version-locked to each
# other, and specta-typescript 0.0.12 forbids exporting BigInt-style ints
# (i64/u64/usize/...) outright — it removed the global escape hatch that used
# to render them as `number`. Ten domain fields (sort_index, timestamps,
# counts) trip it, so moving the trio needs a decision on which migration
# path oxplow takes, not just a version bump. Move all three together.
specta = { version = "=2.0.0-rc.24", features = ["derive", "time", "serde_json"] }
quick-xml = "0.42"
regex = "1.13"
# XPath over report XML, exposed to collection plugins. Pure Rust.
sxd-document = "0.3"
sxd-xpath = "0.4"
# Collection plugin transform runtimes (pure Rust, sandboxed, ship in-binary).
# jaq = jq for JSON→JSON reshaping (primary); starlark = general/imperative tier.
jaq-core = "3.1"
jaq-json = "2.0"
jaq-std = "3.0"
starlark = "0.14"

# Error handling & logging
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# IDs / time
uuid = { version = "1.26", features = ["v4", "v7", "serde"] }

# Schemas
schemars = { version = "1", features = ["derive"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }

# DB
rusqlite = { version = "0.39", features = ["bundled", "time", "uuid", "serde_json", "hooks", "preupdate_hook", "backup"] }
r2d2 = "0.8"
r2d2_sqlite = "0.34"
refinery = { version = "0.9", features = ["rusqlite"] }

# Filesystem
notify = "8.2"
notify-debouncer-full = "0.7"
tempfile = "3.27"
ignore = "0.4"
globset = "0.4"
libc = "0.2"

# Git
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }

# PTY
portable-pty = "0.9"
bytes = "1.12"

# LSP / JSON-RPC
lsp-types = "0.97"

# HTTP / archive (LSP installer)
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
flate2 = "1.1"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
tar = "0.4"
sha2 = "0.11"
hex = "0.4"

# MCP
rmcp = { version = "3.4", features = ["server", "transport-io", "macros"] }

# Tauri
tauri = { version = "2", features = [] }
tauri-build = "2"
tauri-specta = { version = "2.0.0-rc.24", features = ["derive", "typescript"] }
specta-typescript = "0.0.11"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"

# Code metrics (tree-sitter-based)
tree-sitter = "0.27"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-clojure-orchard = "0.2"
tree-sitter-c-sharp = "0.23"

# Internal
oxplow-domain = { path = "crates/oxplow-domain" }
oxplow-code-metrics = { path = "crates/oxplow-code-metrics" }
oxplow-code-dup = { path = "crates/oxplow-code-dup" }
oxplow-code-deps = { path = "crates/oxplow-code-deps" }
oxplow-coverage = { path = "crates/oxplow-coverage" }
oxplow-collect-plugin = { path = "crates/oxplow-collect-plugin" }
oxplow-db = { path = "crates/oxplow-db" }
oxplow-ai = { path = "crates/oxplow-ai" }
oxplow-acp-fake = { path = "crates/oxplow-acp-fake" }
oxplow-provider-protocol = { path = "crates/oxplow-provider-protocol" }
oxplow-provider-fake = { path = "crates/oxplow-provider-fake" }
oxplow-config = { path = "crates/oxplow-config" }
oxplow-fs-watch = { path = "crates/oxplow-fs-watch" }
oxplow-git = { path = "crates/oxplow-git" }
oxplow-session = { path = "crates/oxplow-session" }
oxplow-runtime = { path = "crates/oxplow-runtime" }
oxplow-tmux = { path = "crates/oxplow-tmux" }
oxplow-pty = { path = "crates/oxplow-pty" }
oxplow-lsp = { path = "crates/oxplow-lsp" }
oxplow-lsp-installer = { path = "crates/oxplow-lsp-installer" }
oxplow-mcp = { path = "crates/oxplow-mcp" }
oxplow-app = { path = "crates/oxplow-app" }
oxplow-rpc = { path = "crates/oxplow-rpc" }
oxplow-daemon = { path = "crates/oxplow-daemon" }
oxplow-tauri-ipc = { path = "crates/oxplow-tauri-ipc" }
oxplow-plugin = { path = "crates/oxplow-plugin" }
oxplow-sdk = { path = "crates/oxplow-sdk" }
oxplow-control-plane = { path = "crates/oxplow-control-plane" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

# Dev builds are link/debuginfo-bound, not CPU-bound (a touched-crate
# rebuild is ~all emit + link). Full debuginfo (`debug = 2`) is the bulk of
# that cost and of the multi-GB `target/debug`. `line-tables-only` keeps
# file/line in backtraces and panics while cutting the heavy variable/type
# debuginfo; dependencies don't need any (we don't step into them).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
