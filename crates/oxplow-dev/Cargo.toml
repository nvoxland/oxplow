[package]
name = "oxplow-dev"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Development helpers for working on oxplow itself: oxtask from the command line while the task tracker is none"
publish = false

# Development only: nothing that ships depends on it, and it isn't
# bundled. See `.context/working-in-this-repo.md` "oxplow-dev".
[[bin]]
name = "oxplow-dev"
path = "src/main.rs"

[dependencies]
oxplow-ai = { workspace = true }
oxplow-app = { workspace = true }
oxplow-config = { workspace = true }
oxplow-db = { workspace = true }
oxplow-domain = { workspace = true }
oxplow-sdk = { workspace = true }
rusqlite = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
oxplow-unified-deps = { version = "0.1", path = "../oxplow-unified-deps" }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
