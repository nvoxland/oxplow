[package]
name = "oxplow-dev"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Development helpers for working on oxplow itself: oxplow's tasks from the command line while the work list is none"
publish = false

# Development only: nothing that ships depends on it, and it isn't
# bundled. See `.context/working-in-this-repo.md` "oxplow-dev".
[[bin]]
name = "oxplow-dev"
path = "src/main.rs"

[dependencies]
oxplow-app = { workspace = true }
oxplow-db = { workspace = true }
oxplow-domain = { workspace = true }
oxplow-tasks = { workspace = true }
rusqlite = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
oxplow-workspace-hack = { version = "0.1", path = "../oxplow-workspace-hack" }

[dev-dependencies]
oxplow-ai = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
