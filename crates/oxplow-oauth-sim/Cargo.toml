[package]
name = "oxplow-oauth-sim"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "A stand-in OAuth authorization server for oxplow's sign-in tests and the in-app walk"
publish = false

# Development only: a dev-dependency of the crates that test sign-in, and a
# binary to run by hand. Never a dependency of anything that ships (guard
# `no_test_double_is_a_production_dependency`, over the resolved graph).
[[bin]]
name = "oxplow-oauth-sim"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8" }
base64 = "0.23"
parking_lot = "0.13"
sha2 = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
url = { workspace = true }
oxplow-unified-deps = { version = "0.1", path = "../oxplow-unified-deps" }

[dev-dependencies]
reqwest = { workspace = true }

[lints]
workspace = true
