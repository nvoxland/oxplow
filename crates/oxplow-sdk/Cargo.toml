# The plugin SDK (`.context/extensions.md` "The SDK"): scaffold, check,
# migrate and test an extension, and the provider conformance kit. A library so the `oxplow plugin …` CLI (the Tauri
# binary), the RPC/MCP `validate_extension` and `save_lens` share one
# implementation and one set of messages.

