# A test-only extension: the code-metric collectors, measures and metrics the
# core collector tests run real scripts through. Tests load it (or install it
# into a test project); it ships nowhere.
manifest: 2
name: code-metrics
namespace: code_metrics
description: Code-metric collectors for tests of the collector machinery.
engine: ">=0.7"
permissions: [files.read]
intent:
  purpose: Give the collector tests real scripts to run.
  origin: null
  examples: []
measures:
  - {"key": "code_metrics.todo", "title": "TODO markers", "unit": "count", "subjectKind": "file", "temporalSemantics": "semi-additive", "fold": "last", "captureScope": "per-path", "description": "A TODO or FIXME marker in a file."}
  - {"key": "code_metrics.duplicate_lines", "title": "Duplicated lines", "unit": "lines", "subjectKind": "symbol", "temporalSemantics": "semi-additive", "fold": "last", "captureScope": "complete", "description": "Lines that the project's files repeat."}
  - {"key": "code_metrics.ast_hit", "title": "AST idiom hits", "unit": "count", "subjectKind": "file", "temporalSemantics": "semi-additive", "fold": "last", "captureScope": "per-path", "description": "A match of a rule that looks for an idiom in code, such as an `unwrap` call."}
  - {"key": "code_metrics.doc_coverage", "title": "Doc coverage", "unit": "%", "subjectKind": "file", "temporalSemantics": "semi-additive", "fold": "last", "captureScope": "per-path", "description": "Share of a file's items that have a doc comment."}
metrics:
  - { key: code_metrics.todos, title: "TODO / FIXME markers", measure: code_metrics.todo, expression: "COUNT(*)", unit: "count", direction: lower-better, displayKind: gauge, category: static-quality, description: "TODO/FIXME/HACK/XXX/BUG markers in comments, across all languages.", sliceableDims: [oxplow.package, oxplow.language, oxplow.vcs_rev], collector: code_metrics.todos }
  - { key: code_metrics.fn_count, title: "function count", measure: oxplow.parameter_count, expression: "COUNT(*)", unit: "count", direction: neutral, displayKind: gauge, category: static-quality, description: "Total functions / methods defined, across all languages.", sliceableDims: [oxplow.package, oxplow.language, oxplow.vcs_rev], collector: code_metrics.fn_count }
  - { key: code_metrics.high_complexity_fns, title: "high-complexity functions", measure: oxplow.complexity, expression: "COUNT(*) FILTER (WHERE value >= 11)", unit: "count", direction: lower-better, displayKind: gauge, category: static-quality, description: "Functions whose cyclomatic complexity exceeds the threshold, across all languages.", sliceableDims: [oxplow.package, oxplow.language, oxplow.vcs_rev], collector: code_metrics.high_complexity_fns }
  - { key: code_metrics.long_functions, title: "long functions (>60 lines)", measure: oxplow.fn_length, expression: "COUNT(*) FILTER (WHERE value >= 61)", unit: "count", direction: lower-better, displayKind: gauge, category: static-quality, description: "Functions longer than 60 lines, across all languages.", sliceableDims: [oxplow.package, oxplow.language, oxplow.vcs_rev], collector: code_metrics.long_functions }
  - { key: code_metrics.doc_coverage, title: "Doc coverage", measure: code_metrics.doc_coverage, expression: "RATIO(num, den)", unit: "%", direction: higher-better, displayKind: coverage, category: coverage, description: "% of public functions/methods carrying a doc comment (or docstring), across all languages.", sliceableDims: [oxplow.package, oxplow.language, oxplow.vcs_rev], collector: code_metrics.doc_coverage, default: off }
  - { key: code_metrics.duplicate_lines, title: "Duplicated lines", measure: code_metrics.duplicate_lines, expression: "SUM(value)", unit: "lines", direction: lower-better, displayKind: findings, category: static-quality, description: "Lines in blocks duplicated elsewhere in the tree, both sides of each copy.", sliceableDims: [oxplow.vcs_rev], collector: code_metrics.duplicate_lines, default: off }
  - { key: code_metrics.rust.unsafe_blocks, title: "unsafe blocks", measure: code_metrics.ast_hit, expression: "SUM(value) FILTER (WHERE dim('oxplow.rule') = 'unsafe_block')", unit: count, direction: lower-better, displayKind: gauge, category: static-quality, language: rust, description: "Count of `unsafe` blocks in the codebase.", sliceableDims: [oxplow.package, oxplow.language, oxplow.vcs_rev], target: 0.0, collector: code_metrics.rust.unsafe_blocks, default: off }
  - { key: code_metrics.rust.unwrap_expect_calls, title: "unwrap / expect calls", measure: code_metrics.ast_hit, expression: "SUM(value) FILTER (WHERE dim('oxplow.rule') = 'unwrap_expect')", unit: count, direction: lower-better, displayKind: gauge, category: static-quality, language: rust, description: "Calls to `.unwrap()` / `.expect()` that can panic at runtime.", sliceableDims: [oxplow.package, oxplow.language, oxplow.vcs_rev], collector: code_metrics.rust.unwrap_expect_calls, default: off }
  - { key: code_metrics.rust.panic_macros, title: "panic-family macros", measure: code_metrics.ast_hit, expression: "SUM(value) FILTER (WHERE dim('oxplow.rule') = 'panic_macro')", unit: count, direction: lower-better, displayKind: gauge, category: static-quality, language: rust, description: "Uses of `panic!` / `unreachable!` / `todo!` and similar panic macros.", sliceableDims: [oxplow.package, oxplow.language, oxplow.vcs_rev], collector: code_metrics.rust.panic_macros, default: off }
  - { key: code_metrics.ts.any_usage, title: "any usage", measure: code_metrics.ast_hit, expression: "SUM(value) FILTER (WHERE dim('oxplow.rule') = 'any_usage')", unit: count, direction: lower-better, displayKind: gauge, category: static-quality, language: typescript, description: "Uses of the `any` type.", sliceableDims: [oxplow.package, oxplow.language, oxplow.vcs_rev], collector: code_metrics.ts.any_usage, default: off }
  - { key: code_metrics.ts.non_null_assertions, title: "non-null assertions", measure: code_metrics.ast_hit, expression: "SUM(value) FILTER (WHERE dim('oxplow.rule') = 'non_null_assertion')", unit: count, direction: lower-better, displayKind: gauge, category: static-quality, language: typescript, description: "Non-null assertions (`!`).", sliceableDims: [oxplow.package, oxplow.language, oxplow.vcs_rev], collector: code_metrics.ts.non_null_assertions, default: off }
  - { key: code_metrics.ts.console_calls, title: "console.* calls", measure: code_metrics.ast_hit, expression: "SUM(value) FILTER (WHERE dim('oxplow.rule') = 'console_call')", unit: count, direction: lower-better, displayKind: gauge, category: static-quality, language: typescript, description: "Calls to `console.*`.", sliceableDims: [oxplow.package, oxplow.language, oxplow.vcs_rev], collector: code_metrics.ts.console_calls, default: off }
  - { key: code_metrics.ts.ts_ignore, title: "ts-ignore / ts-expect-error", measure: code_metrics.ast_hit, expression: "SUM(value) FILTER (WHERE dim('oxplow.rule') = 'ts_ignore')", unit: count, direction: lower-better, displayKind: gauge, category: static-quality, language: typescript, description: "`@ts-ignore` / `@ts-expect-error` suppressions.", sliceableDims: [oxplow.package, oxplow.language, oxplow.vcs_rev], collector: code_metrics.ts.ts_ignore, default: off }
  - { key: code_metrics.clojure.defn_count, title: "defn count", measure: code_metrics.ast_hit, expression: "SUM(value) FILTER (WHERE dim('oxplow.rule') = 'defn')", unit: count, direction: neutral, displayKind: gauge, category: static-quality, language: clojure, description: "Number of `defn` definitions.", sliceableDims: [oxplow.package, oxplow.language, oxplow.vcs_rev], collector: code_metrics.clojure.defn_count, default: off }
  - { key: code_metrics.csharp.empty_catch, title: "empty catch blocks", measure: code_metrics.ast_hit, expression: "SUM(value) FILTER (WHERE dim('oxplow.rule') = 'empty_catch')", unit: count, direction: lower-better, displayKind: gauge, category: static-quality, language: csharp, description: "Empty `catch` blocks that swallow exceptions.", sliceableDims: [oxplow.package, oxplow.language, oxplow.vcs_rev], collector: code_metrics.csharp.empty_catch, default: off }
  - { key: code_metrics.csharp.blocking_async_calls, title: "blocking async calls (.Result / .Wait())", measure: code_metrics.ast_hit, expression: "SUM(value) FILTER (WHERE dim('oxplow.rule') = 'blocking_async')", unit: count, direction: lower-better, displayKind: gauge, category: static-quality, language: csharp, description: "Blocking calls on async code (`.Result` / `.Wait()`).", sliceableDims: [oxplow.package, oxplow.language, oxplow.vcs_rev], collector: code_metrics.csharp.blocking_async_calls, default: off }
collectors:
  - { id: code_metrics.todos, doc: "Counts the TODO and FIXME markers in the project's files.", runtime: starlark, entry: collectors/code/todos.star, on: [snapshot.taken], facts: [code_metrics.todo] }
  - { id: code_metrics.fn_count, doc: "Counts the functions in each file, and their parameters.", runtime: starlark, entry: collectors/code/fn_count.star, on: [snapshot.taken], facts: [oxplow.parameter_count] }
  - { id: code_metrics.high_complexity_fns, doc: "Finds the functions whose complexity is high.", runtime: starlark, entry: collectors/code/high_complexity_fns.star, on: [snapshot.taken], facts: [oxplow.complexity] }
  - { id: code_metrics.long_functions, doc: "Finds the functions longer than 60 lines.", runtime: starlark, entry: collectors/code/long_functions.star, on: [snapshot.taken], facts: [oxplow.fn_length] }
  - { id: code_metrics.doc_coverage, doc: "Measures how many items of the code have a doc comment.", runtime: starlark, entry: collectors/code/doc_coverage.star, on: [snapshot.taken], facts: [code_metrics.doc_coverage] }
  - { id: code_metrics.duplicate_lines, doc: "Finds the lines that the project's files repeat.", runtime: starlark, entry: collectors/code/duplicate_lines.star, whole_tree: true, on: [snapshot.taken], where: { trigger: git_refs }, settle: 60s, at_most: 15m, facts: [code_metrics.duplicate_lines] }
  - { id: code_metrics.rust.unsafe_blocks, doc: "Counts the `unsafe` blocks in Rust files.", runtime: starlark, entry: collectors/rust/unsafe_blocks.star, on: [snapshot.taken], facts: [code_metrics.ast_hit] }
  - { id: code_metrics.rust.unwrap_expect_calls, doc: "Counts the `unwrap` and `expect` calls in Rust files.", runtime: starlark, entry: collectors/rust/unwrap_expect_calls.star, on: [snapshot.taken], facts: [code_metrics.ast_hit] }
  - { id: code_metrics.rust.panic_macros, doc: "Counts the `panic!`, `todo!` and similar macros in Rust files.", runtime: starlark, entry: collectors/rust/panic_macros.star, on: [snapshot.taken], facts: [code_metrics.ast_hit] }
  - { id: code_metrics.ts.any_usage, doc: "Counts the uses of the `any` type in TypeScript files.", runtime: starlark, entry: collectors/ts/any_usage.star, on: [snapshot.taken], facts: [code_metrics.ast_hit] }
  - { id: code_metrics.ts.non_null_assertions, doc: "Counts the non-null assertions in TypeScript files.", runtime: starlark, entry: collectors/ts/non_null_assertions.star, on: [snapshot.taken], facts: [code_metrics.ast_hit] }
  - { id: code_metrics.ts.console_calls, doc: "Counts the `console.*` calls in TypeScript files.", runtime: starlark, entry: collectors/ts/console_calls.star, on: [snapshot.taken], facts: [code_metrics.ast_hit] }
  - { id: code_metrics.ts.ts_ignore, doc: "Counts the `@ts-ignore` and `@ts-expect-error` comments in TypeScript files.", runtime: starlark, entry: collectors/ts/ts_ignore.star, on: [snapshot.taken], facts: [code_metrics.ast_hit] }
  - { id: code_metrics.clojure.defn_count, doc: "Counts the `defn` forms in Clojure files.", runtime: starlark, entry: collectors/clojure/defn_count.star, on: [snapshot.taken], facts: [code_metrics.ast_hit] }
  - { id: code_metrics.csharp.empty_catch, doc: "Counts the empty `catch` blocks in C# files.", runtime: starlark, entry: collectors/csharp/empty_catch.star, on: [snapshot.taken], facts: [code_metrics.ast_hit] }
  - { id: code_metrics.csharp.blocking_async_calls, doc: "Counts the blocking calls on async code (`.Result`, `.Wait()`) in C# files.", runtime: starlark, entry: collectors/csharp/blocking_async_calls.star, on: [snapshot.taken], facts: [code_metrics.ast_hit] }
