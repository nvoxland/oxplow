[package]
name = "oxplow-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
time = { workspace = true }
url = { workspace = true }
# The OAuth token endpoint calls (providers/oauth.rs): two form POSTs.
reqwest = { workspace = true }
regex = { workspace = true }
oxplow-domain = { workspace = true }
oxplow-plugin = { workspace = true }
oxplow-db = { workspace = true }
rusqlite = { workspace = true }
oxplow-ai = { workspace = true }
oxplow-config = { workspace = true }
oxplow-fs-watch = { workspace = true }
oxplow-code-deps = { workspace = true }
oxplow-git = { workspace = true }
oxplow-session = { workspace = true }
oxplow-runtime = { workspace = true }
oxplow-pty = { workspace = true }
oxplow-lsp = { workspace = true }
oxplow-lsp-installer = { workspace = true }
oxplow-code-metrics = { workspace = true }
oxplow-code-dup = { workspace = true }
oxplow-coverage = { workspace = true }
oxplow-collect-plugin = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true, features = ["compat"] }
tokio-stream = "0.1"
oxplow-provider-protocol = { workspace = true }
futures = "0.3"
bytes = "1"
base64 = "0.23"
tracing = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
# HMAC over each approval, keyed from the OS keychain (exec_consent).
hmac = "0.13"
hex = { workspace = true }
specta = { workspace = true }
# `Unknown` types raw agent JSON as TS `unknown` (acp::model).
specta-typescript = { workspace = true }
async-trait = { workspace = true }
indexmap = "2.14"
parking_lot = "0.12"
fs2 = "0.4"
libc = { workspace = true }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
similar = "3"
rayon = "1"
uuid = { workspace = true }
tempfile = { workspace = true }
walkdir = "2.5"
opentelemetry-proto = { version = "0.33.0", default-features = false, features = ["gen-tonic-messages", "metrics", "logs"] }
prost = "0.14"
# The metric-ancestry oracle (metric_visibility.rs) asks git two questions —
# ancestor-of and commit-time — directly via git2; oxplow-git wraps neither.
git2 = { workspace = true }
agent-client-protocol = { version = "=2.2.0", features = ["unstable_end_turn_token_usage"] }
oxplow-workspace-hack = { version = "0.1", path = "../oxplow-workspace-hack" }

[dev-dependencies]
# `#[tokio::test(start_paused = true)]` in wiki_pages.rs needs the paused
# clock, which lives behind `test-util` — NOT part of tokio's `full`. This
# compiled for a while only because a transitive dependency happened to
# enable the feature and cargo unified it in; a routine `cargo update`
# removed that leak and the tests stopped building. Declare it explicitly.
tokio = { workspace = true, features = ["test-util"] }
# A fake AI provider API for the tests that call a model.
oxplow-ai-fake = { workspace = true }
oxplow-acp-fake = { workspace = true }
oxplow-provider-fake = { workspace = true }
# The stand-in OAuth server the sign-in tests run against.
oxplow-oauth-sim = { workspace = true }
# P8.B4: incremental materialization equals a full refill over random
# write sequences.
proptest = "1"
# tsk903: the store-write guard reads oxplow-db's functions to tell which
# write.
syn = { version = "2", features = ["full", "visit"] }

[lints]
workspace = true
