[package]
name = "oxplow-control-plane"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
oxplow-app = { workspace = true }
oxplow-db = { workspace = true }
oxplow-domain = { workspace = true }
oxplow-mcp = { workspace = true }
oxplow-runtime = { workspace = true }

axum = { version = "0.8", features = ["json"] }
tower = "0.5"
tower-service = "0.3"
hyper = "1"
http = "1"
http-body = "1"
http-body-util = "0.1"
bytes = { workspace = true }

rmcp = { version = "3.4", features = [
    "server",
    "macros",
    "transport-streamable-http-server",
] }

tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
parking_lot = "0.12"
rand = "0.10"
base64 = "0.23"
oxplow-workspace-hack = { version = "0.1", path = "../oxplow-workspace-hack" }

[dev-dependencies]
oxplow-tasks = { workspace = true }
oxplow-harness-fake = { workspace = true }
tempfile = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
opentelemetry-proto = { version = "0.33.0", default-features = false, features = ["gen-tonic-messages", "metrics"] }
prost = "0.14"

[lints]
workspace = true
