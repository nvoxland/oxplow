[package]
name = "oxplow-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "oxplow's host: one headless process per OXPLOW_HOME that starts a daemon for each project a device holds"

# The host holds no project state. It keeps a registry of projects and the
# holds on them, starts and stops one `oxplow-daemon` per held project
# through `DaemonSupervisor`, serves its own API under `/host/…`, forwards
# `/p/<project>/…` to a project's daemon and serves the built UI.
# See .context/host.md.

[[bin]]
name = "oxplow-host"
path = "src/main.rs"

[dependencies]
oxplow-app = { workspace = true }
oxplow-config = { workspace = true }
oxplow-domain = { workspace = true }

axum = { version = "0.8", features = ["json", "ws"] }
bytes = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12", "aws_lc_rs"] }
tokio-tungstenite = { workspace = true }
fs2 = "0.4"
hex = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
specta = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
uuid = { workspace = true }
url = { workspace = true }
oxplow-unified-deps = { version = "0.1", path = "../oxplow-unified-deps" }

[dev-dependencies]
tempfile = { workspace = true }
reqwest = { workspace = true, features = ["json"] }

[lints]
workspace = true
