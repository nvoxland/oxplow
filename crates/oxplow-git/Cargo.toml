[package]
name = "oxplow-git"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
oxplow-domain = { workspace = true }
oxplow-db = { workspace = true }
oxplow-fs-watch = { workspace = true }
# Canonical `Language` identity (the single source of truth shared across
# crates). The AST-merge front half keys its own `MergeSpec` table
# off this enum instead of declaring a duplicate. See .context/smart-merge.md.
oxplow-code-metrics = { workspace = true }
git2 = { workspace = true }
similar = "3"
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
specta = { workspace = true }
time = { workspace = true }
# Tier-2 AST structural merge: parse→top-level-items front half. Grammars
# come from the languages oxplow's packs declare (oxplow-code-metrics).
# See .context/smart-merge.md.
tree-sitter = { workspace = true }
oxplow-workspace-hack = { version = "0.1", path = "../oxplow-workspace-hack" }

[dependencies.serde_json]
workspace = true

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
