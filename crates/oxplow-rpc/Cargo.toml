[package]
name = "oxplow-rpc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

# Transport-neutral command dispatch. Holds the command "core" functions
# (`fn(&Services, args) -> Result<T, IpcError>`) and a `dispatch(name,
# json, &Services)` registry, so both the local Tauri command wrappers
# (oxplow-tauri-ipc) and the remote HTTP daemon (oxplow-daemon) call one
# source of truth. Deliberately has NO `tauri` dependency so the headless
# daemon can build on a Linux host without a webview toolchain.

[dependencies]
oxplow-domain = { workspace = true }
oxplow-session = { workspace = true }
oxplow-app = { workspace = true }
# The full non-Tauri dep set of oxplow-tauri-ipc, mirrored up front so
# migrating a command module never requires a manifest change.
oxplow-config = { workspace = true }
oxplow-db = { workspace = true }
oxplow-git = { workspace = true }
oxplow-fs-watch = { workspace = true }
oxplow-plugin = { workspace = true }
oxplow-code-metrics = { workspace = true }
oxplow-code-deps = { workspace = true }
oxplow-tree-source = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
specta = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tempfile = { workspace = true }
# Line-diff for per-function churn attribution (used by code_quality).
similar = "2"
# Worktree walk for the diff-view working-tree endpoint (honours the
# generated-file filter, same as the snapshot capture sweep).
walkdir = "2"

[dev-dependencies]
tokio = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
