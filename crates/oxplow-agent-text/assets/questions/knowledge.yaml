# What an agent should be able to answer and do about the knowledge base.
- question: Which wiki pages cite files that changed since they were written?
  skill: oxplow-wiki-capture
  reaches:
    sql: SELECT ref, title, stale_ref_count FROM v_knowledge_page WHERE stale_ref_count > 0
  shape: { columns: [ref, title, stale_ref_count] }
- question: Which wiki pages talk about this file?
  about: file
  skill: oxplow-wiki-capture
  reaches:
    sql: SELECT page, stale FROM v_knowledge_ref WHERE path = 'src/lib.rs'
  shape: { columns: [page, stale] }
- question: Save what I just learned as a wiki page.
  skill: oxplow-wiki-capture
  reaches:
    command: oxplow.knowledge.write_page
    input: { slug: auth-flow, body: "# Auth flow\n\nHow a login becomes a session." }
- question: What points at this file — pages, commits, work items?
  about: file
  skill: oxplow-wiki-capture
  reaches:
    sql: >-
      SELECT source_ref, ref_type FROM v_page_ref
      WHERE target_ref = 'file:src/lib.rs' ORDER BY source_ref
  shape: { columns: [source_ref, ref_type] }
- question: What does this wiki page point at?
  skill: oxplow-wiki-capture
  reaches:
    sql: >-
      SELECT target_ref, ref_type FROM v_page_ref
      WHERE source_ref = 'wiki:auth-flow' ORDER BY target_ref
  shape: { columns: [target_ref, ref_type] }
