# What an agent should be able to answer and do about an extension's
# health: its failing or disabled providers and collectors, the repair
# work item a disable files, and events no consumer could take.
- question: Which extension providers or collectors are failing or disabled, and why?
  skill: oxplow-extension
  reaches:
    sql: >-
      SELECT extension, contribution, kind, state, reason, last_error
      FROM v_contribution_health WHERE state <> 'ok'
  shape: { columns: [extension, contribution, kind, state, reason, last_error] }
- question: Which repair work item describes this disabled collector?
  skill: oxplow-extension
  reaches:
    sql: >-
      SELECT repair_item FROM v_contribution_health
      WHERE extension = 'tracker' AND contribution = 'issues'
  shape: { columns: [repair_item] }
- question: When did each collector last run, and did it fail?
  skill: oxplow-extension
  reaches:
    sql: SELECT owner, id, status, last_run_at, error FROM v_collector_run
  shape: { columns: [owner, id, status, last_run_at, error] }
- question: Which collectors are enabled, how do they run, and what state are they in?
  skill: oxplow-extension
  reaches:
    sql: >-
      SELECT extension, id, trigger, enabled, state, last_run_at, error
      FROM v_collector ORDER BY extension, id
  shape: { columns: [extension, id, trigger, enabled, state, last_run_at, error] }
- question: Run my fixed collector again to see that it works.
  skill: oxplow-extension
  reaches:
    command: oxplow.collector.sync
    input: { collector: "tracker/issues" }
- question: Which lenses exist, and which extension declares each?
  skill: oxplow-extension
  reaches:
    sql: SELECT uri, extension, title, viz, hidden FROM v_lens ORDER BY extension, slug
  shape: { columns: [uri, extension, title, viz, hidden] }
- question: What does this extension contribute?
  skill: oxplow-extension
  reaches:
    sql: >-
      SELECT kind, count(*) AS n FROM v_contribution
      WHERE extension = 'oxplow-bundled' GROUP BY kind
  shape: { columns: [kind, n] }
- question: Which model would each AI role use now, and does its provider have a key?
  skill: oxplow-extension
  reaches:
    sql: >-
      SELECT role, effective_provider, effective_model, key_set
      FROM v_ai_role ORDER BY role
  shape: { columns: [role, effective_provider, effective_model, key_set] }
- question: Which credentials has a collector declared that have no value yet?
  skill: oxplow-extension
  reaches:
    sql: >-
      SELECT collector, name FROM v_collector_credential WHERE is_set = 0
      ORDER BY collector, name
  shape: { columns: [collector, name] }
- question: Which zone rules does this project have, and how many files does each claim?
  skill: oxplow-extension
  reaches:
    sql: >-
      SELECT position, zone, patterns, files FROM v_zone
      ORDER BY position IS NULL, position
  shape: { columns: [position, zone, patterns, files] }
- question: Which files fall outside every zone rule?
  skill: oxplow-extension
  reaches:
    sql: SELECT path FROM v_zone_unmatched ORDER BY path
  shape: { columns: [path] }
- question: Which settings does this project set itself, rather than leaving them at their default?
  skill: oxplow-extension
  reaches:
    sql: SELECT key, value FROM v_config_value WHERE origin = 'project' ORDER BY key
  shape: { columns: [key, value] }
- question: Which saved agent conversations could be resumed here, and which harness keeps each?
  skill: oxplow-extension
  reaches:
    sql: >-
      SELECT harness, native_id, title, updated_at FROM v_agent_conversation
      WHERE native_id IS NOT NULL ORDER BY updated_at DESC
  shape: { columns: [harness, native_id, title, updated_at] }
