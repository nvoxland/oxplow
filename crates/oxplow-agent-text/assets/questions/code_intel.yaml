# What an agent should be able to answer about the code itself.
- question: Which languages have a language server, is its binary installed, and is one running?
  skill: oxplow-codebase
  reaches:
    sql: >-
      SELECT language_id, source, binary_exists, running FROM v_lsp_server
      ORDER BY language_id
  shape: { columns: [language_id, source, binary_exists, running] }
