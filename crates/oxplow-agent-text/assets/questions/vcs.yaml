# What an agent should be able to answer about version control, and how
# (P5.F1; checked by `oxplow_sdk::answerability`, see
# `.context/extensions.md` "Answerability"). Each question names the
# skill that should lead the agent to its answer; everything `reaches`
# names must be in that skill's text.
- question: Who has changed this file the most?
  about: oxplow/file
  skill: oxplow-codebase
  reaches:
    sql: >-
      SELECT c.author, count(*) AS commits FROM v_commit c
      JOIN v_commit_file f ON f.sha = c.sha
      WHERE f.path = 'src/lib.rs' GROUP BY c.author ORDER BY commits DESC
  shape: { columns: [author, commits] }
- question: Which local branches have commits their upstream lacks, or lack its commits?
  skill: oxplow-codebase
  reaches:
    sql: >-
      SELECT name, upstream, ahead, behind FROM v_branch
      WHERE kind = 'local' AND upstream IS NOT NULL AND (ahead > 0 OR behind > 0)
  shape: { columns: [name, upstream, ahead, behind] }
- question: How far has this branch moved from main, and would it merge cleanly?
  skill: oxplow-codebase
  reaches:
    sql: >-
      SELECT ahead, behind, readiness, overlapping_files FROM v_branch_divergence
      WHERE base = 'main' AND head = 'feature'
  shape: { columns: [ahead, behind, readiness, overlapping_files] }
- question: Which commit is each stream's workspace on?
  skill: oxplow-codebase
  reaches:
    sql: SELECT id, branch, head_sha FROM v_stream WHERE archived_at IS NULL
  shape: { columns: [id, branch, head_sha] }
- question: What did this commit change?
  about: oxplow/commit
  skill: oxplow-codebase
  reaches:
    sql: SELECT path, status, additions, deletions FROM v_commit_file WHERE sha = 'abc123'
  shape: { columns: [path, status, additions, deletions] }
