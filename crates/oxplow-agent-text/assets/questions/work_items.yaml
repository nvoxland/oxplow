# What an agent should be able to answer and do about work items.
- question: What work is in progress, across every provider?
  skill: work-items
  reaches:
    sql: SELECT ref, provider, title FROM v_work_item WHERE state = 'in_progress'
  shape: { columns: [ref, provider, title] }
- question: What has been done on this work item so far?
  about: oxplow/work_item
  skill: work-items
  reaches:
    sql: SELECT id, started_at, ended_at, summary FROM v_effort WHERE work_item = 'work_item:oxplow:tsk1' ORDER BY started_at
  shape: { columns: [id, started_at, ended_at, summary] }
- question: What standing instructions did the person set for this thread and its stream?
  about: oxplow/thread
  skill: oxplow-runtime
  reaches:
    sql: >-
      SELECT s.prompt AS stream_prompt, t.prompt AS thread_prompt FROM v_thread t
      JOIN v_stream s ON s.id = t.stream_id WHERE t.ref = 'oxplow:oxplow/thread?id=thr1'
  shape: { columns: [stream_prompt, thread_prompt] }
- question: Mark a work item done.
  skill: work-items
  reaches:
    command: oxplow.work_item.transition
    input: { ref: "work_item:oxplow:tsk1", to: done }
- question: Record that one work item blocks another.
  skill: work-items
  reaches:
    command: oxplow.work_item.link
    input: { ref: "work_item:oxplow:tsk1", target: "work_item:oxplow:tsk2", link_type: blocks }
- question: Which files did this effort touch?
  about: oxplow/effort
  skill: oxplow-runtime
  reaches:
    sql: SELECT path, change_kind FROM v_effort_file WHERE effort_id = 1
  shape: { columns: [path, change_kind] }
- question: What should I pick up next on this thread?
  skill: work-items
  reaches:
    tool: oxplow_work_next
    input: { thread: "thr1" }
- question: What is on this thread's list, by state?
  skill: work-items
  reaches:
    tool: oxplow_thread_work
    input: { thread: "thr1" }
- question: What notes were recorded on this thread?
  skill: work-items
  reaches:
    tool: oxplow_thread_notes
    input: { thread: "thr1" }
- question: Give me a summary of this effort.
  about: oxplow/effort
  skill: oxplow-runtime
  reaches:
    tool: oxplow_effort_summary
    input: { effort: "eff1" }
- question: List this effort's files without writing SQL.
  about: oxplow/effort
  skill: oxplow-runtime
  reaches:
    tool: oxplow_effort_files
    input: { effort: "eff1" }
- question: Which agent sessions are on this thread, and what are their subagents doing?
  about: oxplow/thread
  skill: oxplow-runtime
  reaches:
    tool: oxplow_thread_sessions
    input: { thread: "thr1" }
- question: What happened in this agent session, turn by turn?
  skill: oxplow-runtime
  reaches:
    tool: oxplow_session_transcript
    input: { session: "ses1" }
