# What an agent should be able to answer and do about work items.
- question: What work is in progress, across every provider?
  skill: oxplow-runtime
  reaches:
    sql: SELECT ref, provider, title FROM v_work_item WHERE state = 'in_progress'
  shape: { columns: [ref, provider, title] }
- question: What are the children of a work item?
  skill: oxplow-runtime
  reaches:
    sql: SELECT ref, title, state FROM v_work_item WHERE parent_ref = 'work_item:oxplow:tsk1'
  shape: { columns: [ref, title, state] }
- question: Mark a work item done.
  skill: oxplow-runtime
  reaches:
    command: work_item.transition
    input: { ref: "work_item:oxplow:tsk1", to: done }
- question: Record that one work item blocks another.
  skill: oxplow-runtime
  reaches:
    command: work_item.link
    input: { ref: "work_item:oxplow:tsk1", target: "work_item:oxplow:tsk2", link_type: blocks }
