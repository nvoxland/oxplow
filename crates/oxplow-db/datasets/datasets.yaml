  tests:
    - { not_null: id }
    - { unique: id }
- name: effect_run
  version: 3
  key: [effect, event_id, attempt]
  description: "Each attempt at an extension effect's reaction to an event: the live consumer makes one — ran (`ok`), `skipped`, left a `proposal` for a person, or `failed` — and a person's `effect.retry` of a failed one makes the next. A failed attempt whose every step was a write to a provider keeping `idempotent_writes` is sent again by itself, at most twice (`auto`; `retry_at` says when); any other waits for a person. A reaction's state is its latest attempt's (`latest = 1`)."
  fields:
    - { name: "id", type: "INTEGER", doc: "Attempt id." }
    - { name: "effect", type: "TEXT", doc: "The effect: `<extension>/<id>`." }
    - { name: "extension", type: "", doc: "The extension that declares it." }
    - { name: "event_id", type: "TEXT", doc: "The event it reacted to (`v_event.id`)." }
    - { name: "event_seq", type: "INTEGER", doc: "That event's log position." }
    - { name: "attempt", type: "INTEGER", doc: "Which attempt at the reaction, from 1." }
    - { name: "origin", type: "TEXT", doc: "What started the attempt: `live` (the event's delivery), `retry` (a person's `effect.retry`), `backfill` (a person's `effect.backfill`) or `auto` (sent again by itself)." }
    - { name: "latest", type: "", doc: "1 when it is the reaction's latest attempt: its state is where the reaction stands." }
    - { name: "state", type: "TEXT", doc: "`started` (a step outside oxplow is running), `ok`, `skipped`, `proposed` or `failed`." }
    - { name: "reason", type: "TEXT", doc: "Why it skipped or failed." }
    - { name: "audit_id", type: "INTEGER", doc: "Its run's `command_audit` row, when its commands ran." }
    - { name: "proposal_id", type: "INTEGER", doc: "The proposal it left, when a command asked a person." }
    - { name: "started_at", type: "TEXT", doc: "When it started (RFC 3339)." }
    - { name: "finished_at", type: "TEXT", doc: "When it ended; NULL while `started`." }
    - { name: "retry_at", type: "TEXT", doc: "A failed attempt sent again by itself at this time (RFC 3339); NULL when it waits for a person, or wasn't failed." }
    - { name: "run_id", type: "TEXT", doc: "The attempt's run (`v_contribution_run.run_id`). (v2)" }
  tests:
    - { not_null: effect }
- name: contribution_run
  version: 1
  key: [run_id]
  description: "Each recorded contribution run, including live runs. It holds the contribution identity, actor, anchors, cause, outcome, cost and authority. Its input, result, prompts and credential values are private."
  relationships: [{ from: thread_id, to: thread.id }, { from: turn_id, to: agent_turn.id }, { from: session_id, to: agent_session.id }]
  groups: [contribution_run]
  fields:
    - { name: "uri", type: "TEXT", doc: "The run's URI (`oxplow:oxplow/contribution_run?id=<run_id>`)." }
  tests:
    - { not_null: run_id }
    - { unique: run_id }
- name: job_run
  version: 7
  key: [id]
  description: "Each job run: one execution of a job an extension declares (a `jobs:` declaration, run through its `jobs.write/enqueue` command) — which job, its state and its current attempt, and what that attempt has used so far. A job is the declaration (`oxplow:oxplow/job?job=<extension>/<id>`); a job run is one execution of it (`oxplow:oxplow/job_run?id=<id>`). What it was asked and what it answered stay private to the extension (`jobs.read/snapshot`); what it streams is in `v_job_run_output`."
  fields:
    - { name: "id", type: "TEXT", doc: "The run's id (a UUIDv7)." }
    - { name: "job", type: "TEXT", doc: "The job it runs: `oxplow:oxplow/job?job=<extension>/<id>` (`v_contribution.uri`)." }
    - { name: "intent_key", type: "TEXT", doc: "What it is about: the `intentKey` it was started with, one run per key and job (`review:oxplow:oxplow/request?id=req12`). (v2)" }
    - { name: "extension", type: "TEXT", doc: "The extension it belongs to." }
    - { name: "version", type: "TEXT", doc: "The extension's declared `version:` when it was started; NULL when it declares none." }
    - { name: "contract_version", type: "INTEGER", doc: "The job declaration's own `version:`." }
    - { name: "operation", type: "TEXT", doc: "What it runs: `ai.complete_typed`." }
    - { name: "state", type: "TEXT", doc: "`queued`, `running`, `succeeded`, `failed`, `cancelled` or `interrupted` (it stopped without a known end: oxplow restarted, or it lost its lease)." }
    - { name: "attempt", type: "INTEGER", doc: "Its current attempt, 0 before the first starts." }
    - { name: "cancellation_requested", type: "INT", doc: "1 once someone asked it to stop." }
    - { name: "invoker", type: "TEXT", doc: "Who started it, as an event source: `human`, `agent:thr3`, `effect:<ext>/<id>`, …" }
    - { name: "run_id", type: "TEXT", doc: "The run that started it (`v_contribution_run.run_id`)." }
    - { name: "created_at", type: "TEXT", doc: "When it was started (RFC 3339)." }
    - { name: "updated_at", type: "TEXT", doc: "When its state last changed (RFC 3339)." }
    - { name: "ai_calls", type: "INT", doc: "Model rounds its current attempt has finished." }
    - { name: "tool_calls", type: "INT", doc: "Tools the model called in its current attempt." }
    - { name: "input_tokens", type: "INT", doc: "Input tokens its current attempt's rounds reported (observed usage only)." }
    - { name: "output_tokens", type: "INT", doc: "Output tokens likewise." }
    - { name: "uri", type: "TEXT", doc: "`oxplow:oxplow/job_run?id=<id>`: its URI — what `jobs.read/snapshot`, `jobs.write/cancel` and `oxplow.job_run.cancel` take. (v3)" }
  tests:
    - { not_null: id }
    - { unique: id }
- name: job_run_output
  version: 1
  key: [job_id, attempt, seq]
  description: "What a job produced as it ran, in order: the model's reply text as it streamed (one row per short run of it), each tool the model called and what the tool answered, each model round's usage. Written while the attempt runs, so a page over it follows a job live."
  fields:
    - { name: "job_id", type: "TEXT", doc: "The job (`v_job_run.id`)." }
    - { name: "attempt", type: "INTEGER", doc: "Its attempt." }
    - { name: "seq", type: "INTEGER", doc: "Order within the attempt, from 1." }
    - { name: "kind", type: "TEXT", doc: "`text`, `tool_call`, `tool_result` or `usage`." }
    - { name: "at", type: "TEXT", doc: "When it was written (RFC 3339)." }
    - { name: "text", type: "TEXT", doc: "A `text` row's text; NULL for the rest." }
    - { name: "data", type: "TEXT", doc: "The row as JSON: `{ text }`, a tool call `{ id, name, arguments }`, a tool result `{ callId, result }` or `{ callId, error }`, usage `{ inputTokens, outputTokens, source, aiCallId }`." }
  tests:
    - { not_null: job_id }
    - { relationships: { column: job_id, to: job_run, field: id } }
- name: job_run_observation
  version: 1
  key: [id]
  description: "What a job's worker said after its attempt was no longer the job's: a result that arrived once the lease had been recovered, the approval revoked or the declaration changed. It never changes the job (that ended as recovery, cancel or revocation decided); it is kept as evidence, one row per late result."
  fields:
    - { name: "id", type: "TEXT", doc: "The observation's id." }
    - { name: "job_id", type: "TEXT", doc: "The job (`v_job_run.id`)." }
    - { name: "attempt", type: "INTEGER", doc: "The attempt the worker was running." }
    - { name: "fence", type: "INTEGER", doc: "That attempt's fence." }
    - { name: "at", type: "TEXT", doc: "When the late result was seen (RFC 3339)." }
    - { name: "outcome", type: "TEXT", doc: "`succeeded` or `failed`: how the worker ended." }
    - { name: "evidence", type: "TEXT", doc: "What the worker returned, as JSON; NULL when none was kept." }
  tests:
    - { not_null: id }
    - { unique: id }
    - { relationships: { column: job_id, to: job_run, field: id } }
- name: event_type
  version: 1
  key: [event_type, v]
  description: "Every event type the log has accepted, at each version: core types and those extensions declare (`event_types:`). An extension's removed types stay listed, unregistered, and their logged rows stay readable."
  fields:
    - { name: "event_type", type: "TEXT", doc: "`namespace.name`; an extension's namespace is its name with `-` read as `_`." }
    - { name: "v", type: "INTEGER", doc: "The schema version." }
    - { name: "extension", type: "TEXT", doc: "The extension that declares it; NULL for a core type." }
    - { name: "summary", type: "TEXT", doc: "What it records, as its extension declares; NULL for a core type." }
    - { name: "registered", type: "INTEGER", doc: "1 while the running vocabulary has it (it can be appended); 0 once its extension is gone, or while its extension's declaration of it is refused (a schema changed at a recorded version, a namespace collision)." }
    - { name: "latest", type: "", doc: "1 for the newest registered version of its type: what consumers read rows at." }
    - { name: "schema_json", type: "TEXT", doc: "The payload's JSON Schema, as first registered: a declared type's schema at a recorded version never changes." }
    - { name: "recorded_at", type: "TEXT", doc: "When it was first registered (RFC 3339)." }
  tests:
    - { not_null: event_type }
- name: replaceable
  version: 5
  key: [target]
  description: "The core sub-components an extension may replace with a page (`ui.replacements`), each with its versioned props contract: what the replacement is given, and must declare, instead of any host state. Which extension replaces one is the person's choice (`replacements:` in the project config) or, for a bound target, its provider's."
  fields:
    - { name: "target", type: "TEXT", doc: "The sub-component: `task.board`, `task.list`, `task.detail`, `task.detail.state`, `knowledge.detail.body`, `vcs.history.graph`." }
    - { name: "capability", type: "TEXT", doc: "What it belongs to: a capability (`vcs`), or `model:<owner>/<model>` for a shared model's items (`model:oxplow/task_record`)." }
    - { name: "bound", type: "INTEGER", doc: "1 when only the extension that holds the item may replace it: its own provider's, or the one that fills the model as the item's store (a task's states); 0 when any extension may, and the person chooses." }
    - { name: "version", type: "INTEGER", doc: "The contract's version; a declaration may pin it (`version:`)." }
    - { name: "props", type: "TEXT", doc: "JSON array of the prop names the replacement page is given and must declare as `params`." }
    - { name: "view", type: "TEXT", doc: "JSON array of the host page's view params the replacement shares: it reads and writes them as the core component does (`q`, `author`, `branch` for `vcs.history.graph`). (v2)" }
    - { name: "label", type: "TEXT", doc: "What a person calls it (\"board\", \"detail editor\")." }
  tests:
    - { not_null: target }
    - { unique: target }
- name: resource
  version: 8
  key: [resource]
  description: "Every resource a URI may name (`oxplow:<extension>/<resource>?<params>`), as the extensions declare them in `resources:` — oxplow-foundation's included, so none is special. Says what each one's params are and which view names it."
  fields:
    - { name: "resource", type: "TEXT", doc: "`<extension>/<name>`: `oxplow/file`, `acme/pr`." }
    - { name: "extension", type: "TEXT", doc: "The extension that declares it (`oxplow-foundation` for oxplow's own)." }
    - { name: "label", type: "TEXT", doc: "What one is called (`Pull request`)." }
    - { name: "params", type: "TEXT", doc: "JSON object of its params by name, each `{ required, pattern }`: a URI carries every required one, and each value matches its pattern." }
    - { name: "additional", type: "INTEGER", doc: "1 when a URI may carry params beyond its own (a page's)." }
    - { name: "resolve", type: "TEXT", doc: "The view whose rows name each one; NULL when no dataset holds it (a file, a page)." }
    - { name: "title", type: "TEXT", doc: "The column of `resolve` that titles one; NULL means `title`." }
    - { name: "searchable", type: "TEXT", doc: "The view search indexes it from; NULL when search doesn't." }
    - { name: "icon", type: "TEXT", doc: "The icon it is drawn with." }
    - { name: "wikilink", type: "TEXT", doc: "JSON `{ prefix, param }`: `[[<prefix>:<value>]]` names it with that param set; NULL when it has no sugar." }
    - { name: "description", type: "TEXT", doc: "One sentence saying what the resource is (`description:` in `resources:`); NULL when its declaration says nothing. Also `v_contribution.description` of the same resource (join on `global_name = resource`)." }
  tests:
    - { not_null: resource }
    - { unique: resource }
- name: contribution_health
  version: 7
  description: "Each extension contribution's health on this machine: a provider instance, a collector or an effect, under one failure policy — three failures in a row disable it until a person runs `oxplow.contribution.enable`."
  fields:
    - { name: "uri", type: "TEXT", doc: "The contribution's URI (`effect:tracker/fake`): the same as its `v_contribution.uri`." }
    - { name: "namespace", type: "TEXT", doc: "The namespace it is named in (its extension's): a contribution keeps its health when it moves to another extension in the namespace." }
    - { name: "contribution", type: "TEXT", doc: "The provider's, collector's or effect's id within it." }
    - { name: "kind", type: "TEXT", doc: "`provider`, `collector` or `effect`." }
    - { name: "state", type: "TEXT", doc: "`ok`, `failing` or `disabled`." }
    - { name: "reason", type: "TEXT", doc: "Why it's disabled." }
    - { name: "consecutive_failures", type: "INTEGER", doc: "Failures since its last success." }
    - { name: "last_ok_at", type: "TEXT", doc: "When it last succeeded (RFC 3339)." }
    - { name: "last_error", type: "TEXT", doc: "Its last failure." }
    - { name: "mean_ms", type: "REAL", doc: "A moving average of its successful runs or calls, in milliseconds." }
    - { name: "next_due_at", type: "TEXT", doc: "When it should next run (a schedule's next slot), if it runs on one." }
    - { name: "updated_at", type: "TEXT", doc: "When this row last changed." }
    - { name: "dead_letters", type: "", doc: "Events it couldn't handle and that wait for a person: dead letters of its consumer (its `uri`) or of events whose subject names it (its `uri`)." }
    - { name: "fresh", type: "", doc: "1 unless a scheduled run is overdue (`next_due_at` has passed) or a collector's last run failed (`state` isn't `ok`): its data is then the last good run's, not current. (v3)" }
  tests:
    - { not_null: namespace }
- name: snapshot
  version: 5
  description: "Snapshots: point-in-time captures of a stream's worktree, used to bracket turns, requests and diffs."
  fields:
    - { name: "id", type: "INTEGER", doc: "Snapshot id." }
    - { name: "stream_id", type: "INTEGER", doc: "Stream captured." }
    - { name: "created_at", type: "TEXT", doc: "RFC 3339 timestamp." }
    - { name: "revision", type: "TEXT", doc: "The VCS revision the captured tree equals (`git:<sha>`): set when the workspace was clean at the head; NULL otherwise." }
    - { name: "branch", type: "TEXT", doc: "Branch when captured, if known." }
    - { name: "tree_hash", type: "TEXT", doc: "Whole-tree identity: two snapshots with the same tree_hash hold the same files. NULL before V96." }
    - { name: "uri", type: "TEXT", doc: "`oxplow:oxplow/snapshot?id=<id>`: its URI, the one place SQL spells it — select and join on this, never rebuild it. (v2)" }
  tests:
    - { not_null: id }
    - { unique: id }
- name: snapshot_file
  version: 3
  description: "Every captured version of a file. A snapshot records only the files that changed since the stream's previous one, so a file's history is its rows by `captured_at`, and what a snapshot changed is its rows."
  fields:
    - { name: "id", type: "INTEGER", doc: "The captured file's id (a `file_snapshot` id, as `get_file_snapshot` takes)." }
    - { name: "snapshot_id", type: "INTEGER", doc: "The snapshot that captured it (v_snapshot.id)." }
    - { name: "stream_id", type: "INTEGER", doc: "The stream whose worktree it was captured in." }
    - { name: "path", type: "TEXT", doc: "Repo-relative file path." }
    - { name: "storage", type: "TEXT", doc: "`oxplow` (bytes in oxplow's blob store), `git` (a clean file, read from git), `oversize` (too large to keep) or `deleted` (the file was removed)." }
    - { name: "size_bytes", type: "INTEGER", doc: "Its size in bytes." }
    - { name: "content_hash", type: "TEXT", doc: "The identity of its bytes: two rows with the same hash hold the same content. NULL when oversize or deleted, and for a `git` row not yet compared." }
    - { name: "captured_at", type: "TEXT", doc: "When it was captured (RFC 3339)." }
    - { name: "first_changed_at", type: "TEXT", doc: "When the file watcher first reported the file changed since the stream's previous take (RFC 3339); NULL when the take found the change itself (the startup sweep, a file with no watcher event), which then lies only between the two takes. The watcher's time, so best effort. (v3)" }
    - { name: "last_changed_at", type: "TEXT", doc: "When the watcher last reported it changed before this take (RFC 3339); NULL like `first_changed_at`. (v3)" }
    - { name: "kind", type: "TEXT", doc: "What the snapshot did to the path against its previous row in the stream: `added` (new, or back after a deletion), `modified` (other bytes) or `deleted`; NULL when the row changed nothing (same bytes again, or a tombstone for a path already gone). (v2)" }
  tests:
    - { not_null: id }
    - { unique: id }
    - { not_null: path }
- name: snapshot_op
  version: 6
  description: "The snapshot operation log: one row per take that captured files (why it ran, what it is anchored to, the snapshot it left the worktree at and its parent). A request that found nothing waiting logs no row: it answers the stream's current snapshot, which is the newest row's. (A snapshot provider's mark is the exception: it logs a row for the state it marked, changed or not.)"
  fields:
    - { name: "seq", type: "INTEGER", doc: "Operation order within the project." }
    - { name: "stream_id", type: "INTEGER", doc: "Stream (worktree) the take ran on." }
    - { name: "snapshot_id", type: "INTEGER", doc: "Snapshot the worktree is at after the take (v_snapshot.id)." }
    - { name: "parent_snapshot_id", type: "INTEGER", doc: "Snapshot the worktree was at just before this take; parent → snapshot is what THIS take recorded (for a turn's changes use v_agent_turn.start_snapshot_id → snapshot_id)." }
    - { name: "trigger", type: "TEXT", doc: "Why: turn_end, quiet, startup, manual, git_refs, head_moved, run_measured (a run's reports were recorded: the code it measured)." }
    - { name: "thread_id", type: "INTEGER", doc: "Thread the take belongs to, if any." }
    - { name: "turn_id", type: "INTEGER", doc: "Agent turn the take belongs to, if any (v_agent_turn.id)." }
    - { name: "at", type: "TEXT", doc: "RFC 3339 timestamp." }
    - { name: "elapsed_ms", type: "INTEGER", doc: "How long the take took." }
    - { name: "budget_ms", type: "INTEGER", doc: "The caller's time budget, if it had one." }
    - { name: "over_budget", type: "INTEGER", doc: "1 when elapsed_ms exceeded budget_ms." }
    - { name: "file_count", type: "INTEGER", doc: "File rows recorded (0 only for a provider's mark that changed nothing, and a `head_moved` restamp)." }
    - { name: "provider", type: "TEXT", doc: "The snapshot implementation that took it (`oxplow`, `hashes`, …); NULL for takes recorded before it was kept. (v2)" }
    - { name: "contents", type: "INTEGER", doc: "1 when the take kept file contents; 0 when it recorded identities only ('Track changes only'): a read of that snapshot answers 'no contents', not 'expired'. (v2)" }
    - { name: "handle", type: "TEXT", doc: "A snapshot provider's own name for the state the take marked, which core hands back to it as the next mark's parent; NULL for takes by oxplow's own capture. (v3)" }
- name: stream
  version: 6
  description: "Streams: parallel lines of work, each its own git worktree. Exactly one is `primary` (the repo itself)."
  fields:
    - { name: "id", type: "INTEGER", doc: "Stream id." }
    - { name: "kind", type: "TEXT", doc: "`primary` (the repo) or `worktree`." }
    - { name: "title", type: "TEXT", doc: "Display name." }
    - { name: "branch", type: "TEXT", doc: "Git branch currently checked out in the worktree." }
    - { name: "worktree_path", type: "TEXT", doc: "Absolute path of the stream's worktree." }
    - { name: "created_at", type: "TEXT", doc: "RFC 3339 timestamp." }
    - { name: "updated_at", type: "TEXT", doc: "RFC 3339 timestamp." }
    - { name: "archived_at", type: "TEXT", doc: "Set when the stream was archived; NULL while live." }
    - { name: "uri", type: "TEXT", doc: "`oxplow:oxplow/stream?id=str<id>`: its URI, the one place SQL spells it — select and join on this, never rebuild it. (v2)" }
    - { name: "prompt", type: "TEXT", doc: "The standing instructions the person set for every agent session in this stream (appended to its system prompt); NULL when none. (v3)" }
    - { name: "head_sha", type: "TEXT", doc: "The commit its workspace is on (HEAD), whether it has a branch checked out or is detached; NULL before its first commit or the first refs scan. Restated whenever refs move. (v4)" }
  tests:
    - { not_null: id }
    - { unique: id }
- name: subagent
  version: 3
  description: "Subagents of an agent session: who in a session acted, from the `agent.subagent.started` / `.finished` events that bracket one and the tool calls that name it. A subagent is not a session; it has no process oxplow knows. Claude Code brackets its subagents, so they are `running` or `finished`; Codex and opencode children appear only in tool calls, so they are `unknown` (calls but no bracket)."
  fields:
    - { name: "id", type: "TEXT", doc: "The harness's id for it, or the id of the call that started it." }
    - { name: "kind", type: "TEXT", doc: "What kind of subagent the harness says it is (Claude's `agent_type`); NULL when it says nothing." }
    - { name: "agent_session_id", type: "INTEGER", doc: "The session it acted in (v_agent_session.id)." }
    - { name: "thread_id", type: "INTEGER", doc: "The session's thread." }
    - { name: "turn_id", type: "", doc: "The turn it started in, else the turn of its first call; NULL when neither says." }
    - { name: "started_at", type: "TEXT", doc: "When its `agent.subagent.started` was logged; NULL for an `unknown` one." }
    - { name: "finished_at", type: "TEXT", doc: "When it stopped or handed its report back; NULL while running or unknown." }
    - { name: "calls", type: "", doc: "Tool calls made as it (v_tool_call.subagent_id)." }
    - { name: "last_activity_at", type: "TEXT", doc: "The newest of its start, its calls and its finish." }
    - { name: "state", type: "TEXT", doc: "`running` (started, not finished), `finished`, or `unknown` (only tool calls name it)." }
    - { name: "finished_event_id", type: "TEXT", doc: "The event that finished it; its `result` body is the subagent's last message, read as `subagent:<id>#result`." }
    - { name: "session_uri", type: "TEXT", doc: "Its session's URI (`oxplow:oxplow/agent_session?id=ses3`): where it opens." }
    - { name: "uri", type: "TEXT", doc: "`oxplow:oxplow/subagent?agent=<id>&session=ses<n>`: its URI, the one place SQL spells it — select and join on this." }
  tests:
    - { not_null: uri }
    - { unique: uri }
- name: symbol
  version: 4
  description: "What each stream's files define — functions, methods, types, fields, constants, modules — as oxplow's own tree-sitter extraction reads them (every supported language, no language server needed): the current tree, restated per changed file at each snapshot. `v_symbol_capture` says what each snapshot's collection covered."
  fields:
    - { name: "uri", type: "TEXT", doc: "`oxplow:oxplow/symbol?path=<path>&symbol=<id>`, the current symbol (no revision; pin one with `@snap:<id>` / `@git:<sha>`). The id is the containers and the name joined by `::` (`Parser::parse`, `<Parser as Display>::fmt`), the parameter types in languages that overload by them (`Parser::parse(String,int)`), and `~n` for the nth same id in a file (`main~2`). Unique per stream." }
    - { name: "snapshot_id", type: "INTEGER", doc: "The snapshot the file's symbols were read at." }
    - { name: "stream_id", type: "INTEGER", doc: "The stream (v_stream.id)." }
    - { name: "path", type: "TEXT", doc: "Workspace-relative file." }
    - { name: "name", type: "TEXT", doc: "The symbol's own name." }
    - { name: "kind", type: "TEXT", doc: "`function`, `method`, `constructor`, `class`, `struct`, `enum`, `enum_member`, `interface`, `trait`, `type`, `field`, `constant`, `variable`, `module`, `namespace` or `macro` — one vocabulary for every language." }
    - { name: "container", type: "TEXT", doc: "What it's inside, `::`-joined (`Parser`, `acme::Parser`); NULL at top level." }
    - { name: "signature", type: "TEXT", doc: "Its parameter types (or dispatch value) as written, without parentheses, in languages that tell overloads apart by them; NULL otherwise." }
    - { name: "language", type: "TEXT", doc: "Its language (`rust`, `typescript`, …)." }
    - { name: "line", type: "INTEGER", doc: "Where its name is (what to jump to), 1-based." }
    - { name: "col", type: "INTEGER", doc: "1-based." }
    - { name: "start_line", type: "INTEGER", doc: "Where the whole definition starts, 1-based." }
    - { name: "start_col", type: "INTEGER", doc: "1-based." }
    - { name: "end_line", type: "INTEGER", doc: "Where the whole definition ends (its body included), 1-based: the lines `start_line`..`end_line` are the symbol." }
    - { name: "end_col", type: "INTEGER", doc: "1-based, exclusive." }
  tests:
    - { not_null: uri }
    - { not_null: name }
    - { sql: "SELECT 1 FROM v_symbol GROUP BY stream_id, uri HAVING count(*) > 1" }
- name: symbol_capture
  version: 2
  description: "One row per snapshot the symbol collector handled: how many changed files it read definitions from, and how many it couldn't read."
  fields:
    - { name: "snapshot_id", type: "INTEGER", doc: "The snapshot (v_snapshot.id)." }
    - { name: "stream_id", type: "INTEGER", doc: "The stream (v_stream.id)." }
    - { name: "files_collected", type: "INTEGER", doc: "Changed files in a supported language whose definitions were read." }
    - { name: "files_failed", type: "INTEGER", doc: "Changed files whose content couldn't be read at the snapshot (not kept, or not text)." }
    - { name: "captured_at", type: "TEXT", doc: "RFC 3339 timestamp." }
  tests:
    - { not_null: snapshot_id }
    - { unique: snapshot_id }
- name: tag
  version: 1
  description: "Tags, refreshed with the branches on boot and whenever refs move."
  fields:
    - { name: "name", type: "TEXT", doc: "Tag name." }
    - { name: "sha", type: "TEXT", doc: "The commit it points at (v_commit.sha); annotated tags peeled." }
    - { name: "updated_at", type: "TEXT", doc: "When oxplow last read it (RFC 3339)." }
- name: test_case
  version: 2
  description: "Each test case in a run that produced a report (runs with only counts have none)."
  fields:
    - { name: "run_id", type: "INTEGER", doc: "The run (v_test_run.id)." }
    - { name: "suite", type: "", doc: "Report suite name." }
    - { name: "classname", type: "", doc: "Grouping path (module path, file·class, describe path)." }
    - { name: "name", type: "", doc: "Test name." }
    - { name: "status", type: "", doc: "`passed`, `failed` or `skipped`." }
    - { name: "time_ms", type: "", doc: "Its duration, when the report gave one." }
    - { name: "message", type: "", doc: "What a failed case's report said went wrong: its failure message, then its body (the assertion and where it happened). NULL for a case that didn't fail, one whose report said nothing, and a failure past the per-run cap (64 KB of messages per run, 4 KB each, a cut one ending in `…`)." }
- name: test_run
  version: 5
  description: "Every test run oxplow saw (hook-observed or reported by an agent), with its counts."
  fields:
    - { name: "id", type: "INTEGER", doc: "Run id; `oxplow:oxplow/run?id=<id>` is how a run is cited." }
    - { name: "stream_id", type: "INTEGER", doc: "Stream it ran in (v_stream.id)." }
    - { name: "thread_id", type: "INTEGER", doc: "Thread whose agent ran it, if known." }
    - { name: "command", type: "", doc: "The command that was run." }
    - { name: "exit_code", type: "", doc: "Its exit code, if known." }
    - { name: "passed", type: "", doc: "Tests passed (NULL when not reported)." }
    - { name: "failed", type: "", doc: "Tests failed (NULL when not reported)." }
    - { name: "skipped", type: "", doc: "Tests skipped (NULL when not reported)." }
    - { name: "total", type: "", doc: "Tests run in total (NULL when not reported)." }
    - { name: "duration_ms", type: "", doc: "Wall-clock duration, if known." }
    - { name: "provenance", type: "TEXT", doc: "`observed` (oxplow parsed a report) or `asserted` (an agent reported counts)." }
    - { name: "source", type: "TEXT", doc: "What recorded it (`hook`, `mcp`, …)." }
    - { name: "branch", type: "TEXT", doc: "Branch checked out when it ran." }
    - { name: "closest_vcs_rev", type: "TEXT", doc: "The VCS revision (a git sha) the tested tree was at or nearest to." }
    - { name: "captured_at", type: "TEXT", doc: "When it was recorded (RFC 3339)." }
    - { name: "turn_id", type: "INTEGER", doc: "The agent turn it ran in (v_agent_turn.id), if it ran in one." }
- name: thread
  version: 7
  description: "Threads: independent lines of the person's work inside a stream. A thread needs no agent and may have several: its agent sessions are v_agent_session rows."
  fields:
    - { name: "id", type: "INTEGER", doc: "Thread id." }
    - { name: "stream_id", type: "INTEGER", doc: "Owning stream (v_stream.id)." }
    - { name: "title", type: "TEXT", doc: "Display name." }
    - { name: "sort_index", type: "INTEGER", doc: "Order within the stream." }
    - { name: "created_at", type: "TEXT", doc: "RFC 3339 timestamp." }
    - { name: "updated_at", type: "TEXT", doc: "RFC 3339 timestamp." }
    - { name: "closed_at", type: "TEXT", doc: "Set when the thread was closed; NULL while it is open. Open or closed is all a thread's state is (v4: `status` is gone)." }
    - { name: "archived_at", type: "TEXT", doc: "Set when the thread was archived." }
    - { name: "uri", type: "TEXT", doc: "`oxplow:oxplow/thread?id=thr<id>`: its URI, the one place SQL spells it — select and join on this, never rebuild it. (v3)" }
    - { name: "mark", type: "TEXT", doc: "The person's colour for its tab — `amber`, `red`, `green`, `blue` or `violet` — or NULL when unmarked. It changes nothing else. (v4)" }
    - { name: "prompt", type: "TEXT", doc: "The standing instructions the person set for this thread's agent sessions (appended to its system prompt, after the stream's); NULL when none. (v5)" }
  tests:
    - { not_null: id }
    - { unique: id }
- name: agent_session
  version: 12
  description: "Agent sessions: the agent slots a person opened on a thread, each a harness in a terminal. The row is the slot, not the process: a harness process ending leaves it open; closing the session, its thread or its stream's archive closes it."
  fields:
    - { name: "id", type: "INTEGER", doc: "Session id (its URI is `oxplow:oxplow/agent_session?id=ses<id>`)." }
    - { name: "thread_id", type: "INTEGER", doc: "The thread it's on (v_thread.id)." }
    - { name: "harness", type: "TEXT", doc: "What runs in it: `claude`, `codex`, `opencode`, or a harness an extension declares." }
    - { name: "title", type: "TEXT", doc: "What the person called it; empty until renamed." }
    - { name: "resume_session_id", type: "TEXT", doc: "The harness's own session id, to resume it; empty when unknown." }
    - { name: "host", type: "TEXT", doc: "The host it runs on; NULL is the local machine." }
    - { name: "opened_at", type: "TEXT", doc: "RFC 3339 timestamp." }
    - { name: "closed_at", type: "TEXT", doc: "When its slot was closed; NULL while open." }
    - { name: "closed_reason", type: "TEXT", doc: "`closed` (closed itself), `thread_closed` or `stream_archived`; NULL while open." }
    - { name: "updated_at", type: "TEXT", doc: "RFC 3339 timestamp." }
    - { name: "pid", type: "INTEGER", doc: "OS pid of the process the daemon spawned for it, rewritten on every spawn; NULL for a session with no process of its own (a chat) or not yet spawned. May be dead or reused: read it with last_seen_at. (v2)" }
    - { name: "last_seen_at", type: "TEXT", doc: "The newest hook seen from it, to the 30 s (RFC 3339); NULL before the first. A live agent has a recent one and a pid that exists. (v2)" }
    - { name: "uri", type: "TEXT", doc: "`oxplow:oxplow/agent_session?id=ses<id>`: its URI, the one place SQL spells it — select and join on this, never rebuild it. (v4)" }
    - { name: "native_title", type: "TEXT", doc: "The name its harness gives the conversation it is bound to (Claude's `/rename`, a generated title); empty when it gave none, and cleared when the slot moves to another conversation. (v6)" }
    - { name: "fork_next", type: "INTEGER", doc: "1 when its next launch forks the conversation it is bound to instead of resuming it. (v6)" }
    - { name: "display_name", type: "TEXT", doc: "What a person calls it: its `title`, else its `native_title`, else the harness and the day it was opened. The one place a session is named. (v5; v6: the native title)" }
    - { name: "bound_origin", type: "TEXT", doc: "How it came to its current conversation (v_agent_session_binding.origin); NULL when it is bound to none. (v6)" }
    - { name: "reopenable", type: "INT", doc: "1 when `oxplow.agent_session.reopen` accepts it: a person closed it (`closed_reason` is `closed`) and its thread is still open; else 0. (v11)" }
  tests:
    - { not_null: id }
    - { unique: id }
    - { relationships: { column: thread_id, to: thread, field: id } }
- name: asset
  version: 2
  description: "Each asset's last recompute: derived data computed from tables — the metric cube, a materialized dataset — recomputed when a commit touches one of its inputs, or on its clock; and its last failure, until one succeeds."
  fields:
    - { name: "asset", type: "TEXT", doc: "The asset: `metric_cube`, or a materialized dataset's view (`v_<name>`)." }
    - { name: "computed_at", type: "TEXT", doc: "When it was last recomputed (RFC 3339)." }
    - { name: "events_to", type: "INTEGER", doc: "The event log's highest seq when that recompute began: what its inputs had seen." }
    - { name: "snapshot_id", type: "INTEGER", doc: "The snapshot it was computed against, when it has one." }
    - { name: "elapsed_ms", type: "INTEGER", doc: "How long the recompute took." }
    - { name: "mode", type: "TEXT", doc: "For a materialized dataset: `full` (refilled whole) or `incremental` (rows past its watermark appended); NULL otherwise." }
    - { name: "watermark", type: "INTEGER", doc: "For an incremental dataset: the highest watermark value it holds." }
    - { name: "row_count", type: "INTEGER", doc: "For a materialized dataset: how many rows it holds." }
    - { name: "failed_at", type: "TEXT", doc: "When its last recompute failed, while no later one has succeeded (RFC 3339); NULL otherwise. Its rows are the last good ones." }
    - { name: "error", type: "TEXT", doc: "Why that recompute failed (a materialized dataset's SELECT emitting one key twice, a query error)." }
  tests:
    - { not_null: asset }
    - { unique: asset }
- name: test_case_stat
  version: 2
  description: "Each test's summary per stream, branch and producer: what it is doing now and how it has behaved — flaky (flips), recently broken (last_failed_at), slow (max_ms, mean_ms). Updated with every test run; a run records per-case facts only where they change something, so this is where per-test history lives."
  fields:
    - { name: "stream_id", type: "INTEGER", doc: "Stream it ran in (v_stream.id)." }
    - { name: "branch", type: "TEXT", doc: "Branch checked out when it ran; empty when unknown." }
    - { name: "producer", type: "TEXT", doc: "What recorded the runs (`tests`)." }
    - { name: "subject", type: "TEXT", doc: "The test: `oxplow:oxplow/test?class=<classname>&name=<name>`." }
    - { name: "last_status", type: "TEXT", doc: "`passed`, `failed` or `skipped` in its latest run." }
    - { name: "last_ms", type: "REAL", doc: "Its duration in its latest timed run, in milliseconds." }
    - { name: "max_ms", type: "REAL", doc: "Its longest duration in any run." }
    - { name: "mean_ms", type: "", doc: "Its mean duration across its timed runs." }
    - { name: "runs", type: "INTEGER", doc: "Runs it was part of." }
    - { name: "failures", type: "INTEGER", doc: "Runs it failed in." }
    - { name: "flips", type: "INTEGER", doc: "Times its status changed from one run to the next: how flaky it is." }
    - { name: "first_seen_at", type: "TEXT", doc: "Its first run here (RFC 3339)." }
    - { name: "last_seen_at", type: "TEXT", doc: "Its latest run here (RFC 3339)." }
    - { name: "last_failed_at", type: "TEXT", doc: "When it last failed; NULL if never." }
    - { name: "last_passed_at", type: "TEXT", doc: "When it last passed; NULL if never." }
    - { name: "last_run_id", type: "INTEGER", doc: "Its latest run (v_test_run.id)." }
  tests:
    - { not_null: subject }
    - { relationships: { column: stream_id, to: stream, field: id } }
- name: collector
  version: 4
  key: [uri]
  description: "Every enabled extension's collectors, one row each, with their standing: whether this machine has them on, their last run and its outcome, and when the next scheduled run is due. What Settings → Data lists. Run one with `oxplow.collector.sync` (`input.collector` is `<extension>/<id>`); turn a disabled one back on with `oxplow.contribution.enable`. Its network and credential standing on this machine is `v_collector_state` and `v_collector_credential` (join on `uri`); its declaration is `v_contribution`; its run history is `v_contribution_run`."
  fields:
    - { name: "uri", type: "TEXT", doc: "`oxplow:oxplow/collector?collector=<namespace>/<id>`: its URI, the same as `v_contribution.uri` and `v_collector_run.uri`." }
    - { name: "extension", type: "TEXT", doc: "The extension that declares it (`project` for the project's own)." }
    - { name: "namespace", type: "TEXT", doc: "The namespace it is named in (`project` for the project's own); `<namespace>/<id>` is what `oxplow.collector.sync` takes as `collector`." }
    - { name: "id", type: "TEXT", doc: "Its id within the namespace." }
    - { name: "description", type: "TEXT", doc: "One sentence saying what it collects: its `doc:` in the manifest. Joins `v_contribution` on `uri`." }
    - { name: "trigger", type: "TEXT", doc: "How it comes to run: `call` (manual), `schedule` (`every:`), `events` (`on:`) or `run` (after a test or analysis run)." }
    - { name: "enabled", type: "INT", doc: "1 unless failures disabled it on this machine (`disabled_reason` says why)." }
    - { name: "state", type: "TEXT", doc: "`disabled`, `failing` (its health is failing or its last run failed), `never_run` or `ok`." }
    - { name: "last_run_at", type: "TEXT", doc: "When it last ran (RFC 3339); NULL when it never ran." }
    - { name: "last_status", type: "TEXT", doc: "The last run's outcome: `ok`, `error` or `skipped`; NULL when it never ran." }
    - { name: "error", type: "TEXT", doc: "The last run's error, when it failed." }
    - { name: "row_counts_json", type: "TEXT", doc: "Rows per entity after the last successful run, as JSON." }
    - { name: "disabled_reason", type: "TEXT", doc: "Why it is disabled; NULL when it is not." }
    - { name: "next_due_at", type: "TEXT", doc: "When a scheduled collector should next run (RFC 3339); NULL when it has no schedule or no health row yet." }
    - { name: "fresh", type: "", doc: "1 unless a scheduled run is overdue or its last run failed, so its data is the last good run's; NULL before it has a health row." }
  tests:
    - { not_null: uri }
- name: collector_run
  version: 7
  description: "Each collector's last run: its outcome, the row counts it wrote and its checkpoint. A collector is owned by an extension, the project (`project`) or oxplow (`built-in`)."
  fields:
    - { name: "owner", type: "TEXT", doc: "The extension that declares it, `project` for `.oxplow/project.yaml`, or `built-in`." }
    - { name: "id", type: "TEXT", doc: "The collector's id within its owner (may be dotted: `repo.scan_clone`)." }
    - { name: "status", type: "TEXT", doc: "`ok`, `error` (what failed, or a permission its extension lacks; v4), or `skipped` (the loop guard refused its run for an event; `error` says why)." }
    - { name: "last_run_at", type: "TEXT", doc: "When it last ran (RFC 3339)." }
    - { name: "error", type: "TEXT", doc: "The last run's error, when it failed." }
    - { name: "row_counts_json", type: "TEXT", doc: "Rows per entity after the last successful run, as JSON." }
    - { name: "cursor_json", type: "TEXT", doc: "Its checkpoint: the opaque state its script or provider read returned last." }
    - { name: "last_event_id", type: "INTEGER", doc: "The seq of the last trigger event it ran for." }
    - { name: "run_id", type: "TEXT", doc: "Its last run (`v_contribution_run.run_id`); NULL for a run before runs were recorded. (v2)" }
    - { name: "uri", type: "TEXT", doc: "`oxplow:oxplow/collector?collector=<owner>/<id>`: its URI, the one place SQL spells it — select and join on this, never rebuild it. (v3)" }
  tests:
    - { not_null: owner }
    - { not_null: id }
- name: pending_run
  version: 2
  key: [owner, id]
  description: "Runs deferred by pacing: a collector whose trigger sets `settle`, `at_most` or `idle`, or core's change analysis of a working tree or running request (`owner` `core`, `id` `change/<kind>/<target>`). Each waiting job, the latest event it'll run for, and since when; a view showing its result can say it's updating while the row is here, and the row goes once the run happens."
  fields:
    - { name: "owner", type: "TEXT", doc: "Whose job: a collector's extension, `project` or `built-in`; `core` for change analysis." }
    - { name: "id", type: "TEXT", doc: "The collector's id within its owner, or `change/working/<stream>` / `change/request/<stream>/<request>`." }
    - { name: "event_seq", type: "INTEGER", doc: "The latest triggering event it will run for (v_event.seq)." }
    - { name: "since", type: "TEXT", doc: "When its run was first deferred (RFC 3339)." }
    - { name: "touched", type: "TEXT", doc: "When a triggering event last arrived for it (RFC 3339): what `settle` counts from." }
- name: contribution
  version: 13
  key: [uri]
  description: "Every enabled extension's contributions, one row each, as their descriptors say: its URI (`<kind>:<extension>/<id>`, or `<kind>:<name>` for a command, metric, measure, dimension, event type or ref kind — the dataset that owns every contribution kind's URI), who contributed it and at what version, how it runs, what it needs, and the shared name it holds. What `list_extensions` counts and the reference documents. Kinds move onto descriptors one by one; a kind not yet listed here keeps its own listing."
  fields:
    - { name: "uri", type: "TEXT", doc: "Its ref: `oxplow:oxplow/job?job=change_review/review`, `oxplow:oxplow/collector?collector=triage/todos`, `oxplow:oxplow/command?command=oxplow.tasks.clear_finished`. (v3, was `id`)" }
    - { name: "extension", type: "TEXT", doc: "The extension that declares it." }
    - { name: "namespace", type: "TEXT", doc: "The namespace it is named in (its extension's `namespace:`): the first part of a local kind's id, kept when it moves to another extension in the namespace." }
    - { name: "kind", type: "TEXT", doc: "`collector`, `effect`, `command`, `metric`, `skill`, `provider`, `page`, …" }
    - { name: "local", type: "TEXT", doc: "Its id within the extension, or its global name (a command's bus id, a metric's key)." }
    - { name: "origin", type: "TEXT", doc: "`project` or `bundled`." }
    - { name: "version", type: "TEXT", doc: "The extension's `version:` (a bundled one's is oxplow's); NULL when it declares none." }
    - { name: "contract_version", type: "INTEGER", doc: "The contract's own version (a dataset's, an event type's), when it has one." }
    - { name: "runs_on", type: "TEXT", doc: "How it comes to run, as JSON: `{on: events, types}`, `{on: schedule, every}`, `{on: run}`, `{on: call}`, `{on: query}`, `{on: mount}`, `{on: agent}`, `{on: declared}`." }
    - { name: "needs", type: "TEXT", doc: "What it requires (capabilities, features, scopes), as a JSON array. Never what a person granted." }
    - { name: "after", type: "TEXT", doc: "What an effect or a collector runs after when one event reaches it and them (JSON array of refs: `effect:<ext>/<id>`, `oxplow:oxplow/collector?collector=<ext>/<id>`, `oxplow:oxplow/consumer?name=<name>`), as the catalog resolved its `after:`." }
    - { name: "order_level", type: "INTEGER", doc: "Where an effect or a collector runs among what one event reaches: 0 first, each after every contribution it names. NULL for a kind that isn't ordered." }
    - { name: "global_name", type: "TEXT", doc: "The name it holds in a space every extension shares (a metric key, a skill name, `<capability>/<id>`); NULL when none." }
    - { name: "file", type: "TEXT", doc: "The file it's declared in, inside its extension: `extension.yaml`, a page's `pages/<slug>.yaml`, a dataset's SQL. Join it to the extension (`v_extension`) for where that runs; never a machine path." }
    - { name: "line", type: "INTEGER", doc: "Its entry's line there; NULL for a contribution that is a whole file (a page, a dataset's SQL)." }
    - { name: "description", type: "TEXT", doc: "One sentence saying what it is, a collector's `doc:`, or the `description:` of a resource, a dimension or an implementation (the same text as on `v_collector`, `v_resource`, `v_dimension` and `v_capability_provider`); NULL for a kind whose declaration has none." }
  tests:
    - { not_null: uri }
- name: page
  version: 4
  key: [uri]
  description: "Every page file of every enabled extension — pages, parts and queries: its metadata, what it renders and how an agent finds it. Restated with each extension generation. Its params are `v_page_param`, the questions it answers `v_page_answer`."
  fields:
    - { name: "uri", type: "TEXT", doc: "`oxplow:oxplow/page?page=<extension>/<slug>`; `page=<slug>` for an extension whose namespace is `oxplow`." }
    - { name: "extension", type: "TEXT", doc: "The extension that declares it (v_extension.name)." }
    - { name: "id", type: "TEXT", doc: "`<extension>/<slug>`: the page file's name under the extension." }
    - { name: "title", type: "TEXT", doc: "What the person sees." }
    - { name: "description", type: "TEXT", doc: "What it shows; empty when it says nothing." }
    - { name: "label", type: "TEXT", doc: "What its tab says, a template over its params, when not its title; NULL otherwise." }
    - { name: "icon", type: "TEXT", doc: "Its icon; NULL for the default." }
    - { name: "category", type: "TEXT", doc: "The launcher section it is listed under (`Work`, `Code`, `Activity`, `Data`, …); NULL when it is opened only from elsewhere." }
    - { name: "keywords", type: "TEXT", doc: "Extra words the launcher matches; NULL for none." }
    - { name: "params", type: "TEXT", doc: "Its params as a JSON array (see `v_page_param` for them as rows)." }
    - { name: "renders", type: "TEXT", doc: "The resource kinds it renders (`oxplow/commit`), as a JSON array; `[]` for a route." }
    - { name: "default", type: "INTEGER", doc: "1 when it is the default page of the kinds it renders." }
    - { name: "pinned", type: "INTEGER", doc: "1 when it is pinned in the rail." }
    - { name: "kind", type: "TEXT", doc: "`page` (a tab and a URL; in the launcher when `category` is set), `part` (drawn only inside a host page: an embed, a mount, a panel, a row's expand) or `query` (rows other pages read; no view). (v3)" }
    - { name: "tool", type: "TEXT", doc: "The MCP tool it is also offered as, namespaced; NULL for none." }
    - { name: "needs", type: "TEXT", doc: "The capabilities (or features) it needs, as a JSON array." }
    - { name: "source", type: "TEXT", doc: "Its source file, the one to edit, relative to the project; NULL when no source is here (it ships with oxplow)." }
    - { name: "deployment", type: "TEXT", doc: "Where its extension's files come from: `deployed`, `shipped`, `source`, `undeployed` or `not_here` (`v_extension.deployment`)." }
    - { name: "running_uri", type: "TEXT", doc: "The file URI of the copy that runs, pinned to its deployment (`oxplow:oxplow/file?path=<extension>/pages/<file>&rev=<hash>&filesystem=oxplow:extensions`): links to it stay on that copy, and it changes when a redeploy changes the running one. NULL when the extension runs no deployment (read from its source, or not deployed). (v2)" }
  tests:
    - { not_null: uri }
    - { unique: uri }
- name: page_answer
  version: 1
  key: [page_uri, position]
  description: "Each question a page answers, with the params that answer it: what an agent finds a page by and what a person is offered on the pages of `about`'s kind. Restated with each extension generation."
  fields:
    - { name: "page_uri", type: "TEXT", doc: "The page (`v_page.uri`)." }
    - { name: "position", type: "INTEGER", doc: "Its place among the page's answers, from 1." }
    - { name: "question", type: "TEXT", doc: "The question, as the person would ask it." }
    - { name: "about", type: "TEXT", doc: "The resource kind whose pages offer it; NULL when it is about nothing in particular." }
    - { name: "params", type: "TEXT", doc: "The params that answer it, as a JSON object." }
- name: page_param
  version: 2
  key: [page_uri, position]
  description: "Each param a page takes, typed, in the order it declares them. Restated with each extension generation."
  fields:
    - { name: "page_uri", type: "TEXT", doc: "The page (`v_page.uri`)." }
    - { name: "position", type: "INTEGER", doc: "Its place among the page's params, from 1." }
    - { name: "name", type: "TEXT", doc: "The param's name." }
    - { name: "type", type: "TEXT", doc: "What it holds: `text`, `choice`, `bool`, `date_range`, `branch` or `search`." }
    - { name: "role", type: "TEXT", doc: "What it is to the page: `resource` (names what it shows), `filter` (narrows how) or `selection`." }
    - { name: "label", type: "TEXT", doc: "What the control says; NULL for the name." }
    - { name: "default", type: "TEXT", doc: "Its default, as JSON; NULL for none." }
    - { name: "options", type: "TEXT", doc: "The values a choice takes, as a JSON array of `{value, label}`; `[]` when fixed by a loader (`options_from`) or not a choice." }
- name: extension
  version: 8
  key: [uri]
  description: "Every extension the project knows — its own (sources in `.oxplow/extensions/`, or where `extensionSources` says) and the ones that ship with oxplow — enabled or not, with where its files come from (`deployment`) and why it loaded badly if it did. One listed as on that has nothing to run here is a row too (`undeployed`, `not_here`). What an extension contributes is in `v_contribution` (count it by `extension` and `kind`); its pages are `v_page`. Restated with each extension generation; an extension that fails to load holds its generation back, so it is not a row — `oxplow_validate_extension` says why. `errors` and `warnings` are what a loaded one reports."
  fields:
    - { name: "uri", type: "TEXT", doc: "`oxplow:oxplow/extension?name=<name>`." }
    - { name: "name", type: "TEXT", doc: "Its name." }
    - { name: "namespace", type: "TEXT", doc: "The namespace its commands' ids are under." }
    - { name: "description", type: "TEXT", doc: "What it is, in a line." }
    - { name: "path", type: "TEXT", doc: "The folder its files are read from: its deployment in the store, or its source relative to the checkout." }
    - { name: "origin", type: "TEXT", doc: "`project` or `bundled` (ships with oxplow, read-only)." }
    - { name: "version", type: "TEXT", doc: "Its `version:`; NULL when it declares none." }
    - { name: "enabled", type: "INTEGER", doc: "0 when configuration disables it or a public contract blocks it: it contributes nothing." }
    - { name: "purpose", type: "TEXT", doc: "Why it exists (its intent); NULL when the manifest didn't load." }
    - { name: "deployment", type: "TEXT", doc: "Where its files come from: `deployed` (a deployment in the store, `v_extension_deployment`), `shipped` (the deployment that ships with oxplow), `source` (read from its source folder), `undeployed` (its source is here but it was never deployed; it runs nothing) or `not_here` (listed as on, but neither its source nor a deployment is on this machine). (v2)" }
    - { name: "hash", type: "TEXT", doc: "The hash of the deployment it runs; NULL when it runs none. (v2)" }
    - { name: "errors", type: "TEXT", doc: "Problems reported while loading it, as a JSON array of diagnostics: `{ severity, code, file, line, contribution, message, fix, mismatch, shown }` — `file` relative to its folder, `code` stable and dotted (`manifest.parse`), `shown` the line a person reads under its source folder; `[]` when healthy. (v8)" }
    - { name: "warnings", type: "TEXT", doc: "Things worth fixing that don't stop it loading, as a JSON array of diagnostics shaped as `errors`. (v8)" }
    - { name: "permissions", type: "TEXT", doc: "What its manifest declares it may reach beyond the baseline (`permissions:`: `sql`, `commands`, `files`, `ai`, `network`, `process`, `secrets`, `agent`), as a JSON object; `{}` is the baseline. Approved when it is deployed. (v3)" }
    - { name: "pending", type: "TEXT", doc: "What an extension that is on but undeployed waits on a person for: the permissions its source would add, one line each, as a JSON array; `[]` when nothing waits. Boot deploys nothing: an undeployed extension runs nothing until a person deploys it. (v3)" }
    - { name: "shared", type: "INTEGER", doc: "1 when it is the team's: the project's `extensions:` list names it (`oxplow.extension.share`). (v4)" }
  tests:
    - { not_null: uri }
    - { unique: uri }
- name: extension_deployment
  version: 7
  key: [uri]
  description: "Each deployment of an extension: an immutable copy of its source in the store (`.oxplow/runtime/extensions/<name>/<hash>/`), named by the hash of the source it was copied from, and which one runs now (`active`). `oxplow.extension.deploy` makes one; `oxplow.extension.rollback` makes an older one active again. The store keeps the active one and the five newest. A bundled extension with no active row runs the copy that ships with oxplow."
  fields:
    - { name: "uri", type: "TEXT", doc: "`oxplow:oxplow/extension_deployment?hash=<hash>&name=<name>`." }
    - { name: "extension_uri", type: "TEXT", doc: "`oxplow:oxplow/extension?name=<name>`: the extension it is a deployment of; NULL when the catalog no longer lists it." }
    - { name: "name", type: "TEXT", doc: "The extension's name." }
    - { name: "hash", type: "TEXT", doc: "The hash of the source it was copied from: its identity." }
    - { name: "deployed_at", type: "TEXT", doc: "When it was first deployed." }
    - { name: "commit", type: "TEXT", doc: "The primary checkout's HEAD when the source lies inside it; NULL for a source outside the project. (v7)" }
    - { name: "dirty", type: "INTEGER", doc: "1 when the source had uncommitted changes, untracked files included, when it was deployed. (v7)" }
    - { name: "source", type: "TEXT", doc: "The source folder it was copied from." }
    - { name: "active", type: "INTEGER", doc: "1 for the deployment chosen to run: the one the extension runs now, or one that is held (it doesn't load or activate against this oxplow), which every activation and boot tries again, its problems in `v_extension.errors`, until another is deployed or rolled back to." }
    - { name: "permissions", type: "TEXT", doc: "What it declares it may reach beyond the baseline, as a JSON object (`v_extension.permissions`'s shape): what a person approved when it was deployed. (v2)" }
    - { name: "build", type: "TEXT", doc: "The command it was built with (its manifest's `build.run`), which a person approved when it was deployed; NULL when it has no build. (v3)" }
  tests:
    - { not_null: uri }
    - { unique: uri }
- name: config_key
  version: 2
  key: [key]
  description: "What can be configured in the project's `.oxplow/project.yaml`: each key and what it is for (v2: no key is a person's alone). Read or change a value with `oxplow.config.get` / `oxplow.config.set`; Settings shows where each value comes from."
  fields:
    - { name: "key", type: "TEXT", doc: "The key, as project.yaml spells it." }
    - { name: "doc", type: "TEXT", doc: "What it is for." }
    - { name: "schema", type: "TEXT", doc: "The JSON Schema its value must match." }
  tests:
    - { not_null: key }
    - { unique: key }
- name: page_ref
  version: 6
  description: "The cross-reference graph between pages and records: one row per edge `source → target`, each end a URI — a knowledge page naming a file, a commit touching a file or task, a turn naming what its prompt carried. Ask \"what points at X\" with `WHERE target_uri = uri('oxplow/file', 'path', 'src/app.rs')` and \"what does X point at\" with `WHERE source_uri = 'oxplow:oxplow/knowledge?id=intro&store=oxwiki'`. (v2: URIs and their resources in place of refs and kinds.)"
  fields:
    - { name: "source_uri", type: "TEXT", doc: "The page or record the edge starts at (`oxplow:oxplow/knowledge?id=intro&store=oxwiki`, a commit's, a task's)." }
    - { name: "target_uri", type: "TEXT", doc: "What it points at (`oxplow:oxplow/file?path=src/app.rs`, a task's, a knowledge page's)." }
    - { name: "source_resource", type: "TEXT", doc: "The source's resource (`oxplow/knowledge`)." }
    - { name: "target_resource", type: "TEXT", doc: "The target's resource (`oxplow/file`)." }
    - { name: "ref_type", type: "TEXT", doc: "How the source relates to the target (`touched_file`, `record_mention`: a body naming a record of a shared model, `impact`, `commit_mention`, `prompt_mention`: a turn whose prompt pointed at the target, …)." }
    - { name: "source_extra", type: "TEXT", doc: "Edge-specific extras as JSON (a line anchor, a version pin, a link sub-type), when the writer recorded any." }
    - { name: "local_snapshot_id", type: "INTEGER", doc: "The snapshot the edge was recorded at, when there is one (v_snapshot.id)." }
    - { name: "closest_vcs_rev", type: "TEXT", doc: "The VCS revision nearest the edge when recorded." }
    - { name: "vcs_rev_exact", type: "INTEGER", doc: "1 when that revision is exactly the state recorded." }
  tests:
    - { not_null: source_uri }
    - { not_null: target_uri }
- name: capability_provider
  version: 17
  description: "Each capability's implementations — core's, the built-ins extensions declare (`oxplow-bundled`'s defaults, `oxplow-foundation`'s agent harnesses and AI providers), running provider instances', and `none` for an optional capability — with the features each declares, which is active and why. A capability many implementations serve at once (`agent_harness`, `acp_adapter`, `ai_provider`) has every declared row active. A choice that isn't available (its extension disabled, its instance stopped) is listed with `available = 0`; the active row is then the fallback. Settings lists the choices from here, and the UI shows an implementation's enhancements only when its features allow them."
  fields:
    - { name: "capability", type: "TEXT", doc: "`snapshots`, `vcs`, `agent_harness`, `ai_provider`." }
    - { name: "provider", type: "TEXT", doc: "The implementation's id: what `activeProviders` names, a task ref's segment (`oxplow:oxplow/task?id=…&provider=<provider>`), a knowledge page's store (`oxwiki`), `git`, `none`." }
    - { name: "extension", type: "TEXT", doc: "The extension declaring it; NULL for core's." }
    - { name: "features", type: "TEXT", doc: "The features it declares, as JSON (`vcs`: `isolated_workspaces`, `remotes`, `rename_detection`; `snapshots`: `contents`)." }
    - { name: "active", type: "INTEGER", doc: "1 on the capability's active implementation." }
    - { name: "title", type: "TEXT", doc: "How a person names it. (v3)" }
    - { name: "source", type: "TEXT", doc: "How it's loaded: `core`, `builtin`, `external`, `script` (an extension's script implementation), `none`; `unknown` for a choice nothing provides. (v12: `script`)" }
    - { name: "available", type: "INTEGER", doc: "0 for a chosen implementation that isn't there to use. (v3)" }
    - { name: "chosen_by", type: "TEXT", doc: "On the active row, why it's the one: the level whose `activeProviders.<capability>` chose it (`local`, `project` or `global`), `default`, `fallback` (the choice isn't available), or `declared` on every row of a capability many implementations serve; `setting` on an implementation its extension's setting turned off (`when:` in its declaration: listed, `active = 0`). NULL on the rest. (v3; v14: `setting`; v17: `local` and `global` for the levels, was `personal`)" }
    - { name: "capability_title", type: "TEXT", doc: "How a person names the capability (`Task tracker`). (v4)" }
    - { name: "choosable", type: "INTEGER", doc: "1 when a project chooses the capability's implementation; 0 for one core fixes (`vcs`) or one many serve at once (`knowledge`). (v4)" }
    - { name: "optional", type: "INTEGER", doc: "1 when the capability may be `none`. (v4)" }
    - { name: "description", type: "TEXT", doc: "One sentence saying what this implementation is (`description:` in `implementations:`); NULL when its declaration says nothing or it is core's own. Joins `v_contribution` where `kind = 'implementation'` on `extension` and `local = capability || '.' || provider`." }
  tests:
    - { not_null: capability }
    - { not_null: provider }
- name: command_run
  version: 1
  key: [id]
  description: "Every command run on the bus, including reads and refusals. Each row names the command, who ran it, how it ended and the contribution run that holds its cost and authority."
  groups: [contribution_run]
  fields:
    - { name: "id", type: "INTEGER", doc: "The command run's integer detail id." }
    - { name: "command", type: "TEXT", doc: "The command id (`oxtask.task.create`)." }
    - { name: "changed", type: "INT", doc: "1 when the command recorded its input. Reads and unchanged commands record no input." }
    - { name: "undone", type: "INT", doc: "1 when another command run has undone this run." }
    - { name: "uri", type: "TEXT", doc: "The contribution run's URI (`oxplow:oxplow/contribution_run?id=<run_id>`)." }
  tests:
    - { not_null: run_id }
    - { unique: run_id }
    - { accepted_values: { column: outcome, values: [ok, skipped, failed, denied, cancelled, invalid, interrupted] } }
- name: config_value
  version: 7
  key: [key]
  description: "Registered core and extension settings with redacted effective values, schema and display metadata. Overrides resolve local, project, global, then default; metric and dimension definitions are not settings. Write through oxplow.config.set with an explicit level."
  fields:
    - { name: key, type: TEXT, doc: "The registered fully qualified setting key." }
    - { name: value, type: TEXT, doc: "Effective value as JSON; NULL for secrets or absent values." }
    - { name: origin, type: TEXT, doc: "Effective origin: local, project, global, or default; NULL when unavailable or absent." }
    - { name: extension, type: TEXT, doc: "Owning extension, or NULL for core." }
    - { name: doc, type: TEXT, doc: "Setting description." }
    - { name: schema, type: TEXT, doc: "Value validation schema as JSON." }
    - { name: title, type: TEXT, doc: "Display title." }
    - { name: category, type: TEXT, doc: "Display category, independent of namespace ownership." }
    - { name: secret, type: INT, doc: "1 when the value is stored securely." }
    - { name: is_set, type: INT, doc: "1 when an effective value is present, including secrets." }
    - { name: owner, type: TEXT, doc: "Registry owner: core or extension namespace." }
    - { name: ui, type: TEXT, doc: "Display hints as JSON." }
    - { name: local_value, type: TEXT, doc: "Explicit local override as JSON; SQL NULL when absent or secret. JSON null remains the text null." }
    - { name: project_value, type: TEXT, doc: "Explicit shared project override as JSON; SQL NULL when absent or secret." }
    - { name: global_value, type: TEXT, doc: "Explicit machine-global override as JSON; SQL NULL when absent or secret." }
    - { name: unavailable, type: INT, doc: "1 when resolution failed safely. Value, origin and presence are unavailable; no backend error or secret bytes are exposed." }
    - { name: default_value, type: TEXT, doc: "Registered default as JSON, NULL when absent; secrets have no defaults." }
    - { name: setting_order, type: INT, doc: "Display order within the category, then title and key." }
    - { name: local_status, type: TEXT, doc: "Local override presence: set, unset or unavailable. Never contains secret bytes." }
    - { name: project_status, type: TEXT, doc: "Project override presence: set, unset or unavailable." }
    - { name: global_status, type: TEXT, doc: "Global override presence: set, unset or unavailable." }
    - { name: category_title, type: TEXT, doc: "The category's title, as core or the extension declares it (`configuration: categories:`); one from its id when nobody does." }
    - { name: category_description, type: TEXT, doc: "What the category is for; empty when not declared." }
    - { name: category_order, type: INT, doc: "Where the category sits, lower first (core's run 0 to 110; an undeclared one is 1000), then its title." }
  tests:
    - { not_null: key }
    - { unique: key }
- name: agent_conversation
  version: 1
  description: "Every agent harness's saved conversations begun in a stream's worktree — started in oxplow or outside it — most recent first per harness, up to 50 each. Read live when a query names it, for the stream the query runs for (the primary checkout's when none). Join `v_agent_session` on `resume_session_id = native_id` for the oxplow session bound to one. A harness that can't list now is one row with `problem` and no `native_id`."
  fields:
    - { name: "stream_id", type: "INT", doc: "The stream whose worktree it was begun in (v_stream.id)." }
    - { name: "harness", type: "TEXT", doc: "The harness that keeps it (`claude`, `codex`, `opencode`)." }
    - { name: "native_id", type: "TEXT", doc: "The harness's own id for it: what a resume names. NULL on a `problem` row." }
    - { name: "title", type: "TEXT", doc: "Its title, if the harness keeps one." }
    - { name: "first_prompt", type: "TEXT", doc: "The first thing the person asked, if the harness keeps it." }
    - { name: "started_at", type: "TEXT", doc: "When it began." }
    - { name: "updated_at", type: "TEXT", doc: "When it was last active." }
    - { name: "size_bytes", type: "INT", doc: "How large its saved transcript is." }
    - { name: "parent", type: "TEXT", doc: "The conversation it was forked from, if any." }
    - { name: "problem", type: "TEXT", doc: "Why the harness couldn't list its conversations now; NULL on a conversation." }
- name: agent_harness
  version: 3
  key: [id]
  description: "All registered agent harnesses, alphabetically by title. Enablement is the independent oxplow.agents.<id>.enabled setting (default true); disabled harnesses remain visible. Sessions explicitly name a harness."
  fields:
    - { name: "id", type: "TEXT", doc: "Its key: what a session's harness names." }
    - { name: "title", type: "TEXT", doc: "What it is called." }
    - { name: "enabled", type: "INT", doc: "1 when oxplow.agents.<id>.enabled resolves to true." }
    - { name: "position", type: "INT", doc: "Its alphabetical position by title, from 0." }
    - { name: "settings", type: "TEXT", doc: "Declared preferences registered independently as oxplow.agents.<id>.<key>, as a JSON array of { key, title, hint, placeholder }." }
- name: extension_secret
  version: 1
  key: [extension, reference]
  description: "The credentials the enabled extensions' providers declare with a host secret reference, and whether a value is kept for each. The value is written with `oxplow.extension.set_secret`, forgotten with `oxplow.extension.revoke_secret`, and never read back: only that one is set. Read live when a query names it."
  fields:
    - { name: "extension", type: "TEXT", doc: "The extension whose provider declares the credential." }
    - { name: "provider", type: "TEXT", doc: "The provider's id in that extension." }
    - { name: "name", type: "TEXT", doc: "The credential's name, as the provider declares it." }
    - { name: "reference", type: "TEXT", doc: "The secret's reference, as JSON (`{ schemaVersion, id }`): what the two secret commands take. It carries no value." }
    - { name: "is_set", type: "INT", doc: "1 when the OS keychain holds a value for it." }
- name: extension_change
  version: 4
  key: [base, head, name]
  description: "The extensions under `.oxplow/extensions/` whose files differ between two revisions, each with what the change does: both versions loaded as their revision holds them and reviewed on their own overlays. Read live, and only when the query pins both sides (`WHERE base = :b AND head = :h`, each a revision as `v_change` spells it: `git:<rev>`, `snap:<id>`, `working`; `''` base for nothing before): the review runs both versions, so unpinned it has no rows."
  fields:
    - { name: "base", type: "TEXT", doc: "The earlier side, as the query spelled it." }
    - { name: "head", type: "TEXT", doc: "The later side, as the query spelled it." }
    - { name: "name", type: "TEXT", doc: "The extension." }
    - { name: "change", type: "TEXT", doc: "`added`, `removed` or `changed`." }
    - { name: "errors", type: "TEXT", doc: "What's wrong with the later version, as a JSON array of diagnostics shaped as `v_extension.errors` (`shown` is the line a person reads). (v4)" }
    - { name: "lines", type: "TEXT", doc: "What the change does, as a JSON array of lines (grants first, then collectors' outputs, datasets and their rows, pages); `[]` for a removed extension." }
    - { name: "page_changes", type: "TEXT", doc: "The pages that differ, as a JSON array of `{ id, change }`." }
    - { name: "stream_id", type: "INT", doc: "The stream whose worktree was reviewed." }
- name: vcs_workspace
  version: 1
  key: [path]
  description: "The repository's working copies (git worktrees), the primary one first, with the stream working in each. Read live when a query names it. A working copy no stream uses — `WHERE NOT is_main AND stream_id IS NULL` — is what a new stream can adopt."
  fields:
    - { name: "path", type: "TEXT", doc: "Where it is on disk." }
    - { name: "branch", type: "TEXT", doc: "The branch it has checked out; NULL on a detached HEAD." }
    - { name: "head", type: "TEXT", doc: "The commit it is at." }
    - { name: "is_main", type: "INT", doc: "1 for the repository's primary working copy." }
    - { name: "stream_id", type: "INT", doc: "The stream working in it (v_stream.id); NULL when none does." }
  tests:
    - { not_null: path }
    - { unique: path }
- name: file
  version: 1
  description: "The files and folders of one filesystem at one revision (`oxplow:local`: the stream's worktree, with the project's `generated:` lists and the worktree's `.gitignore`s applied, an empty folder too, and each file's change status; `oxplow:extensions`: the running extension copies; `oxplow:temp`: scratch files). Read live when a query names it. A query that names no `filesystem` lists `oxplow:local` only; name another with `WHERE filesystem = 'oxplow:extensions'`, a revision with `AND rev = 'git:HEAD'` (a filesystem's own vocabulary; none or `''`: its default). Local files are the stream's the query runs for (the primary checkout's when none). A folder's listing is `WHERE parent = 'src'` (the top level: `parent = ''`; a literal or a parameter): such a query reads that one folder and fills each file's `size` and `modified_at`, any other walks the whole tree and leaves them NULL."
  fields:
    - { name: "filesystem", type: "TEXT", doc: "The filesystem it is on (`oxplow:local`, `oxplow:extensions`, `oxplow:temp`)." }
    - { name: "stream_id", type: "INT", doc: "The stream the listing ran for (v_stream.id); the local filesystem lists that stream's worktree." }
    - { name: "rev", type: "TEXT", doc: "The revision the query asked for (`git:HEAD`, `snap:<id>`, a deployment hash); `''` for the filesystem's default (the files now), which `rev = ''` also asks for." }
    - { name: "path", type: "TEXT", doc: "Its path in the filesystem, `/`-separated." }
    - { name: "parent", type: "TEXT", doc: "The folder it is in; `''` at the top level." }
    - { name: "name", type: "TEXT", doc: "Its last path segment." }
    - { name: "kind", type: "TEXT", doc: "`file` or `dir`." }
    - { name: "size", type: "INT", doc: "A file's size in bytes; NULL on a folder, in a whole-tree listing, and past the first 1000 files of a folder." }
    - { name: "modified_at", type: "INT", doc: "A file's modified time (ms since the epoch); NULL where `size` is, and where the filesystem keeps no times (a past revision)." }
    - { name: "uri", type: "TEXT", doc: "Its resource URI (`oxplow:oxplow/file?path=…` or `…/dir?path=…`, with the `filesystem` and `rev` it is on when they aren't the local default)." }
    - { name: "status", type: "TEXT", doc: "A file's change against HEAD (`added`, `modified`, `deleted`, `renamed`, `untracked`, `conflicted`); NULL when unchanged, on a folder, and on a filesystem with no VCS." }
- name: scope
  version: 4
  description: "Every scope a command may need (`needs:` in a manifest): what it lets a run change, where its handler runs, and what it lets a handler do. Read live when a query names it. A command's access is the strongest among its scopes."
  fields:
    - { name: "id", type: "TEXT", doc: "`<resource>.<action>` (`records.read`, `context.write`)." }
    - { name: "access", type: "TEXT", doc: "`view`, `read`, `record` or `write`: what a run over the scope may change." }
    - { name: "host", type: "TEXT", doc: "Where its handler lives: `daemon`, `window` or `shell`." }
    - { name: "spends", type: "INT", doc: "1 when a run over it spends the person's money (a model call on their provider key), so a tool over it asks before it runs; 0 otherwise. (v2)" }
    - { name: "summary", type: "TEXT", doc: "What it lets a handler do." }
- name: command_proposal
  version: 6
  description: "Commands an agent ran that need a person's confirmation: each kept with its preview and what it would have done, until a person approves (the command then runs as them) or declines it. A newer proposal with the same `key` supersedes a pending one. The Alerts panel shows the pending ones."
  fields:
    - { name: "id", type: "INTEGER", doc: "Proposal id." }
    - { name: "uri", type: "TEXT", doc: "`oxplow:oxplow/proposal?id=<id>`." }
    - { name: "created_at", type: "TEXT", doc: "RFC 3339 timestamp." }
    - { name: "command", type: "TEXT", doc: "The command (`oxplow.config.set`, `oxtask.task.delete`)." }
    - { name: "input", type: "TEXT", doc: "Its input (JSON)." }
    - { name: "actor_kind", type: "TEXT", doc: "Who proposed it: `agent`, `page` or `effect`." }
    - { name: "actor_id", type: "TEXT", doc: "The proposing thread (`thr3`), page or effect, when known." }
    - { name: "thread_id", type: "INTEGER", doc: "The thread it was proposed in (v_thread.id), if any." }
    - { name: "stream_id", type: "INTEGER", doc: "The stream it was proposed in, if any." }
    - { name: "key", type: "TEXT", doc: "What it supersedes on: `oxplow:oxplow/config?key=<key>` for a config change, else the command and its input." }
    - { name: "preview", type: "TEXT", doc: "The confirmation preview (JSON: command, summary, input, destructive)." }
    - { name: "dry_run", type: "TEXT", doc: "What it would have done when proposed (JSON: a config key's before/after, a composite's children); NULL when it can't be dry-run." }
    - { name: "decision", type: "TEXT", doc: "`pending`, `approved`, `declined` or `superseded`." }
    - { name: "decided_at", type: "TEXT", doc: "When it was decided or superseded." }
    - { name: "audit_id", type: "INTEGER", doc: "The approving run's command audit row." }
    - { name: "superseded_by", type: "INTEGER", doc: "The proposal that replaced it." }
  tests:
    - { not_null: id }
    - { unique: uri }
    - { accepted_values: { column: decision, values: [pending, approved, declined, superseded] } }
- name: token_usage
  version: 2
  description: "Model token usage recorded from agent sessions, per thread, turn and model."
  fields:
    - { name: "id", type: "INTEGER", doc: "Row id." }
    - { name: "stream_id", type: "INTEGER", doc: "Stream." }
    - { name: "thread_id", type: "INTEGER", doc: "Thread." }
    - { name: "turn_id", type: "INTEGER", doc: "Turn it happened in (v_agent_turn.id), when known." }
    - { name: "agent_kind", type: "TEXT", doc: "Harness (`claude`, `codex`, …)." }
    - { name: "model", type: "TEXT", doc: "Model id, if reported." }
    - { name: "prompt", type: "TEXT", doc: "The human prompt that opened this turn, if the transcript had one." }
    - { name: "input_tokens", type: "INTEGER", doc: "Input tokens." }
    - { name: "output_tokens", type: "INTEGER", doc: "Output tokens." }
    - { name: "cache_creation_input_tokens", type: "INTEGER", doc: "Tokens written to the prompt cache." }
    - { name: "cache_read_input_tokens", type: "INTEGER", doc: "Tokens read from the prompt cache." }
    - { name: "message_count", type: "INTEGER", doc: "Messages in this record." }
    - { name: "recorded_at", type: "TEXT", doc: "RFC 3339 timestamp." }
  tests:
    - { not_null: id }
    - { unique: id }
- name: tool_call
  version: 7
  description: "Every tool call the agent made — reads, edits, commands — from its request to its finish: running, finished, denied by the policy, or abandoned when its turn ended with it open."
  fields:
    - { name: "id", type: "INTEGER", doc: "Row id." }
    - { name: "thread_id", type: "INTEGER", doc: "Thread." }
    - { name: "turn_id", type: "INTEGER", doc: "Turn it happened in (v_agent_turn.id), when known." }
    - { name: "tool", type: "TEXT", doc: "The harness's own name for the tool (`Edit`, `apply_patch`, …)." }
    - { name: "kind", type: "TEXT", doc: "What it does, the same for every harness: `read`, `edit`, `shell`, `subagent`, `ask`, `plan`, `search`, `fetch`, `mcp` or `other`." }
    - { name: "path", type: "TEXT", doc: "File it touched, repo-relative when inside the project." }
    - { name: "detail", type: "TEXT", doc: "Short context: a shell command (truncated), a search pattern, …" }
    - { name: "ok", type: "INTEGER", doc: "1 succeeded, 0 failed, NULL unknown (a shell call often reports no exit code)." }
    - { name: "at", type: "TEXT", doc: "RFC 3339 timestamp: when it finished; while running or when denied, when it was requested. (v5)" }
    - { name: "event_id", type: "TEXT", doc: "The `agent.tool.finished` event (v_event.id) this row records; NULL while it runs, when denied or abandoned, and for rows written before the event log carried tool calls." }
    - { name: "agent_session_id", type: "INTEGER", doc: "The agent session that made it (v_agent_session.id); NULL when not recorded. (v4)" }
    - { name: "subagent_id", type: "TEXT", doc: "The subagent it ran inside, when the harness or the Task call bracketing it says so; NULL for the session's own. (v4)" }
    - { name: "subagent_kind", type: "TEXT", doc: "That subagent's kind (`Explore`, `task`, …). (v4)" }
    - { name: "call_id", type: "TEXT", doc: "The harness's id for the call (Claude Code's `tool_use_id`); NULL when it gave none or for a call recorded before. (v5)" }
    - { name: "state", type: "TEXT", doc: "`running` (requested, not finished), `finished`, `denied` (the policy refused it; it never ran) or `abandoned` (its turn, or its agent session, ended with it running). (v5)" }
    - { name: "started_at", type: "TEXT", doc: "When it was requested (RFC 3339); NULL when no request was seen (a harness that reports only the finish). (v5)" }
    - { name: "ended_at", type: "TEXT", doc: "When it finished, was denied, or was abandoned; NULL while running. (v5)" }
    - { name: "duration_ms", type: "INTEGER", doc: "How long it ran, in milliseconds: the harness's own timing when it gave one (Claude Code's `duration_ms`), else `ended_at - started_at`; NULL while running, with no start, and when it never finished (denied, abandoned). (v5; v6: none for an abandoned call)" }
  tests:
    - { not_null: id }
    - { unique: id }
- name: model_field_decl
  version: 1
  description: "The fields every enabled extension declares on a shared model: a store's under its store id, another extension's under its namespace. Shared screens draw an item's fields from it without knowing its store."
  fields:
    - { name: "model", type: "TEXT", doc: "The model (`<owner namespace>/<model>`)." }
    - { name: "namespace", type: "TEXT", doc: "Whose values they are: a store id, or an extension's namespace." }
    - { name: "name", type: "TEXT", doc: "The field." }
    - { name: "extension", type: "TEXT", doc: "The extension that declares it." }
    - { name: "title", type: "TEXT", doc: "What a screen calls it." }
    - { name: "kind", type: "TEXT", doc: "`enum`, `text` or `number`." }
    - { name: "values", type: "TEXT", doc: "An enum's values, as a JSON list; NULL otherwise." }
    - { name: "read_only", type: "INT", doc: "1 when screens show it but don't edit it." }
- name: file_kind_rule
  version: 1
  description: "What kind of file a path is: one row per glob of every enabled extension's `file_kinds:` and of the project's own `oxplow.files.kinds`. Match a path with `glob_match(glob, path)`: `SELECT DISTINCT r.kind FROM v_file_kind_rule r WHERE glob_match(r.glob, 'src/auth/login.rs')`."
  fields:
    - { name: "kind", type: "TEXT", doc: "The kind: `dependency-manifest`, `lockfile`, `test-harness`, `ci`, `lint-config`, `generated`, `vendored`, `migration`, `sensitive`, or any lowercase-dashed name." }
    - { name: "glob", type: "TEXT", doc: "A repo-relative glob (`*` stays in a folder, `**` crosses folders), matched by `glob_match`." }
    - { name: "label", type: "TEXT", doc: "What a person calls the kind, when the rule says; NULL otherwise." }
    - { name: "extension", type: "TEXT", doc: "The extension that declares the rule; `project-settings` for the project's own." }
- name: language
  version: 2
  description: "Every language the loaded extensions declare, on or off: what oxplow knows about each (its grammar, language server and facets) and whether the extension that declares it is on. A shipped language pack that is off is listed, so a page can offer to turn it on. Match a path or a name to one by `extensions`, `aliases` or `lsp_ids`."
  fields:
    - { name: "id", type: "TEXT", doc: "The stored name (`rust`): `symbol.language`, the `oxplow.language` dimension." }
    - { name: "title", type: "TEXT", doc: "The name a person reads (`C++`)." }
    - { name: "extension", type: "TEXT", doc: "The extension that declares it (`oxplow-rust`)." }
    - { name: "enabled", type: "INTEGER", doc: "1 when that extension is on." }
    - { name: "analyzable", type: "INTEGER", doc: "1 when it has a grammar, so code in it parses (symbols, metrics, review signals); 0 for a language known only by its server." }
    - { name: "extensions", type: "TEXT", doc: "JSON array of the file extensions it claims, lowercase, no dot." }
    - { name: "aliases", type: "TEXT", doc: "JSON array of the other names a script may use." }
    - { name: "lsp_ids", type: "TEXT", doc: "JSON array of the LSP `languageId`s that are this language." }
    - { name: "lsp_package", type: "TEXT", doc: "The Mason package to suggest as its language server; NULL when it declares none." }
    - { name: "facets", type: "TEXT", doc: "JSON object `{ imports, merge, duplication, starter }`: 1 for each facet it has." }
    - { name: "monaco", type: "TEXT", doc: "The editor's (Monaco's) language id for its files, from its `editor: { monaco }`; NULL when it declares none (the editor then falls back to its table of well-known extensions)." }
- name: model_store
  version: 4
  description: "Each live store of a shared model, as the enabled extensions fill it: who fills it, and how a reader links its records without knowing the model (a record's URI is `oxplow:<resource>?<key>=<id>&<store_param>=<store>`; a loose `tsk12` in text is a link to its item)."
  fields:
    - { name: "model", type: "TEXT", doc: "The model (`<owner namespace>/<model>`)." }
    - { name: "store", type: "TEXT", doc: "The store id." }
    - { name: "extension", type: "TEXT", doc: "The extension that fills it." }
    - { name: "id_pattern", type: "TEXT", doc: "How its items' ids look in text, a regex matched whole (`tsk[0-9]+`); NULL when it doesn't say." }
    - { name: "resource", type: "TEXT", doc: "The model's resource, the first part of its records' URIs (`oxplow/task`)." }
    - { name: "store_param", type: "TEXT", doc: "The URI param that names the store (`provider`, `store`)." }
    - { name: "key", type: "TEXT", doc: "The URI param that names the record (`id`)." }
    - { name: "loose", type: "INTEGER", doc: "1 when its ids count in running text (`tsk12`), 0 when only inside `[[…]]`." }
    - { name: "files_root", type: "TEXT", doc: "Where its rows' files are rooted when it keeps rows as files (`project`, `agent:claude`); NULL when it keeps none." }
    - { name: "files_folder", type: "TEXT", doc: "The folder in that root holding one file per row, `<folder>/<id><suffix>`; NULL when it keeps none." }
    - { name: "files_suffix", type: "TEXT", doc: "The file suffix of a row's file (`.md`); NULL when it keeps none." }
- name: model_stage
  version: 1
  description: "Each store's workflow on a shared model, in order, as the enabled extensions declare it (`fills.stages`) and the running provider instances state it: what a shared screen draws a store's columns from without knowing the store."
  fields:
    - { name: "model", type: "TEXT", doc: "The model (`<owner namespace>/<model>`)." }
    - { name: "store", type: "TEXT", doc: "The store whose workflow it is." }
    - { name: "position", type: "INT", doc: "Its place in the workflow, from 0." }
    - { name: "id", type: "TEXT", doc: "The stage's id (`in_progress`)." }
    - { name: "title", type: "TEXT", doc: "What a screen calls it (`In Progress`)." }
    - { name: "bucket", type: "TEXT", doc: "The bucket it is in: `backlog`, `todo`, `in_progress`, `blocked`, `done` or `canceled`." }
    - { name: "extension", type: "TEXT", doc: "The extension that declares it (a provider instance's extension for its stages)." }
- name: model_quarantine
  version: 1
  description: "The shared-model rows a write skipped because they failed their checks and have not been restated since: an open problem until the key is written good, deleted, renamed away, or left out of a snapshot of its store. A collector run reports the same rows once; this keeps them."
  fields:
    - { name: "model", type: "TEXT", doc: "The model (`<owner namespace>/<model>`)." }
    - { name: "store", type: "TEXT", doc: "The store whose write was skipped." }
    - { name: "key", type: "TEXT", doc: "The row's key; `#<position>` for a row with no usable key (only a snapshot of the store clears it)." }
    - { name: "uri", type: "TEXT", doc: "The row's URI; NULL when it had no key." }
    - { name: "message", type: "TEXT", doc: "Why it was skipped: the row, the column, what was wrong." }
    - { name: "source", type: "TEXT", doc: "The writer's event source (the collector's URI)." }
    - { name: "at", type: "TEXT", doc: "When it was last quarantined (RFC 3339)." }
  tests:
    - { not_null: message }
- name: ref_pin
  version: 1
  description: "Every pinned ref of any source (a shared model's pinned markdown column: `file_pin` / `dir_pin` edges) and how current it is: the generic definition of staleness. A reader filters on `source_resource`."
  fields:
    - { name: "source", type: "TEXT", doc: "What pins it (a model row's URI)." }
    - { name: "source_resource", type: "TEXT", doc: "The source's resource (`oxplow/knowledge`, `shelf/book`)." }
    - { name: "path", type: "TEXT", doc: "The file or directory (workspace-relative)." }
    - { name: "kind", type: "TEXT", doc: "`file` or `dir`." }
    - { name: "pinned_snapshot_id", type: "INTEGER", doc: "The snapshot it was pinned to; NULL if never pinned." }
    - { name: "pinned_vcs_rev", type: "TEXT", doc: "The VCS revision nearest the pin; NULL without one." }
    - { name: "pinned_vcs_rev_exact", type: "INT", doc: "1 when the pinned snapshot is exactly `pinned_vcs_rev`, else 0." }
    - { name: "latest_snapshot_id", type: "INT", doc: "The latest primary-stream snapshot of the file (of any file under the directory); NULL if never captured there." }
    - { name: "stale", type: "INT", doc: "1 when it changed after the pin (or was captured but never pinned)." }
  tests:
    - { not_null: source }
- name: dataset
  version: 3
  description: "Datasets: every published view, as compiled at this open — core ones and each extension's. Read a dataset's fields in `v_field`, when a materialized one was last recomputed in `v_asset`, what it reads in `v_dataset_lineage` and its declared tests' results in `v_dataset_test`."
  fields:
    - { name: view, type: TEXT, doc: "The view to query (`v_oxplow_task`)." }
    - { name: name, type: TEXT, doc: "The dataset's name within its owner (`task`)." }
    - { name: owner, type: TEXT, doc: "`core`, or the extension that declares it." }
    - { name: kind, type: TEXT, doc: "`sql` (compiled from a SQL file) or `entity` (an extension's synced entity)." }
    - { name: version, type: INTEGER, doc: "Contract version: a change to the fields bumps it." }
    - { name: description, type: TEXT, doc: "What the view holds." }
    - { name: sql, type: TEXT, doc: "The SELECT the view was compiled from, references resolved." }
    - { name: compiled_at, type: TEXT, doc: "RFC 3339 time of the open that compiled it." }
    - { name: materialize, type: TEXT, doc: "NULL when it's computed on read (a view); `on_change` when it's stored and recomputed when an input changes; `every <d>` (`every 1h`) when it's stored and recomputed on that clock; `incremental <column>` when it's stored and kept by appending rows past that watermark." }
    - { name: ai_context, type: TEXT, doc: "Guidance for an agent reading the dataset, as JSON `{\"instructions\", \"synonyms\", \"examples\"}`; NULL when none. Not part of the contract." }
    - { name: relationships, type: TEXT, doc: "How its fields point into other datasets, as a JSON array of `{\"from\", \"to\", \"to_view\", \"to_field\"}` (`from` its field, `to` as declared, `<dataset>.<field>`, resolved to that dataset's view and field); NULL when it declares none. Not part of the contract." }
  tests:
    - { not_null: view }
    - { unique: view }
- name: field
  version: 1
  description: "Fields: each dataset's contract at its current version — its view's columns, in order."
  fields:
    - { name: view, type: TEXT, doc: "The dataset's view (`v_dataset.view`)." }
    - { name: position, type: INT, doc: "0-based field position." }
    - { name: name, type: "", doc: "Field name." }
    - { name: sql_type, type: "", doc: "The field's SQLite declared type; empty for a computed one." }
    - { name: doc, type: "", doc: "What the field holds." }
    - { name: key_part, type: "", doc: "Its 1-based place in the dataset's key; null when it isn't part of the key." }
    - { name: ai_context, type: "", doc: "Guidance for an agent reading the field, as JSON `{\"instructions\", \"synonyms\", \"examples\"}`; NULL when none. Not part of the contract." }
- name: dataset_lineage
  version: 2
  description: "Dataset lineage: what each dataset reads directly — another dataset (`uri`, by view) or a table (`source`). Confirmed at compile against what SQLite reports the view reading."
  fields:
    - { name: view, type: TEXT, doc: "The reading dataset's view." }
    - { name: input, type: TEXT, doc: "The view (`uri`) or table (`source`) it reads." }
    - { name: kind, type: TEXT, doc: "`uri` or `source`." }
- name: dataset_test
  version: 1
  description: "Dataset tests: the last result of each dataset's declared tests (`not_null`, `unique`, `accepted_values`, `relationships`, `sql`)."
  fields:
    - { name: view, type: TEXT, doc: "The tested dataset's view." }
    - { name: test, type: TEXT, doc: "The test, e.g. `unique(id)`." }
    - { name: state, type: TEXT, doc: "`passed`, `failed` (rows break it) or `error` (it didn't run)." }
    - { name: detail, type: TEXT, doc: "How many rows broke it, or the error; NULL when passed." }
    - { name: ran_at, type: TEXT, doc: "RFC 3339 time it ran." }
- name: dimension
  version: 4
  description: "Dimensions: what metrics can be sliced by — `metric_grid('<bucket>', '<dimension>')` groups by one of these keys."
  fields:
    - { name: key, type: TEXT, doc: "The dimension key, e.g. `acme.area`; `oxplow.*` keys are built in." }
    - { name: label, type: TEXT, doc: "Display name." }
    - { name: value_type, type: TEXT, doc: "`categorical`, `numeric`, `temporal` or `entity-ref`." }
    - { name: subject_kind, type: TEXT, doc: "For an `entity-ref` dimension, the kind of thing it refers to." }
    - { name: vocabulary_json, type: TEXT, doc: "The controlled set of values, as a JSON array; NULL when open." }
    - { name: scope, type: TEXT, doc: "`built-in`, `global` or `project`." }
    - { name: promoted, type: INTEGER, doc: "1 when facts carry it as a column (fast to group by), else 0." }
    - { name: entity_json, type: TEXT, doc: "For an entity dimension, the view and expression it slices (`{\"view\", \"expr\"}`)." }
    - { name: extension, type: TEXT, doc: "The extension that declared it; NULL for core." }
    - { name: ai_context, type: TEXT, doc: "Guidance for an agent reading the dimension, as JSON `{\"instructions\", \"synonyms\", \"examples\"}`; NULL when none. Not part of the contract. (v2)" }
    - { name: description, type: TEXT, doc: "One sentence saying what it slices by (`description:` in `dimensions:`); NULL when the declaration says nothing. Joins `v_contribution` where `kind = 'dimension'` on `local = key`." }
  tests:
    - { not_null: key }
    - { unique: key }
- name: metric_catalog
  version: 2
  description: "The metric catalog: every metric this project can use — bundled gauges, always-on producers, entity metrics, extension and project metrics — with whether it's enabled here. Read a metric's values with `MEASURE('<key>')` over `metric_grid()`; enable one with the `oxplow.metric.enable` command."
  fields:
    - { name: key, type: TEXT, doc: "The metric key." }
    - { name: title, type: TEXT, doc: "Display name." }
    - { name: kind, type: TEXT, doc: "How it displays (`gauge`, …)." }
    - { name: language, type: TEXT, doc: "The language a code gauge reads; NULL for the rest." }
    - { name: scope, type: TEXT, doc: "`built-in`, `global` or `project`." }
    - { name: enabled, type: INTEGER, doc: "1 when it's on in this project." }
    - { name: target, type: REAL, doc: "The target value, when set." }
    - { name: trigger, type: TEXT, doc: "When a gauge runs (`on-snapshot`, …); `auto` for a metric fed by its producer." }
    - { name: toggleable, type: INTEGER, doc: "1 when `oxplow.metric.enable` can switch it." }
    - { name: category, type: TEXT, doc: "`operational`, `testing`, `static-quality` or `custom` — how the catalog groups it." }
  tests:
    - { not_null: key }
    - { unique: key }
- name: tree_fact
  version: 4
  description: "The code tree's current facts: for every `per-path` measure (code gauges' per-file and per-function facts), per stream, only the facts from the latest capture that scanned each path — a fixed or removed item drops out, a deleted file's facts go. The same fold the metric engine reads. Its columns are `v_fact`'s."
  fields:
    - { name: "id", type: "INTEGER", doc: "Fact id." }
    - { name: "capture_id", type: "INTEGER", doc: "Producing capture (v_capture.id)." }
    - { name: "measure_key", type: "TEXT", doc: "Measure this is a value of (v_measure.key)." }
    - { name: "value", type: "REAL", doc: "The measured value." }
    - { name: "numerator", type: "REAL", doc: "Ratio numerator, for ratio measures." }
    - { name: "denominator", type: "REAL", doc: "Ratio denominator, for ratio measures." }
    - { name: "subject_kind", type: "TEXT", doc: "The subject URI's resource: `oxplow/file` or `oxplow/symbol`." }
    - { name: "subject", type: "TEXT", doc: "The subject as one ref (`oxplow:oxplow/symbol?path=src/a.rs&symbol=Parser::parse`, `oxplow:oxplow/file?path=src/a.rs`)." }
    - { name: "path", type: "TEXT", doc: "File path." }
    - { name: "line", type: "INTEGER", doc: "Line number, when it has one." }
    - { name: "severity", type: "TEXT", doc: "Finding severity, for lint-like facts." }
    - { name: "rule", type: "TEXT", doc: "Rule id, for lint-like facts." }
    - { name: "detail", type: "TEXT", doc: "Free-text detail." }
    - { name: "dims_json", type: "TEXT", doc: "Extra dimensions as a JSON object." }
    - { name: "stream_id", type: "INTEGER", doc: "The stream (worktree) whose tree it describes." }
    - { name: "thread_id", type: "INTEGER", doc: "From the capture." }
    - { name: "turn_id", type: "INTEGER", doc: "The agent turn it was measured in (v_agent_turn.id), from the capture." }
    - { name: "captured_at", type: "TEXT", doc: "When the capture that holds it ran." }
    - { name: "branch", type: "TEXT", doc: "From the capture." }
  tests:
    - { not_null: id }
    - { unique: id }
- name: change_fact
  version: 2
  description: "The per-path facts of an analysed change's changed files as of the change's head: `v_tree_fact`'s fold bounded to the captures at or before the head's snapshot (`snap:<id>`, or `working`: the snapshot its analysis ran against, `v_change.snapshot_id`, so the facts and the change's hunks are of one code state), for the files in `v_change_file` only. A fact fixed later is still here, a file added later is absent. A change headed at a commit (`git:<sha>`) has no snapshot to bound by and no rows. Read it with `WHERE change_id = ?`."
  fields:
    - { name: "change_id", type: "INTEGER", doc: "The change (v_change.id)." }
    - { name: "id", type: "INTEGER", doc: "Fact id." }
    - { name: "capture_id", type: "INTEGER", doc: "Producing capture (v_capture.id)." }
    - { name: "measure_key", type: "TEXT", doc: "Measure this is a value of (v_measure.key)." }
    - { name: "value", type: "REAL", doc: "The measured value." }
    - { name: "numerator", type: "REAL", doc: "Ratio numerator, for ratio measures." }
    - { name: "denominator", type: "REAL", doc: "Ratio denominator, for ratio measures." }
    - { name: "subject_kind", type: "TEXT", doc: "The subject URI's resource: `oxplow/file` or `oxplow/symbol`." }
    - { name: "subject", type: "TEXT", doc: "The subject as one ref." }
    - { name: "path", type: "TEXT", doc: "File path." }
    - { name: "line", type: "INTEGER", doc: "Line number, when it has one." }
    - { name: "severity", type: "TEXT", doc: "Finding severity, for lint-like facts." }
    - { name: "rule", type: "TEXT", doc: "Rule id, for lint-like facts." }
    - { name: "detail", type: "TEXT", doc: "Free-text detail." }
    - { name: "dims_json", type: "TEXT", doc: "Extra dimensions as a JSON object." }
    - { name: "stream_id", type: "INTEGER", doc: "The stream (worktree) whose tree it describes." }
    - { name: "thread_id", type: "INTEGER", doc: "From the capture." }
    - { name: "turn_id", type: "INTEGER", doc: "The agent turn it was measured in, from the capture." }
    - { name: "captured_at", type: "TEXT", doc: "When the capture that holds it ran." }
    - { name: "branch", type: "TEXT", doc: "From the capture." }
- name: function
  version: 4
  description: "Functions in the current code tree, one row per function ref and stream: its latest cyclomatic complexity, length and parameter count from the code gauges (over `v_tree_fact`), named by `v_symbol`: a function the symbol index doesn't have isn't listed."
  fields:
    - { name: "stream_id", type: "INTEGER", doc: "The stream (worktree) whose tree it's in." }
    - { name: "symbol", type: "TEXT", doc: "The function's `oxplow:oxplow/symbol?path=<path>&symbol=<id>` ref (`v_symbol.uri`)." }
    - { name: "path", type: "TEXT", doc: "The file it's in." }
    - { name: "name", type: "TEXT", doc: "The function's own name (`v_symbol.name`)." }
    - { name: "container", type: "TEXT", doc: "What it's inside, `::`-joined; NULL at top level (`v_symbol.container`)." }
    - { name: "kind", type: "TEXT", doc: "`function`, `method` or `constructor` (`v_symbol.kind`)." }
    - { name: "line", doc: "Its first line." }
    - { name: "language", doc: "Its language (`rust`, `typescript`, …)." }
    - { name: "complexity", doc: "Cyclomatic complexity; NULL when not measured." }
    - { name: "length", doc: "Length in lines; NULL when not measured." }
    - { name: "parameters", doc: "Parameter count; NULL when not measured." }
    - { name: "captured_at", doc: "When its latest capture ran." }
  tests:
    - { not_null: symbol }
    - { sql: "SELECT 1 FROM v_function GROUP BY stream_id, symbol HAVING count(*) > 1" }
- name: file_metric
  version: 2
  description: "Per-file code facts in the current tree, one row per file, measure and stream (TODO markers, doc coverage, and any per-path measure a gauge reports per file; over `v_tree_fact`)."
  fields:
    - { name: "stream_id", type: "INTEGER", doc: "The stream (worktree) whose tree it's in." }
    - { name: "path", type: "TEXT", doc: "The file." }
    - { name: "measure_key", type: "TEXT", doc: "The measure (v_measure.key)." }
    - { name: "value", type: "REAL", doc: "Its value for the file." }
    - { name: "numerator", type: "REAL", doc: "Ratio numerator, for ratio measures." }
    - { name: "denominator", type: "REAL", doc: "Ratio denominator, for ratio measures." }
    - { name: "captured_at", type: "TEXT", doc: "When its latest capture ran." }
  tests:
    - { not_null: path }
- name: capture_exclusion
  version: 1
  description: "The snapshot files a capture's scan was not given: over the size limit, binary or unreadable. A capture restates the paths it scanned; an excluded path is not one of them, so the facts it last had stay (stale) rather than reading as clean. A page shows which files a metric did not check, and since when."
  fields:
    - { name: "capture_id", type: "INTEGER", doc: "The capture that left it out (v_capture.id)." }
    - { name: "producer", type: "TEXT", doc: "What produced that capture (v_capture.producer)." }
    - { name: "path", type: "TEXT", doc: "The file's path in the snapshot." }
    - { name: "reason", type: "TEXT", doc: "`oversize` (over snapshotMaxFileBytes, or stored by stat only), `binary` (holds a NUL byte) or `unreadable`." }
    - { name: "unchecked", type: "INT", doc: "1 while no later capture of the same producer has scanned the file: the facts it last had are still its last good ones, unchecked." }
  tests:
    - { not_null: capture_id }
    - { not_null: path }
- name: ai_role
  version: 2
  key: [role]
  description: "oxplow's AI roles — the built-ins (`main`, `summarize`, `decide`), then each active extension's AI profiles (`<namespace>/<name>`) — with the provider and model each is bound to and would use now, what a person forbids it (`restrict`), and whether that provider has a key. Read live when a query names it (ai.yaml, project.yaml and the keychain change with no hook): the key itself is never in any model. The person manages roles in Settings → AI."
  fields:
    - { name: "role", type: "TEXT", doc: "`main`, `summarize`, `decide`, or `<namespace>/<profile>`." }
    - { name: "description", type: "TEXT", doc: "What the role is for: oxplow's text for a built-in, the declaring extension's for a profile." }
    - { name: "namespace", type: "TEXT", doc: "The namespace a profile is named in (its extension's); NULL for a built-in." }
    - { name: "fallback", type: "TEXT", doc: "The built-in role an unbound profile uses; NULL for a built-in." }
    - { name: "provider", type: "TEXT", doc: "The provider (`v_ai_provider.id`) of the role's own binding; NULL when it has none." }
    - { name: "model", type: "TEXT", doc: "The model of the role's own binding; NULL when it has none." }
    - { name: "restrict", type: "TEXT", doc: "What a person forbids this binding, a JSON array of `tools`, `sql`, `streaming`, `images`; NULL when it has no binding." }
    - { name: "effective_provider", type: "TEXT", doc: "The provider a call would use now: its binding's, else its fallback's; NULL when a call would be refused." }
    - { name: "effective_model", type: "TEXT", doc: "The model a call would use now." }
    - { name: "key_set", type: "INT", doc: "1 when the effective provider has a key in the keychain (never the key)." }
    - { name: "overridden", type: "INT", doc: "1 when the binding comes from the project's `project.yaml`, not the global `ai.yaml`." }
    - { name: "problem", type: "TEXT", doc: "Why a call on it would be refused, when it would be: a model lacking a feature the profile needs." }
- name: ai_provider
  version: 1
  key: [id]
  description: "The configured model providers and whether each has a key (never the key). Read live when a query names it."
  fields:
    - { name: "id", type: "TEXT", doc: "Your name for it (`anthropic`, `local-ollama`); also its keychain entry." }
    - { name: "kind", type: "TEXT", doc: "What it is: `anthropic`, `openai`, `openai_compatible`, `openrouter`, `typesafe`, …" }
    - { name: "base_url", type: "TEXT", doc: "Its API base when overridden or required; NULL for the default." }
    - { name: "key_set", type: "INT", doc: "1 when the keychain holds a key for it." }
- name: ai_model
  version: 2
  key: [provider, model]
  description: "Each configured provider's models, from its kind's catalog: a hosted service's from the catalog oxplow ships (no call, no key), a local server's from the server itself when it lists them. A provider whose models aren't known lists none: its model is typed. Read live when a query names it. AI Settings suggests these for a Model."
  fields:
    - { name: "provider", type: "TEXT", doc: "The provider (`v_ai_provider.id`)." }
    - { name: "model", type: "TEXT", doc: "The model's id at that provider, as a role binds it (`claude-sonnet-4-5`)." }
    - { name: "tool_calling", type: "TEXT", doc: "`supported`, `unsupported` or `unknown`: whether it calls tools (an AI profile may need it)." }
    - { name: "streaming", type: "TEXT", doc: "`supported`, `unsupported` or `unknown`." }
    - { name: "context_tokens", type: "INT", doc: "Its context window in tokens; NULL when unknown." }
- name: lsp_server
  version: 1
  key: [language_id]
  description: "Every language server oxplow knows — configured in `.oxplow/project.yaml` or installed through Mason (the yaml wins per language) — with whether its binary exists and which streams run it now. Read live when a query names it; check it before relying on `oxplow_code_hover` / `oxplow_code_definition` / `oxplow_code_references` for a language, and after an `oxplow.lsp.install_server`."
  fields:
    - { name: "language_id", type: "TEXT", doc: "The LSP language id (`rust`, `typescript`)." }
    - { name: "extensions", type: "TEXT", doc: "File extensions it serves, a JSON array." }
    - { name: "command", type: "TEXT", doc: "The command that starts it." }
    - { name: "args", type: "TEXT", doc: "Its arguments, a JSON array." }
    - { name: "source", type: "TEXT", doc: "`yaml` (project.yaml) or `installed` (Mason)." }
    - { name: "package_name", type: "TEXT", doc: "The Mason package, for an installed server." }
    - { name: "version", type: "TEXT", doc: "The installed package's version." }
    - { name: "binary_exists", type: "INT", doc: "1 when the command resolves to a file on this machine." }
    - { name: "running", type: "INT", doc: "How many streams have a live session with it." }
    - { name: "running_streams", type: "TEXT", doc: "Those streams' ids, a JSON array." }
    - { name: "completion_trigger_characters", type: "TEXT", doc: "A running session's completion trigger characters, a JSON array; NULL when none runs." }
- name: collector_state
  version: 4
  key: [uri]
  description: "Each declared collector's standing on this machine: whether this OS enforces its `network` list, and why failures disabled it. Read live when a query names it. What it may do is its extension's `permissions:` (`v_extension.permissions`). Its runs are `v_collector_run`; its declaration `v_contribution`."
  fields:
    - { name: "uri", type: "TEXT", doc: "`oxplow:oxplow/collector?collector=<owner>/<id>`." }
    - { name: "owner", type: "TEXT", doc: "The extension that declares it." }
    - { name: "id", type: "TEXT", doc: "Its id within the extension." }
    - { name: "network_enforced", type: "INT", doc: "1 when this OS enforces the collector's `network` list." }
    - { name: "disabled", type: "TEXT", doc: "Why failures disabled it on this machine; NULL when it isn't." }
- name: extension_source
  version: 1
  key: [name]
  description: "Each extension source in the main checkout as it is now (`.oxplow/extensions/<name>/`, or where `extensionSources` points): read live when a query names it, so an edit shows at once. Its `hash` is what a deploy of it would be: one unlike `v_extension.hash` is a source that moved on from what runs (out of date), and an extension with no row here has no source on this machine."
  fields:
    - { name: "name", type: "TEXT", doc: "The extension's name." }
    - { name: "path", type: "TEXT", doc: "Its source folder, relative to the project when inside it." }
    - { name: "hash", type: "TEXT", doc: "The hash of the source as it is now (`v_extension_deployment.hash` of a deploy of it)." }
- name: collector_credential
  version: 2
  key: [collector, name]
  description: "Each credential a collector declares and whether a value is set for it in this machine's keychain (never the value). Read live when a query names it. A person sets one in Settings → Data."
  fields:
    - { name: "collector", type: "TEXT", doc: "The collector's URI (`v_collector_state.uri`)." }
    - { name: "name", type: "TEXT", doc: "The credential's name, as the collector reads it (`env: [NAME]`)." }
    - { name: "is_set", type: "INT", doc: "1 when the keychain holds a value for it." }
- name: metric_point
  version: 1
  key: [metric, capture_id, group_value]
  description: "A metric's series, one row per capture (and per group when sliced), newest first: what `MEASURE('<key>')` over `metric_grid('capture')` reads, for every metric at once. Read live. Unpinned, every metric with a spec gets its newest 200 captures; `WHERE metric = :key` lists one metric's newest 5000. `WHERE dimension = 'oxplow.language'` slices by a dimension (`group_value` is its value; a metric it can't slice has no rows). Join `v_capture` on `capture_id` for provenance and the git version."
  fields:
    - { name: "metric", type: "TEXT", doc: "The metric key (`v_metric_catalog.key`)." }
    - { name: "dimension", type: "TEXT", doc: "The dimension the query sliced by, as it spelled it; NULL when it did not slice." }
    - { name: "capture_id", type: "INT", doc: "The capture the point comes from (`v_capture.id`)." }
    - { name: "captured_at", type: "TEXT", doc: "When the capture was taken (RFC 3339); sorts as time." }
    - { name: "value", type: "REAL", doc: "The metric's value as the capture shows it, rolled up the way the metric's spec says." }
    - { name: "group_value", type: "TEXT", doc: "The dimension's value for this point; NULL when the series is not sliced." }
    - { name: "branch", type: "TEXT", doc: "The capture's branch; NULL for operational facts with no worktree." }
    - { name: "stream_id", type: "INT", doc: "The stream whose captures were read." }
- name: data_entity
  version: 3
  key: [name]
  description: "What can be queried: every published dataset (`v_dataset`'s rows) and every entity an enabled extension declares but has not synced. Read live. `WHERE name = 'v_commit'` also counts that dataset's rows (`row_count`); the list leaves `row_count` NULL, since counting each is a query of its own."
  fields:
    - { name: "name", type: "TEXT", doc: "The view to query (`v_oxplow_task`, `v_my_gh_pr`)." }
    - { name: "owner", type: "TEXT", doc: "`core`, or the extension that provides it." }
    - { name: "kind", type: "TEXT", doc: "`sql` (a dataset file), `entity` (an extension's synced data) or `declared` (an entity whose source hasn't synced: no view yet)." }
    - { name: "description", type: "TEXT", doc: "What it holds." }
    - { name: "row_count", type: "INT", doc: "Its row count, when the query pins `name`; else NULL." }
- name: effect_backfill
  version: 1
  key: [effect]
  description: "What a backfill of an effect would react to: the matching events it never reacted to (logged before it was approved, or while it waited). Read live, and only for the effect the query pins (`WHERE effect = '<extension>/<id>'`); unpinned it has no rows. `oxplow.effect.backfill` with `to_seq` runs on just these."
  fields:
    - { name: "effect", type: "TEXT", doc: "The effect, `<extension>/<id>`." }
    - { name: "planned", type: "INT", doc: "How many events it would react to." }
    - { name: "from_seq", type: "INT", doc: "The log position of the first; NULL when none." }
    - { name: "to_seq", type: "INT", doc: "The log position of the last; NULL when none." }
    - { name: "batch", type: "INT", doc: "The most one backfill run reacts to; the rest wait for another run." }
- name: command
  version: 2
  key: [uri]
  description: "Every registered command, one row each, as `list_commands` shows it: its URI (`v_contribution.uri` for an extension's own), its id, who declares it, a one-sentence summary, the scope behind it, whether a person confirms it and whether it can be undone, and how a person meets it. Read live from the command registry."
  fields:
    - { name: "uri", type: "TEXT", doc: "`oxplow:oxplow/command?command=<id>`." }
    - { name: "id", type: "TEXT", doc: "The command id on the bus: `oxtask.task.create`." }
    - { name: "extension", type: "TEXT", doc: "The enabled extension whose manifest declares it; NULL for a command core registers itself." }
    - { name: "summary", type: "TEXT", doc: "What it does, one sentence or more: what `list_commands` and the launcher show." }
    - { name: "scope", type: "TEXT", doc: "The scope whose operation backs it (`v_scope.id`); NULL for one a script or a provider runs." }
    - { name: "access", type: "TEXT", doc: "What it may touch: `view`, `read`, `record`, `write` or `external`." }
    - { name: "confirm", type: "TEXT", doc: "When a person confirms it: `never`, `always` or `destructive`." }
    - { name: "confirms", type: "INT", doc: "1 when a person confirms it before it runs." }
    - { name: "undoable", type: "INT", doc: "1 when `commands.undo` can reverse a run." }
    - { name: "ui_label", type: "TEXT", doc: "What a person reads in search and menus; NULL when it is not offered to a person by itself." }
    - { name: "ui_group", type: "TEXT", doc: "What search lists it under (`Git`, `Tasks`); NULL for none." }
- name: skill
  version: 1
  key: [uri]
  description: "Each skill or slash command an enabled extension gives the coding agent, with the description its file's frontmatter holds: when the agent loads a skill, what a command does. Read live from the catalog."
  fields:
    - { name: "uri", type: "TEXT", doc: "Its `v_contribution.uri`." }
    - { name: "extension", type: "TEXT", doc: "The extension that declares it." }
    - { name: "name", type: "TEXT", doc: "Its name, which the agent's runtime files it under." }
    - { name: "kind", type: "TEXT", doc: "`skill` (loaded when relevant) or `command` (a slash command a person runs)." }
    - { name: "description", type: "TEXT", doc: "The frontmatter's `description:`." }
    - { name: "needs", type: "TEXT", doc: "What must be active for it to be offered, as a JSON array." }
- name: slot
  version: 1
  key: [uri]
  description: "Each place an enabled extension mounts one of its pages at another page's slot: which page, where, and a sentence saying so. Read live from the catalog."
  fields:
    - { name: "uri", type: "TEXT", doc: "Its `v_contribution.uri`." }
    - { name: "extension", type: "TEXT", doc: "The extension that mounts the page." }
    - { name: "id", type: "TEXT", doc: "Its id among the extension's mounts." }
    - { name: "host", type: "TEXT", doc: "The page whose slot it is (`oxplow/commit`)." }
    - { name: "slot", type: "TEXT", doc: "The slot's name in that page." }
    - { name: "page", type: "TEXT", doc: "The page it shows there (`<extension>/<slug>`)." }
    - { name: "description", type: "TEXT", doc: "What the mount does, in a sentence." }
- name: custom_component
  version: 2
  key: [uri]
  description: "Each custom component an enabled extension draws with its own code (`custom_components:`), with what it may reach. Read live from the catalog."
  fields:
    - { name: "uri", type: "TEXT", doc: "Its `v_contribution.uri`." }
    - { name: "extension", type: "TEXT", doc: "The extension that declares it." }
    - { name: "id", type: "TEXT", doc: "Its id, which a page's `component` node names." }
    - { name: "title", type: "TEXT", doc: "What a person calls it; its id when it has no title." }
    - { name: "description", type: "TEXT", doc: "One sentence saying what it is (`description:` in `custom_components:`); NULL when its declaration says nothing." }
    - { name: "bundle", type: "TEXT", doc: "The folder in the extension that holds its code." }
    - { name: "commands", type: "TEXT", doc: "The commands it may invoke, as a JSON array." }
    - { name: "sql", type: "TEXT", doc: "`read` when it runs its own read-only SQL over the datasets; NULL otherwise." }
- name: replacement
  version: 3
  key: [target, extension]
  description: "The core sub-components extensions replace (`task.board`, `task.list`), one row per candidate extension, read live from the enabled extensions and the config. `chosen` is the extension the person picked for the target (`oxplow` for oxplow's own), NULL for the default: the only extension replacing it, or oxplow's own where several do, or the item's provider's (or store's) extension for a `bound_to_provider` target."
  fields:
    - { name: "target", type: "TEXT", doc: "The core sub-component, `<area>.<name>`." }
    - { name: "label", type: "TEXT", doc: "What a person calls it (`board`)." }
    - { name: "extension", type: "TEXT", doc: "The extension that replaces it." }
    - { name: "bound_to_provider", type: "INT", doc: "1 when it renders only while that extension's provider decides, so the person chooses only between the default and oxplow's own." }
    - { name: "capability", type: "TEXT", doc: "What the target belongs to: a capability, or `model:<owner>/<model>`." }
    - { name: "chosen", type: "TEXT", doc: "The person's choice for the target: an extension, or `oxplow`; NULL for the default." }
- name: provider_instance
  version: 1
  key: [instance]
  description: "The instances of the enabled extensions' providers on this machine (Settings → Integrations): the project's and the person's own, each with where it stands. Read live. A credential's value is never here: `v_provider_credential` says whether one is set."
  fields:
    - { name: "instance", type: "TEXT", doc: "`<extension>/<instance id>`." }
    - { name: "extension", type: "TEXT", doc: "The extension that declares the provider." }
    - { name: "provider", type: "TEXT", doc: "The provider (its program) this is an instance of." }
    - { name: "instance_id", type: "TEXT", doc: "Its id: its refs' segment, what `activeProviders` names." }
    - { name: "capability", type: "TEXT", doc: "The capability the provider implements." }
    - { name: "scope", type: "TEXT", doc: "`project` (shared with the team) or `global` (the person's own, every project)." }
    - { name: "overridden", type: "INT", doc: "1 when this project's own entry replaces a global instance of the same name here." }
    - { name: "enabled", type: "INT", doc: "1 when the project's config enables it." }
    - { name: "state", type: "TEXT", doc: "`off`, `missing`, `refused`, `unconfigured`, `checking`, `ready`, `failing` or `disabled`." }
    - { name: "detail", type: "TEXT", doc: "Why, for `missing`, `refused`, `unconfigured` (its problems), `failing` (its errors) and `disabled`; NULL otherwise." }
    - { name: "config", type: "TEXT", doc: "Its config, JSON." }
    - { name: "config_schema", type: "TEXT", doc: "JSON Schema of its config, from its declarations." }
    - { name: "consecutive_failures", type: "INT", doc: "Its failures in a row." }
    - { name: "last_ok_at", type: "TEXT", doc: "RFC 3339 time of its last success." }
    - { name: "mean_invoke_ms", type: "REAL", doc: "A moving average of its successful calls." }
    - { name: "rate_limited_until", type: "TEXT", doc: "RFC 3339 time its service said to wait until." }
    - { name: "activity", type: "TEXT", doc: "What a read in progress last said; NULL between reads." }
- name: provider_credential
  version: 1
  key: [instance, name]
  description: "The credentials each provider instance declares and where they stand on this machine. Read live; presence only — a value is never read out."
  fields:
    - { name: "instance", type: "TEXT", doc: "`<extension>/<instance id>`." }
    - { name: "name", type: "TEXT", doc: "The credential's name." }
    - { name: "is_set", type: "INT", doc: "1 when this machine has a value for it (a signed-in one: a token)." }
    - { name: "signs_in", type: "INT", doc: "1 when the person signs in for it (`oauth:`); 0 when its value is pasted." }
    - { name: "sign_in_state", type: "TEXT", doc: "For one signed in for: `not_signed_in`, `signed_in` or `sign_in_again`; NULL otherwise." }
    - { name: "signed_in_until", type: "TEXT", doc: "RFC 3339 time a signed-in token lapses, when it can't renew itself." }
    - { name: "redirect_port", type: "INT", doc: "For one signed in for with its redirect port registered: the loopback port to catch the redirect on; NULL for any free port." }
- name: provider_collector
  version: 1
  key: [instance, name]
  description: "The collectors each provider instance declares and where their reads stand. Read live."
  fields:
    - { name: "instance", type: "TEXT", doc: "`<extension>/<instance id>`." }
    - { name: "name", type: "TEXT", doc: "The collector's name." }
    - { name: "entity", type: "TEXT", doc: "The entity it reads." }
    - { name: "status", type: "TEXT", doc: "`never`, `reading`, `ok` or `error`." }
    - { name: "error", type: "TEXT", doc: "Why its last read failed." }
    - { name: "last_read_at", type: "TEXT", doc: "RFC 3339 time of its last read." }
    - { name: "records", type: "INT", doc: "Records its reads have delivered." }
- name: terminal
  version: 1
  description: "A stream's terminals: shells in its worktree, in order. Opened, renamed and closed by the `oxplow.terminal.*` commands; the shell's process is the daemon's, keyed by the row's URI."
  fields:
    - { name: "id", type: "INTEGER", doc: "Terminal id (`trm<id>` in its URI)." }
    - { name: "stream_id", type: "INTEGER", doc: "The stream whose worktree the shell runs in." }
    - { name: "title", type: "TEXT", doc: "Its title: \"Terminal N\" unless it was named." }
    - { name: "position", type: "INTEGER", doc: "Order among the stream's terminals." }
    - { name: "created_at", type: "TEXT", doc: "RFC 3339 timestamp." }
    - { name: "uri", type: "TEXT", doc: "`oxplow:oxplow/terminal?id=trm<id>`: its URI, the one place SQL spells it — select and join on this, never rebuild it." }
  tests:
    - { not_null: id }
    - { unique: id }
