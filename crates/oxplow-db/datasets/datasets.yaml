# The core datasets: each one a published view `v_<name>`, compiled from
# `<name>.sql` at every open (`crate::datasets`). A dataset reads only through
# `ref('<dataset>')` and `source('<table>')`. `fields` is its contract: a
# change to it needs a new `version`. See `.context/semantic-layer.md`
# "Datasets".
field_groups:
  contribution_run:
    - { name: "run_id", type: "TEXT", doc: "The run's UUIDv7, ordered by start time." }
    - { name: "parent_run_id", type: "TEXT", doc: "The recorded run that started it, if any." }
    - { name: "extension", type: "TEXT", doc: "The extension that declares the contribution." }
    - { name: "contribution", type: "TEXT", doc: "The contribution's URI (v_contribution.uri)." }
    - { name: "kind", type: "TEXT", doc: "The contribution kind, such as collector, command, effect, job or implementation." }
    - { name: "version", type: "TEXT", doc: "The extension's declared version when it ran, if any." }
    - { name: "generation", type: "TEXT", doc: "The extension catalog generation it ran against, if any." }
    - { name: "actor_kind", type: "TEXT", doc: "`human`, `agent`, `page`, `component`, `system`, `effect` or `job`." }
    - { name: "actor_id", type: "TEXT", doc: "The actor's id for its kind, such as `thr3` for an agent. NULL when the actor has no id." }
    - { name: "stream_id", type: "INTEGER", doc: "The stream it ran for (v_stream.id), if any." }
    - { name: "thread_id", type: "INTEGER", doc: "The thread it ran for (v_thread.id), if any." }
    - { name: "turn_id", type: "INTEGER", doc: "The agent turn it ran for (v_agent_turn.id), if any." }
    - { name: "session_id", type: "INTEGER", doc: "The agent session it ran for (v_agent_session.id), if any." }
    - { name: "snapshot_id", type: "INTEGER", doc: "The snapshot it ran over, if any." }
    - { name: "cause_event_id", type: "TEXT", doc: "The event that caused it (v_event.id), if any." }
    - { name: "mode", type: "TEXT", doc: "`pure`, `transactional` or `external`." }
    - { name: "started_at", type: "TEXT", doc: "When it began (RFC 3339)." }
    - { name: "finished_at", type: "TEXT", doc: "When it ended (RFC 3339). NULL while live." }
    - { name: "outcome", type: "TEXT", doc: "`ok`, `skipped`, `failed`, `denied`, `cancelled`, `invalid` (input refused) or `interrupted` (oxplow stopped before it ended). NULL while live." }
    - { name: "error", type: "TEXT", doc: "Why it did not end `ok`, if known." }
    - { name: "wall_ms", type: "INTEGER", doc: "Elapsed time in milliseconds. NULL while live or when unmeasured." }
    - { name: "cpu_ms", type: "INTEGER", doc: "Script CPU time in milliseconds, summed. NULL while live or when unmeasured." }
    - { name: "peak_bytes", type: "INTEGER", doc: "Peak script memory in bytes. NULL while live or when unmeasured." }
    - { name: "ai_calls", type: "INTEGER", doc: "Model calls it made. NULL while live or when unmeasured." }
    - { name: "scopes", type: "TEXT", doc: "The scopes it used and their counts, as a JSON object." }
    - { name: "decisions", type: "TEXT", doc: "Permission decisions as a JSON array of `{ need, decision, reason? }`." }

datasets:
- name: agent_nudge
  version: 4
  description: "Guidance oxplow raised — a hint (`<extension>/<id>`) or its own nudge (`report-less-run`) — for the coding agent, taken by its next prompt or tool call, or for a person, shown in Alerts until they dismiss it."
  fields:
    - { name: "id", type: "INTEGER", doc: "Row id." }
    - { name: "thread_id", type: "INTEGER", doc: "Thread." }
    - { name: "turn_id", type: "INTEGER", doc: "Turn it happened in (v_agent_turn.id), when known." }
    - { name: "kind", type: "TEXT", doc: "What kind of nudge, e.g. `report-less-run` or an advisory's `<extension>/<id>`." }
    - { name: "message", type: "TEXT", doc: "The text the agent was given." }
    - { name: "trigger", type: "TEXT", doc: "What prompted it, if recorded." }
    - { name: "created_at", type: "TEXT", doc: "RFC 3339 timestamp." }
    - { name: "delivered_at", type: "TEXT", doc: "When a hook response carried it to the agent, or the person dismissed it; NULL while it waits." }
    - { name: "audience", type: "TEXT", doc: "`agent` or `person`. (v2)" }
  tests:
    - { not_null: id }
    - { unique: id }
    - { accepted_values: { column: audience, values: [agent, person] } }
- name: hint_stat
  version: 2
  description: "How each hint (an extension advisory, `<extension>/<id>`) did on each thread: how often it was evaluated, how often it fired, how much of that reached its audience or waits, and whether it was muted for firing on after being delivered."
  fields:
    - { name: "thread_id", type: "INTEGER", doc: "Thread (v_thread.id)." }
    - { name: "hint", type: "TEXT", doc: "The hint, `<extension>/<id>`." }
    - { name: "evaluated", type: "INTEGER", doc: "Times its query ran on the thread." }
    - { name: "last_evaluated_at", type: "TEXT", doc: "When it last ran (RFC 3339)." }
    - { name: "fired", type: "", doc: "Nudges it raised on the thread (v_agent_nudge rows of its kind)." }
    - { name: "delivered", type: "", doc: "Of those, the ones that reached their audience: taken by the agent, or dismissed by a person." }
    - { name: "held", type: "", doc: "Of those, the ones still waiting." }
    - { name: "muted", type: "", doc: "Scopes (requests, or the thread) where it was muted for firing on after three deliveries." }
  tests:
    - { not_null: hint }
- name: agent_status
  version: 2
  description: "Each thread's agent status: its open agent sessions' statuses (v_agent_session_status) rolled up — what the person owes ranks first: `awaiting_user` (waiting on them: a question, a plan to approve, a permission prompt, a final message ending in a question) > `running` > `error` > `stopped` > `idle`. A dead turn's `stalled` is derived live, never logged."
  fields:
    - { name: "thread_id", type: "INTEGER", doc: "The thread (v_thread.id)." }
    - { name: "state", type: "", doc: "`running`, `idle`, `awaiting_user`, `stopped` or `error`: the session status that ranks first." }
    - { name: "detail", type: "", doc: "What that session waits on (the question, the permission asked), or why it stopped." }
    - { name: "since", type: "TEXT", doc: "When that session moved to it (RFC 3339)." }
- name: agent_session_status
  version: 1
  description: "Each open agent session's status as last logged: `running`, `idle`, `awaiting_user`, `stopped`, `error`. A dead turn's `stalled` is derived live, never logged. v_agent_status rolls a thread's sessions up."
  fields:
    - { name: "thread_id", type: "INTEGER", doc: "The thread (v_thread.id)." }
    - { name: "agent_session_id", type: "INTEGER", doc: "The session (v_agent_session.id)." }
    - { name: "state", type: "", doc: "`running`, `idle`, `awaiting_user`, `stopped` or `error`." }
    - { name: "detail", type: "", doc: "What it's waiting on (the question, the permission asked), or why it stopped." }
    - { name: "since", type: "TEXT", doc: "When it moved to this status (RFC 3339)." }
- name: agent_session_binding
  version: 3
  description: "Which native conversation each agent slot was bound to, and when: its first, one the harness moved it to (a native `/resume`), a fork's copy, or one the person chose. The open one (no `unbound_at`) is the slot's `resume_session_id`; a fresh start or `/clear` ends it with none after."
  fields:
    - { name: "id", type: "INTEGER", doc: "Row id." }
    - { name: "agent_session_id", type: "INTEGER", doc: "The slot (v_agent_session.id)." }
    - { name: "native_id", type: "TEXT", doc: "The harness's own conversation id." }
    - { name: "origin", type: "TEXT", doc: "`started` (its first, or the first since it had none), `switched` (the harness moved it), `forked` (a fork launch's copy) or `chosen` (the person chose it)." }
    - { name: "bound_at", type: "TEXT", doc: "RFC 3339 timestamp." }
    - { name: "unbound_at", type: "TEXT", doc: "When the next one replaced it or the slot was left with none; NULL while it is the slot's." }
    - { name: "session_uri", type: "TEXT", doc: "The slot's URI (`oxplow:oxplow/agent_session?id=ses<n>`)." }
  tests:
    - { not_null: id }
    - { unique: id }
    - { relationships: { column: agent_session_id, to: agent_session, field: id } }
- name: agent_job
  version: 2
  description: "Background jobs an agent started — a background shell or subagent that runs on after the call that started it — from the hook that first showed it to its report. A job is `running` until its report (Claude Code's task notification, or a subagent's hand-back) comes, or `lost` when its session ended or restarted first. A subagent resumed under the same id after it reported is a new row."
  fields:
    - { name: "id", type: "INTEGER", doc: "Row id." }
    - { name: "thread_id", type: "INTEGER", doc: "The thread (v_thread.id)." }
    - { name: "agent_session_id", type: "INTEGER", doc: "The agent session that started it (v_agent_session.id); NULL when not known." }
    - { name: "harness_job_id", type: "TEXT", doc: "The harness's own id for it (Claude Code's task id, a subagent's agent id): the one its report and a Stop's running work name." }
    - { name: "kind", type: "TEXT", doc: "What it is, in the harness's word (`subagent`, `shell`, …); NULL when not said." }
    - { name: "description", type: "TEXT", doc: "What it does, as the harness described it." }
    - { name: "start_call_id", type: "TEXT", doc: "The harness's id of the tool call that started it (v_tool_call.call_id); NULL when no hook named it." }
    - { name: "started_turn", type: "TEXT", doc: "The turn it was started in (its `uri`), as far as known: the turn of the call that started it, of a subagent's start, or whose Stop listed it running." }
    - { name: "start_basis", type: "TEXT", doc: "How `started_turn` is known: `reported` (a hook named the call that started it, or the subagent's start) or `matched` (oxplow's guess: the turn whose Stop listed it running). NULL with no started turn. (v2)" }
    - { name: "seen_at", type: "TEXT", doc: "When a hook first showed it (RFC 3339)." }
    - { name: "report_turn", type: "TEXT", doc: "The turn its report opened or was delivered into (its `uri`); NULL while running." }
    - { name: "reported_at", type: "TEXT", doc: "When it reported back; NULL while running." }
    - { name: "status", type: "TEXT", doc: "How it ended, in the harness's word (`completed`, `failed`, `killed`, …); NULL while running or when not said." }
    - { name: "summary", type: "TEXT", doc: "The harness's one-line summary of how it ended." }
    - { name: "lost_at", type: "TEXT", doc: "When its agent session ended or restarted before it reported: oxplow's own fact, not the harness's status. NULL otherwise. (v2)" }
    - { name: "state", type: "TEXT", doc: "`running` (no report yet), `reported`, or `lost` (its session ended or restarted first). (v2: `lost`)" }
  tests:
    - { not_null: id }
    - { unique: id }
- name: request
  version: 4
  description: "Requests: the turn that started something and every turn that followed from it (a background job's report, a subagent's hand-back), joined by cause when each turn opened. One row per request: who started it and when, what it holds (its turns' tool calls, tokens, jobs), and where it stands now (`state`, read live). Its turns are the v_agent_turn rows whose `request` is its `uri`; their time split sums v_turn_activity over them (heavier: read it for one request). Its files come with the turns' changes."
  relationships: [{ from: first_turn, to: agent_turn.uri }, { from: thread_id, to: thread.id }]
  fields:
    - { name: "id", type: "INTEGER", doc: "Request id (its URI is `oxplow:oxplow/request?id=req<id>`)." }
    - { name: "thread_id", type: "INTEGER", doc: "The thread its first turn ran in (v_thread.id); a later turn may run on another thread." }
    - { name: "uri", type: "TEXT", doc: "`oxplow:oxplow/request?id=req<id>`: its URI, the one place SQL spells it — select and join on this." }
    - { name: "first_turn", type: "TEXT", doc: "The turn that started it (its `uri`)." }
    - { name: "source", type: "TEXT", doc: "Who started it: the first turn's `source` (`person`, `peer`, `unknown`, …)." }
    - { name: "prompt", type: "TEXT", doc: "The text that started it: the first turn's prompt." }
    - { name: "started_at", type: "TEXT", doc: "When it started: the first turn's start (RFC 3339)." }
    - { name: "turns", type: "INT", doc: "How many turns it holds. (v2)" }
    - { name: "threads", type: "INT", doc: "How many threads its turns ran on: more than one when another session's message joined it. (v2)" }
    - { name: "last_activity_at", type: "TEXT", doc: "When its latest turn ended, or started while one runs (RFC 3339). (v2)" }
    - { name: "tool_calls", type: "INT", doc: "Tool calls its turns made (a subagent's count with the turn that started it), denied calls left out. (v2)" }
    - { name: "input_tokens", type: "INT", doc: "Tokens its turns read: input plus cache writes and reads. (v2)" }
    - { name: "output_tokens", type: "INT", doc: "Tokens its turns wrote. (v2)" }
    - { name: "jobs_running", type: "INT", doc: "Jobs its turns started that have not reported back, their session still alive (v_agent_job, state `running`). (v2)" }
    - { name: "matched", type: "INT", doc: "1 when one of its links is oxplow's match, not the harness's word (a cross-session message matched to its send, a job's start guessed from the Stop that listed it): best effort. (v2)" }
    - { name: "state", type: "TEXT", doc: "Where it stands now, read live: `waiting_on_person` (an agent session whose latest turn is the request's waits on the person: a final question, a permission prompt, a question tool — v_agent_session_status), else `running` (one of its turns is open), `waiting_on_work` (none is open, but a job it started has not reported back), `finished`. (v2; v3: waiting read from the session's status; v4: that status read once per query, not per row)" }
  tests:
    - { not_null: id }
    - { unique: id }
- name: commit_request
  version: 1
  description: "The requests a commit's changes came from, per path: the requests on the commit's stream that changed the path since the previous commit that held it, where the file as the work left it is the commit's content (compared by git blob id, reading no bytes). A commit made outside oxplow, or of a file edited again since, has no rows. A commit's requests: `WHERE sha = <sha>`; a request's commits: `WHERE request = <uri>`; bundled's `v_oxplow_request_link` joins them to tasks."
  relationships: [{ from: request, to: request.uri }]
  fields:
    - { name: "sha", type: "TEXT", doc: "The commit." }
    - { name: "commit_uri", type: "TEXT", doc: "The commit's URI (`oxplow:oxplow/commit?sha=…`)." }
    - { name: "path", type: "TEXT", doc: "The path the commit changed, as git stores it." }
    - { name: "request", type: "TEXT", doc: "The request that changed it (`v_request.uri`)." }
    - { name: "basis", type: "TEXT", doc: "`named` (an edit call of one of the request's turns named the path), `reported` (the harness said a shell call changed it) or `observed` (it changed while the request ran and nothing else says)." }
    - { name: "confidence", type: "TEXT", doc: "`sole` (one request changed the path since the previous commit that held it) or `shared` (several did)." }
    - { name: "turn", type: "TEXT", doc: "The turn of the request that gave the basis (`v_agent_turn.uri`)." }
    - { name: "at", type: "TEXT", doc: "When the link was recorded (RFC 3339)." }
  tests:
    - { not_null: sha }
    - { not_null: request }
    - { accepted_values: { column: basis, values: [named, reported, observed] } }
    - { accepted_values: { column: confidence, values: [sole, shared] } }
- name: tool_call_path
  version: 1
  description: "The files each tool call named or the harness reported it changed, one row per (call, path): `named` by an edit tool's own input, `reported` by the harness's statement that a shell call changed it (Claude Code's `bashEditDiff`). A shell call that reported nothing has no row: its absence says nothing."
  fields:
    - { name: "call_id", type: "INT", doc: "The tool call (`v_tool_call.id`)." }
    - { name: "turn_id", type: "INT", doc: "The turn the call ran in (`v_agent_turn.id`)." }
    - { name: "path", type: "TEXT", doc: "The path, worktree-relative when inside it." }
    - { name: "basis", type: "TEXT", doc: "`named` or `reported`." }
  tests:
    - { not_null: call_id }
    - { accepted_values: { column: basis, values: [named, reported] } }
- name: request_metric_delta
  version: 1
  description: "How each metric moved during a request on one stream (before → after), computed by oxplow's metric engine over the request's window — the span of its turns there, the files they changed (claimed or sole) and the captures they made — and stored; refreshed while it runs and when what it reads moves. A request's: `WHERE request_id = <id>`."
  relationships: [{ from: request, to: request.uri }]
  fields:
    - { name: "request_id", type: "INTEGER", doc: "The request (v_request.id)." }
    - { name: "request", type: "TEXT", doc: "The request's URI." }
    - { name: "stream_id", type: "INTEGER", doc: "The stream its window is on (a request can span streams)." }
    - { name: "key", type: "TEXT", doc: "Metric key (v_metric_spec.key)." }
    - { name: "title", type: "TEXT", doc: "Metric name." }
    - { name: "unit", type: "TEXT", doc: "Unit, if any." }
    - { name: "direction", type: "TEXT", doc: "`higher-better`, `lower-better` or `neutral`." }
    - { name: "kind", type: "TEXT", doc: "`gauge`, `coverage`, `test`, `event`, …" }
    - { name: "category", type: "TEXT", doc: "Metric category." }
    - { name: "language", type: "TEXT", doc: "Language, if language-specific." }
    - { name: "agg", type: "TEXT", doc: "How the delta was computed: `files` (over the request's files), `sum` (in-window total) or `level` (before→after)." }
    - { name: "baseline", type: "REAL", doc: "Value as the request began; NULL for `sum`." }
    - { name: "current", type: "REAL", doc: "Value at its end (or now, while it runs)." }
    - { name: "delta", type: "REAL", doc: "current − baseline, or the total for `sum`." }
    - { name: "changed", type: "INT", doc: "1 if the value moved during the request." }
    - { name: "attributed_files", type: "INT", doc: "For `files`: how many of its files carry the metric." }
    - { name: "sample_count", type: "INT", doc: "Samples considered." }
    - { name: "target", type: "REAL", doc: "Metric target." }
    - { name: "warn_at", type: "REAL", doc: "Warning threshold." }
    - { name: "fail_at", type: "REAL", doc: "Failure threshold." }
    - { name: "crossing", type: "TEXT", doc: "`warn` or `fail` when the current value sits past that threshold; else NULL." }
    - { name: "latest_capture_id", type: "INT", doc: "The latest contributing capture (v_capture.id), for drill-in." }
    - { name: "refreshed_at", type: "TEXT", doc: "When oxplow last recomputed the request's analysis (RFC 3339)." }
- name: request_observation
  version: 1
  description: "The runs a request's turns made on one stream — test runs, diff coverage (over the lines the request changed, from where it started), static analysis — as its stored analysis computed them, oldest first. A request's: `WHERE request_id = <id>`."
  relationships: [{ from: request, to: request.uri }]
  fields:
    - { name: "request_id", type: "INTEGER", doc: "The request (v_request.id)." }
    - { name: "request", type: "TEXT", doc: "The request's URI." }
    - { name: "stream_id", type: "INTEGER", doc: "The stream its window is on." }
    - { name: "seq", type: "INT", doc: "Order within the request on the stream, oldest first: the highest is the latest." }
    - { name: "kind", type: "TEXT", doc: "`test-run`, `diff-coverage`, `static-analysis`." }
    - { name: "provenance", type: "TEXT", doc: "`observed` (oxplow saw it) or `asserted` (the agent reported it)." }
    - { name: "source", type: "TEXT", doc: "Where it came from, e.g. `post-tool-bash`." }
    - { name: "metric_value", type: "REAL", doc: "Headline number, e.g. coverage %." }
    - { name: "payload_json", type: "TEXT", doc: "Kind-specific detail, JSON (e.g. test cases, covered/uncovered lines)." }
    - { name: "local_snapshot_id", type: "INT", doc: "Snapshot it was captured against." }
    - { name: "created_at", type: "TEXT", doc: "RFC 3339 timestamp." }
- name: turn_file
  version: 1
  description: "The files that changed during each turn, joined by time between the turn and its stream's snapshot line (no snapshots the turn owns). Several writers can change one worktree at once, so it is best effort: each file says how sure it is. A file belongs to a turn when a take captured it after the turn started (and within a minute of its end) and the watcher saw it change inside the turn's window, or, with no change time, the capture alone says so. A file changed before the prompt is not the turn's, even when its end take captured it."
  fields:
    - { name: "turn_id", type: "INTEGER", doc: "The turn (v_agent_turn.id)." }
    - { name: "turn", type: "TEXT", doc: "The turn's URI." }
    - { name: "stream_id", type: "INTEGER", doc: "The stream whose worktree it changed in." }
    - { name: "path", type: "TEXT", doc: "The file, relative to the worktree." }
    - { name: "first_changed_at", type: "TEXT", doc: "When it first changed in the turn, as the watcher saw it; its capture time when the watcher gave none (RFC 3339)." }
    - { name: "last_changed_at", type: "TEXT", doc: "When it last changed in the turn (RFC 3339)." }
    - { name: "timed", type: "INT", doc: "1 when every capture of it carried the watcher's change times; 0 when only a capture places it." }
    - { name: "claim", type: "TEXT", doc: "How a call of the turn claimed it: `named` (an edit tool named it) or `reported` (the harness reported a shell call changed it); NULL when no call did." }
    - { name: "confidence", type: "TEXT", doc: "How sure the attribution is: `claimed` (a call of the turn named or reported it), `shared` (no claim, and another turn ran on the stream while it changed), `sole` (no claim, and this was the only turn running)." }
  tests:
    - { not_null: turn_id }
- name: turn_activity
  version: 3
  description: "What happened inside each turn, counted from the events anchored to it: the compactions of the agent's context, the prompts delivered to it (the one that opened it and any that landed in it while it ran), how many of those a person typed, and where its time went once it ended: in tool calls, waiting on the person, or the rest (the model's own time, mostly). One row per turn (v_agent_turn), kept apart from it."
  fields:
    - { name: "turn_id", type: "INTEGER", doc: "The turn (v_agent_turn.id)." }
    - { name: "thread_id", type: "INTEGER", doc: "Its thread (v_thread.id)." }
    - { name: "turn", type: "TEXT", doc: "The turn's URI (`oxplow:oxplow/turn?id=trn<id>`)." }
    - { name: "compactions", type: "INT", doc: "How often the agent's context was summarized during the turn (`agent.context.compacted`): its context size and token figures jump there, and the agent works from a summary after it. A compaction between turns belongs to none." }
    - { name: "deliveries", type: "INT", doc: "Prompts delivered to the agent in the turn (`agent.prompt.submitted`): the one that opened it and any that landed in it while it ran, whoever they came from." }
    - { name: "person_prompts", type: "INT", doc: "How many of those a person typed (`source = person`): a turn a job's report opened may still hold a person's prompt. 0 for an old turn whose deliveries' source is unknown." }
    - { name: "duration_ms", type: "INT", doc: "How long the turn ran, start to end; NULL while running. (v2)" }
    - { name: "tool_ms", type: "INT", doc: "Time inside its tool calls: the union of their intervals (calls run in parallel), denied calls left out, an abandoned call to its end, each cut to the turn's span. NULL while running, and when a call has no start (the harness gives no tool times). (v2; v3: cut to the turn)" }
    - { name: "waits", type: "INT", doc: "How often it waited on the person (a question, a plan, a permission prompt: a status `awaiting_user` entered before the turn ended, once however often its detail changes); NULL while running. (v2; v3: entries)" }
    - { name: "wait_ms", type: "INT", doc: "Time those waits ran: each to the next status change, cut at the turn's end. A permission wait lasts until its tool finishes, so it holds the tool's run too, and tool_ms and wait_ms may overlap. NULL while running. (v2)" }
    - { name: "other_ms", type: "INT", doc: "The rest of the turn: its duration less the union of its tool calls and its waits, so nothing is counted twice — mostly the model's own time. NULL where tool_ms is. (v2)" }
  tests:
    - { not_null: turn_id }
    - { unique: turn_id }
- name: agent_turn
  version: 20
  description: "Agent turns: what opened each one (a person's prompt, a background job reporting back, a subagent handing back, another session's message: `source`) and the agent's answer, per thread and agent session. What a turn changed is `v_turn_file`."
  relationships: [{ from: request, to: request.uri }]
  fields:
    - { name: "id", type: "INTEGER", doc: "Turn id." }
    - { name: "thread_id", type: "INTEGER", doc: "Thread the turn ran in." }
    - { name: "agent_session_id", type: "INTEGER", doc: "The agent session it ran in (v_agent_session.id); NULL for a turn no session claims (a hook from an agent oxplow didn't start)." }
    - { name: "prompt", type: "TEXT", doc: "The text that opened the turn, as the harness delivered it: a person's words only when `source` is `person`. (v12: every source's text)" }
    - { name: "answer", type: "TEXT", doc: "The agent's final message, once the turn ended; NULL when it said nothing (an interrupted turn, one its session left open). (v13: only the agent's words)" }
    - { name: "session_id", type: "TEXT", doc: "The harness session id, when it reported one." }
    - { name: "started_at", type: "TEXT", doc: "RFC 3339 timestamp." }
    - { name: "ended_at", type: "TEXT", doc: "RFC 3339 timestamp; NULL while running." }
    - { name: "uri", type: "TEXT", doc: "`oxplow:oxplow/turn?id=trn<id>`: its URI, the one place SQL spells it — select and join on this, never rebuild it. (v3)" }
    - { name: "transcript_page", type: "TEXT", doc: "The session's transcript page shown from this turn (`oxplow:oxplow/page?page=session-transcript&session=ses2#turn=trn7`: the session in its `?`, the turn its view): where a turn opens. NULL for a turn no session claims. (v4; v10: bare ids, the turn in the view; v11: a page URI)" }
    - { name: "model", type: "TEXT", doc: "The model the turn ran on, as its harness reported it with the turn's end; NULL while running, or when the harness said nothing (opencode). (v5)" }
    - { name: "effort", type: "TEXT", doc: "The reasoning effort the turn ran at (`high`, `medium`, …), as its harness reported it with the turn's end; NULL while running, or when it said nothing. (v5)" }
    - { name: "context_tokens", type: "INTEGER", doc: "Tokens in the agent's context when the turn ended (input plus cache reads and writes of the turn's last request), as its harness reported it with the turn's end; NULL while running, or when the harness said nothing. (v6)" }
    - { name: "context_window", type: "INTEGER", doc: "The size of the model's context window, in tokens, as its harness reported it; NULL while running, or when it said nothing (Claude Code never does). context_tokens / context_window is how full the context was. (v6)" }
    - { name: "source", type: "TEXT", doc: "What opened the turn, as its harness read the prompt: `person`, `background_job` (a job the agent started in the background reported back), `subagent` (a subagent handed its report back), `peer` (another agent session's message), `unknown` (the harness said nothing of why). NULL for a turn recorded before sources were. (v12)" }
    - { name: "harness_turn_id", type: "TEXT", doc: "The harness's own id of the turn (Claude Code's `prompt_id`); NULL when it names none. (v12)" }
    - { name: "cause_turn", type: "TEXT", doc: "The turn whose work this one goes on with (its `uri`): the one whose tool call started the background job, or in which the subagent started. NULL when there is none or it isn't known. (v12)" }
    - { name: "cause_ref", type: "TEXT", doc: "The harness's own name for the cause: the tool call id that started the job, the subagent's id, the sender's socket. NULL when it gave none. (v12)" }
    - { name: "cause_basis", type: "TEXT", doc: "How `cause_turn` is known: `reported` (the harness named it) or `matched` (oxplow matched it from what it saw). NULL with no cause turn. Best effort either way. (v12)" }
    - { name: "sender", type: "TEXT", doc: "On a `peer` turn, the name the other agent session gave itself (Claude Code's cross-session message), else its socket. NULL for any other turn. (v12: replaces `from_peer`)" }
    - { name: "outcome", type: "TEXT", doc: "How the turn ended: `completed` (the agent stopped), `interrupted` (the person interrupted it, or the harness reported an abort), `errored` (the harness ended it with an error; `error` holds its words), `session_ended` (its harness session ended mid-turn), `session_restarted` (a new harness process started with it open), `session_closed` (oxplow closed the agent session), `restart` (oxplow's own recovery), `unknown` (an old turn whose end left no trace). NULL while running. (v13; v14: `unknown`, no `left_running`: a Stop's running work is on its `agent.turn.ended` and in v_agent_job)" }
    - { name: "error", type: "TEXT", doc: "The harness's own words for the error that ended the turn (`name: message`); NULL unless `outcome` is `errored`. (v15)" }
    - { name: "question", type: "TEXT", doc: "The question the turn's final message ended on (its last line, when the message ends in a question mark): what the thread waits on the person for. NULL when it ended on none, did not complete, or closed before this was recorded. (v16)" }
    - { name: "request", type: "TEXT", doc: "The request the turn belongs to (its `uri`, v_request): the turn that started something and every turn that followed from it (a background job's report, a subagent's hand-back), joined by cause when the turn opened. The request of `cause_turn`, else one this turn started. Work recorded against a turn (tool calls, tokens, test runs, jobs) is its request's. NULL for a turn recorded before requests were. (v17; v18: a URI, not an id)" }
    - { name: "request_id", type: "INT", doc: "The request's id (`v_request.id`), to join without a URI. NULL for a turn recorded before requests were." }
  tests:
    - { not_null: id }
    - { unique: id }
- name: ai_call
  version: 9
  description: "Every model call oxplow itself made (not the coding agent's): role, provider, model, tokens, latency and whether it succeeded."
  fields:
    - { name: "id", type: "INTEGER", doc: "Row id." }
    - { name: "role", type: "TEXT", doc: "Role used (`main`, `summarize`, `decide`)." }
    - { name: "provider", type: "TEXT", doc: "Provider id from ai.yaml." }
    - { name: "model", type: "TEXT", doc: "Model id." }
    - { name: "caller", type: "TEXT", doc: "What asked: the asking thread's URI (`oxplow:oxplow/thread?id=<id>`) for an agent's MCP call, `oxplow:oxplow/collector?collector=<owner>/<id>`, …" }
    - { name: "input_tokens", type: "INTEGER", doc: "Input tokens." }
    - { name: "output_tokens", type: "INTEGER", doc: "Output tokens." }
    - { name: "latency_ms", type: "INTEGER", doc: "Round-trip time." }
    - { name: "ok", type: "INTEGER", doc: "1 succeeded, 0 failed." }
    - { name: "error", type: "TEXT", doc: "Error message when it failed." }
    - { name: "at", type: "TEXT", doc: "RFC 3339 timestamp." }
    - { name: "input_hash", type: "TEXT", doc: "For a recorded computation (`v_ai_result`), the hash of its input; NULL for other calls." }
    - { name: "request_hash", type: "TEXT", doc: "Content hash of what the model was asked (`{ system, prompt, json }` or `{ state, questions }`), its body kept for the `ai` retention window (`read_ai_call`); NULL for a call made before requests were kept." }
    - { name: "response_hash", type: "TEXT", doc: "Content hash of what the model answered (`{ text }` or `{ answers }`), kept like the request; NULL when the call failed." }
    - { name: "run_id", type: "TEXT", doc: "The contribution run that made the call (`v_contribution_run.run_id`); NULL for oxplow's own calls. (v3)" }
    - { name: "uri", type: "TEXT", doc: "`oxplow:oxplow/ai_call?id=<id>`: its URI. `oxplow_read` gives its row and, with `#request` / `#response`, its bodies. (v4)" }
  tests:
    - { not_null: id }
    - { unique: id }
- name: ai_result
  version: 4
  description: "Recorded AI computations: a classify / score / decide / summarize / extract result kept by the hash of its input, the provider, the model and the request the model was sent, so asking again reads it instead of calling, and a changed prompt computes afresh. Tokens only; no cost."
  fields:
    - { name: "id", type: "INTEGER", doc: "Row id." }
    - { name: "input_hash", type: "TEXT", doc: "sha256 of the canonical `{ op, args }`." }
    - { name: "provider", type: "TEXT", doc: "The provider that served the model (`ai_*` settings id); another provider of the same model name is another result." }
    - { name: "model", type: "TEXT", doc: "The model that computed it." }
    - { name: "request_hash", type: "TEXT", doc: "Content hash of the exact request the model was sent (`v_ai_call.request_hash`); a changed prompt is a new result." }
    - { name: "op", type: "TEXT", doc: "`classify`, `score`, `decide`, `summarize` or `extract`." }
    - { name: "role", type: "TEXT", doc: "The role it ran on: a built-in (`decide`, `summarize`, `main`) or an extension's AI profile (`acme/review`)." }
    - { name: "caller", type: "TEXT", doc: "What first asked, e.g. `oxplow:oxplow/collector?collector=<owner>/<id>`." }
    - { name: "output_json", type: "TEXT", doc: "The result as JSON." }
    - { name: "input_tokens", type: "INTEGER", doc: "Input tokens of the call that computed it." }
    - { name: "output_tokens", type: "INTEGER", doc: "Output tokens of that call." }
    - { name: "at", type: "TEXT", doc: "When it was computed (RFC 3339)." }
    - { name: "ai_call_id", type: "INTEGER", doc: "The call that computed it (v_ai_call.id)." }
  tests:
    - { not_null: input_hash }
    - { unique: id }
    - { relationships: { column: ai_call_id, to: ai_call, field: id } }
- name: ui_preference
  version: 4
  description: "What the person's oxplow remembers for them outside any one tab: a page's page memory (scoped by the page's URI without its params — `oxplow:oxplow/page?page=tasks`, `oxplow:oxplow/page?page=acme/board` — or `kind:<kind>` for every page of an entity kind; shared by every tab of it), a panel's (its `panel:` ref), a custom component's own (`component:<extension>/<id>`) and the app's preferences (`app`). A tab's view params and history state are in its tab, not here. Local to this project, never the repo."
  fields:
    - { name: "scope", type: "TEXT", doc: "`app`; a page's URI (`oxplow:oxplow/page?page=…`) or `kind:<kind>`; a panel's URI; or `component:<extension>/<id>`." }
    - { name: "key", type: "TEXT", doc: "What is remembered, within its scope (`railWidth`, `mergeMode.str1.main`)." }
    - { name: "value_json", type: "TEXT", doc: "Its value, as JSON text." }
    - { name: "updated_at", type: "TEXT", doc: "RFC 3339 timestamp of the last change." }
  tests:
    - { not_null: scope }
    - { not_null: key }
- name: bookmark
  version: 3
  description: "Pages the person bookmarked, each at one scope: a thread's, a stream's or the whole project's. A thread sees its own, its stream's and the project's; a URI is bookmarked at most once across those."
  fields:
    - { name: "id", type: "INTEGER", doc: "Bookmark id." }
    - { name: "uri", type: "TEXT", doc: "The page's canonical ref (its tab id): what the bookmark opens." }
    - { name: "page_kind", type: "TEXT", doc: "Its page kind (`page`, `file`, `oxplow/knowledge`, …), for the icon." }
    - { name: "label", type: "TEXT", doc: "The page's title when it was bookmarked." }
    - { name: "scope", type: "TEXT", doc: "`thread`, `stream` or `project`." }
    - { name: "thread_id", type: "INTEGER", doc: "The owning thread, for a `thread` bookmark." }
    - { name: "stream_id", type: "INTEGER", doc: "The owning stream, for a `stream` bookmark." }
    - { name: "added_at", type: "TEXT", doc: "RFC 3339 timestamp." }
  tests:
    - { not_null: id }
    - { unique: id }
    - { not_null: uri }
- name: branch
  version: 2
  description: "Local and remote-tracking branches, refreshed on boot and whenever refs move."
  fields:
    - { name: "name", type: "TEXT", doc: "Branch name (without the remote)." }
    - { name: "kind", type: "TEXT", doc: "`local` or `remote`." }
    - { name: "remote", type: "TEXT", doc: "Remote name for a remote-tracking branch." }
    - { name: "head_sha", type: "TEXT", doc: "The commit it points at." }
    - { name: "stream_id", type: "INTEGER", doc: "The stream whose worktree has it checked out (v_stream.id), if any." }
    - { name: "updated_at", type: "TEXT", doc: "When oxplow last read it (RFC 3339)." }
    - { name: "is_default", type: "INTEGER", doc: "1 for the repository's default branch (`main`), else 0." }
    - { name: "upstream", type: "TEXT", doc: "For a local branch that tracks one, its remote-tracking branch (`origin/main`); NULL otherwise. (v2)" }
    - { name: "ahead", type: "INTEGER", doc: "Commits a local branch has that its upstream lacks; 0 without an upstream and for a remote-tracking branch. (v2)" }
    - { name: "behind", type: "INTEGER", doc: "Commits a local branch's upstream has that it lacks; 0 without an upstream and for a remote-tracking branch. (v2)" }
- name: branch_divergence
  version: 1
  key: [base, head, stream_id]
  description: "How far one revision has moved from another, read from the VCS when a query names it (live). Narrowed by the query: `WHERE base = … AND head = …` is one pair; one side pinned, the other ranges over every branch of the stream's repository (local and remote-tracking, the pinned one left out); neither pinned, every local branch as `head` against the default branch. Each side is any revision the VCS resolves (a branch, `origin/main`, a sha, `HEAD`); a side it can't gives no row. A branch against its own upstream is `v_branch.ahead` / `behind`."
  fields:
    - { name: "base", type: "TEXT", doc: "The revision compared against, as the query spelled it." }
    - { name: "head", type: "TEXT", doc: "The revision compared, as the query spelled it." }
    - { name: "ahead", type: "INT", doc: "Commits on `head` that `base` lacks." }
    - { name: "behind", type: "INT", doc: "Commits on `base` that `head` lacks." }
    - { name: "merge_base", type: "TEXT", doc: "The sha the two split at; NULL when their histories are unrelated." }
    - { name: "overlapping_files", type: "TEXT", doc: "JSON array of the files changed on both sides since they split, sorted; `[]` when none." }
    - { name: "readiness", type: "TEXT", doc: "Whether `head` would merge into `base` cleanly: `already_integrated` (nothing ahead), `clean` (ahead, no file changed on both sides) or `conflict`." }
    - { name: "stream_id", type: "INT", doc: "The stream whose repository was read (v_stream.id): the query's, else the primary." }
  tests:
    - { not_null: base }
    - { not_null: head }
- name: capture
  version: 2
  description: "Captures: one scan or run that produced facts, with its when/where/who context."
  fields:
    - { name: "id", type: "INTEGER", doc: "Capture id." }
    - { name: "stream_id", type: "INTEGER", doc: "Stream captured in." }
    - { name: "thread_id", type: "INTEGER", doc: "Thread, if known." }
    - { name: "producer", type: "TEXT", doc: "What produced it (collector, gauge, hook…)." }
    - { name: "status", type: "TEXT", doc: "`running`, `done` or `failed`." }
    - { name: "trigger", type: "TEXT", doc: "What started it." }
    - { name: "provenance", type: "TEXT", doc: "`observed` (measured) or `asserted` (an agent claimed it)." }
    - { name: "source", type: "TEXT", doc: "Source identifier." }
    - { name: "snapshot_id", type: "INTEGER", doc: "Snapshot it was taken against, if any." }
    - { name: "branch", type: "TEXT", doc: "Git branch at capture." }
    - { name: "closest_vcs_rev", type: "TEXT", doc: "The VCS revision (a git sha) the capture's tree was at or nearest to." }
    - { name: "captured_at", type: "TEXT", doc: "RFC 3339 timestamp." }
    - { name: "ended_at", type: "TEXT", doc: "When the capture finished." }
    - { name: "scan_kind", type: "TEXT", doc: "`delta` or `full`." }
    - { name: "turn_id", type: "INTEGER", doc: "The agent turn it was measured in (v_agent_turn.id), when one produced it." }
- name: change
  version: 6
  description: "Analyzed changes: a commit (vs its parent), an agent turn (start → end snapshot: what the turn changed), a stream's working tree (vs HEAD) or a range (any two revisions). Created on demand by `oxplow_ensure_change`, or by a query that names one by `kind` and `target` (`kind = 'commit' AND target = <sha>`; `kind = 'working' AND target = ''` for the query's stream; `kind = 'range' AND target = :start || '..' || :end`, each side `working`, `snap:<id>` or `git:<rev>`, the start '' for the whole tree at the end), its analysis then run in the background; a working tree's, a running request's and a range's headed at the working tree are recomputed by the `change.analyze` consumer as the stream moves. The v_change_* views hold its analysis."
  fields:
    - { name: "id", type: "INTEGER", doc: "Change id (the change_id in v_change_*)." }
    - { name: "stream_id", type: "INTEGER", doc: "Stream whose repo it's in." }
    - { name: "kind", type: "TEXT", doc: "`commit`, `turn`, `request`, `working` or `range`." }
    - { name: "target", type: "TEXT", doc: "The commit sha, the turn row id, the request row id, '' for the working tree, or `<base>..<head>` for a range (each side a revision as resolved: `git:<full sha>`, `snap:<id>`, `working`; the base empty for the whole tree at the head)." }
    - { name: "base_revision", type: "TEXT", doc: "What it's compared against, as a revision: `git:<sha>`, `git:HEAD`, `snap:<id>`; NULL for a root commit or a range from nothing." }
    - { name: "head_revision", type: "TEXT", doc: "The newer side, as a revision: `git:<sha>`, `snap:<id>` or `working`." }
    - { name: "status", type: "TEXT", doc: "`pending`, `running`, `done` or `failed`." }
    - { name: "error", type: "TEXT", doc: "Why it failed, if it did." }
    - { name: "computed_at", type: "TEXT", doc: "When the analysis last finished (RFC 3339)." }
    - { name: "snapshot_id", type: "INTEGER", doc: "The stream's snapshot it was computed against (the head's for a turn or a finished request); NULL for a commit." }
    - { name: "events_to", type: "INTEGER", doc: "The event log's highest seq when the last analysis began: what its inputs had seen." }
    - { name: "files_at", type: "TEXT", doc: "When its changed files (stage one: v_change_file's paths, status and line counts) were last listed (RFC 3339); kept current on every move, apart from the deeper analysis." }
    - { name: "files_events_to", type: "INTEGER", doc: "The event log's highest seq when the files were last listed: what that list had seen." }
    - { name: "files_analyzed_seq", type: "INTEGER", doc: "The event log seq of the latest `change.analyzed` (phase `files`) logged for it; NULL before one." }
    - { name: "conflicted", type: "INTEGER", doc: "For a working tree, how many files git reports conflicted; NULL for other kinds." }
    - { name: "in_progress", type: "TEXT", doc: "For a working tree, git's operation in progress (`merge`, `rebase`, `cherry_pick`, `revert`, …); NULL when none or for other kinds." }
    - { name: "elapsed_ms", type: "INTEGER", doc: "How long its last deep analysis took (ms). Its duplicate scan is timed in v_code_quality_scan (scope `change <id>`)." }
  tests:
    - { not_null: id }
    - { unique: id }
- name: change_duplicate
  version: 2
  description: "Blocks in a change's files that duplicate code elsewhere in the tree. Arrives after the rest of the analysis (a whole-tree scan)."
  fields:
    - { name: "change_id", type: "INTEGER", doc: "The change (v_change.id)." }
    - { name: "path", type: "TEXT", doc: "The changed file." }
    - { name: "start_line", type: "INTEGER", doc: "First line of the block." }
    - { name: "end_line", type: "INTEGER", doc: "Last line of the block." }
    - { name: "lines", type: "INTEGER", doc: "Block size in lines." }
    - { name: "peer_path", type: "TEXT", doc: "Where the copy is." }
    - { name: "peer_start_line", type: "INTEGER", doc: "First line of the copy." }
    - { name: "peer_end_line", type: "INTEGER", doc: "Last line of the copy." }
- name: change_file
  version: 3
  description: "Each file a change touched, and whether it's a test. (v2: the \"look here first\" score moved to oxplow-bundled's `v_oxplow_change_interest`; v3: no zone.)"
  fields:
    - { name: "change_id", type: "INTEGER", doc: "The change (v_change.id)." }
    - { name: "path", type: "TEXT", doc: "Repo-relative path." }
    - { name: "status", type: "TEXT", doc: "`added`, `modified` or `deleted`." }
    - { name: "additions", type: "INTEGER", doc: "Lines added." }
    - { name: "deletions", type: "INTEGER", doc: "Lines deleted." }
    - { name: "is_test", type: "INTEGER", doc: "1 if the path looks like a test file." }
    - { name: "staged", type: "INTEGER", doc: "For a `working` change: 1 when the file's change is in the index (staged, ready to commit), else 0; NULL for the other kinds of change. (v2)" }
    - { name: "untracked", type: "INTEGER", doc: "For a `working` change: 1 when git doesn't track the file yet (it shows as `added`), else 0; NULL for the other kinds of change. (v2)" }
- name: change_function
  version: 4
  description: "Functions a change added, deleted or modified (signature and/or body), with metric deltas and per-function churn. Unchanged functions aren't listed."
  fields:
    - { name: "change_id", type: "INTEGER", doc: "The change (v_change.id)." }
    - { name: "path", type: "TEXT", doc: "File." }
    - { name: "uri", type: "TEXT", doc: "The function's symbol ref, `oxplow:oxplow/symbol?path=<path>&symbol=<id>` (`v_symbol.uri` without the snapshot): overloads and same-named functions are separate rows. Unique per change." }
    - { name: "container", type: "TEXT", doc: "Enclosing class/impl/module path, `::`-joined; '' at top level." }
    - { name: "name", type: "TEXT", doc: "Function name." }
    - { name: "status", type: "TEXT", doc: "`added`, `deleted` or `modified`." }
    - { name: "signature_changed", type: "INTEGER", doc: "1 if its parameter count changed." }
    - { name: "body_changed", type: "INTEGER", doc: "1 if its complexity or length changed." }
    - { name: "start_line", type: "INTEGER", doc: "First line (head side, or base side if deleted)." }
    - { name: "visibility", type: "TEXT", doc: "`public`, `private` or `unknown`." }
    - { name: "is_test", type: "INTEGER", doc: "1 if it's a test (test file, test name or test container)." }
    - { name: "complexity", type: "REAL", doc: "Cyclomatic complexity (head side, or base if deleted)." }
    - { name: "length", type: "INTEGER", doc: "Length in lines." }
    - { name: "params_before", type: "INTEGER", doc: "Parameter count before; NULL if added." }
    - { name: "params_after", type: "INTEGER", doc: "Parameter count after; NULL if deleted." }
    - { name: "complexity_delta", type: "REAL", doc: "Complexity change, for modified functions." }
    - { name: "length_delta", type: "INTEGER", doc: "Length change, for modified functions." }
    - { name: "added_lines", type: "INTEGER", doc: "Lines added inside it." }
    - { name: "deleted_lines", type: "INTEGER", doc: "Lines deleted inside it." }
    - { name: "modified_lines", type: "INTEGER", doc: "min(added, deleted): edited both ways." }
    - { name: "churn_share", type: "REAL", doc: "Its share of the change's function churn (0–1)." }
- name: change_hunk
  version: 1
  description: "Each changed file's changed line ranges in an analysed change: join line-anchored rows (facts, findings, coverage) to it to keep only what is on changed lines. One row per contiguous changed range, for every file the analysis read (at most 200 files, like change_function)."
  fields:
    - { name: "change_id", type: "INTEGER", doc: "The change (v_change.id)." }
    - { name: "path", type: "TEXT", doc: "File." }
    - { name: "head_start", type: "INTEGER", doc: "First changed line on the head side (1-indexed); NULL for a pure deletion." }
    - { name: "head_end", type: "INTEGER", doc: "Last changed line on the head side, inclusive; NULL for a pure deletion." }
    - { name: "base_start", type: "INTEGER", doc: "First changed line on the base side (1-indexed); NULL for a pure insertion." }
    - { name: "base_end", type: "INTEGER", doc: "Last changed line on the base side, inclusive; NULL for a pure insertion." }
    - { name: "head_after", type: "INTEGER", doc: "For a pure deletion: the head line it sits after (0 = before the first line); NULL otherwise." }
- name: change_import
  version: 2
  description: "Imports a change added or removed, per importing file, as written (not resolved to a file). (v2: no zones.)"
  fields:
    - { name: "change_id", type: "INTEGER", doc: "The change (v_change.id)." }
    - { name: "path", type: "TEXT", doc: "Importing file." }
    - { name: "module", type: "TEXT", doc: "What's imported, as written." }
    - { name: "direction", type: "TEXT", doc: "`added` or `removed`." }
    - { name: "start_line", type: "INTEGER", doc: "Line of the import." }
- name: change_test_file
  version: 1
  description: "How much each changed file's tests check, before and after the change: test functions, assertions and skip markers. Files that are tests or contain tests. The counts are a heuristic across languages (assert*/expect(/t.Error calls; #[ignore], .skip(, xit(, @Disabled, t.Skip markers), not a parse."
  fields:
    - { name: "change_id", type: "INTEGER", doc: "The change (v_change.id)." }
    - { name: "path", type: "TEXT", doc: "The file." }
    - { name: "tests_before", type: "INTEGER", doc: "Test functions on the base side." }
    - { name: "tests_after", type: "INTEGER", doc: "Test functions on the head side." }
    - { name: "assertions_before", type: "INTEGER", doc: "Assertion calls on the base side." }
    - { name: "assertions_after", type: "INTEGER", doc: "Assertion calls on the head side." }
    - { name: "skips_before", type: "INTEGER", doc: "Skip markers on the base side." }
    - { name: "skips_after", type: "INTEGER", doc: "Skip markers on the head side." }
- name: code_quality_finding
  version: 1
  description: "Findings from code-quality scans, e.g. duplicated blocks, each with its scan's tool and time."
  fields:
    - { name: "id", type: "INTEGER", doc: "Finding id." }
    - { name: "scan_id", type: "INTEGER", doc: "The scan (v_code_quality_scan.id)." }
    - { name: "tool", type: "TEXT", doc: "Scanner that found it." }
    - { name: "path", type: "TEXT", doc: "Repo-relative file." }
    - { name: "start_line", type: "INTEGER", doc: "First line." }
    - { name: "end_line", type: "INTEGER", doc: "Last line." }
    - { name: "kind", type: "TEXT", doc: "Finding kind, e.g. `duplicate-block`." }
    - { name: "metric_value", type: "REAL", doc: "Size or score (lines, for a duplicate)." }
    - { name: "extra_json", type: "TEXT", doc: "Kind-specific JSON, e.g. the duplicate's peer path and lines." }
    - { name: "scanned_at", type: "TEXT", doc: "When its scan started (RFC 3339)." }
- name: code_quality_scan
  version: 1
  description: "Code-quality scans (duplication and similar): when each ran, over which revision, and whether it finished."
  fields:
    - { name: "id", type: "INTEGER", doc: "Scan id." }
    - { name: "tool", type: "TEXT", doc: "Scanner, e.g. `duplication`." }
    - { name: "scope", type: "TEXT", doc: "What was scanned." }
    - { name: "status", type: "TEXT", doc: "`pending`, `running`, `done` or `failed`." }
    - { name: "started_at", type: "TEXT", doc: "RFC 3339 timestamp." }
    - { name: "ended_at", type: "TEXT", doc: "RFC 3339 timestamp; NULL while running." }
    - { name: "error", type: "TEXT", doc: "Failure message, if it failed." }
    - { name: "revision", type: "TEXT", doc: "The revision it read: `working`, `snap:<id>` or `git:<rev>`." }
    - { name: "file_filter", type: "TEXT", doc: "Fingerprint of the file filter it ran with, if any." }
  tests:
    - { not_null: id }
    - { unique: id }
- name: commit
  version: 4
  description: "Commits the indexer has read: those reachable from every stream's head (5000 deep), kept as heads move, and any commit a query names by its full `sha`, read when it asks (on demand). A stream's history is a recursive read over `parents` from its branch's `v_branch.head_sha`."
  fields:
    - { name: "sha", type: "TEXT", doc: "Full commit sha." }
    - { name: "author", type: "TEXT", doc: "Author name." }
    - { name: "email", type: "TEXT", doc: "Author email." }
    - { name: "committed_at", type: "TEXT", doc: "Commit time (RFC 3339)." }
    - { name: "subject", type: "TEXT", doc: "First line of the message." }
    - { name: "body", type: "TEXT", doc: "The rest of the message." }
    - { name: "first_parent", type: "", doc: "First parent's sha; NULL for a root commit." }
    - { name: "parent_count", type: "", doc: "Number of parents (2+ for a merge)." }
    - { name: "parents", type: "TEXT", doc: "Every parent's sha, as a JSON array (first parent first)." }
    - { name: "uri", type: "TEXT", doc: "`oxplow:oxplow/commit?sha=<sha>`: its URI, the one place SQL spells it — select and join on this, never rebuild it. (v2)" }
- name: commit_between
  version: 1
  key: [base, head, sha, stream_id]
  description: "The commits on `head` that `base` lacks (`git log base..head`), newest first, at most 100 per pair, read from the VCS when a query names it (live): what is unpushed, what a branch would merge. Narrowed by the query as `v_branch_divergence` is: a pinned pair, one side ranging over every branch, or every local branch against the default. Whole histories are `v_commit`."
  fields:
    - { name: "base", type: "TEXT", doc: "The revision whose commits are left out, as the query spelled it." }
    - { name: "head", type: "TEXT", doc: "The revision walked, as the query spelled it." }
    - { name: "sha", type: "TEXT", doc: "The commit's full sha (joins v_commit, v_commit_file)." }
    - { name: "short_sha", type: "TEXT", doc: "Its short sha." }
    - { name: "author", type: "TEXT", doc: "Author name." }
    - { name: "email", type: "TEXT", doc: "Author email." }
    - { name: "committed_at", type: "TEXT", doc: "When it was committed (RFC 3339)." }
    - { name: "subject", type: "TEXT", doc: "The first line of its message." }
    - { name: "stream_id", type: "INT", doc: "The stream whose repository was read (v_stream.id): the query's, else the primary." }
  tests:
    - { not_null: sha }
- name: commit_file
  version: 1
  description: "Files each commit changed, against its first parent."
  fields:
    - { name: "sha", type: "TEXT", doc: "The commit (v_commit.sha)." }
    - { name: "path", type: "TEXT", doc: "Repo-relative path." }
    - { name: "status", type: "TEXT", doc: "`added`, `modified`, `deleted` or `renamed`." }
    - { name: "additions", type: "INTEGER", doc: "Lines added." }
    - { name: "deletions", type: "INTEGER", doc: "Lines deleted." }
- name: context_read
  version: 2
  description: "Which `.context/*.md` project docs the agent read, and when. Compare with the files it changed to spot work done without reading the relevant doc."
  fields:
    - { name: "id", type: "INTEGER", doc: "Row id." }
    - { name: "thread_id", type: "INTEGER", doc: "Thread." }
    - { name: "turn_id", type: "INTEGER", doc: "The agent turn it was read in (v_agent_turn.id), when known." }
    - { name: "path", type: "TEXT", doc: "Doc path, e.g. `.context/usability.md`." }
    - { name: "at", type: "TEXT", doc: "RFC 3339 timestamp." }
  tests:
    - { not_null: id }
    - { unique: id }
- name: context_item
  version: 2
  description: "What the person collected for agents (`oxplow.context.add`): pages and pieces of text, each with an optional note of what they want done about it, in a basket — a thread's own (\"This Thread\") or a named basket (v_context_basket) collected into from any stream. The next prompt to any agent in a thread carries one basket as a `<context-basket>` block — its own, or the named basket set to go next for it (`oxplow.context.send_next`) — then deletes those items: what is here is what still waits."
  fields:
    - { name: "id", type: "INTEGER", doc: "Item id (the `item` the `oxplow.context.*` commands take)." }
    - { name: "thread_id", type: "INTEGER", doc: "The thread whose own basket it is in; NULL when it is in a named basket." }
    - { name: "thread_uri", type: "TEXT", doc: "That thread's URI (`oxplow:oxplow/thread?id=thr<n>`); NULL with no thread." }
    - { name: "basket_id", type: "INTEGER", doc: "The named basket it is in (v_context_basket.id); NULL when it is in a thread's own." }
    - { name: "basket", type: "TEXT", doc: "That basket's name (the `basket` the `oxplow.context.*` commands take); NULL when it is in a thread's own." }
    - { name: "stream_id", type: "INTEGER", doc: "The stream it was collected in (v_stream.id): a file it names is that stream's worktree's. NULL when not known." }
    - { name: "kind", type: "TEXT", doc: "`page` (a page, by `source_uri`) or `text` (a piece of text, from `source_uri` when known)." }
    - { name: "source_uri", type: "TEXT", doc: "The page, or where the text came from (a file's lines, a knowledge page, a row's ref); NULL for text from nowhere oxplow names." }
    - { name: "label", type: "TEXT", doc: "What the person saw it as (the page's title); NULL when none was given." }
    - { name: "text", type: "TEXT", doc: "The text, for a `text` item; NULL for a page." }
    - { name: "around", type: "TEXT", doc: "The lines around the text, when where it came from has no lines to read back (a terminal's scrollback); NULL otherwise." }
    - { name: "note", type: "TEXT", doc: "The person's note on it: what they want done about the page or the text; NULL when none." }
    - { name: "added_at", type: "TEXT", doc: "RFC 3339 timestamp." }
  tests:
    - { not_null: id }
    - { unique: id }
    - { relationships: { column: thread_id, to: thread, field: id } }
    - { relationships: { column: basket_id, to: context_basket, field: id } }
- name: context_basket
  version: 2
  description: "The person's named context baskets: collections of pages and text (v_context_item) for agents, kept across every stream of the project. One can be set to go with a thread's next prompt instead of the thread's own (`oxplow.context.send_next`); that prompt carries its items, empties it and sets the thread back to its own. The basket stays until the person deletes it. A thread's own basket (\"This Thread\") is not a row here."
  fields:
    - { name: "id", type: "INTEGER", doc: "Basket id." }
    - { name: "name", type: "TEXT", doc: "Its name, unique in any case (the `basket` the `oxplow.context.*` commands take)." }
    - { name: "next_thread_id", type: "INTEGER", doc: "The thread whose next prompt carries it instead of that thread's own basket (v_thread.id; at most one basket per thread); NULL when it goes with none." }
    - { name: "next_thread_uri", type: "TEXT", doc: "That thread's URI; NULL when it goes with none." }
    - { name: "items", type: "INT", doc: "How many items wait in it." }
    - { name: "created_at", type: "TEXT", doc: "RFC 3339 timestamp." }
  tests:
    - { not_null: id }
    - { unique: id }
    - { unique: name }
    - { relationships: { column: next_thread_id, to: thread, field: id } }
- name: context_sent
  version: 1
  description: "Each thread's last send of a context basket, kept so the person can put it back (`oxplow.context.put_back`): one row per thread, the next send replacing it, gone once put back. Not a history."
  fields:
    - { name: "thread_id", type: "INTEGER", doc: "The thread whose prompt carried it." }
    - { name: "thread_uri", type: "TEXT", doc: "That thread's URI." }
    - { name: "basket", type: "TEXT", doc: "The named basket it came from; NULL for the thread's own." }
    - { name: "items", type: "INT", doc: "How many items it carried." }
    - { name: "sent_at", type: "TEXT", doc: "When it went (RFC 3339)." }
  tests:
    - { not_null: thread_id }
    - { unique: thread_id }
    - { relationships: { column: thread_id, to: thread, field: id } }
- name: diagnostic
  version: 1
  description: "Errors and warnings the language servers have published for open or indexed files, right now (cleared when a server restarts)."
  fields:
    - { name: "stream_id", type: "INTEGER", doc: "Stream whose worktree it's in (v_stream.id)." }
    - { name: "language", type: "TEXT", doc: "The language server that reported it." }
    - { name: "path", type: "TEXT", doc: "Repo-relative file." }
    - { name: "severity", type: "TEXT", doc: "`error`, `warning`, `information` or `hint`." }
    - { name: "message", type: "TEXT", doc: "The diagnostic text." }
    - { name: "source", type: "TEXT", doc: "The tool behind it (`rustc`, `ts`, `eslint`, …), if given." }
    - { name: "code", type: "TEXT", doc: "Its code (`E0308`, `2304`, …), if given." }
    - { name: "line", type: "INTEGER", doc: "Start line (1-based)." }
    - { name: "col", type: "INTEGER", doc: "Start column (1-based)." }
    - { name: "end_line", type: "INTEGER", doc: "End line (1-based)." }
    - { name: "end_col", type: "INTEGER", doc: "End column (1-based)." }
    - { name: "updated_at", type: "TEXT", doc: "When the server last published this file (RFC 3339)." }
- name: event
  version: 8
  description: "The event log: every activity and state change, oldest first by `seq`, written in the same transaction as the change it records (.context/data-model.md \"event_log\")."
  fields:
    - { name: "seq", type: "INTEGER", doc: "Insert order — the delivery order consumers checkpoint on." }
    - { name: "id", type: "TEXT", doc: "Public identity (UUIDv7; sorts by time)." }
    - { name: "type", type: "TEXT", doc: "`namespace.name`, e.g. `thread.closed`." }
    - { name: "v", type: "INTEGER", doc: "Schema version of `type`." }
    - { name: "at", type: "TEXT", doc: "RFC 3339 timestamp." }
    - { name: "source", type: "TEXT", doc: "What emitted it: `human`, `agent:thr3`, `task_service`, …" }
    - { name: "stream_id", type: "INTEGER", doc: "Anchor, when known." }
    - { name: "thread_id", type: "INTEGER", doc: "Anchor, when known." }
    - { name: "turn_id", type: "INTEGER", doc: "Anchor (agent_turn), when known." }
    - { name: "snapshot_id", type: "INTEGER", doc: "Anchor, when known." }
    - { name: "agent_session_id", type: "INTEGER", doc: "Anchor (v_agent_session.id): the agent session it happened in, when known." }
    - { name: "revision", type: "TEXT", doc: "The code state the event is about, a resolved revision (`git:<sha>`, `snap:<id>`, `working`): `change.analyzed`'s head, the tree a script run for it reads. NULL for an event about no particular one. (v8)" }
    - { name: "subject", type: "TEXT", doc: "JSON array of the canonical refs the event is about." }
    - { name: "payload", type: "TEXT", doc: "JSON, validated against `type@v`'s schema." }
    - { name: "payload_hash", type: "TEXT", doc: "Content hash when the body lives in the content store." }
    - { name: "payload_expired_at", type: "TEXT", doc: "When retention replaced the payload with `{}` (the envelope stays); NULL while it's kept." }
    - { name: "cause", type: "TEXT", doc: "The event id that caused this one." }
    - { name: "dedupe_key", type: "TEXT", doc: "Emitter-derived key; unique." }
    - { name: "uri", type: "TEXT", doc: "`oxplow:oxplow/event?id=<id>`: its URI, the one place SQL spells it — select and join on this, never rebuild it. (v3)" }
- name: event_checkpoint
  version: 1
  description: "How far each event consumer has read."
  fields:
    - { name: "consumer", type: "TEXT", doc: "Consumer name." }
    - { name: "last_seq", type: "INTEGER", doc: "Last `v_event.seq` it handled or skipped." }
    - { name: "updated_at", type: "TEXT", doc: "RFC 3339 timestamp." }
- name: event_content
  version: 1
  description: "Large or sensitive event bodies (tool input and output, prompts), stored by content hash; an event payload's `{hash, size}` points here. Retention deletes a body after its namespace's window; the event stays. The bytes are read with `read_event_content` by event id, not through SQL."
  fields:
    - { name: "hash", type: "TEXT", doc: "xxh3-128 hex of the bytes." }
    - { name: "namespace", type: "TEXT", doc: "The event namespace it belongs to (`agent`, `test`, …); sets its retention." }
    - { name: "size", type: "INTEGER", doc: "Length in bytes." }
    - { name: "created_at", type: "TEXT", doc: "RFC 3339 timestamp." }
- name: event_dead_letter
  version: 1
  description: "Events a consumer failed on, parked with the error. `pending` letters need a person's retry or discard."
  fields:
    - { name: "id", type: "INTEGER", doc: "Letter id (for `retry_dead_letter` / `discard_dead_letter`)." }
    - { name: "consumer", type: "TEXT", doc: "The consumer that failed." }
    - { name: "event_seq", type: "INTEGER", doc: "`v_event.seq`." }
    - { name: "event_id", type: "TEXT", doc: "`v_event.id`." }
    - { name: "event_type", type: "TEXT", doc: "`v_event.type`." }
    - { name: "error", type: "TEXT", doc: "The last failure." }
    - { name: "attempts", type: "INTEGER", doc: "How many times it has failed." }
    - { name: "first_failed_at", type: "TEXT", doc: "RFC 3339 timestamp." }
    - { name: "last_failed_at", type: "TEXT", doc: "RFC 3339 timestamp." }
    - { name: "state", type: "TEXT", doc: "`pending`, `retried` or `discarded`." }
- name: op_error_output
  version: 1
  key: [event_id]
  description: "What a failed operation printed: the stderr and stdout the app captured for each `v_op_error` row (its event's `output` body). The one event body published to SQL — it is what the person saw on screen; tool input and output and prompts stay behind `read_event_content`. A failure that captured nothing, or whose output retention removed (14 days), has no row."
  fields:
    - { name: "event_id", type: "TEXT", doc: "The `ui.op_failed` event (`v_op_error.event_id`)." }
    - { name: "stream_id", type: "INTEGER", doc: "The stream it happened in, if known." }
    - { name: "stderr", type: "TEXT", doc: "Captured stderr, if any." }
    - { name: "stdout", type: "TEXT", doc: "Captured stdout, if any." }
    - { name: "truncated", type: "INT", doc: "1 when only the first part was kept (bodies are capped)." }
- name: op_error
  version: 4
  key: [event_id]
  description: "Operations that failed in front of the person in the app (a merge, a save, a query), as the app showed them: one row per `ui.op_failed` event. The captured stderr and stdout are the event's `output` body — `read_event_content(event_id, output)`. Kept 30 days, the output 14; past that the row stays with its details NULL."
  fields:
    - { name: "event_id", type: "TEXT", doc: "The `ui.op_failed` event (v_event.id); read its output with `read_event_content`." }
    - { name: "at", type: "TEXT", doc: "When it failed (RFC 3339)." }
    - { name: "stream_id", type: "INTEGER", doc: "The stream of the thread it was started from, if any." }
    - { name: "thread", type: "TEXT", doc: "The thread it was started from (`thr3`), if any." }
    - { name: "label", type: "TEXT", doc: "What the person was doing (\"Merge bugfixes into current\")." }
    - { name: "command", type: "TEXT", doc: "The command it ran, shell-style (\"git merge bugfixes\"), if known." }
    - { name: "message", type: "TEXT", doc: "The error message, when there was no captured output to show." }
    - { name: "exit_code", type: "INT", doc: "The process's exit code, if known." }
    - { name: "signal", type: "TEXT", doc: "The signal that killed the process (`SIGKILL`), if any." }
    - { name: "duration_ms", type: "INT", doc: "How long it ran, in milliseconds, if measured." }
    - { name: "output_size", type: "INT", doc: "Length in bytes of the captured output body (`{ stderr?, stdout? }`); NULL when nothing was captured." }
    - { name: "audit_id", type: "INT", doc: "The failed command's run (`v_command_run.id`), if any. (v4)" }
    - { name: "proposal_id", type: "INT", doc: "An approval that failed: its proposal (v_command_proposal.id); NULL otherwise. (v3)" }
    - { name: "payload_expired_at", type: "TEXT", doc: "When retention expired its details (they read NULL); NULL while kept." }
    - { name: "seen", type: "INT", doc: "1 once the person opened its output on the Alerts page (`oxplow.op_error.mark_seen`), or dismissed it. (v2)" }
    - { name: "dismissed", type: "INT", doc: "1 once the person dismissed it (`oxplow.op_error.dismiss`, `dismiss_all`): the app no longer lists it. (v2)" }
- name: fact
  version: 5
  description: "Facts: atomic measurements (a function's complexity, a test's outcome, a token count), joined to their measure and capture context. One row per capture holding the fact: a scan that restates a whole population (duplicate blocks) holds the facts it repeats from the scan before, so an unchanged fact appears under each scan with the same id."
  fields:
    - { name: "id", type: "INTEGER", doc: "Fact id; the same across the captures that hold the fact unchanged." }
    - { name: "capture_id", type: "INTEGER", doc: "A capture holding it (v_capture.id)." }
    - { name: "measure_key", type: "TEXT", doc: "Measure this is a value of (v_measure.key)." }
    - { name: "value", type: "REAL", doc: "The measured value." }
    - { name: "numerator", type: "REAL", doc: "Ratio numerator, for ratio measures." }
    - { name: "denominator", type: "REAL", doc: "Ratio denominator, for ratio measures." }
    - { name: "subject_kind", type: "TEXT", doc: "The subject URI's resource (`oxplow/file`, `oxplow/symbol`, `oxplow/test`, …): a filter, not an identity." }
    - { name: "subject", type: "TEXT", doc: "What the fact is about, as one ref (`oxplow:oxplow/file?path=src/a.rs`, `oxplow:oxplow/symbol?path=src/a.rs&symbol=f`, `oxplow:oxplow/ai_model?name=claude-opus-4-8`)." }
    - { name: "path", type: "TEXT", doc: "File path, when the subject has one." }
    - { name: "line", type: "INTEGER", doc: "Line number, when it has one." }
    - { name: "severity", type: "TEXT", doc: "Finding severity, for lint-like facts." }
    - { name: "rule", type: "TEXT", doc: "Rule id, for lint-like facts." }
    - { name: "detail", type: "TEXT", doc: "Free-text detail." }
    - { name: "dims_json", type: "TEXT", doc: "Extra dimensions as a JSON object." }
    - { name: "stream_id", type: "INTEGER", doc: "From the capture." }
    - { name: "thread_id", type: "INTEGER", doc: "From the capture." }
    - { name: "turn_id", type: "INTEGER", doc: "The agent turn it was measured in (v_agent_turn.id), from the capture." }
    - { name: "captured_at", type: "TEXT", doc: "From the capture." }
    - { name: "branch", type: "TEXT", doc: "From the capture." }
- name: measure
  version: 2
  description: "Measures: the catalog of fact types (what a v_fact.value means)."
  fields:
    - { name: "key", type: "TEXT", doc: "Namespaced key, e.g. `oxplow.coverage`." }
    - { name: "title", type: "TEXT", doc: "Display name." }
    - { name: "unit", type: "TEXT", doc: "Unit of value, if any." }
    - { name: "subject_kind", type: "TEXT", doc: "What a fact is about: `symbol`, `file`, `test`, `model`, …" }
    - { name: "temporal_semantics", type: "TEXT", doc: "How values combine over time: `additive`, `semi-additive` or `non-additive`." }
    - { name: "scope", type: "TEXT", doc: "`built-in`, `global` or `project`." }
    - { name: "description", type: "TEXT", doc: "What the measure means." }
    - { name: "fold", type: "TEXT", doc: "How the series folds over time into one number: `sum`, `last`, `first`, `avg` or `none`; empty when the measure declares none." }
- name: metric_spec
  version: 3
  description: "Metric definitions: what each metric aggregates, which direction is good, and its target / warn / fail thresholds. Whether a metric is enabled here is `v_metric_catalog.enabled`."
  fields:
    - { name: "key", type: "TEXT", doc: "Metric key, e.g. `oxplow.coverage.abs_pct`." }
    - { name: "title", type: "TEXT", doc: "Display name." }
    - { name: "unit", type: "TEXT", doc: "Unit, e.g. `%`, `ms`; NULL for counts." }
    - { name: "source_measure", type: "TEXT", doc: "Measure whose facts it aggregates; NULL for a formula metric." }
    - { name: "aggregation", type: "TEXT", doc: "How facts combine within a capture: count, sum, avg, min, max, last, p95, ratio, …" }
    - { name: "direction", type: "TEXT", doc: "`higher-better`, `lower-better` or `neutral`." }
    - { name: "target", type: "REAL", doc: "Goal value, if any." }
    - { name: "warn_at", type: "REAL", doc: "Warning threshold, if any (read with `direction`)." }
    - { name: "fail_at", type: "REAL", doc: "Failure threshold, if any (read with `direction`)." }
    - { name: "description", type: "TEXT", doc: "What it measures." }
    - { name: "category", type: "TEXT", doc: "Grouping on the Metrics page." }
    - { name: "language", type: "TEXT", doc: "Language it applies to, if language-specific." }
    - { name: "scope", type: "", doc: "`built-in`, `global`, `project` or `extension`." }
    - { name: "display_kind", type: "TEXT", doc: "`gauge`, `findings`, `test`, `coverage` or `event`." }
    - { name: "extension", type: "TEXT", doc: "The extension that declares it, when `scope` is `extension`." }
    - { name: "entity_json", type: "TEXT", doc: "For an entity metric, what it reads: `{\"view\", \"where\", \"time\", \"value\", \"aggregation\"}`; NULL for a fact metric. (v2)" }
