# The core models: each one a published view `v_<name>`, compiled from
# `<name>.sql` at every open (`crate::models`). A model reads only through
# `ref('<model>')` and `source('<table>')`. `columns` is its contract: a
# change to it needs a new `version`. See `.context/semantic-layer.md`
# "Models".
- name: agent_nudge
  version: 3
  description: "Guidance oxplow raised — a hint (`<extension>/<id>`) or its own nudge (`report-less-run`) — for the coding agent, taken by its next prompt or tool call, or for a person, shown in Alerts until they dismiss it."
  columns:
    - { name: "id", type: "INTEGER", doc: "Row id." }
    - { name: "thread_id", type: "INTEGER", doc: "Thread." }
    - { name: "effort_id", type: "INTEGER", doc: "Effort it was about, if any." }
    - { name: "turn_id", type: "INTEGER", doc: "Turn it happened in (v_agent_turn.id), when known." }
    - { name: "kind", type: "TEXT", doc: "What kind of nudge, e.g. `report-less-run` or an advisory's `<extension>/<id>`." }
    - { name: "message", type: "TEXT", doc: "The text the agent was given." }
    - { name: "trigger", type: "TEXT", doc: "What prompted it, if recorded." }
    - { name: "created_at", type: "TEXT", doc: "RFC 3339 timestamp." }
    - { name: "delivered_at", type: "TEXT", doc: "When a hook response carried it to the agent, or the person dismissed it; NULL while it waits." }
    - { name: "audience", type: "TEXT", doc: "`agent` or `person`. (v2)" }
  tests:
    - { not_null: id }
    - { unique: id }
    - { accepted_values: { column: audience, values: [agent, person] } }
- name: hint_stat
  version: 1
  description: "How each hint (an extension advisory, `<extension>/<id>`) did on each thread: how often it was evaluated, how often it fired, how much of that reached its audience or waits, and whether it was muted for firing on after being delivered."
  columns:
    - { name: "thread_id", type: "INTEGER", doc: "Thread (v_thread.id)." }
    - { name: "hint", type: "TEXT", doc: "The hint, `<extension>/<id>`." }
    - { name: "evaluated", type: "INTEGER", doc: "Times its query ran on the thread." }
    - { name: "last_evaluated_at", type: "TEXT", doc: "When it last ran (RFC 3339)." }
    - { name: "fired", type: "", doc: "Nudges it raised on the thread (v_agent_nudge rows of its kind)." }
    - { name: "delivered", type: "", doc: "Of those, the ones that reached their audience: taken by the agent, or dismissed by a person." }
    - { name: "held", type: "", doc: "Of those, the ones still waiting." }
    - { name: "muted", type: "", doc: "Scopes (efforts, or the thread) where it was muted for firing on after three deliveries." }
  tests:
    - { not_null: hint }
- name: agent_status
  version: 2
  description: "Each thread's agent status: its open agent sessions' statuses (v_agent_session_status) rolled up — what the person owes ranks first: `awaiting_user` (waiting on them: a question, a plan to approve, a permission prompt, a final message ending in a question) > `running` > `error` > `stopped` > `idle`. A dead turn's `stalled` is derived live, never logged."
  columns:
    - { name: "thread_id", type: "INTEGER", doc: "The thread (v_thread.id)." }
    - { name: "state", type: "", doc: "`running`, `idle`, `awaiting_user`, `stopped` or `error`: the session status that ranks first." }
    - { name: "detail", type: "", doc: "What that session waits on (the question, the permission asked), or why it stopped." }
    - { name: "since", type: "TEXT", doc: "When that session moved to it (RFC 3339)." }
- name: agent_plan
  version: 1
  description: "Plans the agent put to the person, newest event last: Claude Code's `ExitPlanMode` (its plan and the file it saved it in) and Codex's `plan` item. opencode's `plan_exit` carries no text, so it records none. Whether the person accepted a plan is in no harness's hooks, so nothing here says. The row's event is `event:<event_id>`."
  columns:
    - { name: "event_id", type: "TEXT", doc: "The `agent.plan.proposed` event (v_event.id); read it with `oxplow_read event:<id>`." }
    - { name: "seq", type: "INTEGER", doc: "The event's place in the log (v_event.seq): orders plans proposed in the same instant." }
    - { name: "thread_id", type: "INTEGER", doc: "The thread (v_thread.id)." }
    - { name: "effort_id", type: "INTEGER", doc: "The thread's open effort when it was proposed (v_effort.id); NULL when none was open." }
    - { name: "turn_id", type: "INTEGER", doc: "The turn it came in (v_agent_turn.id); NULL when none was open." }
    - { name: "agent_session_id", type: "INTEGER", doc: "The agent session (v_agent_session.id); NULL for a hook no session claims." }
    - { name: "proposed_at", type: "TEXT", doc: "When it was proposed (RFC 3339)." }
    - { name: "text", type: "TEXT", doc: "The plan, as the agent wrote it (the first 64 KiB)." }
    - { name: "path", type: "TEXT", doc: "The file the harness saved it in (Claude's `planFilePath`); NULL when it says none." }
  tests:
    - { not_null: event_id }
    - { unique: event_id }
    - { relationships: { column: thread_id, to: thread, field: id } }
- name: agent_session_status
  version: 1
  description: "Each open agent session's status as last logged: `running`, `idle`, `awaiting_user`, `stopped`, `error`. A dead turn's `stalled` is derived live, never logged. v_agent_status rolls a thread's sessions up."
  columns:
    - { name: "thread_id", type: "INTEGER", doc: "The thread (v_thread.id)." }
    - { name: "agent_session_id", type: "INTEGER", doc: "The session (v_agent_session.id)." }
    - { name: "state", type: "", doc: "`running`, `idle`, `awaiting_user`, `stopped` or `error`." }
    - { name: "detail", type: "", doc: "What it's waiting on (the question, the permission asked), or why it stopped." }
    - { name: "since", type: "TEXT", doc: "When it moved to this status (RFC 3339)." }
- name: agent_session_binding
  version: 1
  description: "Which native conversation each agent slot was bound to, and when: its first, one the harness moved it to (a native `/resume`), a fork's copy, or one the person chose. The open one (no `unbound_at`) is the slot's `resume_session_id`; a fresh start or `/clear` ends it with none after."
  columns:
    - { name: "id", type: "INTEGER", doc: "Row id." }
    - { name: "agent_session_id", type: "INTEGER", doc: "The slot (v_agent_session.id)." }
    - { name: "native_id", type: "TEXT", doc: "The harness's own conversation id." }
    - { name: "origin", type: "TEXT", doc: "`started` (its first, or the first since it had none), `switched` (the harness moved it), `forked` (a fork launch's copy) or `chosen` (the person chose it)." }
    - { name: "bound_at", type: "TEXT", doc: "RFC 3339 timestamp." }
    - { name: "unbound_at", type: "TEXT", doc: "When the next one replaced it or the slot was left with none; NULL while it is the slot's." }
    - { name: "session_ref", type: "TEXT", doc: "The slot's ref (`agent_session:ses<n>`)." }
  tests:
    - { not_null: id }
    - { unique: id }
    - { relationships: { column: agent_session_id, to: agent_session, field: id } }
- name: agent_turn
  version: 7
  description: "Agent turns: each human prompt and the agent's answer, per thread and agent session. start_snapshot_id → snapshot_id is what the turn changed (the snapshot the worktree was at when it opened and when it ended)."
  columns:
    - { name: "id", type: "INTEGER", doc: "Turn id." }
    - { name: "thread_id", type: "INTEGER", doc: "Thread the turn ran in." }
    - { name: "agent_session_id", type: "INTEGER", doc: "The agent session it ran in (v_agent_session.id); NULL for a turn no session claims (a hook from an agent oxplow didn't start)." }
    - { name: "prompt", type: "TEXT", doc: "What the human typed." }
    - { name: "answer", type: "TEXT", doc: "The agent's final answer, once the turn ended." }
    - { name: "session_id", type: "TEXT", doc: "The harness session id, when it reported one." }
    - { name: "started_at", type: "TEXT", doc: "RFC 3339 timestamp." }
    - { name: "ended_at", type: "TEXT", doc: "RFC 3339 timestamp; NULL while running." }
    - { name: "start_snapshot_id", type: "INTEGER", doc: "Snapshot the worktree was at when the turn opened (v_snapshot.id); NULL if the stream had none yet." }
    - { name: "snapshot_id", type: "INTEGER", doc: "Snapshot the worktree was at when the turn ended (v_snapshot.id); NULL while running." }
    - { name: "ref", type: "TEXT", doc: "`turn:trn<id>`: its ref, the one place SQL spells it — select and join on this, never rebuild it. (v3)" }
    - { name: "transcript_page", type: "TEXT", doc: "The session's transcript lens opened at this turn (`lens:oxplow-foundation/session-transcript?session=…&turn=…`): where a turn opens. NULL for a turn no session claims. (v4)" }
    - { name: "model", type: "TEXT", doc: "The model the turn ran on, as its harness reported it with the turn's end; NULL while running, or when the harness said nothing (opencode). (v5)" }
    - { name: "effort", type: "TEXT", doc: "The reasoning effort the turn ran at (`high`, `medium`, …), as its harness reported it with the turn's end; NULL while running, or when it said nothing. (v5)" }
    - { name: "context_tokens", type: "INTEGER", doc: "Tokens in the agent's context when the turn ended (input plus cache reads and writes of the turn's last request), as its harness reported it with the turn's end; NULL while running, or when the harness said nothing. (v6)" }
    - { name: "context_window", type: "INTEGER", doc: "The size of the model's context window, in tokens, as its harness reported it; NULL while running, or when it said nothing (Claude Code never does). context_tokens / context_window is how full the context was. (v6)" }
    - { name: "from_peer", type: "TEXT", doc: "Who opened the turn when it has no prompt of a person's: the name the other agent session gave itself (Claude Code's cross-session message, `agent.peer_message.received`). NULL for a turn a person's prompt opened, and for any other. (v7)" }
  tests:
    - { not_null: id }
    - { unique: id }
- name: ai_call
  version: 5
  description: "Every model call oxplow itself made (not the coding agent's): role, provider, model, tokens, latency and whether it succeeded."
  columns:
    - { name: "id", type: "INTEGER", doc: "Row id." }
    - { name: "role", type: "TEXT", doc: "Role used (`main`, `summarize`, `decide`)." }
    - { name: "provider", type: "TEXT", doc: "Provider id from ai.yaml." }
    - { name: "model", type: "TEXT", doc: "Model id." }
    - { name: "caller", type: "TEXT", doc: "What asked: the asking thread's ref (`thread:<id>`) for an agent's MCP call, `collector:<owner>/<id>`, `inferred-decisions`, …" }
    - { name: "input_tokens", type: "INTEGER", doc: "Input tokens." }
    - { name: "output_tokens", type: "INTEGER", doc: "Output tokens." }
    - { name: "latency_ms", type: "INTEGER", doc: "Round-trip time." }
    - { name: "ok", type: "INTEGER", doc: "1 succeeded, 0 failed." }
    - { name: "error", type: "TEXT", doc: "Error message when it failed." }
    - { name: "at", type: "TEXT", doc: "RFC 3339 timestamp." }
    - { name: "input_hash", type: "TEXT", doc: "For a recorded computation (`v_ai_result`), the hash of its input; NULL for other calls." }
    - { name: "request_hash", type: "TEXT", doc: "Content hash of what the model was asked (`{ system, prompt, json }` or `{ state, questions }`), its body kept for the `ai` retention window (`read_ai_call`); NULL for a call made before requests were kept." }
    - { name: "response_hash", type: "TEXT", doc: "Content hash of what the model answered (`{ text }` or `{ answers }`), kept like the request; NULL when the call failed." }
    - { name: "run_id", type: "TEXT", doc: "The extension run that made the call (`v_extension_run.run_id`); NULL for oxplow's own calls. (v3)" }
    - { name: "ref", type: "TEXT", doc: "`ai_call:<id>`: its ref. `oxplow_read` gives its row and, with `#request` / `#response`, its bodies. (v4)" }
  tests:
    - { not_null: id }
    - { unique: id }
- name: ai_result
  version: 2
  description: "Recorded AI computations: a classify / score / decide / summarize / extract result kept by the hash of its input, the provider, the model and the request the model was sent, so asking again reads it instead of calling, and a changed prompt computes afresh. Tokens only; no cost."
  columns:
    - { name: "id", type: "INTEGER", doc: "Row id." }
    - { name: "input_hash", type: "TEXT", doc: "sha256 of the canonical `{ op, args }`." }
    - { name: "provider", type: "TEXT", doc: "The provider that served the model (`ai_*` settings id); another provider of the same model name is another result." }
    - { name: "model", type: "TEXT", doc: "The model that computed it." }
    - { name: "request_hash", type: "TEXT", doc: "Content hash of the exact request the model was sent (`v_ai_call.request_hash`); a changed prompt is a new result." }
    - { name: "op", type: "TEXT", doc: "`classify`, `score`, `decide`, `summarize` or `extract`." }
    - { name: "role", type: "TEXT", doc: "The role it ran on: a built-in (`decide`, `summarize`, `main`) or an extension's AI profile (`acme/review`)." }
    - { name: "caller", type: "TEXT", doc: "What first asked, e.g. `inferred-decisions`, `collector:<owner>/<id>`." }
    - { name: "output_json", type: "TEXT", doc: "The result as JSON." }
    - { name: "input_tokens", type: "INTEGER", doc: "Input tokens of the call that computed it." }
    - { name: "output_tokens", type: "INTEGER", doc: "Output tokens of that call." }
    - { name: "at", type: "TEXT", doc: "When it was computed (RFC 3339)." }
    - { name: "ai_call_id", type: "INTEGER", doc: "The call that computed it (v_ai_call.id)." }
  tests:
    - { not_null: input_hash }
    - { unique: id }
    - { relationships: { column: ai_call_id, to: ai_call, field: id } }
- name: bookmark
  version: 1
  description: "Pages the person bookmarked, each at one scope: a thread's, a stream's or the whole project's. A thread sees its own, its stream's and the project's; a ref is bookmarked at most once across those."
  columns:
    - { name: "id", type: "INTEGER", doc: "Bookmark id." }
    - { name: "ref", type: "TEXT", doc: "The page's canonical ref (its tab id): what the bookmark opens." }
    - { name: "page_kind", type: "TEXT", doc: "Its page kind (`page`, `file`, `wiki`, …), for the icon." }
    - { name: "label", type: "TEXT", doc: "The page's title when it was bookmarked." }
    - { name: "scope", type: "TEXT", doc: "`thread`, `stream` or `project`." }
    - { name: "thread_id", type: "INTEGER", doc: "The owning thread, for a `thread` bookmark." }
    - { name: "stream_id", type: "INTEGER", doc: "The owning stream, for a `stream` bookmark." }
    - { name: "added_at", type: "TEXT", doc: "RFC 3339 timestamp." }
  tests:
    - { not_null: id }
    - { unique: id }
    - { not_null: ref }
- name: branch
  version: 1
  description: "Local and remote-tracking branches, refreshed on boot and whenever refs move."
  columns:
    - { name: "name", type: "TEXT", doc: "Branch name (without the remote)." }
    - { name: "kind", type: "TEXT", doc: "`local` or `remote`." }
    - { name: "remote", type: "TEXT", doc: "Remote name for a remote-tracking branch." }
    - { name: "head_sha", type: "TEXT", doc: "The commit it points at." }
    - { name: "stream_id", type: "INTEGER", doc: "The stream whose worktree has it checked out (v_stream.id), if any." }
    - { name: "updated_at", type: "TEXT", doc: "When oxplow last read it (RFC 3339)." }
    - { name: "is_default", type: "INTEGER", doc: "1 for the repository's default branch (`main`), else 0." }
- name: capture
  version: 1
  description: "Captures: one scan or run that produced facts, with its when/where/who context."
  columns:
    - { name: "id", type: "INTEGER", doc: "Capture id." }
    - { name: "stream_id", type: "INTEGER", doc: "Stream captured in." }
    - { name: "thread_id", type: "INTEGER", doc: "Thread, if known." }
    - { name: "effort_id", type: "INTEGER", doc: "Producing effort, when unambiguous." }
    - { name: "producer", type: "TEXT", doc: "What produced it (collector, gauge, hook…)." }
    - { name: "status", type: "TEXT", doc: "`running`, `done` or `failed`." }
    - { name: "trigger", type: "TEXT", doc: "What started it." }
    - { name: "provenance", type: "TEXT", doc: "`observed` (measured) or `asserted` (an agent claimed it)." }
    - { name: "source", type: "TEXT", doc: "Source identifier." }
    - { name: "snapshot_id", type: "INTEGER", doc: "Snapshot it was taken against, if any." }
    - { name: "branch", type: "TEXT", doc: "Git branch at capture." }
    - { name: "closest_vcs_rev", type: "TEXT", doc: "The VCS revision (a git sha) the capture's tree was at or nearest to." }
    - { name: "captured_at", type: "TEXT", doc: "RFC 3339 timestamp." }
    - { name: "ended_at", type: "TEXT", doc: "When the capture finished." }
    - { name: "scan_kind", type: "TEXT", doc: "`delta` or `full`." }
    - { name: "turn_id", type: "INTEGER", doc: "The agent turn it was measured in (v_agent_turn.id), when one produced it." }
- name: change
  version: 3
  description: "Analyzed changes: a commit (vs its parent), an effort (start → end snapshot, or → working tree while open), an agent turn (start → end snapshot: what the turn changed) or a stream's working tree (vs HEAD). Created on demand by `oxplow_ensure_change`; a working tree's and an open effort's are recomputed by the `change.analyze` consumer as the stream moves. The v_change_* views hold its analysis."
  columns:
    - { name: "id", type: "INTEGER", doc: "Change id (the change_id in v_change_*)." }
    - { name: "stream_id", type: "INTEGER", doc: "Stream whose repo it's in." }
    - { name: "kind", type: "TEXT", doc: "`commit`, `effort`, `turn` or `working`." }
    - { name: "target", type: "TEXT", doc: "The commit sha, the effort row id, the turn row id, or '' for the working tree." }
    - { name: "base_revision", type: "TEXT", doc: "What it's compared against, as a revision: `git:<sha>`, `git:HEAD`, `snap:<id>`; NULL for a root commit." }
    - { name: "head_revision", type: "TEXT", doc: "The newer side, as a revision: `git:<sha>`, `snap:<id>` or `working`." }
    - { name: "status", type: "TEXT", doc: "`pending`, `running`, `done` or `failed`." }
    - { name: "error", type: "TEXT", doc: "Why it failed, if it did." }
    - { name: "computed_at", type: "TEXT", doc: "When the analysis last finished (RFC 3339)." }
    - { name: "snapshot_id", type: "INTEGER", doc: "The stream's snapshot it was computed against (the head's for a turn or a closed effort); NULL for a commit." }
    - { name: "events_to", type: "INTEGER", doc: "The event log's highest seq when the last analysis began: what its inputs had seen." }
    - { name: "files_at", type: "TEXT", doc: "When its changed files (stage one: v_change_file's paths, status and line counts) were last listed (RFC 3339); kept current on every move, apart from the deeper analysis." }
    - { name: "files_events_to", type: "INTEGER", doc: "The event log's highest seq when the files were last listed: what that list had seen." }
    - { name: "conflicted", type: "INTEGER", doc: "For a working tree, how many files git reports conflicted; NULL for other kinds." }
    - { name: "in_progress", type: "TEXT", doc: "For a working tree, git's operation in progress (`merge`, `rebase`, `cherry_pick`, `revert`, …); NULL when none or for other kinds." }
    - { name: "elapsed_ms", type: "INTEGER", doc: "How long its last deep analysis took (ms). Its duplicate scan is timed in v_code_quality_scan (scope `change <id>`)." }
  tests:
    - { not_null: id }
    - { unique: id }
- name: change_duplicate
  version: 1
  description: "Blocks in a change's files that duplicate code elsewhere in the tree. Arrives after the rest of the analysis (a whole-tree scan); none for closed efforts yet."
  columns:
    - { name: "change_id", type: "INTEGER", doc: "The change (v_change.id)." }
    - { name: "path", type: "TEXT", doc: "The changed file." }
    - { name: "start_line", type: "INTEGER", doc: "First line of the block." }
    - { name: "end_line", type: "INTEGER", doc: "Last line of the block." }
    - { name: "lines", type: "INTEGER", doc: "Block size in lines." }
    - { name: "peer_path", type: "TEXT", doc: "Where the copy is." }
    - { name: "peer_start_line", type: "INTEGER", doc: "First line of the copy." }
    - { name: "peer_end_line", type: "INTEGER", doc: "Last line of the copy." }
- name: change_file
  version: 1
  description: "Each file a change touched, with its zone and whether it's a test. (v2: the \"look here first\" score moved to oxplow-bundled's `v_oxplow_bundled_change_interest`.)"
  columns:
    - { name: "change_id", type: "INTEGER", doc: "The change (v_change.id)." }
    - { name: "path", type: "TEXT", doc: "Repo-relative path." }
    - { name: "status", type: "TEXT", doc: "`added`, `modified` or `deleted`." }
    - { name: "additions", type: "INTEGER", doc: "Lines added." }
    - { name: "deletions", type: "INTEGER", doc: "Lines deleted." }
    - { name: "zone", type: "TEXT", doc: "Architectural zone from the project's zone rules (`other` when none match)." }
    - { name: "is_test", type: "INTEGER", doc: "1 if the path looks like a test file." }
- name: change_function
  version: 2
  description: "Functions a change added, deleted or modified (signature and/or body), with metric deltas and per-function churn. Unchanged functions aren't listed."
  columns:
    - { name: "change_id", type: "INTEGER", doc: "The change (v_change.id)." }
    - { name: "path", type: "TEXT", doc: "File." }
    - { name: "ref", type: "TEXT", doc: "The function's symbol ref, `symbol:<path>/<id>` (`v_symbol.ref` without the snapshot): overloads and same-named functions are separate rows. Unique per change." }
    - { name: "container", type: "TEXT", doc: "Enclosing class/impl/module path, `::`-joined; '' at top level." }
    - { name: "name", type: "TEXT", doc: "Function name." }
    - { name: "status", type: "TEXT", doc: "`added`, `deleted` or `modified`." }
    - { name: "signature_changed", type: "INTEGER", doc: "1 if its parameter count changed." }
    - { name: "body_changed", type: "INTEGER", doc: "1 if its complexity or length changed." }
    - { name: "start_line", type: "INTEGER", doc: "First line (head side, or base side if deleted)." }
    - { name: "visibility", type: "TEXT", doc: "`public`, `private` or `unknown`." }
    - { name: "is_test", type: "INTEGER", doc: "1 if it's a test (test file, test name or test container)." }
    - { name: "complexity", type: "REAL", doc: "Cyclomatic complexity (head side, or base if deleted)." }
    - { name: "length", type: "INTEGER", doc: "Length in lines." }
    - { name: "params_before", type: "INTEGER", doc: "Parameter count before; NULL if added." }
    - { name: "params_after", type: "INTEGER", doc: "Parameter count after; NULL if deleted." }
    - { name: "complexity_delta", type: "REAL", doc: "Complexity change, for modified functions." }
    - { name: "length_delta", type: "INTEGER", doc: "Length change, for modified functions." }
    - { name: "added_lines", type: "INTEGER", doc: "Lines added inside it." }
    - { name: "deleted_lines", type: "INTEGER", doc: "Lines deleted inside it." }
    - { name: "modified_lines", type: "INTEGER", doc: "min(added, deleted): edited both ways." }
    - { name: "churn_share", type: "REAL", doc: "Its share of the change's function churn (0–1)." }
- name: change_import
  version: 1
  description: "Imports a change added or removed, with source and target zones. `cross_zone` flags a new import that crosses an architectural boundary."
  columns:
    - { name: "change_id", type: "INTEGER", doc: "The change (v_change.id)." }
    - { name: "path", type: "TEXT", doc: "Importing file." }
    - { name: "module", type: "TEXT", doc: "What's imported, as written." }
    - { name: "direction", type: "TEXT", doc: "`added` or `removed`." }
    - { name: "start_line", type: "INTEGER", doc: "Line of the import." }
    - { name: "from_zone", type: "TEXT", doc: "The importing file's zone." }
    - { name: "to_zone", type: "TEXT", doc: "The target's zone, if known (`external` for packages)." }
    - { name: "cross_zone", type: "INTEGER", doc: "1 for an added import into a different known zone." }
- name: change_test_file
  version: 1
  description: "How much each changed file's tests check, before and after the change: test functions, assertions and skip markers. Files that are tests or contain tests. The counts are a heuristic across languages (assert*/expect(/t.Error calls; #[ignore], .skip(, xit(, @Disabled, t.Skip markers), not a parse."
  columns:
    - { name: "change_id", type: "INTEGER", doc: "The change (v_change.id)." }
    - { name: "path", type: "TEXT", doc: "The file." }
    - { name: "tests_before", type: "INTEGER", doc: "Test functions on the base side." }
    - { name: "tests_after", type: "INTEGER", doc: "Test functions on the head side." }
    - { name: "assertions_before", type: "INTEGER", doc: "Assertion calls on the base side." }
    - { name: "assertions_after", type: "INTEGER", doc: "Assertion calls on the head side." }
    - { name: "skips_before", type: "INTEGER", doc: "Skip markers on the base side." }
    - { name: "skips_after", type: "INTEGER", doc: "Skip markers on the head side." }
- name: claim
  version: 8
  description: "Claims the agent made about its work (\"tests pass\", \"no behavior change\") and what each cites: the ones it stated in `oxplow.effort.report` and the ones a model read in its answers when the effort finished. (v8: both sources, `provenance`.)"
  columns:
    - { name: "id", type: "INTEGER", doc: "Claim id." }
    - { name: "thread_id", type: "INTEGER", doc: "Thread it was made in." }
    - { name: "work_item", type: "TEXT", doc: "The work item it was made on (`work_item:<provider>:<id>`), if any." }
    - { name: "effort_id", type: "INTEGER", doc: "Effort, if one was open." }
    - { name: "turn_id", type: "INTEGER", doc: "Turn it happened in (v_agent_turn.id), when known." }
    - { name: "agent_session_id", type: "INTEGER", doc: "The agent session that made it (v_agent_session.id); NULL when not recorded. (v4)" }
    - { name: "statement", type: "TEXT", doc: "The claim in words." }
    - { name: "kind", type: "TEXT", doc: "`tests_pass`, `no_behavior_change`, `handles_case` or `other`." }
    - { name: "evidence_ref", type: "TEXT", doc: "What it cites (`run:<id>`, a test, a file, or `reviewer` when a person verified it with `oxplow.effort.verify_claim`); NULL if nothing was cited. Whether anything else backs it is a review policy's call (oxplow-bundled's `v_oxplow_bundled_claim_status`). (v6)" }
    - { name: "review", type: "TEXT", doc: "A reviewer's verdict: `verified` (`oxplow.effort.verify_claim`, with what backs it in `evidence_ref`) or `dismissed` (the agent didn't claim it, or didn't mean it: `oxplow.effort.dismiss_claim`); NULL while unreviewed. Reading the effort again, or reporting again, replaces only that source's unreviewed claims. (v7)" }
    - { name: "provenance", type: "TEXT", doc: "`recorded` (the agent stated it in `oxplow.effort.report`'s `claims`) or `inferred` (a model read it in the effort's answers). The review treats both alike. (v8)" }
    - { name: "created_at", type: "TEXT", doc: "RFC 3339 timestamp." }
    - { name: "ref", type: "TEXT", doc: "`claim:<id>`: its ref, the one place SQL spells it — select and join on this, never rebuild it. (v5)" }
- name: code_quality_finding
  version: 1
  description: "Findings from code-quality scans, e.g. duplicated blocks, each with its scan's tool and time."
  columns:
    - { name: "id", type: "INTEGER", doc: "Finding id." }
    - { name: "scan_id", type: "INTEGER", doc: "The scan (v_code_quality_scan.id)." }
    - { name: "tool", type: "TEXT", doc: "Scanner that found it." }
    - { name: "path", type: "TEXT", doc: "Repo-relative file." }
    - { name: "start_line", type: "INTEGER", doc: "First line." }
    - { name: "end_line", type: "INTEGER", doc: "Last line." }
    - { name: "kind", type: "TEXT", doc: "Finding kind, e.g. `duplicate-block`." }
    - { name: "metric_value", type: "REAL", doc: "Size or score (lines, for a duplicate)." }
    - { name: "extra_json", type: "TEXT", doc: "Kind-specific JSON, e.g. the duplicate's peer path and lines." }
    - { name: "scanned_at", type: "TEXT", doc: "When its scan started (RFC 3339)." }
- name: code_quality_scan
  version: 1
  description: "Code-quality scans (duplication and similar): when each ran, over which revision, and whether it finished."
  columns:
    - { name: "id", type: "INTEGER", doc: "Scan id." }
    - { name: "tool", type: "TEXT", doc: "Scanner, e.g. `duplication`." }
    - { name: "scope", type: "TEXT", doc: "What was scanned." }
    - { name: "status", type: "TEXT", doc: "`pending`, `running`, `done` or `failed`." }
    - { name: "started_at", type: "TEXT", doc: "RFC 3339 timestamp." }
    - { name: "ended_at", type: "TEXT", doc: "RFC 3339 timestamp; NULL while running." }
    - { name: "error", type: "TEXT", doc: "Failure message, if it failed." }
    - { name: "revision", type: "TEXT", doc: "The revision it read: `working`, `snap:<id>` or `git:<rev>`." }
    - { name: "file_filter", type: "TEXT", doc: "Fingerprint of the file filter it ran with, if any." }
  tests:
    - { not_null: id }
    - { unique: id }
- name: comment
  version: 2
  description: "Comment threads anchored to a page (file, wiki page, task…). `intent` says who should act."
  columns:
    - { name: "id", type: "INTEGER", doc: "Comment id." }
    - { name: "stream_id", type: "INTEGER", doc: "Stream the comment was made in." }
    - { name: "thread_id", type: "INTEGER", doc: "Thread it was made in, if any." }
    - { name: "target_kind", type: "TEXT", doc: "Kind of page it is anchored to: `file`, `wiki`, `task`, …" }
    - { name: "target_id", type: "TEXT", doc: "Id of that page (path, slug, task id…)." }
    - { name: "quote", type: "TEXT", doc: "The selected text the comment is anchored to." }
    - { name: "intent", type: "TEXT", doc: "`note` (for me) or `followup` (for the agent to act on)." }
    - { name: "status", type: "TEXT", doc: "`open` or `resolved`." }
    - { name: "orphaned", type: "INTEGER", doc: "1 when the quote can no longer be found in the page." }
    - { name: "author", type: "TEXT", doc: "Who started it." }
    - { name: "created_at", type: "TEXT", doc: "RFC 3339 timestamp." }
    - { name: "updated_at", type: "TEXT", doc: "RFC 3339 timestamp." }
    - { name: "last_activity_at", type: "TEXT", doc: "Time of the newest message." }
    - { name: "resolved_at", type: "TEXT", doc: "Set when resolved." }
    - { name: "body", type: "TEXT", doc: "Text of the first message." }
    - { name: "message_count", type: "", doc: "Number of messages in the thread." }
    - { name: "ref", type: "TEXT", doc: "`comment:cmt<id>`: its ref, the one place SQL spells it — select and join on this, never rebuild it. (v2)" }
- name: commit
  version: 2
  description: "Commits the indexer has read: the last 500 reachable from every stream's head, kept as heads move. A stream's history is a recursive read over `parents` from its branch's `v_branch.head_sha`."
  columns:
    - { name: "sha", type: "TEXT", doc: "Full commit sha." }
    - { name: "author", type: "TEXT", doc: "Author name." }
    - { name: "email", type: "TEXT", doc: "Author email." }
    - { name: "committed_at", type: "TEXT", doc: "Commit time (RFC 3339)." }
    - { name: "subject", type: "TEXT", doc: "First line of the message." }
    - { name: "body", type: "TEXT", doc: "The rest of the message." }
    - { name: "first_parent", type: "", doc: "First parent's sha; NULL for a root commit." }
    - { name: "parent_count", type: "", doc: "Number of parents (2+ for a merge)." }
    - { name: "parents", type: "TEXT", doc: "Every parent's sha, as a JSON array (first parent first)." }
    - { name: "ref", type: "TEXT", doc: "`commit:<sha>`: its ref, the one place SQL spells it — select and join on this, never rebuild it. (v2)" }
- name: commit_file
  version: 1
  description: "Files each commit changed, against its first parent."
  columns:
    - { name: "sha", type: "TEXT", doc: "The commit (v_commit.sha)." }
    - { name: "path", type: "TEXT", doc: "Repo-relative path." }
    - { name: "status", type: "TEXT", doc: "`added`, `modified`, `deleted` or `renamed`." }
    - { name: "additions", type: "INTEGER", doc: "Lines added." }
    - { name: "deletions", type: "INTEGER", doc: "Lines deleted." }
- name: commit_work_item
  version: 1
  description: "The active work list's items each commit was for: the ones its message mentions (`tsk42`, `[[tsk42]]`, by the list's id pattern), the ones that declared it as an impact, and the ones whose effort's work it holds (its version of every file they share is the effort's end version)."
  columns:
    - { name: "sha", type: "TEXT", doc: "The commit (v_commit.sha)." }
    - { name: "work_item", type: "TEXT", doc: "The work item (v_work_item.ref)." }
  tests:
    - { relationships: { column: work_item, to: work_item, field: ref } }
- name: context_read
  version: 1
  description: "Which `.context/*.md` project docs the agent read, and when. Compare with the files it changed to spot work done without reading the relevant doc."
  columns:
    - { name: "id", type: "INTEGER", doc: "Row id." }
    - { name: "thread_id", type: "INTEGER", doc: "Thread." }
    - { name: "effort_id", type: "INTEGER", doc: "Effort, if one was open." }
    - { name: "path", type: "TEXT", doc: "Doc path, e.g. `.context/usability.md`." }
    - { name: "at", type: "TEXT", doc: "RFC 3339 timestamp." }
  tests:
    - { not_null: id }
    - { unique: id }
- name: dashboard
  version: 2
  description: "User-created dashboards."
  columns:
    - { name: "id", type: "INTEGER", doc: "Dashboard id." }
    - { name: "title", type: "TEXT", doc: "Title." }
    - { name: "sort_index", type: "INTEGER", doc: "Order in the dashboards list." }
    - { name: "created_at", type: "TEXT", doc: "RFC 3339 timestamp." }
    - { name: "updated_at", type: "TEXT", doc: "RFC 3339 timestamp." }
    - { name: "ref", type: "TEXT", doc: "`dashboard:dsh<id>`: its ref, the one place SQL spells it — select and join on this, never rebuild it. (v2)" }
  tests:
    - { not_null: id }
    - { unique: id }
- name: dashboard_item
  version: 1
  description: "Tiles on dashboards: a query (pinned SQL shown as a lens viz or the metric card), a lens or a text note. v2: `query` replaces `metric`; its SQL is in `options_json`."
  columns:
    - { name: "id", type: "INTEGER", doc: "Tile id." }
    - { name: "dashboard_id", type: "INTEGER", doc: "Its dashboard (v_dashboard.id)." }
    - { name: "sort_index", type: "INTEGER", doc: "Position on the dashboard." }
    - { name: "kind", type: "TEXT", doc: "`query`, `lens` or `text`." }
    - { name: "options_json", type: "TEXT", doc: "Tile options, JSON: a query tile's `sql` and `display` (a lens viz, or `metric` with its `metric` key), a lens tile's `lensId`, a text tile's `text`, and every tile's size and filter overrides." }
  tests:
    - { not_null: id }
    - { unique: id }
- name: decision
  version: 5
  description: "Decisions: forks the agent resolved while working (what it chose, what it didn't, why), recorded by the agent or inferred by oxplow. What a reviewer most wants to check."
  columns:
    - { name: "id", type: "INTEGER", doc: "Decision id." }
    - { name: "thread_id", type: "INTEGER", doc: "Thread it was made in." }
    - { name: "work_item", type: "TEXT", doc: "The work item being worked on (`work_item:<provider>:<id>`), if any." }
    - { name: "effort_id", type: "INTEGER", doc: "Effort it was made during, if one was open." }
    - { name: "turn_id", type: "INTEGER", doc: "Turn it happened in (v_agent_turn.id), when known." }
    - { name: "question", type: "TEXT", doc: "What had to be decided." }
    - { name: "choice", type: "TEXT", doc: "What was chosen." }
    - { name: "alternatives", type: "TEXT", doc: "Options not taken, as a JSON array of strings." }
    - { name: "confidence", type: "TEXT", doc: "`low`, `medium` or `high`." }
    - { name: "why", type: "TEXT", doc: "The reasoning." }
    - { name: "provenance", type: "TEXT", doc: "`recorded` (the agent recorded it), `inferred` (oxplow proposed it from the effort's activity when the effort closed — a recorded `extract` computation on the `main` role; unconfirmed), or what a reviewer made of an inferred one: `confirmed` or `dismissed` (`oxplow.effort.confirm_decision` / `oxplow.effort.dismiss_decision`)." }
    - { name: "created_at", type: "TEXT", doc: "RFC 3339 timestamp." }
    - { name: "ref", type: "TEXT", doc: "`decision:<id>`: its ref, the one place SQL spells it — select and join on this, never rebuild it. (v4)" }
    - { name: "effort_ref", type: "TEXT", doc: "Its effort's ref (`effort:eff<n>`), when it was made during one: where a decision opens. (v5)" }
    - { name: "thread_ref", type: "TEXT", doc: "Its thread's ref (`thread:thr<n>`): where a decision opens when it has no effort. (v5)" }
  tests:
    - { not_null: id }
    - { unique: id }
- name: diagnostic
  version: 1
  description: "Errors and warnings the language servers have published for open or indexed files, right now (cleared when a server restarts)."
  columns:
    - { name: "stream_id", type: "INTEGER", doc: "Stream whose worktree it's in (v_stream.id)." }
    - { name: "language", type: "TEXT", doc: "The language server that reported it." }
    - { name: "path", type: "TEXT", doc: "Repo-relative file." }
    - { name: "severity", type: "TEXT", doc: "`error`, `warning`, `information` or `hint`." }
    - { name: "message", type: "TEXT", doc: "The diagnostic text." }
    - { name: "source", type: "TEXT", doc: "The tool behind it (`rustc`, `ts`, `eslint`, …), if given." }
    - { name: "code", type: "TEXT", doc: "Its code (`E0308`, `2304`, …), if given." }
    - { name: "line", type: "INTEGER", doc: "Start line (1-based)." }
    - { name: "col", type: "INTEGER", doc: "Start column (1-based)." }
    - { name: "end_line", type: "INTEGER", doc: "End line (1-based)." }
    - { name: "end_col", type: "INTEGER", doc: "End column (1-based)." }
    - { name: "updated_at", type: "TEXT", doc: "When the server last published this file (RFC 3339)." }
- name: effort
  version: 6
  description: "Efforts: one span of a thread's work between a start and an end snapshot, opened and closed by oxplow and linked to a work item when there is one (.context/work-tracking.md). At most one is open per thread."
  columns:
    - { name: "id", type: "INTEGER", doc: "Effort id." }
    - { name: "work_item", type: "TEXT", doc: "The work item it's linked to, as a canonical ref (`work_item:oxplow:tsk42`, `work_item:issues:ENG-12`); NULL while unlinked. (v2: nullable)" }
    - { name: "thread_id", type: "INTEGER", doc: "Thread that did the work." }
    - { name: "stream_id", type: "INTEGER", doc: "That thread's stream." }
    - { name: "started_at", type: "TEXT", doc: "RFC 3339 timestamp." }
    - { name: "ended_at", type: "TEXT", doc: "RFC 3339 timestamp; NULL while the effort is open." }
    - { name: "start_snapshot_id", type: "INTEGER", doc: "Snapshot at the start (v_snapshot.id)." }
    - { name: "end_snapshot_id", type: "INTEGER", doc: "Snapshot at the end; NULL while open." }
    - { name: "summary", type: "", doc: "What shipped: the summary `oxplow.effort.report` recorded, else the final message of the last agent turn in the effort." }
    - { name: "title", type: "", doc: "Its own title, else its work item's, else the first line of its first prompt. (v2)" }
    - { name: "closed_by", type: "TEXT", doc: "What closed it: `commit`, `switch`, `person`, `agent` or `system`; NULL while open. (v2)" }
    - { name: "ref", type: "TEXT", doc: "`effort:eff<id>`: its ref, the one place SQL spells it — select and join on this, never rebuild it. (v6)" }
- name: effort_file
  version: 4
  description: "Files each effort changed, with how they changed: claimed by an edit tool, or observed changing during one of its thread's turns."
  columns:
    - { name: "effort_id", type: "INTEGER", doc: "The effort (v_effort.id)." }
    - { name: "work_item", type: "TEXT", doc: "That effort's work item ref." }
    - { name: "path", type: "TEXT", doc: "Repo-relative file path." }
    - { name: "change_kind", type: "TEXT", doc: "`created`, `updated` or `deleted`." }
    - { name: "closest_vcs_rev", type: "TEXT", doc: "The VCS revision (a git sha) nearest the file when recorded." }
    - { name: "source", type: "TEXT", doc: "`claimed` (an edit tool named it) or `observed` (it changed during one of the thread's turns and no other thread claimed it)." }
    - { name: "agent_session_id", type: "INTEGER", doc: "The agent session: the one whose edit claimed it, or the only one with a turn running when it was observed; NULL when `shared` or not recorded. (v4)" }
    - { name: "shared", type: "INTEGER", doc: "1 for an observed file more than one session's turns could have changed, so no session owns it. (v4)" }
- name: effort_metric_delta
  version: 1
  description: "How each metric moved during an effort (before → after), computed by oxplow's metric engine and refreshed when the effort closes and as data arrives while it's open."
  columns:
    - { name: "effort_id", type: "INTEGER", doc: "Effort (v_effort.id)." }
    - { name: "key", type: "TEXT", doc: "Metric key (v_metric_spec.key)." }
    - { name: "title", type: "TEXT", doc: "Metric name." }
    - { name: "unit", type: "TEXT", doc: "Unit, if any." }
    - { name: "direction", type: "TEXT", doc: "`higher-better`, `lower-better` or `neutral`." }
    - { name: "kind", type: "TEXT", doc: "`gauge`, `coverage`, `test`, `event`, …" }
    - { name: "category", type: "TEXT", doc: "Metric category." }
    - { name: "language", type: "TEXT", doc: "Language, if language-specific." }
    - { name: "agg", type: "TEXT", doc: "How the delta was computed: `files` (over the effort's claimed files), `sum` (in-window total) or `level` (before→after)." }
    - { name: "baseline", type: "REAL", doc: "Value as the effort began; NULL for `sum`." }
    - { name: "current", type: "REAL", doc: "Value at the effort's end (or now, if open)." }
    - { name: "delta", type: "REAL", doc: "current − baseline, or the total for `sum`." }
    - { name: "changed", type: "INTEGER", doc: "1 if the value moved during the effort." }
    - { name: "attributed_files", type: "INTEGER", doc: "For `files`: how many claimed files carry the metric." }
    - { name: "sample_count", type: "INTEGER", doc: "Samples considered." }
    - { name: "target", type: "REAL", doc: "Metric target." }
    - { name: "warn_at", type: "REAL", doc: "Warning threshold." }
    - { name: "fail_at", type: "REAL", doc: "Failure threshold." }
    - { name: "crossing", type: "TEXT", doc: "`warn` or `fail` when the current value sits past that threshold; else NULL." }
    - { name: "latest_capture_id", type: "INTEGER", doc: "The latest contributing capture (v_capture.id), for drill-in." }
    - { name: "refreshed_at", type: "TEXT", doc: "When oxplow last recomputed it (RFC 3339)." }
- name: effort_observation
  version: 1
  description: "Evidence gathered during an effort: test runs, diff coverage and analysis results, rebuilt from the captures the effort claimed."
  columns:
    - { name: "effort_id", type: "INTEGER", doc: "Effort (v_effort.id)." }
    - { name: "seq", type: "INTEGER", doc: "Order within the effort, oldest first: the highest is the latest." }
    - { name: "kind", type: "TEXT", doc: "`test-run`, `diff-coverage`, `static-analysis`, …" }
    - { name: "provenance", type: "TEXT", doc: "`observed` (oxplow saw it) or `asserted` (the agent reported it)." }
    - { name: "source", type: "TEXT", doc: "Where it came from, e.g. `post-tool-bash`." }
    - { name: "metric_value", type: "REAL", doc: "Headline number, e.g. coverage %." }
    - { name: "payload_json", type: "TEXT", doc: "Kind-specific detail, JSON (e.g. test cases, covered/uncovered lines)." }
    - { name: "local_snapshot_id", type: "INTEGER", doc: "Snapshot it was captured against." }
    - { name: "created_at", type: "TEXT", doc: "RFC 3339 timestamp." }
- name: event
  version: 3
  description: "The event log: every activity and state change, oldest first by `seq`, written in the same transaction as the change it records (.context/data-model.md \"event_log\")."
  columns:
    - { name: "seq", type: "INTEGER", doc: "Insert order — the delivery order consumers checkpoint on." }
    - { name: "id", type: "TEXT", doc: "Public identity (UUIDv7; sorts by time)." }
    - { name: "type", type: "TEXT", doc: "`namespace.name`, e.g. `work_item.state_changed`." }
    - { name: "v", type: "INTEGER", doc: "Schema version of `type`." }
    - { name: "at", type: "TEXT", doc: "RFC 3339 timestamp." }
    - { name: "source", type: "TEXT", doc: "What emitted it: `human`, `agent:thr3`, `task_service`, …" }
    - { name: "stream_id", type: "INTEGER", doc: "Anchor, when known." }
    - { name: "thread_id", type: "INTEGER", doc: "Anchor, when known." }
    - { name: "effort_id", type: "INTEGER", doc: "Anchor, when known." }
    - { name: "turn_id", type: "INTEGER", doc: "Anchor (agent_turn), when known." }
    - { name: "snapshot_id", type: "INTEGER", doc: "Anchor, when known." }
    - { name: "agent_session_id", type: "INTEGER", doc: "Anchor (v_agent_session.id): the agent session it happened in, when known." }
    - { name: "subject", type: "TEXT", doc: "JSON array of the canonical refs the event is about." }
    - { name: "payload", type: "TEXT", doc: "JSON, validated against `type@v`'s schema." }
    - { name: "payload_hash", type: "TEXT", doc: "Content hash when the body lives in the content store." }
    - { name: "payload_expired_at", type: "TEXT", doc: "When retention replaced the payload with `{}` (the envelope stays); NULL while it's kept." }
    - { name: "cause", type: "TEXT", doc: "The event id that caused this one." }
    - { name: "dedupe_key", type: "TEXT", doc: "Emitter-derived key; unique." }
    - { name: "ref", type: "TEXT", doc: "`event:<id>`: its ref, the one place SQL spells it — select and join on this, never rebuild it. (v3)" }
- name: event_checkpoint
  version: 1
  description: "How far each event consumer has read."
  columns:
    - { name: "consumer", type: "TEXT", doc: "Consumer name." }
    - { name: "last_seq", type: "INTEGER", doc: "Last `v_event.seq` it handled or skipped." }
    - { name: "updated_at", type: "TEXT", doc: "RFC 3339 timestamp." }
- name: event_content
  version: 1
  description: "Large or sensitive event bodies (tool input and output, prompts), stored by content hash; an event payload's `{hash, size}` points here. Retention deletes a body after its namespace's window; the event stays. The bytes are read with `read_event_content` by event id, not through SQL."
  columns:
    - { name: "hash", type: "TEXT", doc: "xxh3-128 hex of the bytes." }
    - { name: "namespace", type: "TEXT", doc: "The event namespace it belongs to (`agent`, `test`, …); sets its retention." }
    - { name: "size", type: "INTEGER", doc: "Length in bytes." }
    - { name: "created_at", type: "TEXT", doc: "RFC 3339 timestamp." }
- name: event_dead_letter
  version: 1
  description: "Events a consumer failed on, parked with the error. `pending` letters need a person's retry or discard."
  columns:
    - { name: "id", type: "INTEGER", doc: "Letter id (for `retry_dead_letter` / `discard_dead_letter`)." }
    - { name: "consumer", type: "TEXT", doc: "The consumer that failed." }
    - { name: "event_seq", type: "INTEGER", doc: "`v_event.seq`." }
    - { name: "event_id", type: "TEXT", doc: "`v_event.id`." }
    - { name: "event_type", type: "TEXT", doc: "`v_event.type`." }
    - { name: "error", type: "TEXT", doc: "The last failure." }
    - { name: "attempts", type: "INTEGER", doc: "How many times it has failed." }
    - { name: "first_failed_at", type: "TEXT", doc: "RFC 3339 timestamp." }
    - { name: "last_failed_at", type: "TEXT", doc: "RFC 3339 timestamp." }
    - { name: "state", type: "TEXT", doc: "`pending`, `retried` or `discarded`." }
- name: op_error
  version: 1
  key: [event_id]
  description: "Operations that failed in front of the person in the app (a merge, a save, a query), as the app showed them: one row per `ui.op_failed` event. The captured stderr and stdout are the event's `output` body — `read_event_content(event_id, output)`. Kept 30 days, the output 14; past that the row stays with its details NULL."
  columns:
    - { name: "event_id", type: "TEXT", doc: "The `ui.op_failed` event (v_event.id); read its output with `read_event_content`." }
    - { name: "at", type: "TEXT", doc: "When it failed (RFC 3339)." }
    - { name: "stream_id", type: "INTEGER", doc: "The stream of the thread it was started from, if any." }
    - { name: "thread", type: "TEXT", doc: "The thread it was started from (`thr3`), if any." }
    - { name: "label", type: "TEXT", doc: "What the person was doing (\"Merge bugfixes into current\")." }
    - { name: "command", type: "TEXT", doc: "The command it ran, shell-style (\"git merge bugfixes\"), if known." }
    - { name: "message", type: "TEXT", doc: "The error message, when there was no captured output to show." }
    - { name: "exit_code", type: "INT", doc: "The process's exit code, if known." }
    - { name: "signal", type: "TEXT", doc: "The signal that killed the process (`SIGKILL`), if any." }
    - { name: "duration_ms", type: "INT", doc: "How long it ran, in milliseconds, if measured." }
    - { name: "output_size", type: "INT", doc: "Length in bytes of the captured output body (`{ stderr?, stdout? }`); NULL when nothing was captured." }
    - { name: "payload_expired_at", type: "TEXT", doc: "When retention expired its details (they read NULL); NULL while kept." }
- name: fact
  version: 3
  description: "Facts: atomic measurements (a function's complexity, a test's outcome, a token count), joined to their measure and capture context. One row per capture holding the fact: a scan that restates a whole population (duplicate blocks) holds the facts it repeats from the scan before, so an unchanged fact appears under each scan with the same id."
  columns:
    - { name: "id", type: "INTEGER", doc: "Fact id; the same across the captures that hold the fact unchanged." }
    - { name: "capture_id", type: "INTEGER", doc: "A capture holding it (v_capture.id)." }
    - { name: "measure_key", type: "TEXT", doc: "Measure this is a value of (v_measure.key)." }
    - { name: "value", type: "REAL", doc: "The measured value." }
    - { name: "numerator", type: "REAL", doc: "Ratio numerator, for ratio measures." }
    - { name: "denominator", type: "REAL", doc: "Ratio denominator, for ratio measures." }
    - { name: "subject_kind", type: "TEXT", doc: "The subject ref's kind (`file`, `symbol`, `test`, …): a filter, not an identity." }
    - { name: "subject", type: "TEXT", doc: "What the fact is about, as one ref (`file:src/a.rs`, `symbol:src/a.rs/f`, `ai_model:claude-opus-4-8`)." }
    - { name: "path", type: "TEXT", doc: "File path, when the subject has one." }
    - { name: "line", type: "INTEGER", doc: "Line number, when it has one." }
    - { name: "severity", type: "TEXT", doc: "Finding severity, for lint-like facts." }
    - { name: "rule", type: "TEXT", doc: "Rule id, for lint-like facts." }
    - { name: "detail", type: "TEXT", doc: "Free-text detail." }
    - { name: "dims_json", type: "TEXT", doc: "Extra dimensions as a JSON object." }
    - { name: "stream_id", type: "INTEGER", doc: "From the capture." }
    - { name: "thread_id", type: "INTEGER", doc: "From the capture." }
    - { name: "effort_id", type: "INTEGER", doc: "From the capture." }
    - { name: "captured_at", type: "TEXT", doc: "From the capture." }
    - { name: "branch", type: "TEXT", doc: "From the capture." }
- name: measure
  version: 1
  description: "Measures: the catalog of fact types (what a v_fact.value means)."
  columns:
    - { name: "key", type: "TEXT", doc: "Namespaced key, e.g. `oxplow.coverage`." }
    - { name: "title", type: "TEXT", doc: "Display name." }
    - { name: "unit", type: "TEXT", doc: "Unit of value, if any." }
    - { name: "subject_kind", type: "TEXT", doc: "What a fact is about: `symbol`, `file`, `test`, `model`, …" }
    - { name: "temporal_semantics", type: "TEXT", doc: "How values combine over time: `additive`, `semi-additive` or `non-additive`." }
    - { name: "scope", type: "TEXT", doc: "`built-in`, `global` or `project`." }
    - { name: "description", type: "TEXT", doc: "What the measure means." }
- name: metric_spec
  version: 1
  description: "Metric definitions: what each metric aggregates, which direction is good, and its target / warn / fail thresholds. Whether a metric is enabled here is `v_metric_catalog.enabled`."
  columns:
    - { name: "key", type: "TEXT", doc: "Metric key, e.g. `oxplow.coverage.abs_pct`." }
    - { name: "title", type: "TEXT", doc: "Display name." }
    - { name: "unit", type: "TEXT", doc: "Unit, e.g. `%`, `ms`; NULL for counts." }
    - { name: "source_measure", type: "TEXT", doc: "Measure whose facts it aggregates; NULL for a formula metric." }
    - { name: "aggregation", type: "TEXT", doc: "How facts combine within a capture: count, sum, avg, min, max, last, p95, ratio, …" }
    - { name: "direction", type: "TEXT", doc: "`higher-better`, `lower-better` or `neutral`." }
    - { name: "target", type: "REAL", doc: "Goal value, if any." }
    - { name: "warn_at", type: "REAL", doc: "Warning threshold, if any (read with `direction`)." }
    - { name: "fail_at", type: "REAL", doc: "Failure threshold, if any (read with `direction`)." }
    - { name: "description", type: "TEXT", doc: "What it measures." }
    - { name: "category", type: "TEXT", doc: "Grouping on the Metrics page." }
    - { name: "language", type: "TEXT", doc: "Language it applies to, if language-specific." }
    - { name: "scope", type: "", doc: "`built-in`, `global`, `project` or `extension`." }
    - { name: "display_kind", type: "TEXT", doc: "`gauge`, `findings`, `test`, `coverage` or `event`." }
    - { name: "extension", type: "TEXT", doc: "The extension that declares it, when `scope` is `extension`." }
    - { name: "entity_json", type: "TEXT", doc: "For an entity metric, what it reads: `{\"view\", \"where\", \"time\", \"value\", \"aggregation\"}`; NULL for a fact metric. (v2)" }
- name: page_visit
  version: 1
  description: "Pages the human opened in oxplow, and for how long — what they've been looking at."
  columns:
    - { name: "id", type: "INTEGER", doc: "Visit id." }
    - { name: "thread_id", type: "INTEGER", doc: "Thread the page was opened in." }
    - { name: "page_kind", type: "TEXT", doc: "Page kind (`task`, `file`, `lens`, …)." }
    - { name: "page_id", type: "TEXT", doc: "Page id (`task:42`, `file:src/a.rs`, …)." }
    - { name: "label", type: "TEXT", doc: "Title shown at the time." }
    - { name: "visited_at", type: "TEXT", doc: "RFC 3339 timestamp." }
    - { name: "duration_ms", type: "INTEGER", doc: "Time on the page, when known." }
  tests:
    - { not_null: id }
    - { unique: id }
- name: search_comment
  version: 2
  description: "What site search indexes for each comment (tsk864): the `comment` kind's index is restated from these rows when they change."
  columns:
    - { name: "ref", type: "TEXT", doc: "The comment's canonical ref (`comment:cmt<n>`): what a hit opens." }
    - { name: "title", type: "TEXT", doc: "The quote it's anchored to." }
    - { name: "body", type: "TEXT", doc: "The quote, then every message, a line each." }
    - { name: "stream_id", type: "TEXT", doc: "Its stream (`str1`)." }
    - { name: "version", type: "TEXT", doc: "Changes whenever the row's text does; a recompute reads the text of rows whose version moved only. (v2: the newer of the comment's change and its last message)" }
  tests:
    - { not_null: ref }
    - { unique: ref }
- name: search_agent_session
  version: 1
  description: "What site search indexes for each agent session: the `agent_session` kind's index is restated from these rows when they change. Closed sessions and sessions on archived threads are included."
  columns:
    - { name: "ref", type: "TEXT", doc: "`agent_session:ses<n>`: what a hit opens." }
    - { name: "title", type: "TEXT", doc: "`v_agent_session.display_name`." }
    - { name: "body", type: "TEXT", doc: "The harness, the titles of its thread's efforts that overlapped it, and what it touched: the distinct paths of its tool calls and the commands of its shell calls (up to 300 of each)." }
    - { name: "stream_id", type: "TEXT", doc: "Its thread's stream (`str1`)." }
    - { name: "version", type: "TEXT", doc: "The newer of the session's change and its last tool call." }
  tests:
    - { not_null: ref }
    - { unique: ref }
- name: search_commit
  version: 1
  description: "What site search indexes for each commit `v_commit` holds (the last 500 reachable from every stream's head): the `commit` kind's index is restated from these rows when they change."
  columns:
    - { name: "ref", type: "TEXT", doc: "`commit:<sha>`: what a hit opens." }
    - { name: "title", type: "TEXT", doc: "The subject." }
    - { name: "body", type: "TEXT", doc: "The message body, the author, and the paths it changed (up to 300)." }
    - { name: "stream_id", type: "TEXT", doc: "Always NULL: commits belong to the project." }
    - { name: "version", type: "TEXT", doc: "The sha: a commit never changes." }
  tests:
    - { not_null: ref }
    - { unique: ref }
- name: search_dashboard
  version: 1
  description: "What site search indexes for each dashboard: the `dashboard` kind's index is restated from these rows when they change."
  columns:
    - { name: "ref", type: "TEXT", doc: "`dashboard:dsh<n>`: what a hit opens." }
    - { name: "title", type: "TEXT", doc: "The dashboard's title." }
    - { name: "body", type: "TEXT", doc: "The text of its text tiles and the titles of its query tiles, a line each, in order." }
    - { name: "stream_id", type: "TEXT", doc: "Always NULL: dashboards belong to the project." }
    - { name: "version", type: "TEXT", doc: "The newer of the dashboard's change and its tiles'." }
  tests:
    - { not_null: ref }
    - { unique: ref }
- name: search_decision
  version: 1
  description: "What site search indexes for each decision: the `decision` kind's index is restated from these rows when they change. Decisions on archived threads are included."
  columns:
    - { name: "ref", type: "TEXT", doc: "`decision:<n>`: what a hit opens." }
    - { name: "title", type: "TEXT", doc: "The question." }
    - { name: "body", type: "TEXT", doc: "The choice, why, and the alternatives, a line each." }
    - { name: "stream_id", type: "TEXT", doc: "Its thread's stream (`str1`)." }
    - { name: "version", type: "TEXT", doc: "When it was made: a decision never changes." }
  tests:
    - { not_null: ref }
    - { unique: ref }
- name: search_effort
  version: 1
  description: "What site search indexes for each effort: the `effort` kind's index is restated from these rows when they change. Efforts on archived threads are included. Unversioned: an open effort's summary follows its turns, so its text is compared."
  columns:
    - { name: "ref", type: "TEXT", doc: "`effort:eff<n>`: what a hit opens." }
    - { name: "title", type: "TEXT", doc: "The effort's title." }
    - { name: "body", type: "TEXT", doc: "Its summary, then the work item it was on (the ref, so its id finds it)." }
    - { name: "stream_id", type: "TEXT", doc: "Its thread's stream (`str1`)." }
  tests:
    - { not_null: ref }
    - { unique: ref }
- name: search_lens
  version: 1
  description: "What site search indexes for each lens: the `lens` kind's index is restated from these rows when they change. Hidden lenses (the agent's typed tools) are included."
  columns:
    - { name: "ref", type: "TEXT", doc: "`lens:<extension>/<slug>`: what a hit opens." }
    - { name: "title", type: "TEXT", doc: "The lens's title." }
    - { name: "body", type: "TEXT", doc: "Its description." }
    - { name: "stream_id", type: "TEXT", doc: "Always NULL: lenses belong to the project." }
  tests:
    - { not_null: ref }
    - { unique: ref }
- name: search_thread
  version: 1
  description: "What site search indexes for each thread: the `thread` kind's index is restated from these rows when they change. Closed and archived threads are included."
  columns:
    - { name: "ref", type: "TEXT", doc: "`thread:thr<n>`: what a hit opens." }
    - { name: "title", type: "TEXT", doc: "The thread's title." }
    - { name: "body", type: "TEXT", doc: "Its efforts' titles and summaries, then its sessions' names." }
    - { name: "stream_id", type: "TEXT", doc: "Its stream (`str1`)." }
    - { name: "version", type: "TEXT", doc: "The newest of the thread's change, its efforts' starts and ends, its sessions' changes and its last turn." }
  tests:
    - { not_null: ref }
    - { unique: ref }
- name: search_turn
  version: 1
  description: "What site search indexes for each agent turn: the `turn` kind's index is restated from these rows when they change. Turns on archived threads are included."
  columns:
    - { name: "ref", type: "TEXT", doc: "`turn:trn<n>`: what a hit opens." }
    - { name: "title", type: "TEXT", doc: "The session's name and when the turn started." }
    - { name: "body", type: "TEXT", doc: "The prompt, then the answer." }
    - { name: "stream_id", type: "TEXT", doc: "Its thread's stream (`str1`)." }
    - { name: "version", type: "TEXT", doc: "When the turn ended, else when it started." }
  tests:
    - { not_null: ref }
    - { unique: ref }
- name: search_handoff
  version: 1
  description: "What site search indexes for each handoff: the `handoff` kind's index is restated from these rows when they change."
  columns:
    - { name: "ref", type: "TEXT", doc: "The handoff's canonical ref (`handoff:hnd<n>`): what a hit opens." }
    - { name: "title", type: "TEXT", doc: "Empty: a handoff has no title." }
    - { name: "body", type: "TEXT", doc: "The handoff's markdown." }
    - { name: "stream_id", type: "TEXT", doc: "Its recipient thread's stream (`str1`)." }
    - { name: "version", type: "TEXT", doc: "Changes whenever the row's text does; a recompute reads the text of rows whose version moved only (when it was sent; a body is not edited)." }
  tests:
    - { not_null: ref }
    - { unique: ref }
- name: search_thread_note
  version: 4
  description: "What site search indexes for each thread note: the `thread_note` kind's index is restated from these rows when they change."
  columns:
    - { name: "ref", type: "TEXT", doc: "The note's canonical ref (`thread_note:not<n>`): what a hit opens." }
    - { name: "title", type: "TEXT", doc: "Empty: a note has no title." }
    - { name: "body", type: "TEXT", doc: "The note's markdown." }
    - { name: "stream_id", type: "TEXT", doc: "Its thread's stream (`str1`)." }
    - { name: "version", type: "TEXT", doc: "Changes whenever the row's text does; a recompute reads the text of rows whose version moved only. (v4: when it was written; a note is not edited)" }
  tests:
    - { not_null: ref }
    - { unique: ref }
- name: search_work_item
  version: 2
  description: "What site search indexes for each of the active work list's items (the `work_item` kind's index is restated from these rows when they change), through the work-item interface. Deleted items, and items on archived threads or streams, aren't in it. v2: each item's comments follow its body."
  columns:
    - { name: "ref", type: "TEXT", doc: "The item's canonical ref (`work_item:<provider>:<id>`): what a hit opens." }
    - { name: "title", type: "TEXT", doc: "The item's title." }
    - { name: "body", type: "TEXT", doc: "Its own id (so typing `tsk42` finds it), then its body." }
    - { name: "stream_id", type: "TEXT", doc: "Its thread's stream (`str1`); NULL for a backlog item." }
  tests:
    - { not_null: ref }
    - { unique: ref }
- name: search_wiki
  version: 2
  description: "What site search indexes for each wiki page (tsk864): the `wiki` kind's index is restated from these rows when they change."
  columns:
    - { name: "ref", type: "TEXT", doc: "`wiki:<slug>`." }
    - { name: "title", type: "TEXT", doc: "The page's title." }
    - { name: "body", type: "TEXT", doc: "The page's full markdown." }
    - { name: "stream_id", type: "TEXT", doc: "Always NULL: wiki pages are project-global." }
    - { name: "version", type: "TEXT", doc: "Changes whenever the row's text does; a recompute reads the text of rows whose version moved only. (v2: the page's `updated_at`)" }
  tests:
    - { not_null: ref }
    - { unique: ref }
- name: usage_event
  version: 1
  description: "What the person used in oxplow, one row per use (a wiki page opened, a command run) — the telemetry behind the wiki's recent and most-used lists."
  columns:
    - { name: "id", type: "INTEGER", doc: "Use id." }
    - { name: "kind", type: "TEXT", doc: "What was used (`wiki`, …)." }
    - { name: "payload_json", type: "TEXT", doc: "What the renderer recorded about it (JSON; a `key` / `slug` / `path` / `id` names the thing)." }
    - { name: "occurred_at", type: "TEXT", doc: "RFC 3339 timestamp." }
  tests:
    - { not_null: id }
    - { unique: id }
- name: effect_run
  version: 2
  key: [effect, event_id, attempt]
  description: "Each attempt at an extension effect's reaction to an event: the live consumer makes one — ran (`ok`), `skipped`, left a `proposal` for a person, or `failed` — and a person's `effect.retry` of a failed one makes the next. A failed attempt whose every step was a write to a provider keeping `idempotent_writes` is sent again by itself, at most twice (`auto`; `retry_at` says when); any other waits for a person. A reaction's state is its latest attempt's (`latest = 1`)."
  columns:
    - { name: "id", type: "INTEGER", doc: "Attempt id." }
    - { name: "effect", type: "TEXT", doc: "The effect: `<extension>/<id>`." }
    - { name: "extension", type: "", doc: "The extension that declares it." }
    - { name: "event_id", type: "TEXT", doc: "The event it reacted to (`v_event.id`)." }
    - { name: "event_seq", type: "INTEGER", doc: "That event's log position." }
    - { name: "attempt", type: "INTEGER", doc: "Which attempt at the reaction, from 1." }
    - { name: "origin", type: "TEXT", doc: "What started the attempt: `live` (the event's delivery), `retry` (a person's `effect.retry`), `backfill` (a person's `effect.backfill`) or `auto` (sent again by itself)." }
    - { name: "latest", type: "", doc: "1 when it is the reaction's latest attempt: its state is where the reaction stands." }
    - { name: "state", type: "TEXT", doc: "`started` (a step outside oxplow is running), `ok`, `skipped`, `proposed` or `failed`." }
    - { name: "reason", type: "TEXT", doc: "Why it skipped or failed." }
    - { name: "audit_id", type: "INTEGER", doc: "Its run's `command_audit` row, when its commands ran." }
    - { name: "proposal_id", type: "INTEGER", doc: "The proposal it left, when a command asked a person." }
    - { name: "started_at", type: "TEXT", doc: "When it started (RFC 3339)." }
    - { name: "finished_at", type: "TEXT", doc: "When it ended; NULL while `started`." }
    - { name: "retry_at", type: "TEXT", doc: "A failed attempt sent again by itself at this time (RFC 3339); NULL when it waits for a person, or wasn't failed." }
    - { name: "run_id", type: "TEXT", doc: "The attempt's run (`v_extension_run.run_id`). (v2)" }
  tests:
    - { not_null: effect }
- name: extension_run
  version: 3
  key: [run_id]
  description: "Each finished run of extension code, one row each: which contribution at which version and catalog generation, who ran it and on whose behalf, what caused it and where it sat, how it ended, what it cost and which scopes it called. What an extension actually did, never what it read or wrote: no input, result, credential value or prompt is kept. Kept 90 days, like a collector's events."
  columns:
    - { name: "run_id", type: "TEXT", doc: "The run (a UUIDv7). `v_command_audit`-style records name it in their `run_id`." }
    - { name: "parent_run_id", type: "TEXT", doc: "The run it was nested in (a person's `oxplow.collector.sync`, an effect's composing script); NULL for a top-level run." }
    - { name: "extension", type: "TEXT", doc: "The extension it belongs to." }
    - { name: "contribution", type: "TEXT", doc: "The contribution's ref (`v_contribution.ref`): `command:oxplow.review.accept`, `job:effort-review/review`." }
    - { name: "kind", type: "TEXT", doc: "`collector`, `effect`, `command`, `implementation`, …" }
    - { name: "version", type: "TEXT", doc: "The extension's declared `version:` when it ran; NULL when it declares none." }
    - { name: "generation", type: "TEXT", doc: "The extension catalog's generation it ran against (`v_*` query results name theirs the same way); NULL for a run that holds none — a collector's, an effect's or a job's belongs to its extension's version. (v2)" }
    - { name: "actor_kind", type: "TEXT", doc: "`human`, `agent`, `lens`, `system` or `effect`." }
    - { name: "actor", type: "TEXT", doc: "Who, as an event source: `human`, `agent:thr3`, `system`, `effect:<ext>/<id>`, `effect:effort_policy:<id>`." }
    - { name: "stream_id", type: "INTEGER", doc: "The stream it ran for; NULL when none." }
    - { name: "thread_id", type: "INTEGER", doc: "The thread it ran for; NULL when none." }
    - { name: "effort_id", type: "INTEGER", doc: "The effort it ran for; NULL when none." }
    - { name: "turn_id", type: "INTEGER", doc: "The agent turn it ran for; NULL when none." }
    - { name: "agent_session_id", type: "INTEGER", doc: "The agent session it ran for; NULL when none." }
    - { name: "snapshot_id", type: "INTEGER", doc: "The snapshot it ran over; NULL when none." }
    - { name: "cause_event_id", type: "TEXT", doc: "The event that caused it (`v_event.id`); NULL for a run a person or schedule started." }
    - { name: "mode", type: "TEXT", doc: "`pure` (no I/O but scope reads), `transactional` or `external` (may call out)." }
    - { name: "started_at", type: "TEXT", doc: "When it began (RFC 3339)." }
    - { name: "finished_at", type: "TEXT", doc: "When it ended (RFC 3339)." }
    - { name: "outcome", type: "TEXT", doc: "`ok`, `skipped`, `failed`, `denied` (its grant refused something), or `cancelled` (stopped: a person's cancel, or its approval or extension revoked, disabled or changed under it). (v3)" }
    - { name: "error", type: "TEXT", doc: "Why it failed, was denied or stopped." }
    - { name: "wall_ms", type: "INTEGER", doc: "How long it ran." }
    - { name: "cpu_ms", type: "INTEGER", doc: "Its scripts' CPU time, summed (0 for a run that ran no script)." }
    - { name: "peak_bytes", type: "INTEGER", doc: "The most any one of its scripts held live at once." }
    - { name: "ai_calls", type: "INTEGER", doc: "The model calls it made." }
    - { name: "scopes", type: "TEXT", doc: "The scopes it called, counted, as JSON (`{\"sql.read\": 2}`)." }
    - { name: "decisions", type: "TEXT", doc: "What its grant decided for what it asked, as a JSON array of `{ need, decision, reason? }` (`allowed`, `denied`, `unenforced`)." }
    - { name: "latest", type: "", doc: "1 on its contribution's most recent run." }
  tests:
    - { not_null: run_id }
    - { unique: run_id }
- name: job_run
  version: 3
  key: [id]
  description: "Each job run: one execution of a job an extension declares (a `jobs:` declaration, run through its `jobs.write/enqueue` command) — which job, its state and its current attempt, and what that attempt has used so far. A job is the declaration (`job:<extension>/<id>`); a job run is one execution of it (`job_run:<id>`). What it was asked and what it answered stay private to the extension (`jobs.read/snapshot`); what it streams is in `v_job_run_output`."
  columns:
    - { name: "id", type: "TEXT", doc: "The run's id (a UUIDv7)." }
    - { name: "job", type: "TEXT", doc: "The job it runs: `job:<extension>/<id>` (`v_contribution.ref`)." }
    - { name: "intent_key", type: "TEXT", doc: "What it is about: the `intentKey` it was started with, one run per key and job (`review:effort:eff12`). (v2)" }
    - { name: "extension", type: "TEXT", doc: "The extension it belongs to." }
    - { name: "version", type: "TEXT", doc: "The extension's declared `version:` when it was started; NULL when it declares none." }
    - { name: "contract_version", type: "INTEGER", doc: "The job declaration's own `version:`." }
    - { name: "operation", type: "TEXT", doc: "What it runs: `ai.complete_typed`." }
    - { name: "state", type: "TEXT", doc: "`queued`, `running`, `succeeded`, `failed`, `cancelled` or `interrupted` (it stopped without a known end: oxplow restarted, or it lost its lease)." }
    - { name: "attempt", type: "INTEGER", doc: "Its current attempt, 0 before the first starts." }
    - { name: "cancellation_requested", type: "INT", doc: "1 once someone asked it to stop." }
    - { name: "invoker", type: "TEXT", doc: "Who started it, as an event source: `human`, `agent:thr3`, `effect:<ext>/<id>`, …" }
    - { name: "run_id", type: "TEXT", doc: "The run that started it (`v_extension_run.run_id`)." }
    - { name: "created_at", type: "TEXT", doc: "When it was started (RFC 3339)." }
    - { name: "updated_at", type: "TEXT", doc: "When its state last changed (RFC 3339)." }
    - { name: "ai_calls", type: "INT", doc: "Model rounds its current attempt has finished." }
    - { name: "tool_calls", type: "INT", doc: "Tools the model called in its current attempt." }
    - { name: "input_tokens", type: "INT", doc: "Input tokens its current attempt's rounds reported (observed usage only)." }
    - { name: "output_tokens", type: "INT", doc: "Output tokens likewise." }
    - { name: "ref", type: "TEXT", doc: "`job_run:<id>`: its ref — what `jobs.read/snapshot`, `jobs.write/cancel` and `oxplow.job_run.cancel` take. (v3)" }
  tests:
    - { not_null: id }
    - { unique: id }
- name: job_run_output
  version: 1
  key: [job_id, attempt, seq]
  description: "What a job produced as it ran, in order: the model's reply text as it streamed (one row per short run of it), each tool the model called and what the tool answered, each model round's usage. Written while the attempt runs, so a lens over it follows a job live."
  columns:
    - { name: "job_id", type: "TEXT", doc: "The job (`v_job_run.id`)." }
    - { name: "attempt", type: "INTEGER", doc: "Its attempt." }
    - { name: "seq", type: "INTEGER", doc: "Order within the attempt, from 1." }
    - { name: "kind", type: "TEXT", doc: "`text`, `tool_call`, `tool_result` or `usage`." }
    - { name: "at", type: "TEXT", doc: "When it was written (RFC 3339)." }
    - { name: "text", type: "TEXT", doc: "A `text` row's text; NULL for the rest." }
    - { name: "data", type: "TEXT", doc: "The row as JSON: `{ text }`, a tool call `{ id, name, arguments }`, a tool result `{ callId, result }` or `{ callId, error }`, usage `{ inputTokens, outputTokens, source, aiCallId }`." }
  tests:
    - { not_null: job_id }
    - { relationships: { column: job_id, to: job_run, field: id } }
- name: job_run_observation
  version: 1
  key: [id]
  description: "What a job's worker said after its attempt was no longer the job's: a result that arrived once the lease had been recovered, the approval revoked or the declaration changed. It never changes the job (that ended as recovery, cancel or revocation decided); it is kept as evidence, one row per late result."
  columns:
    - { name: "id", type: "TEXT", doc: "The observation's id." }
    - { name: "job_id", type: "TEXT", doc: "The job (`v_job_run.id`)." }
    - { name: "attempt", type: "INTEGER", doc: "The attempt the worker was running." }
    - { name: "fence", type: "INTEGER", doc: "That attempt's fence." }
    - { name: "at", type: "TEXT", doc: "When the late result was seen (RFC 3339)." }
    - { name: "outcome", type: "TEXT", doc: "`succeeded` or `failed`: how the worker ended." }
    - { name: "evidence", type: "TEXT", doc: "What the worker returned, as JSON; NULL when none was kept." }
  tests:
    - { not_null: id }
    - { unique: id }
    - { relationships: { column: job_id, to: job_run, field: id } }
- name: event_type
  version: 1
  key: [event_type, v]
  description: "Every event type the log has accepted, at each version: core types and those extensions declare (`event_types:`). An extension's removed types stay listed, unregistered, and their logged rows stay readable."
  columns:
    - { name: "event_type", type: "TEXT", doc: "`namespace.name`; an extension's namespace is its name with `-` read as `_`." }
    - { name: "v", type: "INTEGER", doc: "The schema version." }
    - { name: "extension", type: "TEXT", doc: "The extension that declares it; NULL for a core type." }
    - { name: "summary", type: "TEXT", doc: "What it records, as its extension declares; NULL for a core type." }
    - { name: "registered", type: "INTEGER", doc: "1 while the running vocabulary has it (it can be appended); 0 once its extension is gone, or while its extension's declaration of it is refused (a schema changed at a recorded version, a namespace collision)." }
    - { name: "latest", type: "", doc: "1 for the newest registered version of its type: what consumers read rows at." }
    - { name: "schema_json", type: "TEXT", doc: "The payload's JSON Schema, as first registered: a declared type's schema at a recorded version never changes." }
    - { name: "recorded_at", type: "TEXT", doc: "When it was first registered (RFC 3339)." }
  tests:
    - { not_null: event_type }
- name: replaceable
  version: 1
  key: [target]
  description: "The core sub-components an extension may replace with a lens (`ui.replacements`), each with its versioned props contract: what the replacement is given, and must declare, instead of any host state. Which extension replaces one is the person's choice (`replacements:` in the project config) or, for a bound target, its provider's."
  columns:
    - { name: "target", type: "TEXT", doc: "The sub-component: `work_item.board`, `work_item.list`, `work_item.detail`, `work_item.detail.state`, `vcs.history.graph`." }
    - { name: "capability", type: "TEXT", doc: "The capability it belongs to (`work_items`, `vcs`)." }
    - { name: "bound", type: "INTEGER", doc: "1 when only the extension of the capability's deciding provider may replace it (the item's own provider's states); 0 when any extension may, and the person chooses." }
    - { name: "version", type: "INTEGER", doc: "The contract's version; a declaration may pin it (`version:`)." }
    - { name: "props", type: "TEXT", doc: "JSON array of the prop names the replacement lens is given and must declare as `params`." }
    - { name: "label", type: "TEXT", doc: "What a person calls it (\"board\", \"detail editor\")." }
  tests:
    - { not_null: target }
    - { unique: target }
- name: ref_kind
  version: 3
  key: [kind]
  description: "Every kind of ref the running vocabulary knows, core's and those extensions declare (`ref_kinds:`), each with what its declarer says of it: the model that holds one, where one opens, and what search indexes it from. A removed extension's kinds leave with it."
  columns:
    - { name: "kind", type: "TEXT", doc: "The kind (`work_item`, `acme_pr`)." }
    - { name: "extension", type: "TEXT", doc: "The extension that declares it; NULL for a core kind." }
    - { name: "label", type: "TEXT", doc: "What one is called (`Pull request`); NULL for a core kind." }
    - { name: "id_pattern", type: "TEXT", doc: "The regex its ids match." }
    - { name: "revisioned", type: "INTEGER", doc: "1 when a ref to one may carry `@rev`." }
    - { name: "wikilinks", type: "TEXT", doc: "JSON array of its `[[prefix:…]]` sugar (`git` for `commit`)." }
    - { name: "resolve", type: "TEXT", doc: "The view holding one, by its `ref` column (an extension's has a `title`); NULL for a kind no model holds (a file, a page). (v3: core kinds too)" }
    - { name: "page", type: "TEXT", doc: "Where one opens, a tab-id template: `{ref}` is the ref itself, `{<column>}` a column of its `resolve` row, `{a|b}` the first of them that isn't empty (`{ref}`; `{thread_ref}` for a thread note; `page:acme/pr?ref={ref}` for an extension's kind). NULL for a kind with no page. (v3: a template, core kinds too)" }
    - { name: "icon", type: "TEXT", doc: "Its icon's name (one of `REF_KIND_ICONS`); NULL for a core kind." }
    - { name: "searchable", type: "TEXT", doc: "The view whose rows (`ref`, `title`, `body`, `stream_id`, optional `version`) site search indexes under the kind; NULL for a kind that isn't searched. (v3: core kinds too)" }
  tests:
    - { not_null: kind }
- name: contribution_health
  version: 3
  description: "Each extension contribution's health on this machine: a provider instance, a collector or an effect, under one failure policy — three failures in a row disable it until a person runs `oxplow.contribution.enable`."
  columns:
    - { name: "ref", type: "TEXT", doc: "The contribution's ref (`effect:tracker/fake`): the same as its `v_contribution.ref`." }
    - { name: "extension", type: "TEXT", doc: "The extension it belongs to." }
    - { name: "contribution", type: "TEXT", doc: "The provider's, collector's or effect's id within it." }
    - { name: "kind", type: "TEXT", doc: "`provider`, `collector` or `effect`." }
    - { name: "state", type: "TEXT", doc: "`ok`, `failing` or `disabled`." }
    - { name: "reason", type: "TEXT", doc: "Why it's disabled." }
    - { name: "consecutive_failures", type: "INTEGER", doc: "Failures since its last success." }
    - { name: "last_ok_at", type: "TEXT", doc: "When it last succeeded (RFC 3339)." }
    - { name: "last_error", type: "TEXT", doc: "Its last failure." }
    - { name: "mean_ms", type: "REAL", doc: "A moving average of its successful runs or calls, in milliseconds." }
    - { name: "next_due_at", type: "TEXT", doc: "When it should next run (a schedule's next slot), if it runs on one." }
    - { name: "updated_at", type: "TEXT", doc: "When this row last changed." }
    - { name: "dead_letters", type: "", doc: "Events it couldn't handle and that wait for a person: dead letters of its consumer (its `ref`) or of events whose subject names it (its `ref`)." }
    - { name: "fresh", type: "", doc: "1 unless a scheduled run is overdue (`next_due_at` has passed) or a collector's last run failed (`state` isn't `ok`): its data is then the last good run's, not current. (v3)" }
    - { name: "repair_item", type: "TEXT", doc: "The open repair work item for it — the one whose title starts `Repair <extension> <contribution>:`, filed by the bundled repair effect; NULL when none is open." }
  tests:
    - { not_null: extension }
- name: snapshot
  version: 2
  description: "Snapshots: point-in-time captures of a stream's worktree, used to bracket efforts and diffs."
  columns:
    - { name: "id", type: "INTEGER", doc: "Snapshot id." }
    - { name: "stream_id", type: "INTEGER", doc: "Stream captured." }
    - { name: "created_at", type: "TEXT", doc: "RFC 3339 timestamp." }
    - { name: "revision", type: "TEXT", doc: "The VCS revision the captured tree equals (`git:<sha>`): set when the workspace was clean at the head; NULL otherwise." }
    - { name: "branch", type: "TEXT", doc: "Branch when captured, if known." }
    - { name: "tree_hash", type: "TEXT", doc: "Whole-tree identity: two snapshots with the same tree_hash hold the same files. NULL before V96." }
    - { name: "ref", type: "TEXT", doc: "`snapshot:<id>`: its ref, the one place SQL spells it — select and join on this, never rebuild it. (v2)" }
  tests:
    - { not_null: id }
    - { unique: id }
- name: snapshot_file
  version: 1
  description: "Every captured version of a file. A snapshot records only the files that changed since the stream's previous one, so a file's history is its rows by `captured_at`, and what a snapshot changed is its rows."
  columns:
    - { name: "id", type: "INTEGER", doc: "The captured file's id (a `file_snapshot` id, as `get_file_snapshot` takes)." }
    - { name: "snapshot_id", type: "INTEGER", doc: "The snapshot that captured it (v_snapshot.id)." }
    - { name: "stream_id", type: "INTEGER", doc: "The stream whose worktree it was captured in." }
    - { name: "path", type: "TEXT", doc: "Repo-relative file path." }
    - { name: "storage", type: "TEXT", doc: "`oxplow` (bytes in oxplow's blob store), `git` (a clean file, read from git), `oversize` (too large to keep) or `deleted` (the file was removed)." }
    - { name: "size_bytes", type: "INTEGER", doc: "Its size in bytes." }
    - { name: "content_hash", type: "TEXT", doc: "The identity of its bytes: two rows with the same hash hold the same content. NULL when oversize or deleted, and for a `git` row not yet compared." }
    - { name: "captured_at", type: "TEXT", doc: "When it was captured (RFC 3339)." }
  tests:
    - { not_null: id }
    - { unique: id }
    - { not_null: path }
- name: snapshot_op
  version: 4
  description: "The snapshot operation log: one row per take (why it ran, what it is anchored to, the snapshot it left the worktree at and its parent). A take that changed nothing points at its parent."
  columns:
    - { name: "seq", type: "INTEGER", doc: "Operation order within the project." }
    - { name: "stream_id", type: "INTEGER", doc: "Stream (worktree) the take ran on." }
    - { name: "snapshot_id", type: "INTEGER", doc: "Snapshot the worktree is at after the take (v_snapshot.id)." }
    - { name: "parent_snapshot_id", type: "INTEGER", doc: "Snapshot the worktree was at just before this take; parent → snapshot is what THIS take recorded (for a turn's changes use v_agent_turn.start_snapshot_id → snapshot_id)." }
    - { name: "trigger", type: "TEXT", doc: "Why: turn_end, quiet, effort_start, effort_end, startup, manual, git_refs, head_moved, run_measured (a run's reports were recorded: the code it measured)." }
    - { name: "thread_id", type: "INTEGER", doc: "Thread the take belongs to, if any." }
    - { name: "turn_id", type: "INTEGER", doc: "Agent turn the take belongs to, if any (v_agent_turn.id)." }
    - { name: "effort_id", type: "INTEGER", doc: "Effort the take belongs to, if any (v_effort.id)." }
    - { name: "at", type: "TEXT", doc: "RFC 3339 timestamp." }
    - { name: "elapsed_ms", type: "INTEGER", doc: "How long the take took." }
    - { name: "budget_ms", type: "INTEGER", doc: "The caller's time budget, if it had one." }
    - { name: "over_budget", type: "INTEGER", doc: "1 when elapsed_ms exceeded budget_ms." }
    - { name: "file_count", type: "INTEGER", doc: "File rows recorded (0 when nothing changed)." }
    - { name: "provider", type: "TEXT", doc: "The snapshot implementation that took it (`oxplow`, `hashes`, …); NULL for takes recorded before it was kept. (v2)" }
    - { name: "contents", type: "INTEGER", doc: "1 when the take kept file contents; 0 when it recorded identities only ('Track changes only'): a read of that snapshot answers 'no contents', not 'expired'. (v2)" }
    - { name: "handle", type: "TEXT", doc: "A snapshot provider's own name for the state the take marked, which core hands back to it as the next mark's parent; NULL for takes by oxplow's own capture. (v3)" }
- name: stream
  version: 3
  description: "Streams: parallel lines of work, each its own git worktree. Exactly one is `primary` (the repo itself)."
  columns:
    - { name: "id", type: "INTEGER", doc: "Stream id." }
    - { name: "kind", type: "TEXT", doc: "`primary` (the repo) or `worktree`." }
    - { name: "title", type: "TEXT", doc: "Display name." }
    - { name: "branch", type: "TEXT", doc: "Git branch currently checked out in the worktree." }
    - { name: "worktree_path", type: "TEXT", doc: "Absolute path of the stream's worktree." }
    - { name: "created_at", type: "TEXT", doc: "RFC 3339 timestamp." }
    - { name: "updated_at", type: "TEXT", doc: "RFC 3339 timestamp." }
    - { name: "archived_at", type: "TEXT", doc: "Set when the stream was archived; NULL while live." }
    - { name: "ref", type: "TEXT", doc: "`stream:str<id>`: its ref, the one place SQL spells it — select and join on this, never rebuild it. (v2)" }
    - { name: "prompt", type: "TEXT", doc: "The standing instructions the person set for every agent session in this stream (appended to its system prompt); NULL when none. (v3)" }
  tests:
    - { not_null: id }
    - { unique: id }
- name: subagent
  version: 1
  description: "Subagents of an agent session: who in a session acted, from the `agent.subagent.started` / `.finished` events that bracket one and the tool calls that name it. A subagent is not a session; it has no process oxplow knows. Claude Code brackets its subagents, so they are `running` or `finished`; Codex and opencode children appear only in tool calls, so they are `unknown` (calls but no bracket)."
  columns:
    - { name: "id", type: "TEXT", doc: "The harness's id for it, or the id of the call that started it." }
    - { name: "kind", type: "TEXT", doc: "What kind of subagent the harness says it is (Claude's `agent_type`); NULL when it says nothing." }
    - { name: "agent_session_id", type: "INTEGER", doc: "The session it acted in (v_agent_session.id)." }
    - { name: "thread_id", type: "INTEGER", doc: "The session's thread." }
    - { name: "turn_id", type: "", doc: "The turn it started in, else the turn of its first call; NULL when neither says." }
    - { name: "started_at", type: "TEXT", doc: "When its `agent.subagent.started` was logged; NULL for an `unknown` one." }
    - { name: "finished_at", type: "TEXT", doc: "When it stopped or handed its report back; NULL while running or unknown." }
    - { name: "calls", type: "", doc: "Tool calls made as it (v_tool_call.subagent_id)." }
    - { name: "last_activity_at", type: "TEXT", doc: "The newest of its start, its calls and its finish." }
    - { name: "state", type: "TEXT", doc: "`running` (started, not finished), `finished`, or `unknown` (only tool calls name it)." }
    - { name: "finished_event_id", type: "TEXT", doc: "The event that finished it; its `result` body is the subagent's last message, read as `subagent:<id>#result`." }
    - { name: "session_ref", type: "TEXT", doc: "Its session's ref (`agent_session:ses3`): where it opens." }
    - { name: "ref", type: "TEXT", doc: "`subagent:ses<n>/<id>`: its ref, the one place SQL spells it — select and join on this." }
  tests:
    - { not_null: ref }
    - { unique: ref }
- name: symbol
  version: 2
  description: "What each stream's files define — functions, methods, types, fields, constants, modules — as oxplow's own tree-sitter extraction reads them (every supported language, no language server needed): the current tree, restated per changed file at each snapshot. `v_symbol_capture` says what each snapshot's collection covered."
  columns:
    - { name: "ref", type: "TEXT", doc: "`symbol:<path>/<id>`, the current symbol (no revision; pin one with `@snap:<id>` / `@git:<sha>`). The id is the containers and the name joined by `::` (`Parser::parse`, `<Parser as Display>::fmt`), the parameter types in languages that overload by them (`Parser::parse(String,int)`), and `~n` for the nth same id in a file (`main~2`). Unique per stream." }
    - { name: "snapshot_id", type: "INTEGER", doc: "The snapshot the file's symbols were read at." }
    - { name: "stream_id", type: "INTEGER", doc: "The stream (v_stream.id)." }
    - { name: "path", type: "TEXT", doc: "Workspace-relative file." }
    - { name: "name", type: "TEXT", doc: "The symbol's own name." }
    - { name: "kind", type: "TEXT", doc: "`function`, `method`, `constructor`, `class`, `struct`, `enum`, `enum_member`, `interface`, `trait`, `type`, `field`, `constant`, `variable`, `module`, `namespace` or `macro` — one vocabulary for every language." }
    - { name: "container", type: "TEXT", doc: "What it's inside, `::`-joined (`Parser`, `acme::Parser`); NULL at top level." }
    - { name: "signature", type: "TEXT", doc: "Its parameter types (or dispatch value) as written, without parentheses, in languages that tell overloads apart by them; NULL otherwise." }
    - { name: "language", type: "TEXT", doc: "Its language (`rust`, `typescript`, …)." }
    - { name: "line", type: "INTEGER", doc: "Where its name is (what to jump to), 1-based." }
    - { name: "col", type: "INTEGER", doc: "1-based." }
    - { name: "start_line", type: "INTEGER", doc: "Where the whole definition starts, 1-based." }
    - { name: "start_col", type: "INTEGER", doc: "1-based." }
    - { name: "end_line", type: "INTEGER", doc: "Where the whole definition ends (its body included), 1-based: the lines `start_line`..`end_line` are the symbol." }
    - { name: "end_col", type: "INTEGER", doc: "1-based, exclusive." }
  tests:
    - { not_null: ref }
    - { not_null: name }
    - { sql: "SELECT 1 FROM v_symbol GROUP BY stream_id, ref HAVING count(*) > 1" }
- name: symbol_capture
  version: 2
  description: "One row per snapshot the symbol collector handled: how many changed files it read definitions from, and how many it couldn't read."
  columns:
    - { name: "snapshot_id", type: "INTEGER", doc: "The snapshot (v_snapshot.id)." }
    - { name: "stream_id", type: "INTEGER", doc: "The stream (v_stream.id)." }
    - { name: "files_collected", type: "INTEGER", doc: "Changed files in a supported language whose definitions were read." }
    - { name: "files_failed", type: "INTEGER", doc: "Changed files whose content couldn't be read at the snapshot (not kept, or not text)." }
    - { name: "captured_at", type: "TEXT", doc: "RFC 3339 timestamp." }
  tests:
    - { not_null: snapshot_id }
    - { unique: snapshot_id }
- name: tag
  version: 1
  description: "Tags, refreshed with the branches on boot and whenever refs move."
  columns:
    - { name: "name", type: "TEXT", doc: "Tag name." }
    - { name: "sha", type: "TEXT", doc: "The commit it points at (v_commit.sha); annotated tags peeled." }
    - { name: "updated_at", type: "TEXT", doc: "When oxplow last read it (RFC 3339)." }
- name: test_case
  version: 2
  description: "Each test case in a run that produced a report (runs with only counts have none)."
  columns:
    - { name: "run_id", type: "INTEGER", doc: "The run (v_test_run.id)." }
    - { name: "suite", type: "", doc: "Report suite name." }
    - { name: "classname", type: "", doc: "Grouping path (module path, file·class, describe path)." }
    - { name: "name", type: "", doc: "Test name." }
    - { name: "status", type: "", doc: "`passed`, `failed` or `skipped`." }
    - { name: "time_ms", type: "", doc: "Its duration, when the report gave one." }
    - { name: "message", type: "", doc: "What a failed case's report said went wrong: its failure message, then its body (the assertion and where it happened). NULL for a case that didn't fail, one whose report said nothing, and a failure past the per-run cap (64 KB of messages per run, 4 KB each, a cut one ending in `…`)." }
- name: test_run
  version: 2
  description: "Every test run oxplow saw (hook-observed or reported by an agent), with its counts."
  columns:
    - { name: "id", type: "INTEGER", doc: "Run id; `run:<id>` is how claims and decisions cite it." }
    - { name: "stream_id", type: "INTEGER", doc: "Stream it ran in (v_stream.id)." }
    - { name: "thread_id", type: "INTEGER", doc: "Thread whose agent ran it, if known." }
    - { name: "effort_id", type: "INTEGER", doc: "Effort it belongs to: the one the tool call that ran it was in (or the thread's open one)." }
    - { name: "command", type: "", doc: "The command that was run." }
    - { name: "exit_code", type: "", doc: "Its exit code, if known." }
    - { name: "passed", type: "", doc: "Tests passed (NULL when not reported)." }
    - { name: "failed", type: "", doc: "Tests failed (NULL when not reported)." }
    - { name: "skipped", type: "", doc: "Tests skipped (NULL when not reported)." }
    - { name: "total", type: "", doc: "Tests run in total (NULL when not reported)." }
    - { name: "duration_ms", type: "", doc: "Wall-clock duration, if known." }
    - { name: "provenance", type: "TEXT", doc: "`observed` (oxplow parsed a report) or `asserted` (an agent reported counts)." }
    - { name: "source", type: "TEXT", doc: "What recorded it (`hook`, `mcp`, …)." }
    - { name: "branch", type: "TEXT", doc: "Branch checked out when it ran." }
    - { name: "closest_vcs_rev", type: "TEXT", doc: "The VCS revision (a git sha) the tested tree was at or nearest to." }
    - { name: "captured_at", type: "TEXT", doc: "When it was recorded (RFC 3339)." }
    - { name: "turn_id", type: "INTEGER", doc: "The agent turn it ran in (v_agent_turn.id), if it ran in one." }
- name: thread
  version: 5
  description: "Threads: independent lines of the person's work inside a stream. A thread needs no agent and may have several: its agent sessions are v_agent_session rows."
  columns:
    - { name: "id", type: "INTEGER", doc: "Thread id." }
    - { name: "stream_id", type: "INTEGER", doc: "Owning stream (v_stream.id)." }
    - { name: "title", type: "TEXT", doc: "Display name." }
    - { name: "sort_index", type: "INTEGER", doc: "Order within the stream." }
    - { name: "created_at", type: "TEXT", doc: "RFC 3339 timestamp." }
    - { name: "updated_at", type: "TEXT", doc: "RFC 3339 timestamp." }
    - { name: "closed_at", type: "TEXT", doc: "Set when the thread was closed; NULL while it is open. Open or closed is all a thread's state is (v4: `status` is gone)." }
    - { name: "archived_at", type: "TEXT", doc: "Set when the thread was archived." }
    - { name: "ref", type: "TEXT", doc: "`thread:thr<id>`: its ref, the one place SQL spells it — select and join on this, never rebuild it. (v3)" }
    - { name: "mark", type: "TEXT", doc: "The person's colour for its tab — `amber`, `red`, `green`, `blue` or `violet` — or NULL when unmarked. It changes nothing else. (v4)" }
    - { name: "prompt", type: "TEXT", doc: "The standing instructions the person set for this thread's agent sessions (appended to its system prompt, after the stream's); NULL when none. (v5)" }
  tests:
    - { not_null: id }
    - { unique: id }
- name: agent_session
  version: 7
  description: "Agent sessions: the agent slots a person opened on a thread — a terminal agent, or a one-shot action. The row is the slot, not the process: a harness process ending leaves it open; closing the session, its thread or its stream's archive closes it."
  columns:
    - { name: "id", type: "INTEGER", doc: "Session id (its ref is `agent_session:ses<id>`)." }
    - { name: "thread_id", type: "INTEGER", doc: "The thread it's on (v_thread.id)." }
    - { name: "kind", type: "TEXT", doc: "`terminal` (a harness in a PTY) or `action` (a one-shot session). (v7: `chat` is gone.)" }
    - { name: "harness", type: "TEXT", doc: "What runs in it: `claude`, `codex`, `opencode`, or a harness an extension declares." }
    - { name: "title", type: "TEXT", doc: "What the person called it; empty until renamed." }
    - { name: "resume_session_id", type: "TEXT", doc: "The harness's own session id, to resume it; empty when unknown." }
    - { name: "host", type: "TEXT", doc: "The host it runs on; NULL is the local machine." }
    - { name: "opened_at", type: "TEXT", doc: "RFC 3339 timestamp." }
    - { name: "closed_at", type: "TEXT", doc: "When its slot was closed; NULL while open." }
    - { name: "closed_reason", type: "TEXT", doc: "`closed` (closed itself), `thread_closed` or `stream_archived`; NULL while open." }
    - { name: "updated_at", type: "TEXT", doc: "RFC 3339 timestamp." }
    - { name: "pid", type: "INTEGER", doc: "OS pid of the process the daemon spawned for it, rewritten on every spawn; NULL for a session with no process of its own (a chat) or not yet spawned. May be dead or reused: read it with last_seen_at. (v2)" }
    - { name: "last_seen_at", type: "TEXT", doc: "The newest hook seen from it, to the 30 s (RFC 3339); NULL before the first. A live agent has a recent one and a pid that exists. (v2)" }
    - { name: "stopped_by_user_at", type: "TEXT", doc: "When the person deliberately stopped it; NULL once started again, and after a crash or backend restart (which resume when the tab is shown). A stopped session is not spawned until a person starts it. (v3)" }
    - { name: "ref", type: "TEXT", doc: "`agent_session:ses<id>`: its ref, the one place SQL spells it — select and join on this, never rebuild it. (v4)" }
    - { name: "native_title", type: "TEXT", doc: "The name its harness gives the conversation it is bound to (Claude's `/rename`, a generated title); empty when it gave none, and cleared when the slot moves to another conversation. (v6)" }
    - { name: "fork_next", type: "INTEGER", doc: "1 when its next launch forks the conversation it is bound to instead of resuming it. (v6)" }
    - { name: "display_name", type: "TEXT", doc: "What a person calls it: its `title`, else its `native_title`, else the harness and the day it was opened. The one place a session is named. (v5; v6: the native title)" }
    - { name: "bound_origin", type: "TEXT", doc: "How it came to its current conversation (v_agent_session_binding.origin); NULL when it is bound to none. (v6)" }
  tests:
    - { not_null: id }
    - { unique: id }
    - { relationships: { column: thread_id, to: thread, field: id } }
- name: asset
  version: 1
  description: "Each asset's last recompute: derived data computed from tables — the metric cube, a materialized model — recomputed when a commit touches one of its inputs, or on its clock; and its last failure, until one succeeds."
  columns:
    - { name: "asset", type: "TEXT", doc: "The asset: `metric_cube`, or a materialized model's view (`v_<name>`)." }
    - { name: "computed_at", type: "TEXT", doc: "When it was last recomputed (RFC 3339)." }
    - { name: "events_to", type: "INTEGER", doc: "The event log's highest seq when that recompute began: what its inputs had seen." }
    - { name: "snapshot_id", type: "INTEGER", doc: "The snapshot it was computed against, when it has one." }
    - { name: "elapsed_ms", type: "INTEGER", doc: "How long the recompute took." }
    - { name: "mode", type: "TEXT", doc: "For a materialized model: `full` (refilled whole) or `incremental` (rows past its watermark appended); NULL otherwise." }
    - { name: "watermark", type: "INTEGER", doc: "For an incremental model: the highest watermark value it holds." }
    - { name: "row_count", type: "INTEGER", doc: "For a materialized model: how many rows it holds." }
    - { name: "failed_at", type: "TEXT", doc: "When its last recompute failed, while no later one has succeeded (RFC 3339); NULL otherwise. Its rows are the last good ones." }
    - { name: "error", type: "TEXT", doc: "Why that recompute failed (a materialized model's SELECT emitting one key twice, a query error)." }
  tests:
    - { not_null: asset }
    - { unique: asset }
- name: test_case_stat
  version: 1
  description: "Each test's summary per stream, branch and producer (tsk733): what it is doing now and how it has behaved — flaky (flips), recently broken (last_failed_at), slow (max_ms, mean_ms). Updated with every test run; a run records per-case facts only where they change something, so this is where per-test history lives."
  columns:
    - { name: "stream_id", type: "INTEGER", doc: "Stream it ran in (v_stream.id)." }
    - { name: "branch", type: "TEXT", doc: "Branch checked out when it ran; empty when unknown." }
    - { name: "producer", type: "TEXT", doc: "What recorded the runs (`tests`)." }
    - { name: "subject", type: "TEXT", doc: "The test: `test:<classname>::<name>`." }
    - { name: "last_status", type: "TEXT", doc: "`passed`, `failed` or `skipped` in its latest run." }
    - { name: "last_ms", type: "REAL", doc: "Its duration in its latest timed run, in milliseconds." }
    - { name: "max_ms", type: "REAL", doc: "Its longest duration in any run." }
    - { name: "mean_ms", type: "", doc: "Its mean duration across its timed runs." }
    - { name: "runs", type: "INTEGER", doc: "Runs it was part of." }
    - { name: "failures", type: "INTEGER", doc: "Runs it failed in." }
    - { name: "flips", type: "INTEGER", doc: "Times its status changed from one run to the next: how flaky it is." }
    - { name: "first_seen_at", type: "TEXT", doc: "Its first run here (RFC 3339)." }
    - { name: "last_seen_at", type: "TEXT", doc: "Its latest run here (RFC 3339)." }
    - { name: "last_failed_at", type: "TEXT", doc: "When it last failed; NULL if never." }
    - { name: "last_passed_at", type: "TEXT", doc: "When it last passed; NULL if never." }
    - { name: "last_run_id", type: "INTEGER", doc: "Its latest run (v_test_run.id)." }
  tests:
    - { not_null: subject }
    - { relationships: { column: stream_id, to: stream, field: id } }
- name: collector_run
  version: 3
  description: "Each collector's last run: its outcome, the row counts it wrote and its checkpoint. A collector is owned by an extension, the project (`project`) or oxplow (`built-in`)."
  columns:
    - { name: "owner", type: "TEXT", doc: "The extension that declares it, `project` for `.oxplow/project.yaml`, or `built-in`." }
    - { name: "id", type: "TEXT", doc: "The collector's id within its owner (may be dotted: `repo.scan_clone`)." }
    - { name: "status", type: "TEXT", doc: "`ok`, `error`, `needs_approval` (an exec collector a person hasn't approved), or `skipped` (the loop guard refused its run for an event; `error` says why)." }
    - { name: "last_run_at", type: "TEXT", doc: "When it last ran (RFC 3339)." }
    - { name: "error", type: "TEXT", doc: "The last run's error, when it failed." }
    - { name: "row_counts_json", type: "TEXT", doc: "Rows per entity after the last successful run, as JSON." }
    - { name: "cursor_json", type: "TEXT", doc: "Its checkpoint: the opaque state its script or provider read returned last." }
    - { name: "last_event_id", type: "INTEGER", doc: "The seq of the last trigger event it ran for." }
    - { name: "run_id", type: "TEXT", doc: "Its last run (`v_extension_run.run_id`); NULL for a run before runs were recorded. (v2)" }
    - { name: "ref", type: "TEXT", doc: "`collector:<owner>/<id>`: its ref, the one place SQL spells it — select and join on this, never rebuild it. (v3)" }
  tests:
    - { not_null: owner }
    - { not_null: id }
- name: pending_run
  version: 1
  key: [owner, id]
  description: "Runs deferred by pacing: a collector whose trigger sets `settle`, `at_most` or `idle`, or core's change analysis of a working tree or open effort (`owner` `core`, `id` `change/<kind>/<target>`). Each waiting job, the latest event it'll run for, and since when; a view showing its result can say it's updating while the row is here, and the row goes once the run happens."
  columns:
    - { name: "owner", type: "TEXT", doc: "Whose job: a collector's extension, `project` or `built-in`; `core` for change analysis." }
    - { name: "id", type: "TEXT", doc: "The collector's id within its owner, or `change/working/<stream>` / `change/effort/<effort>`." }
    - { name: "event_seq", type: "INTEGER", doc: "The latest triggering event it will run for (v_event.seq)." }
    - { name: "since", type: "TEXT", doc: "When its run was first deferred (RFC 3339)." }
    - { name: "touched", type: "TEXT", doc: "When a triggering event last arrived for it (RFC 3339): what `settle` counts from." }
- name: contribution
  version: 3
  key: [ref]
  description: "Every enabled extension's contributions, one row each, as their descriptors say: its ref (`<kind>:<extension>/<id>`, or `<kind>:<name>` for a command, metric, measure, dimension, event type or ref kind — the model that owns every contribution kind's ref), who contributed it and at what version, how it runs, what it needs, and the shared name it holds. What `list_extensions` counts and the reference documents. Kinds move onto descriptors one by one; a kind not yet listed here keeps its own listing."
  columns:
    - { name: "ref", type: "TEXT", doc: "Its ref: `job:effort-review/review`, `collector:triage/todos`, `command:oxplow.review.accept`. (v3, was `id`)" }
    - { name: "extension", type: "TEXT", doc: "The extension that declares it." }
    - { name: "kind", type: "TEXT", doc: "`collector`, `effect`, `command`, `metric`, `skill`, `provider`, `lens`, …" }
    - { name: "local", type: "TEXT", doc: "Its id within the extension, or its global name (a command's bus id, a metric's key)." }
    - { name: "origin", type: "TEXT", doc: "`project` or `bundled`." }
    - { name: "version", type: "TEXT", doc: "The extension's `version:` (a bundled one's is oxplow's); NULL when it declares none." }
    - { name: "contract_version", type: "INTEGER", doc: "The contract's own version (a model's, an event type's), when it has one." }
    - { name: "runs_on", type: "TEXT", doc: "How it comes to run, as JSON: `{on: events, types}`, `{on: schedule, every}`, `{on: run}`, `{on: call}`, `{on: query}`, `{on: mount}`, `{on: agent}`, `{on: declared}`." }
    - { name: "needs", type: "TEXT", doc: "What it requires (capabilities, features, scopes), as a JSON array. Never what a person granted." }
    - { name: "after", type: "TEXT", doc: "What an effect or a collector runs after when one event reaches it and them (JSON array of refs: `effect:<ext>/<id>`, `collector:<ext>/<id>`, `consumer:<name>`), as the catalog resolved its `after:`." }
    - { name: "order_level", type: "INTEGER", doc: "Where an effect or a collector runs among what one event reaches: 0 first, each after every contribution it names. NULL for a kind that isn't ordered." }
    - { name: "global_name", type: "TEXT", doc: "The name it holds in a space every extension shares (a metric key, a skill name, `<capability>/<id>`); NULL when none." }
    - { name: "file", type: "TEXT", doc: "The manifest it's declared in." }
    - { name: "line", type: "INTEGER", doc: "Its line there, when the kind tracks lines." }
  tests:
    - { not_null: ref }
- name: lens
  version: 1
  key: [ref]
  description: "Every lens of every enabled extension: a saved query over the models and how to show it. Each is a page for the person (unless hidden); open one with `oxplow_show_lens`, run one with `oxplow_run_lens`, read its definition with `oxplow_read { ref }`. Restated with each extension generation, so it is what the running catalog holds."
  columns:
    - { name: "ref", type: "TEXT", doc: "`lens:<extension>/<slug>`: its ref, the one place SQL spells it." }
    - { name: "extension", type: "TEXT", doc: "The extension that declares it (v_extension.name)." }
    - { name: "slug", type: "TEXT", doc: "Its id within the extension: the lens file's name." }
    - { name: "title", type: "TEXT", doc: "What the person sees." }
    - { name: "description", type: "TEXT", doc: "What it shows; empty when it says nothing." }
    - { name: "viz", type: "TEXT", doc: "How it is drawn: `table`, `list`, `chart`, `tree`, `grid`, `form`, `custom`, … " }
    - { name: "params", type: "TEXT", doc: "The params it takes, as a JSON array of `{name, label, default, options}`." }
    - { name: "hidden", type: "INTEGER", doc: "1 when the launcher doesn't list it (a drill-down or a grid's child)." }
    - { name: "launcher_category", type: "TEXT", doc: "The launcher section it is listed under (`Work`, `Code`, `Activity`, `Data`, …); NULL for the default `Lenses`." }
    - { name: "needs", type: "TEXT", doc: "The capabilities (or features) it needs, as a JSON array; without them its run says so." }
    - { name: "path", type: "TEXT", doc: "The lens file, relative to the worktree." }
  tests:
    - { not_null: ref }
    - { unique: ref }
- name: extension
  version: 1
  key: [ref]
  description: "Every extension the catalog loaded — the project's own (`oxplow/extensions/`) and the ones that ship with oxplow — enabled or not, with why it loaded badly if it did. What an extension contributes is in `v_contribution` (count it by `extension` and `kind`); its lenses are `v_lens`. Restated with each extension generation; an extension that fails to load holds its generation back, so it is not a row — `oxplow_validate_extension` says why. `errors` and `warnings` are what a loaded one reports."
  columns:
    - { name: "ref", type: "TEXT", doc: "`extension:<name>`." }
    - { name: "name", type: "TEXT", doc: "Its name: the folder under `oxplow/extensions/`." }
    - { name: "namespace", type: "TEXT", doc: "The namespace its commands' ids are under." }
    - { name: "description", type: "TEXT", doc: "What it is, in a line." }
    - { name: "path", type: "TEXT", doc: "Its folder, relative to the worktree." }
    - { name: "origin", type: "TEXT", doc: "`project` or `bundled` (ships with oxplow, read-only)." }
    - { name: "version", type: "TEXT", doc: "Its `version:`; NULL when it declares none." }
    - { name: "enabled", type: "INTEGER", doc: "0 when configuration disables it or a public contract blocks it: it contributes nothing." }
    - { name: "sharing", type: "TEXT", doc: "`private` or `shared` (committed for the team)." }
    - { name: "purpose", type: "TEXT", doc: "Why it exists (its intent); NULL when the manifest didn't load." }
    - { name: "source_git", type: "TEXT", doc: "The git URL it was installed from; NULL for one written in this repo." }
    - { name: "source_sha", type: "TEXT", doc: "The commit installed; NULL for one written in this repo." }
    - { name: "errors", type: "TEXT", doc: "Problems reported while loading it that did not hold it back, as a JSON array of strings; `[]` when healthy." }
    - { name: "warnings", type: "TEXT", doc: "Things worth fixing that don't stop it loading, as a JSON array of strings." }
  tests:
    - { not_null: ref }
    - { unique: ref }
- name: prompt
  version: 1
  key: [position]
  description: "What a person can ask oxplow's agent: every question one of core's areas answers and every enabled extension's `intent.prompts`, in the catalog's order (core first, then extensions by name). The Catalog page lists them with Ask; a page for a ref offers the ones `about` its kind. Restated with each extension generation."
  columns:
    - { name: "position", type: "INTEGER", doc: "Its place in the catalog, from 1." }
    - { name: "source_kind", type: "TEXT", doc: "`area` (one of core's) or `extension`." }
    - { name: "source", type: "TEXT", doc: "The area (`vcs`, `work_items`, `knowledge`, `code_intel`, `extensions`) or the extension's name." }
    - { name: "prompt", type: "TEXT", doc: "The question, as the person would ask it." }
    - { name: "about", type: "TEXT", doc: "The ref kind a page for one offers it on (`file`, `commit`, `effort`); NULL when it is about nothing in particular." }
  tests:
    - { not_null: position }
    - { unique: position }
- name: config_key
  version: 1
  key: [key]
  description: "What can be configured in the project's `.oxplow/project.yaml`: each key, what it is for, and whether only a person may set it. Read or change a value with `oxplow.config.get` / `oxplow.config.set`; Settings shows where each value comes from."
  columns:
    - { name: "key", type: "TEXT", doc: "The key, as project.yaml spells it." }
    - { name: "doc", type: "TEXT", doc: "What it is for." }
    - { name: "human_only", type: "INTEGER", doc: "1 when only a person may set it; an agent's change waits for their approval." }
    - { name: "schema", type: "TEXT", doc: "The JSON Schema its value must match." }
  tests:
    - { not_null: key }
    - { unique: key }
- name: page_ref
  version: 1
  description: "The cross-reference graph between pages and records: one row per edge `source → target` — a wiki page naming a file, a commit touching a file or work item, a note about a work item. Ask \"what points at X\" with `WHERE target_ref = 'file:src/app.rs'` and \"what does X point at\" with `WHERE source_ref = 'wiki:intro'`."
  columns:
    - { name: "source_ref", type: "TEXT", doc: "The page or record the edge starts at (`wiki:intro`, `commit:abc1234`, `work_item:oxplow:tsk42`)." }
    - { name: "target_ref", type: "TEXT", doc: "What it points at (`file:src/app.rs`, `work_item:oxplow:tsk42`, `wiki:other`)." }
    - { name: "source_kind", type: "TEXT", doc: "The source's ref kind." }
    - { name: "target_kind", type: "TEXT", doc: "The target's ref kind." }
    - { name: "ref_type", type: "TEXT", doc: "How the source relates to the target (`touched_file`, `wikilink`, `impact`, `work_item_mention`, `summary_commit_mention`, …)." }
    - { name: "source_extra", type: "TEXT", doc: "Edge-specific extras as JSON (a line anchor, a version pin, a link sub-type), when the writer recorded any." }
    - { name: "local_snapshot_id", type: "INTEGER", doc: "The snapshot the edge was recorded at, when there is one (v_snapshot.id)." }
    - { name: "closest_vcs_rev", type: "TEXT", doc: "The VCS revision nearest the edge when recorded." }
    - { name: "vcs_rev_exact", type: "INTEGER", doc: "1 when that revision is exactly the state recorded." }
  tests:
    - { not_null: source_ref }
    - { not_null: target_ref }
- name: capability_provider
  version: 7
  description: "Each capability's implementations — core's, the built-ins extensions declare (`oxplow-bundled`'s defaults, `oxplow-foundation`'s agent harnesses and AI providers), running provider instances', and `none` for an optional capability — with the features each declares, which is active and why. A capability many implementations serve at once (`agent_harness`, `acp_adapter`, `ai_provider`) has every declared row active. A choice that isn't available (its extension disabled, its instance stopped) is listed with `available = 0`; the active row is then the fallback. Settings lists the choices from here, and the UI shows an implementation's enhancements only when its features allow them."
  columns:
    - { name: "capability", type: "TEXT", doc: "`work_items`, `effort_policy`, `snapshots`, `vcs`, `knowledge`, `agent_harness`, `ai_provider`." }
    - { name: "provider", type: "TEXT", doc: "The implementation's id: what `activeProviders` names, a work item ref's segment (`work_item:<provider>:…`), `git`, `none`." }
    - { name: "extension", type: "TEXT", doc: "The extension declaring it; NULL for core's." }
    - { name: "features", type: "TEXT", doc: "The features it declares, as JSON (`work_items`: `hierarchy`, `comments`, `links`, `delete`, `idempotent_writes`; `vcs`: `isolated_workspaces`, `remotes`, `rename_detection`; `snapshots`: `contents`)." }
    - { name: "active", type: "INTEGER", doc: "1 on the capability's active implementation." }
    - { name: "title", type: "TEXT", doc: "How a person names it. (v3)" }
    - { name: "source", type: "TEXT", doc: "How it's loaded: `core`, `builtin`, `external`, `none`; `unknown` for a choice nothing provides. (v3)" }
    - { name: "available", type: "INTEGER", doc: "0 for a chosen implementation that isn't there to use. (v3)" }
    - { name: "chosen_by", type: "TEXT", doc: "On the active row, why it's the one: `personal` (a person's own `.oxplow/personal.yaml`), `project` (`activeProviders`), `default`, `fallback` (the choice isn't available), or `declared` on every row of a capability many implementations serve. NULL on the rest. (v3)" }
    - { name: "capability_title", type: "TEXT", doc: "How a person names the capability (`Work list`). (v4)" }
    - { name: "choosable", type: "INTEGER", doc: "1 when a project chooses the capability's implementation; 0 for one core fixes (`vcs`, `knowledge`). (v4)" }
    - { name: "optional", type: "INTEGER", doc: "1 when the capability may be `none`. (v4)" }
    - { name: "fields", type: "TEXT", doc: "Its own fields as a JSON array of `{ name, title, kind: enum|text|number, values? }`: what a work list keeps in `native` (oxplow's tasks: `priority`)." }
    - { name: "id_pattern", type: "TEXT", doc: "What a work list's own ids look like, a regex matched whole (oxplow's tasks: `tsk\\d+`): how its ids are recognized in text, as core's vocabulary recognizes them. NULL when it doesn't say. (v6)" }
  tests:
    - { not_null: capability }
    - { not_null: provider }
- name: command_audit
  version: 1
  key: [id]
  description: "Every command run on the bus, as audited: who ran it, how it ended, and the error when it didn't. The record of how agents, people, lenses and effects use oxplow's commands — count them by `command`, `actor_kind` and `outcome`. A run refused before it started (`invalid`: its input didn't match the command's schema; `denied`: the actor may not run it) is a row too."
  columns:
    - { name: "id", type: "INTEGER", doc: "Audit row id, in run order." }
    - { name: "at", type: "TEXT", doc: "When it ran (RFC 3339)." }
    - { name: "command", type: "TEXT", doc: "The command id (`oxplow.work_item.create`)." }
    - { name: "actor_kind", type: "TEXT", doc: "Who ran it: `human`, `agent`, `lens`, `system`, `effect` or `job`." }
    - { name: "actor_id", type: "TEXT", doc: "The actor, by kind: an agent's thread (`thr3`), a lens's or effect's id; NULL for a person or the system." }
    - { name: "outcome", type: "TEXT", doc: "`ok`; `invalid` (its input was refused); `denied` (the actor may not run it); `error` (it ran and failed)." }
    - { name: "error", type: "TEXT", doc: "What went wrong, for an outcome other than `ok`." }
    - { name: "thread_id", type: "INTEGER", doc: "The thread it ran on, if any (v_thread.id)." }
    - { name: "session_id", type: "INTEGER", doc: "The agent session that ran it, if any (v_agent_session.id)." }
  tests:
    - { accepted_values: { column: outcome, values: [ok, invalid, denied, error] } }
    - { accepted_values: { column: actor_kind, values: [human, agent, lens, system, effect, job] } }
- name: zone
  version: 1
  description: "The project's architectural zone table (`zones:` in `.oxplow/project.yaml`) with the effect it has on the primary worktree's files: one row per rule in evaluation order (the first matching rule claims a file), each with how many files it claims, then a closing `other` row for the files no rule matched. Read live when a query names it. Change the table with `oxplow.config.set { key: \"zones\" }`; a large `other` count or a `v_zone_unmatched` full of real source means the table has gone stale as the repo grew."
  columns:
    - { name: "position", type: "INT", doc: "The rule's place in the table, from 1; NULL on the closing `other` row." }
    - { name: "zone", type: "TEXT", doc: "The zone label the rule gives (`other` on the closing row)." }
    - { name: "patterns", type: "TEXT", doc: "The rule's globs, as a JSON array; `[]` on the `other` row." }
    - { name: "color", type: "TEXT", doc: "The rule's display colour, if it gave one." }
    - { name: "files", type: "INT", doc: "Files in the worktree this rule claims (none of its earlier siblings did); on `other`, the files no rule matched." }
- name: zone_unmatched
  version: 1
  description: "Up to 20 paths in the primary worktree that no zone rule matched (they read zone `other`), read live when a query names it: the sign that the table needs a rule, or that the repo grew a new area."
  columns:
    - { name: "path", type: "TEXT", doc: "Repo-relative file path." }
- name: scope
  version: 2
  description: "Every scope a command may need (`needs:` in a manifest): what it lets a run change, where its handler runs, and what it lets a handler do. Read live when a query names it. A command's access is the strongest among its scopes."
  columns:
    - { name: "id", type: "TEXT", doc: "`<resource>.<action>` (`records.read`, `work_items.write`)." }
    - { name: "access", type: "TEXT", doc: "`view`, `read`, `record` or `write`: what a run over the scope may change." }
    - { name: "host", type: "TEXT", doc: "Where its handler lives: `daemon`, `window` or `shell`." }
    - { name: "spends", type: "INT", doc: "1 when a run over it spends the person's money (a model call on their provider key), so a tool over it asks before it runs; 0 otherwise. (v2)" }
    - { name: "summary", type: "TEXT", doc: "What it lets a handler do." }
- name: command_proposal
  version: 2
  description: "Commands an agent ran that need a person's confirmation: each kept with its preview and what it would have done, until a person approves (the command then runs as them) or declines it. A newer proposal with the same `key` supersedes a pending one. The Alerts panel shows the pending ones."
  columns:
    - { name: "id", type: "INTEGER", doc: "Proposal id." }
    - { name: "ref", type: "TEXT", doc: "`proposal:<id>`." }
    - { name: "created_at", type: "TEXT", doc: "RFC 3339 timestamp." }
    - { name: "command", type: "TEXT", doc: "The command (`oxplow.config.set`, `oxplow.work_item.delete`)." }
    - { name: "input", type: "TEXT", doc: "Its input (JSON)." }
    - { name: "actor_kind", type: "TEXT", doc: "Who proposed it: `agent` or `lens`." }
    - { name: "actor_id", type: "TEXT", doc: "The proposing thread (`thr3`) or lens, when known." }
    - { name: "thread_id", type: "INTEGER", doc: "The thread it was proposed in (v_thread.id), if any." }
    - { name: "stream_id", type: "INTEGER", doc: "The stream it was proposed in, if any." }
    - { name: "key", type: "TEXT", doc: "What it supersedes on: `config:<key>` for a config change, else the command and its input." }
    - { name: "preview", type: "TEXT", doc: "The confirmation preview (JSON: command, summary, input, destructive)." }
    - { name: "dry_run", type: "TEXT", doc: "What it would have done when proposed (JSON: a config key's before/after, a composite's children); NULL when it can't be dry-run." }
    - { name: "decision", type: "TEXT", doc: "`pending`, `approved`, `declined` or `superseded`." }
    - { name: "decided_at", type: "TEXT", doc: "When it was decided or superseded." }
    - { name: "audit_id", type: "INTEGER", doc: "The approving run's command audit row." }
    - { name: "superseded_by", type: "INTEGER", doc: "The proposal that replaced it." }
  tests:
    - { not_null: id }
    - { unique: ref }
    - { accepted_values: { column: decision, values: [pending, approved, declined, superseded] } }
- name: thread_answer
  version: 2
  description: "An agent's answers in a thread: what `oxplow_show_lens` showed the person — an existing lens with its params, or the answer's own lens spec — and, once kept, the lens it became."
  columns:
    - { name: "id", type: "INTEGER", doc: "Answer id." }
    - { name: "ref", type: "TEXT", doc: "`answer:<id>`." }
    - { name: "thread_id", type: "INTEGER", doc: "The thread it was shown in (v_thread.id)." }
    - { name: "turn_id", type: "INTEGER", doc: "The turn it was shown in (v_agent_turn.id), when one was open." }
    - { name: "effort_id", type: "INTEGER", doc: "The effort open in the thread at the time, if any." }
    - { name: "title", type: "TEXT", doc: "What it's called." }
    - { name: "lens", type: "TEXT", doc: "An existing lens shown (`<extension>/<slug>`); NULL when the answer has its own spec." }
    - { name: "spec", type: "TEXT", doc: "The answer's own lens spec (JSON: title, query, viz, columns, chart, …); NULL for an existing lens." }
    - { name: "params", type: "TEXT", doc: "The params it ran with (JSON object)." }
    - { name: "created_at", type: "TEXT", doc: "RFC 3339 timestamp." }
    - { name: "kept_lens", type: "TEXT", doc: "The lens it was kept as (`oxplow.lens.keep`), if it was." }
  tests:
    - { not_null: id }
    - { unique: ref }
    - { relationships: { column: thread_id, to: thread, field: id } }
- name: token_usage
  version: 1
  description: "Model token usage recorded from agent sessions, per thread, effort and model."
  columns:
    - { name: "id", type: "INTEGER", doc: "Row id." }
    - { name: "stream_id", type: "INTEGER", doc: "Stream." }
    - { name: "thread_id", type: "INTEGER", doc: "Thread." }
    - { name: "effort_id", type: "INTEGER", doc: "Effort open at the time, if any." }
    - { name: "turn_id", type: "INTEGER", doc: "Turn it happened in (v_agent_turn.id), when known." }
    - { name: "agent_kind", type: "TEXT", doc: "Harness (`claude`, `codex`, …)." }
    - { name: "model", type: "TEXT", doc: "Model id, if reported." }
    - { name: "prompt", type: "TEXT", doc: "The human prompt that opened this turn, if the transcript had one." }
    - { name: "input_tokens", type: "INTEGER", doc: "Input tokens." }
    - { name: "output_tokens", type: "INTEGER", doc: "Output tokens." }
    - { name: "cache_creation_input_tokens", type: "INTEGER", doc: "Tokens written to the prompt cache." }
    - { name: "cache_read_input_tokens", type: "INTEGER", doc: "Tokens read from the prompt cache." }
    - { name: "message_count", type: "INTEGER", doc: "Messages in this record." }
    - { name: "recorded_at", type: "TEXT", doc: "RFC 3339 timestamp." }
  tests:
    - { not_null: id }
    - { unique: id }
- name: handoff
  version: 1
  description: "Work handed from one thread to another (`oxplow.handoff.send`; ref `handoff:hnd<n>`): who sent it, the thread it is for, the work item it hands over, when the recipient's agent was given it, and how it ended. A record oxplow keeps, never a message it delivers: the recipient's agent is given it at its next prompt."
  columns:
    - { name: "id", type: "INTEGER", doc: "Handoff id (`hnd<n>`)." }
    - { name: "ref", type: "TEXT", doc: "`handoff:hnd<id>`: its ref, the one place SQL spells it — select and join on this, never rebuild it." }
    - { name: "from_thread_id", type: "INTEGER", doc: "The thread that sent it." }
    - { name: "from_thread_ref", type: "TEXT", doc: "That thread's ref (`thread:thr<n>`)." }
    - { name: "from_session_id", type: "INTEGER", doc: "The agent session that sent it; NULL when a person or an effect did." }
    - { name: "from_session_ref", type: "TEXT", doc: "That session's ref (`agent_session:ses<n>`)." }
    - { name: "from_actor", type: "TEXT", doc: "Who sent it: `user`, `agent`, `effect`, `job` or `system` (the actor, never an input)." }
    - { name: "to_thread_id", type: "INTEGER", doc: "The thread it is for (never a session: the thread outlives its processes)." }
    - { name: "to_thread_ref", type: "TEXT", doc: "That thread's ref: where a handoff opens." }
    - { name: "work_item", type: "TEXT", doc: "The work item it hands over (a `work_item:` ref), when it names one; taking the handoff moves the item onto the recipient thread." }
    - { name: "body", type: "TEXT", doc: "Markdown body." }
    - { name: "sent_at", type: "TEXT", doc: "RFC 3339 timestamp." }
    - { name: "delivered_at", type: "TEXT", doc: "When a prompt in the recipient thread carried it to its agent; NULL until then." }
    - { name: "delivered_to_session_id", type: "INTEGER", doc: "The agent session that prompt was in." }
    - { name: "state", type: "TEXT", doc: "`open`, `taken`, `declined` (by the recipient) or `withdrawn` (by the sender)." }
    - { name: "settled_at", type: "TEXT", doc: "When it was taken, declined or withdrawn; NULL while open." }
    - { name: "settled_by_session_id", type: "INTEGER", doc: "The agent session that settled it; NULL for a person." }
    - { name: "note", type: "TEXT", doc: "What its settler said, when anything." }
  tests:
    - { not_null: id }
    - { unique: id }
    - { relationships: { column: from_thread_id, to: thread, field: id } }
    - { relationships: { column: to_thread_id, to: thread, field: id } }
- name: thread_note
  version: 3
  description: "A thread's notes: the capture pad an agent writes as it works (`oxplow.knowledge.add_note`; ref `thread_note:not<n>`)."
  columns:
    - { name: "id", type: "INTEGER", doc: "Note id (`not<n>`)." }
    - { name: "thread_id", type: "INTEGER", doc: "The thread it's on." }
    - { name: "body", type: "TEXT", doc: "Markdown body." }
    - { name: "author", type: "TEXT", doc: "Who wrote it (`agent`, `user`, …)." }
    - { name: "created_at", type: "TEXT", doc: "RFC 3339 timestamp." }
    - { name: "ref", type: "TEXT", doc: "`thread_note:not<id>`: its ref, the one place SQL spells it — select and join on this, never rebuild it. (v2)" }
    - { name: "thread_ref", type: "TEXT", doc: "Its thread's ref (`thread:thr<n>`): where a note opens. (v3)" }
  tests:
    - { not_null: id }
    - { unique: id }
    - { relationships: { column: thread_id, to: thread, field: id } }
- name: tool_call
  version: 4
  description: "Every tool call the agent made (from the PostToolUse hook): reads, edits, commands."
  columns:
    - { name: "id", type: "INTEGER", doc: "Row id." }
    - { name: "thread_id", type: "INTEGER", doc: "Thread." }
    - { name: "effort_id", type: "INTEGER", doc: "Effort open at the time, if any." }
    - { name: "turn_id", type: "INTEGER", doc: "Turn it happened in (v_agent_turn.id), when known." }
    - { name: "tool", type: "TEXT", doc: "The harness's own name for the tool (`Edit`, `apply_patch`, …)." }
    - { name: "kind", type: "TEXT", doc: "What it does, the same for every harness: `read`, `edit`, `shell`, `subagent`, `ask`, `plan`, `search`, `fetch`, `mcp` or `other`." }
    - { name: "path", type: "TEXT", doc: "File it touched, repo-relative when inside the project." }
    - { name: "detail", type: "TEXT", doc: "Short context: a shell command (truncated), a search pattern, …" }
    - { name: "ok", type: "INTEGER", doc: "1 succeeded, 0 failed, NULL unknown (a shell call often reports no exit code)." }
    - { name: "at", type: "TEXT", doc: "RFC 3339 timestamp." }
    - { name: "event_id", type: "TEXT", doc: "The `agent.tool.finished` event (v_event.id) this row records; NULL for rows written before the event log carried tool calls." }
    - { name: "agent_session_id", type: "INTEGER", doc: "The agent session that made it (v_agent_session.id); NULL when not recorded. (v4)" }
    - { name: "subagent_id", type: "TEXT", doc: "The subagent it ran inside, when the harness or the Task call bracketing it says so; NULL for the session's own. (v4)" }
    - { name: "subagent_kind", type: "TEXT", doc: "That subagent's kind (`Explore`, `task`, …). (v4)" }
  tests:
    - { not_null: id }
    - { unique: id }
- name: wiki_page
  version: 1
  description: "Wiki pages (project knowledge): the row written with each page's file, with its excerpt (the full text is v_knowledge_body)."
  columns:
    - { name: "slug", type: "TEXT", doc: "Page slug (link with [[slug]])." }
    - { name: "title", type: "TEXT", doc: "Page title." }
    - { name: "body_excerpt", type: "TEXT", doc: "Start of the body." }
    - { name: "body_size_bytes", type: "INTEGER", doc: "Size of the full body." }
    - { name: "created_at", type: "TEXT", doc: "RFC 3339 timestamp." }
    - { name: "updated_at", type: "TEXT", doc: "RFC 3339 timestamp." }
- name: work_item
  version: 3
  description: "The active work list's items — the work-item interface everything reads, whichever implementation is active (oxplow's tasks, a provider's tracker; none: nothing). Deleted items excluded. `state` is the canonical state every list maps to; a list's own fields are in `native` (described by its declared fields). Links are `v_work_item_link`, comments `v_work_item_comment`."
  columns:
    - { name: "ref", type: "TEXT", doc: "`work_item:<provider>:<id>` (`work_item:oxplow:tsk42`)." }
    - { name: "provider", type: "TEXT", doc: "The implementation it comes from: the active work list (`oxplow`, a provider instance)." }
    - { name: "native_id", type: "TEXT", doc: "The id the list itself knows it by (`tsk42`, `ENG-12`): the ref without `work_item:<provider>:`. Match a tracker's own rows on this, never by slicing `ref`." }
    - { name: "title", type: "TEXT", doc: "Title." }
    - { name: "body", type: "TEXT", doc: "Markdown body." }
    - { name: "state", type: "TEXT", doc: "Canonical state: `todo`, `in_progress`, `blocked`, `done` or `canceled`." }
    - { name: "native_state", type: "TEXT", doc: "The list's own state (oxplow: the task status, `archived` included)." }
    - { name: "native", type: "TEXT", doc: "The list's own fields as JSON (its declared fields; oxplow: priority, author, …)." }
    - { name: "parent_ref", type: "TEXT", doc: "The parent work item's ref (an epic); NULL at top level or when the parent is deleted." }
    - { name: "thread_id", type: "INTEGER", doc: "The list it's on: a thread's, or NULL for the backlog." }
    - { name: "rank", type: "REAL", doc: "Its order on its list (ascending); NULL orders by `created_at`." }
    - { name: "closed_at", type: "TEXT", doc: "When it first reached `done` or `canceled` (RFC 3339); NULL while open." }
    - { name: "created_at", type: "TEXT", doc: "RFC 3339 timestamp." }
    - { name: "updated_at", type: "TEXT", doc: "RFC 3339 timestamp." }
  tests:
    - { not_null: ref }
    - { unique: ref }
    - { accepted_values: { column: state, values: [todo, in_progress, blocked, done, canceled] } }
    - { relationships: { column: parent_ref, to: work_item, field: ref } }
- name: work_item_link
  version: 2
  description: "Links from the active work list's items (`oxplow.work_item.link`): to another item (`blocks`, `relates_to`, …) or to any ref (`about` a collector, an effort, a file). A target needn't resolve — what it names may have been deleted or its extension removed — so join it to its kind's model when you need it there."
  columns:
    - { name: "from_ref", type: "TEXT", doc: "The item the link is from." }
    - { name: "to_ref", type: "TEXT", doc: "What it points at: any ref." }
    - { name: "to_kind", type: "TEXT", doc: "The target's kind (`work_item`, `collector`, `effort`, …). (v2)" }
    - { name: "link_type", type: "TEXT", doc: "The list's own link type; oxplow's tasks: `blocks` (from must finish before to starts), `discovered_from`, `relates_to`, `duplicates`, `supersedes`, `replies_to` or `about` (the item is about the target)." }
    - { name: "created_at", type: "TEXT", doc: "RFC 3339 timestamp." }
  tests:
    - { relationships: { column: from_ref, to: work_item, field: ref } }
- name: work_item_comment
  version: 1
  description: "Comments on the active work list's items (`oxplow.work_item.comment`)."
  columns:
    - { name: "id", type: "TEXT", doc: "The list's own id for the comment (oxplow: `task_note:<id>`)." }
    - { name: "ref", type: "TEXT", doc: "The item it's on." }
    - { name: "body", type: "TEXT", doc: "Markdown body." }
    - { name: "author", type: "TEXT", doc: "Who wrote it, as the list records it." }
    - { name: "created_at", type: "TEXT", doc: "RFC 3339 timestamp." }
  tests:
    - { unique: id }
    - { relationships: { column: ref, to: work_item, field: ref } }
- name: knowledge_page
  version: 2
  description: "Knowledge pages (the wiki): one row per page with what it links to and how many of its file refs have drifted since they were pinned. A page's full text is `v_knowledge_body`; search them with the `oxplow_search` tool."
  columns:
    - { name: "ref", type: "TEXT", doc: "`wiki:<slug>`." }
    - { name: "provider", type: "TEXT", doc: "The knowledge store that keeps it: the project's active one (`oxplow`, the wiki; a provider's instance). The pages are the active store's. (v2)" }
    - { name: "slug", type: "TEXT", doc: "Page slug (link with [[slug]])." }
    - { name: "title", type: "TEXT", doc: "The page's first `# ` heading, else its slug." }
    - { name: "excerpt", type: "TEXT", doc: "Start of the body." }
    - { name: "body_size", type: "INTEGER", doc: "Size of the full body, bytes." }
    - { name: "outbound_refs", type: "TEXT", doc: "JSON array of every ref the page links to (`file:src/lib.rs`, `wiki:other`, `work_item:oxplow:tsk42`)." }
    - { name: "stale_ref_count", type: "INT", doc: "Its `stale` rows in v_knowledge_ref: file refs whose file has a newer primary-stream snapshot than the one the ref was pinned to (or that were never pinned but have been snapshotted): what may no longer hold." }
    - { name: "updated_at", type: "TEXT", doc: "RFC 3339 timestamp." }
  tests:
    - { not_null: ref }
    - { unique: ref }
    - { accepted_values: { column: provider, values: [oxplow] } }
- name: knowledge_pin
  version: 1
  description: "Each knowledge page's file refs and how current they are, keyed by the page's slug: the one definition of staleness `v_knowledge_ref` (keyed by the page's ref) and `v_knowledge_page.stale_ref_count` both read."
  columns:
    - { name: "slug", type: "TEXT", doc: "The page's slug (v_knowledge_page.slug)." }
    - { name: "path", type: "TEXT", doc: "The file it relies on (workspace-relative)." }
    - { name: "pinned_snapshot_id", type: "INTEGER", doc: "The snapshot the ref was pinned to (written or verified against); NULL if never pinned." }
    - { name: "pinned_vcs_rev", type: "TEXT", doc: "The VCS revision nearest the pin (v_commit.sha for git); NULL without one." }
    - { name: "pinned_vcs_rev_exact", type: "INT", doc: "1 when the pinned snapshot is exactly `pinned_vcs_rev` (a clean worktree), else 0." }
    - { name: "latest_snapshot_id", type: "INT", doc: "The file's latest primary-stream snapshot (the stream a pin comes from); NULL if it was never captured there." }
    - { name: "stale", type: "INT", doc: "1 when the file changed after the pin (or was captured but never pinned)." }
  tests:
    - { not_null: slug }
- name: knowledge_ref
  version: 1
  description: "Each knowledge page's file refs and how current they are: the snapshot a ref was pinned to against the file's latest — both the primary stream's, the one definition of staleness every reader uses. `stale` rows are what `v_knowledge_page.stale_ref_count` counts; `oxplow_wiki_ref_drift` shows one's diff."
  columns:
    - { name: "page", type: "TEXT", doc: "The page (`wiki:<slug>`, v_knowledge_page.ref)." }
    - { name: "path", type: "TEXT", doc: "The file it relies on (workspace-relative)." }
    - { name: "pinned_snapshot_id", type: "INTEGER", doc: "The snapshot the ref was pinned to (written or verified against); NULL if never pinned." }
    - { name: "pinned_vcs_rev", type: "TEXT", doc: "The VCS revision nearest the pin (v_commit.sha for git); NULL without one." }
    - { name: "pinned_vcs_rev_exact", type: "INT", doc: "1 when the pinned snapshot is exactly `pinned_vcs_rev` (a clean worktree), else 0." }
    - { name: "latest_snapshot_id", type: "INT", doc: "The file's latest primary-stream snapshot (the stream a pin comes from); NULL if it was never captured there." }
    - { name: "stale", type: "INT", doc: "1 when the file changed after the pin (or was captured but never pinned)." }
  tests:
    - { not_null: page }
    - { relationships: { column: page, to: knowledge_page, field: ref } }
- name: knowledge_body
  version: 1
  description: "Each knowledge page's full markdown body, apart from v_knowledge_page so listing pages never reads bodies."
  columns:
    - { name: "ref", type: "TEXT", doc: "`wiki:<slug>` (v_knowledge_page.ref)." }
    - { name: "body", type: "TEXT", doc: "The page's markdown, as its file holds it." }
  tests:
    - { not_null: ref }
    - { unique: ref }
    - { relationships: { column: ref, to: knowledge_page, field: ref } }
- name: knowledge_touch
  version: 1
  description: "Which threads wrote or updated which knowledge pages, and when a thread last did (the rail's Finished section)."
  columns:
    - { name: "page", type: "TEXT", doc: "The page (`wiki:<slug>`, v_knowledge_page.ref)." }
    - { name: "thread_id", type: "INTEGER", doc: "The thread (v_thread.id)." }
    - { name: "last_seen_at", type: "TEXT", doc: "RFC 3339 timestamp of that thread's latest write to it." }
  tests:
    - { not_null: page }
    - { relationships: { column: page, to: knowledge_page, field: ref } }
- name: model
  version: 2
  description: "Models: every published view, as compiled at this open — core ones and each extension's. Read a model's columns in `v_model_column`, what it reads in `v_model_lineage` and its declared tests' results in `v_model_test`."
  columns:
    - { name: view, type: TEXT, doc: "The view to query (`v_work_item`)." }
    - { name: name, type: TEXT, doc: "The model's name within its owner (`work_item`)." }
    - { name: owner, type: TEXT, doc: "`core`, or the extension that declares it." }
    - { name: kind, type: TEXT, doc: "`sql` (compiled from a model file) or `entity` (an extension's synced entity)." }
    - { name: version, type: INTEGER, doc: "Contract version: a change to the columns bumps it." }
    - { name: description, type: TEXT, doc: "What the view holds." }
    - { name: sql, type: TEXT, doc: "The SELECT the view was compiled from, references resolved." }
    - { name: compiled_at, type: TEXT, doc: "RFC 3339 time of the open that compiled it." }
    - { name: materialize, type: TEXT, doc: "NULL when it's computed on read (a view); `on_change` when it's stored and recomputed when an input changes; `every <d>` (`every 1h`) when it's stored and recomputed on that clock; `incremental <column>` when it's stored and kept by appending rows past that watermark." }
    - { name: computed_at, type: TEXT, doc: "For a materialized model: when it was last recomputed (RFC 3339); NULL otherwise." }
    - { name: events_to, type: INTEGER, doc: "For a materialized model: the event log's highest seq when that recompute began — what its inputs had seen." }
    - { name: mode, type: TEXT, doc: "For a materialized model: how its last recompute ran — `full` or `incremental`." }
  tests:
    - { not_null: view }
    - { unique: view }
- name: model_column
  version: 1
  description: "Model columns: each model's contract at its current version, in column order."
  columns:
    - { name: view, type: TEXT, doc: "The model's view (`v_model.view`)." }
    - { name: position, type: INT, doc: "0-based column position." }
    - { name: name, type: "", doc: "Column name." }
    - { name: sql_type, type: "", doc: "The column's SQLite declared type; empty for a computed column." }
    - { name: doc, type: "", doc: "What the column holds." }
    - { name: key_part, type: "", doc: "Its 1-based place in the model's key; null when it isn't part of the key." }
- name: model_lineage
  version: 1
  description: "Model lineage: what each model reads directly — another model (`ref`, by view) or a table (`source`). Confirmed at compile against what SQLite reports the view reading."
  columns:
    - { name: view, type: TEXT, doc: "The reading model's view." }
    - { name: input, type: TEXT, doc: "The view (`ref`) or table (`source`) it reads." }
    - { name: kind, type: TEXT, doc: "`ref` or `source`." }
- name: model_test
  version: 1
  description: "Model tests: the last result of each model's declared tests (`not_null`, `unique`, `accepted_values`, `relationships`, `sql`)."
  columns:
    - { name: view, type: TEXT, doc: "The tested model's view." }
    - { name: test, type: TEXT, doc: "The test, e.g. `unique(id)`." }
    - { name: state, type: TEXT, doc: "`passed`, `failed` (rows break it) or `error` (it didn't run)." }
    - { name: detail, type: TEXT, doc: "How many rows broke it, or the error; NULL when passed." }
    - { name: ran_at, type: TEXT, doc: "RFC 3339 time it ran." }
- name: dimension
  version: 1
  description: "Dimensions: what metrics can be sliced by — `metric_grid('<bucket>', '<dimension>')` groups by one of these keys."
  columns:
    - { name: key, type: TEXT, doc: "The dimension key, e.g. `zone`; `oxplow.*` keys are built in." }
    - { name: label, type: TEXT, doc: "Display name." }
    - { name: value_type, type: TEXT, doc: "`categorical`, `numeric`, `temporal` or `entity-ref`." }
    - { name: subject_kind, type: TEXT, doc: "For an `entity-ref` dimension, the kind of thing it refers to." }
    - { name: vocabulary_json, type: TEXT, doc: "The controlled set of values, as a JSON array; NULL when open." }
    - { name: scope, type: TEXT, doc: "`built-in`, `global` or `project`." }
    - { name: promoted, type: INTEGER, doc: "1 when facts carry it as a column (fast to group by), else 0." }
    - { name: entity_json, type: TEXT, doc: "For an entity dimension, the view and expression it slices (`{\"view\", \"expr\"}`)." }
    - { name: extension, type: TEXT, doc: "The extension that declared it; NULL for core." }
  tests:
    - { not_null: key }
    - { unique: key }
- name: metric_catalog
  version: 2
  description: "The metric catalog: every metric this project can use — bundled gauges, always-on producers, entity metrics, extension and project metrics — with whether it's enabled here. Read a metric's values with `MEASURE('<key>')` over `metric_grid()`; enable one with the `oxplow.metric.enable` command."
  columns:
    - { name: key, type: TEXT, doc: "The metric key." }
    - { name: title, type: TEXT, doc: "Display name." }
    - { name: kind, type: TEXT, doc: "How it displays (`gauge`, …)." }
    - { name: language, type: TEXT, doc: "The language a code gauge reads; NULL for the rest." }
    - { name: scope, type: TEXT, doc: "`built-in`, `global` or `project`." }
    - { name: enabled, type: INTEGER, doc: "1 when it's on in this project." }
    - { name: target, type: REAL, doc: "The target value, when set." }
    - { name: trigger, type: TEXT, doc: "When a gauge runs (`on-snapshot`, …); `auto` for a metric fed by its producer." }
    - { name: toggleable, type: INTEGER, doc: "1 when `oxplow.metric.enable` can switch it." }
    - { name: category, type: TEXT, doc: "`operational`, `testing`, `static-quality` or `custom` — how the catalog groups it." }
  tests:
    - { not_null: key }
    - { unique: key }
- name: tree_fact
  version: 2
  description: "The code tree's current facts: for every `per-path` measure (code gauges' per-file and per-function facts), per stream, only the facts from the latest capture that scanned each path — a fixed or removed item drops out, a deleted file's facts go. The same fold the metric engine reads. Its columns are `v_fact`'s."
  columns:
    - { name: "id", type: "INTEGER", doc: "Fact id." }
    - { name: "capture_id", type: "INTEGER", doc: "Producing capture (v_capture.id)." }
    - { name: "measure_key", type: "TEXT", doc: "Measure this is a value of (v_measure.key)." }
    - { name: "value", type: "REAL", doc: "The measured value." }
    - { name: "numerator", type: "REAL", doc: "Ratio numerator, for ratio measures." }
    - { name: "denominator", type: "REAL", doc: "Ratio denominator, for ratio measures." }
    - { name: "subject_kind", type: "TEXT", doc: "The subject ref's kind: `file` or `symbol`." }
    - { name: "subject", type: "TEXT", doc: "The subject as one ref (`symbol:src/a.rs/Parser::parse`, `file:src/a.rs`)." }
    - { name: "path", type: "TEXT", doc: "File path." }
    - { name: "line", type: "INTEGER", doc: "Line number, when it has one." }
    - { name: "severity", type: "TEXT", doc: "Finding severity, for lint-like facts." }
    - { name: "rule", type: "TEXT", doc: "Rule id, for lint-like facts." }
    - { name: "detail", type: "TEXT", doc: "Free-text detail." }
    - { name: "dims_json", type: "TEXT", doc: "Extra dimensions as a JSON object." }
    - { name: "stream_id", type: "INTEGER", doc: "The stream (worktree) whose tree it describes." }
    - { name: "thread_id", type: "INTEGER", doc: "From the capture." }
    - { name: "effort_id", type: "INTEGER", doc: "From the capture." }
    - { name: "captured_at", type: "TEXT", doc: "When the capture that holds it ran." }
    - { name: "branch", type: "TEXT", doc: "From the capture." }
  tests:
    - { not_null: id }
    - { unique: id }
- name: function
  version: 2
  description: "Functions in the current code tree, one row per function ref and stream: its latest cyclomatic complexity, length and parameter count from the code gauges (over `v_tree_fact`), named by `v_symbol`: a function the symbol index doesn't have isn't listed."
  columns:
    - { name: "stream_id", type: "INTEGER", doc: "The stream (worktree) whose tree it's in." }
    - { name: "symbol", type: "TEXT", doc: "The function's `symbol:<path>/<id>` ref (`v_symbol.ref`)." }
    - { name: "path", type: "TEXT", doc: "The file it's in." }
    - { name: "name", type: "TEXT", doc: "The function's own name (`v_symbol.name`)." }
    - { name: "container", type: "TEXT", doc: "What it's inside, `::`-joined; NULL at top level (`v_symbol.container`)." }
    - { name: "kind", type: "TEXT", doc: "`function`, `method` or `constructor` (`v_symbol.kind`)." }
    - { name: "line", doc: "Its first line." }
    - { name: "language", doc: "Its language (`rust`, `typescript`, …)." }
    - { name: "complexity", doc: "Cyclomatic complexity; NULL when not measured." }
    - { name: "length", doc: "Length in lines; NULL when not measured." }
    - { name: "parameters", doc: "Parameter count; NULL when not measured." }
    - { name: "captured_at", doc: "When its latest capture ran." }
  tests:
    - { not_null: symbol }
    - { sql: "SELECT 1 FROM v_function GROUP BY stream_id, symbol HAVING count(*) > 1" }
- name: file_metric
  version: 1
  description: "Per-file code facts in the current tree, one row per file, measure and stream (TODO markers, doc coverage, and any per-path measure a gauge reports per file; over `v_tree_fact`)."
  columns:
    - { name: "stream_id", type: "INTEGER", doc: "The stream (worktree) whose tree it's in." }
    - { name: "path", type: "TEXT", doc: "The file." }
    - { name: "measure_key", type: "TEXT", doc: "The measure (v_measure.key)." }
    - { name: "value", type: "REAL", doc: "Its value for the file." }
    - { name: "numerator", type: "REAL", doc: "Ratio numerator, for ratio measures." }
    - { name: "denominator", type: "REAL", doc: "Ratio denominator, for ratio measures." }
    - { name: "captured_at", type: "TEXT", doc: "When its latest capture ran." }
  tests:
    - { not_null: path }
- name: capture_exclusion
  version: 1
  description: "The snapshot files a capture's scan was not given: over the size limit, binary or unreadable. A capture restates the paths it scanned; an excluded path is not one of them, so the facts it last had stay (stale) rather than reading as clean. A lens shows which files a metric did not check, and since when."
  columns:
    - { name: "capture_id", type: "INTEGER", doc: "The capture that left it out (v_capture.id)." }
    - { name: "producer", type: "TEXT", doc: "What produced that capture (v_capture.producer)." }
    - { name: "path", type: "TEXT", doc: "The file's path in the snapshot." }
    - { name: "reason", type: "TEXT", doc: "`oversize` (over snapshotMaxFileBytes, or stored by stat only), `binary` (holds a NUL byte) or `unreadable`." }
    - { name: "unchecked", type: "INT", doc: "1 while no later capture of the same producer has scanned the file: the facts it last had are still its last good ones, unchecked." }
  tests:
    - { not_null: capture_id }
    - { not_null: path }
- name: ai_role
  version: 1
  key: [role]
  description: "oxplow's AI roles — the built-ins (`main`, `summarize`, `decide`), then each active extension's AI profiles (`<extension>/<name>`) — with the provider and model each is bound to and would use now, what a person forbids it (`restrict`), and whether that provider has a key. Read live when a query names it (ai.yaml, project.yaml and the keychain change with no hook): the key itself is never in any model. The person manages roles in Settings → AI."
  columns:
    - { name: "role", type: "TEXT", doc: "`main`, `summarize`, `decide`, or `<extension>/<profile>`." }
    - { name: "description", type: "TEXT", doc: "What the role is for: oxplow's text for a built-in, the declaring extension's for a profile." }
    - { name: "extension", type: "TEXT", doc: "The extension declaring a profile; NULL for a built-in." }
    - { name: "fallback", type: "TEXT", doc: "The built-in role an unbound profile uses; NULL for a built-in." }
    - { name: "provider", type: "TEXT", doc: "The provider (`v_ai_provider.id`) of the role's own binding; NULL when it has none." }
    - { name: "model", type: "TEXT", doc: "The model of the role's own binding; NULL when it has none." }
    - { name: "restrict", type: "TEXT", doc: "What a person forbids this binding, a JSON array of `tools`, `sql`, `streaming`, `images`; NULL when it has no binding." }
    - { name: "effective_provider", type: "TEXT", doc: "The provider a call would use now: its binding's, else its fallback's; NULL when a call would be refused." }
    - { name: "effective_model", type: "TEXT", doc: "The model a call would use now." }
    - { name: "key_set", type: "INT", doc: "1 when the effective provider has a key in the keychain (never the key)." }
    - { name: "overridden", type: "INT", doc: "1 when the binding comes from the project's `project.yaml`, not the global `ai.yaml`." }
    - { name: "problem", type: "TEXT", doc: "Why a call on it would be refused, when it would be: a model lacking a feature the profile needs." }
- name: ai_provider
  version: 1
  key: [id]
  description: "The configured model providers and whether each has a key (never the key). Read live when a query names it."
  columns:
    - { name: "id", type: "TEXT", doc: "Your name for it (`anthropic`, `local-ollama`); also its keychain entry." }
    - { name: "kind", type: "TEXT", doc: "What it is: `anthropic`, `openai`, `openai_compatible`, `openrouter`, `typesafe`, …" }
    - { name: "base_url", type: "TEXT", doc: "Its API base when overridden or required; NULL for the default." }
    - { name: "key_set", type: "INT", doc: "1 when the keychain holds a key for it." }
- name: lsp_server
  version: 1
  key: [language_id]
  description: "Every language server oxplow knows — configured in `.oxplow/project.yaml` or installed through Mason (the yaml wins per language) — with whether its binary exists and which streams run it now. Read live when a query names it; check it before relying on `oxplow_code_hover` / `oxplow_code_definition` / `oxplow_code_references` for a language, and after an `oxplow.lsp.install_server`."
  columns:
    - { name: "language_id", type: "TEXT", doc: "The LSP language id (`rust`, `typescript`)." }
    - { name: "extensions", type: "TEXT", doc: "File extensions it serves, a JSON array." }
    - { name: "command", type: "TEXT", doc: "The command that starts it." }
    - { name: "args", type: "TEXT", doc: "Its arguments, a JSON array." }
    - { name: "source", type: "TEXT", doc: "`yaml` (project.yaml) or `installed` (Mason)." }
    - { name: "package_name", type: "TEXT", doc: "The Mason package, for an installed server." }
    - { name: "version", type: "TEXT", doc: "The installed package's version." }
    - { name: "binary_exists", type: "INT", doc: "1 when the command resolves to a file on this machine." }
    - { name: "running", type: "INT", doc: "How many streams have a live session with it." }
    - { name: "running_streams", type: "TEXT", doc: "Those streams' ids, a JSON array." }
    - { name: "completion_trigger_characters", type: "TEXT", doc: "A running session's completion trigger characters, a JSON array; NULL when none runs." }
- name: collector_state
  version: 1
  key: [ref]
  description: "Each declared collector's standing on this machine: whether a person approved its current script, whether this OS enforces its `network` list, and why failures disabled it. Read live when a query names it (approvals are per machine, outside the repo). Its runs are `v_collector_run`; its declaration `v_contribution`."
  columns:
    - { name: "ref", type: "TEXT", doc: "`collector:<owner>/<id>`." }
    - { name: "owner", type: "TEXT", doc: "The extension that declares it." }
    - { name: "id", type: "TEXT", doc: "Its id within the extension." }
    - { name: "approved", type: "INT", doc: "1 when it needs no approval or this machine approved its script as it is now; 0 means `run_collector` is refused until a person approves it in Settings → Data." }
    - { name: "network_enforced", type: "INT", doc: "1 when this OS enforces the collector's `network` list." }
    - { name: "version", type: "TEXT", doc: "Its approval hash as it is now — what a person's approval names; NULL for a collector needing none." }
    - { name: "disabled", type: "TEXT", doc: "Why failures disabled it on this machine; NULL when it isn't." }
- name: collector_credential
  version: 1
  key: [collector, name]
  description: "Each credential a collector declares and whether a value is set for it in this machine's keychain (never the value). Read live when a query names it. A person sets one in Settings → Data."
  columns:
    - { name: "collector", type: "TEXT", doc: "The collector's ref (`v_collector_state.ref`)." }
    - { name: "name", type: "TEXT", doc: "The credential's name, as the collector reads it (`env: [NAME]`)." }
    - { name: "is_set", type: "INT", doc: "1 when the keychain holds a value for it." }
