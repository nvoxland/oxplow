[package]
name = "oxplow-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

# Headless oxplow backend for remote-dev: boots the same Services +
# background orchestration as the Tauri shell, then serves the shared
# oxplow-rpc dispatch over loopback HTTP. Pair with `ssh -L` from the
# laptop; see .context/ipc-and-stores.md and the remote-daemon epic.

[[bin]]
name = "oxplow-daemon"
path = "src/main.rs"

[dependencies]
oxplow-app = { workspace = true }
oxplow-ai = { workspace = true }
oxplow-rpc = { workspace = true }
oxplow-control-plane = { workspace = true }

axum = { version = "0.8", features = ["json", "ws"] }
tower-http = { version = "0.7", features = ["cors"] }
futures = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
uuid = { workspace = true }
oxplow-workspace-hack = { version = "0.1", path = "../oxplow-workspace-hack" }

[dev-dependencies]
oxplow-domain = { workspace = true }
tempfile = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
tokio-tungstenite = "0.30"

[lints]
workspace = true
