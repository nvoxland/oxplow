[package]
name = "oxplow-provider-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "oxplow's MCP adapter: an MCP server plus a Starlark mapping, as a provider"

[[bin]]
name = "oxplow-provider-mcp"
path = "src/main.rs"

# The test MCP server the adapter's tests and the notes fixture run.
[[bin]]
name = "oxplow-provider-mcp-notes"
path = "src/bin/notes.rs"

[dependencies]
oxplow-provider-protocol = { workspace = true }
oxplow-collect-plugin = { workspace = true }
# The streamable-HTTP client is the adapter's (a server by `url`); the
# server side and axum are the notes test server's.
rmcp = { workspace = true, features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
    "reqwest",
    "transport-streamable-http-server",
] }
axum = { version = "0.8" }
# What `Http` (the streamable-HTTP client that reads every 401 as one)
# names in rmcp's client trait.
reqwest = { workspace = true }
futures = { workspace = true }
sse-stream = "0.2"
schemars = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
oxplow-app = { workspace = true }
oxplow-sdk = { workspace = true }
tempfile = { workspace = true }
url = { workspace = true }

[lints]
workspace = true
