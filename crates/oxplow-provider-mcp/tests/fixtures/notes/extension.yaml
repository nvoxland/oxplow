manifest: 2
name: notes
description: Notes from the oxplow-provider-mcp-notes MCP server, as tasks, through oxplow's MCP adapter.
engine: ">=0.7"
intent:
  purpose: >-
    Prove the MCP adapter: an MCP server's notes become tasks, and
    oxplow.task.create / update / transition reach it as tool calls through
    a Starlark mapping.
  origin: null
  examples:
    - name: create
      input: { command: create, input: { title: First note } }
      expect: the new note's URI (oxplow:oxplow/task?id=N-<n>&provider=notes)
permissions: [process.run]
providers:
  - id: notes
    capability: task_tracker
    adapter:
      mcp: { command: [bin/notes-server] }
      mapping: mcp/notes.star
      tools: mcp/tools.json
    declarations: provider.json
    # A note's states, one in each of core's buckets.
    stages:
      - { id: someday, title: Someday, bucket: backlog }
      - { id: open, title: Open, bucket: todo }
      - { id: doing, title: Doing, bucket: in_progress }
      - { id: stuck, title: Stuck, bucket: blocked }
      - { id: closed, title: Closed, bucket: done }
      - { id: dropped, title: Dropped, bucket: canceled }
