uuid = { workspace = true, features = ["v5"] }
oxplow-workspace-hack = { version = "0.1", path = "../oxplow-workspace-hack" }

[dev-dependencies]
oxplow-app = { workspace = true }
oxplow-sdk = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
