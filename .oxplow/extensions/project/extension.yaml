manifest: 2
name: project
description: This repository's own collectors, measures and metrics.
intent:
  purpose: >-
    Measure what this repository cares about beyond oxplow's built-in code
    metrics: Rust and TypeScript idioms, type coverage, and the test,
    coverage and clippy reports its test and lint runs write.
# Its scan collectors read this repository's code.
permissions: [files.read]
measures:
- key: repo.type_coverage
  unit: '%'
  subjectKind: repo
  temporalSemantics: semi-additive
  fold: last
- key: repo.rust_clone
  unit: count
  subjectKind: file
  temporalSemantics: semi-additive
  fold: last
- key: repo.rust_allow
  unit: count
  subjectKind: file
  temporalSemantics: semi-additive
  fold: last
- key: repo.eslint_disable
  unit: count
  subjectKind: file
  temporalSemantics: semi-additive
  fold: last
- key: repo.react_use_effect
  unit: count
  subjectKind: file
  temporalSemantics: semi-additive
  fold: last
- key: repo.rust_shared_state
  unit: count
  subjectKind: file
  temporalSemantics: semi-additive
  fold: last
- key: repo.rust_async_fn
  unit: count
  subjectKind: file
  temporalSemantics: semi-additive
  fold: last
- key: repo.ts_as_cast
  unit: count
  subjectKind: file
  temporalSemantics: semi-additive
  fold: last
- key: repo.dangerous_html
  unit: count
  subjectKind: file
  temporalSemantics: semi-additive
  fold: last
- key: repo.skipped_tests
  unit: count
  subjectKind: file
  temporalSemantics: semi-additive
  fold: last
- key: repo.focused_tests
  unit: count
  subjectKind: file
  temporalSemantics: semi-additive
  fold: last
- key: repo.file_loc
  unit: count
  subjectKind: file
  temporalSemantics: semi-additive
  fold: last
- key: repo.ts_as_any
  unit: count
  subjectKind: file
  temporalSemantics: semi-additive
  fold: last
- key: repo.eval_usage
  unit: count
  subjectKind: file
  temporalSemantics: semi-additive
  fold: last
- key: repo.rust_dyn
  unit: count
  subjectKind: file
  temporalSemantics: semi-additive
  fold: last
- key: repo.file_imports
  unit: count
  subjectKind: file
  temporalSemantics: semi-additive
  fold: last
- key: repo.innerhtml_assign
  unit: count
  subjectKind: file
  temporalSemantics: semi-additive
  fold: last
- key: repo.ts_hooks
  unit: count
  subjectKind: file
  temporalSemantics: semi-additive
  fold: last
- key: repo.hardcoded_secrets
  unit: count
  subjectKind: file
  temporalSemantics: semi-additive
  fold: last
- key: repo.hardcoded_colors
  unit: count
  subjectKind: file
  temporalSemantics: semi-additive
  fold: last
- key: repo.css_important
  unit: count
  subjectKind: file
  temporalSemantics: semi-additive
  fold: last
- key: repo.inline_styles
  unit: count
  subjectKind: file
  temporalSemantics: semi-additive
  fold: last
metrics:
- key: repo.rust_clone
  title: .clone() calls
  measure: repo.rust_clone
  expression: "SUM(value)"
  unit: count
  direction: neutral
  displayKind: gauge
  category: static-quality
  language: rust
  description: .clone() call sites — allocation/perf awareness.
- key: repo.rust_allow
  title: Rust lint suppressions
  measure: repo.rust_allow
  expression: "SUM(value)"
  unit: count
  direction: lower-better
  displayKind: gauge
  category: static-quality
  language: rust
  description: '#[allow(...)] attributes — Rust lints being hidden.'
- key: repo.eslint_disable
  title: ESLint suppressions
  measure: repo.eslint_disable
  expression: "SUM(value)"
  unit: count
  direction: lower-better
  displayKind: gauge
  category: static-quality
  language: typescript
  description: eslint-disable directives — TS/JS lints being hidden.
- key: repo.react_use_effect
  title: useEffect calls
  measure: repo.react_use_effect
  expression: "SUM(value)"
  unit: count
  direction: neutral
  displayKind: gauge
  category: static-quality
  language: typescript
  description: useEffect call sites — a re-render/complexity signal.
- key: repo.rust_shared_state
  title: Arc/Mutex/RwLock usages
  measure: repo.rust_shared_state
  expression: "SUM(value)"
  unit: count
  direction: neutral
  displayKind: gauge
  category: static-quality
  language: rust
  description: Arc/Mutex/RwLock type usages — shared-state / concurrency-complexity signal.
- key: repo.rust_async_fn
  title: async fn count
  measure: repo.rust_async_fn
  expression: "SUM(value)"
  unit: count
  direction: neutral
  displayKind: gauge
  category: static-quality
  language: rust
  description: '`async fn` definitions — async surface density.'
- key: repo.ts_as_cast
  title: as-cast assertions
  measure: repo.ts_as_cast
  expression: "SUM(value)"
  unit: count
  direction: lower-better
  displayKind: gauge
  category: static-quality
  language: typescript
  description: '`x as T` type-assertion casts — a type-safety escape hatch.'
- key: repo.dangerous_html
  title: dangerouslySetInnerHTML
  measure: repo.dangerous_html
  expression: "SUM(value)"
  unit: count
  direction: lower-better
  displayKind: gauge
  category: static-quality
  language: typescript
  description: dangerouslySetInnerHTML usages — XSS-injection surface.
- key: repo.skipped_tests
  title: Skipped / ignored tests
  measure: repo.skipped_tests
  expression: "SUM(value)"
  unit: count
  direction: lower-better
  displayKind: gauge
  category: testing
  description: '`#[ignore]` (Rust) + `.skip`/`.todo` (TS test files) — hidden test debt.'
- key: repo.complexity_max
  title: Max cyclomatic complexity
  measure: oxplow.complexity
  expression: "MAX(value)"
  unit: count
  direction: lower-better
  displayKind: gauge
  category: static-quality
  description: The single most cyclomatically-complex function in the tree.
- key: repo.complexity_avg
  title: Avg cyclomatic complexity
  measure: oxplow.complexity
  expression: "AVG(value)"
  direction: lower-better
  displayKind: gauge
  category: static-quality
  description: Mean cyclomatic complexity across all functions.
- key: repo.fn_length_max
  title: Longest function
  measure: oxplow.fn_length
  expression: "MAX(value)"
  unit: lines
  direction: lower-better
  displayKind: gauge
  category: static-quality
  description: Length (lines) of the longest function in the tree.
- key: repo.focused_tests
  title: Focused (.only) tests
  measure: repo.focused_tests
  expression: "SUM(value)"
  unit: count
  direction: lower-better
  displayKind: gauge
  category: testing
  description: '`.only` focused tests — a committed one disables the rest of the suite.'
- key: repo.total_loc
  title: Total lines of code
  measure: repo.file_loc
  expression: "SUM(value)"
  unit: lines
  direction: neutral
  displayKind: gauge
  category: static-quality
  description: Total lines across .rs/.ts/.tsx source files — a size trend.
- key: repo.max_file_loc
  title: Largest file
  measure: repo.file_loc
  expression: "MAX(value)"
  unit: lines
  direction: lower-better
  displayKind: gauge
  category: static-quality
  description: Line count of the largest source file (god-file / generated-blob detector).
- key: repo.ts_as_any
  title: as-any casts
  measure: repo.ts_as_any
  expression: "SUM(value)"
  unit: count
  direction: lower-better
  displayKind: gauge
  category: static-quality
  language: typescript
  description: '`x as any` casts — silences all type-checking on the value.'
- key: repo.eval_usage
  title: eval() usage
  measure: repo.eval_usage
  expression: "SUM(value)"
  unit: count
  direction: lower-better
  displayKind: gauge
  category: static-quality
  language: typescript
  description: '`eval(...)` calls — dynamic-code-execution / injection surface.'
- key: repo.parameter_count_max
  title: Most parameters
  measure: oxplow.parameter_count
  expression: "MAX(value)"
  unit: count
  direction: lower-better
  displayKind: gauge
  category: static-quality
  description: Largest parameter list of any function in the tree.
- key: repo.rust_dyn
  title: dyn dispatch usages
  measure: repo.rust_dyn
  expression: "SUM(value)"
  unit: count
  direction: neutral
  displayKind: gauge
  category: static-quality
  language: rust
  description: '`dyn Trait` dynamic-dispatch usages — runtime-dispatch / indirection signal.'
- key: repo.total_imports
  title: Total imports
  measure: repo.file_imports
  expression: "SUM(value)"
  unit: count
  direction: neutral
  displayKind: gauge
  category: static-quality
  language: typescript
  description: Total `import` statements across TS files — module-coupling trend.
- key: repo.max_file_imports
  title: Most imports in a file
  measure: repo.file_imports
  expression: "MAX(value)"
  unit: count
  direction: lower-better
  displayKind: gauge
  category: static-quality
  language: typescript
  description: Import count of the most-coupled TS file (fan-out hotspot).
- key: repo.innerhtml_assign
  title: innerHTML assignments
  measure: repo.innerhtml_assign
  expression: "SUM(value)"
  unit: count
  direction: lower-better
  displayKind: gauge
  category: static-quality
  language: typescript
  description: '`x.innerHTML = …` assignments — XSS-injection surface.'
- key: repo.ts_hooks
  title: React hook calls
  measure: repo.ts_hooks
  expression: "SUM(value)"
  unit: count
  direction: neutral
  displayKind: gauge
  category: static-quality
  language: typescript
  description: React hook call sites (useState/useEffect/useMemo/…) — re-render/complexity density.
- key: repo.hardcoded_secrets
  title: Hardcoded secrets
  measure: repo.hardcoded_secrets
  expression: "SUM(value)"
  unit: count
  direction: lower-better
  displayKind: gauge
  category: static-quality
  description: String literals matching AWS/GitHub/Slack/PEM/Google secret shapes — should be 0.
- key: repo.hardcoded_colors
  title: Hardcoded colors
  measure: repo.hardcoded_colors
  expression: "SUM(value)"
  unit: count
  direction: lower-better
  displayKind: gauge
  category: static-quality
  language: typescript
  description: Hex/rgb color literals in TS/TSX — should be a var(--…), see theming.md.
- key: repo.css_important
  title: '!important uses'
  measure: repo.css_important
  expression: "SUM(value)"
  unit: count
  direction: lower-better
  displayKind: gauge
  category: static-quality
  description: '!important declarations — the specificity escape hatch (theming.md).'
- key: repo.inline_styles
  title: Inline style objects
  measure: repo.inline_styles
  expression: "SUM(value)"
  unit: count
  direction: neutral
  displayKind: gauge
  category: static-quality
  language: typescript
  description: style={…} JSX attributes — inline-style density / migration pressure (theming.md).
- key: repo.type_coverage
  title: Type coverage
  measure: repo.type_coverage
  expression: "RATIO(num, den)"
  unit: '%'
  direction: higher-better
  displayKind: coverage
  category: coverage
  language: typescript
  description: '% of TS expressions with a non-any type (the type-coverage tool).'
collectors:
- id: tests.rust_coverage
  doc: Coverage of the Rust workspace (cargo cov).
  records: coverage
  entry: oxplow:lcov
  report:
    path: target/coverage/lcov.info
  on: { run: test }
- id: tests.rust_junit
  doc: The Rust test cases (nextest JUnit).
  records: tests
  entry: oxplow:junit
  report:
    path: target/nextest/default/junit.xml
  on: { run: test }
- id: tests.extension_junit
  doc: The extensions' tests (`bun run test:ext`, JUnit).
  records: tests
  entry: oxplow:junit
  report:
    path: target/extension-tests/junit.xml
  on: { run: test }
- id: tests.desktop_junit
  doc: The desktop test cases (bun JUnit).
  records: tests
  entry: oxplow:junit
  report:
    path: apps/desktop/test-report.xml
  on: { run: test }
- id: lint.clippy
  doc: Clippy findings (lint:collect).
  records: analysis
  entry: oxplow:clippy
  report:
    path: target/clippy.json
  on: { run: analysis }
- id: repo.scan_clone
  doc: Rust .clone() scan
  runtime: starlark
  entry: collectors/repo_clone.star
  on:
  - snapshot.taken
  settle: 30s
  facts:
  - repo.rust_clone
- id: repo.scan_allow
  doc: Rust
  runtime: starlark
  entry: collectors/repo_allow.star
  on:
  - snapshot.taken
  settle: 30s
  facts:
  - repo.rust_allow
- id: repo.scan_use_effect
  doc: React useEffect scan
  runtime: starlark
  entry: collectors/repo_use_effect.star
  on:
  - snapshot.taken
  settle: 30s
  facts:
  - repo.react_use_effect
- id: repo.scan_eslint
  doc: ESLint suppression scan
  runtime: starlark
  entry: collectors/repo_eslint.star
  on:
  - snapshot.taken
  settle: 30s
  facts:
  - repo.eslint_disable
- id: repo.scan_shared_state
  doc: Rust Arc/Mutex/RwLock scan
  runtime: starlark
  entry: collectors/repo_shared_state.star
  on:
  - snapshot.taken
  settle: 30s
  facts:
  - repo.rust_shared_state
- id: repo.scan_async_fn
  doc: Rust async fn scan
  runtime: starlark
  entry: collectors/repo_async_fn.star
  on:
  - snapshot.taken
  settle: 30s
  facts:
  - repo.rust_async_fn
- id: repo.scan_as_cast
  doc: TS as-cast scan
  runtime: starlark
  entry: collectors/repo_as_cast.star
  on:
  - snapshot.taken
  settle: 30s
  facts:
  - repo.ts_as_cast
- id: repo.scan_dangerous_html
  doc: dangerouslySetInnerHTML scan
  runtime: starlark
  entry: collectors/repo_dangerous_html.star
  on:
  - snapshot.taken
  settle: 30s
  facts:
  - repo.dangerous_html
- id: repo.scan_skipped_tests
  doc: Skipped/ignored test scan
  runtime: starlark
  entry: collectors/repo_skipped_tests.star
  on:
  - snapshot.taken
  settle: 30s
  facts:
  - repo.skipped_tests
- id: repo.scan_focused_tests
  doc: Focused (.only) test scan
  runtime: starlark
  entry: collectors/repo_focused_tests.star
  on:
  - snapshot.taken
  settle: 30s
  facts:
  - repo.focused_tests
- id: repo.scan_file_loc
  doc: File LOC scan
  runtime: starlark
  entry: collectors/repo_file_loc.star
  on:
  - snapshot.taken
  settle: 30s
  facts:
  - repo.file_loc
- id: repo.scan_as_any
  doc: TS as-any scan
  runtime: starlark
  entry: collectors/repo_as_any.star
  on:
  - snapshot.taken
  settle: 30s
  facts:
  - repo.ts_as_any
- id: repo.scan_eval
  doc: eval() scan
  runtime: starlark
  entry: collectors/repo_eval.star
  on:
  - snapshot.taken
  settle: 30s
  facts:
  - repo.eval_usage
- id: repo.scan_dyn
  doc: Rust dyn dispatch scan
  runtime: starlark
  entry: collectors/repo_dyn.star
  on:
  - snapshot.taken
  settle: 30s
  facts:
  - repo.rust_dyn
- id: repo.scan_imports
  doc: TS import scan
  runtime: starlark
  entry: collectors/repo_imports.star
  on:
  - snapshot.taken
  settle: 30s
  facts:
  - repo.file_imports
- id: repo.scan_innerhtml
  doc: innerHTML assignment scan
  runtime: starlark
  entry: collectors/repo_innerhtml.star
  on:
  - snapshot.taken
  settle: 30s
  facts:
  - repo.innerhtml_assign
- id: repo.scan_hooks
  doc: React hook scan
  runtime: starlark
  entry: collectors/repo_hooks.star
  on:
  - snapshot.taken
  settle: 30s
  facts:
  - repo.ts_hooks
- id: repo.scan_secrets
  doc: Hardcoded-secret scan
  runtime: starlark
  entry: collectors/repo_secrets.star
  on:
  - snapshot.taken
  settle: 30s
  at_most: 5m
  facts:
  - repo.hardcoded_secrets
- id: repo.scan_hardcoded_colors
  doc: Hardcoded-color scan
  runtime: starlark
  entry: collectors/repo_hardcoded_colors.star
  on:
  - snapshot.taken
  settle: 30s
  at_most: 5m
  facts:
  - repo.hardcoded_colors
- id: repo.scan_css_important
  doc: css !important scan
  runtime: starlark
  entry: collectors/repo_css_important.star
  on:
  - snapshot.taken
  settle: 30s
  facts:
  - repo.css_important
- id: repo.scan_inline_styles
  doc: Inline style-object scan
  runtime: starlark
  entry: collectors/repo_inline_styles.star
  on:
  - snapshot.taken
  settle: 30s
  facts:
  - repo.inline_styles
- id: repo.scan_type_coverage
  doc: TypeScript type coverage
  runtime: jaq
  entry: collectors/type_coverage.jq
  on:
  - snapshot.taken
  settle: 30s
  report:
    path: target/type-coverage.json
    format: text
  facts:
  - repo.type_coverage
