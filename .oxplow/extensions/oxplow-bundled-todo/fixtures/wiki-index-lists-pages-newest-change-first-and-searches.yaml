# The wiki: pages not visited, newest change first; a search lists the pages
# whose title or body holds it, with the text around the match; the visited
# pages list apart.
given:
  - { command: oxplow.knowledge.write_page, input: { slug: alpha, title: Alpha, body: "# Alpha\n\nThe quick brown fox jumps.\n" } }
  - { command: oxplow.knowledge.write_page, input: { slug: beta, title: Beta, body: "# Beta\n\nNothing here.\n" } }
  - { command: oxplow.knowledge.write_page, input: { slug: gamma, title: Gamma, body: "# Gamma\n\nA lazy dog sleeps.\n" } }
  - observe: { visit: { page: "oxplow:oxplow/wiki?slug=beta", kind: wiki, label: Beta, thread: thr1 } }
when: { page: oxplow/wiki-index, params: { stream_id: 1 } }
expect:
  loaders:
    visited:
      rows:
        - { slug: beta, title: Beta }
    pages:
      rows:
        - { slug: gamma }
        - { slug: alpha }
steps:
  - params: { stream_id: 1, filter: LAZY }
    expect:
      loaders:
        visited: { rows: 0 }
        pages: { rows: [{ slug: gamma, snippet: "# Gamma  A lazy dog sleeps. " }] }
  - params: { stream_id: 1, filter: beta }
    expect: { loaders: { pages: { rows: [{ slug: beta }] } } }
  - params: { stream_id: 1, filter: x }
    expect: { loaders: { visited: { rows: 0 } } }
