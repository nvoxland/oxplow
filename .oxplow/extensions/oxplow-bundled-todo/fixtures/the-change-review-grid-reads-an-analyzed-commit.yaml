# The change-review grid reads a real analyzed commit: the summary, the
# functions that changed and the test files.
given:
  - observe: { turn: { prompt: base lib, write: { path: src/lib.rs, body: "fn grow(a: u32) -> u32 {\n    a\n}\n" } } }
  - observe: { turn: { prompt: base test, write: { path: tests/it.rs, body: "fn t() {}\n" } } }
  - { command: oxplow.vcs.stage, input: { stream: str1, paths: [src/lib.rs, tests/it.rs] } }
  - { command: oxplow.vcs.commit, input: { stream: str1, message: base } }
  - observe: { turn: { prompt: grow, write: { path: src/lib.rs, body: "fn grow(a: u32, b: u32) -> u32 {\n    if a > b {\n        a\n    } else {\n        b\n    }\n}\n" } } }
  - observe: { turn: { prompt: more tests, write: { path: tests/it.rs, body: "fn t() {}\nfn u() {}\n" } } }
  - { command: oxplow.vcs.stage, input: { stream: str1, paths: [src/lib.rs, tests/it.rs] } }
  - { command: oxplow.vcs.commit, input: { stream: str1, message: change }, bind: change }
  - observe: { analyze: { kind: commit, sha: $change.rev } }
# The analyzed commit is the first change this oxplow made.
when: { part: oxplow-bundled-todo/change-review, params: { change_id: 1 } }
expect:
  loaders:
    change_summary:
      rows:
        - { summary: "**2 files** · +7 −2 · 0 added, 2 modified, 0 deleted · 1 test file · test/code lines 12%" }
    change_functions:
      rows:
        - { function: grow, what: signature, uri: "oxplow:oxplow/symbol?path=src/lib.rs&symbol=grow" }
    change_test_files:
      rows:
        - { path: tests/it.rs }
