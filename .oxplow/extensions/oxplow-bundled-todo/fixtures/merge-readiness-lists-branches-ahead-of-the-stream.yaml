# Merge Readiness: with one branch nothing is ahead, so the page says so.
given:
  - observe: { commit: { sha: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", at: "2023-11-14T22:13:20Z", author: Ada, subject: first } }
  - observe:
      refs:
        branches: [{ name: main, head: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", stream: 1, default: true }]
        heads: [{ stream: 1, sha: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" }]
when: { page: oxplow-bundled-todo/merge-readiness, params: { stream_id: 1 } }
expect:
  loaders:
    row: { rows: [{ branch: main }] }
    readiness: { rows: 0 }
