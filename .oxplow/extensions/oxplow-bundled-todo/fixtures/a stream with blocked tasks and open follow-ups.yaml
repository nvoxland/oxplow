# Blocked work items and open notes-to-self are listed, and the page's
# alert fires while anything waits.
given:
  - { command: oxplow.work_item.create, input: { title: Wait for the API key, state: blocked, thread: thr1 } }
  - { command: oxplow.work_item.create, input: { title: Ship it, thread: thr1 } }
when: { page: oxplow/waiting-on-me }
expect:
  loaders:
    waiting_on_me:
      rows: [{ what: Blocked, title: Wait for the API key }]
  alert: { firing: true, message: "Waiting on you: 1" }
