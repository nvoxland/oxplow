# The stream-level review starters list the viewer's stream's decisions and
# its unbacked claims, newest first.
given:
  - { command: oxplow.work_item.create, input: { title: Export, thread: thr1 }, bind: item }
  - { command: oxplow.work_item.transition, input: { uri: $item.uri, to: in_progress } }
  - observe: { turn: { prompt: Export it } }
  - command: oxplow.effort.replace_inferred_decisions
    input: { effort: eff1, decisions: [{ question: Where does export live?, choice: src/export, alternatives: [], why: "" }] }
  - command: oxplow.effort.replace_inferred_claims
    input: { effort: eff1, claims: [{ statement: tests pass, kind: tests_pass }, { statement: handles empty, kind: tests_pass, evidence: "test:empty" }] }
when: { page: oxplow/recent-decisions, params: { stream_id: 1 } }
expect:
  loaders:
    recent_decisions: { rows: [{ question: Where does export live? }] }
steps:
  - when: { page: oxplow/unbacked-claims, params: { stream_id: 1 } }
    expect:
      loaders:
        unbacked_claims: { rows: [{ statement: tests pass }] }
  - when: { page: oxplow/unbacked-claims, params: { stream_id: 999 } }
    expect:
      loaders:
        unbacked_claims: { rows: 0 }
