# Disabled again while its repair item is open: a comment on it, not a
# second item.
given:
  - command: oxplow.work_item.create
    input:
      title: "Repair work hot: boom"
      links: [{ target: "oxplow:oxplow/collector?collector=work/hot", link_type: about }]
when:
  event:
    type: contribution.disabled
    payload: { contribution: "oxplow:oxplow/collector?collector=work/hot", reason: "3 failures in a row; the last: boom again" }
expect:
  effects: [{ id: oxplow/repair-disabled, state: ok }]
  commands: [oxplow.work_item.comment]
