# Git History drawn as a graph: a row per commit, a merge's second parent
# on a lane of its own, a filter that dims the rows it doesn't match (and
# is the page's `q`), and a row that opens its commit.
given:
  - observe: { commit: { sha: m1, at: "2026-01-01T00:00:00Z", subject: Main work, files: [{ path: main.txt }] } }
  - observe: { commit: { sha: s1, at: "2026-01-02T00:00:00Z", subject: Side work, parents: [m1], files: [{ path: side.txt }] } }
  - observe: { commit: { sha: m2, at: "2026-01-03T00:00:00Z", subject: Main again, parents: [m1], files: [{ path: main.txt }] } }
  - observe: { commit: { sha: mg, at: "2026-01-04T00:00:00Z", subject: Merge side, parents: [m2, s1], files: [] } }
when: { page: oxplow-foundation/git-history, params: { stream_id: 1, head_sha: mg } }
steps:
  - ui:
      - expect: { count: { ".row": 4 }, text: { ".row": { contains: "Merge side" } } }
      # The merge's second parent is on a lane of its own.
      - expect: { count: { '.row[data-sha="s1"] circle.node-1': 1 } }
      - fill: { "#query": side work }
      - expect: { count: { ".row:not(.dimmed)": 1 }, view_params: { q: side work } }
      - fill: { "#query": "" }
      - click: '.row[data-sha="m1"]'
      - expect: { navigated: $any }
