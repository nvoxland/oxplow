# Settings → Data lists the effects oxplow's own extensions declare:
# bundled's four.
when: { page: oxplow/settings, params: { area: data } }
expect:
  loaders:
    data_effects:
      rows:
        - { effect: oxplow/infer-reasoning }
        - { effect: oxplow/repair-disabled }
        - { effect: oxplow/store-reasoning }
        - { effect: oxplow/verify-unchecked }
