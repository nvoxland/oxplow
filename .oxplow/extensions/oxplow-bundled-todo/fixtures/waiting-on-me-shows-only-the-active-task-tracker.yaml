# Waiting on Me lists blocked items from the active task tracker only.
given:
  - { command: oxplow.effort.open, input: { thread: thr1 } }
  - { command: oxplow.task.create, input: { title: Next up, stage: todo, assignee: thr1 } }
  - { command: oxplow.task.create, input: { title: Stuck, stage: blocked, assignee: thr1 } }
  - { command: oxplow.task.create, input: { title: Someday } }
when: { page: oxplow/waiting-on-me }
expect: { loaders: { waiting_on_me: { rows: [{ what: Blocked, title: Stuck }] } } }
steps:
  - given:
      - { command: oxplow.capability.choose, input: { capability: task_tracker, provider: none }, confirmed: true }
  - expect: { loaders: { waiting_on_me: { rows: 0 } } }
