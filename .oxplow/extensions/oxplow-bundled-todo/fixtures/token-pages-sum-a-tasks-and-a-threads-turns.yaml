# Token usage on a thread: its turns' total; an idle thread shows nothing.
# (A task's own is bundled's task-tokens.)
given:
  - { command: oxplow.task.create, input: { title: Fix it, assignee: thr1 }, bind: item }
  - { command: oxplow.task.transition, input: { uri: $item.uri, to: in_progress } }
  - observe: { token_usage: { effort: eff1, prompt: fix it, input_tokens: 1999, output_tokens: 1 } }
  - observe: { token_usage: { effort: eff1, prompt: again, input_tokens: 99, output_tokens: 1 } }
  - observe: { token_usage: { prompt: chat, input_tokens: 9, output_tokens: 1 } }
when: { part: oxplow/thread-tokens, params: { thread_id: 1 } }
expect: { loaders: { thread_tokens: { rows: [{ tokens: 2110 }] } } }
steps:
  - when: { part: oxplow/thread-tokens, params: { thread_id: 999 } }
    expect: { loaders: { thread_tokens: { rows: 0 } } }
