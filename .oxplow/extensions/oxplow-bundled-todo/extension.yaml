manifest: 2
name: oxplow-bundled-todo
# Its commands are oxplow's own: `oxplow.<area>.<verb>`, like core's.
namespace: oxplow
# The datasets and event types it reads are oxplow-bundled's.
requires: [oxplow-bundled]
description: Oxplow's own contributions that haven't been reviewed yet, off and not shipped; each moves to oxplow-bundled once it is cleaned up, and this goes away when none are left. Holds the request review (Change Analysis, Tests Weakened, co-change), the agent-interface, extension-run, job-run, merge and branch pages, Explore Data, the history graph and the shared-files advisories.
engine: ">=0.7"
# What it reaches beyond the baseline: its effects and commands read with
# their own SQL, its jobs and effects ask models, and its advisories and skills speak to the agent.
permissions: [sql.read, files.read, ai.compute, agent.write]
# Its Explore Data component is TypeScript (src/), built into
# dist/ when oxplow is built and on every deploy; dist/ and node_modules/
# aren't committed.
build: { run: "bun install --frozen-lockfile && bun run build", output: dist, exclude: [node_modules] }
intent:
  purpose: >-
    Show what a reviewer must check in an agent's work — the tests it
    weakened — and how the code moved:
    duplication and co-change.
  origin: null
  examples:
    - name: settings-lists-a-replaced-component-and-choosing-one-is-a-config-write
      input: { page: oxplow/settings, params: { area: integrations } }
      expect: the history graph's replacement can be chosen
    - name: merge-readiness-lists-branches-ahead-of-the-stream
      input: { page: merge-readiness, params: { stream_id: 1 } }
      expect: nothing is ahead with one branch, so the list is empty
    - name: remote-branches-lists-the-latest-first
      input: { page: remote-branches, params: { stream_id: 1 } }
      expect: the remote's branches newest first, and no local branch
    - name: extension runs over the last week
      input: { page: runs, params: {} }
      expect: each extension's runs, failures, denials, mean CPU and model calls, the ones needing attention first
    - name: the-interest-dataset-scores-a-change-like-the-old-formula
      input: { sql: v_oxplow_change_interest }
      expect: size, complexity spikes, parameter growth and long new functions multiply into a score and its reasons
    - name: co-change-surprises-come-from-the-commit-index
      input: { sql: v_oxplow_change_co_change }
      expect: a file whose usual partners are missing, or that was dormant 90 days, is a surprise
    - name: the-history-graph-draws-lanes-filters-and-opens-a-commit
      input: { page: oxplow/git-history }
      expect: a row per commit, a lane for a merge's second parent, a filter that dims, a row that opens its commit
    - name: explore-data-says-why-a-query-is-refused
      input: { page: explore-data }
      expect: a refused query shows its reason in the explorer and draws nothing
    - name: the-component-page-links-its-commands-to-their-definitions
      input: { page: oxplow/custom-component, params: { uri: "oxplow:oxplow/custom_component?custom_component=oxplow/explore-data" } }
      expect: a component's commands open each command's definition
    - name: data-effect-backfill-says-what-bundled-effect-would-do
      input: { part: oxplow/data-effect-backfill }
      expect: a bundled effect's backfill says there is nothing to catch up on
    - name: settings-data-area-lists-bundled-effects
      input: { page: oxplow/settings, params: { area: data } }
      expect: Settings → Data lists bundled's four effects
    - name: tests-weakened-reports-deleted-tests-fewer-assertions-and-skips
      input: { part: tests-weakened }
      expect: deleted tests, fewer assertions and new skips in a change
    - name: the-change-review-grid-reads-an-analyzed-commit
      input: { part: change-review, params: { change_id: 1 } }
      expect: the summary, the changed functions and the test files of an analyzed commit
ui:
  mounts:
    - { page: extension-runs, at: oxplow/extension.runs }
    - { page: change-review, at: oxplow/diff-view.sections }
    - { page: change-review, at: oxplow/commit.sections }
    - { page: change-review, at: oxplow/uncommitted-changes.sections }
    - { page: file-co-change, at: oxplow/diff.file-header }
    - { page: tests-weakened, at: oxplow/diff-view.sections }
    - { page: tests-weakened, at: oxplow/commit.sections }
    - { page: tests-weakened, at: oxplow/uncommitted-changes.sections }
    # Git History's commits drawn as a graph, in place of oxplow's plain
    # list (`vcs.history.graph`, a target no provider binds). It only shows
    # and opens commits, so it isn't a program to approve.
    - { page: history-graph, at: vcs.history.graph, version: 2 }
custom_components:
  # Explore Data: an SQL box and a viz picker over the datasets; oxplow draws
  # the result under it with its own components (`showView`: an inline page).
  # Built from src/ into dist/ (bun build, no dependencies).
  - { id: explore-data, title: Explore Data, bundle: dist/explore-data, sql: read, commands: [oxplow.page.draft_with_agent], description: "An SQL box and a viz picker over the datasets, to try a query and see its result drawn." }
  - { id: history-graph, title: History graph, description: "The commits of the project drawn as lanes by branch, with filters by message, author and branch." }
advisories:
  # A hint that ran a hundred times and never once spoke is dead weight, or
  # watching for something that can't happen here. Once per hint; this one
  # is left out of its own count.
  - id: hint-never-fires
    on: turn-end
    audience: person
    once_per: row
    query: |
      SELECT hint AS key,
             'The hint ' || hint || ' has been evaluated ' || sum(evaluated)
             || ' times and has never fired. Its condition may be one this project never meets; '
             || 'see Agent Interface → Hints.' AS message
      FROM v_hint_stat
      WHERE hint <> 'oxplow/hint-never-fires'
      GROUP BY hint
      HAVING sum(evaluated) >= 100 AND sum(fired) = 0
  # Requests on different threads, running or lately finished, that changed
  # the same file within the window: duplicate or colliding work, shown to the person once per
  # pair of threads. Either thread's turn end can raise it; the Alert that
  # exists already (its text opens with the pair) silences the other. It
  # never refuses anything: an item stays with its thread.
  - id: shared-files
    on: turn-end
    audience: person
    once_per: row
    query: |
      WITH recent AS (
        -- The files a thread's turns changed lately, in requests running or
        -- recently finished; a file two concurrent turns could each have
        -- changed (`shared`) is no evidence.
        SELECT t.thread_id, f.path
        FROM v_turn_file f
        JOIN v_agent_turn t ON t.uri = f.turn
        JOIN v_request r ON r.uri = t.request
        WHERE f.confidence <> 'shared'
          AND julianday(f.last_changed_at) >= julianday('now') - config('/sharedFiles/windowMinutes') / 1440.0
          AND (r.state <> 'finished'
               OR julianday(r.last_activity_at) >= julianday('now') - config('/sharedFiles/windowMinutes') / 1440.0)
        GROUP BY t.thread_id, f.path
      ), shared AS (
        SELECT min(a.thread_id, b.thread_id) AS lo, max(a.thread_id, b.thread_id) AS hi, a.path
        FROM recent a JOIN recent b ON b.path = a.path AND b.thread_id <> a.thread_id
        WHERE a.thread_id = :thread_id
        GROUP BY 1, 2, 3
      ), pairs AS (
        SELECT lo, hi,
               '“' || (SELECT title FROM v_thread WHERE id = lo) || '” and “'
                   || (SELECT title FROM v_thread WHERE id = hi) || '” both changed ' AS lead,
               (SELECT group_concat(path, ', ') FROM
                 (SELECT path FROM shared s WHERE s.lo = p.lo AND s.hi = p.hi ORDER BY path LIMIT 5)) AS files
        FROM (SELECT DISTINCT lo, hi FROM shared) p
      )
      SELECT lo || '-' || hi AS key,
             lead || files || '. Two threads on the same files may duplicate or collide; '
             || 'nothing stops either, and each item stays on its own thread.' AS message
      FROM pairs
      WHERE NOT EXISTS (SELECT 1 FROM v_agent_nudge n
                         WHERE n.kind = 'oxplow/shared-files'
                           AND substr(n.message, 1, length(pairs.lead)) = pairs.lead)
  # The same overlap, said to the agent once per thread: what to look at
  # before duplicating the other thread's work.
  - id: shared-files-agent
    on: turn-end
    once_per: thread
    query: |
      WITH recent AS (
        -- The files a thread's turns changed lately, in requests running or
        -- recently finished; a file two concurrent turns could each have
        -- changed (`shared`) is no evidence.
        SELECT t.thread_id, f.path
        FROM v_turn_file f
        JOIN v_agent_turn t ON t.uri = f.turn
        JOIN v_request r ON r.uri = t.request
        WHERE f.confidence <> 'shared'
          AND julianday(f.last_changed_at) >= julianday('now') - config('/sharedFiles/windowMinutes') / 1440.0
          AND (r.state <> 'finished'
               OR julianday(r.last_activity_at) >= julianday('now') - config('/sharedFiles/windowMinutes') / 1440.0)
        GROUP BY t.thread_id, f.path
      ), shared AS (
        SELECT b.thread_id AS other, a.path
        FROM recent a JOIN recent b ON b.path = a.path AND b.thread_id <> a.thread_id
        WHERE a.thread_id = :thread_id
      )
      SELECT 'Another thread’s request (“' || (SELECT title FROM v_thread WHERE id = other)
             || '”) also changed ' || group_concat(path, ', ')
             || '. Check what that thread is doing before duplicating its work.' AS message
      FROM (SELECT other, path FROM shared ORDER BY path)
      GROUP BY other
configuration:
  version: 1
  schema:
    type: object
    additionalProperties: false
    properties:
      sharedFiles:
        type: object
        additionalProperties: false
        description: The shared-files advisories.
        properties:
          windowMinutes: { type: integer, minimum: 1, default: 60, description: How recent an edit is for two threads' work on the same file to count as overlapping. }
commands:
  - name: advisory_policy.read
    summary: The advisories' effective settings, where each came from, and the stamps a write needs.
    scope: extension_config.read
    op: snapshot
    example: {}
  - name: advisory_policy.write
    summary: Set the advisories' project or personal settings (a compare-and-swap on the stamps `advisory_policy.read` returns).
    scope: extension_config.write
    op: compare_exchange
    example: {"schema_version": 1, "project": {"expected": {"schema_version": 1, "revision": 2}, "values": {"sharedFiles": {"windowMinutes": 30}}}, "personal": null}
