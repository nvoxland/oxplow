configuration:
  version: 1
  schema:
    type: object
    additionalProperties: false
    properties:
      sharedFiles:
        type: object
        additionalProperties: false
        description: The shared-files advisories.
        properties:
          windowMinutes: { type: integer, minimum: 1, description: How recent an edit is for two threads' work on the same file to count as overlapping. }
  defaults:
    sharedFiles: { windowMinutes: 60 }
commands:
  - name: advisory_policy.read
    summary: The advisories' effective settings, where each came from, and the stamps a write needs.
    scope: extension_config.read
    op: snapshot
    example: {}
  - name: advisory_policy.write
    summary: Set the advisories' project or personal settings (a compare-and-swap on the stamps `advisory_policy.read` returns).
    scope: extension_config.write
    op: compare_exchange
    example: {"schema_version": 1, "project": {"expected": {"schema_version": 1, "revision": 2}, "values": {"largeUncommitted": {"files": 20}}}, "personal": null}
  # The person's menu entry for foundation's handoff command.
  # Foundation keeps the command (an agent runs it); this adds the
  # label, shortcut and form a person uses.
  - name: handoff.offer
    summary: "The person's menu entry for `oxplow.handoff.send`: Hand Off Work… on a thread opens the hand-off form."
    scope: handoffs.write
    op: send
    ui: { label: "Hand Off Work…", group: Threads, keywords: [handoff, delegate, give], about: oxplow/thread, form: "oxplow:oxplow/page?page=hand-off" }
    example: {"to_thread": "thr4", "task": "oxplow:oxplow/task?id=tsk12&provider=oxtask", "body": "The parser fix is in; the remaining failure is the timezone case."}
