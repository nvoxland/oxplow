<!doctype html>
<meta charset="utf-8">
<!-- oxplow's look: the kit's classes over the theme, which app.js applies. -->
<link rel="stylesheet" href="/component-lib/oxplow-kit.css">
<link rel="stylesheet" href="app.css">
<div class="tools">
  <input id="query" class="grow" type="search" placeholder="Filter commits (message, sha, author)" aria-label="Filter commits">
  <select id="author" aria-label="Author"><option value="">All authors</option></select>
  <select id="branch" aria-label="Branch"><option value="">All branches</option></select>
  <span id="count" class="ox-muted ox-small"></span>
</div>
<div id="rows" role="list" aria-label="Commits"></div>
<p id="empty" class="ox-muted" hidden>This branch has no history yet.</p>
<p id="status" class="ox-muted ox-small" role="status"></p>
<!-- oxplow's client library (it defines `oxplow`), then this bundle's own
     script. Both are plain scripts: a sandboxed frame can't load modules. -->
<script src="/component-lib/oxplow-component.js"></script>
<script src="app.js"></script>
