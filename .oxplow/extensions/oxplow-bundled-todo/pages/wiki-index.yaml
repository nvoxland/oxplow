title: Wiki
description: The project's wiki pages — the recently visited, then the rest by when they changed; a search lists the pages whose title or body matches.
icon: book-open
category: Knowledge
needs:
- knowledge
params:
- name: stream_id
- name: filter
  role: filter
  label: Search titles + bodies
  default: ''
loaders:
  visited:
    sql: |
      SELECT p.slug, p.title, max(v.visited_at) AS visited_at
      FROM v_page_visit v
      JOIN v_thread t ON t.id = v.thread_id
      JOIN v_knowledge_page p ON p.uri = v.page_id
      WHERE v.page_kind = 'wiki' AND t.stream_id = :stream_id AND :filter = ''
      GROUP BY p.slug
      ORDER BY visited_at DESC
      LIMIT 32
  pages:
    sql: |
      SELECT p.slug, p.title, p.updated_at,
             CASE WHEN :filter = '' THEN p.excerpt
                  WHEN instr(lower(b.body), lower(:filter)) = 0 THEN p.excerpt
                  ELSE replace(substr(b.body, max(1, instr(lower(b.body), lower(:filter)) - 40), 120), char(10), ' ') END AS snippet,
             '@.oxplow/wiki/' || p.slug || '.md ' AS mention
      FROM v_knowledge_page p
      JOIN v_knowledge_body b ON b.uri = p.uri
      WHERE CASE WHEN :filter = ''
                 THEN p.uri NOT IN (
                        SELECT v.page_id FROM v_page_visit v JOIN v_thread t ON t.id = v.thread_id
                        WHERE v.page_kind = 'wiki' AND t.stream_id = :stream_id)
                 ELSE instr(lower(p.title), lower(:filter)) > 0 OR instr(lower(b.body), lower(:filter)) > 0 END
      ORDER BY p.updated_at DESC
view:
  stack:
  - id: visited
    title: Recently visited
    from: visited
    viz: table
    columns:
    - key: title
      label: Page
      link:
        kind: wiki
        from: slug
    - key: visited_at
      label: Visited
      format: relative
      width: 120
    empty: No wiki pages visited yet.
  - id: pages
    title: Wiki pages
    from: pages
    viz: table
    columns:
    - key: title
      label: Page
      link:
        kind: wiki
        from: slug
      highlight: filter
    - key: snippet
      label: Text
      highlight: filter
    - key: updated_at
      label: Modified
      format: relative
      width: 120
    empty: No wiki pages. Use + New, or ask the agent to write down what it learns (pages live in `.oxplow/wiki/`).
    actions:
    - id: new
      label: + New
      command: oxplow.knowledge.write_page
      form: true
      input:
        slug: ''
        body: ''
    - id: ask
      label: Add to agent context
      command: oxplow.agent.draft
      input:
        text: '{{row.mention}}'
      row: true
    - id: delete
      label: Delete
      command: oxplow.knowledge.delete_page
      input:
        slug: '{{row.slug}}'
      row: true
