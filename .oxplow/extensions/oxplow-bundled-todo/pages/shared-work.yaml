title: Shared work
description: 'Where two threads hold the same thing: a task requests on both worked on, a file both changed in the last day, an epic whose children sit on different threads.'
category: Work
loaders:
  shared_work:
    sql: |
      WITH live AS (
        -- Requests running now or finished in the last day.
        SELECT r.uri AS request
        FROM v_request r
        WHERE r.state <> 'finished' OR julianday(r.last_activity_at) >= julianday('now') - 1
      ), live_turns AS (
        SELECT l.request, t.uri AS turn, t.thread_id, th.title AS thread_title
        FROM live l JOIN v_agent_turn t ON t.request = l.request
        JOIN v_thread th ON th.id = t.thread_id
      ), shared AS (
        -- A task requests running or just finished (on any basis) worked on,
        -- from two threads.
        SELECT 'Items on two threads' AS section, w.title AS what, w.uri AS uri,
               group_concat(DISTINCT o.thread_title) AS threads,
               group_concat(DISTINCT o.thread_id) AS thread_ids
        FROM v_request_task rt JOIN live_turns o ON o.request = rt.request
        JOIN v_task w ON w.uri = rt.task
        GROUP BY w.uri HAVING count(DISTINCT o.thread_id) >= 2
        UNION ALL
        -- A file two threads' turns changed; a file two concurrent turns
        -- could each have changed (`shared`) is no evidence.
        SELECT 'Files two threads changed', f.path, NULL,
               group_concat(DISTINCT o.thread_title), group_concat(DISTINCT o.thread_id)
        FROM v_turn_file f JOIN live_turns o ON o.turn = f.turn
        WHERE f.confidence <> 'shared'
        GROUP BY f.path HAVING count(DISTINCT o.thread_id) >= 2
        UNION ALL
        SELECT 'Epics spread over threads', p.title, p.uri,
               group_concat(DISTINCT t.title), group_concat(DISTINCT t.id)
        FROM v_task c JOIN v_task p ON p.uri = c.parent_uri JOIN v_thread t ON t.uri = c.assignee
        WHERE c.closed_at IS NULL
        GROUP BY p.uri HAVING count(DISTINCT t.id) >= 2
      )
      SELECT section, what, threads, uri FROM shared ORDER BY section, what
view:
  from: shared_work
  viz: list
  group:
    by: section
  columns:
  - key: what
    label: What
    link:
      kind: page
      from: uri
  - key: threads
    label: Threads
  empty: Nothing is shared across threads.
