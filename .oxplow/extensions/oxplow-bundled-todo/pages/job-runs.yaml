title: Job Runs
description: "Each job run — running and queued first, then the last day's — with what it has used so far."
category: Activity
loaders:
  job_runs:
    sql: |
      SELECT uri,
             uri('oxplow/page', 'page', 'job-run-output', 'job_run', id) AS output_ref,
             job,
             intent_key,
             state,
             outcome,
             actor_kind,
             attempt,
             rounds,
             tool_calls,
             input_tokens + output_tokens AS tokens,
             queued_at,
             id AS job_id
      FROM v_job_run
      WHERE state IN ('queued', 'running')
         OR COALESCE(finished_at, queued_at) >= strftime('%Y-%m-%dT%H:%M:%fZ', 'now', '-1 day')
      ORDER BY state NOT IN ('queued', 'running'), COALESCE(finished_at, started_at, queued_at) DESC
view:
  from: job_runs
  viz: table
  columns:
  - key: job
    label: Job
    link:
      kind: page
      from: output_ref
  - key: intent_key
    label: About
  - key: state
    label: State
  - key: outcome
    label: Outcome
  - key: actor_kind
    label: Actor
  - key: attempt
    label: Attempt
  - key: rounds
    label: Model rounds
  - key: tool_calls
    label: Tool calls
  - key: tokens
    label: Tokens
  - key: queued_at
    label: Queued
    format: datetime
  empty: No job has run in the last day.
  actions:
  - id: cancel
    label: Cancel
    command: oxplow.job_run.cancel
    input:
      job_run: '{{row.job_id}}'
    row: true
