title: New Item
description: "The form for a new item on the active work list - its title, description, starting state and the list's own fields."
icon: plus
needs:
- work_items
params:
- name: thread_id
- name: parent
loaders:
  new_task:
    sql: |
      SELECT 'todo' AS state, :parent AS parent_uri,
             (SELECT uri_param(t.uri, 'id') FROM v_thread t WHERE t.id = :thread_id) AS thread
  new_task_parents:
    sql: |
      SELECT w.uri AS value, w.title AS label
      FROM v_work_item w
      WHERE w.thread_id = :thread_id
        AND w.state NOT IN ('done', 'canceled')
        AND EXISTS (SELECT 1 FROM v_capability_provider p
                    WHERE p.capability = 'work_items' AND p.active = 1
                      AND json_extract(p.features, '$.hierarchy') = 1)
        AND EXISTS (SELECT 1 FROM v_work_item c WHERE c.parent_uri = w.uri)
      ORDER BY w.rank
  new_task_states:
    sql: |
      SELECT 'todo' AS value, 'To Do' AS label
      UNION ALL
      SELECT 'blocked', 'Blocked'
  new_task_threads:
    sql: |
      SELECT uri_param(t.uri, 'id') AS value, t.title AS label, s.title AS "group"
      FROM v_thread t
      JOIN v_stream s ON s.id = t.stream_id
      WHERE t.closed_at IS NULL AND t.archived_at IS NULL AND s.archived_at IS NULL
      ORDER BY s.kind <> 'primary', s.title, t.sort_index, t.id
view:
  from: new_task
  viz: form
  form:
    command: oxplow.work_item.new
    then: replace
    fields:
    - title
    - body
    - state
    - thread
    - parent_uri
    - name: native
      from: oxplow-bundled-todo/work-item-fields
    choices:
      state: oxplow-bundled-todo/new-task#new_task_states
      thread: oxplow-bundled-todo/new-task#new_task_threads
      parent_uri: oxplow-bundled-todo/new-task#new_task_parents
    again:
      label: Save and Another
      keep:
      - state
      - thread
      - parent_uri
      - native
