title: Usage
description: Where your attention and your agents' tokens went over the last 30 days.
category: Activity
loaders:
  token_total:
    sql: |
      SELECT sum(input_tokens + output_tokens + cache_creation_input_tokens + cache_read_input_tokens)
      FROM v_token_usage
  tokens_by_agent:
    sql: |
      SELECT agent_kind AS agent, coalesce(model, '—') AS model,
             sum(input_tokens + output_tokens + cache_creation_input_tokens + cache_read_input_tokens) AS tokens,
             count(*) AS turns
      FROM v_token_usage
      GROUP BY agent_kind, model
      ORDER BY tokens DESC
  tokens_by_day:
    sql: |
      SELECT substr(recorded_at, 1, 10) AS day,
             sum(input_tokens + output_tokens + cache_creation_input_tokens + cache_read_input_tokens) AS tokens
      FROM v_token_usage
      WHERE recorded_at >= strftime('%Y-%m-%dT%H:%M:%SZ', 'now', '-30 days')
      GROUP BY day
      ORDER BY day
  page_visits_by_day:
    sql: |
      SELECT substr(visited_at, 1, 10) AS day, count(*) AS visits
      FROM v_page_visit
      WHERE visited_at >= strftime('%Y-%m-%dT%H:%M:%SZ', 'now', '-30 days')
      GROUP BY day
      ORDER BY day
  top_pages:
    sql: |
      SELECT page_id, max(label) AS page, page_kind AS kind, count(*) AS visits
      FROM v_page_visit
      WHERE visited_at >= strftime('%Y-%m-%dT%H:%M:%SZ', 'now', '-30 days')
      GROUP BY page_id
      ORDER BY visits DESC
      LIMIT 20
view:
  grid:
  - id: token-total
    title: Agent Tokens
    from: token_total
    viz: number
  - id: tokens-by-agent
    title: Tokens by Agent
    from: tokens_by_agent
    viz: table
    columns:
    - key: agent
      label: Agent
    - key: model
      label: Model
    - key: tokens
      label: Tokens
    - key: turns
      label: Turns
    empty: No agent token usage recorded yet.
  - id: tokens-by-day
    title: Tokens per Day
    from: tokens_by_day
    viz: bar
    chart:
      x: day
      y: tokens
    empty: No tokens in the last 30 days.
  - id: page-visits-by-day
    title: Page Visits per Day
    from: page_visits_by_day
    viz: bar
    chart:
      x: day
      y: visits
    empty: No page visits in the last 30 days.
  - id: top-pages
    title: Most Visited Pages
    from: top_pages
    viz: table
    columns:
    - key: page
      label: Page
      link:
        kind: page
        from: page_id
    - key: kind
      label: Kind
    - key: visits
      label: Visits
    empty: No page visits in the last 30 days.
