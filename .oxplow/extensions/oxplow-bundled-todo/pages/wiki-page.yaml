title: Wiki Page
description: One wiki page, edited where it is read, with when it was last edited, whether the files it cites have drifted, and those files. The renderer of oxplow's `wiki` resource.
label: '{{param.slug}}'
for: oxplow/wiki
default: true
comments: true
params:
- name: uri
- name: slug
loaders:
  body:
    sql: |
      SELECT :slug AS slug, coalesce(b.body, '') AS body
      FROM (SELECT 1) LEFT JOIN v_knowledge_body b ON b.uri = uri('oxplow/wiki', 'slug', :slug)
  info:
    sql: |
      SELECT p.updated_at,
             CASE WHEN p.stale_ref_count = 0 THEN 'fresh'
                  WHEN p.stale_ref_count = (SELECT count(*) FROM v_knowledge_ref r WHERE r.page = p.uri) THEN 'very stale'
                  ELSE 'stale' END AS freshness,
             (SELECT count(*) FROM v_knowledge_ref r WHERE r.page = p.uri) AS cited_files,
             p.stale_ref_count AS stale_files
      FROM v_knowledge_page p WHERE p.slug = :slug
  refs:
    sql: |
      SELECT r.path, CASE WHEN r.stale THEN 'changed since this page was written' ELSE 'current' END AS status,
             CASE WHEN r.stale THEN 'warning' ELSE 'success' END AS tone
      FROM v_knowledge_ref r WHERE r.page = uri('oxplow/wiki', 'slug', :slug)
      ORDER BY r.path
  # What links here: the work items and commits that name it as [[slug]].
  backlinks:
    sql: |
      SELECT coalesce(w.title, c.subject, r.source_uri) AS title, r.source_uri AS uri,
             'Links to this page' AS description
      FROM v_page_ref r
      LEFT JOIN v_work_item w ON w.uri = r.source_uri
      LEFT JOIN v_commit c ON r.source_resource = 'oxplow/commit' AND c.sha = uri_param(r.source_uri, 'sha')
      WHERE r.target_uri = uri('oxplow/wiki', 'slug', :slug)
        AND r.ref_type IN ('wikilink', 'summary_wikilink')
      GROUP BY r.source_uri
      ORDER BY title LIMIT 10
view:
  stack:
  - id: body
    title: Page
    from: body
    viz: markdown
    markdown:
      text: body
    actions:
    - id: save
      label: Save
      command: oxplow.knowledge.write_page
      edit: true
      fixed:
      - slug
      input:
        slug: '{{row.slug}}'
        body: '{{row.body}}'
    - id: delete
      label: Delete Page
      command: oxplow.knowledge.delete_page
      input:
        slug: '{{param.slug}}'
  - id: info
    title: About this page
    from: info
    viz: detail
    columns:
    - key: updated_at
      label: Last edited
      format: datetime
    - key: freshness
      label: Freshness
    - key: cited_files
      label: Files it cites
    - key: stale_files
      label: Changed since
    empty: This page isn't written yet.
  - id: refs
    title: Referenced files
    from: refs
    viz: table
    columns:
    - key: path
      label: File
      link:
        kind: file
    - key: status
      label: Status
      tone: tone
      width: 230
    empty: This page cites no files.
    actions:
    - id: verify-all
      label: Mark all verified
      command: oxplow.knowledge.verify_files
      input:
        slug: '{{param.slug}}'
    - id: verify
      label: Mark verified
      command: oxplow.knowledge.verify_files
      input:
        slug: '{{param.slug}}'
        files:
        - '{{row.path}}'
      row: true
see_also:
  - { page: oxplow/wiki-index }
  - { from: backlinks }
