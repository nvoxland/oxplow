title: Merge Readiness
description: Which branches are ahead of the default branch and whether each would merge cleanly.
icon: git-branch
category: Git
needs:
- vcs
params:
- name: stream_id
loaders:
  row:
    sql: |
      SELECT s.branch AS branch FROM v_stream s WHERE s.id = :stream_id
    columns:
    - key: branch
  readiness:
    sql: |
      SELECT coalesce(s.title, d.head) AS stream, d.head AS other, d.base,
             '↑' || d.ahead || ' ↓' || d.behind AS apart,
             CASE d.readiness WHEN 'clean' THEN 'Clean to merge' WHEN 'conflict' THEN 'Will conflict' ELSE 'Integrated' END AS readiness,
             CASE d.readiness WHEN 'clean' THEN 'good' WHEN 'conflict' THEN 'warn' ELSE 'muted' END AS tone,
             CASE WHEN d.readiness = 'conflict'
                  THEN (SELECT group_concat(x.value, ', ') FROM (SELECT value FROM json_each(d.overlapping_files) LIMIT 8) x) END AS overlap,
             (d.readiness = 'clean' AND :branch = d.base) AS can_merge
      FROM v_branch_divergence d LEFT JOIN v_stream s ON s.branch = d.head AND s.archived_at IS NULL
      WHERE d.ahead > 0 AND d.head <> d.base
      ORDER BY d.head
    params:
      branch:
        from: row.branch
view:
  from: readiness
  viz: list
  columns:
  - key: stream
    label: Stream
  - key: other
    label: Branch
  - key: apart
    label: Apart
  - key: readiness
    label: Readiness
    tone: tone
    format: badge
  - key: overlap
    label: Both changed
  empty: Every branch is integrated with the default branch.
  actions:
  - id: merge
    label: Merge into the default branch
    command: oxplow.vcs.merge
    row: true
    when: can_merge
    input:
      stream: str{{param.stream_id}}
      rev: '{{row.other}}'
