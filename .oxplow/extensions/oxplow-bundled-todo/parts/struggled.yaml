title: Struggled Here
description: Files the agent edited over and over, and commands that kept failing. Likely places for mistakes.
params:
- name: request_id
  label: Request
loaders:
  struggled:
    sql: |
      SELECT subject, kind, count
      FROM v_oxplow_struggle
      WHERE request_id = :request_id
      ORDER BY count DESC
view:
  from: struggled
  viz: table
  columns:
  - key: subject
    label: Where
  - key: kind
    label: What
  - key: count
    label: Times
  empty: No signs of struggle in this request.
