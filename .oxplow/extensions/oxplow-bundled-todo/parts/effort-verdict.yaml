title: Effort Verdict
description: What a reviewer needs first about an effort — did it test, how much of the change the tests ran, and what's left to check. oxplow-bundled-todo's verdict on an effort's page; another review policy may replace it.
params:
- name: effort_id
  label: Effort
loaders:
  effort_verdict:
    sql: |
      WITH runs AS (
        SELECT seq,
               json_extract(payload_json, '$.passed') AS passed,
               json_extract(payload_json, '$.failed') AS failed
        FROM v_effort_observation
        WHERE effort_id = :effort_id AND kind = 'test-run'
      ),
      last_run AS (SELECT passed, failed FROM runs ORDER BY seq DESC LIMIT 1),
      facts AS (
        SELECT
          (SELECT count(*) FROM runs) AS runs,
          (SELECT passed FROM last_run) AS passed,
          (SELECT failed FROM last_run) AS failed,
          (SELECT metric_value FROM v_effort_observation
             WHERE effort_id = :effort_id AND kind = 'diff-coverage'
             ORDER BY seq DESC LIMIT 1) AS coverage,
          (SELECT warn_at FROM v_metric_spec WHERE key = 'oxplow.coverage.abs_pct') AS coverage_ok,
          (SELECT count(*) FROM v_oxplow_claim_status
             WHERE effort_id = :effort_id AND verified = 0) AS unverified,
          (SELECT count(*) FROM v_decision
             WHERE effort_id = :effort_id AND provenance = 'inferred') AS to_confirm,
          (SELECT count(*) FROM v_decision
             WHERE effort_id = :effort_id AND provenance <> 'inferred') AS decisions
      )
      SELECT text, tone FROM (
        SELECT 1 AS ord,
               CASE
                 WHEN runs = 0 THEN 'Tests: none ran'
                 WHEN coalesce(failed, 0) > 0
                   THEN 'Tests: the last run failed (' || failed || ' of ' || (coalesce(passed, 0) + failed) || ')'
                 ELSE CASE WHEN runs = 1 THEN 'Tests: the run passed'
                           ELSE 'Tests: the last of ' || runs || ' runs passed' END
                      || coalesce(' (' || passed || ')', '')
               END AS text,
               CASE WHEN runs = 0 OR coalesce(failed, 0) > 0 THEN 'warning' ELSE 'success' END AS tone
        FROM facts
        UNION ALL
        SELECT 2,
               CASE WHEN coverage IS NULL THEN 'Diff coverage: not measured'
                    ELSE 'Diff coverage: ' || CAST(round(coverage) AS INTEGER) || '%' END,
               CASE WHEN coverage IS NULL OR coverage_ok IS NULL THEN NULL
                    WHEN coverage < coverage_ok THEN 'warning' ELSE 'success' END
        FROM facts
        UNION ALL
        SELECT 3,
               CASE WHEN unverified = 0 THEN 'Every claim is backed'
                    ELSE unverified || ' unverified claim' || CASE unverified WHEN 1 THEN '' ELSE 's' END END,
               CASE WHEN unverified = 0 THEN 'success' ELSE 'warning' END
        FROM facts
        UNION ALL
        SELECT 4,
               CASE WHEN to_confirm > 0
                    THEN to_confirm || ' decision' || CASE to_confirm WHEN 1 THEN '' ELSE 's' END || ' to confirm'
                    ELSE decisions || ' decision' || CASE decisions WHEN 1 THEN '' ELSE 's' END || ' made' END,
               CASE WHEN to_confirm > 0 THEN 'warning' ELSE NULL END
        FROM facts
      )
      ORDER BY ord
view:
  from: effort_verdict
  viz: list
  columns:
  - key: text
    label: Verdict
    tone: tone
