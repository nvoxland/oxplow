title: Decisions Oxplow Noticed
description: "Forks the agent seems to have resolved without recording them, proposed by a model from the effort's conversation and tool calls. Guesses, not the agent's word."
params:
- name: effort_id
  label: Effort
- name: effort
  label: Effort id
loaders:
  inferred_decisions:
    sql: |
      SELECT question, choice,
             (SELECT group_concat(value, '; ') FROM json_each(alternatives)) AS alternatives,
             confidence, why, id AS decision
      FROM v_decision
      WHERE effort_id = :effort_id AND provenance = 'inferred'
      ORDER BY id
view:
  from: inferred_decisions
  viz: table
  columns:
  - key: question
    label: Decision
  - key: choice
    label: Chose
  - key: alternatives
    label: Over
  - key: confidence
    label: How Sure
  - key: why
    label: Why
  empty: Nothing inferred. The agent recorded its decisions or made none worth noting; or no model serves `oxplow/reasoning` (Settings → AI); or the extension is turned off.
  actions:
  - id: confirm
    label: Confirm
    command: oxplow.effort.confirm_decision
    input:
      decision: '{{row.decision}}'
    row: true
  - id: dismiss
    label: Dismiss
    command: oxplow.effort.dismiss_decision
    input:
      decision: '{{row.decision}}'
    row: true
actions:
- id: infer
  label: Infer Again
  command: oxplow.effort.infer_reasoning
  input:
    effort: '{{param.effort}}'
    again: true
  prominent: true
  icon: sparkles
