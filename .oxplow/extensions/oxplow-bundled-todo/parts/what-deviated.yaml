title: What Deviated
description: Files the request changed outside the area its task names. A file is in the area when the task's title or description names it, or names one of its directories at least two levels deep (`src/ui`). Silent when the task names no area.
params:
- name: request_id
  label: Request
loaders:
  what_deviated:
    sql: |
      SELECT path
      FROM v_oxplow_deviation
      WHERE request_id = :request_id
      ORDER BY path
view:
  from: what_deviated
  viz: table
  columns:
  - key: path
    label: File
    link:
      kind: file
  empty: Everything the request changed is in the area its task names (or the task names no area).
