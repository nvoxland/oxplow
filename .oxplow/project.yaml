agents:
- claude
- codex
- opencode
collection:
  testCommand: bun run test:collect
  reports:
  - path: target/coverage/lcov.info
    format: lcov
  - path: target/nextest/default/junit.xml
    format: junit
  - path: apps/desktop/test-report.xml
    format: junit
  - path: target/clippy.json
    format: clippy-json
  testRunPatterns:
  - cargo cov
  - llvm-cov
  - nextest
  - bun test
  - test:collect
  - test:junit
  analysisRunPatterns:
  - clippy --message-format=json
  - lint:collect
  agentHint: 'Run EVERY test invocation via `OXPLOW_TASK=<your task id> bun run test:collect` in the FOREGROUND — including red-phase/failing runs and quick single-test runs, not just the final green one. Never use bare `cargo test`/`bun test`/`bun run test` (or background it): only `test:collect` emits the lcov + JUnit reports oxplow parses into the effort''s Tests/coverage panel, so any other run won''t show there. The `OXPLOW_TASK=` prefix pins the run to your effort even with concurrent efforts; a backgrounded run finishes after the collection hook fires, so its reports are never ingested. Run it (foreground) before closing any task that changes logic.'
