agents:
- claude
- codex
- opencode
collection:
  testCommand: bun run test:collect
  reports:
  - path: target/coverage/lcov.info
    format: lcov
  - path: target/nextest/default/junit.xml
    format: junit
  - path: apps/desktop/test-report.xml
    format: junit
  - path: target/clippy.json
    format: clippy-json
  testRunPatterns:
  - cargo cov
  - llvm-cov
  - nextest
  - bun test
  - test:collect
  - test:junit
  analysisRunPatterns:
  - clippy --message-format=json
  agentHint: 'Run EVERY test invocation via `OXPLOW_TASK=<your task id> bun run test:collect` in the FOREGROUND — including red-phase/failing runs and quick single-test runs, not just the final green one. Never use bare `cargo test`/`bun test`/`bun run test` (or background it): only `test:collect` emits the lcov + JUnit reports oxplow parses into the effort''s Tests/coverage panel, so any other run won''t show there. The `OXPLOW_TASK=` prefix pins the run to your effort even with concurrent efforts; a backgrounded run finishes after the collection hook fires, so its reports are never ingested. Run it (foreground) before closing any task that changes logic.'
measures:
- key: repo.rust_clone
  subjectKind: file
  unit: count
  temporalSemantics: semi-additive
  captureScope: per-path
- key: repo.rust_allow
  subjectKind: file
  unit: count
  temporalSemantics: semi-additive
  captureScope: per-path
- key: repo.eslint_disable
  subjectKind: file
  unit: count
  temporalSemantics: semi-additive
  captureScope: per-path
- key: repo.react_use_effect
  subjectKind: file
  unit: count
  temporalSemantics: semi-additive
  captureScope: per-path
gauges:
# ONE CONCERN PER GAUGE — one ast_query pass over its file set, mirroring the
# bundled idiom gauges. A gauge must finish a FULL-TREE scan inside the 5s
# Starlark SandboxBudget; two broad queries in one gauge does not (tsk42), and a
# gauge that times out writes no capture, so its metric silently freezes.
# ast_query (native tree-sitter) rather than whole-file regex — regex only on
# small comment nodes.
- key: repo.scan_clone
  title: Rust .clone() scan
  trigger: on-snapshot
  emits: [repo.rust_clone]
  compute: { runtime: starlark, entryFile: oxplow/gauges/repo_clone.star }
- key: repo.scan_allow
  title: Rust #[allow] scan
  trigger: on-snapshot
  emits: [repo.rust_allow]
  compute: { runtime: starlark, entryFile: oxplow/gauges/repo_allow.star }
- key: repo.scan_use_effect
  title: React useEffect scan
  trigger: on-snapshot
  emits: [repo.react_use_effect]
  compute: { runtime: starlark, entryFile: oxplow/gauges/repo_use_effect.star }
- key: repo.scan_eslint
  title: ESLint suppression scan
  trigger: on-snapshot
  emits: [repo.eslint_disable]
  compute: { runtime: starlark, entryFile: oxplow/gauges/repo_eslint.star }
metrics:
- key: repo.rust_clone
  title: .clone() calls
  sourceMeasure: repo.rust_clone
  aggregation: sum
  direction: neutral
  unit: count
  displayKind: gauge
  category: static-quality
  language: rust
  description: ".clone() call sites — allocation/perf awareness."
- key: repo.rust_allow
  title: Rust lint suppressions
  sourceMeasure: repo.rust_allow
  aggregation: sum
  direction: lower-better
  unit: count
  displayKind: gauge
  category: static-quality
  language: rust
  description: "#[allow(...)] attributes — Rust lints being hidden."
- key: repo.eslint_disable
  title: ESLint suppressions
  sourceMeasure: repo.eslint_disable
  aggregation: sum
  direction: lower-better
  unit: count
  displayKind: gauge
  category: static-quality
  language: typescript
  description: "eslint-disable directives — TS/JS lints being hidden."
- key: repo.react_use_effect
  title: useEffect calls
  sourceMeasure: repo.react_use_effect
  aggregation: sum
  direction: neutral
  unit: count
  displayKind: gauge
  category: static-quality
  language: typescript
  description: "useEffect call sites — a re-render/complexity signal."
- use: oxplow.rust.unsafe_blocks
- use: oxplow.rust.unwrap_expect_calls
- use: oxplow.rust.panic_macros
- use: oxplow.ts.any_usage
- use: oxplow.ts.non_null_assertions
- use: oxplow.ts.console_calls
- use: oxplow.ts.ts_ignore
- use: oxplow.todos
- use: oxplow.fn_count
- use: oxplow.high_complexity_fns
- use: oxplow.long_functions
- use: oxplow.tests.failed
  target: 0.0
- use: oxplow.tests.duration_ms
- use: oxplow.tests.slowest_ms
- use: oxplow.tests.failed_at_close
  target: 0.0
- use: oxplow.tests.peak_failed
- use: oxplow.tests.distinct_failed
- use: oxplow.tests.red_runs
