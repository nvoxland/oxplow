agents:
- claude
- codex
- opencode
# Tints this checkout's app icon so an oxplow-on-oxplow window is tellable
# apart from the oxplow you're using to work on something else. macOS only.
iconTint: "#c2410c"
generated:
  exclude:
  # Tauri Specta rewrites this on nearly every build ("Do not edit this file
  # manually"), so it landed in 10 of 12 efforts' "changed but not claimed"
  # audit as noise. It is build output, not authored work.
  - apps/desktop/src/tauri-bridge/generated/bindings.ts
  # Another tool's scratch database.
  - .slopp
# Architectural zones for the Change-analysis surfaces (tsk251). Ordered:
# the FIRST rule whose glob matches a path wins, so role-by-filename rules
# (tests, docs) sit above the crate/app rules, and the `.toml` catch-all
# sits last. Oxplow ships no built-in table — this IS the vocabulary.
zones:
- match: ["**/Cargo.toml", "**/Cargo.lock", "**/package.json", "**/bun.lockb",
          "**/tauri.conf.json", "**/tsconfig.json"]
  zone: meta
  color: "#64748b"
# A test file inside a crate is a test, not that crate's zone.
- match: ["**/*_test.rs", "**/*.test.ts", "**/*.test.tsx", "**/*.spec.ts",
          "**/*.spec.tsx", "**/*_test.go", "**/tests/**", "**/__tests__/**"]
  zone: test
  color: "#22c55e"
- match: "**/migrations/**"
  zone: migration
  color: "#b91c1c"
- match: [".context/**", "**/*.md", "**/README"]
  zone: docs
  color: "#a3a3a3"
- match: apps/desktop/src-tauri/**
  zone: shell
  color: "#0ea5e9"
- match: apps/desktop/**
  zone: ui
  color: "#4f46e5"
- match: crates/oxplow-tauri-ipc/**
  zone: ipc
  color: "#06b6d4"
- match: crates/oxplow-domain/**
  zone: domain
  color: "#0891b2"
- match: crates/oxplow-db/**
  zone: store
  color: "#ea580c"
- match: crates/oxplow-git/**
  zone: git
  color: "#dc2626"
- match: ["crates/oxplow-lsp/**", "crates/oxplow-lsp-installer/**"]
  zone: lsp
  color: "#ca8a04"
- match: crates/oxplow-runtime/**
  zone: runtime
  color: "#9333ea"
- match: crates/oxplow-fs-watch/**
  zone: fs-watch
  color: "#a16207"
- match: ["crates/oxplow-tmux/**", "crates/oxplow-pty/**"]
  zone: terminal
  color: "#525252"
- match: crates/oxplow-mcp/**
  zone: mcp
  color: "#16a34a"
- match: crates/oxplow-app/**
  zone: app
  color: "#2563eb"
- match: crates/oxplow-config/**
  zone: config
  color: "#737373"
- match: crates/oxplow-session/**
  zone: session
  color: "#7c3aed"
- match: ["crates/oxplow-plugin/**", "crates/oxplow-control-plane/**"]
  zone: plugin
  color: "#c026d3"
- match: ["crates/oxplow-code-metrics/**", "crates/oxplow-code-dup/**",
          "crates/oxplow-code-deps/**", "crates/oxplow-tree-source/**"]
  zone: analysis
  color: "#0d9488"
# Config files outside a recognized crate/app (repo root, tooling).
- match: "**/*.toml"
  zone: meta
testing:
  command: bun run test:collect
  fastCommand: bun run test:fast
  runPatterns:
  - cargo cov
  - llvm-cov
  - nextest
  - bun test
  - test:collect
  - test:junit
  analysisPatterns:
  - clippy --message-format=json
  - lint:collect
  agentHint: 'While iterating (red phase, green phase, single tests) run `OXPLOW_TASK=<your task id> bun run test:fast` with a filter (e.g. `bun run test:fast -p oxplow-app some_test`) and `bun run test:fast:ts` for the frontend: they write the JUnit reports the effort''s Tests panel shows, without coverage instrumentation. Close a task that changes logic with one full run, lint alongside: `OXPLOW_TASK=<your task id> bash -c ''(bun run lint:collect >/dev/null 2>&1 & bun run test:collect; wait)''` — `test:collect` is the only run that emits coverage. Always in the FOREGROUND (a backgrounded run finishes after the collection hook fires, so its reports are never ingested). Never bare `cargo test`/`bun test`/`bun run test`: they emit no reports. The `OXPLOW_TASK=` prefix pins the run to your effort even with concurrent efforts.'
metrics:
- key: repo.rust_clone
  title: .clone() calls
  sourceMeasure: repo.rust_clone
  aggregation: sum
  unit: count
  direction: neutral
  displayKind: gauge
  category: static-quality
  language: rust
  description: .clone() call sites — allocation/perf awareness.
- key: repo.rust_allow
  title: Rust lint suppressions
  sourceMeasure: repo.rust_allow
  aggregation: sum
  unit: count
  direction: lower-better
  displayKind: gauge
  category: static-quality
  language: rust
  description: '#[allow(...)] attributes — Rust lints being hidden.'
- key: repo.eslint_disable
  title: ESLint suppressions
  sourceMeasure: repo.eslint_disable
  aggregation: sum
  unit: count
  direction: lower-better
  displayKind: gauge
  category: static-quality
  language: typescript
  description: eslint-disable directives — TS/JS lints being hidden.
- key: repo.react_use_effect
  title: useEffect calls
  sourceMeasure: repo.react_use_effect
  aggregation: sum
  unit: count
  direction: neutral
  displayKind: gauge
  category: static-quality
  language: typescript
  description: useEffect call sites — a re-render/complexity signal.
- key: repo.rust_shared_state
  title: Arc/Mutex/RwLock usages
  sourceMeasure: repo.rust_shared_state
  aggregation: sum
  unit: count
  direction: neutral
  displayKind: gauge
  category: static-quality
  language: rust
  description: Arc/Mutex/RwLock type usages — shared-state / concurrency-complexity signal.
- key: repo.rust_async_fn
  title: async fn count
  sourceMeasure: repo.rust_async_fn
  aggregation: sum
  unit: count
  direction: neutral
  displayKind: gauge
  category: static-quality
  language: rust
  description: '`async fn` definitions — async surface density.'
- key: repo.ts_as_cast
  title: as-cast assertions
  sourceMeasure: repo.ts_as_cast
  aggregation: sum
  unit: count
  direction: lower-better
  displayKind: gauge
  category: static-quality
  language: typescript
  description: '`x as T` type-assertion casts — a type-safety escape hatch.'
- key: repo.dangerous_html
  title: dangerouslySetInnerHTML
  sourceMeasure: repo.dangerous_html
  aggregation: sum
  unit: count
  direction: lower-better
  displayKind: gauge
  category: static-quality
  language: typescript
  description: dangerouslySetInnerHTML usages — XSS-injection surface.
- key: repo.skipped_tests
  title: Skipped / ignored tests
  sourceMeasure: repo.skipped_tests
  aggregation: sum
  unit: count
  direction: lower-better
  displayKind: gauge
  category: testing
  description: '`#[ignore]` (Rust) + `.skip`/`.todo` (TS test files) — hidden test debt.'
- key: repo.complexity_max
  title: Max cyclomatic complexity
  sourceMeasure: oxplow.complexity
  aggregation: max
  unit: count
  direction: lower-better
  displayKind: gauge
  category: static-quality
  description: The single most cyclomatically-complex function in the tree.
- key: repo.complexity_avg
  title: Avg cyclomatic complexity
  sourceMeasure: oxplow.complexity
  aggregation: avg
  unit: count
  direction: lower-better
  displayKind: gauge
  category: static-quality
  description: Mean cyclomatic complexity across all functions.
- key: repo.fn_length_max
  title: Longest function
  sourceMeasure: oxplow.fn_length
  aggregation: max
  unit: lines
  direction: lower-better
  displayKind: gauge
  category: static-quality
  description: Length (lines) of the longest function in the tree.
- key: repo.focused_tests
  title: Focused (.only) tests
  sourceMeasure: repo.focused_tests
  aggregation: sum
  unit: count
  direction: lower-better
  displayKind: gauge
  category: testing
  description: '`.only` focused tests — a committed one disables the rest of the suite.'
- key: repo.total_loc
  title: Total lines of code
  sourceMeasure: repo.file_loc
  aggregation: sum
  unit: lines
  direction: neutral
  displayKind: gauge
  category: static-quality
  description: Total lines across .rs/.ts/.tsx source files — a size trend.
- key: repo.max_file_loc
  title: Largest file
  sourceMeasure: repo.file_loc
  aggregation: max
  unit: lines
  direction: lower-better
  displayKind: gauge
  category: static-quality
  description: Line count of the largest source file (god-file / generated-blob detector).
- key: repo.ts_as_any
  title: as-any casts
  sourceMeasure: repo.ts_as_any
  aggregation: sum
  unit: count
  direction: lower-better
  displayKind: gauge
  category: static-quality
  language: typescript
  description: '`x as any` casts — silences all type-checking on the value.'
- key: repo.eval_usage
  title: eval() usage
  sourceMeasure: repo.eval_usage
  aggregation: sum
  unit: count
  direction: lower-better
  displayKind: gauge
  category: static-quality
  language: typescript
  description: '`eval(...)` calls — dynamic-code-execution / injection surface.'
- key: repo.parameter_count_max
  title: Most parameters
  sourceMeasure: oxplow.parameter_count
  aggregation: max
  unit: count
  direction: lower-better
  displayKind: gauge
  category: static-quality
  description: Largest parameter list of any function in the tree.
- key: repo.rust_dyn
  title: dyn dispatch usages
  sourceMeasure: repo.rust_dyn
  aggregation: sum
  unit: count
  direction: neutral
  displayKind: gauge
  category: static-quality
  language: rust
  description: '`dyn Trait` dynamic-dispatch usages — runtime-dispatch / indirection signal.'
- key: repo.total_imports
  title: Total imports
  sourceMeasure: repo.file_imports
  aggregation: sum
  unit: count
  direction: neutral
  displayKind: gauge
  category: static-quality
  language: typescript
  description: Total `import` statements across TS files — module-coupling trend.
- key: repo.max_file_imports
  title: Most imports in a file
  sourceMeasure: repo.file_imports
  aggregation: max
  unit: count
  direction: lower-better
  displayKind: gauge
  category: static-quality
  language: typescript
  description: Import count of the most-coupled TS file (fan-out hotspot).
- key: repo.innerhtml_assign
  title: innerHTML assignments
  sourceMeasure: repo.innerhtml_assign
  aggregation: sum
  unit: count
  direction: lower-better
  displayKind: gauge
  category: static-quality
  language: typescript
  description: '`x.innerHTML = …` assignments — XSS-injection surface.'
- key: repo.ts_hooks
  title: React hook calls
  sourceMeasure: repo.ts_hooks
  aggregation: sum
  unit: count
  direction: neutral
  displayKind: gauge
  category: static-quality
  language: typescript
  description: React hook call sites (useState/useEffect/useMemo/…) — re-render/complexity density.
- key: repo.hardcoded_secrets
  title: Hardcoded secrets
  sourceMeasure: repo.hardcoded_secrets
  aggregation: sum
  unit: count
  direction: lower-better
  displayKind: gauge
  category: static-quality
  description: String literals matching AWS/GitHub/Slack/PEM/Google secret shapes — should be 0.
- key: repo.hardcoded_colors
  title: Hardcoded colors
  sourceMeasure: repo.hardcoded_colors
  aggregation: sum
  unit: count
  direction: lower-better
  displayKind: gauge
  category: static-quality
  language: typescript
  description: Hex/rgb color literals in TS/TSX — should be a var(--…), see theming.md.
- key: repo.css_important
  title: '!important uses'
  sourceMeasure: repo.css_important
  aggregation: sum
  unit: count
  direction: lower-better
  displayKind: gauge
  category: static-quality
  description: '!important declarations — the specificity escape hatch (theming.md).'
- key: repo.inline_styles
  title: Inline style objects
  sourceMeasure: repo.inline_styles
  aggregation: sum
  unit: count
  direction: neutral
  displayKind: gauge
  category: static-quality
  language: typescript
  description: style={…} JSX attributes — inline-style density / migration pressure (theming.md).
- use: oxplow.rust.unsafe_blocks
- use: oxplow.rust.unwrap_expect_calls
- use: oxplow.rust.panic_macros
- use: oxplow.ts.any_usage
- use: oxplow.ts.non_null_assertions
