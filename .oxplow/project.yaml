agents:
- claude
- codex
- opencode
# Tints this checkout's app icon so an oxplow-on-oxplow window is tellable
# apart from the oxplow you're using to work on something else. macOS only.
iconTint: "#c2410c"
generated:
  exclude:
  # Tauri Specta rewrites this on nearly every build ("Do not edit this file
  # manually"), so it landed in 10 of 12 efforts' "changed but not claimed"
  # audit as noise. It is build output, not authored work.
  - apps/desktop/src/tauri-bridge/generated/bindings.ts
  # Another tool's scratch database.
  - .slopp
# Architectural zones for the Change-analysis surfaces (tsk251). Ordered:
# the FIRST rule whose glob matches a path wins, so role-by-filename rules
# (tests, docs) sit above the crate/app rules, and the `.toml` catch-all
# sits last. Oxplow ships no built-in table — this IS the vocabulary.
zones:
- match: ["**/Cargo.toml", "**/Cargo.lock", "**/package.json", "**/bun.lockb",
          "**/tauri.conf.json", "**/tsconfig.json"]
  zone: meta
  color: "#64748b"
# A test file inside a crate is a test, not that crate's zone.
- match: ["**/*_test.rs", "**/*.test.ts", "**/*.test.tsx", "**/*.spec.ts",
          "**/*.spec.tsx", "**/*_test.go", "**/tests/**", "**/__tests__/**"]
  zone: test
  color: "#22c55e"
- match: "**/migrations/**"
  zone: migration
  color: "#b91c1c"
- match: [".context/**", "**/*.md", "**/README"]
  zone: docs
  color: "#a3a3a3"
- match: apps/desktop/src-tauri/**
  zone: shell
  color: "#0ea5e9"
- match: apps/desktop/**
  zone: ui
  color: "#4f46e5"
- match: crates/oxplow-tauri-ipc/**
  zone: ipc
  color: "#06b6d4"
- match: crates/oxplow-domain/**
  zone: domain
  color: "#0891b2"
- match: crates/oxplow-db/**
  zone: store
  color: "#ea580c"
- match: crates/oxplow-git/**
  zone: git
  color: "#dc2626"
- match: ["crates/oxplow-lsp/**", "crates/oxplow-lsp-installer/**"]
  zone: lsp
  color: "#ca8a04"
- match: crates/oxplow-runtime/**
  zone: runtime
  color: "#9333ea"
- match: crates/oxplow-fs-watch/**
  zone: fs-watch
  color: "#a16207"
- match: ["crates/oxplow-tmux/**", "crates/oxplow-pty/**"]
  zone: terminal
  color: "#525252"
- match: crates/oxplow-mcp/**
  zone: mcp
  color: "#16a34a"
- match: crates/oxplow-app/**
  zone: app
  color: "#2563eb"
- match: crates/oxplow-config/**
  zone: config
  color: "#737373"
- match: crates/oxplow-session/**
  zone: session
  color: "#7c3aed"
- match: ["crates/oxplow-harnesses/**", "crates/oxplow-agent-text/**", "crates/oxplow-control-plane/**"]
  zone: agents
  color: "#c026d3"
- match: ["crates/oxplow-code-metrics/**", "crates/oxplow-code-dup/**",
          "crates/oxplow-code-deps/**", "crates/oxplow-tree-source/**"]
  zone: analysis
  color: "#0d9488"
# Config files outside a recognized crate/app (repo root, tooling).
- match: "**/*.toml"
  zone: meta
testing:
  command: bun run test:collect
  fastCommand: bun run test:fast
  runPatterns:
  - cargo cov
  - llvm-cov
  - nextest
  - bun test
  - test:collect
  - test:junit
  - test:ext
  - extension test
  analysisPatterns:
  - clippy --message-format=json
  - lint:collect
  agentHint: 'An edit under `extensions/` or `.oxplow/extensions/` is checked with `bun run test:ext [<name>]` (seconds, no compile: check, fixtures, page answers); a page''s behavior is tested by a fixture in its extension, not by a Rust test. While iterating on Rust (red phase, green phase, single tests) run `bun run test:fast` with a filter (e.g. `bun run test:fast -p oxplow-app some_test`) and `bun run test:fast:ts` for the frontend: they write the JUnit reports the effort''s Tests panel shows, without coverage instrumentation. When you want the full suite with coverage, lint can run alongside: `bash -c ''(bun run lint:collect >/dev/null 2>&1 & bun run test:collect; wait)''` — `test:collect` is the only run that emits coverage. Which tests to run, and when, is your call. Always in the FOREGROUND (a backgrounded run finishes after the collection hook fires, so its reports are never ingested). Never bare `cargo test`/`bun test`/`bun run test`: they emit no reports.'
metrics:
- use: oxplow.tests.failed
  target: 0.0
- use: oxplow.tests.duration_ms
- use: oxplow.tests.slowest_ms
- use: oxplow.tests.failed_at_close
  target: 0.0
- use: oxplow.tests.peak_failed
- use: oxplow.tests.distinct_failed
- use: oxplow.tests.red_runs
- use: oxplow.analysis.errors
  target: 10.0
extensions:
- oxplow-bundled
- project
# What hasn't moved into oxplow-bundled yet: kept here, off.
disableExtensions:
- oxplow-bundled-todo
# This repo works on oxplow's own extensions: their sources are the repo's.
extensionSources:
  oxplow-foundation: extensions/oxplow-foundation
  oxplow-bundled: extensions/oxplow-bundled
# And runs them from those sources, deployed like any extension, instead of
# the copies built into oxplow (a dev build only): editing foundation and
# deploying it takes effect without rebuilding oxplow. Set it to true in
# your own .oxplow/personal.yaml to run the built-in copies.
enableBundledExtensions: false
