gauges:
# ONE CONCERN PER GAUGE — one ast_query pass over its file set, mirroring the
# bundled idiom gauges. A gauge must finish a FULL-TREE scan inside the 5s
# Starlark SandboxBudget; two broad queries in one gauge does not (tsk42), and a
# gauge that times out writes no capture, so its metric silently freezes.
# ast_query (native tree-sitter) rather than whole-file regex — regex only on
# small comment nodes.
- key: repo.scan_clone
  title: Rust .clone() scan
  trigger: on-snapshot
  emits: [repo.rust_clone]
  compute: { runtime: starlark, entryFile: oxplow/gauges/repo_clone.star }
- key: repo.scan_allow
  title: Rust #[allow] scan
  trigger: on-snapshot
  emits: [repo.rust_allow]
  compute: { runtime: starlark, entryFile: oxplow/gauges/repo_allow.star }
- key: repo.scan_use_effect
