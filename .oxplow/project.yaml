# Tints this checkout's app icon so an oxplow-on-oxplow window is tellable
# apart from the oxplow you're using to work on something else. macOS only.
oxplow.iconTint: "#c2410c"
oxplow.generated.exclude:
# Tauri Specta rewrites this on nearly every build ("Do not edit this file
# manually"), so it landed in most requests' "changed but not reported"
# audit as noise. It is build output, not authored work.
- apps/desktop/src/tauri-bridge/generated/bindings.ts
# Another tool's scratch database.
- .slopp
oxplow.testing.command: bun run test:collect
oxplow.testing.fastCommand: bun run test:fast
oxplow.testing.runPatterns:
- cargo cov
- llvm-cov
- nextest
- bun test
- test:collect
- test:junit
- test:ext
- extension test
- playwright test
- bun run e2e
oxplow.testing.analysisPatterns:
- clippy --message-format=json
- lint:collect
oxplow.metrics:
- use: oxplow.tests.failed
  target: 0.0
- use: oxplow.tests.duration_ms
- use: oxplow.tests.slowest_ms
- use: oxplow.tests.failed_at_close
  target: 0.0
- use: oxplow.tests.peak_failed
- use: oxplow.tests.distinct_failed
- use: oxplow.tests.red_runs
- use: oxplow.analysis.errors
  target: 10.0
oxplow.extensions.project.enabled: true
# What hasn't moved into oxplow-bundled yet: kept here, off.
oxplow.extensions.oxplow-bundled-todo.enabled: false
# This project is Rust and TypeScript: their language packs.
oxplow.extensions.oxplow-rust.enabled: true
oxplow.extensions.oxplow-typescript.enabled: true
# Its extensions' collectors and commands are Starlark.
oxplow.extensions.oxplow-starlark.enabled: true
# This repo works on oxplow's own extensions: their sources are the repo's,
# and a dev build runs them from here.
oxplow.extensionSources:
  oxplow-foundation: extensions/oxplow-foundation
  oxplow-bundled: extensions/oxplow-bundled
  oxtask: extensions/oxtask
  oxwiki: extensions/oxwiki
  oxplow-rust: extensions/oxplow-rust
  oxplow-typescript: extensions/oxplow-typescript
  oxplow-python: extensions/oxplow-python
  oxplow-go: extensions/oxplow-go
  oxplow-java: extensions/oxplow-java
  oxplow-c: extensions/oxplow-c
  oxplow-csharp: extensions/oxplow-csharp
  oxplow-clojure: extensions/oxplow-clojure
  oxplow-starlark: extensions/oxplow-starlark
  oxplow-lua: extensions/oxplow-lua
  oxplow-ruby: extensions/oxplow-ruby
  oxplow-bash: extensions/oxplow-bash
  oxplow-zig: extensions/oxplow-zig
  oxplow-json: extensions/oxplow-json
  oxplow-yaml: extensions/oxplow-yaml
  oxplow-web: extensions/oxplow-web

# Agent-managed tasks are this repository’s workflow.
oxtask.tasks.workflow: agent_tracks
