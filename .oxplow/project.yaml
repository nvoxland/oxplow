- use: oxplow.long_functions
- use: oxplow.duplicate_lines
- use: oxplow.tests.failed
  target: 0.0
- use: oxplow.tests.duration_ms
- use: oxplow.tests.slowest_ms
- use: oxplow.tests.failed_at_close
  target: 0.0
- use: oxplow.tests.peak_failed
- use: oxplow.tests.distinct_failed
- use: oxplow.tests.red_runs
- use: oxplow.analysis.errors
  target: 10.0
- key: repo.type_coverage
  title: Type coverage
  sourceMeasure: repo.type_coverage
  aggregation: ratio
  unit: '%'
  direction: higher-better
  displayKind: coverage
  category: coverage
  language: typescript
  description: '% of TS expressions with a non-any type (the type-coverage tool).'
collectors:
- id: tests.rust_coverage
  doc: Coverage of the Rust workspace (cargo cov).
  records: coverage
  entry: "oxplow:lcov"
  report: { path: target/coverage/lcov.info }
  trigger: { on_run: test }
- id: tests.rust_junit
  doc: The Rust test cases (nextest JUnit).
  records: tests
  entry: "oxplow:junit"
  report: { path: target/nextest/default/junit.xml }
  trigger: { on_run: test }
- id: tests.desktop_junit
  doc: The desktop test cases (bun JUnit).
  records: tests
  entry: "oxplow:junit"
  report: { path: apps/desktop/test-report.xml }
  trigger: { on_run: test }
- id: lint.clippy
  doc: Clippy findings (lint:collect).
  records: analysis
  entry: "oxplow:clippy"
  report: { path: target/clippy.json }
  trigger: { on_run: analysis }
